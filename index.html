                                className={`flex-1 min-w-[100px] py-3.5 px-4 rounded-xl font-bold transition-all duration-300 border flex items-center justify-center gap-2 text-sm btn-interactive shadow-sm

                                        ? isAlert ? 'border-red-500 bg-red-500 text-white shadow-glow-red' : 'border-brand bg-brand text-white shadow-glow-brand'
                                        : 'border-slate-200 dark:border-white/10 bg-white/50 dark:bg-black/20 text-slate-500 hover:bg-white dark:hover:bg-white/10 hover:border-slate-300 dark:hover:border-white/20 hover:text-slate-700 dark:hover:text-slate-200'}`}
                            >
                                {isActive && <Icon name={isAlert ? "alert-triangle" : "check-circle"} size={16} />}
                                {displayLabel}
                            </button>
                        )
                    })}
                </div>
            );
        }

        function SectionHeader({ icon, title, colorClass }) {
            return (
                <div className="flex items-center gap-3 mb-6 pb-4 border-b border-slate-200/50 dark:border-white/5">
                    <div className={`p-3 rounded-2xl shadow-sm ${colorClass}`}><Icon name={icon} size={22}/></div>
                    <h3 className="text-xl md:text-2xl font-black text-slate-800 dark:text-white tracking-tight">{title}</h3>
                </div>
            );
        }

        function InputField({ label, type="text", value, onChange, placeholder, maxLength, required, numeric }) {
            return (
                <div className="flex flex-col gap-1.5 w-full">
                    <label className="text-xs font-bold text-slate-600 dark:text-slate-400 uppercase tracking-widest">{label} {required && <span className="text-red-500">*</span>}</label>
                    <input 
                        type={type} value={value} onChange={e => {
                            let val = e.target.value;
                            if (numeric) val = val.replace(/\D/g, '');
                            onChange(val);
                        }} 
                        placeholder={placeholder} maxLength={maxLength} required={required}
                        className={`w-full input-modern rounded-xl px-4 py-3.5 text-sm font-semibold shadow-sm ${numeric ? 'font-mono' : ''}`}
                    />
                </div>
            );
        }

        function PdpaModal({ onAccept, onAdminClick }) {
            const { t, isDarkMode } = useContext(AppContext);
            const [isChecked, setIsChecked] = useState(false);

            const handleDecline = () => Swal.fire({ 
                icon: 'warning', title: t('pdpa_decline'), text: t('pdpa_desc'), confirmButtonText: 'OK', confirmButtonColor: '#ff6600', 
                background: isDarkMode ? '#18181b' : '#fff', color: isDarkMode ? '#f8fafc' : '#0f172a', customClass: { popup: 'rounded-[2rem]' } 
            });

            const promptAdmin = () => {
                Swal.fire({
                    title: '<h3 class="text-2xl font-black text-slate-800 dark:text-white">Admin Access</h3>',
                    html: '<p class="text-sm text-slate-500 mb-4">เข้าสู่ระบบจัดการข้อมูลผู้ดูแล</p>',
                    input: 'password', inputAttributes: { autocapitalize: 'off', autocorrect: 'off' },
                    showCancelButton: true, confirmButtonText: 'Login', cancelButtonText: t('cancel'), confirmButtonColor: '#ff6600',
                    background: isDarkMode ? '#18181b' : '#ffffff', color: isDarkMode ? '#ffffff' : '#0f172a',
                    customClass: { popup: 'rounded-[2rem]', input: 'text-center font-mono text-xl tracking-[0.5em] rounded-xl bg-slate-50 dark:bg-black/20 border-slate-200 dark:border-white/10' }
                }).then((result) => {
                    if (result.isConfirmed) {
                        if (result.value === '000000') onAdminClick();
                        else Swal.fire({ icon: 'error', title: 'Error', text: 'Invalid Password', confirmButtonColor: '#ff6600', background: isDarkMode ? '#18181b' : '#ffffff', color: isDarkMode ? '#ffffff' : '#0f172a', customClass: { popup: 'rounded-[2rem]' } });
                    }
                });
            };

            return (
                <div className="fixed inset-0 z-[100] flex items-end sm:items-center justify-center sm:p-6 bg-slate-900/80 dark:bg-black/90 backdrop-blur-sm animate-fade-in">
                    <div className="bg-white dark:bg-zinc-900 w-full sm:max-w-3xl relative flex flex-col h-[92vh] sm:h-auto sm:max-h-[90vh] rounded-t-[2rem] sm:rounded-[2.5rem] shadow-[0_-10px_40px_rgba(0,0,0,0.2)] sm:shadow-[0_20px_60px_rgba(0,0,0,0.3)] animate-slide-up overflow-hidden">
                        <div className="absolute top-0 left-0 right-0 h-1.5 sm:h-2 brand-gradient z-20"></div>
                        <div className="absolute top-3 left-1/2 -translate-x-1/2 w-12 h-1.5 bg-slate-300 dark:bg-slate-600 rounded-full sm:hidden z-20"></div>

                        <button onClick={promptAdmin} className="absolute top-4 sm:top-5 right-4 sm:right-5 p-2.5 sm:p-3 text-slate-400 hover:text-brand bg-slate-50/50 dark:bg-black/20 hover:bg-slate-100 dark:hover:bg-white/10 backdrop-blur-md transition-all z-20 rounded-full shadow-sm hover:shadow-md border border-slate-200/50 dark:border-white/5" title="Admin Login">
                            <Icon name="lock" size={16} className="sm:w-[18px] sm:h-[18px]" />
                        </button>
                        
                        <div className="p-5 sm:p-8 pt-8 sm:pt-8 pb-4 sm:pb-5 bg-white dark:bg-zinc-900 border-b border-slate-100 dark:border-white/5 flex items-start gap-4 relative overflow-hidden shrink-0">
                            <div className="absolute -right-8 -top-8 opacity-[0.03] text-brand transform rotate-12 pointer-events-none"><Icon name="shield-check" size={120}/></div>
                            <div className="p-3 bg-brand/10 dark:bg-brand/20 rounded-2xl shrink-0 shadow-inner relative z-10 hidden sm:block"><Icon name="shield-check" size={32} className="text-brand" /></div>
                            <div className="relative z-10 w-full pr-8 sm:pr-0">
                                <div className="inline-flex items-center gap-1.5 px-2.5 py-1 bg-slate-100 dark:bg-white/10 text-slate-600 dark:text-slate-300 text-[10px] font-black tracking-widest uppercase rounded-lg mb-1.5 shadow-sm">
                                    <Icon name="shield" size={10} className="text-brand sm:hidden" /> Privacy Policy
                                </div>
                                <h2 className="text-xl sm:text-3xl font-black text-slate-800 dark:text-white leading-tight">{t('pdpa_policy')}</h2>
                                <p className="text-brand dark:text-brandLight text-xs sm:text-sm mt-1 font-semibold">{t('pdpa_subtitle')}</p>
                            </div>
                        </div>
                        
                        <div className="p-5 sm:p-8 overflow-y-auto custom-scrollbar flex-1 bg-slate-50/50 dark:bg-black/20">
                            <p className="text-slate-600 dark:text-slate-300 text-sm mb-5 leading-relaxed">{t('pdpa_desc')}</p>
                            <div className="grid grid-cols-1 sm:grid-cols-3 gap-3 sm:gap-4 mb-5 sm:mb-6">
                                <div className="bg-white dark:bg-zinc-800/80 p-4 sm:p-5 rounded-2xl border border-slate-200/60 dark:border-white/5 shadow-sm hover:shadow-md transition-all flex flex-row sm:flex-col items-center sm:items-start gap-4 sm:gap-0 text-left">
                                    <div className="w-10 h-10 sm:mb-3 bg-blue-50 dark:bg-blue-500/10 text-blue-600 rounded-xl flex items-center justify-center shrink-0"><Icon name="user" size={18}/></div>
                                    <div><h4 className="font-bold text-slate-800 dark:text-white text-sm sm:mb-1">{t('pdpa_card1_title')}</h4><p className="text-[11px] sm:text-xs text-slate-500 dark:text-slate-400 leading-snug">{t('pdpa_card1_desc')}</p></div>
                                </div>
                                <div className="bg-white dark:bg-zinc-800/80 p-4 sm:p-5 rounded-2xl border border-slate-200/60 dark:border-white/5 shadow-sm hover:shadow-md transition-all flex flex-row sm:flex-col items-center sm:items-start gap-4 sm:gap-0 text-left">
                                    <div className="w-10 h-10 sm:mb-3 bg-orange-50 dark:bg-orange-500/10 text-orange-600 rounded-xl flex items-center justify-center shrink-0"><Icon name="pizza" size={18}/></div>
                                    <div><h4 className="font-bold text-slate-800 dark:text-white text-sm sm:mb-1">{t('pdpa_card2_title')}</h4><p className="text-[11px] sm:text-xs text-slate-500 dark:text-slate-400 leading-snug">{t('pdpa_card2_desc')}</p></div>
                                </div>
                                <div className="bg-white dark:bg-zinc-800/80 p-4 sm:p-5 rounded-2xl border border-slate-200/60 dark:border-white/5 shadow-sm hover:shadow-md transition-all flex flex-row sm:flex-col items-center sm:items-start gap-4 sm:gap-0 text-left">
                                    <div className="w-10 h-10 sm:mb-3 bg-red-50 dark:bg-red-500/10 text-red-600 rounded-xl flex items-center justify-center shrink-0"><Icon name="heart-pulse" size={18}/></div>
                                    <div><h4 className="font-bold text-slate-800 dark:text-white text-sm sm:mb-1">{t('pdpa_card3_title')}</h4><p className="text-[11px] sm:text-xs text-slate-500 dark:text-slate-400 leading-snug">{t('pdpa_card3_desc')}</p></div>
                                </div>
                            </div>
                            <div className="bg-blue-50/80 dark:bg-blue-900/20 border border-blue-100 dark:border-blue-800/30 p-4 rounded-2xl flex items-start gap-3 shadow-sm">
                                <Icon name="shield-alert" className="text-blue-500 mt-0.5 shrink-0" size={16}/>
                                <div className="text-[11px] sm:text-xs text-blue-800 dark:text-blue-300 leading-relaxed"><span className="font-bold text-blue-900 dark:text-blue-200">{t('pdpa_security')}</span> {t('pdpa_security_desc')}</div>
                            </div>
                        </div>
                        
                        <div className="p-5 sm:p-8 border-t border-slate-100 dark:border-white/5 bg-white dark:bg-zinc-900 shrink-0 pb-6 sm:pb-8">
                            <label className="flex items-start sm:items-center gap-3 cursor-pointer group mb-5 w-full bg-slate-50 dark:bg-white/5 p-4 rounded-xl border border-slate-200 dark:border-white/10 hover:border-brand/50 transition-colors shadow-sm">
                                <input type="checkbox" checked={isChecked} onChange={e => setIsChecked(e.target.checked)} className="hidden" />
                                <div className={`w-5 h-5 sm:w-6 sm:h-6 rounded-md border-2 flex items-center justify-center transition-all shrink-0 mt-0.5 sm:mt-0 ${isChecked ? 'bg-brand border-brand shadow-sm' : 'border-slate-300 dark:border-slate-600 group-hover:border-brand'}`}>
                                    {isChecked && <Icon name="check" size={14} className="text-white"/>}
                                </div>
                                <span className="text-xs sm:text-sm font-bold text-slate-700 dark:text-slate-300 select-none leading-snug">{t('pdpa_checkbox')}</span>
                            </label>
                            <div className="flex flex-col sm:flex-row justify-end gap-3">
                                <button onClick={handleDecline} className="w-full sm:w-auto px-6 py-3.5 sm:py-3.5 rounded-xl bg-slate-100 dark:bg-white/5 text-slate-600 dark:text-slate-400 font-bold hover:bg-slate-200 dark:hover:bg-white/10 transition-colors btn-interactive text-sm">{t('pdpa_decline')}</button>
                                <button onClick={() => isChecked ? onAccept() : null} disabled={!isChecked}
                                    className={`w-full sm:w-auto px-8 py-3.5 sm:py-3.5 rounded-xl font-bold flex items-center justify-center gap-2 transition-all duration-300 btn-interactive text-sm
                                        ${isChecked ? 'brand-gradient text-white shadow-glow-brand hover:shadow-lg transform hover:-translate-y-0.5' : 'bg-slate-200 dark:bg-white/5 text-slate-400 dark:text-slate-600 border border-slate-300 dark:border-white/10 cursor-not-allowed'}`}>
                                    <Icon name="check-circle" size={16} className="sm:w-[18px] sm:h-[18px]" /> {t('pdpa_accept')}
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        function RegistrationForm({ onBack, onSuccess }) {
            const { t, lang, isDarkMode } = useContext(AppContext);
            const [formData, setFormData] = useState({
                FullName: '', StudentID: '', IDCard: '', Major: '', Religion: '', BloodGroup: '',
                StudentPhone: '', ParentPhone: '', FoodAllergy: '', SpecificDiet: 'ไม่มี', Disease: '', DrugAllergy: ''
            });
            const [hasFoodAllergy, setHasFoodAllergy] = useState(false);
            const [hasDisease, setHasDisease] = useState(false);
            const [hasDrugAllergy, setHasDrugAllergy] = useState(false);
            const [isSubmitting, setIsSubmitting] = useState(false);

            const handleSubmit = async (e) => {
                e.preventDefault();
                if (!formData.FullName || !formData.StudentID || !formData.Major || !formData.Religion || !formData.BloodGroup || !formData.StudentPhone || !formData.ParentPhone) {
                    Swal.fire({ icon: 'warning', title: 'Warning', text: 'Please fill in all required fields (*)', background: isDarkMode?'#18181b':'#fff', color: isDarkMode?'#f8fafc':'#0f172a' }); return;
                }
                if (formData.StudentID && formData.StudentID.length !== 9) {
                    Swal.fire({ icon: 'warning', title: 'Warning', text: 'Student ID must be 9 digits', background: isDarkMode?'#18181b':'#fff', color: isDarkMode?'#f8fafc':'#0f172a' }); return;
                }
                if (formData.StudentPhone.length !== 10 || formData.ParentPhone.length !== 10) {
                    Swal.fire({ icon: 'warning', title: 'Warning', text: 'Phone numbers must be 10 digits', background: isDarkMode?'#18181b':'#fff', color: isDarkMode?'#f8fafc':'#0f172a' }); return;
                }
                const finalData = {
                    ...formData,
                    FoodAllergy: hasFoodAllergy ? formData.FoodAllergy : 'ไม่แพ้',
                    Disease: hasDisease ? formData.Disease : 'ไม่มี',
                    DrugAllergy: hasDrugAllergy ? formData.DrugAllergy : 'ไม่แพ้'
                };
                setIsSubmitting(true);
                Swal.fire({ title: 'Loading...', allowOutsideClick: false, didOpen: () => Swal.showLoading(), background: isDarkMode?'#18181b':'#fff', color: isDarkMode?'#f8fafc':'#0f172a' });
                try {
                    const res = await submitToAPI('register', finalData);
                    if (res.success) { Swal.close(); onSuccess(); } 
                    else throw new Error(res.message || "Error saving data");
                } catch (err) {
                    Swal.fire({ icon: 'error', title: 'Error', text: err.message, background: isDarkMode?'#18181b':'#fff', color: isDarkMode?'#f8fafc':'#0f172a' });
                } finally { setIsSubmitting(false); }
            };

            return (
                <div className="max-w-4xl mx-auto animate-fade-in pb-10">
                    <button onClick={onBack} className="flex items-center gap-2 text-slate-500 hover:text-brand font-bold text-sm mb-6 transition-colors px-2"><Icon name="arrow-left" size={16} /> {t('back')}</button>
                    <form onSubmit={handleSubmit} className="space-y-6 md:space-y-8">
                        <div className="glass-panel p-6 md:p-8 rounded-[2.5rem] border border-slate-200/50 dark:border-white/5 shadow-soft">
                            <SectionHeader icon="user" title={t('form_personal_title')} colorClass="bg-blue-100 dark:bg-blue-500/20 text-blue-600" />
                            <div className="grid grid-cols-1 md:grid-cols-2 gap-5">
                                <InputField label={t('form_fullname')} value={formData.FullName} onChange={v => setFormData({...formData, FullName: v})} placeholder="John Doe" required />
                                <div className="flex flex-col gap-1.5">
                                    <label className="text-xs font-bold text-slate-600 dark:text-slate-400 uppercase tracking-widest">{t('form_major')} <span className="text-red-500">*</span></label>
                                    <div className="relative">
                                        <select value={formData.Major} onChange={e => setFormData({...formData, Major: e.target.value})} required className="w-full appearance-none input-modern rounded-xl pl-4 pr-10 py-3.5 text-sm font-semibold shadow-sm cursor-pointer bg-white/80 dark:bg-black/40">
                                            <option value="">{t('select_option')}</option>
                                            {MAJOR_LIST.map(m => <option key={m} value={m}>{lang === 'en' ? (DICT_MAPPING[m] || m) : m}</option>)}
                                        </select>
                                        <div className="absolute right-4 top-1/2 -translate-y-1/2 text-slate-400 pointer-events-none"><Icon name="chevron-down" size={16}/></div>
                                    </div>
                                </div>
                                <InputField label={t('form_studentid')} value={formData.StudentID} onChange={v => setFormData({...formData, StudentID: v})} placeholder="67xxxxxxx" numeric required maxLength="9" />
                                <InputField label={t('form_idcard')} value={formData.IDCard} onChange={v => setFormData({...formData, IDCard: v})} placeholder="13 digits or Passport" maxLength="20" />
                                <div className="flex flex-col gap-1.5">
                                    <label className="text-xs font-bold text-slate-600 dark:text-slate-400 uppercase tracking-widest">{t('form_religion')} <span className="text-red-500">*</span></label>
                                    <div className="relative">
                                        <select value={formData.Religion} onChange={e => setFormData({...formData, Religion: e.target.value})} required className="w-full appearance-none input-modern rounded-xl pl-4 pr-10 py-3.5 text-sm font-semibold shadow-sm cursor-pointer bg-white/80 dark:bg-black/40">
                                            <option value="">{t('select_option')}</option>
                                            {['พุทธ', 'อิสลาม', 'คริสต์', 'อื่นๆ'].map(r => <option key={r} value={r}>{lang === 'en' ? DICT_MAPPING[r] : r}</option>)}
                                        </select>
                                        <div className="absolute right-4 top-1/2 -translate-y-1/2 text-slate-400 pointer-events-none"><Icon name="chevron-down" size={16}/></div>
                                    </div>
                                </div>
                                <div className="flex flex-col gap-1.5">
                                    <label className="text-xs font-bold text-slate-600 dark:text-slate-400 uppercase tracking-widest">{t('form_blood')} <span className="text-red-500">*</span></label>
                                    <div className="relative">
                                        <select value={formData.BloodGroup} onChange={e => setFormData({...formData, BloodGroup: e.target.value})} required className="w-full appearance-none input-modern rounded-xl pl-4 pr-10 py-3.5 text-sm font-semibold shadow-sm cursor-pointer bg-white/80 dark:bg-black/40">
                                            <option value="">{t('select_option')}</option>
                                            <option value="A">A</option><option value="B">B</option><option value="O">O</option><option value="AB">AB</option>
                                        </select>
                                        <div className="absolute right-4 top-1/2 -translate-y-1/2 text-slate-400 pointer-events-none"><Icon name="chevron-down" size={16}/></div>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div className="glass-panel p-6 md:p-8 rounded-[2.5rem] border-t-[8px] border-t-emerald-500 border border-slate-200/50 dark:border-white/5 shadow-soft">
                            <SectionHeader icon="phone" title={t('form_contact_title')} colorClass="bg-emerald-100 dark:bg-emerald-500/20 text-emerald-600" />
                            <div className="grid grid-cols-1 md:grid-cols-2 gap-5">
                                <InputField label={t('form_student_phone')} value={formData.StudentPhone} onChange={v => setFormData({...formData, StudentPhone: v})} placeholder="08xxxxxxxx" numeric required maxLength="10" />
                                <InputField label={t('form_parent_phone')} value={formData.ParentPhone} onChange={v => setFormData({...formData, ParentPhone: v})} placeholder="08xxxxxxxx" numeric required maxLength="10" />
                            </div>
                        </div>

                        <div className="glass-panel p-6 md:p-8 rounded-[2.5rem] border-t-[8px] border-t-orange-500 border border-slate-200/50 dark:border-white/5 shadow-soft">
                            <SectionHeader icon="pizza" title={t('form_nutrition_title')} colorClass="bg-orange-100 dark:bg-orange-500/20 text-orange-600" />
                            <div className="space-y-6">
                                <div>
                                    <label className="text-sm font-bold text-slate-700 dark:text-slate-300 mb-3 block">{t('form_diet')} <span className="text-red-500">*</span></label>
                                    <TogglePill options={[{label: 'ไม่มี', value: 'ไม่มี'}, {label: 'ฮาลาล', value: 'ฮาลาล'}, {label: 'มังสวิรัติ', value: 'มังสวิรัติ'}, {label: 'เจ', value: 'เจ'}]} value={formData.SpecificDiet} onChange={v => setFormData({...formData, SpecificDiet: v})} isWarningType={true} />
                                </div>
                                <div className="p-5 bg-orange-50 dark:bg-orange-950/20 border border-orange-100 dark:border-orange-900/30 rounded-2xl">
                                    <label className="text-sm font-bold text-slate-700 dark:text-slate-300 mb-3 block">{t('form_food_allergy')} <span className="text-red-500">*</span></label>
                                    <div className="flex gap-4 mb-4">
                                        <label className="flex items-center gap-2 cursor-pointer text-sm font-semibold"><input type="radio" name="foodAllergy" checked={!hasFoodAllergy} onChange={() => setHasFoodAllergy(false)} className="w-4 h-4 text-brand accent-brand" /> {t('form_no_allergy')}</label>
                                        <label className="flex items-center gap-2 cursor-pointer text-sm font-semibold text-orange-600 dark:text-orange-400"><input type="radio" name="foodAllergy" checked={hasFoodAllergy} onChange={() => setHasFoodAllergy(true)} className="w-4 h-4 text-brand accent-brand" /> {t('form_has_allergy')}</label>
                                    </div>
                                    {hasFoodAllergy && <div className="animate-slide-up"><InputField label={t('form_specify_food')} value={formData.FoodAllergy} onChange={v => setFormData({...formData, FoodAllergy: v})} placeholder="e.g. Seafood, Nuts" required={hasFoodAllergy} /></div>}
                                </div>
                            </div>
                        </div>

                        <div className="glass-panel p-6 md:p-8 rounded-[2.5rem] border-t-[8px] border-t-red-500 border border-slate-200/50 dark:border-white/5 shadow-soft">
                            <SectionHeader icon="heart-pulse" title={t('form_health_title')} colorClass="bg-red-100 dark:bg-red-500/20 text-red-600" />
                            <div className="space-y-6">
                                <div className="p-5 bg-red-50/50 dark:bg-red-950/20 border border-red-100 dark:border-red-900/30 rounded-2xl">
                                    <label className="text-sm font-bold text-slate-700 dark:text-slate-300 mb-3 block">{t('form_disease')} <span className="text-red-500">*</span></label>
                                    <div className="flex gap-4 mb-4">
                                        <label className="flex items-center gap-2 cursor-pointer text-sm font-semibold"><input type="radio" name="disease" checked={!hasDisease} onChange={() => setHasDisease(false)} className="w-4 h-4 accent-red-500" /> {t('form_no_disease')}</label>
                                        <label className="flex items-center gap-2 cursor-pointer text-sm font-semibold text-red-600 dark:text-red-400"><input type="radio" name="disease" checked={hasDisease} onChange={() => setHasDisease(true)} className="w-4 h-4 accent-red-500" /> {t('form_has_disease')}</label>
                                    </div>
                                    {hasDisease && <div className="animate-slide-up"><InputField label={t('form_specify_disease')} value={formData.Disease} onChange={v => setFormData({...formData, Disease: v})} placeholder="e.g. Asthma, Allergies" required={hasDisease} /></div>}
                                </div>
                                <div className="p-5 bg-pink-50/50 dark:bg-pink-950/20 border border-pink-100 dark:border-pink-900/30 rounded-2xl">
                                    <label className="text-sm font-bold text-slate-700 dark:text-slate-300 mb-3 block">{t('form_drug_allergy')} <span className="text-red-500">*</span></label>
                                    <div className="flex gap-4 mb-4">
                                        <label className="flex items-center gap-2 cursor-pointer text-sm font-semibold"><input type="radio" name="drugAllergy" checked={!hasDrugAllergy} onChange={() => setHasDrugAllergy(false)} className="w-4 h-4 accent-pink-500" /> {t('form_no_drug_allergy')}</label>
                                        <label className="flex items-center gap-2 cursor-pointer text-sm font-semibold text-pink-600 dark:text-pink-400"><input type="radio" name="drugAllergy" checked={hasDrugAllergy} onChange={() => setHasDrugAllergy(true)} className="w-4 h-4 accent-pink-500" /> {t('form_has_drug_allergy')}</label>
                                    </div>
                                    {hasDrugAllergy && <div className="animate-slide-up"><InputField label={t('form_specify_drug')} value={formData.DrugAllergy} onChange={v => setFormData({...formData, DrugAllergy: v})} placeholder="e.g. Penicillin" required={hasDrugAllergy} /></div>}
                                </div>
                            </div>
                        </div>

                        <div className="pt-4 flex justify-center">
                            <button type="submit" disabled={isSubmitting} className="w-full md:w-auto min-w-[280px] py-4 px-8 brand-gradient text-white rounded-2xl font-black text-lg shadow-glow-brand hover:shadow-lg transform hover:-translate-y-1 transition-all btn-interactive flex items-center justify-center gap-2">
                                {isSubmitting ? <Icon name="loader-2" className="animate-spin" /> : <Icon name="save" />} {t('form_submit')}
                            </button>
                        </div>
                    </form>
                </div>
            );
        }

        function SuccessView({ onHome }) {
            const { t } = useContext(AppContext);
            return (
                <div className="flex items-center justify-center min-h-[80vh] p-4 animate-fade-in">
                    <div className="glass-panel p-8 md:p-12 rounded-[3rem] text-center max-w-md w-full animate-slide-up shadow-2xl border-t-8 border-t-emerald-500">
                        <div className="w-24 h-24 bg-emerald-100 dark:bg-emerald-500/20 text-emerald-500 rounded-full flex items-center justify-center mx-auto mb-6 shadow-inner relative">
                            <Icon name="check-circle" size={48} className="relative z-10" />
                            <div className="absolute inset-0 bg-emerald-400 rounded-full blur-xl opacity-30 animate-pulse"></div>
                        </div>
                        <h2 className="text-3xl font-black text-slate-800 dark:text-white mb-3 tracking-tight">{t('success_title')}</h2>
                        <p className="text-slate-500 dark:text-slate-400 font-medium mb-8 leading-relaxed">{t('success_desc')}</p>
                        <button onClick={onHome} className="w-full py-4 bg-slate-100 dark:bg-white/10 text-slate-800 dark:text-white rounded-xl font-bold hover:bg-slate-200 dark:hover:bg-white/20 transition-colors shadow-sm flex justify-center items-center gap-2 btn-interactive">
                            <Icon name="home" size={18} /> {t('success_home')}
                        </button>
                    </div>
                </div>
            );
        }

        // ==========================================
        // 📊 Admin Dashboard Component
        // ==========================================
        function AdminDashboard({ goBack }) {
            const { t, lang, isDarkMode } = useContext(AppContext);
            const [data, setData] = useState([]);
            const [loading, setLoading] = useState(true);
            const [selectedMajor, setSelectedMajor] = useState(null);
            const [selectedSurveillanceStudent, setSelectedSurveillanceStudent] = useState(null);
            const [editItem, setEditItem] = useState(null);
            const [activeTab, setActiveTab] = useState('overview');
            const [drilldownData, setDrilldownData] = useState({ title: '', list: [], type: '' });
            const [currentPage, setCurrentPage] = useState(1);
            const [searchTerm, setSearchTerm] = useState('');
            const [executiveMajor, setExecutiveMajor] = useState('ทั้งหมด');

            const loadData = (isSilent = false) => {
                if (!isSilent) setLoading(true);
                Papa.parse(`${SHEET_CSV_URL}&_cb=${new Date().getTime()}`, {
                    download: true, header: true,
                    complete: (res) => {
                        setData(res.data.filter(row => row.StudentID).map(r => ({ ...r, Major: cleanMajor(r.Major) })));
                        if (!isSilent) setLoading(false);
                    },
                    error: () => { 
                        if (!isSilent) Swal.fire('Error', 'Database Connection Failed', 'warning'); 
                        if (!isSilent) setLoading(false); 
                    }
                });
            };

            useEffect(() => { 
                loadData();
                const intervalId = setInterval(() => { loadData(true); }, 1000);
                return () => clearInterval(intervalId);
            }, []);

            const executiveBaseMajors = useMemo(() => {
                const mSet = new Set();
                data.forEach(r => { if(r.Major) mSet.add(r.Major.replace(/\s*\(เทียบโอน\)/g, '').trim()); });
                return Array.from(mSet).sort();
            }, [data]);

            const filteredData = useMemo(() => {
                let result = data;
                if (searchTerm) {
                    const s = searchTerm.toLowerCase();
                    result = result.filter(r => 
                        (r.FullName || '').toLowerCase().includes(s) || (r.StudentID || '').toLowerCase().includes(s) ||
                        (r.Major || '').toLowerCase().includes(s) || (r.StudentPhone || '').includes(s) || (r.ParentPhone || '').includes(s)
                    );
                }
                if (activeTab === 'executive' && executiveMajor !== 'ทั้งหมด') {
                    result = result.filter(r => {
                        const baseMajor = r.Major ? r.Major.replace(/\s*\(เทียบโอน\)/g, '').trim() : '';
                        return baseMajor === executiveMajor;
                    });
                }
                return result;
            }, [data, searchTerm, activeTab, executiveMajor]);

            const stats = useMemo(() => {
                let total = filteredData.length, normalCount = 0, transferCount = 0, foodAlert = 0, healthAlert = 0;
                let majorCount = {}, dietStats = { 'ฮาลาล': 0, 'มังสวิรัติ': 0, 'เจ': 0, 'อาหารปกติ': 0 }, foodAllergies = [], diseases = [], drugAllergies = [];
                const surveillanceList = [];
                let surveillanceRiskPie = { 'ด้านการแพทย์': 0, 'ด้านโภชนาการ': 0, 'ความเสี่ยงซ้อน (ทั้งสอง)': 0 };
                
                // For executive report detailed major breakdown
                let breakdownByMajor = {};

                filteredData.forEach(s => {
                    if(s.Major) {
                        majorCount[s.Major] = (majorCount[s.Major] || 0) + 1;
                        const isTransfer = s.Major.includes("เทียบโอน");
                        isTransfer ? transferCount++ : normalCount++;
                        
                        const baseMajor = s.Major.replace(/\s*\(เทียบโอน\)/g, '').trim();
                        if(!breakdownByMajor[baseMajor]) breakdownByMajor[baseMajor] = { normal: 0, transfer: 0, total: 0 };
                        isTransfer ? breakdownByMajor[baseMajor].transfer++ : breakdownByMajor[baseMajor].normal++;
                        breakdownByMajor[baseMajor].total++;
                    }
                    let hasF = s.FoodAllergy !== 'ไม่แพ้' || s.SpecificDiet !== 'ไม่มี';
                    let hasH = s.Disease !== 'ไม่มี' || s.DrugAllergy !== 'ไม่แพ้';
                    if (hasF) foodAlert++; if (hasH) healthAlert++;

                    if (s.FoodAllergy && s.FoodAllergy !== 'ไม่แพ้') foodAllergies.push(s);
                    if (s.SpecificDiet) {
                        if (s.SpecificDiet === 'ไม่มี') dietStats['อาหารปกติ']++;
                        else if (s.SpecificDiet.includes('ฮาลาล')) dietStats['ฮาลาล']++;
                        else if (s.SpecificDiet.includes('มังสวิรัติ')) dietStats['มังสวิรัติ']++;
                        else if (s.SpecificDiet.includes('เจ')) dietStats['เจ']++;
                    }
                    if (s.Disease && s.Disease !== 'ไม่มี') diseases.push(s);
                    if (s.DrugAllergy && s.DrugAllergy !== 'ไม่แพ้') drugAllergies.push(s);

                    if (hasF || hasH) {
                        let issues = [];
                        if (s.FoodAllergy !== 'ไม่แพ้') issues.push({ type: 'food', text: `${t('form_food_allergy')}: ${s.FoodAllergy}` });
                        if (s.SpecificDiet !== 'ไม่มี') issues.push({ type: 'food', text: `${lang==='en'?'Diet':'อาหาร'}: ${s.SpecificDiet}` });
                        if (s.Disease !== 'ไม่มี') issues.push({ type: 'health', text: `${t('form_disease')}: ${s.Disease}` });
                        if (s.DrugAllergy !== 'ไม่แพ้') issues.push({ type: 'health', text: `${t('form_drug_allergy')}: ${s.DrugAllergy}` });
                        surveillanceList.push({ ...s, issues });

                        if (hasF && hasH) surveillanceRiskPie['ความเสี่ยงซ้อน (ทั้งสอง)']++;
                        else if (hasF) surveillanceRiskPie['ด้านโภชนาการ']++;
                        else if (hasH) surveillanceRiskPie['ด้านการแพทย์']++;
                    }
                });

                const surveillancePieData = Object.keys(surveillanceRiskPie).map(k => ({name: k, value: surveillanceRiskPie[k]})).filter(d => d.value > 0);
                const pieDataList = Object.keys(majorCount).map(k=>({name:k, value:majorCount[k]}));
                
                const execBreakdownList = Object.keys(breakdownByMajor).map(k => ({
                    name: k,
                    normal: breakdownByMajor[k].normal,
                    transfer: breakdownByMajor[k].transfer,
                    total: breakdownByMajor[k].total
                })).sort((a,b) => b.total - a.total);

                return { total, pieData: pieDataList, COLORS: ['#ff6600', '#3b82f6', '#10b981', '#8b5cf6', '#ec4899', '#facc15', '#06b6d4'], foodAlert, healthAlert, surveillanceList, surveillancePieData, normalCount, transferCount, dietStats, foodAllergies, diseases, drugAllergies, execBreakdownList };
            }, [filteredData, lang]);

            const handleDrilldown = (title, type, key) => {
                let filtered = [];
                if (type === 'religion_diet') filtered = filteredData.filter(s => s.SpecificDiet && s.SpecificDiet.includes(key));
                else if (type === 'food_allergy') filtered = filteredData.filter(s => s.FoodAllergy && s.FoodAllergy !== 'ไม่แพ้');
                else if (type === 'food_alert') filtered = filteredData.filter(s => (s.FoodAllergy && s.FoodAllergy !== 'ไม่แพ้') || (s.SpecificDiet && s.SpecificDiet !== 'ไม่มี'));
                else if (type === 'health_alert') filtered = filteredData.filter(s => (s.Disease && s.Disease !== 'ไม่มี') || (s.DrugAllergy && s.DrugAllergy !== 'ไม่แพ้'));
                else if (type === 'disease') filtered = filteredData.filter(s => s.Disease && s.Disease !== 'ไม่มี');
                else if (type === 'drug_allergy') filtered = filteredData.filter(s => s.DrugAllergy && s.DrugAllergy !== 'ไม่แพ้');
                else if (type === 'demographics') {
                    if (key === 'normal') filtered = filteredData.filter(s => s.Major && !s.Major.includes('เทียบโอน'));
                    else if (key === 'transfer') filtered = filteredData.filter(s => s.Major && s.Major.includes('เทียบโอน'));
                }
                else if (type === 'major_breakdown') {
                    if (key.type === 'normal') filtered = filteredData.filter(s => s.Major && s.Major.includes(key.major) && !s.Major.includes('เทียบโอน'));
                    else if (key.type === 'transfer') filtered = filteredData.filter(s => s.Major && s.Major.includes(key.major) && s.Major.includes('เทียบโอน'));
                    else filtered = filteredData.filter(s => s.Major && s.Major.includes(key.major));
                }
                setDrilldownData({ title, type, list: filtered });
            };

            const handleSaveEdit = (e) => {
                e.preventDefault();
                if (editItem.StudentID && editItem.StudentID.length !== 9) {
                    Swal.fire({ icon: 'warning', title: 'Warning', text: 'Student ID must be 9 digits', confirmButtonColor: '#ff6600', background: isDarkMode?'#18181b':'#fff', color: isDarkMode?'#f8fafc':'#0f172a' }); return;
                }
                if (editItem.StudentPhone.length !== 10 || editItem.ParentPhone.length !== 10) {
                    Swal.fire({ icon: 'warning', title: 'Warning', text: 'Phone numbers must be 10 digits', confirmButtonColor: '#ff6600', background: isDarkMode?'#18181b':'#fff', color: isDarkMode?'#f8fafc':'#0f172a' }); return;
                }
                Swal.fire({ title: 'Loading...', didOpen: () => Swal.showLoading(), background: isDarkMode?'#18181b':'#fff' });
                submitToAPI('update', { oldStudentID: editItem.oldStudentID, newData: editItem }).then(res => { if(res.success) { Swal.fire({ icon:'success', title:'Success', timer:1500, showConfirmButton:false, background: isDarkMode?'#18181b':'#fff' }); setEditItem(null); loadData(); } }).catch(err => Swal.fire('Error', err.message, 'error'));
            };

            const exportExcel = () => {
                if (filteredData.length === 0) return;
                const exportData = filteredData.map(r => ({ 'วันที่': r.Timestamp||'', 'รหัสนักศึกษา': r.StudentID||'', 'ชื่อ-นามสกุล': r.FullName||'', 'สาขาวิชา': r.Major||'', 'ศาสนา': r.Religion||'', 'กรุ๊ปเลือด': r.BloodGroup||'', 'เบอร์ นศ.': r.StudentPhone||'', 'เบอร์ ผปค.': r.ParentPhone||'', 'แพ้อาหาร': r.FoodAllergy||'', 'อาหารเฉพาะ': r.SpecificDiet||'', 'โรคประจำตัว': r.Disease||'', 'แพ้ยา': r.DrugAllergy||'' }));
                const ws = window.XLSX.utils.json_to_sheet(exportData);
                const wb = window.XLSX.utils.book_new(); window.XLSX.utils.book_append_sheet(wb, ws, "Students");
                window.XLSX.writeFile(wb, `DIGIT_Export_${new Date().toISOString().slice(0,10)}.xlsx`);
            };

            const exportMajorsSummary = () => {
                if (stats.pieData.length === 0) return;
                const exportData = stats.pieData.sort((a,b) => b.value - a.value).map(item => ({
                    'สาขาวิชา': lang === 'en' ? (DICT_MAPPING[item.name] || item.name) : item.name,
                    'จำนวน (คน)': item.value,
                    'สัดส่วน (%)': ((item.value / stats.total) * 100).toFixed(2) + '%'
                }));
                exportData.push({ 'สาขาวิชา': lang === 'en' ? 'Total' : 'รวมทั้งหมด', 'จำนวน (คน)': stats.total, 'สัดส่วน (%)': '100.00%' });
                const ws = window.XLSX.utils.json_to_sheet(exportData);
                ws['!cols'] = [{wch: 40}, {wch: 15}, {wch: 15}];
                const wb = window.XLSX.utils.book_new(); window.XLSX.utils.book_append_sheet(wb, ws, "Majors_Summary");
                window.XLSX.writeFile(wb, `DIGIT69_Summary_${new Date().toISOString().slice(0,10)}.xlsx`);
            };

            if (loading) return (
                <div className="flex flex-col justify-center items-center h-[70vh]">
                    <div className="p-4 bg-brand/10 rounded-2xl mb-4 shadow-glow-brand"><Icon name="loader-2" size={40} className="text-brand animate-spin" /></div>
                    <p className="text-slate-500 font-bold tracking-widest uppercase text-sm">Loading Database...</p>
                </div>
            );

            const TABS = [
                { id: 'overview', icon: 'users', label: t('admin_tab_overview') },
                { id: 'majors', icon: 'pie-chart', label: t('admin_tab_majors') },
                { id: 'health_diet', icon: 'activity', label: t('admin_tab_health') },
                { id: 'surveillance', icon: 'shield-alert', label: t('admin_tab_surveillance') },
                { id: 'executive', icon: 'layout-dashboard', label: t('admin_tab_executive') }
            ];

            return (
                <div className="flex flex-col md:flex-row gap-6 animate-fade-in pb-20 items-start w-full">
                    {/* Admin Sidebar */}
                    <div id="admin-sidebar" className="w-full md:w-64 glass-panel p-5 rounded-[2rem] flex flex-col md:sticky md:top-24 z-20 shrink-0 no-print border border-slate-200/50 dark:border-white/5 shadow-soft">
                        <div className="flex items-center gap-4 mb-8 px-2 pt-2">
                            <div className="w-12 h-12 bg-slate-900 dark:bg-white rounded-[1rem] flex items-center justify-center text-white dark:text-black shadow-lg"><Icon name="command" size={24}/></div>
                            <div>
                                <p className="text-[10px] text-brand font-black tracking-widest uppercase">Admin Portal</p>
                                <h3 className="font-black text-slate-800 dark:text-white leading-none text-lg mt-0.5">{t('admin_dashboard')}</h3>
                            </div>
                        </div>
                        <div className="flex flex-row md:flex-col overflow-x-auto hide-scrollbar gap-2 pb-2 md:pb-0">
                            {TABS.map(tab => (
                                <button key={tab.id} onClick={() => { setActiveTab(tab.id); setCurrentPage(1); }} 
                                    className={`flex items-center gap-3 px-4 py-3.5 rounded-xl transition-all font-bold whitespace-nowrap btn-interactive text-sm
                                    ${activeTab === tab.id ? 'bg-brand text-white shadow-glow-brand hover:-translate-y-0.5' : 'text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-white/10 hover:text-slate-900 dark:hover:text-white'}`}>
                                    <Icon name={tab.icon} size={18} className={activeTab === tab.id ? 'text-white' : 'text-slate-400'}/> {tab.label}
                                </button>
                            ))}
                        </div>
                    </div>

                    {/* Admin Main Content */}
                    <div id="admin-main" className="flex-1 w-full space-y-6 print-area min-w-0">
                        {/* Action Bar */}
                        <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center glass-panel p-5 md:px-8 md:py-6 rounded-[2.5rem] gap-4 no-print shadow-soft border border-slate-200/50 dark:border-white/5">
                            <h2 className="text-xl md:text-2xl font-black text-slate-800 dark:text-white flex items-center gap-3 whitespace-nowrap">
                                <div className="p-2.5 bg-brand/10 text-brand rounded-xl shadow-sm"><Icon name={(TABS.find(t=>t.id===activeTab) || {}).icon} size={20}/></div>
                                {(TABS.find(t=>t.id===activeTab) || {}).label}
                            </h2>
                            <div className="flex flex-col xl:flex-row flex-wrap w-full sm:w-auto gap-3 items-start xl:items-center">
                                <div className="relative w-full sm:w-64">
                                    <div className="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400"><Icon name="search" size={16}/></div>
                                    <input type="text" placeholder={t('search')} value={searchTerm} onChange={(e) => {setSearchTerm(e.target.value); setCurrentPage(1);}} className="w-full pl-10 pr-8 py-2.5 rounded-xl input-modern text-sm font-semibold"/>
                                </div>
                                <div className="flex flex-wrap w-full sm:w-auto gap-2 justify-start sm:justify-end">
                                    {activeTab === 'executive' && <button onClick={window.print} className="px-5 py-2.5 bg-slate-100 dark:bg-white/10 text-slate-700 dark:text-white rounded-xl font-bold text-sm flex items-center gap-2 btn-interactive hover:bg-slate-200"><Icon name="printer" size={16} /> {t('admin_print')}</button>}
                                    <button onClick={exportExcel} className="px-5 py-2.5 bg-emerald-50 dark:bg-emerald-500/10 text-emerald-600 dark:text-emerald-400 hover:bg-emerald-500 hover:text-white rounded-xl font-bold text-sm flex items-center gap-2 transition-all btn-interactive shadow-sm"><Icon name="download" size={16} /> {t('admin_export')}</button>
                                    <button onClick={goBack} className="p-2.5 bg-red-50 dark:bg-red-500/10 text-red-500 rounded-xl hover:bg-red-500 hover:text-white btn-interactive shadow-sm"><Icon name="log-out" size={18}/></button>
                                </div>
                            </div>
                        </div>

                        {/* TAB 1: OVERVIEW */}
                        {activeTab === 'overview' && (
                            <div className="space-y-6 animate-fade-in">
                                <div className="grid grid-cols-2 lg:grid-cols-4 gap-4 md:gap-6">
                                    {[
                                        {l:t('admin_total'), v:stats.total, i:'users', c:'text-brand', bg:'bg-brand/10'}, 
                                        {l:t('admin_risk_health'), v:stats.healthAlert, i:'activity', c:'text-red-500', bg:'bg-red-500/10'}, 
                                        {l:t('admin_risk_food'), v:stats.foodAlert, i:'utensils', c:'text-orange-500', bg:'bg-orange-500/10'},
                                        {l:t('admin_healthy'), v:(stats.total - stats.healthAlert), i:'check-circle', c:'text-emerald-500', bg:'bg-emerald-500/10'}
                                    ].map((card, i) => (
                                        <div key={i} className="glass-panel p-6 md:p-8 rounded-[2rem] border border-slate-200/50 dark:border-white/5 relative overflow-hidden shadow-soft">
                                            <div className="flex justify-between items-start mb-4 relative z-10"><div className={`p-3.5 rounded-[1rem] ${card.bg} ${card.c} shadow-sm`}><Icon name={card.i} size={28} /></div></div>
                                            <p className="text-slate-500 text-xs sm:text-sm font-bold uppercase tracking-wider mb-1 relative z-10">{card.l}</p>
                                            <h3 className={`text-4xl md:text-5xl font-black text-slate-800 dark:text-white relative z-10 drop-shadow-sm`}>{card.v}</h3>
                                        </div>
                                    ))}
                                </div>

                                <div className="grid grid-cols-1 xl:grid-cols-3 gap-6">
                                    {/* Majors Pie */}
                                    <div className="xl:col-span-2 glass-panel p-6 md:p-8 rounded-[2.5rem] border-t-[8px] border-t-brand shadow-soft flex flex-col relative overflow-hidden bg-gradient-to-b from-white to-slate-50/50 dark:from-zinc-900 dark:to-zinc-900/50">
                                        <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 mb-8 relative z-10">
                                            <h3 className="text-xl md:text-2xl font-black text-slate-800 dark:text-white flex items-center gap-3">
                                                <div className="p-3 bg-brand/10 text-brand rounded-2xl shadow-inner"><Icon name="pie-chart" size={24}/></div>
                                                {t('admin_pie_title')}
                                            </h3>
                                            <div className="flex flex-wrap items-center gap-3">
                                                <button onClick={exportMajorsSummary} className="flex items-center gap-2 bg-emerald-50 text-emerald-600 hover:bg-emerald-500 hover:text-white dark:bg-emerald-500/10 dark:text-emerald-400 dark:hover:bg-emerald-500 dark:hover:text-white px-4 py-2 rounded-xl text-sm font-bold shadow-sm border border-emerald-200 dark:border-emerald-500/20 transition-all btn-interactive"><Icon name="download" size={16} /> {t('admin_export_summary')}</button>
                                                <div className="bg-brand/10 text-brand px-4 py-2 rounded-xl text-sm font-bold shadow-sm border border-brand/20">{lang === 'en' ? 'Total ' : 'รวมทั้งหมด '}{stats.total}{lang === 'en' ? '' : ' คน'}</div>
                                            </div>
                                        </div>
                                        <div className="w-full relative z-10 flex flex-col md:flex-row items-center justify-center gap-8 md:gap-12 min-h-[350px]">
                                            {stats.pieData.length > 0 && (
                                                <>
                                                    <div className="w-full md:w-1/2 h-[350px]">
                                                        <ResponsiveContainer width="100%" height="100%">
                                                            <PieChart>
                                                                <Pie data={[...stats.pieData].sort((a,b)=>b.value-a.value)} innerRadius="60%" outerRadius="90%" paddingAngle={4} dataKey="value" stroke="none" cornerRadius={8}>
                                                                    {stats.pieData.sort((a,b)=>b.value-a.value).map((e, i) => <Cell key={i} fill={stats.COLORS[i % stats.COLORS.length]} className="drop-shadow-sm hover:opacity-80 transition-all cursor-pointer outline-none"/>)}
                                                                </Pie>
                                                                <Tooltip contentStyle={{ backgroundColor: isDarkMode ? '#18181b' : '#fff', border: 'none', borderRadius: '16px' }} itemStyle={{fontWeight: 'bold', color: isDarkMode ? '#fff' : '#1e293b'}} formatter={(value, name) => [`${value} คน (${((value/stats.total)*100).toFixed(1)}%)`, name]}/>
                                                                <text x="50%" y="50%" textAnchor="middle" dominantBaseline="middle"><tspan x="50%" dy="-8" fontSize="48" fill={isDarkMode ? "#fff" : "#0f172a"} fontWeight="900">{stats.total}</tspan></text>
                                                            </PieChart>
                                                        </ResponsiveContainer>
                                                    </div>
                                                    <div className="w-full md:w-1/2 flex flex-col gap-2.5 overflow-y-auto max-h-[350px] custom-scrollbar pr-2">
                                                        {[...stats.pieData].sort((a,b)=>b.value-a.value).map((entry, idx) => {
                                                            const mName = lang === 'en' ? (DICT_MAPPING[entry.name] || entry.name) : entry.name;
                                                            return (
                                                            <div key={idx} className="flex items-center justify-between p-3.5 bg-white/80 dark:bg-zinc-800/50 rounded-2xl border border-slate-200/50 dark:border-white/5 hover:border-brand/30 hover:shadow-md transition-all">
                                                                <div className="flex items-center gap-3.5 overflow-hidden flex-1">
                                                                    <div className="w-3.5 h-3.5 rounded-full shrink-0 shadow-inner" style={{ backgroundColor: stats.COLORS[idx % stats.COLORS.length] }}></div>
                                                                    <span className="text-sm font-bold text-slate-700 dark:text-slate-200 truncate" title={mName}>{mName}</span>
                                                                </div>

                                        </div>
                                        
                                        <div className="grid grid-cols-1 sm:grid-cols-2 gap-4 relative z-10">
                                            {[ {l:lang==='en'?'Halal Diet':'คุ้มครองศาสนา (ฮาลาล)', v:stats.dietStats['ฮาลาล'], k:'ฮาลาล', t:'religion_diet', c:'text-blue-600 dark:text-blue-400 print:text-blue-600', bg:'bg-blue-500', hc:'hover:border-blue-300 dark:hover:border-blue-500/50'}, 
                                                {l:lang==='en'?'Vegetarian Diet':'เพื่อสุขภาพ (มังสวิรัติ)', v:stats.dietStats['มังสวิรัติ'], k:'มังสวิรัติ', t:'religion_diet', c:'text-emerald-600 dark:text-emerald-400 print:text-emerald-600', bg:'bg-emerald-500', hc:'hover:border-emerald-300 dark:hover:border-emerald-500/50'}, 
                                                {l:lang==='en'?'Vegan Diet':'อาหารเจ (เทศกาล/ตลอด)', v:stats.dietStats['เจ'], k:'เจ', t:'religion_diet', c:'text-yellow-600 dark:text-yellow-500 print:text-yellow-600', bg:'bg-yellow-400', hc:'hover:border-yellow-300 dark:hover:border-yellow-500/50'}, 
                                                {l:lang==='en'?'Food Allergies':'แพ้อาหารเฉพาะกลุ่ม', v:stats.foodAllergies.length, k:'', t:'food_allergy', c:'text-orange-600 dark:text-orange-400 print:text-orange-600', bg:'bg-orange-500', hc:'hover:border-orange-300 dark:hover:border-orange-500/50'} 
                                            ].map((itm,i) => (
                                                <div key={i} onClick={() => handleDrilldown(itm.l, itm.t, itm.k)} className={`group cursor-pointer p-5 rounded-2xl bg-white/60 dark:bg-zinc-900/50 border border-slate-200 dark:border-white/10 ${itm.hc} hover:shadow-md transition-all btn-interactive print:bg-white print:border-slate-300`}>
                                                    <div className="flex justify-between items-end mb-3">
                                                        <span className={`text-sm font-bold text-slate-600 dark:text-slate-300 group-hover:${itm.c.split(' ')[0]} transition-colors flex items-center gap-1`}><Icon name="search" size={12} className="opacity-0 group-hover:opacity-100 transition-opacity print:hidden"/> {itm.l}</span>
                                                        <span className={`font-black text-3xl leading-none ${itm.c}`}>{itm.v}</span>
                                                    </div>
                                                    <div className="w-full bg-slate-200/50 dark:bg-white/10 rounded-full h-2 overflow-hidden shadow-inner print:bg-slate-200">
                                                        <div className={`h-2 rounded-full ${itm.bg} shadow-sm transition-all duration-1000`} style={{ width: `${stats.total > 0 ? (itm.v / stats.total * 100) : 0}%` }}></div>
                                                    </div>
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                </div>
                            </div>
                        )}
                    </div>

                    {/* MODALS */}
                    {drilldownData.list.length > 0 && (
                        <div className="fixed inset-0 z-[90] flex items-center justify-center p-4 sm:p-6 bg-slate-900/70 dark:bg-black/90 backdrop-blur-lg animate-fade-in no-print">
                            <div className="bg-white dark:bg-zinc-900 border border-slate-200 dark:border-white/10 p-6 md:p-8 rounded-[2.5rem] w-full max-w-5xl max-h-[90vh] flex flex-col shadow-[0_20px_60px_rgba(0,0,0,0.3)] animate-slide-up text-left overflow-hidden">
                                <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 mb-6 shrink-0">
                                    <div>
                                        <h3 className="text-xl md:text-2xl font-black text-slate-800 dark:text-white flex items-center gap-3">
                                            <div className={`p-3 rounded-2xl text-white shadow-md ${drilldownData.type.includes('diet') || drilldownData.type.includes('food') ? 'bg-orange-500 shadow-glow-brand' : drilldownData.type === 'demographics' || drilldownData.type === 'major_breakdown' ? 'bg-blue-500' : drilldownData.title.includes('ทั้งหมด') || drilldownData.title.includes('All') ? 'bg-brand shadow-glow-brand' : 'bg-red-500 shadow-glow-red'}`}><Icon name="users" size={24}/></div>
                                            {drilldownData.title}
                                        </h3>
                                        <p className="text-sm font-semibold text-slate-500 mt-3">{lang==='en'?'Found':'พบข้อมูลทั้งหมด'} <span className="text-brand font-black text-base bg-brand/10 px-2 py-0.5 rounded-md">{drilldownData.list.length}</span> {lang==='en'?'Records':'รายการ'}</p>
                                    </div>
                                    <button onClick={() => setDrilldownData({ title: '', list: [], type: '' })} className="p-2.5 bg-slate-100 dark:bg-white/10 rounded-xl hover:bg-slate-200 transition-colors"><Icon name="x" size={20}/></button>
                                </div>
                                <div className="overflow-y-auto flex-1 custom-scrollbar -mx-2 px-2">
                                    <table className="w-full text-sm text-left">
                                        <thead className="text-xs text-slate-500 uppercase tracking-widest bg-slate-100/80 dark:bg-zinc-800/80 sticky top-0 rounded-xl z-10 shadow-sm backdrop-blur-md">
                                            <tr>
                                                <th className="px-6 py-5 rounded-l-xl font-black">{t('table_name')}</th>
                                                <th className="px-6 py-5 font-black">{t('table_major')}</th>
                                                {drilldownData.type !== 'demographics' && drilldownData.type !== 'major_breakdown' && drilldownData.title !== 'นักศึกษาที่ขึ้นทะเบียนทั้งหมด' && drilldownData.title !== 'All Students' && <th className="px-6 py-5 font-black">{lang==='en'?'Condition':'เงื่อนไข/อาการ'}</th>}
                                                <th className="px-6 py-5 rounded-r-xl font-black">{t('table_contact')}</th>
                                            </tr>
                                        </thead>
                                        <tbody className="divide-y divide-slate-100 dark:divide-white/5">
                                            {drilldownData.list.map((row, idx) => (
                                                <tr key={idx} className="hover:bg-slate-50/80 dark:hover:bg-white/5 transition-colors">
                                                    <td className="px-6 py-5 font-bold text-slate-800 dark:text-white">{row.FullName}</td>
                                                    <td className="px-6 py-5 text-xs font-semibold text-slate-600 dark:text-slate-400">{lang==='en'?(DICT_MAPPING[row.Major]||row.Major):row.Major}</td>
                                                    {drilldownData.type !== 'demographics' && drilldownData.type !== 'major_breakdown' && drilldownData.title !== 'นักศึกษาที่ขึ้นทะเบียนทั้งหมด' && drilldownData.title !== 'All Students' && (
                                                        <td className="px-6 py-5">
                                                            <div className="flex flex-col gap-2">
                                                                {row.FoodAllergy !== 'ไม่แพ้' && (!drilldownData.type || drilldownData.type === 'food_allergy' || drilldownData.type === 'food_alert' || drilldownData.type === 'health_alert') && <span className="text-orange-700 dark:text-orange-300 bg-orange-100 dark:bg-orange-900/40 px-3 py-1.5 rounded-lg text-xs font-bold w-max border border-orange-200 dark:border-orange-800/50">{lang==='en'?'Allergy:':'แพ้:'} {row.FoodAllergy}</span>}
                                                                {row.SpecificDiet !== 'ไม่มี' && (!drilldownData.type || drilldownData.type === 'religion_diet' || drilldownData.type === 'food_alert') && <span className="text-blue-700 dark:text-blue-300 bg-blue-100 dark:bg-blue-900/40 px-3 py-1.5 rounded-lg text-xs font-bold w-max border border-blue-200 dark:border-blue-800/50">{lang==='en'?'Diet:':'อาหาร:'} {row.SpecificDiet}</span>}
                                                                {row.Disease !== 'ไม่มี' && (!drilldownData.type || drilldownData.type === 'disease' || drilldownData.type === 'health_alert') && <span className="text-purple-700 dark:text-purple-300 bg-purple-100 dark:bg-purple-900/40 px-3 py-1.5 rounded-lg text-xs font-bold w-max border border-purple-200 dark:border-purple-800/50">{lang==='en'?'Disease:':'โรค:'} {row.Disease}</span>}
                                                                {row.DrugAllergy !== 'ไม่แพ้' && (!drilldownData.type || drilldownData.type === 'drug_allergy' || drilldownData.type === 'health_alert') && <span className="text-pink-700 dark:text-pink-300 bg-pink-100 dark:bg-pink-900/40 px-3 py-1.5 rounded-lg text-xs font-bold w-max border border-pink-200 dark:border-pink-800/50">{lang==='en'?'Drug Allergy:':'แพ้ยา:'} {row.DrugAllergy}</span>}
                                                            </div>
                                                        </td>
                                                    )}
                                                    <td className="px-6 py-5 text-xs">
                                                        <div className="font-semibold text-slate-600 dark:text-slate-400 mb-1.5 flex items-center gap-1.5"><Icon name="user" size={14}/> {row.StudentPhone}</div>
                                                        <div className="font-bold text-red-500 flex items-center gap-1.5"><Icon name="phone-call" size={14}/> {row.ParentPhone}</div>
                                                    </td>
                                                </tr>
                                            ))}
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        </div>
                    )}

                    {selectedSurveillanceStudent && (() => {
                        const isSafe = selectedSurveillanceStudent.issues.length === 0;
                        return (
                        <div className="fixed inset-0 z-[80] flex items-center justify-center p-4 sm:p-6 bg-slate-900/70 dark:bg-black/90 backdrop-blur-lg animate-fade-in no-print">
                            <div className={`bg-white dark:bg-zinc-900 p-8 rounded-[2.5rem] w-full max-w-md ${isSafe ? 'shadow-[0_20px_60px_rgba(16,185,129,0.2)] border-emerald-500/30' : 'shadow-[0_20px_60px_rgba(239,68,68,0.2)] border-red-500/30'} border shadow-2xl animate-slide-up text-left overflow-hidden relative`}>
                                <div className={`absolute top-0 left-0 right-0 h-2.5 bg-gradient-to-r ${isSafe ? 'from-emerald-400 to-teal-500' : 'from-red-500 to-orange-500'} z-20`}></div>
                                <div className="flex justify-between items-center mb-8 mt-2">
                                    <h3 className="text-xl md:text-2xl font-black text-slate-800 dark:text-white flex items-center gap-3">
                                        <div className={`p-3 rounded-2xl shadow-sm ${isSafe ? 'bg-emerald-100 dark:bg-emerald-500/20 text-emerald-600' : 'bg-red-100 dark:bg-red-500/20 text-red-600'}`}><Icon name={isSafe ? "user-check" : "shield-alert"} size={24}/></div> 
                                        {isSafe ? (lang==='en'?'Student Info':'ข้อมูลนักศึกษา') : (lang==='en'?'High Risk Detail':'เฝ้าระวังพิเศษ')}
                                    </h3>
                                    <button onClick={() => setSelectedSurveillanceStudent(null)} className="p-2.5 bg-slate-100 dark:bg-white/10 rounded-xl text-slate-500 hover:bg-slate-200 transition-colors"><Icon name="x" size={18}/></button>
                                </div>
                                <div className="bg-slate-50 dark:bg-black/20 p-6 rounded-3xl border border-slate-200/60 dark:border-white/5 mb-6 shadow-inner">
                                    <h4 className="text-xl font-black text-slate-800 dark:text-white mb-2">{selectedSurveillanceStudent.FullName}</h4>
                                    <p className="text-sm font-semibold text-slate-500 dark:text-slate-400 mb-6">{lang==='en'?DICT_MAPPING[selectedSurveillanceStudent.Major]||selectedSurveillanceStudent.Major:selectedSurveillanceStudent.Major}</p>
                                    <div className="flex flex-col gap-3 text-sm">
                                        <div className="flex justify-between border-b border-slate-200/80 dark:border-white/10 pb-3">
                                            <span className="text-slate-500 flex items-center gap-2"><Icon name="smartphone" size={16}/> {lang==='en'?'Student':'เบอร์ นศ.'}</span>
                                            <span className="font-bold text-slate-800 dark:text-slate-200">{selectedSurveillanceStudent.StudentPhone}</span>
                                        </div>
                                        <div className="flex justify-between pt-1">
                                            <span className="text-slate-500 flex items-center gap-2"><Icon name="phone" size={16}/> {lang==='en'?'Parent':'เบอร์ ผปค.'}</span>
                                            <span className="font-black text-red-500 flex items-center gap-1.5"><Icon name="alert-circle" size={14}/> {selectedSurveillanceStudent.ParentPhone}</span>
                                        </div>
                                    </div>
                                </div>
                                <div className={`p-6 rounded-3xl border shadow-sm ${isSafe ? 'bg-emerald-50/80 dark:bg-emerald-950/30 border-emerald-200/60 dark:border-emerald-500/20' : 'bg-red-50/80 dark:bg-red-950/30 border-red-200/60 dark:border-red-500/20'}`}>
                                    <p className={`text-xs font-black uppercase mb-4 tracking-widest ${isSafe ? 'text-emerald-700 dark:text-emerald-400' : 'text-red-700 dark:text-red-400'}`}>{lang==='en'?'Risk Issues':'ประเด็นเสี่ยง'} ({selectedSurveillanceStudent.issues.length})</p>
                                    <div className="space-y-3">
                                        {isSafe ? (
                                            <div className="flex items-center gap-2.5 text-emerald-600 dark:text-emerald-400 text-sm font-bold bg-white/50 dark:bg-black/20 p-4 rounded-xl border border-emerald-100 dark:border-emerald-900/30">
                                                <Icon name="check-circle" size={20}/> {lang==='en'?'Normal (No issues)':'ปกติ (ไม่มีประเด็นเฝ้าระวัง)'}
                                            </div>
                                        ) : (
                                            selectedSurveillanceStudent.issues.map((iss, idx) => (
                                                <div key={idx} className={`p-4 rounded-2xl border flex items-start gap-3.5 text-sm font-bold shadow-sm
                                                    ${iss.type === 'food' ? 'bg-white dark:bg-zinc-800/80 border-orange-200 dark:border-orange-500/30 text-orange-800 dark:text-orange-300' : 'bg-white dark:bg-zinc-800/80 border-red-200 dark:border-red-500/30 text-red-800 dark:text-red-300'}`}>
                                                    <div className={`p-2 rounded-xl shrink-0 ${iss.type === 'food' ? 'bg-orange-100 dark:bg-orange-500/20 text-orange-600' : 'bg-red-100 dark:bg-red-500/20 text-red-600'}`}>
                                                        <Icon name={iss.type === 'food' ? 'pizza' : 'heart-pulse'} size={18}/>
                                                    </div>
                                                    <span className="mt-1.5">{iss.text}</span>
                                                </div>
                                            ))
                                        )}
                                    </div>
                                </div>
                            </div>
                        </div>
                        );
                    })()}

                    {editItem && (
                        <div className="fixed inset-0 z-[70] flex items-center justify-center p-4 sm:p-6 bg-slate-900/70 dark:bg-black/90 backdrop-blur-lg animate-fade-in no-print">
                            <div className="bg-white dark:bg-zinc-900 border border-slate-200 dark:border-white/10 p-6 md:p-8 rounded-[2.5rem] w-full max-w-lg max-h-[90vh] flex flex-col shadow-[0_20px_60px_rgba(0,0,0,0.3)] animate-slide-up text-left overflow-hidden">
                                <div className="flex justify-between items-center mb-6 shrink-0">
                                    <h3 className="text-xl md:text-2xl font-black text-slate-800 dark:text-white flex items-center gap-3"><Icon name="edit" size={24}/> Edit Data</h3>
                                    <button onClick={() => setEditItem(null)} className="p-2.5 bg-slate-100 dark:bg-white/10 rounded-xl hover:bg-slate-200 transition-colors"><Icon name="x" size={20}/></button>
                                </div>
                                <form onSubmit={handleSaveEdit} className="space-y-5 overflow-y-auto flex-1 custom-scrollbar pr-2 pb-4">
                                    <div className="p-5 bg-slate-50 dark:bg-black/20 rounded-3xl border border-slate-200/60 dark:border-white/5 space-y-4">
                                        <div><label className="text-[10px] font-black text-slate-500 mb-1.5 block uppercase tracking-widest">{t('form_fullname')}</label><input className="w-full input-modern rounded-xl px-4 py-3.5 text-sm font-bold shadow-sm" value={editItem.FullName} onChange={e => setEditItem({...editItem, FullName: e.target.value})}/></div>
                                        <div className="grid grid-cols-2 gap-4">
                                            <div><label className="text-[10px] font-black text-slate-500 mb-1.5 block uppercase tracking-widest">{t('form_studentid')}</label><input className="w-full input-modern rounded-xl px-4 py-3.5 text-sm font-mono shadow-sm" inputMode="numeric" maxLength="9" value={editItem.StudentID} onChange={e => setEditItem({...editItem, StudentID: e.target.value.replace(/\D/g, '')})}/></div>
                                            <div><label className="text-[10px] font-black text-slate-500 mb-1.5 block uppercase tracking-widest">{t('form_idcard')}</label><input className="w-full input-modern rounded-xl px-4 py-3.5 text-sm font-mono shadow-sm" maxLength="20" value={editItem.IDCard || ''} onChange={e => setEditItem({...editItem, IDCard: e.target.value})}/></div>
                                        </div>
                                    </div>
                                    <div className="flex gap-4 pt-6 sticky bottom-0 bg-white dark:bg-zinc-900 pb-2 z-10 border-t border-slate-100 dark:border-white/5 mt-6">
                                        <button type="button" onClick={() => setEditItem(null)} className="flex-1 py-4 bg-slate-100 dark:bg-white/5 text-sm rounded-xl font-bold btn-interactive">{t('cancel')}</button>
                                        <button type="submit" className="flex-1 py-4 brand-gradient text-white text-sm rounded-xl font-bold shadow-glow-brand btn-interactive">{t('save')}</button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        // ==========================================
        // 🚀 Main App Component
        // ==========================================
        function App() {
            const [isDarkMode, setIsDarkMode] = useState(false);
            const [lang, setLang] = useState('th'); // Language State (th, en)
            const [currentView, setCurrentView] = useState('pdpa'); 
            
            useEffect(() => {
                const isDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
                setIsDarkMode(isDark);
            }, []);

            useEffect(() => {
                if (isDarkMode) document.documentElement.classList.add('dark');
                else document.documentElement.classList.remove('dark');
            }, [isDarkMode]);

            const t = (key) => TRANSLATIONS[lang][key] || key;

            return (
                <AppContext.Provider value={{ t, lang, setLang, isDarkMode }}>
                    <div className="min-h-screen p-4 md:p-6 transition-colors duration-300 relative print:p-0 print:m-0">
                        {currentView === 'pdpa' && <PdpaModal onAccept={() => setCurrentView('register')} onAdminClick={() => setCurrentView('admin')} />}
                        {currentView === 'register' && <RegistrationForm onBack={() => setCurrentView('pdpa')} onSuccess={() => setCurrentView('success')} />}
                        {currentView === 'success' && <SuccessView onHome={() => setCurrentView('pdpa')} />}
                        {currentView === 'admin' && <AdminDashboard goBack={() => setCurrentView('pdpa')} />}

                        {/* Theme & Language Switchers (Hidden on Print) */}
                        <div className="fixed bottom-6 right-6 flex flex-col gap-3 z-50 no-print">
                            <button onClick={() => setLang(lang === 'th' ? 'en' : 'th')} className="w-12 h-12 bg-white dark:bg-zinc-800 text-slate-800 dark:text-white rounded-full shadow-lg border border-slate-200 dark:border-zinc-700 hover:scale-110 transition-transform flex items-center justify-center font-black text-sm" title="Change Language">
                                {lang === 'th' ? 'EN' : 'TH'}
                            </button>
                            <button onClick={() => setIsDarkMode(!isDarkMode)} className="w-12 h-12 bg-white dark:bg-zinc-800 text-slate-800 dark:text-white rounded-full shadow-lg border border-slate-200 dark:border-zinc-700 hover:scale-110 transition-transform flex items-center justify-center" title="Toggle Dark Mode">
                                <Icon name={isDarkMode ? "sun" : "moon"} size={20} />
                            </button>
                        </div>
                    </div>
                </AppContext.Provider>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
