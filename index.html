                                <h1 className="text-3xl font-light text-gray-900 mb-2 tracking-tight">ใบเสร็จรับเงิน</h1>
                                <h2 className="text-xs font-medium text-gray-500 leading-relaxed whitespace-pre-wrap uppercase tracking-wider">{config.header}</h2>
                            </div>
                            <div className="text-right">
                                <div className="inline-block border border-gray-900 text-gray-900 px-3 py-1 text-[9px] font-bold tracking-[0.2em] uppercase mb-4">{title}</div>
                                <p className="text-[9px] text-gray-400 uppercase tracking-widest mb-1">เลขที่ใบเสร็จ</p>
                                <p className="text-lg font-medium text-gray-900 tracking-wide">{data.orderId}</p>
                            </div>
                        </div>
                        
                        <div className="grid grid-cols-2 gap-8 mb-10 text-sm">
                            <div>
                                <p className="text-[9px] text-gray-400 font-medium tracking-[0.2em] uppercase mb-2">ออกให้แก่</p>
                                <p className="font-medium text-gray-900 text-base mb-1 break-words">{data.student.Name}</p>
                                <p className="text-gray-500 font-light leading-normal break-words">{data.student.Major}</p>
                                <p className="text-gray-400 font-light mt-1 break-words text-xs">รหัส: {data.student.StudentID}</p>
                            </div>
                            <div>
                                <p className="text-[9px] text-gray-400 font-medium tracking-[0.2em] uppercase mb-2">วันที่</p>
                                <p className="font-medium text-gray-900 text-base mb-1">{data.date.split(' ')[0]}</p>
                                <p className="text-gray-500 font-light text-xs">{data.date.split(' ')[1]}</p>
                            </div>
                        </div>
                        
                        <div className="flex-grow mb-8">
                            <table className="w-full text-sm text-left">
                                <thead>
                                    <tr>
                                        <th className="pb-4 pt-2 border-b border-gray-200 text-[9px] text-gray-400 font-medium uppercase tracking-[0.2em]">รายการ</th>
                                        <th className="pb-4 pt-2 border-b border-gray-200 text-[9px] text-gray-400 font-medium uppercase tracking-[0.2em] text-center w-20">จำนวน</th>
                                        <th className="pb-4 pt-2 border-b border-gray-200 text-[9px] text-gray-400 font-medium uppercase tracking-[0.2em] text-right w-28">จำนวนเงิน</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr>
                                        <td className="py-5 border-b border-gray-100">
                                            <p className="font-medium text-gray-900">เสื้อโปโล</p>
                                            <p className="text-xs text-gray-500 font-light mt-1">ทรง: {data.poloGender} <span className="mx-1">|</span> ขนาด: <span className="font-medium text-gray-900">{data.poloSize}</span></p>
                                        </td>
                                        <td className="py-5 border-b border-gray-100 text-center font-light text-gray-900">{data.poloQty}</td>
                                        <td className="py-5 border-b border-gray-100 text-right font-light text-gray-900">฿{(['XL', '2XL', '3XL'].includes(data.poloSize) ? shirtPrice.oversize : shirtPrice.normal) * data.poloQty}</td>
                                    </tr>
                                    <tr>
                                        <td className="py-5 border-b border-gray-100">
                                            <p className="font-medium text-gray-900">เสื้อยืด</p>
                                            <p className="text-xs text-gray-500 font-light mt-1">ทรง: {data.tshirtGender} <span className="mx-1">|</span> ขนาด: <span className="font-medium text-gray-900">{data.tshirtSize}</span></p>
                                        </td>
                                        <td className="py-5 border-b border-gray-100 text-center font-light text-gray-900">{data.tshirtQty}</td>
                                        <td className="py-5 border-b border-gray-100 text-right font-light text-gray-900">฿{(['XL', '2XL', '3XL'].includes(data.tshirtSize) ? shirtPrice.oversize : shirtPrice.normal) * data.tshirtQty}</td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                        
                        <div className="flex justify-between items-end border-t border-gray-900 pt-6 mb-12">
                            <div>
                                <span className="text-[10px] text-gray-500 font-medium uppercase tracking-[0.2em]">ยอดรวมทั้งสิ้น</span>
                                
                                {data.grandTotal > 0 && (
                                    <div className="mt-4 flex flex-col gap-2">
                                        {data.paymentMethod === 'cash' ? (
                                            <span className="text-[10px] font-bold text-gray-900 uppercase tracking-widest border border-gray-900 px-3 py-1.5 w-fit">
                                                ชำระด้วยเงินสด
                                            </span>
                                        ) : (
                                            <span className="text-[10px] font-bold text-gray-900 uppercase tracking-widest border border-gray-900 px-3 py-1.5 w-fit">
                                                ชำระผ่านพร้อมเพย์
                                            </span>
                                        )}
                                    </div>
                                )}
                            </div>
                            <span className="text-3xl font-light text-gray-900 tracking-tight">฿{data.grandTotal.toLocaleString()}</span>
                        </div>
                        
                        <div className="mt-auto flex justify-between items-end gap-6 border-t border-gray-100 pt-8">
                            <div className="w-[60%]">
                                <span className="text-[9px] text-gray-400 font-medium uppercase tracking-[0.2em] mb-2 block">หมายเหตุ</span>
                                <span className="text-xs text-gray-500 font-light whitespace-pre-wrap leading-relaxed">{config.note}</span>
                            </div>
                            <div className="text-center w-[40%]">
                                <div className="border-b border-gray-300 mb-3 h-8"></div>
                                <p className="text-[9px] text-gray-400 font-medium uppercase tracking-[0.2em]">ลายมือชื่อผู้รับเงิน</p>
                            </div>
                        </div>
                    </div>
                );

                return (
                    <div className="min-h-screen flex flex-col relative z-10">
                        <Navbar />
                        <div className="flex-grow flex flex-col items-center pt-8 p-4 pb-20">
                            <div className="w-full max-w-[1200px]">
                                <div className="flex justify-between items-end mb-8 px-2">
                                    <div>
                                        <h2 className="text-2xl font-bold text-gray-900 dark:text-white tracking-wide">ยืนยันการสั่งจอง</h2>
                                        <p className="text-gray-500 text-sm font-medium mt-2 bg-white/50 dark:bg-gray-800/50 px-4 py-2 rounded-lg border border-gray-200 dark:border-gray-700 shadow-sm inline-block">โปรดดาวน์โหลดใบเสร็จนี้เก็บไว้เป็นหลักฐาน</p>
                                    </div>
                                    <p className="text-xs text-brand-500 font-bold xl:hidden bg-brand-50 dark:bg-gray-800 px-3 py-1.5 rounded-lg border border-brand-100 dark:border-gray-700 shadow-sm"><i className="fa-solid fa-arrows-left-right animate-pulse"></i> เลื่อนเพื่อดูทั้งหมด</p>
                                </div>

                                <div className="w-full overflow-x-auto pb-8 custom-scrollbar">
                                    <div id="receipt-card" className="bg-white flex flex-row justify-between items-stretch shadow-glass border border-gray-200 rounded-lg overflow-hidden" style={{ width: '1123px', minHeight: '794px', margin: '0 auto' }}>
                                        <ReceiptSlip title="ต้นฉบับ" data={receiptData} config={receiptSettings} />
                                        <div className="flex flex-col items-center justify-center gap-6 text-gray-300 bg-[#f8fafc] px-3 border-x-2 border-dashed border-gray-300">
                                            <i className="fa-solid fa-scissors text-gray-400 text-sm transform -rotate-90"></i>
                                            <span className="text-xs font-bold uppercase tracking-[0.4em] whitespace-nowrap text-gray-400" style={{ writingMode: 'vertical-rl', transform: 'rotate(180deg)' }}>ตัดตรงนี้</span>
                                            <i className="fa-solid fa-scissors text-gray-400 text-sm transform rotate-90"></i>
                                        </div>
                                        <ReceiptSlip title="สำเนา" data={receiptData} config={receiptSettings} />
                                    </div>
                                </div>
                                
                                <div className="flex flex-col sm:flex-row justify-center gap-4 mt-8 max-w-[800px] w-full mx-auto">
                                    <button onClick={goHome} className="w-full sm:w-1/4 btn-outline py-4 font-bold tracking-[0.1em] text-sm uppercase bg-white shadow-sm dark:bg-gray-800">หน้าแรก</button>
                                    {shirtSystemOpen && <button onClick={() => { setIsEditingOrder(true); setView('shirt_form'); }} className="w-full sm:w-1/4 bg-gray-900 text-white hover:bg-black transition-colors py-4 font-bold tracking-[0.1em] text-sm uppercase rounded-xl shadow-lg dark:bg-gray-700 dark:hover:bg-gray-600">แก้ไขการจอง</button>}
                                    <button onClick={handleDownloadReceipt} className="w-full sm:w-2/4 btn-premium py-4 font-bold tracking-[0.1em] text-sm uppercase shadow-xl shadow-brand-500/30 flex justify-center items-center gap-3 dark:bg-white dark:text-black dark:hover:bg-gray-200"><i className="fa-solid fa-download"></i> ดาวน์โหลดใบเสร็จ</button>
                                </div>
                            </div>
                        </div>
                        <Footer />
                        <MobileTabBar />
                    </div>
                );
            }

            if (view === 'history_search') {
                return (
                    <div className="min-h-screen flex flex-col relative z-10">
                        <Navbar />
                        <div className="flex-grow flex flex-col items-center justify-center p-6">
                            <div className="luxury-card w-full max-w-md p-10 relative overflow-hidden">
                                <div className="absolute top-0 left-0 w-full h-2 bg-gradient-to-r from-blue-400 to-blue-600"></div>
                                <button onClick={goHome} className="absolute top-6 left-6 text-gray-400 hover:text-gray-900 transition-colors text-sm font-medium dark:hover:text-white"><i className="fa-solid fa-arrow-left mr-2"></i> กลับ</button>
                                <div className="text-center mt-12 mb-10">
                                    <div className="w-24 h-24 rounded-3xl mx-auto flex items-center justify-center mb-6 shadow-sm border bg-blue-50 border-blue-100 dark:bg-gray-800 dark:border-gray-700">
                                        <i className="fa-solid fa-clock-rotate-left text-4xl text-blue-500"></i>
                                    </div>
                                    <h2 className="text-2xl font-bold text-gray-900 tracking-tight dark:text-white">ประวัติกิจกรรม</h2>
                                    <p className="text-gray-500 mt-3 text-sm font-light leading-relaxed">ตรวจสอบประวัติการเข้าร่วมกิจกรรมของคุณทั้งหมดในระบบ</p>
                                </div>
                                <form onSubmit={(e) => { e.preventDefault(); handleSearchHistory(e.target.studentId.value); }}>
                                    <div className="mb-8">
                                        <input type="text" name="studentId" required placeholder="กรอกรหัสนักศึกษา..." defaultValue={localStorage.getItem('last_student_id')||''}
                                               className="w-full luxury-input text-center tracking-widest text-xl font-semibold" />
                                    </div>
                                    <button type="submit" className="w-full bg-gradient-to-r from-blue-500 to-blue-600 hover:from-blue-600 hover:to-blue-700 text-white shadow-lg shadow-blue-500/30 rounded-xl py-4 font-bold tracking-[0.1em] text-sm uppercase transition-all hover:-translate-y-1">
                                        ค้นหา <i className="fa-solid fa-search ml-2 text-sm"></i>
                                    </button>
                                </form>
                            </div>
                        </div>
                        <Footer />
                        <MobileTabBar />
                    </div>
                );
            }

            if (view === 'history_result') {
                return (
                    <div className="min-h-screen flex flex-col relative z-10">
                        <Navbar />
                        <div className="flex-grow flex flex-col items-center pt-8 p-4 pb-20">
                            <div className="luxury-card w-full max-w-3xl p-8 sm:p-12 relative overflow-hidden">
                                <div className="absolute top-0 left-0 w-full h-2 bg-gradient-to-r from-blue-400 to-blue-600"></div>
                                <div className="flex flex-col sm:flex-row items-start sm:items-center justify-between mb-10 border-b border-gray-100 dark:border-gray-800 pb-6 gap-4 pt-4">
                                    <div>
                                        <h2 className="text-2xl font-bold text-gray-900 dark:text-white tracking-wide flex items-center gap-3"><i className="fa-solid fa-clock-rotate-left text-blue-500"></i> ประวัติกิจกรรม</h2>
                                        <p className="text-gray-500 text-sm font-medium mt-2 bg-gray-50 dark:bg-gray-800 px-3 py-1 rounded-lg inline-block border border-gray-200 dark:border-gray-700 shadow-sm">พบข้อมูลทั้งหมด <span className="text-blue-600 font-bold">{historyData.length}</span> รายการ</p>
                                    </div>
                                    <button onClick={() => setView('history_search')} className="text-sm text-gray-500 hover:text-gray-900 bg-gray-100 hover:bg-gray-200 px-4 py-2 rounded-lg font-medium transition-colors dark:bg-gray-800 dark:hover:bg-gray-700 dark:hover:text-white shadow-sm"><i className="fa-solid fa-search mr-2"></i>ค้นหาใหม่</button>
                                </div>
                                
                                <div className="space-y-4">
                                    {historyData.length === 0 ? (
                                        <div className="text-center py-20 bg-gray-50 dark:bg-gray-800/50 rounded-2xl border-2 border-dashed border-gray-200 dark:border-gray-700">
                                            <div className="w-16 h-16 bg-white dark:bg-gray-700 rounded-full flex items-center justify-center shadow-sm border border-gray-100 dark:border-gray-600 mb-4 text-gray-400 mx-auto"><i className="fa-solid fa-folder-open text-2xl"></i></div>
                                            <p className="text-gray-500 font-bold">ไม่พบประวัติการเข้าร่วมกิจกรรม</p>
                                        </div>
                                    ) : (
                                        <div className="relative border-l-2 border-blue-100 dark:border-blue-900/50 ml-4 sm:ml-6 pl-8 sm:pl-10 space-y-10 py-4">
                                            {historyData.map((h, i) => (
                                                <div key={i} className="relative group">
                                                    <div className="absolute -left-[39px] sm:-left-[47px] top-4 w-4 h-4 bg-white dark:bg-gray-900 border-4 border-blue-500 rounded-full transition-transform group-hover:scale-125 group-hover:bg-blue-100 shadow-sm"></div>
                                                    <div className="bg-white dark:bg-gray-800/80 p-6 sm:p-8 rounded-2xl border border-gray-100 dark:border-gray-700 shadow-sm transition-all hover:shadow-lg hover:border-blue-200 dark:hover:border-blue-900/50">
                                                        <div className="flex flex-col sm:flex-row sm:justify-between sm:items-center gap-4">
                                                            <div>
                                                                <span className="inline-block bg-blue-50 text-blue-600 border border-blue-100 text-[10px] font-bold uppercase tracking-widest px-2.5 py-1 rounded-md mb-3 dark:bg-blue-900/30 dark:border-blue-800 dark:text-blue-400"><i className="fa-solid fa-check mr-1"></i> เข้าร่วมแล้ว</span>
                                                                <h4 className="font-bold text-gray-900 dark:text-white text-lg sm:text-xl mb-1">{h.ActivityName}</h4>
                                                                <p className="text-sm text-gray-500 font-medium">{h.Name} ({h.StudentID})</p>
                                                            </div>
                                                            <div className="text-xs text-gray-900 dark:text-gray-300 font-medium whitespace-nowrap bg-gray-50 dark:bg-gray-900 px-4 py-2.5 rounded-xl border border-gray-200 dark:border-gray-700 shadow-inner flex items-center gap-2">
                                                                <i className="fa-regular fa-clock text-gray-400"></i>
                                                                {new Date(h.Timestamp).toLocaleString('th-TH')}
                                                            </div>
                                                        </div>
                                                    </div>
                                                </div>
                                            ))}
                                        </div>
                                    )}
                                </div>
                            </div>
                        </div>
                        <Footer />
                        <MobileTabBar />
                    </div>
                );
            }

            const handleAdminLogin = (e) => {
                e.preventDefault();
                if(e.target.username.value === 'admin' && e.target.password.value === '9999') {
                    localStorage.setItem('admin_logged_in', 'true'); loadAdminData();
                } else { 
                    Swal.fire({
                        title: 'ข้อมูลเข้าสู่ระบบไม่ถูกต้อง', 
                        text: 'รหัสผ่านหรือชื่อผู้ใช้ผิด กรุณาลองใหม่', 
                        icon: 'error',
                        confirmButtonColor: '#ff621f'
                    }).then(() => {
                        goHome();
                    }); 
                }
            };

            if (view === 'admin_login') {
                return (
                    <div className="min-h-screen flex flex-col bg-[#0f172a] relative overflow-hidden">
                        <div className="absolute top-0 left-0 w-full h-full overflow-hidden z-0">
                            <div className="absolute -top-40 -left-40 w-96 h-96 bg-brand-500 rounded-full mix-blend-screen filter blur-[100px] opacity-20"></div>
                            <div className="absolute top-40 right-20 w-80 h-80 bg-blue-500 rounded-full mix-blend-screen filter blur-[100px] opacity-20"></div>
                        </div>

                        <div className="flex-grow flex items-center justify-center p-6 relative z-10">
                            <div className="bg-white/10 backdrop-blur-2xl border border-white/20 w-full max-w-md p-10 sm:p-12 rounded-3xl shadow-2xl">
                                <div className="text-center mb-12">
                                    <div className="w-16 h-16 bg-white/20 rounded-2xl flex items-center justify-center text-white text-2xl mx-auto mb-6 border border-white/30 shadow-inner">
                                        <i className="fa-solid fa-lock"></i>
                                    </div>
                                    <h2 className="text-2xl font-bold text-white tracking-[0.2em] uppercase">พื้นที่ทำงาน</h2>
                                    <p className="text-blue-200 mt-2 text-xs font-medium tracking-wide">เฉพาะเจ้าหน้าที่ที่ได้รับอนุญาตเท่านั้น</p>
                                </div>
                                <form onSubmit={handleAdminLogin} className="space-y-6">
                                    <div>
                                        <label className="block text-xs font-medium text-gray-300 mb-2 uppercase tracking-wider">ชื่อผู้ใช้</label>
                                        <input type="text" name="username" required
                                               className="w-full bg-black/30 border border-white/10 text-white px-5 py-4 rounded-xl focus:border-brand-500 focus:bg-black/50 outline-none transition-all font-medium text-sm shadow-inner" />
                                    </div>
                                    <div>
                                        <label className="block text-xs font-medium text-gray-300 mb-2 uppercase tracking-wider">รหัสผ่าน</label>
                                        <input type="password" name="password" required
                                               className="w-full bg-black/30 border border-white/10 text-white px-5 py-4 rounded-xl focus:border-brand-500 focus:bg-black/50 outline-none transition-all font-medium text-sm shadow-inner" />
                                    </div>
                                    <button type="submit" className="w-full bg-gradient-to-r from-brand-500 to-rose-500 text-white py-4 rounded-xl font-bold tracking-[0.1em] text-sm uppercase mt-8 hover:shadow-[0_0_20px_rgba(255,98,31,0.5)] transition-all hover:-translate-y-1">เข้าสู่ระบบ <i className="fa-solid fa-arrow-right-to-bracket ml-2"></i></button>
                                </form>
                                <button onClick={goHome} className="w-full text-gray-400 hover:text-white mt-8 text-xs transition-colors font-medium uppercase tracking-[0.1em] flex items-center justify-center gap-2"><i className="fa-solid fa-arrow-left"></i> กลับสู่หน้าแรก</button>
                            </div>
                        </div>
                        <div className="absolute bottom-6 w-full text-center z-10">
                            <p className="text-[10px] text-gray-500 font-medium tracking-[0.2em] uppercase">Copyright &copy; 2026 DIGIT System.</p>
                        </div>
                    </div>
                );
            }

            if (view === 'admin_dashboard') return <AdminDashboard data={adminData} reloadData={loadAdminData} goHome={goHome} setAdminData={setAdminData} />;

            return null;
        }

        function AdminDashboard({ data, reloadData, goHome, setAdminData }) {
            const [activeTab, setActiveTab] = useState('overview');
            const [selectedActivityForSummary, setSelectedActivityForSummary] = useState('');
            const [searchCheckinTerm, setSearchCheckinTerm] = useState('');
            const [selectedActivityForSpss, setSelectedActivityForSpss] = useState('');
            const [currentPage, setCurrentPage] = useState(1);
            const [overviewActivityPage, setOverviewActivityPage] = useState(1);
            const [searchOverviewActTerm, setSearchOverviewActTerm] = useState('');
            const [shirtOrderPage, setShirtOrderPage] = useState(1);
            const itemsPerPage = 10;
            const shirtItemsPerPage = 10;

            const systemOpen = data?.shirtPrice?.systemStatus !== 'maintenance';

            const activeUsersCount = useMemo(() => {
                if (!data || !data.checkins) return 1;
                const fifteenMinsAgo = Date.now() - (15 * 60000);
                const uniqueRecent = new Set();
                
                for (let i = (data.checkins || []).length - 1; i >= 0; i--) {
                    const c = data.checkins[i];
                    if (new Date(c.Timestamp).getTime() >= fifteenMinsAgo) {
                        if (c.StudentID) uniqueRecent.add(String(c.StudentID).trim());
                    } else if (i < (data.checkins || []).length - 150) {
                        break;
                    }
                }
                return uniqueRecent.size > 0 ? uniqueRecent.size + 1 : 1; 
            }, [data]);

            const overviewStats = useMemo(() => {
                if (!data) return { totalUniqueUsers: 0, todayCheckins: 0, todayOrders: 0, todaysTransactions: 0 };
                
                const uniqueUsers = new Set();
                
                const startOfToday = new Date();
                startOfToday.setHours(0, 0, 0, 0);
                const startOfTodayTime = startOfToday.getTime();
                
                let todayCheckins = 0;
                (data.checkins || []).forEach(c => { 
                    if(c.StudentID) uniqueUsers.add(String(c.StudentID).trim()); 
                    if(c.Timestamp && new Date(c.Timestamp).getTime() >= startOfTodayTime) todayCheckins++;
                });
                
                let todayOrders = 0;
                (data.shirtOrders || []).forEach(o => { 
                    if(o.StudentID) uniqueUsers.add(String(o.StudentID).trim()); 
                    if(o.Timestamp && new Date(o.Timestamp).getTime() >= startOfTodayTime) todayOrders++;
                });
                
                (data.evaluations || []).forEach(e => { 
                    if(e.StudentID) uniqueUsers.add(String(e.StudentID).trim()); 
                });
                
                return {
                    totalUniqueUsers: uniqueUsers.size,
                    todayCheckins,
                    todayOrders,
                    todaysTransactions: todayCheckins + todayOrders
                };
            }, [data]);

            const checkinCountByActivity = useMemo(() => {
                const counts = {};
                if (!data || !data.checkins) return counts;
                (data.checkins || []).forEach(c => {
                    const id = String(c.ActivityID).trim();
                    counts[id] = (counts[id] || 0) + 1;
                });
                return counts;
            }, [data]);

            const filteredCheckins = useMemo(() => {
                if (!data || !data.checkins) return [];
                return (data.checkins || []).filter(c => {
                    const matchActivity = selectedActivityForSummary ? String(c.ActivityID).trim() === String(selectedActivityForSummary).trim() : true;
                    if (!matchActivity) return false;
                    
                    const term = (searchCheckinTerm || '').toLowerCase().trim();
                    if (!term) return true;
                    
                    return String(c.StudentID || '').toLowerCase().includes(term) || 
                           String(c.Name || '').toLowerCase().includes(term) || 
                           String(c.Major || '').toLowerCase().includes(term) || 
                           String(c.IDCard || '').toLowerCase().includes(term);
                });
            }, [data, selectedActivityForSummary, searchCheckinTerm]);

            const sortedCheckins = useMemo(() => {
                return [...filteredCheckins].reverse();
            }, [filteredCheckins]);

            const shirtOrdersByMajor = useMemo(() => {
                if (!data || !data.shirtOrders) return [];
                const acc = {};
                (data.shirtOrders || []).forEach(o => {
                    const m = o.Major || 'ไม่ระบุสาขา';
                    if(!acc[m]) acc[m] = { count: 0, total: 0 };
                    acc[m].count++;
                    acc[m].total += Number(o.TotalPrice) || 0;
                });
                return Object.entries(acc).sort((a,b) => b[1].count - a[1].count);
            }, [data]);

            const sortedShirtOrders = useMemo(() => {
                return [...(data?.shirtOrders || [])].reverse();
            }, [data]);

            const filteredOverviewActivities = useMemo(() => {
                if (!data || !data.activities) return [];
                const term = (searchOverviewActTerm || '').toLowerCase().trim();
                if (!term) return data.activities;
                
                return (data.activities || []).filter(a => 
                    String(a.Name || '').toLowerCase().includes(term) ||
                    String(a.Location || '').toLowerCase().includes(term) ||
                    String(a.Date || '').toLowerCase().includes(term)
                );
            }, [data, searchOverviewActTerm]);

            useEffect(() => { setCurrentPage(1); }, [selectedActivityForSummary, searchCheckinTerm]);
            useEffect(() => { setOverviewActivityPage(1); }, [searchOverviewActTerm]); 
            useEffect(() => { setShirtOrderPage(1); }, [activeTab]); 

            const toggleSystem = async () => {
                const currentStatus = systemOpen ? 'open' : 'maintenance';
                Swal.fire({ title: 'กำลังอัปเดต...', allowOutsideClick: false, didOpen: () => { Swal.showLoading() } });
                try { 
                    await runGAS('toggleMasterSystemStatus', currentStatus); 
                    Swal.close(); 
                    reloadData(); 
                } catch(err) { Swal.fire('ข้อผิดพลาด', err.message, 'error'); }
            };

            const handleCreateActivity = async (e) => {
                e.preventDefault();
                Swal.fire({ title: 'กำลังบันทึก...', allowOutsideClick: false, didOpen: () => { Swal.showLoading() } });
                try {
                    await runGAS('createActivity', { name: e.target.name.value, date: e.target.date.value, location: e.target.location.value });
                    Swal.fire('สำเร็จ', 'สร้างกิจกรรมเรียบร้อยแล้ว', 'success'); e.target.reset(); reloadData();
                } catch(err) { Swal.fire('ข้อผิดพลาด', err.message, 'error'); }
            };

            const toggleActivityStatus = async (id, currentStatus) => {
                Swal.fire({ title: 'กำลังอัปเดต...', allowOutsideClick: false, didOpen: () => { Swal.showLoading() } });
                try { 
                    const newStatus = currentStatus === 'open' ? 'closed' : 'open';
                    await runGAS('toggleActivityStatus', id, currentStatus); 
                    setAdminData(prev => ({
                        ...prev,
                        activities: prev.activities.map(a => a.ActivityID === id ? { ...a, Status: newStatus } : a)
                    }));
                    Swal.close(); 
                    Swal.fire({ toast: true, position: 'top-end', showConfirmButton: false, timer: 1500, icon: 'success', title: `อัปเดตสถานะแล้ว` });
                } catch(err) { Swal.fire('ข้อผิดพลาด', err.message, 'error'); }
            };

            const handleToggleShirtSystem = async (currentStatus) => {
                Swal.fire({ title: 'กำลังอัปเดต...', allowOutsideClick: false, didOpen: () => { Swal.showLoading() } });
                try { 
                    const newStatus = currentStatus === 'open' ? 'closed' : 'open';
                    await runGAS('toggleShirtStatus', currentStatus); 
                    setAdminData(prev => ({
                        ...prev,
                        shirtPrice: { ...prev.shirtPrice, status: newStatus }
                    }));
                    Swal.close(); 
                    Swal.fire({ toast: true, position: 'top-end', showConfirmButton: false, timer: 1500, icon: 'success', title: `อัปเดตสถานะระบบแล้ว` });
                } catch(err) { Swal.fire('ข้อผิดพลาด', err.message, 'error'); }
            };

            const handleUpdateShirtPrice = async () => {
                const { value: formValues } = await Swal.fire({
                    title: 'ตั้งค่าราคา',
                    html: `<div class="text-left text-xs font-bold uppercase tracking-widest text-gray-500 mb-2">S, M, L (บาท)</div><input id="swal-n" type="number" class="w-full border-2 border-gray-200 p-4 mb-4 rounded-xl outline-none focus:border-brand-500 text-lg font-bold" value="${data.shirtPrice?.normal||250}"><div class="text-left text-xs font-bold uppercase tracking-widest text-gray-500 mb-2">XL, 2XL, 3XL (บาท)</div><input id="swal-o" type="number" class="w-full border-2 border-gray-200 p-4 rounded-xl outline-none focus:border-brand-500 text-lg font-bold" value="${data.shirtPrice?.oversize||380}">`,
                    showCancelButton: true, confirmButtonColor: '#ff621f', cancelButtonColor: '#f1f5f9', 
                    customClass: { cancelButton: 'text-gray-700 font-bold', confirmButton: 'font-bold' },
                    cancelButtonText: 'ยกเลิก', confirmButtonText: 'บันทึก',
                    preConfirm: () => ({ normal: document.getElementById('swal-n').value, oversize: document.getElementById('swal-o').value })
                });
                if (formValues) { 
                    Swal.fire({ title: 'กำลังบันทึก...', allowOutsideClick: false, didOpen: () => { Swal.showLoading() } }); 
                    try { 
                        await runGAS('updateShirtPrice', formValues); 
                        setAdminData(prev => ({
                            ...prev,
                            shirtPrice: { ...prev.shirtPrice, normal: formValues.normal, oversize: formValues.oversize }
                        }));
                        Swal.close(); 
                        Swal.fire({ toast: true, position: 'top-end', showConfirmButton: false, timer: 1500, icon: 'success', title: `อัปเดตราคาสำเร็จ` });
                    } catch (err) { Swal.fire('ข้อผิดพลาด', err.message, 'error'); } 
                }
            };

            const handleUpdateReceiptConfig = async () => {
                const { value: formValues } = await Swal.fire({
                    title: 'ตั้งค่าใบเสร็จ',
                    html: `<div class="text-left text-xs font-bold uppercase tracking-widest text-gray-500 mb-2">ส่วนหัว</div><textarea id="swal-h" rows="2" class="w-full border-2 border-gray-200 p-4 mb-4 rounded-xl outline-none focus:border-brand-500 text-sm font-medium">${data.shirtPrice?.receiptHeader||''}</textarea><div class="text-left text-xs font-bold uppercase tracking-widest text-gray-500 mb-2">หมายเหตุ</div><textarea id="swal-n" rows="3" class="w-full border-2 border-gray-200 p-4 rounded-xl outline-none focus:border-brand-500 text-sm font-medium">${data.shirtPrice?.receiptNote||''}</textarea>`,
                    showCancelButton: true, confirmButtonColor: '#ff621f', cancelButtonColor: '#f1f5f9', 
                    customClass: { cancelButton: 'text-gray-700 font-bold', confirmButton: 'font-bold' },
                    cancelButtonText: 'ยกเลิก', confirmButtonText: 'บันทึก',
                    preConfirm: () => ({ header: document.getElementById('swal-h').value, note: document.getElementById('swal-n').value })
                });
                if (formValues) { 
                    Swal.fire({ title: 'กำลังบันทึก...', allowOutsideClick: false, didOpen: () => { Swal.showLoading() } }); 
                    try { 
                        await runGAS('updateReceiptConfig', formValues); 
                        setAdminData(prev => ({
                            ...prev,
                            shirtPrice: { ...prev.shirtPrice, receiptHeader: formValues.header, receiptNote: formValues.note }
                        }));
                        Swal.close(); 
                        Swal.fire({ toast: true, position: 'top-end', showConfirmButton: false, timer: 1500, icon: 'success', title: `อัปเดตใบเสร็จสำเร็จ` });
                    } catch (err) { Swal.fire('ข้อผิดพลาด', err.message, 'error'); } 
                }
            };

            const handleUpdateShirtPopup = async () => {
                const { value: formValues } = await Swal.fire({
                    title: 'ตั้งค่าประกาศและตารางขนาด',
                    html: `
                        <div class="text-left text-xs font-bold uppercase tracking-widest text-gray-500 mb-2">ข้อความประกาศ</div>
                        <textarea id="swal-popup-text" rows="3" class="w-full border-2 border-gray-200 p-4 mb-4 rounded-xl outline-none focus:border-brand-500 text-sm font-medium" placeholder="โปรดตรวจสอบรายละเอียดไซส์ก่อนสั่งซื้อ...">${data.shirtPrice?.popupText || ''}</textarea>
                        <div class="text-left text-xs font-bold uppercase tracking-widest text-gray-500 mb-2">ลิงก์รูปภาพ (ไม่บังคับ)</div>
                        <input id="swal-popup-img" type="text" class="w-full border-2 border-gray-200 p-4 rounded-xl outline-none focus:border-brand-500 text-sm font-medium" placeholder="https://..." value="${data.shirtPrice?.popupImage || ''}">
                        <p class="text-[10px] text-gray-400 mt-2 text-left font-medium tracking-wide">* เว้นว่างไว้เพื่อซ่อนแบนเนอร์</p>
                    `,
                    showCancelButton: true, confirmButtonColor: '#ff621f', cancelButtonColor: '#f1f5f9', 
                    customClass: { cancelButton: 'text-gray-700 font-bold', confirmButton: 'font-bold' },
                    cancelButtonText: 'ยกเลิก', confirmButtonText: 'บันทึก',
                    preConfirm: () => ({ 
                        text: document.getElementById('swal-popup-text').value, 
                        image: document.getElementById('swal-popup-img').value 
                    })
                });
                if (formValues) { 
                    Swal.fire({ title: 'กำลังบันทึก...', allowOutsideClick: false, didOpen: () => { Swal.showLoading() } }); 
                    try { 
                        await runGAS('updateShirtPopup', formValues); 
                        setAdminData(prev => ({
                            ...prev,
                            shirtPrice: { ...prev.shirtPrice, popupText: formValues.text, popupImage: formValues.image }
                        }));
                        Swal.close(); 
                        Swal.fire({ toast: true, position: 'top-end', showConfirmButton: false, timer: 1500, icon: 'success', title: `บันทึกสำเร็จ` });
                    } catch (err) { Swal.fire('ข้อผิดพลาด', err.message, 'error'); } 
                }
            };

            const handleImportCSV = (e) => {
                const file = e.target.files[0]; if(!file) return;
                Papa.parse(file, { header: true, skipEmptyLines: true, complete: async function(results) {
                    if(results.data.length === 0) return Swal.fire('ข้อผิดพลาด', 'ไฟล์ CSV ว่างเปล่า', 'error');
                    Swal.fire({ title: `กำลังนำเข้า ${results.data.length} รายการ...`, didOpen: () => { Swal.showLoading() } });
                    try { const res = await runGAS('importCheckins', results.data); if(res.success) { Swal.fire('สำเร็จ', `นำเข้าแล้ว ${res.count} รายการ`, 'success'); reloadData(); } else Swal.fire('ข้อผิดพลาด', res.error, 'error'); } catch(err) { Swal.fire('ข้อผิดพลาด', err.message, 'error'); } e.target.value = '';
                }});
            };

            const renderSpssContent = () => {
                if(!selectedActivityForSpss) return <div id="spss-ex" className="text-center py-24 text-gray-400 font-bold border-2 border-dashed border-gray-200 rounded-3xl bg-gray-50 flex flex-col items-center justify-center gap-4"><i className="fa-solid fa-chart-bar text-4xl text-gray-300"></i> กรุณาเลือกกิจกรรมเพื่อดูรายงาน</div>;
                const selectedActivityName = data.activities.find(a=>String(a.ActivityID)===String(selectedActivityForSpss))?.Name;
                const evals = data.evaluations.filter(e => String(e.ActivityName).trim() === String(selectedActivityName).trim());
                if(evals.length === 0) return <div id="spss-ex" className="text-center py-24 text-gray-400 font-bold border-2 border-dashed border-gray-200 rounded-3xl bg-gray-50 flex flex-col items-center justify-center gap-4"><i className="fa-solid fa-folder-open text-4xl text-gray-300"></i> ไม่พบข้อมูลการประเมิน</div>;

                const actCheckins = data.checkins.filter(c => String(c.ActivityID).trim() === String(selectedActivityForSpss).trim());
                let mCount = 0; let fCount = 0;
                actCheckins.forEach(c => {
                    if (c.Name && c.Name.trim().startsWith('นาย')) mCount++;
                    else if (c.Name) fCount++;
                });
                const totalDemo = mCount + fCount || 1;
                const mPct = ((mCount / totalDemo) * 100).toFixed(2);
                const fPct = ((fCount / totalDemo) * 100).toFixed(2);
                
                const majorityGender = mCount >= fCount ? 'ชาย' : 'หญิง';
                const majorityCount = mCount >= fCount ? mCount : fCount;
                const majorityPct = mCount >= fCount ? mPct : fPct;
                const minorityGender = mCount >= fCount ? 'หญิง' : 'ชาย';
                const minorityCount = mCount >= fCount ? fCount : mCount;
                const minorityPct = mCount >= fCount ? fPct : mPct;

                const getMeaning = (m) => m >= 4.5 ? 'มากที่สุด' : m >= 3.5 ? 'มาก' : m >= 2.5 ? 'ปานกลาง' : m >= 1.5 ? 'น้อย' : 'น้อยที่สุด';
                const qStats = []; let overallIdx = 1;
                let allScoresForGrand = [];
                
                surveyData.forEach(cat => {
                    cat.questions.forEach(q => {
                        const hKey = ['Q1_1','Q1_2','Q1_3','Q1_4','Q2_1','Q2_2','Q2_3','Q2_4','Q3_1','Q3_2','Q3_3','Q3_4','Q3_5'][overallIdx - 1];
                        const scores = evals.map(e => {
                            let val = e[hKey];
                            if (val === undefined || val === null || val === '') val = e[`q${overallIdx}`];
                            return Number(val) || 0;
                        }).filter(s => s > 0);
                        
                        allScoresForGrand.push(...scores);

                        const n = scores.length; let mean = 0, sd = 0;
                        if(n > 0) { 
                            mean = scores.reduce((a,b)=>a+b, 0) / n; 
                            if(n > 1) sd = Math.sqrt(scores.reduce((a,b)=>a+Math.pow(b-mean, 2), 0) / (n - 1)); 
                        }
                        qStats.push({ no: overallIdx, text: q.text.split(' ').slice(1).join(' '), n, mean, sd });
                        overallIdx++;
                    });
                });
                
                let grandMean = 0, grandSd = 0;
                if (allScoresForGrand.length > 0) {
                    grandMean = allScoresForGrand.reduce((a,b)=>a+b, 0) / allScoresForGrand.length;
                    if (allScoresForGrand.length > 1) {
                        grandSd = Math.sqrt(allScoresForGrand.reduce((a,b)=>a+Math.pow(b-grandMean, 2), 0) / (allScoresForGrand.length - 1));
                    }
                }

                const sortedQStats = [...qStats].sort((a,b) => b.mean - a.mean);
                const top1 = sortedQStats[0] || {text: '-', mean: 0};
                const top2 = sortedQStats[1] || {text: '-', mean: 0};
                const top3 = sortedQStats[2] || {text: '-', mean: 0};

                const validComments = evals
                    .map(e => e.Comment || e.Suggestion)
                    .filter(c => {
                        if (!c) return false;
                        const text = String(c).trim();
                        return text !== '' && text !== '-' && text !== '.' && text !== 'ไม่มี' && text !== 'ไม่มีครับ' && text !== 'ไม่มีค่ะ' && text !== 'ไม่มีข้อเสนอแนะ';
                    });

                return (
                    <div id="spss-ex" className="overflow-x-auto border border-gray-200 bg-white p-10 rounded-3xl shadow-sm">
                        <div style={{ display: 'none' }} className="word-export-title">
                            <h3 style={{ textAlign: 'center', fontSize: '16pt', fontWeight: 'bold' }}>รายงานผลการประเมินความพึงพอใจ</h3>
                            <p style={{ textAlign: 'center', marginBottom: '20pt' }}>กิจกรรม: {selectedActivityName}</p>
                        </div>

                        <div className="mb-12 min-w-[600px]">
                            <h4 className="font-bold text-brand-600 mb-4 text-base uppercase tracking-wider flex items-center gap-2"><i className="fa-solid fa-table-list"></i> ตารางที่ 1 ข้อมูลทั่วไป (Demographic Data)</h4>
                            <table className="w-full text-sm text-left border-collapse mb-6 border-2 border-gray-900 rounded-lg overflow-hidden">
                                <thead className="bg-gray-100 border-b-2 border-gray-900 text-gray-900 font-bold uppercase tracking-widest text-[11px]">
                                    <tr>
                                        <th className="p-4 text-center border-r-2 border-gray-900 w-1/3">ข้อมูลทั่วไป</th>
                                        <th className="p-4 text-center border-r-2 border-gray-900 w-1/3">จำนวน (คน)</th>
                                        <th className="p-4 text-center w-1/3">ร้อยละ (%)</th>
                                    </tr>
                                </thead>
                                <tbody className="text-gray-800 font-medium">
                                    <tr className="border-b border-gray-200">
                                        <td className="p-4 font-bold bg-gray-50 text-gray-900" colSpan="3">เพศ</td>
                                    </tr>
                                    <tr className="border-b border-gray-200 hover:bg-gray-50 transition-colors">
                                        <td className="p-4 pl-8 border-r-2 border-gray-900">ชาย</td>
                                        <td className="p-4 text-center border-r-2 border-gray-900">{mCount}</td>
                                        <td className="p-4 text-center">{mPct}</td>
                                    </tr>
                                    <tr className="border-b-2 border-gray-900 hover:bg-gray-50 transition-colors">
                                        <td className="p-4 pl-8 border-r-2 border-gray-900">หญิง</td>
                                        <td className="p-4 text-center border-r-2 border-gray-900">{fCount}</td>
                                        <td className="p-4 text-center">{fPct}</td>
                                    </tr>
                                    <tr className="bg-brand-50 font-bold text-brand-700">
                                        <td className="p-4 text-right border-r-2 border-gray-900">รวม</td>
                                        <td className="p-4 text-center border-r-2 border-gray-900">{mCount + fCount}</td>
                                        <td className="p-4 text-center">100.00</td>
                                    </tr>
                                </tbody>
                            </table>
                            <p className="text-gray-600 text-sm font-medium leading-relaxed indent-8 bg-gray-50 p-4 rounded-xl border border-gray-100">
                                <span className="font-bold text-brand-600">สรุปผล:</span> จากตารางที่ 1 พบว่า ผู้ตอบแบบสอบถามส่วนใหญ่เป็นเพศ{majorityGender} จำนวน {majorityCount} คน คิดเป็นร้อยละ {majorityPct} และเพศ{minorityGender} จำนวน {minorityCount} คน คิดเป็นร้อยละ {minorityPct}
                            </p>
                        </div>

                        <div className="mb-12 min-w-[800px]">
                            <h4 className="font-bold text-brand-600 mb-4 text-base uppercase tracking-wider flex items-center gap-2"><i className="fa-solid fa-chart-line"></i> ตารางที่ 2 ค่าสถิติเชิงพรรณนา (Descriptive Statistics)</h4>
                            <table className="w-full text-sm text-left border-collapse mb-6 border-2 border-gray-900 rounded-lg overflow-hidden">
                                <thead className="bg-gray-100 border-b-2 border-gray-900 text-gray-900 font-bold uppercase tracking-widest text-[11px]">
                                    <tr>
                                        <th className="p-4 text-center border-r-2 border-gray-900 w-12">ข้อ</th>
                                        <th className="p-4 border-r-2 border-gray-900">รายการประเมิน</th>
                                        <th className="p-4 text-center border-r-2 border-gray-900 w-20">x̄</th>
                                        <th className="p-4 text-center border-r-2 border-gray-900 w-20">S.D.</th>
                                        <th className="p-4 text-center w-24">ระดับ</th>
                                    </tr>
                                </thead>
                                <tbody className="text-gray-800 font-medium">
                                    {qStats.map(q => (
                                        <tr key={q.no} className="border-b border-gray-200 hover:bg-gray-50 transition-colors">
                                            <td className="p-4 text-center border-r-2 border-gray-900 text-gray-500 font-bold">{q.no}</td>
                                            <td className="p-4 border-r-2 border-gray-900">{q.text}</td>
                                            <td className="p-4 text-center border-r-2 border-gray-900 text-brand-600 font-bold">{q.mean.toFixed(2)}</td>
                                            <td className="p-4 text-center border-r-2 border-gray-900 text-gray-500">{q.sd.toFixed(2)}</td>
                                            <td className="p-4 text-center font-bold">{getMeaning(q.mean)}</td>
                                        </tr>
                                    ))}
                                    <tr className="bg-brand-50 font-bold border-t-2 border-gray-900 text-brand-700">
                                        <td className="p-5 text-right border-r-2 border-gray-900" colSpan="2">รวมเฉลี่ย</td>
                                        <td className="p-5 text-center border-r-2 border-gray-900 text-xl">{grandMean.toFixed(2)}</td>
                                        <td className="p-5 text-center border-r-2 border-gray-900">{grandSd.toFixed(2)}</td>
                                        <td className="p-5 text-center text-lg">{getMeaning(grandMean)}</td>
                                    </tr>
                                </tbody>
                            </table>
                            <p className="text-gray-600 text-sm font-medium leading-relaxed indent-8 bg-gray-50 p-4 rounded-xl border border-gray-100">
                                <span className="font-bold text-brand-600">สรุปผล:</span> ผลการสำรวจความพึงพอใจในการจัดกิจกรรม พบว่า ผู้ตอบแบบสอบถามส่วนใหญ่มีความพึงพอใจในระดับ<span className="font-bold text-gray-900">{getMeaning(grandMean)}</span> โดยมีค่าเฉลี่ยเท่ากับ <span className="font-bold text-brand-600">{grandMean.toFixed(2)}</span> ซึ่งเมื่อพิจารณาเป็นรายข้อ พบว่า <span className="text-gray-900 font-bold">{top1.text}</span> (ค่าเฉลี่ย {top1.mean.toFixed(2)}) รองลงมาคือ <span className="text-gray-900 font-bold">{top2.text}</span> (ค่าเฉลี่ย {top2.mean.toFixed(2)}) อันดับที่ 3 คือ <span className="text-gray-900 font-bold">{top3.text}</span> (ค่าเฉลี่ย {top3.mean.toFixed(2)})
                            </p>
                        </div>

                        <div className="mt-12 pt-8 border-t-2 border-gray-100">
                            <h4 className="font-bold text-brand-600 mb-6 text-base uppercase tracking-wider flex items-center gap-2"><i className="fa-regular fa-comments"></i> สรุปข้อเสนอแนะเพิ่มเติม (Qualitative Feedback)</h4>
                            <div className="bg-[#FAF9F8] p-8 rounded-2xl border border-gray-200 text-sm text-gray-700 font-medium leading-relaxed shadow-inner">
                                {validComments.length > 0 ? (
                                    <>
                                        <p className="indent-8 mb-6">
                                            จากการเก็บรวบรวมข้อมูลเชิงคุณภาพ (Qualitative Data) ในส่วนของข้อเสนอแนะเพิ่มเติมจากผู้เข้าร่วมกิจกรรม 
                                            พบว่ามีผู้แสดงความคิดเห็นและให้ข้อเสนอแนะเพื่อการพัฒนาปรับปรุงจำนวนทั้งสิ้น <span className="font-bold text-brand-600 text-lg mx-1">{validComments.length}</span> รายการ 
                                            โดยสามารถรวบรวมและสรุปประเด็นข้อคิดเห็นได้ดังนี้:
                                        </p>
                                        <ul className="list-decimal pl-10 space-y-4 mb-8 text-gray-900 font-bold bg-white p-6 rounded-xl border border-gray-100 shadow-sm">
                                            {validComments.map((comment, idx) => (
                                                <li key={idx} className="pl-2 border-b border-gray-100 pb-3 last:border-0 last:pb-0">{comment}</li>
                                            ))}
                                        </ul>
                                        <p className="indent-8">
                                            <span className="font-bold text-brand-600">แนวทางการนำไปใช้ประโยชน์:</span> ข้อเสนอแนะดังกล่าวสะท้อนให้เห็นถึงความต้องการและมุมมองของผู้เข้าร่วมกิจกรรม 
                                            ซึ่งเป็นข้อมูลที่เป็นประโยชน์อย่างยิ่งต่อคณะผู้จัดทำโครงการ ในการนำไปใช้วิเคราะห์และเป็นแนวทางสำหรับการวางแผน ปรับปรุง 
                                            และพัฒนารูปแบบการจัดกิจกรรมในครั้งต่อไปให้มีประสิทธิภาพ และตอบสนองต่อความมุ่งหวังของผู้เข้าร่วมโครงการได้อย่างดียิ่งขึ้น
                                        </p>
                                    </>
                                ) : (
                                    <div className="text-center py-10 flex flex-col items-center">
                                        <div className="w-16 h-16 bg-white rounded-full flex items-center justify-center text-gray-300 text-2xl mb-4 shadow-sm border border-gray-100"><i className="fa-solid fa-comment-slash"></i></div>
                                        <p className="text-gray-500 font-bold">ไม่มีผู้เข้าร่วมกิจกรรมท่านใดให้ข้อเสนอแนะเพิ่มเติม</p>
                                        <p className="text-gray-400 font-light mt-2 max-w-lg mx-auto">แต่อย่างไรก็ตาม คณะผู้จัดทำโครงการจะนำผลการประเมินเชิงปริมาณจากตารางข้างต้น ไปวิเคราะห์และใช้เป็นแนวทางในการวางแผนและพัฒนาการจัดกิจกรรมในลำดับต่อไป</p>
                                    </div>
                                )}
                            </div>
                        </div>

                    </div>
                );
            };

            const indexOfLastItem = currentPage * itemsPerPage;
            const indexOfFirstItem = indexOfLastItem - itemsPerPage;
            const currentCheckins = sortedCheckins.slice(indexOfFirstItem, indexOfLastItem);
            const totalPages = Math.ceil(sortedCheckins.length / itemsPerPage) || 1;

            const currentShirtOrders = sortedShirtOrders.slice((shirtOrderPage - 1) * shirtItemsPerPage, shirtOrderPage * shirtItemsPerPage);
            const totalShirtPages = Math.ceil(sortedShirtOrders.length / shirtItemsPerPage) || 1;

            return (
                <div className="min-h-screen bg-gray-50 flex flex-col md:flex-row transition-colors selection:bg-brand-500 selection:text-white">
                    <aside className="w-full md:w-72 bg-[#0f172a] text-gray-400 flex-shrink-0 flex flex-col z-20 shadow-2xl">
                        <div className="p-8 border-b border-gray-800/50 bg-[#0b1120]">
                            <div className="w-12 h-12 bg-gradient-icon text-white rounded-xl flex items-center justify-center shadow-glow mb-4 text-xl">
                                <i className="fa-solid fa-layer-group"></i>
                            </div>
                            <h2 className="text-xl font-bold tracking-widest uppercase text-white">พื้นที่ทำงาน</h2>
                            <p className="text-[10px] text-gray-500 font-medium tracking-widest uppercase mt-1">Admin Dashboard</p>
                        </div>
                        <nav className="flex-1 py-8 space-y-2 px-4">
                            {['overview', 'activities', 'summary', 'spss', 'shirt_summary'].map(tab => {
                                const labels = { overview: 'ภาพรวมระบบ', activities: 'จัดการกิจกรรม', summary: 'ข้อมูลเช็คชื่อ', spss: 'รายงานประเมินผล', shirt_summary: 'ระบบสั่งจองเสื้อ' };
                                const icons = { overview: 'fa-chart-pie', activities: 'fa-list', summary: 'fa-users', spss: 'fa-file-lines', shirt_summary: 'fa-shirt' };
                                return (
                                    <button key={tab} onClick={() => setActiveTab(tab)} className={`w-full flex items-center gap-4 px-5 py-4 rounded-xl transition-all text-sm font-bold uppercase tracking-widest ${activeTab === tab ? 'bg-gradient-to-r from-brand-500 to-rose-500 text-white shadow-lg shadow-brand-500/30 translate-x-2' : 'hover:text-white hover:bg-white/5 hover:translate-x-1'}`}>
                                        <i className={`fa-solid ${icons[tab]} w-5 text-lg ${activeTab !== tab && 'text-gray-500'}`}></i> {labels[tab]}
                                    </button>
                                );
                            })}
                        </nav>
                        <div className="p-6 border-t border-gray-800/50 mt-auto bg-[#0b1120]">
                            <p className="text-[10px] text-gray-600 font-bold mb-4 uppercase tracking-[0.2em]">สถานะแพลตฟอร์ม</p>
                            <button onClick={toggleSystem} className={`w-full flex items-center justify-between px-5 py-4 rounded-xl border-2 text-xs font-bold uppercase tracking-widest transition-all mb-4 ${systemOpen ? 'bg-green-500/10 text-green-400 border-green-500/30 hover:bg-green-500 hover:text-white' : 'bg-gray-800 text-gray-400 border-gray-700 hover:bg-gray-700 hover:text-white'}`}>
                                <span>{systemOpen ? 'ออนไลน์' : 'ออฟไลน์'}</span>
                                <i className={`fa-solid ${systemOpen ? 'fa-signal' : 'fa-power-off'} text-lg`}></i>
                            </button>
                            <button onClick={() => { localStorage.removeItem('admin_logged_in'); goHome(); }} className="w-full flex items-center justify-center gap-3 px-5 py-4 rounded-xl bg-gray-800/50 text-xs font-bold uppercase tracking-widest text-gray-400 hover:bg-rose-500 hover:text-white transition-colors">
                                <i className="fa-solid fa-right-from-bracket text-lg"></i> ออกจากระบบ
                            </button>
                        </div>
                    </aside>

                    <main className="flex-1 p-6 md:p-10 lg:p-14 overflow-y-auto">
                        <div className="flex flex-col md:flex-row justify-between items-start md:items-end mb-12 border-b border-gray-200 pb-6 gap-4">
                            <div>
                                <p className="text-[10px] font-bold text-brand-500 tracking-[0.3em] uppercase mb-2">Management System</p>
                                <h2 className="text-3xl font-bold text-gray-900 tracking-tight">
                                    {activeTab === 'overview' && 'ภาพรวมระบบ'}
                                    {activeTab === 'activities' && 'จัดการกิจกรรม'}
                                    {activeTab === 'summary' && 'ข้อมูลการเช็คชื่อ'}
                                    {activeTab === 'spss' && 'รายงานประเมินผล'}
                                    {activeTab === 'shirt_summary' && 'ระบบสั่งจองเสื้อ'}
                                </h2>
                            </div>
                            <button onClick={reloadData} className="text-xs font-bold text-white bg-gray-900 hover:bg-black px-6 py-3 rounded-xl tracking-widest uppercase transition-all shadow-md hover:shadow-lg flex items-center gap-3">
                                <i className="fa-solid fa-rotate-right"></i> ซิงค์ข้อมูลล่าสุด
                            </button>
                        </div>

                        {activeTab === 'overview' && (
                            <div>
                                <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6 mb-12">
                                    <div className="bg-white p-8 rounded-3xl border border-gray-100 shadow-sm flex flex-col justify-between h-44 hover:shadow-md transition-shadow relative overflow-hidden group">
                                        <div className="absolute -right-6 -top-6 w-24 h-24 bg-blue-50 rounded-full group-hover:scale-150 transition-transform duration-500"></div>
                                        <div className="relative z-10 flex justify-between items-start">
                                            <div className="w-12 h-12 rounded-xl bg-blue-100 text-blue-600 flex items-center justify-center text-xl"><i className="fa-solid fa-users"></i></div>
                                        </div>
                                        <div className="relative z-10 mt-auto pt-4">
                                            <p className="text-[10px] text-gray-400 font-bold uppercase tracking-[0.2em] mb-1">ผู้ใช้งานทั้งหมด</p>
                                            <h3 className="text-4xl font-extrabold text-gray-900 tracking-tight">{overviewStats.totalUniqueUsers.toLocaleString()}</h3>
                                        </div>
                                    </div>
                                    
                                    <div className="bg-white p-8 rounded-3xl border border-gray-100 shadow-sm flex flex-col justify-between h-44 hover:shadow-md transition-shadow relative overflow-hidden group">
                                        <div className="absolute -right-6 -top-6 w-24 h-24 bg-emerald-50 rounded-full group-hover:scale-150 transition-transform duration-500"></div>
                                        <div className="relative z-10 flex justify-between items-start">
                                            <div className="w-12 h-12 rounded-xl bg-emerald-100 text-emerald-600 flex items-center justify-center text-xl"><i className="fa-solid fa-clipboard-check"></i></div>
                                        </div>
                                        <div className="relative z-10 mt-auto pt-4">
                                            <p className="text-[10px] text-gray-400 font-bold uppercase tracking-[0.2em] mb-1">ยอดเช็คชื่อรวม</p>
                                            <h3 className="text-4xl font-extrabold text-gray-900 tracking-tight">{(data.checkins?.length || 0).toLocaleString()}</h3>
                                        </div>
                                    </div>
                                    
                                    <div className="bg-white p-8 rounded-3xl border border-gray-100 shadow-sm flex flex-col justify-between h-44 hover:shadow-md transition-shadow relative overflow-hidden group">
                                        <div className="absolute -right-6 -top-6 w-24 h-24 bg-purple-50 rounded-full group-hover:scale-150 transition-transform duration-500"></div>
                                        <div className="relative z-10 flex justify-between items-start">
                                            <div className="w-12 h-12 rounded-xl bg-purple-100 text-purple-600 flex items-center justify-center text-xl"><i className="fa-solid fa-bolt"></i></div>
                                        </div>
                                        <div className="relative z-10 mt-auto pt-4">
                                            <p className="text-[10px] text-gray-400 font-bold uppercase tracking-[0.2em] mb-1">รายการวันนี้</p>
                                            <h3 className="text-4xl font-extrabold text-gray-900 tracking-tight">{overviewStats.todaysTransactions.toLocaleString()}</h3>
                                        </div>
                                    </div>

                                    <div className="bg-gradient-to-br from-brand-500 to-rose-500 p-8 rounded-3xl flex flex-col justify-between h-44 text-white shadow-xl shadow-brand-500/20 relative overflow-hidden">
                                        <div className="absolute right-0 top-0 w-32 h-32 bg-white/10 rounded-full filter blur-2xl"></div>
                                        <div className="relative z-10 flex justify-between items-start">
                                            <div className="w-12 h-12 rounded-xl bg-white/20 border border-white/30 backdrop-blur text-white flex items-center justify-center text-xl shadow-inner"><i className="fa-solid fa-globe"></i></div>
                                            <span className="flex h-3 w-3 relative mt-2 mr-2">
                                                <span className="animate-ping absolute inline-flex h-full w-full rounded-full bg-white opacity-75"></span>
                                                <span className="relative inline-flex rounded-full h-3 w-3 bg-white"></span>
                                            </span>
                                        </div>
                                        <div className="relative z-10 mt-auto pt-4">
                                            <p className="text-[10px] text-white/80 font-bold uppercase tracking-[0.2em] mb-1">ออนไลน์ขณะนี้</p>
                                            <h3 className="text-4xl font-extrabold text-white tracking-tight">{activeUsersCount}</h3>
                                        </div>
                                    </div>
                                </div>

                                <div className="flex justify-between items-center mb-8 border-b border-gray-200 pb-6">
