                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },

                    if (window.lucide) {
                        lucide.createIcons({ root: containerRef.current });
                    }
                }
            }, [name, size, className]);
            return <span ref={containerRef} className="inline-flex items-center justify-center shrink-0" />;
        }

            const { lang } = useContext(AppContext);
            return (
                <div className="flex flex-wrap gap-3">
                    {options.map(opt => {
                        const isActive = value === opt.value;
                        const isAlert = isWarningType && opt.value !== 'ไม่มี' && opt.value !== 'ไม่แพ้';
                        const displayLabel = lang === 'en' ? (DICT_MAPPING[opt.label] || opt.label) : opt.label;
                        
                        return (
                            <button key={opt.value} type="button" onClick={() => onChange(opt.value)}

                            onChange(val);

                        placeholder={placeholder} maxLength={maxLength} required={required}
                        className={`w-full input-modern rounded-xl px-4 py-3.5 text-sm font-semibold shadow-sm ${numeric ? 'font-mono' : ''}`}
                    />
                </div>
            );
        }

        // ==========================================
        // 🛡️ PDPA Modal Component
        // ==========================================

            const handleDecline = () => Swal.fire({ 
                icon: 'warning', 
                title: t('pdpa_decline'), 
                text: t('pdpa_desc'), 
                confirmButtonText: 'OK', 
                confirmButtonColor: '#ff6600', 
                background: isDarkMode ? '#18181b' : '#fff', 
                color: isDarkMode ? '#f8fafc' : '#0f172a', 
                customClass: { popup: 'rounded-[2rem]' }

            const promptAdmin = () => {

                    title: '<h3 class="text-2xl font-black text-slate-800 dark:text-white">Admin Access</h3>',

                    input: 'password',

                    confirmButtonText: 'Login',

                    confirmButtonColor: '#ff6600',
                    background: isDarkMode ? '#18181b' : '#ffffff',

                        input: 'text-center font-mono text-xl tracking-[0.5em] rounded-xl bg-slate-50 dark:bg-black/20 border-slate-200 dark:border-white/10'
                    }
                }).then((result) => {
                    if (result.isConfirmed) {
                        if (result.value === '000000') {
                            onAdminClick();

                                icon: 'error',
                                title: 'Error',
                                text: 'Invalid Password',
                                confirmButtonColor: '#ff6600',
                                background: isDarkMode ? '#18181b' : '#ffffff',
                                color: isDarkMode ? '#ffffff' : '#0f172a',

            return (

                    <div className="bg-white dark:bg-zinc-900 w-full sm:max-w-3xl relative flex flex-col h-[92vh] sm:h-auto sm:max-h-[90vh] rounded-t-[2rem] sm:rounded-[2.5rem] shadow-[0_-10px_40px_rgba(0,0,0,0.2)] sm:shadow-[0_20px_60px_rgba(0,0,0,0.3)] animate-slide-up overflow-hidden">
                        <div className="absolute top-0 left-0 right-0 h-1.5 sm:h-2 brand-gradient z-20"></div>

                        <button onClick={promptAdmin} className="absolute top-4 sm:top-5 right-4 sm:right-5 p-2.5 sm:p-3 text-slate-400 hover:text-brand bg-slate-50/50 dark:bg-black/20 hover:bg-slate-100 dark:hover:bg-white/10 backdrop-blur-md transition-all z-20 rounded-full shadow-sm hover:shadow-md border border-slate-200/50 dark:border-white/5" title="Admin Login">
                            <Icon name="lock" size={16} className="sm:w-[18px] sm:h-[18px]" />
                        </button>
                        
                        <div className="p-5 sm:p-8 pt-8 sm:pt-8 pb-4 sm:pb-5 bg-white dark:bg-zinc-900 border-b border-slate-100 dark:border-white/5 flex items-start gap-4 relative overflow-hidden shrink-0">
                            <div className="absolute -right-8 -top-8 opacity-[0.03] text-brand transform rotate-12 pointer-events-none"><Icon name="shield-check" size={120}/></div>
                            <div className="p-3 bg-brand/10 dark:bg-brand/20 rounded-2xl shrink-0 shadow-inner relative z-10 hidden sm:block">
                                <Icon name="shield-check" size={32} className="text-brand" />
                            </div>
                            <div className="relative z-10 w-full pr-8 sm:pr-0">
                                <div className="inline-flex items-center gap-1.5 px-2.5 py-1 bg-slate-100 dark:bg-white/10 text-slate-600 dark:text-slate-300 text-[10px] font-black tracking-widest uppercase rounded-lg mb-1.5 shadow-sm">
                                    <Icon name="shield" size={10} className="text-brand sm:hidden" /> Privacy Policy
                                </div>
                                <h2 className="text-xl sm:text-3xl font-black text-slate-800 dark:text-white leading-tight">{t('pdpa_policy')}</h2>
                                <p className="text-brand dark:text-brandLight text-xs sm:text-sm mt-1 font-semibold">{t('pdpa_subtitle')}</p>
                            </div>
                        </div>
                        
                        <div className="p-5 sm:p-8 overflow-y-auto custom-scrollbar flex-1 bg-slate-50/50 dark:bg-black/20">
                            <p className="text-slate-600 dark:text-slate-300 text-sm mb-5 leading-relaxed">{t('pdpa_desc')}</p>
                            
                            <div className="grid grid-cols-1 sm:grid-cols-3 gap-3 sm:gap-4 mb-5 sm:mb-6">
                                <div className="bg-white dark:bg-zinc-800/80 p-4 sm:p-5 rounded-2xl border border-slate-200/60 dark:border-white/5 shadow-sm hover:shadow-md transition-all flex flex-row sm:flex-col items-center sm:items-start gap-4 sm:gap-0 text-left">
                                    <div className="w-10 h-10 sm:mb-3 bg-blue-50 dark:bg-blue-500/10 text-blue-600 rounded-xl flex items-center justify-center shrink-0"><Icon name="user" size={18}/></div>
                                    <div>
                                        <h4 className="font-bold text-slate-800 dark:text-white text-sm sm:mb-1">{t('pdpa_card1_title')}</h4>
                                        <p className="text-[11px] sm:text-xs text-slate-500 dark:text-slate-400 leading-snug">{t('pdpa_card1_desc')}</p>
                                    </div>
                                </div>
                                
                                <div className="bg-white dark:bg-zinc-800/80 p-4 sm:p-5 rounded-2xl border border-slate-200/60 dark:border-white/5 shadow-sm hover:shadow-md transition-all flex flex-row sm:flex-col items-center sm:items-start gap-4 sm:gap-0 text-left">
                                    <div className="w-10 h-10 sm:mb-3 bg-orange-50 dark:bg-orange-500/10 text-orange-600 rounded-xl flex items-center justify-center shrink-0"><Icon name="pizza" size={18}/></div>
                                    <div>
                                        <h4 className="font-bold text-slate-800 dark:text-white text-sm sm:mb-1">{t('pdpa_card2_title')}</h4>
                                        <p className="text-[11px] sm:text-xs text-slate-500 dark:text-slate-400 leading-snug">{t('pdpa_card2_desc')}</p>
                                    </div>
                                </div>

                                <div className="bg-white dark:bg-zinc-800/80 p-4 sm:p-5 rounded-2xl border border-slate-200/60 dark:border-white/5 shadow-sm hover:shadow-md transition-all flex flex-row sm:flex-col items-center sm:items-start gap-4 sm:gap-0 text-left">
                                    <div className="w-10 h-10 sm:mb-3 bg-red-50 dark:bg-red-500/10 text-red-600 rounded-xl flex items-center justify-center shrink-0"><Icon name="heart-pulse" size={18}/></div>
                                    <div>
                                        <h4 className="font-bold text-slate-800 dark:text-white text-sm sm:mb-1">{t('pdpa_card3_title')}</h4>
                                        <p className="text-[11px] sm:text-xs text-slate-500 dark:text-slate-400 leading-snug">{t('pdpa_card3_desc')}</p>
                                    </div>
                                </div>
                            </div>

                            <div className="bg-blue-50/80 dark:bg-blue-900/20 border border-blue-100 dark:border-blue-800/30 p-4 rounded-2xl flex items-start gap-3 shadow-sm">
                                <Icon name="shield-alert" className="text-blue-500 mt-0.5 shrink-0" size={16}/>
                                <div className="text-[11px] sm:text-xs text-blue-800 dark:text-blue-300 leading-relaxed">
                                    <span className="font-bold text-blue-900 dark:text-blue-200">{t('pdpa_security')}</span> {t('pdpa_security_desc')}
                                </div>
                            </div>
                        </div>
                        
                        <div className="p-5 sm:p-8 border-t border-slate-100 dark:border-white/5 bg-white dark:bg-zinc-900 shrink-0 pb-6 sm:pb-8">
                            <label className="flex items-start sm:items-center gap-3 cursor-pointer group mb-5 w-full bg-slate-50 dark:bg-white/5 p-4 rounded-xl border border-slate-200 dark:border-white/10 hover:border-brand/50 transition-colors shadow-sm">
                                <input type="checkbox" checked={isChecked} onChange={e => setIsChecked(e.target.checked)} className="hidden" />
                                <div className={`w-5 h-5 sm:w-6 sm:h-6 rounded-md border-2 flex items-center justify-center transition-all shrink-0 mt-0.5 sm:mt-0 ${isChecked ? 'bg-brand border-brand shadow-sm' : 'border-slate-300 dark:border-slate-600 group-hover:border-brand'}`}>
                                    {isChecked && <Icon name="check" size={14} className="text-white"/>}
                                </div>
                                <span className="text-xs sm:text-sm font-bold text-slate-700 dark:text-slate-300 select-none leading-snug">{t('pdpa_checkbox')}</span>
                            </label>

                            <div className="flex flex-col sm:flex-row justify-end gap-3">
                                <button onClick={handleDecline} className="w-full sm:w-auto px-6 py-3.5 sm:py-3.5 rounded-xl bg-slate-100 dark:bg-white/5 text-slate-600 dark:text-slate-400 font-bold hover:bg-slate-200 dark:hover:bg-white/10 transition-colors btn-interactive text-sm">{t('pdpa_decline')}</button>
                                <button 
                                    onClick={() => isChecked ? onAccept() : null} 
                                    disabled={!isChecked}
                                    className={`w-full sm:w-auto px-8 py-3.5 sm:py-3.5 rounded-xl font-bold flex items-center justify-center gap-2 transition-all duration-300 btn-interactive text-sm
                                        ${isChecked ? 'brand-gradient text-white shadow-glow-brand hover:shadow-lg transform hover:-translate-y-0.5' : 'bg-slate-200 dark:bg-white/5 text-slate-400 dark:text-slate-600 border border-slate-300 dark:border-white/10 cursor-not-allowed'}`}
                                >

                            </div>

                    </div>
                </div>
            );
        }

        // ==========================================
        // 📝 Registration Form Component
        // ==========================================
        function RegistrationForm({ onBack, onSuccess }) {
            const { t, lang, isDarkMode } = useContext(AppContext);
            const [formData, setFormData] = useState({
                FullName: '', StudentID: '', IDCard: '', Major: '', 
                Religion: '', BloodGroup: '',
                StudentPhone: '', ParentPhone: '',
                FoodAllergy: '', SpecificDiet: 'ไม่มี', 
                Disease: '', DrugAllergy: ''
            });

            const [hasFoodAllergy, setHasFoodAllergy] = useState(false);
            const [hasDisease, setHasDisease] = useState(false);
            const [hasDrugAllergy, setHasDrugAllergy] = useState(false);
            const [isSubmitting, setIsSubmitting] = useState(false);

            const handleSubmit = async (e) => {
                e.preventDefault();

                if (!formData.FullName || !formData.StudentID || !formData.Major || !formData.Religion || !formData.BloodGroup || !formData.StudentPhone || !formData.ParentPhone) {
                    Swal.fire({ icon: 'warning', title: 'Warning', text: 'Please fill in all required fields (*)', background: isDarkMode?'#18181b':'#fff', color: isDarkMode?'#f8fafc':'#0f172a' });
                    return;
                }

                if (formData.StudentID && formData.StudentID.length !== 9) {
                    Swal.fire({ icon: 'warning', title: 'Warning', text: 'Student ID must be 9 digits', background: isDarkMode?'#18181b':'#fff', color: isDarkMode?'#f8fafc':'#0f172a' });
                    return;
                }

                if (formData.StudentPhone.length !== 10 || formData.ParentPhone.length !== 10) {
                    Swal.fire({ icon: 'warning', title: 'Warning', text: 'Phone numbers must be 10 digits', background: isDarkMode?'#18181b':'#fff', color: isDarkMode?'#f8fafc':'#0f172a' });
                    return;
                }

                const finalData = {
                    ...formData,
                    FoodAllergy: hasFoodAllergy ? formData.FoodAllergy : 'ไม่แพ้',
                    Disease: hasDisease ? formData.Disease : 'ไม่มี',
                    DrugAllergy: hasDrugAllergy ? formData.DrugAllergy : 'ไม่แพ้'
                };

                setIsSubmitting(true);
                Swal.fire({ title: 'Loading...', allowOutsideClick: false, didOpen: () => Swal.showLoading(), background: isDarkMode?'#18181b':'#fff', color: isDarkMode?'#f8fafc':'#0f172a' });

                try {
                    const res = await submitToAPI('register', finalData);
                    if (res.success) {
                        Swal.close();
                        onSuccess();
                    } else {
                        throw new Error(res.message || "Error saving data");
                    }
                } catch (err) {
                    Swal.fire({ icon: 'error', title: 'Error', text: err.message, background: isDarkMode?'#18181b':'#fff', color: isDarkMode?'#f8fafc':'#0f172a' });
                } finally {
                    setIsSubmitting(false);
                }
            };

            return (
                <div className="max-w-4xl mx-auto animate-fade-in pb-10">
                    <button onClick={onBack} className="flex items-center gap-2 text-slate-500 hover:text-brand font-bold text-sm mb-6 transition-colors px-2">
                        <Icon name="arrow-left" size={16} /> {t('back')}
                    </button>

                    <form onSubmit={handleSubmit} className="space-y-6 md:space-y-8">
                        <div className="glass-panel p-6 md:p-8 rounded-[2.5rem] border border-slate-200/50 dark:border-white/5 shadow-soft">
                            <SectionHeader icon="user" title={t('form_personal_title')} colorClass="bg-blue-100 dark:bg-blue-500/20 text-blue-600" />
                            <div className="grid grid-cols-1 md:grid-cols-2 gap-5">
                                <InputField label={t('form_fullname')} value={formData.FullName} onChange={v => setFormData({...formData, FullName: v})} placeholder="John Doe" required />
                                
                                <div className="flex flex-col gap-1.5">
                                    <label className="text-xs font-bold text-slate-600 dark:text-slate-400 uppercase tracking-widest">{t('form_major')} <span className="text-red-500">*</span></label>
                                    <div className="relative">
                                        <select value={formData.Major} onChange={e => setFormData({...formData, Major: e.target.value})} required className="w-full appearance-none input-modern rounded-xl pl-4 pr-10 py-3.5 text-sm font-semibold shadow-sm cursor-pointer bg-white/80 dark:bg-black/40">
                                            <option value="">{t('select_option')}</option>
                                            {MAJOR_LIST.map(m => <option key={m} value={m}>{lang === 'en' ? (DICT_MAPPING[m] || m) : m}</option>)}
                                        </select>
                                        <div className="absolute right-4 top-1/2 -translate-y-1/2 text-slate-400 pointer-events-none"><Icon name="chevron-down" size={16}/></div>
                                    </div>
                                </div>

                                <InputField label={t('form_studentid')} value={formData.StudentID} onChange={v => setFormData({...formData, StudentID: v})} placeholder="67xxxxxxx" numeric required maxLength="9" />
                                <InputField label={t('form_idcard')} value={formData.IDCard} onChange={v => setFormData({...formData, IDCard: v})} placeholder="13 digits or Passport" maxLength="20" />
                                
                                <div className="flex flex-col gap-1.5">
                                    <label className="text-xs font-bold text-slate-600 dark:text-slate-400 uppercase tracking-widest">{t('form_religion')} <span className="text-red-500">*</span></label>
                                    <div className="relative">
                                        <select value={formData.Religion} onChange={e => setFormData({...formData, Religion: e.target.value})} required className="w-full appearance-none input-modern rounded-xl pl-4 pr-10 py-3.5 text-sm font-semibold shadow-sm cursor-pointer bg-white/80 dark:bg-black/40">
                                            <option value="">{t('select_option')}</option>
                                            {['พุทธ', 'อิสลาม', 'คริสต์', 'อื่นๆ'].map(r => <option key={r} value={r}>{lang === 'en' ? DICT_MAPPING[r] : r}</option>)}
                                        </select>
                                        <div className="absolute right-4 top-1/2 -translate-y-1/2 text-slate-400 pointer-events-none"><Icon name="chevron-down" size={16}/></div>
                                    </div>
                                </div>

                                <div className="flex flex-col gap-1.5">
                                    <label className="text-xs font-bold text-slate-600 dark:text-slate-400 uppercase tracking-widest">{t('form_blood')} <span className="text-red-500">*</span></label>
                                    <div className="relative">
                                        <select value={formData.BloodGroup} onChange={e => setFormData({...formData, BloodGroup: e.target.value})} required className="w-full appearance-none input-modern rounded-xl pl-4 pr-10 py-3.5 text-sm font-semibold shadow-sm cursor-pointer bg-white/80 dark:bg-black/40">
                                            <option value="">{t('select_option')}</option>
                                            <option value="A">A</option>
                                            <option value="B">B</option>
                                            <option value="O">O</option>
                                            <option value="AB">AB</option>
                                        </select>
                                        <div className="absolute right-4 top-1/2 -translate-y-1/2 text-slate-400 pointer-events-none"><Icon name="chevron-down" size={16}/></div>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div className="glass-panel p-6 md:p-8 rounded-[2.5rem] border-t-[8px] border-t-emerald-500 border border-slate-200/50 dark:border-white/5 shadow-soft">
                            <SectionHeader icon="phone" title={t('form_contact_title')} colorClass="bg-emerald-100 dark:bg-emerald-500/20 text-emerald-600" />
                            <div className="grid grid-cols-1 md:grid-cols-2 gap-5">
                                <InputField label={t('form_student_phone')} value={formData.StudentPhone} onChange={v => setFormData({...formData, StudentPhone: v})} placeholder="08xxxxxxxx" numeric required maxLength="10" />
                                <InputField label={t('form_parent_phone')} value={formData.ParentPhone} onChange={v => setFormData({...formData, ParentPhone: v})} placeholder="08xxxxxxxx" numeric required maxLength="10" />
                            </div>
                        </div>

                        <div className="glass-panel p-6 md:p-8 rounded-[2.5rem] border-t-[8px] border-t-orange-500 border border-slate-200/50 dark:border-white/5 shadow-soft">
                            <SectionHeader icon="pizza" title={t('form_nutrition_title')} colorClass="bg-orange-100 dark:bg-orange-500/20 text-orange-600" />
                            <div className="space-y-6">
                                <div>
                                    <label className="text-sm font-bold text-slate-700 dark:text-slate-300 mb-3 block">{t('form_diet')} <span className="text-red-500">*</span></label>
                                    <TogglePill 
                                        options={[{label: 'ไม่มี', value: 'ไม่มี'}, {label: 'ฮาลาล', value: 'ฮาลาล'}, {label: 'มังสวิรัติ', value: 'มังสวิรัติ'}, {label: 'เจ', value: 'เจ'}]}
                                        value={formData.SpecificDiet}
                                        onChange={v => setFormData({...formData, SpecificDiet: v})}
                                        isWarningType={true}
                                    />
                                </div>
                                
                                <div className="p-5 bg-orange-50 dark:bg-orange-950/20 border border-orange-100 dark:border-orange-900/30 rounded-2xl">
                                    <label className="text-sm font-bold text-slate-700 dark:text-slate-300 mb-3 block">{t('form_food_allergy')} <span className="text-red-500">*</span></label>
                                    <div className="flex gap-4 mb-4">
                                        <label className="flex items-center gap-2 cursor-pointer text-sm font-semibold">
                                            <input type="radio" name="foodAllergy" checked={!hasFoodAllergy} onChange={() => setHasFoodAllergy(false)} className="w-4 h-4 text-brand accent-brand" /> {t('form_no_allergy')}
                                        </label>
                                        <label className="flex items-center gap-2 cursor-pointer text-sm font-semibold text-orange-600 dark:text-orange-400">
                                            <input type="radio" name="foodAllergy" checked={hasFoodAllergy} onChange={() => setHasFoodAllergy(true)} className="w-4 h-4 text-brand accent-brand" /> {t('form_has_allergy')}
                                        </label>
                                    </div>
                                    {hasFoodAllergy && (
                                        <div className="animate-slide-up">
                                            <InputField label={t('form_specify_food')} value={formData.FoodAllergy} onChange={v => setFormData({...formData, FoodAllergy: v})} placeholder="e.g. Seafood, Nuts" required={hasFoodAllergy} />
                                        </div>
                                    )}
                                </div>
                            </div>
                        </div>

                        <div className="glass-panel p-6 md:p-8 rounded-[2.5rem] border-t-[8px] border-t-red-500 border border-slate-200/50 dark:border-white/5 shadow-soft">
                            <SectionHeader icon="heart-pulse" title={t('form_health_title')} colorClass="bg-red-100 dark:bg-red-500/20 text-red-600" />
                            <div className="space-y-6">
                                <div className="p-5 bg-red-50/50 dark:bg-red-950/20 border border-red-100 dark:border-red-900/30 rounded-2xl">
                                    <label className="text-sm font-bold text-slate-700 dark:text-slate-300 mb-3 block">{t('form_disease')} <span className="text-red-500">*</span></label>
                                    <div className="flex gap-4 mb-4">
                                        <label className="flex items-center gap-2 cursor-pointer text-sm font-semibold">
                                            <input type="radio" name="disease" checked={!hasDisease} onChange={() => setHasDisease(false)} className="w-4 h-4 accent-red-500" /> {t('form_no_disease')}
                                        </label>
                                        <label className="flex items-center gap-2 cursor-pointer text-sm font-semibold text-red-600 dark:text-red-400">
                                            <input type="radio" name="disease" checked={hasDisease} onChange={() => setHasDisease(true)} className="w-4 h-4 accent-red-500" /> {t('form_has_disease')}
                                        </label>
                                    </div>
                                    {hasDisease && (
                                        <div className="animate-slide-up">
                                            <InputField label={t('form_specify_disease')} value={formData.Disease} onChange={v => setFormData({...formData, Disease: v})} placeholder="e.g. Asthma, Allergies" required={hasDisease} />
                                        </div>
                                    )}
                                </div>

                                <div className="p-5 bg-pink-50/50 dark:bg-pink-950/20 border border-pink-100 dark:border-pink-900/30 rounded-2xl">
                                    <label className="text-sm font-bold text-slate-700 dark:text-slate-300 mb-3 block">{t('form_drug_allergy')} <span className="text-red-500">*</span></label>
                                    <div className="flex gap-4 mb-4">
                                        <label className="flex items-center gap-2 cursor-pointer text-sm font-semibold">
                                            <input type="radio" name="drugAllergy" checked={!hasDrugAllergy} onChange={() => setHasDrugAllergy(false)} className="w-4 h-4 accent-pink-500" /> {t('form_no_drug_allergy')}
                                        </label>
                                        <label className="flex items-center gap-2 cursor-pointer text-sm font-semibold text-pink-600 dark:text-pink-400">
                                            <input type="radio" name="drugAllergy" checked={hasDrugAllergy} onChange={() => setHasDrugAllergy(true)} className="w-4 h-4 accent-pink-500" /> {t('form_has_drug_allergy')}
                                        </label>
                                    </div>
                                    {hasDrugAllergy && (
                                        <div className="animate-slide-up">
                                            <InputField label={t('form_specify_drug')} value={formData.DrugAllergy} onChange={v => setFormData({...formData, DrugAllergy: v})} placeholder="e.g. Penicillin" required={hasDrugAllergy} />
                                        </div>
                                    )}
                                </div>
                            </div>
                        </div>

                        <div className="pt-4 flex justify-center">
                            <button 
                                type="submit" 
                                disabled={isSubmitting}
                                className="w-full md:w-auto min-w-[280px] py-4 px-8 brand-gradient text-white rounded-2xl font-black text-lg shadow-glow-brand hover:shadow-lg transform hover:-translate-y-1 transition-all btn-interactive flex items-center justify-center gap-2"
                            >
                                {isSubmitting ? <Icon name="loader-2" className="animate-spin" /> : <Icon name="save" />}
                                {t('form_submit')}
                            </button>
                        </div>
                    </form>
                </div>
            );
        }

        // ==========================================
        // ✅ Success View Component
        // ==========================================
        function SuccessView({ onHome }) {
            const { t } = useContext(AppContext);
            return (
                <div className="flex items-center justify-center min-h-[80vh] p-4 animate-fade-in">
                    <div className="glass-panel p-8 md:p-12 rounded-[3rem] text-center max-w-md w-full animate-slide-up shadow-2xl border-t-8 border-t-emerald-500">
                        <div className="w-24 h-24 bg-emerald-100 dark:bg-emerald-500/20 text-emerald-500 rounded-full flex items-center justify-center mx-auto mb-6 shadow-inner relative">
                            <Icon name="check-circle" size={48} className="relative z-10" />
                            <div className="absolute inset-0 bg-emerald-400 rounded-full blur-xl opacity-30 animate-pulse"></div>
                        </div>
                        <h2 className="text-3xl font-black text-slate-800 dark:text-white mb-3 tracking-tight">{t('success_title')}</h2>
                        <p className="text-slate-500 dark:text-slate-400 font-medium mb-8 leading-relaxed">
                            {t('success_desc')}
                        </p>
                        <button onClick={onHome} className="w-full py-4 bg-slate-100 dark:bg-white/10 text-slate-800 dark:text-white rounded-xl font-bold hover:bg-slate-200 dark:hover:bg-white/20 transition-colors shadow-sm flex justify-center items-center gap-2 btn-interactive">
                            <Icon name="home" size={18} /> {t('success_home')}
                        </button>
                    </div>
                </div>
            );
        }

        // ==========================================
        // 📊 Admin Dashboard Component
        // ==========================================
        function AdminDashboard({ goBack }) {
            const { t, lang, isDarkMode } = useContext(AppContext);
            const [data, setData] = useState([]);
            const [loading, setLoading] = useState(true);
            const [selectedMajor, setSelectedMajor] = useState(null);
            const [selectedSurveillanceStudent, setSelectedSurveillanceStudent] = useState(null);
            const [editItem, setEditItem] = useState(null);
            const [activeTab, setActiveTab] = useState('overview');
            const [drilldownData, setDrilldownData] = useState({ title: '', list: [], type: '' });
            const [currentPage, setCurrentPage] = useState(1);
            const [searchTerm, setSearchTerm] = useState('');
            const [executiveMajor, setExecutiveMajor] = useState('ทั้งหมด');

            const loadData = (isSilent = false) => {
                if (!isSilent) setLoading(true);
                Papa.parse(`${SHEET_CSV_URL}&_cb=${new Date().getTime()}`, {
                    download: true, header: true,
                    complete: (res) => {
                        setData(res.data.filter(row => row.StudentID).map(r => ({ ...r, Major: cleanMajor(r.Major) })));
                        if (!isSilent) setLoading(false);
                    },
                    error: () => { 
                        if (!isSilent) Swal.fire('Error', 'Database Connection Failed', 'warning'); 
                        if (!isSilent) setLoading(false); 
                    }
                });
            };

            useEffect(() => { 
                loadData();
                const intervalId = setInterval(() => { loadData(true); }, 1000);
                return () => clearInterval(intervalId);
            }, []);

            const executiveBaseMajors = useMemo(() => {
                const mSet = new Set();
                data.forEach(r => {
                    if(r.Major) mSet.add(r.Major.replace(/\s*\(เทียบโอน\)/g, '').trim());
                });
                return Array.from(mSet).sort();
            }, [data]);

            const filteredData = useMemo(() => {
                let result = data;
                if (searchTerm) {
                    const s = searchTerm.toLowerCase();
                    result = result.filter(r => 
                        (r.FullName || '').toLowerCase().includes(s) ||
                        (r.StudentID || '').toLowerCase().includes(s) ||
                        (r.Major || '').toLowerCase().includes(s) ||
                        (r.StudentPhone || '').includes(s) ||
                        (r.ParentPhone || '').includes(s)
                    );
                }
                
                if (activeTab === 'executive' && executiveMajor !== 'ทั้งหมด') {
                    result = result.filter(r => {
                        const baseMajor = r.Major ? r.Major.replace(/\s*\(เทียบโอน\)/g, '').trim() : '';
                        return baseMajor === executiveMajor;
                    });
                }
                
                return result;
            }, [data, searchTerm, activeTab, executiveMajor]);

            const stats = useMemo(() => {
                // --- 🌟 ระบบตรวจสอบและกรองข้อมูลซ้ำ (Deduplication) ---
                const uniqueDataMap = new Map();
                
                filteredData.forEach(s => {
                    let uid = null;
                    if (s.StudentID && s.StudentID.trim() !== '') {
                        uid = s.StudentID.trim();
                    } else if (s.IDCard && s.IDCard.trim() !== '') {
                        uid = s.IDCard.trim();
                    }

                    if (uid) {
                        uniqueDataMap.set(uid, s);
                    } else {
                        uniqueDataMap.set(Math.random().toString(), s);
                    }
                });

                const uniqueStudents = Array.from(uniqueDataMap.values());
                // --------------------------------------------------------

                let total = uniqueStudents.length, normalCount = 0, transferCount = 0, foodAlert = 0, healthAlert = 0;
                let majorCount = {}, dietStats = { 'ฮาลาล': 0, 'มังสวิรัติ': 0, 'เจ': 0, 'อาหารปกติ': 0 }, foodAllergies = [], diseases = [], drugAllergies = [];
                const surveillanceList = [];
                let surveillanceRiskPie = { 'ด้านการแพทย์': 0, 'ด้านโภชนาการ': 0, 'ความเสี่ยงซ้อน (ทั้งสอง)': 0 };
                let execBreakdownMap = {}; 
                let allergyCounts = {};

                uniqueStudents.forEach(s => {
                    if(s.Major) {
                        majorCount[s.Major] = (majorCount[s.Major] || 0) + 1;
                        s.Major.includes("เทียบโอน") ? transferCount++ : normalCount++;
                        
                        const baseName = s.Major.replace(/\s*\(เทียบโอน\)/g, '').trim();
                        const isTransfer = s.Major.includes('เทียบโอน');
                        if (!execBreakdownMap[baseName]) {
                            execBreakdownMap[baseName] = { name: baseName, normal: 0, transfer: 0, total: 0 };
                        }
                        if (isTransfer) execBreakdownMap[baseName].transfer++;
                        else execBreakdownMap[baseName].normal++;
                        execBreakdownMap[baseName].total++;
                    }
                    let hasF = s.FoodAllergy !== 'ไม่แพ้' || s.SpecificDiet !== 'ไม่มี';
                    let hasH = s.Disease !== 'ไม่มี' || s.DrugAllergy !== 'ไม่แพ้';
                    if (hasF) foodAlert++; if (hasH) healthAlert++;

                    if (s.FoodAllergy && s.FoodAllergy !== 'ไม่แพ้') {
                        foodAllergies.push(s);
                        let foodStr = s.FoodAllergy.trim();
                        allergyCounts[foodStr] = (allergyCounts[foodStr] || 0) + 1;
                    }
                    
                    if (s.SpecificDiet) {
                        if (s.SpecificDiet === 'ไม่มี') dietStats['อาหารปกติ']++;
                        else if (s.SpecificDiet.includes('ฮาลาล')) dietStats['ฮาลาล']++;
                        else if (s.SpecificDiet.includes('มังสวิรัติ')) dietStats['มังสวิรัติ']++;
                        else if (s.SpecificDiet.includes('เจ')) dietStats['เจ']++;
                    }
                    if (s.Disease && s.Disease !== 'ไม่มี') diseases.push(s);
                    if (s.DrugAllergy && s.DrugAllergy !== 'ไม่แพ้') drugAllergies.push(s);

                    if (hasF || hasH) {
                        let issues = [];
                        if (s.FoodAllergy !== 'ไม่แพ้') issues.push({ type: 'food', text: `${t('form_food_allergy')}: ${s.FoodAllergy}` });
                        if (s.SpecificDiet !== 'ไม่มี') issues.push({ type: 'food', text: `${lang==='en'?'Diet':'อาหาร'}: ${s.SpecificDiet}` });
                        if (s.Disease !== 'ไม่มี') issues.push({ type: 'health', text: `${t('form_disease')}: ${s.Disease}` });
                        if (s.DrugAllergy !== 'ไม่แพ้') issues.push({ type: 'health', text: `${t('form_drug_allergy')}: ${s.DrugAllergy}` });
                        surveillanceList.push({ ...s, issues });

                        if (hasF && hasH) surveillanceRiskPie['ความเสี่ยงซ้อน (ทั้งสอง)']++;
                        else if (hasF) surveillanceRiskPie['ด้านโภชนาการ']++;
                        else if (hasH) surveillanceRiskPie['ด้านการแพทย์']++;
                    }
                });

                const surveillancePieData = Object.keys(surveillanceRiskPie).map(k => ({name: k, value: surveillanceRiskPie[k]})).filter(d => d.value > 0);
                const pieDataList = Object.keys(majorCount).map(k=>({name:k, value:majorCount[k]}));
                const execBreakdownList = Object.values(execBreakdownMap).sort((a,b) => b.total - a.total);
                const groupedAllergies = Object.keys(allergyCounts).map(name => ({name, count: allergyCounts[name]})).sort((a,b) => b.count - a.count);

                return { total, pieData: pieDataList, COLORS: ['#ff6600', '#3b82f6', '#10b981', '#8b5cf6', '#ec4899', '#facc15', '#06b6d4'], foodAlert, healthAlert, surveillanceList, surveillancePieData, normalCount, transferCount, dietStats, foodAllergies, diseases, drugAllergies, execBreakdownList, groupedAllergies };
            }, [filteredData, lang, t]);

            const handleDrilldown = (title, type, key) => {
                let filtered = [];
                if (type === 'all') filtered = filteredData;
                else if (type === 'healthy') filtered = filteredData.filter(s => s.Disease === 'ไม่มี' && s.DrugAllergy === 'ไม่แพ้');
                else if (type === 'religion_diet') filtered = filteredData.filter(s => s.SpecificDiet && s.SpecificDiet.includes(key));
                else if (type === 'food_allergy') filtered = filteredData.filter(s => s.FoodAllergy && s.FoodAllergy !== 'ไม่แพ้');
                else if (type === 'food_alert') filtered = filteredData.filter(s => (s.FoodAllergy && s.FoodAllergy !== 'ไม่แพ้') || (s.SpecificDiet && s.SpecificDiet !== 'ไม่มี'));
                else if (type === 'health_alert') filtered = filteredData.filter(s => (s.Disease && s.Disease !== 'ไม่มี') || (s.DrugAllergy && s.DrugAllergy !== 'ไม่แพ้'));
                else if (type === 'disease') filtered = filteredData.filter(s => s.Disease && s.Disease !== 'ไม่มี');
                else if (type === 'drug_allergy') filtered = filteredData.filter(s => s.DrugAllergy && s.DrugAllergy !== 'ไม่แพ้');
                else if (type === 'demographics') {
                    if (key === 'normal') filtered = filteredData.filter(s => s.Major && !s.Major.includes('เทียบโอน'));
                    else if (key === 'transfer') filtered = filteredData.filter(s => s.Major && s.Major.includes('เทียบโอน'));
                } else if (type === 'major_breakdown') {
                    if (key.type === 'normal') filtered = filteredData.filter(s => s.Major && s.Major.includes(key.major) && !s.Major.includes('เทียบโอน'));
                    else if (key.type === 'transfer') filtered = filteredData.filter(s => s.Major && s.Major.includes(key.major) && s.Major.includes('เทียบโอน'));
                    else filtered = filteredData.filter(s => s.Major && s.Major.includes(key.major));
                }
                setDrilldownData({ title, type, list: filtered });
            };

            const handleSaveEdit = (e) => {
                e.preventDefault();
                if (editItem.StudentID && editItem.StudentID.length !== 9) {
                    Swal.fire({ icon: 'warning', title: 'Warning', text: 'Student ID must be 9 digits', confirmButtonColor: '#ff6600', background: isDarkMode?'#18181b':'#fff', color: isDarkMode?'#f8fafc':'#0f172a' });
                    return;
                }
                if (editItem.StudentPhone.length !== 10 || editItem.ParentPhone.length !== 10) {
                    Swal.fire({ icon: 'warning', title: 'Warning', text: 'Phone numbers must be 10 digits', confirmButtonColor: '#ff6600', background: isDarkMode?'#18181b':'#fff', color: isDarkMode?'#f8fafc':'#0f172a' });
                    return;
                }
                Swal.fire({ title: 'Loading...', didOpen: () => Swal.showLoading(), background: isDarkMode?'#18181b':'#fff' });
                submitToAPI('update', { oldStudentID: editItem.oldStudentID, newData: editItem }).then(res => { if(res.success) { Swal.fire({ icon:'success', title:'Success', timer:1500, showConfirmButton:false, background: isDarkMode?'#18181b':'#fff' }); setEditItem(null); loadData(); } }).catch(err => Swal.fire('Error', err.message, 'error'));
            };

            const exportExcel = () => {
                if (filteredData.length === 0) return;
                const exportData = filteredData.map(r => ({ 'วันที่': r.Timestamp||'', 'รหัสนักศึกษา': r.StudentID||'', 'ชื่อ-นามสกุล': r.FullName||'', 'สาขาวิชา': r.Major||'', 'ศาสนา': r.Religion||'', 'กรุ๊ปเลือด': r.BloodGroup||'', 'เบอร์ นศ.': r.StudentPhone||'', 'เบอร์ ผปค.': r.ParentPhone||'', 'แพ้อาหาร': r.FoodAllergy||'', 'อาหารเฉพาะ': r.SpecificDiet||'', 'โรคประจำตัว': r.Disease||'', 'แพ้ยา': r.DrugAllergy||'' }));
                const ws = window.XLSX.utils.json_to_sheet(exportData);
                const wb = window.XLSX.utils.book_new(); window.XLSX.utils.book_append_sheet(wb, ws, "Students");
                window.XLSX.writeFile(wb, `DIGIT_Export_${new Date().toISOString().slice(0,10)}.xlsx`);
            };

            const exportMajorsSummary = () => {
                if (stats.pieData.length === 0) return;
                const exportData = stats.pieData.sort((a,b) => b.value - a.value).map(item => ({
                    'สาขาวิชา': lang === 'en' ? (DICT_MAPPING[item.name] || item.name) : item.name,
                    'จำนวน (คน)': item.value,
                    'สัดส่วน (%)': ((item.value / stats.total) * 100).toFixed(2) + '%'
                }));
                exportData.push({ 'สาขาวิชา': lang === 'en' ? 'Total' : 'รวมทั้งหมด', 'จำนวน (คน)': stats.total, 'สัดส่วน (%)': '100.00%' });
                const ws = window.XLSX.utils.json_to_sheet(exportData);
                ws['!cols'] = [{wch: 40}, {wch: 15}, {wch: 15}];
                const wb = window.XLSX.utils.book_new(); window.XLSX.utils.book_append_sheet(wb, ws, "Majors_Summary");
                window.XLSX.writeFile(wb, `DIGIT69_Summary_${new Date().toISOString().slice(0,10)}.xlsx`);
            };

            const exportNutritionSummary = () => {
                if (filteredData.length === 0) return;
                const summaryData = [
                    { 'ประเภทการจัดเตรียม': 'อาหารปกติ (ทานได้ทุกอย่าง)', 'จำนวน (คน)': stats.total - stats.foodAlert },
                    { 'ประเภทการจัดเตรียม': 'คุ้มครองศาสนา (ฮาลาล)', 'จำนวน (คน)': stats.dietStats['ฮาลาล'] },
                    { 'ประเภทการจัดเตรียม': 'เพื่อสุขภาพ (มังสวิรัติ)', 'จำนวน (คน)': stats.dietStats['มังสวิรัติ'] },
                    { 'ประเภทการจัดเตรียม': 'อาหารเจ', 'จำนวน (คน)': stats.dietStats['เจ'] },
                    { 'ประเภทการจัดเตรียม': 'ประวัติแพ้อาหาร', 'จำนวน (คน)': stats.foodAllergies.length },
                    { 'ประเภทการจัดเตรียม': 'รวมผู้ที่ต้องจัดเตรียมพิเศษทั้งหมด', 'จำนวน (คน)': stats.foodAlert }
                ];
                
                const allergyGroupData = stats.groupedAllergies.map(a => ({ 'รายการอาหารที่แพ้ (ระบุโดย นศ.)': a.name, 'จำนวน (คน)': a.count }));
                const detailData = stats.surveillanceList.filter(s => s.FoodAllergy !== 'ไม่แพ้' || s.SpecificDiet !== 'ไม่มี').map(r => ({ 'รหัสนักศึกษา': r.StudentID || '', 'ชื่อ-นามสกุล': r.FullName || '', 'สาขาวิชา': r.Major || '', 'เบอร์ติดต่อ นศ.': r.StudentPhone || '', 'อาหารเฉพาะทาง': r.SpecificDiet || 'ไม่มี', 'ประวัติแพ้อาหาร': r.FoodAllergy || 'ไม่แพ้' }));
                
                const wb = window.XLSX.utils.book_new();
                const wsSummary = window.XLSX.utils.json_to_sheet(summaryData); wsSummary['!cols'] = [{wch: 40}, {wch: 15}]; window.XLSX.utils.book_append_sheet(wb, wsSummary, "สรุปยอดโภชนาการ");
                
                if (allergyGroupData.length > 0) { const wsAllergy = window.XLSX.utils.json_to_sheet(allergyGroupData); wsAllergy['!cols'] = [{wch: 50}, {wch: 15}]; window.XLSX.utils.book_append_sheet(wb, wsAllergy, "สรุปรายการแพ้อาหาร"); }
                if (detailData.length > 0) { const wsDetail = window.XLSX.utils.json_to_sheet(detailData); wsDetail['!cols'] = [{wch: 15}, {wch: 30}, {wch: 35}, {wch: 15}, {wch: 20}, {wch: 30}]; window.XLSX.utils.book_append_sheet(wb, wsDetail, "รายชื่อกลุ่มอาหารพิเศษ"); }
                
                window.XLSX.writeFile(wb, `DIGIT69_Nutrition_Report_${new Date().toISOString().slice(0,10)}.xlsx`);
            };

            const exportMedicalSummary = () => {
                if (filteredData.length === 0) return;
                const summaryData = [
                    { 'ข้อมูลสุขภาพและการแพทย์': 'สุขภาพแข็งแรง (ไม่มีความเสี่ยง)', 'จำนวน (คน)': stats.total - stats.healthAlert },
                    { 'ข้อมูลสุขภาพและการแพทย์': 'มีโรคประจำตัว', 'จำนวน (คน)': stats.diseases.length },
                    { 'ข้อมูลสุขภาพและการแพทย์': 'มีประวัติแพ้ยา', 'จำนวน (คน)': stats.drugAllergies.length },
                    { 'ข้อมูลสุขภาพและการแพทย์': 'รวมกลุ่มเปราะบางเฝ้าระวังทั้งหมด', 'จำนวน (คน)': stats.healthAlert }
                ];
                const detailData = stats.surveillanceList.filter(s => s.Disease !== 'ไม่มี' || s.DrugAllergy !== 'ไม่แพ้').map(r => ({ 'รหัสนักศึกษา': r.StudentID || '', 'ชื่อ-นามสกุล': r.FullName || '', 'สาขาวิชา': r.Major || '', 'เบอร์ติดต่อ นศ.': r.StudentPhone || '', 'เบอร์ ผปค. (ฉุกเฉิน)': r.ParentPhone || '', 'โรคประจำตัว': r.Disease || 'ไม่มี', 'ประวัติแพ้ยา': r.DrugAllergy || 'ไม่แพ้' }));
                const wb = window.XLSX.utils.book_new();
                const wsSummary = window.XLSX.utils.json_to_sheet(summaryData); wsSummary['!cols'] = [{wch: 40}, {wch: 15}]; window.XLSX.utils.book_append_sheet(wb, wsSummary, "สรุปยอดการแพทย์");
                if (detailData.length > 0) { const wsDetail = window.XLSX.utils.json_to_sheet(detailData); wsDetail['!cols'] = [{wch: 15}, {wch: 30}, {wch: 35}, {wch: 15}, {wch: 15}, {wch: 30}, {wch: 30}]; window.XLSX.utils.book_append_sheet(wb, wsDetail, "รายชื่อกลุ่มเปราะบาง"); }
                window.XLSX.writeFile(wb, `DIGIT69_Medical_Report_${new Date().toISOString().slice(0,10)}.xlsx`);
            };

            if (loading && stats.total === 0) return (
                <div className="flex flex-col justify-center items-center h-[70vh]">
                    <div className="p-4 bg-brand/10 rounded-2xl mb-4 animate-pulse-slow shadow-glow-brand"><Icon name="loader-2" size={40} className="text-brand animate-spin" /></div>
                    <p className="text-slate-500 font-bold tracking-widest uppercase text-sm">Loading Database...</p>
                </div>
            );

            const TABS = [
                { id: 'overview', icon: 'users', label: t('admin_tab_overview') },
                { id: 'majors', icon: 'pie-chart', label: t('admin_tab_majors') },
                { id: 'executive', icon: 'layout-dashboard', label: t('admin_tab_executive') }
            ];

            return (
                <div className="flex flex-col md:flex-row gap-6 animate-fade-in pb-20 items-start w-full">
                    {/* Admin Sidebar */}
                    <div className="w-full md:w-64 glass-panel p-5 rounded-[2rem] flex flex-col md:sticky md:top-24 z-20 shrink-0 no-print border border-slate-200/50 dark:border-white/5 shadow-soft">
                        <div className="flex items-center gap-4 mb-8 px-2 pt-2">
                            <div className="w-12 h-12 bg-slate-900 dark:bg-white rounded-[1rem] flex items-center justify-center text-white dark:text-black shadow-lg"><Icon name="command" size={24}/></div>
                            <div>
                                <p className="text-[10px] text-brand font-black tracking-widest uppercase">Admin Portal</p>
                                <h3 className="font-black text-slate-800 dark:text-white leading-none text-lg mt-0.5">{t('admin_dashboard')}</h3>
                            </div>
                        </div>
                        <div className="flex flex-row md:flex-col overflow-x-auto hide-scrollbar gap-2 pb-2 md:pb-0">
                            {TABS.map(tab => (
                                <button key={tab.id} onClick={() => { setActiveTab(tab.id); setCurrentPage(1); }} 
                                    className={`flex items-center gap-3 px-4 py-3.5 rounded-xl transition-all font-bold whitespace-nowrap btn-interactive text-sm
                                    ${activeTab === tab.id ? 'bg-brand text-white shadow-glow-brand hover:-translate-y-0.5' : 'text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-white/10 hover:text-slate-900 dark:hover:text-white'}`}>
                                    <Icon name={tab.icon} size={18} className={activeTab === tab.id ? 'text-white' : 'text-slate-400'}/> {tab.label}
                                </button>
                            ))}
                        </div>
                    </div>

                    {/* Admin Main Content */}
                    <div className="flex-1 w-full space-y-6 print-area min-w-0">
                        {/* Header Action Bar */}
                        <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center glass-panel p-5 md:px-8 md:py-6 rounded-[2.5rem] gap-4 no-print shadow-soft border border-slate-200/50 dark:border-white/5">
                            <h2 className="text-xl md:text-2xl font-black text-slate-800 dark:text-white flex items-center gap-3 whitespace-nowrap">
                                <div className="p-2.5 bg-brand/10 text-brand rounded-xl shadow-sm"><Icon name={(TABS.find(t=>t.id===activeTab) || {}).icon} size={20}/></div>
                                {(TABS.find(t=>t.id===activeTab) || {}).label}
                            </h2>
                            <div className="flex flex-col xl:flex-row flex-wrap w-full sm:w-auto gap-3 items-start xl:items-center">

                                <div className="flex justify-between items-center mb-6 shrink-0">
                                    <h3 className="text-xl md:text-2xl font-black text-slate-800 dark:text-white flex items-center gap-3"><Icon name="edit" size={24}/> Edit Data</h3>
                                    <button onClick={() => setEditItem(null)} className="p-2.5 bg-slate-100 dark:bg-white/10 rounded-xl hover:bg-slate-200 transition-colors"><Icon name="x" size={20}/></button>
                                </div>
                                <form onSubmit={handleSaveEdit} className="space-y-5 overflow-y-auto flex-1 custom-scrollbar pr-2 pb-4">
                                    <div className="p-5 md:p-6 bg-slate-50/80 dark:bg-black/20 rounded-3xl border border-slate-200/60 dark:border-white/5 space-y-4 shadow-inner">
                                        <div><label className="text-[10px] font-black text-slate-500 mb-1.5 block uppercase tracking-widest">ชื่อ-นามสกุล (ระบุคำนำหน้า)</label><input className="w-full input-modern rounded-xl px-4 py-3.5 text-sm font-bold shadow-sm" value={editItem.FullName} onChange={e => setEditItem({...editItem, FullName: e.target.value})}/></div>
                                        <div className="grid grid-cols-2 gap-4">
                                            <div><label className="text-[10px] font-black text-slate-500 mb-1.5 block uppercase tracking-widest">รหัสนักศึกษา</label><input className="w-full input-modern rounded-xl px-4 py-3.5 text-sm font-mono shadow-sm" inputMode="numeric" maxLength="9" value={editItem.StudentID} onChange={e => setEditItem({...editItem, StudentID: e.target.value.replace(/\D/g, '')})}/></div>
                                            <div><label className="text-[10px] font-black text-slate-500 mb-1.5 block uppercase tracking-widest">Thai ID / Passport</label><input className="w-full input-modern rounded-xl px-4 py-3.5 text-sm font-mono shadow-sm" maxLength="20" value={editItem.IDCard || ''} onChange={e => setEditItem({...editItem, IDCard: e.target.value})}/></div>
                                        </div>
                                        <div><label className="text-[10px] font-black text-slate-500 mb-1.5 block uppercase tracking-widest">สาขาวิชา</label><input className="w-full input-modern rounded-xl px-4 py-3.5 text-sm font-semibold shadow-sm" value={editItem.Major} onChange={e => setEditItem({...editItem, Major: e.target.value})}/></div>
                                        <div className="grid grid-cols-2 gap-4">
                                            <div><label className="text-[10px] font-black text-slate-500 mb-1.5 block uppercase tracking-widest">ศาสนา</label><input className="w-full input-modern rounded-xl px-4 py-3.5 text-sm font-semibold shadow-sm" value={editItem.Religion || ''} onChange={e => setEditItem({...editItem, Religion: e.target.value})}/></div>
                                            <div><label className="text-[10px] font-black text-slate-500 mb-1.5 block uppercase tracking-widest">กรุ๊ปเลือด</label><input className="w-full input-modern rounded-xl px-4 py-3.5 text-sm font-semibold shadow-sm" value={editItem.BloodGroup || ''} onChange={e => setEditItem({...editItem, BloodGroup: e.target.value})}/></div>
                                        </div>
                                        <div className="grid grid-cols-2 gap-4">
                                            <div><label className="text-[10px] font-black text-slate-500 mb-1.5 block uppercase tracking-widest">เบอร์ นศ.</label><input className="w-full input-modern rounded-xl px-4 py-3.5 text-sm font-mono shadow-sm" maxLength="10" pattern="[0-9]{10}" inputMode="numeric" value={editItem.StudentPhone} onChange={e => setEditItem({...editItem, StudentPhone: e.target.value.replace(/\D/g, '')})}/></div>
                                            <div><label className="text-[10px] font-black text-slate-500 mb-1.5 block uppercase tracking-widest">เบอร์ ผปค.</label><input className="w-full input-modern rounded-xl px-4 py-3.5 text-sm font-mono shadow-sm" maxLength="10" pattern="[0-9]{10}" inputMode="numeric" value={editItem.ParentPhone} onChange={e => setEditItem({...editItem, ParentPhone: e.target.value.replace(/\D/g, '')})}/></div>
                                        </div>
                                    </div>
                                    <div className="p-5 md:p-6 bg-orange-50/80 dark:bg-orange-950/20 rounded-3xl border border-orange-200/60 dark:border-orange-500/20 space-y-4 shadow-sm">
                                        <div><label className="text-[10px] font-black text-orange-600 dark:text-orange-400 mb-1.5 block uppercase tracking-widest">แพ้อาหาร</label><input className="w-full input-modern rounded-xl px-4 py-3.5 text-sm font-semibold shadow-sm focus:ring-orange-500/50" value={editItem.FoodAllergy} onChange={e => setEditItem({...editItem, FoodAllergy: e.target.value})}/></div>
                                        <div><label className="text-[10px] font-black text-orange-600 dark:text-orange-400 mb-1.5 block uppercase tracking-widest">อาหารเฉพาะทาง</label><input className="w-full input-modern rounded-xl px-4 py-3.5 text-sm font-semibold shadow-sm focus:ring-orange-500/50" value={editItem.SpecificDiet} onChange={e => setEditItem({...editItem, SpecificDiet: e.target.value})}/></div>
                                    </div>
                                    <div className="p-5 md:p-6 bg-red-50/80 dark:bg-red-950/20 rounded-3xl border border-red-200/60 dark:border-red-500/20 space-y-4 shadow-sm">
                                        <div><label className="text-[10px] font-black text-red-600 dark:text-red-400 mb-1.5 block uppercase tracking-widest">โรคประจำตัว</label><input className="w-full input-modern rounded-xl px-4 py-3.5 text-sm font-semibold shadow-sm focus:ring-red-500/50" value={editItem.Disease} onChange={e => setEditItem({...editItem, Disease: e.target.value})}/></div>
                                        <div><label className="text-[10px] font-black text-red-600 dark:text-red-400 mb-1.5 block uppercase tracking-widest">แพ้ยา</label><input className="w-full input-modern rounded-xl px-4 py-3.5 text-sm font-semibold shadow-sm focus:ring-red-500/50" value={editItem.DrugAllergy} onChange={e => setEditItem({...editItem, DrugAllergy: e.target.value})}/></div>
                                    </div>
                                    
                                    <div className="flex gap-4 pt-6 sticky bottom-0 bg-white dark:bg-zinc-900 pb-2 z-10 border-t border-slate-100 dark:border-white/5 mt-6">
                                        <button type="button" onClick={() => setEditItem(null)} className="flex-1 py-4 bg-slate-100 dark:bg-white/5 text-sm rounded-xl font-bold btn-interactive hover:bg-slate-200 dark:hover:bg-white/10 transition-colors text-slate-600 dark:text-slate-300">ยกเลิก</button>
                                        <button type="submit" className="flex-1 py-4 brand-gradient text-white text-sm rounded-xl font-bold shadow-glow-brand btn-interactive transform hover:-translate-y-0.5 transition-all flex items-center justify-center gap-2"><Icon name="save" size={18}/> บันทึกข้อมูล</button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        function App() {
            const [isDarkMode, setIsDarkMode] = useState(false);
            const [lang, setLang] = useState('th');
            const [currentView, setCurrentView] = useState('pdpa'); 
            
            useEffect(() => {
                const isDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
                setIsDarkMode(isDark);
            }, []);

            useEffect(() => {
                if (isDarkMode) document.documentElement.classList.add('dark');
                else document.documentElement.classList.remove('dark');
            }, [isDarkMode]);

            const t = (key) => TRANSLATIONS[lang][key] || key;

            return (
                <AppContext.Provider value={{ t, lang, setLang, isDarkMode }}>
                    <div className="min-h-screen p-4 md:p-6 transition-colors duration-300 relative">
                        
                        {currentView === 'pdpa' && <PdpaModal onAccept={() => setCurrentView('register')} onAdminClick={() => setCurrentView('admin')} />}
                        {currentView === 'register' && <RegistrationForm onBack={() => setCurrentView('pdpa')} onSuccess={() => setCurrentView('success')} />}
                        {currentView === 'success' && <SuccessView onHome={() => setCurrentView('pdpa')} />}
                        {currentView === 'admin' && <AdminDashboard goBack={() => setCurrentView('pdpa')} />}

                        <div className="fixed bottom-6 right-6 flex flex-col gap-3 z-50 print:hidden">
                            <button 
                                onClick={() => setLang(lang === 'th' ? 'en' : 'th')}
                                className="w-12 h-12 bg-white dark:bg-zinc-800 text-slate-800 dark:text-white rounded-full shadow-lg border border-slate-200 dark:border-zinc-700 hover:scale-110 transition-transform flex items-center justify-center font-black text-sm"
                                title="Change Language"
                            >
                                {lang === 'th' ? 'EN' : 'TH'}
                            </button>
                            <button 
                                onClick={() => setIsDarkMode(!isDarkMode)}
                                className="w-12 h-12 bg-white dark:bg-zinc-800 text-slate-800 dark:text-white rounded-full shadow-lg border border-slate-200 dark:border-zinc-700 hover:scale-110 transition-transform flex items-center justify-center"
                                title="Toggle Dark Mode"
                            >
                                <Icon name={isDarkMode ? "sun" : "moon"} size={20} />
                            </button>
                        </div>
                    </div>
                </AppContext.Provider>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
