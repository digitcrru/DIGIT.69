<body class="selection:bg-brand-500 selection:text-white">
    <div id="app-loader"><div class="loader-ring"></div><h2 style="font-family:'Prompt',sans-serif;font-size:16px;font-weight:700;background:linear-gradient(135deg,#ff621f 0%,#f43f5e 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;letter-spacing:0.1em">DIGIT.CRRU</h2></div>

    <div id="root"></div>
    
    <!-- ย้ายไลบรารีต่างๆ มาไว้ตรงนี้ (เพิ่มความเร็วในการแสดงผลเริ่มต้น) -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        const API_CONFIG = {
            USE_FAST_CSV: true,
            SHEET_ID: "1KLJNWUUIj1r6eqCZnaF-F6nA2FQg7pvOHMk0PyDCyAc", 
            WEB_APP_URL: "https://script.google.com/macros/s/AKfycbxPn5DYR_fPw1vJcJPFSyrO67PTq4ksUlDEKNpLd5YkJtdPdiplLfpByZggRAtStpuv/exec", 
            getCSVUrl: function(sheetName) { return `https://docs.google.com/spreadsheets/d/${this.SHEET_ID}/gviz/tq?tqx=out:csv&headers=0&sheet=${encodeURIComponent(sheetName)}&_=${new Date().getTime()}`; }
        };
        const isFastCSVReady = () => API_CONFIG.USE_FAST_CSV && API_CONFIG.SHEET_ID && !API_CONFIG.SHEET_ID.includes('ใส่_SHEET_ID');

        window.fetchFastCSV = (sheetName) => {
            return new Promise((resolve, reject) => {
                if(!isFastCSVReady()) return reject(new Error("โหมด CSV ถูกปิดใช้งาน"));
                Papa.parse(API_CONFIG.getCSVUrl(sheetName), {
                    download: true, header: false, skipEmptyLines: true,
                    complete: (results) => {
                        const raw = results.data;
                        if (!raw || raw.length === 0) return resolve([]);
                        const firstCell = String(raw[0][0] || '').toLowerCase();
                        if (firstCell.includes('<!doctype') || firstCell.includes('<html')) return reject(new Error("การอนุญาตถูกปฏิเสธ"));
                        if (raw.length < 2) return resolve([]); 
                        const headers = raw[0].map(h => String(h).trim().replace(/^\uFEFF/, ''));
                        const formattedData = [];
                        for (let i = 1; i < raw.length; i++) {
                            const row = raw[i];
                            const obj = {};
                            for (let j = 0; j < headers.length; j++) obj[headers[j]] = row[j] !== undefined ? row[j] : '';
                            formattedData.push(obj);
                        }
                        resolve(formattedData);
                    }, error: (error) => reject(error)
                });
            });
        };
        const fetchFastCSV = window.fetchFastCSV;

        window.runGAS = async (functionName, ...args) => {
            if (typeof google !== 'undefined' && google.script && google.script.run) {
                return new Promise((resolve, reject) => { google.script.run.withSuccessHandler(resolve).withFailureHandler(reject)[functionName](...args); });
            } else if (API_CONFIG.WEB_APP_URL && API_CONFIG.WEB_APP_URL.startsWith("https://script.google.com")) {
                try {
                    const response = await fetch(API_CONFIG.WEB_APP_URL, { method: 'POST', redirect: 'follow', body: JSON.stringify({ action: functionName, params: args }), headers: { 'Content-Type': 'text/plain' } });
                    const result = await response.json();
                    if (result.success === false && result.error) throw new Error(result.error);
                    return result.data !== undefined ? result.data : result;
                } catch (error) { throw error; }
            } else {
                return new Promise((resolve) => setTimeout(() => resolve({ success: false, error: 'ไม่พบ WEB_APP_URL' }), 500));
            }
        };
        const runGAS = window.runGAS;

        const surveyData = [
            { title: "1. กระบวนการ ขั้นตอนการให้บริการ", questions: [{ id: "q1", text: "1.1 การประชาสัมพันธ์โครงการ ฯ" }, { id: "q2", text: "1.2 ความเหมาะสมของสถานที่" }, { id: "q3", text: "1.3 ความเหมาะสมของระยะเวลา" }, { id: "q4", text: "1.4 การจัดลำดับขั้นตอนของกิจกรรม" }] },
            { title: "2. การอำนวยความสะดวก", questions: [{ id: "q5", text: "2.1 เอกสาร" }, { id: "q6", text: "2.2 โสตทัศนูปกรณ์" }, { id: "q7", text: "2.3 เจ้าหน้าที่สนับสนุน" }, { id: "q8", text: "2.4 อาหาร,เครื่องดื่มและสถานที่" }] },
            { title: "3. คุณภาพการให้บริการ", questions: [{ id: "q9", text: "3.1 ท่านได้รับความรู้ แนวคิด ทักษะและประสบการณ์ใหม่ ๆ จากโครงการ" }, { id: "q10", text: "3.2 ท่านสามารถนำสิ่งที่ได้รับจากโครงการ/กิจกรรมนี้ไปใช้ในการปฏิบัติงาน" }, { id: "q11", text: "3.3 สิ่งที่ท่านได้รับจากโครงการ/กิจกรรมครั้งนี้ตรงตามความคาดหวังของท่านหรือไม่" }, { id: "q12", text: "3.4 โครงการ/กิจกรรมนี้เอื้ออำนวยต่อการเรียนรู้และพัฒนาความสามารถของท่าน" }, { id: "q13", text: "3.5 ประโยชน์ที่ท่านได้รับจากโครงการ/กิจกรรม" }] }
        ];

        function getGenderProps(nameStr) {
            if (!nameStr) return { icon: 'fa-user', bg: 'bg-brand-50 text-brand-600 border-brand-200' };
            if (nameStr.startsWith('นาย')) return { icon: 'fa-person', bg: 'bg-blue-50 text-blue-600 border-blue-200' };
            if (nameStr.startsWith('นาง') || nameStr.startsWith('น.ส.')) return { icon: 'fa-person-dress', bg: 'bg-rose-50 text-rose-600 border-rose-200' };
            return { icon: 'fa-user', bg: 'bg-brand-50 text-brand-600 border-brand-200' };
        }

        function App() {
            const [view, setView] = useState(() => {
                const savedView = sessionStorage.getItem('app_view');
                if (savedView === 'admin_dashboard' && localStorage.getItem('admin_logged_in') === 'true') return 'admin_dashboard';
                if (['home', 'search', 'history_search', 'admin_login', 'select_recruit'].includes(savedView)) return savedView;
                return 'home';
            }); 
            
            const [student, setStudent] = useState(null);
            const [activities, setActivities] = useState([]);
            const [recruitments, setRecruitments] = useState([]); 
            const [selectedActivity, setSelectedActivity] = useState(null);
            const [surveyAnswers, setSurveyAnswers] = useState({});
            const [suggestion, setSuggestion] = useState('');
            const [historyData, setHistoryData] = useState([]);
            const [systemOpen, setSystemOpen] = useState(true);
            const [recruitSystemOpen, setRecruitSystemOpen] = useState(true);
            const [adminData, setAdminData] = useState(null);
            const [searchPurpose, setSearchPurpose] = useState(() => sessionStorage.getItem('search_purpose') || 'activity');
            const [shirtSystemOpen, setShirtSystemOpen] = useState(true);
            const [shirtPrice, setShirtPrice] = useState({ normal: 250, oversize: 380, status: 'open', popupText: '', popupImage: '' });
            const [receiptSettings, setReceiptSettings] = useState({ header: 'สโมสรนักศึกษาคณะเทคโนโลยีดิจิทัล มหาวิทยาลัยราชภัฏเชียงราย\nที่อยู่: 80 ซอย 9 ตำบล บ้านดู่ อำเภอเมืองเชียงราย เชียงราย 57100', note: 'กรุณานำใบเสร็จนี้มาแสดงในวันรับเสื้อ' });
            const [isEditingOrder, setIsEditingOrder] = useState(false);
            const [poloGender, setPoloGender] = useState('ชาย');
            const [poloSize, setPoloSize] = useState('M');
            const [poloQty, setPoloQty] = useState(1);
            const [tshirtGender, setTshirtGender] = useState('ชาย');
            const [tshirtSize, setTshirtSize] = useState('M');
            const [tshirtQty, setTshirtQty] = useState(1);
            const [paymentMethod, setPaymentMethod] = useState('promptpay'); 
            const [slipImage, setSlipImage] = useState(null); 
            const [receiptData, setReceiptData] = useState(null);
            const [isDarkMode, setIsDarkMode] = useState(() => localStorage.getItem('theme') === 'dark');

            useEffect(() => {
                const loader = document.getElementById('app-loader');
                if (loader) { loader.style.opacity = '0'; setTimeout(() => { loader.style.visibility = 'hidden'; loader.style.display = 'none'; }, 300); }
            }, []);

            useEffect(() => { sessionStorage.setItem('app_view', view); }, [view]);
            useEffect(() => { sessionStorage.setItem('search_purpose', searchPurpose); }, [searchPurpose]);

            useEffect(() => {
                if (isDarkMode) { document.documentElement.classList.add('dark'); localStorage.setItem('theme', 'dark'); }
                else { document.documentElement.classList.remove('dark'); localStorage.setItem('theme', 'light'); }
            }, [isDarkMode]);

            const loadAdminData = () => {
                if (API_CONFIG.USE_FAST_CSV && !isFastCSVReady()) { Swal.fire({ title: 'การตั้งค่าระบบไม่สมบูรณ์', text: 'กรุณากำหนดค่า SHEET_ID ในโค้ดครับ', icon: 'warning', confirmButtonColor: '#ff621f' }); return; }
                Swal.fire({ title: 'โปรดรอสักครู่...', allowOutsideClick: false, didOpen: () => { Swal.showLoading() } });
                setTimeout(async () => {
                    try {
                        let data;
                        if (isFastCSVReady()) {
                            const [acts, chks, evals, shirts, settings, recs, regis] = await Promise.all([
                                fetchFastCSV('Activities').catch(() => []), fetchFastCSV('CheckIns').catch(() => []), fetchFastCSV('Evaluations').catch(() => []), 
                                fetchFastCSV('ShirtOrders').catch(() => []), fetchFastCSV('Settings').catch(() => []), fetchFastCSV('Recruitments').catch(() => []), fetchFastCSV('Registrations').catch(() => [])
                            ]);
                            let priceInfo = { normal: 250, oversize: 380, status: 'open', receiptHeader: 'สโมสรนักศึกษาคณะเทคโนโลยีดิจิทัล', receiptNote: 'กรุณานำใบเสร็จนี้มาแสดงในวันรับเสื้อ', systemStatus: 'open', popupText: '', popupImage: '' };
                            let recruitInfo = { status: 'open' }; 
                            
                            if (settings && settings.length > 0) {
                                const priceRow = settings.find(r => r.Key === 'ShirtPrice') || {Value1: 250, Value2: 380};
                                const statusRow = settings.find(r => r.Key === 'ShirtStatus') || {Value1: 'open', Value2: ''};
                                const receiptRow = settings.find(r => r.Key === 'ReceiptConfig') || {Value1: priceInfo.receiptHeader, Value2: priceInfo.receiptNote};
                                const systemRow = settings.find(r => r.Key === 'SystemStatus') || {Value1: 'open', Value2: ''};
                                const popupRow = settings.find(r => r.Key === 'ShirtPopup') || {Value1: '', Value2: ''};
                                const recruitStatusRow = settings.find(r => r.Key === 'RecruitStatus') || {Value1: 'open', Value2: ''};
                                
                                priceInfo = { normal: Number(priceRow.Value1), oversize: Number(priceRow.Value2), status: statusRow.Value1, receiptHeader: receiptRow.Value1, receiptNote: receiptRow.Value2, systemStatus: systemRow.Value1, popupText: popupRow.Value1, popupImage: popupRow.Value2 };
                                recruitInfo.status = recruitStatusRow.Value1;
                            } else { try { priceInfo = await runGAS('getShirtPrice'); } catch(err) {} }
                            data = { activities: acts, checkins: chks, evaluations: evals, shirtOrders: shirts, recruitments: recs, registrations: regis, shirtPrice: priceInfo, recruitStatus: recruitInfo.status };
                        } else { data = await runGAS('getAdminDashboardData'); }
                        
                        setAdminData(data || { activities: [], checkins: [], evaluations: [], shirtOrders: [], recruitments: [], registrations: [], shirtPrice: {}, recruitStatus: 'open' }); 
                        if (data) { 
                            if(data.shirtPrice) { 
                                setShirtPrice(data.shirtPrice); 
                                setShirtSystemOpen(data.shirtPrice.status === 'open'); 
                                setSystemOpen(data.shirtPrice.systemStatus === 'open'); 
                            }
                            if(data.recruitStatus) { 
                                setRecruitSystemOpen(data.recruitStatus === 'open'); 
                            }
                        }
                        setTimeout(() => { Swal.close(); setView('admin_dashboard'); }, 50);
                    } catch(e) { Swal.fire('ข้อผิดพลาดการเชื่อมต่อ', e.message, 'error'); }
                }, 100);
            };

            useEffect(() => {
                const loadInitialData = async () => {
                    try {
                        let acts = [], recs = [], priceInfo = null, recruitInfo = { status: 'open' };
                        if (isFastCSVReady()) {
                            try {
                                const [allActs, allRecs, settings] = await Promise.all([
                                    fetchFastCSV('Activities').catch(() => []), fetchFastCSV('Recruitments').catch(() => []), fetchFastCSV('Settings').catch(() => [])
                                ]);
                                acts = allActs.filter(a => a.Status === 'open');
                                recs = allRecs.filter(r => r.Status === 'open');
                                priceInfo = { normal: 250, oversize: 380, status: 'open', receiptHeader: 'สโมสรนักศึกษาคณะเทคโนโลยีดิจิทัล', receiptNote: 'กรุณานำใบเสร็จนี้มาแสดงในวันรับเสื้อ', systemStatus: 'open', popupText: '', popupImage: '' };
                                if (settings && settings.length > 0) {
                                    const priceRow = settings.find(r => r.Key === 'ShirtPrice') || {Value1: 250, Value2: 380};
                                    const statusRow = settings.find(r => r.Key === 'ShirtStatus') || {Value1: 'open', Value2: ''};
                                    const receiptRow = settings.find(r => r.Key === 'ReceiptConfig') || {Value1: priceInfo.receiptHeader, Value2: priceInfo.receiptNote};
                                    const systemRow = settings.find(r => r.Key === 'SystemStatus') || {Value1: 'open', Value2: ''};
                                    const popupRow = settings.find(r => r.Key === 'ShirtPopup') || {Value1: '', Value2: ''};
                                    const recruitStatusRow = settings.find(r => r.Key === 'RecruitStatus') || {Value1: 'open', Value2: ''};
                                    
                                    priceInfo = { normal: Number(priceRow.Value1), oversize: Number(priceRow.Value2), status: statusRow.Value1, receiptHeader: receiptRow.Value1, receiptNote: receiptRow.Value2, systemStatus: systemRow.Value1, popupText: popupRow.Value1, popupImage: popupRow.Value2 };
                                    recruitInfo.status = recruitStatusRow.Value1;
                                }
                            } catch(e) { priceInfo = await runGAS('getShirtPrice'); acts = await runGAS('getActiveActivities'); }
                        } else { acts = await runGAS('getActiveActivities'); priceInfo = await runGAS('getShirtPrice'); }

                        setActivities(acts || []); setRecruitments(recs || []);
                        if (priceInfo) { 
                            setShirtPrice(priceInfo); 
                            setShirtSystemOpen(priceInfo.status === 'open'); 
                            setSystemOpen(priceInfo.systemStatus === 'open'); 
                            setReceiptSettings({ header: priceInfo.receiptHeader, note: priceInfo.receiptNote }); 
                        }
                        setRecruitSystemOpen(recruitInfo.status === 'open');
                    } catch (e) {}
                };
                if (view === 'admin_dashboard' && localStorage.getItem('admin_logged_in') === 'true') { if (!adminData) loadAdminData(); } else { loadInitialData(); }
            }, [view, adminData]); 

            const goHome = () => {
                setStudent(null); setSearchPurpose('activity'); setPoloGender('ชาย'); setPoloSize('M'); setPoloQty(1); setTshirtGender('ชาย'); setTshirtSize('M'); setTshirtQty(1); setPaymentMethod('promptpay'); setReceiptData(null); setIsEditingOrder(false); setSlipImage(null); setView('home');
            };

            const handleSearchStudent = async (rawStudentId) => {
                const studentId = String(rawStudentId).trim();
                if(!studentId) return Swal.fire('แจ้งเตือน', 'กรุณากรอกรหัสนักศึกษา', 'warning');
                Swal.fire({ title: 'กำลังตรวจสอบ...', allowOutsideClick: false, didOpen: () => { Swal.showLoading() } });
                try {
                    let studentFound = null;
                    if (isFastCSVReady()) {
                        try {

                const grandTotal = (getPrice(poloSize) * poloQty) + (getPrice(tshirtSize) * tshirtQty);
                const gProps = getGenderProps(student.Name);

                return (
                    <div className="min-h-screen flex flex-col relative z-10">
                        <Navbar />
                        <div className="flex-grow flex flex-col items-center pt-8 p-4 pb-20">
                            <div className="w-full max-w-3xl bg-white/90 backdrop-blur-xl border border-gray-100 p-6 sm:p-10 rounded-[2rem] shadow-soft relative overflow-hidden dark:bg-gray-800/90 dark:border-gray-700">
                                <div className="absolute top-0 left-0 w-full h-1.5 bg-gradient-to-r from-rose-400 to-rose-600"></div>
                                <div className="flex flex-col sm:flex-row justify-between items-center sm:items-end mb-8 border-b border-gray-100 dark:border-gray-700 pb-6 gap-5 pt-2">
                                    <div className="flex items-center gap-4 text-center sm:text-left"><div className={`w-14 h-14 rounded-2xl flex items-center justify-center text-2xl shadow-sm border ${gProps.bg}`}><i className={`fa-solid ${gProps.icon}`}></i></div><div><p className="text-[10px] text-rose-500 font-bold uppercase tracking-widest mb-1">ข้อมูลผู้สั่งจอง</p><h2 className="text-xl font-bold text-gray-900 dark:text-white">{student.Name}</h2></div></div>

                                </div>

                                        <div className="flex items-center gap-4"><div className="w-12 h-12 bg-white text-rose-500 rounded-xl flex items-center justify-center text-xl shrink-0 shadow-sm border border-rose-100 dark:bg-gray-700 dark:border-gray-600"><i className="fa-solid fa-circle-info"></i></div><div><h4 className="text-sm font-bold text-gray-900 dark:text-white">ประกาศตารางขนาดและรายละเอียด</h4><p className="text-xs text-gray-500 mt-1 font-medium">โปรดตรวจสอบก่อนทำการสั่งจอง</p></div></div>

                                    </div>
                                )}

                                    <div className="mb-8 bg-gray-50/50 dark:bg-gray-900/50 p-6 sm:p-8 rounded-[1.5rem] border border-gray-100 dark:border-gray-700 shadow-sm relative">

                                        <div className="flex items-center gap-3 mb-6"><div className="w-10 h-10 rounded-xl bg-white text-rose-500 flex items-center justify-center text-lg border border-gray-200 shadow-sm dark:bg-gray-800 dark:border-gray-600"><i className="fa-solid fa-shirt"></i></div><h3 className="font-bold text-gray-900 dark:text-white text-lg">เสื้อโปโลคณะ</h3></div>

                                            <div>
                                                <label className="block text-[10px] font-bold text-gray-500 uppercase tracking-widest mb-3">ทรงเสื้อ / เพศ</label>
                                                <div className="flex gap-3 bg-white p-1.5 rounded-2xl border border-gray-200 shadow-sm dark:bg-gray-800 dark:border-gray-600">
                                                    {['ชาย', 'หญิง'].map(g => (<label key={`polo-${g}`} className={`flex-1 py-3 text-center cursor-pointer text-sm font-bold transition-all rounded-xl flex items-center justify-center gap-2 ${poloGender === g ? 'bg-rose-50 text-rose-600 shadow-sm border border-rose-100 dark:bg-rose-500/20 dark:border-rose-900/30' : 'text-gray-500 hover:bg-gray-50 dark:text-gray-400 dark:hover:bg-gray-700'}`}><input type="radio" className="hidden" checked={poloGender === g} onChange={() => setPoloGender(g)} /><i className={`fa-solid ${g==='ชาย'?'fa-mars text-blue-400':'fa-venus text-pink-400'}`}></i> {g}</label>))}
                                                </div>
                                            </div>
                                            <div>
                                                <label className="block text-[10px] font-bold text-gray-500 uppercase tracking-widest mb-3">จำนวน</label>
                                                <div className="flex items-center justify-between bg-white dark:bg-gray-800 p-2 rounded-2xl border border-gray-200 dark:border-gray-600 shadow-sm h-[52px]">
                                                    <button type="button" onClick={() => setPoloQty(Math.max(1, poloQty - 1))} className="w-10 h-10 rounded-xl bg-gray-50 flex items-center justify-center text-gray-600 hover:bg-rose-50 hover:text-rose-500 transition-colors border border-gray-100 dark:bg-gray-700 dark:border-gray-600 dark:text-gray-300"><i className="fa-solid fa-minus text-sm"></i></button>
                                                    <span className="font-black text-gray-900 dark:text-white w-12 text-center text-lg">{poloQty}</span>
                                                    <button type="button" onClick={() => setPoloQty(poloQty + 1)} className="w-10 h-10 rounded-xl bg-gray-50 flex items-center justify-center text-gray-600 hover:bg-rose-50 hover:text-rose-500 transition-colors border border-gray-100 dark:bg-gray-700 dark:border-gray-600 dark:text-gray-300"><i className="fa-solid fa-plus text-sm"></i></button>
                                                </div>
                                            </div>
                                        </div>
                                        
                                        <div><label className="block text-[10px] font-bold text-gray-500 uppercase tracking-widest mb-3">ขนาดไซส์</label><div className="grid grid-cols-3 sm:grid-cols-6 gap-3">{['S', 'M', 'L', 'XL', '2XL', '3XL'].map(size => (<label key={`p-${size}`} className={`relative flex flex-col items-center justify-center h-20 border-2 rounded-2xl transition-all duration-200 cursor-pointer bg-white dark:bg-gray-800 ${poloSize === size ? 'border-rose-500 text-rose-600 shadow-md transform -translate-y-1' : 'border-gray-100 text-gray-600 hover:border-rose-200 hover:shadow-sm dark:border-gray-700 dark:text-gray-400'}`}><input type="radio" className="hidden" checked={poloSize === size} onChange={() => setPoloSize(size)} /><span className="text-lg font-black">{size}</span><span className={`text-[10px] font-bold mt-1 bg-gray-50 px-2 py-0.5 rounded-md dark:bg-gray-900 ${poloSize === size ? 'text-rose-600' : 'text-gray-400'}`}>฿{getPrice(size)}</span></label>))}</div></div>
                                    </div>

                                    {/* Tshirt Section */}
                                    <div className="mb-10 bg-gray-50/50 dark:bg-gray-900/50 p-6 sm:p-8 rounded-[1.5rem] border border-gray-100 dark:border-gray-700 shadow-sm relative">
                                        <div className="absolute top-0 right-0 bg-rose-100 text-rose-600 font-black text-[10px] px-3 py-1.5 rounded-bl-xl rounded-tr-[1.5rem] uppercase tracking-widest border-b border-l border-rose-200">ITEM 02</div>
                                        <div className="flex items-center gap-3 mb-6"><div className="w-10 h-10 rounded-xl bg-white text-rose-500 flex items-center justify-center text-lg border border-gray-200 shadow-sm dark:bg-gray-800 dark:border-gray-600"><i className="fa-solid fa-tshirt"></i></div><h3 className="font-bold text-gray-900 dark:text-white text-lg">เสื้อยืดกิจกรรม</h3></div>
                                        
                                        <div className="grid sm:grid-cols-2 gap-6 mb-6">
                                            <div>
                                                <label className="block text-[10px] font-bold text-gray-500 uppercase tracking-widest mb-3">ทรงเสื้อ / เพศ</label>
                                                <div className="flex gap-3 bg-white p-1.5 rounded-2xl border border-gray-200 shadow-sm dark:bg-gray-800 dark:border-gray-600">
                                                    {['ชาย', 'หญิง'].map(g => (<label key={`ts-${g}`} className={`flex-1 py-3 text-center cursor-pointer text-sm font-bold transition-all rounded-xl flex items-center justify-center gap-2 ${tshirtGender === g ? 'bg-rose-50 text-rose-600 shadow-sm border border-rose-100 dark:bg-rose-500/20 dark:border-rose-900/30' : 'text-gray-500 hover:bg-gray-50 dark:text-gray-400 dark:hover:bg-gray-700'}`}><input type="radio" className="hidden" checked={tshirtGender === g} onChange={() => setTshirtGender(g)} /><i className={`fa-solid ${g==='ชาย'?'fa-mars text-blue-400':'fa-venus text-pink-400'}`}></i> {g}</label>))}
                                                </div>
                                            </div>
                                            <div>
                                                <label className="block text-[10px] font-bold text-gray-500 uppercase tracking-widest mb-3">จำนวน</label>
                                                <div className="flex items-center justify-between bg-white dark:bg-gray-800 p-2 rounded-2xl border border-gray-200 dark:border-gray-600 shadow-sm h-[52px]">
                                                    <button type="button" onClick={() => setTshirtQty(Math.max(1, tshirtQty - 1))} className="w-10 h-10 rounded-xl bg-gray-50 flex items-center justify-center text-gray-600 hover:bg-rose-50 hover:text-rose-500 transition-colors border border-gray-100 dark:bg-gray-700 dark:border-gray-600 dark:text-gray-300"><i className="fa-solid fa-minus text-sm"></i></button>
                                                    <span className="font-black text-gray-900 dark:text-white w-12 text-center text-lg">{tshirtQty}</span>
                                                    <button type="button" onClick={() => setTshirtQty(tshirtQty + 1)} className="w-10 h-10 rounded-xl bg-gray-50 flex items-center justify-center text-gray-600 hover:bg-rose-50 hover:text-rose-500 transition-colors border border-gray-100 dark:bg-gray-700 dark:border-gray-600 dark:text-gray-300"><i className="fa-solid fa-plus text-sm"></i></button>
                                                </div>
                                            </div>
                                        </div>
                                        
                                        <div><label className="block text-[10px] font-bold text-gray-500 uppercase tracking-widest mb-3">ขนาดไซส์</label><div className="grid grid-cols-3 sm:grid-cols-6 gap-3">{['S', 'M', 'L', 'XL', '2XL', '3XL'].map(size => (<label key={`t-${size}`} className={`relative flex flex-col items-center justify-center h-20 border-2 rounded-2xl transition-all duration-200 cursor-pointer bg-white dark:bg-gray-800 ${tshirtSize === size ? 'border-rose-500 text-rose-600 shadow-md transform -translate-y-1' : 'border-gray-100 text-gray-600 hover:border-rose-200 hover:shadow-sm dark:border-gray-700 dark:text-gray-400'}`}><input type="radio" className="hidden" checked={tshirtSize === size} onChange={() => setTshirtSize(size)} /><span className="text-lg font-black">{size}</span><span className={`text-[10px] font-bold mt-1 bg-gray-50 px-2 py-0.5 rounded-md dark:bg-gray-900 ${tshirtSize === size ? 'text-rose-600' : 'text-gray-400'}`}>฿{getPrice(size)}</span></label>))}</div></div>
                                    </div>

                                    {/* Payment Method Section */}
                                    {grandTotal > 0 && (
                                        <div className="mb-10 p-6 sm:p-8 bg-white dark:bg-gray-800/50 rounded-[1.5rem] border border-gray-100 dark:border-gray-700 shadow-sm">
                                            <div className="flex items-center gap-3 mb-6"><div className="w-10 h-10 rounded-xl bg-white text-gray-900 flex items-center justify-center text-lg border border-gray-200 shadow-sm dark:bg-gray-800 dark:border-gray-600 dark:text-white"><i className="fa-solid fa-wallet"></i></div><h3 className="font-bold text-gray-900 dark:text-white text-lg">วิธีการชำระเงิน</h3></div>
                                            <div className="grid grid-cols-1 md:grid-cols-2 gap-5">
                                                <label className={`relative p-5 border-2 rounded-[1.25rem] cursor-pointer transition-all flex items-center gap-4 bg-white dark:bg-gray-800 ${paymentMethod === 'promptpay' ? 'border-blue-500 shadow-md ring-4 ring-blue-500/10' : 'border-gray-100 hover:border-blue-300 dark:border-gray-700'}`}><input type="radio" className="hidden" checked={paymentMethod === 'promptpay'} onChange={() => setPaymentMethod('promptpay')} /><div className={`w-12 h-12 rounded-xl flex items-center justify-center shrink-0 border ${paymentMethod === 'promptpay' ? 'bg-blue-500 text-white border-blue-600 shadow-inner' : 'bg-gray-50 text-gray-400 border-gray-200 dark:bg-gray-700 dark:border-gray-600'}`}><i className="fa-solid fa-qrcode text-xl"></i></div><div><h4 className={`font-bold text-sm ${paymentMethod === 'promptpay' ? 'text-blue-700 dark:text-blue-400' : 'text-gray-700 dark:text-gray-300'}`}>พร้อมเพย์ (QR Code)</h4><p className="text-[10px] text-gray-500 mt-1 font-medium uppercase tracking-wider">โอนเงินและอัปโหลดสลิป</p></div>{paymentMethod === 'promptpay' && <div className="absolute top-4 right-4 text-blue-500"><i className="fa-solid fa-circle-check text-xl"></i></div>}</label>
                                                <label className={`relative p-5 border-2 rounded-[1.25rem] cursor-pointer transition-all flex items-center gap-4 bg-white dark:bg-gray-800 ${paymentMethod === 'cash' ? 'border-amber-500 shadow-md ring-4 ring-amber-500/10' : 'border-gray-100 hover:border-amber-300 dark:border-gray-700'}`}><input type="radio" className="hidden" checked={paymentMethod === 'cash'} onChange={() => setPaymentMethod('cash')} /><div className={`w-12 h-12 rounded-xl flex items-center justify-center shrink-0 border ${paymentMethod === 'cash' ? 'bg-amber-500 text-white border-amber-600 shadow-inner' : 'bg-gray-50 text-gray-400 border-gray-200 dark:bg-gray-700 dark:border-gray-600'}`}><i className="fa-solid fa-money-bill-wave text-xl"></i></div><div><h4 className={`font-bold text-sm ${paymentMethod === 'cash' ? 'text-amber-700 dark:text-amber-400' : 'text-gray-700 dark:text-gray-300'}`}>เงินสด (Cash)</h4><p className="text-[10px] text-gray-500 mt-1 font-medium uppercase tracking-wider">ชำระด้วยตัวเองที่จุดบริการ</p></div>{paymentMethod === 'cash' && <div className="absolute top-4 right-4 text-amber-500"><i className="fa-solid fa-circle-check text-xl"></i></div>}</label>
                                            </div>
                                        </div>
                                    )}

                                    <div className="bg-gray-900 p-8 sm:p-10 rounded-[1.5rem] mb-10 flex flex-col sm:flex-row justify-between items-center sm:items-end shadow-xl relative overflow-hidden">
                                        <div className="absolute -right-10 -top-10 w-48 h-48 bg-gradient-to-br from-rose-500 to-orange-500 rounded-full mix-blend-screen filter blur-[40px] opacity-40"></div>
                                        <div className="absolute -left-10 -bottom-10 w-32 h-32 bg-blue-500 rounded-full mix-blend-screen filter blur-[40px] opacity-20"></div>
                                        <div className="relative z-10 text-center sm:text-left mb-4 sm:mb-0"><p className="text-[10px] font-black text-gray-400 uppercase tracking-[0.3em] mb-2 bg-gray-800/50 inline-block px-3 py-1 rounded-md border border-gray-700">Total Amount</p><h3 className="text-base font-bold text-white tracking-wide">ยอดชำระสุทธิทั้งสิ้น</h3></div>
                                        <div className="relative z-10 text-5xl sm:text-6xl font-black text-white tracking-tight drop-shadow-lg"><span className="text-3xl opacity-50 mr-2 font-medium">฿</span>{grandTotal.toLocaleString()}</div>
                                    </div>

                                    {/* 🚀 Section Slip Upload / Cash Instruction */}
                                    {grandTotal > 0 ? (
                                        paymentMethod === 'promptpay' ? (
                                            <div className="border border-gray-200 dark:border-gray-700 p-6 sm:p-8 mb-10 flex flex-col gap-8 rounded-[1.5rem] bg-white dark:bg-gray-800/50 shadow-sm">
                                                <div className="flex flex-col sm:flex-row items-center justify-center gap-8 bg-blue-50/50 dark:bg-blue-900/10 p-6 sm:p-8 rounded-[1.25rem] border border-blue-100 dark:border-blue-800/30">
                                                    <div className="p-4 bg-white rounded-2xl shadow-md border border-gray-100"><img src={`https://promptpay.io/0812345678/${grandTotal}.png`} alt="PromptPay QR" className="w-36 h-36 object-contain" /></div>
                                                    <div className="text-center sm:text-left"><img src="https://upload.wikimedia.org/wikipedia/commons/thumb/e/e5/PromptPay_logo.svg/1024px-PromptPay_logo.svg.png" alt="PromptPay" className="h-7 mb-4 mx-auto sm:mx-0 object-contain" /><h4 className="font-bold text-blue-900 dark:text-blue-400 text-lg mb-2">สแกนเพื่อโอนเงิน</h4><p className="text-sm text-gray-700 dark:text-gray-300 font-bold mb-1 flex items-center justify-center sm:justify-start gap-2.5"><i className="fa-solid fa-phone text-blue-400 bg-white w-6 h-6 rounded-full flex items-center justify-center shadow-sm"></i> 081-234-5678</p><p className="text-xs text-gray-500 font-medium mb-5 flex items-center justify-center sm:justify-start gap-2.5"><i className="fa-solid fa-building-columns text-gray-400 bg-white w-6 h-6 rounded-full flex items-center justify-center shadow-sm"></i> สโมสรนักศึกษา คณะเทคโนโลยีดิจิทัล</p><div className="inline-block bg-white dark:bg-gray-800 text-blue-700 dark:text-blue-400 px-5 py-2.5 rounded-xl text-sm font-black border border-blue-100 dark:border-blue-800 shadow-sm">ยอดที่ต้องโอน: ฿{grandTotal.toLocaleString()}</div></div>
                                                </div>
                                                <div className="border-t border-dashed border-gray-200 dark:border-gray-700 pt-8">
                                                    <div className="flex items-center gap-2 mb-4"><span className="flex items-center justify-center w-6 h-6 rounded-full bg-rose-100 text-rose-600 text-xs font-bold">*</span><label className="block text-sm font-bold text-gray-900 dark:text-white">อัปโหลดสลิปการชำระเงิน</label></div>
                                                    <label className="flex flex-col items-center justify-center w-full h-64 border-2 border-gray-300 dark:border-gray-600 border-dashed rounded-[1.25rem] cursor-pointer bg-gray-50 hover:bg-gray-100 dark:bg-gray-800/80 dark:hover:bg-gray-800 transition-all relative overflow-hidden group">
                                                        {slipImage ? (
                                                            <div className="flex flex-col items-center justify-center relative w-full h-full p-4 bg-black/5"><img src={slipImage} className="absolute inset-0 w-full h-full object-cover opacity-20 blur-xl" alt="slip-bg" /><img src={slipImage} className="z-10 h-full object-contain drop-shadow-2xl rounded-xl border border-white/50 shadow-lg" alt="slip-preview" /><div className="absolute inset-0 bg-gray-900/60 flex items-center justify-center opacity-0 group-hover:opacity-100 transition-opacity duration-300 z-20 backdrop-blur-[2px]"><span className="text-gray-900 font-bold px-6 py-3 rounded-xl bg-white flex items-center gap-2 transition-transform transform group-hover:scale-105 shadow-xl"><i className="fa-solid fa-pen"></i> อัปโหลดรูปใหม่</span></div></div>
                                                        ) : (
                                                            <div className="flex flex-col items-center justify-center pt-5 pb-6 text-center"><div className="w-16 h-16 bg-white dark:bg-gray-700 rounded-2xl flex items-center justify-center shadow-sm border border-gray-200 dark:border-gray-600 mb-5 text-blue-500 group-hover:scale-110 group-hover:text-rose-500 group-hover:border-rose-200 transition-all duration-300"><i className="fa-solid fa-cloud-arrow-up text-2xl"></i></div><p className="mb-2 text-sm text-gray-700 dark:text-gray-300 font-bold"><span className="text-brand-500 underline decoration-2 underline-offset-4">คลิกเพื่ออัปโหลด</span> หรือลากไฟล์มาวาง</p><p className="text-[10px] text-gray-400 font-bold uppercase tracking-widest mt-2">รองรับไฟล์ PNG, JPG ขนาดไม่เกิน 5MB</p></div>
                                                        )}
                                                        <input type="file" className="hidden" accept="image/png, image/jpeg, image/jpg" onChange={(e) => { const file = e.target.files[0]; if (file) { if (file.size > 5 * 1024 * 1024) { Swal.fire('ไฟล์มีขนาดใหญ่เกินไป', 'กรุณาอัปโหลดไฟล์ขนาดไม่เกิน 5MB', 'warning'); e.target.value = ''; return; } const reader = new FileReader(); reader.onloadend = () => setSlipImage(reader.result); reader.readAsDataURL(file); } }} />
                                                    </label>
                                                </div>
                                            </div>
                                        ) : (
                                            <div className="border border-amber-200 dark:border-amber-900/50 p-8 mb-10 flex flex-col sm:flex-row items-center justify-center gap-6 bg-amber-50/80 dark:bg-amber-900/10 rounded-[1.5rem] shadow-sm"><div className="w-20 h-20 bg-white dark:bg-amber-800/50 text-amber-500 dark:text-amber-400 rounded-[1.25rem] flex items-center justify-center text-3xl shadow-sm border border-amber-100 shrink-0"><i className="fa-solid fa-hand-holding-dollar"></i></div><div className="text-center sm:text-left"><h4 className="font-bold text-amber-900 dark:text-amber-300 text-lg mb-2">ชำระด้วยเงินสดที่จุดรับบริการ</h4><p className="text-sm text-amber-700/80 dark:text-amber-400/80 font-medium leading-relaxed bg-white/60 dark:bg-black/20 px-5 py-2.5 rounded-xl border border-amber-100/50 inline-block">กรุณาเตรียมเงินสด <b className="text-amber-600 dark:text-amber-200 text-lg mx-1">฿{grandTotal.toLocaleString()}</b> <br className="hidden sm:block"/>เพื่อนำมาชำระกับเจ้าหน้าที่ในภายหลัง</p></div></div>
                                        )
                                    ) : null}

                                    <div className="flex flex-col sm:flex-row gap-4 mt-10 pt-8 border-t border-gray-100 dark:border-gray-800">
                                        {isEditingOrder && <button type="button" onClick={() => setView('receipt')} className="w-full sm:w-1/3 btn-outline py-4 font-bold text-sm uppercase tracking-widest rounded-xl">ยกเลิก</button>}
                                        {shirtSystemOpen ? (<button type="submit" className={`w-full ${isEditingOrder ? 'sm:w-2/3' : ''} btn-premium py-4 font-bold text-base tracking-wide rounded-xl flex justify-center items-center gap-2 shadow-lg shadow-brand-500/30`}>ยืนยันคำสั่งซื้อ <i className="fa-solid fa-check-circle"></i></button>) : (<button type="button" disabled className={`w-full ${isEditingOrder ? 'sm:w-2/3' : ''} bg-gray-100 text-gray-400 py-4 font-bold text-base rounded-xl cursor-not-allowed border border-gray-200`}>ระบบปิดให้บริการ</button>)}
                                    </div>
                                </form>
                            </div>
                        </div>
                        <Footer />
                        <MobileTabBar />
                    </div>
                );
            }

            if (view === 'receipt') {
                const handleDownloadReceipt = () => {

                                    <button onClick={handleDownloadReceipt} className="w-full sm:w-2/4 btn-premium py-4 font-bold tracking-[0.1em] text-sm uppercase shadow-xl shadow-brand-500/30 flex justify-center items-center gap-3 dark:bg-white dark:text-black dark:hover:bg-gray-200"><i className="fa-solid fa-download"></i> ดาวน์โหลดรูปภาพ</button>
                                </div>
                            </div>
                        </div>
                        <Footer />
                        <MobileTabBar />
                    </div>
                );
            }

            if (view === 'history_search') {
                return (
                    <div className="min-h-screen flex flex-col relative z-10">
                        <Navbar />
                        <div className="flex-grow flex flex-col items-center justify-center p-6">
                            <div className="luxury-card w-full max-w-md p-10 relative overflow-hidden">
                                <div className="absolute top-0 left-0 w-full h-2 bg-gradient-to-r from-blue-400 to-blue-600"></div>
                                <button onClick={goHome} className="absolute top-6 left-6 text-gray-400 hover:text-gray-900 transition-colors text-sm font-medium dark:hover:text-white"><i className="fa-solid fa-arrow-left mr-2"></i> กลับ</button>
                                <div className="text-center mt-12 mb-10"><div className="w-20 h-20 rounded-3xl mx-auto flex items-center justify-center mb-5 shadow-sm border bg-blue-50 border-blue-100 dark:bg-gray-800 dark:border-gray-700"><i className="fa-solid fa-clock-rotate-left text-3xl text-blue-500"></i></div><h2 className="text-xl font-bold text-gray-900 tracking-tight dark:text-white">ประวัติกิจกรรม</h2><p className="text-gray-500 mt-2 text-xs font-medium leading-relaxed">ตรวจสอบประวัติการเข้าร่วมกิจกรรมของคุณทั้งหมดในระบบ</p></div>
                                <form onSubmit={(e) => { e.preventDefault(); handleSearchHistory(e.target.studentId.value); }}>
                                    <div className="mb-6"><input type="text" name="studentId" required placeholder="กรอกรหัสนักศึกษา..." defaultValue={localStorage.getItem('last_student_id')||''} className="w-full luxury-input text-center tracking-widest text-lg font-bold" /></div>
                                    <button type="submit" className="w-full bg-gradient-to-r from-blue-500 to-blue-600 hover:from-blue-600 hover:to-blue-700 text-white shadow-lg shadow-blue-500/30 rounded-2xl py-3.5 font-bold tracking-[0.1em] text-base transition-all hover:-translate-y-1">ค้นหา <i className="fa-solid fa-search ml-2 text-sm"></i></button>
                                </form>
                            </div>
                        </div>
                        <Footer />
                        <MobileTabBar />

            }

            if (view === 'history_result') {
                return (
                    <div className="min-h-screen flex flex-col relative z-10">
                        <Navbar />
                        <div className="flex-grow flex flex-col items-center pt-8 p-4 pb-20">
                            <div className="luxury-card w-full max-w-3xl p-6 sm:p-10 relative overflow-hidden shadow-soft">
                                <div className="absolute top-0 left-0 w-full h-1.5 bg-gradient-to-r from-blue-400 to-blue-600"></div>
                                <div className="flex flex-col sm:flex-row items-start sm:items-center justify-between mb-8 border-b border-gray-100 dark:border-gray-800 pb-5 gap-4 pt-2">
                                    <div><h2 className="text-xl font-bold text-gray-900 dark:text-white tracking-wide flex items-center gap-3"><i className="fa-solid fa-clock-rotate-left text-blue-500 bg-blue-50 p-2 rounded-lg"></i> ประวัติกิจกรรม</h2><p className="text-gray-500 text-xs font-bold mt-2 bg-gray-50 dark:bg-gray-800 px-3 py-1.5 rounded-lg inline-block border border-gray-200 dark:border-gray-700 shadow-sm uppercase tracking-widest">พบข้อมูลทั้งหมด <span className="text-blue-600 font-black">{historyData.length}</span> รายการ</p></div>
                                    <button onClick={() => setView('history_search')} className="text-xs text-gray-500 hover:text-gray-900 bg-white border border-gray-200 hover:border-gray-300 hover:bg-gray-50 px-4 py-2.5 rounded-xl font-bold transition-all dark:bg-gray-800 dark:border-gray-700 dark:hover:bg-gray-700 dark:hover:text-white shadow-sm uppercase tracking-wider"><i className="fa-solid fa-search mr-1.5"></i>ค้นหาใหม่</button>
                                </div>
                                <div className="space-y-4">
                                    {historyData.length === 0 ? (<div className="text-center py-20 bg-gray-50/50 dark:bg-gray-800/50 rounded-3xl border-2 border-dashed border-gray-200 dark:border-gray-700"><div className="w-16 h-16 bg-white dark:bg-gray-700 rounded-2xl flex items-center justify-center shadow-sm border border-gray-100 dark:border-gray-600 mb-4 text-gray-400 mx-auto"><i className="fa-solid fa-folder-open text-2xl"></i></div><p className="text-gray-500 font-bold text-sm">ไม่พบประวัติการเข้าร่วมกิจกรรม</p></div>) : (
                                        <div className="relative border-l-2 border-blue-100 dark:border-blue-900/50 ml-4 sm:ml-6 pl-6 sm:pl-10 space-y-8 py-4">
                                            {historyData.map((h, i) => (
                                                <div key={i} className="relative group">
                                                    <div className="absolute -left-[33px] sm:-left-[49px] top-4 w-4 h-4 bg-white dark:bg-gray-900 border-4 border-blue-500 rounded-full transition-transform group-hover:scale-125 group-hover:bg-blue-100 shadow-sm"></div>
                                                    <div className="bg-white dark:bg-gray-800/90 p-5 sm:p-6 rounded-2xl border border-gray-100 dark:border-gray-700 shadow-sm transition-all hover:shadow-md hover:border-blue-200 dark:hover:border-blue-900/50 flex flex-col sm:flex-row sm:justify-between sm:items-center gap-4 group-hover:-translate-y-0.5">
                                                        <div><span className="inline-block bg-blue-50 text-blue-600 border border-blue-100 text-[9px] font-bold uppercase tracking-widest px-2.5 py-1 rounded-md mb-2.5 dark:bg-blue-900/30 dark:border-blue-800 dark:text-blue-400"><i className="fa-solid fa-check mr-1"></i> เข้าร่วมแล้ว</span><h4 className="font-bold text-gray-900 dark:text-white text-base sm:text-lg mb-1">{h.ActivityName || h['ชื่อกิจกรรม'] || h.ActivityID || 'กิจกรรม'}</h4><p className="text-xs text-gray-500 font-medium">{h.Name || h['ชื่อ-สกุล'] || h['ชื่อ']} <span className="mx-1 text-gray-300">|</span> <span className="font-mono text-gray-400">{h.StudentID || h['รหัสนักศึกษา']}</span></p></div>
                                                        <div className="text-[10px] text-gray-700 dark:text-gray-300 font-bold tracking-widest uppercase whitespace-nowrap bg-gray-50 dark:bg-gray-900 px-4 py-2.5 rounded-xl border border-gray-200 dark:border-gray-700 shadow-inner flex items-center gap-2 w-fit"><i className="fa-regular fa-clock text-blue-400 text-sm"></i>{new Date(h.Timestamp || h['เวลา'] || Date.now()).toLocaleString('th-TH')}</div>
                                                    </div>
                                                </div>
                                            ))}
                                        </div>
                                    )}
                                </div>
                            </div>
                        </div>
                        <Footer />
                        <MobileTabBar />
                    </div>
                );
            }

            if (view === 'admin_login') {
                const handleAdminLogin = (e) => { e.preventDefault(); if(e.target.username.value === 'admin' && e.target.password.value === '9999') { localStorage.setItem('admin_logged_in', 'true'); loadAdminData(); } else { Swal.fire({ title: 'ข้อมูลเข้าสู่ระบบไม่ถูกต้อง', text: 'รหัสผ่านหรือชื่อผู้ใช้ผิด', icon: 'error', confirmButtonColor: '#ff621f' }).then(() => goHome()); } };
                return (
                    <div className="min-h-screen flex flex-col bg-[#0f172a] relative overflow-hidden">
                        <div className="absolute top-0 left-0 w-full h-full overflow-hidden z-0"><div className="absolute -top-40 -left-40 w-96 h-96 bg-brand-500 rounded-full mix-blend-screen filter blur-[120px] opacity-20"></div><div className="absolute top-40 right-20 w-80 h-80 bg-blue-500 rounded-full mix-blend-screen filter blur-[120px] opacity-20"></div></div>
                        <div className="flex-grow flex items-center justify-center p-6 relative z-10">
                            <div className="bg-white/10 backdrop-blur-2xl border border-white/10 w-full max-w-sm p-10 rounded-[2rem] shadow-2xl">
                                <div className="text-center mb-10"><div className="w-16 h-16 bg-white/10 rounded-2xl flex items-center justify-center text-white text-2xl mx-auto mb-5 border border-white/20 shadow-inner"><i className="fa-solid fa-shield-halved"></i></div><h2 className="text-xl font-bold text-white tracking-[0.2em] uppercase">พื้นที่ผู้ดูแลระบบ</h2><p className="text-blue-200/60 mt-1.5 text-[10px] font-bold tracking-widest uppercase">Admin Workspace</p></div>
                                <form onSubmit={handleAdminLogin} className="space-y-5">
                                    <div><label className="block text-[10px] font-bold text-gray-400 mb-2 uppercase tracking-widest">Username</label><input type="text" name="username" required className="w-full bg-black/40 border border-white/10 text-white px-5 py-3.5 rounded-xl focus:border-brand-500 focus:bg-black/60 outline-none transition-all font-medium text-sm shadow-inner" /></div>
                                    <div><label className="block text-[10px] font-bold text-gray-400 mb-2 uppercase tracking-widest">Password</label><input type="password" name="password" required className="w-full bg-black/40 border border-white/10 text-white px-5 py-3.5 rounded-xl focus:border-brand-500 focus:bg-black/60 outline-none transition-all font-medium text-sm shadow-inner" /></div>
                                    <button type="submit" className="w-full bg-gradient-to-r from-brand-500 to-rose-500 text-white py-4 rounded-xl font-bold tracking-[0.1em] text-xs uppercase mt-8 shadow-lg shadow-brand-500/20 hover:shadow-brand-500/40 transition-all hover:-translate-y-0.5 flex items-center justify-center gap-2">Secure Login <i className="fa-solid fa-arrow-right"></i></button>
                                </form>
                                <button onClick={goHome} className="w-full text-gray-500 hover:text-white mt-6 text-[10px] transition-colors font-bold uppercase tracking-widest flex items-center justify-center gap-1.5"><i className="fa-solid fa-arrow-left"></i> Return Home</button>
                            </div>
                        </div>
                    </div>
                );
            }

            if (view === 'admin_dashboard') return <AdminDashboard data={adminData} reloadData={loadAdminData} goHome={goHome} setAdminData={setAdminData} />;
            return null;
        }

        function AdminDashboard({ data, reloadData, goHome, setAdminData }) {
            const [activeTab, setActiveTab] = useState('overview');
            const [selectedActivityForSummary, setSelectedActivityForSummary] = useState('');
            const [searchCheckinTerm, setSearchCheckinTerm] = useState('');
            const [selectedActivityForSpss, setSelectedActivityForSpss] = useState('');
            const [currentPage, setCurrentPage] = useState(1);
            const [overviewActivityPage, setOverviewActivityPage] = useState(1);
            const [searchOverviewActTerm, setSearchOverviewActTerm] = useState('');
            const [shirtOrderPage, setShirtOrderPage] = useState(1);
            const [selectedRecruitForRegis, setSelectedRecruitForRegis] = useState('');
            const [searchRegisTerm, setSearchRegisTerm] = useState('');
            const [regisPage, setRegisPage] = useState(1);
            
            const itemsPerPage = 10; const shirtItemsPerPage = 10; const regisItemsPerPage = 10;
            const systemOpen = data?.shirtPrice?.systemStatus === 'open';

            const activeUsersCount = useMemo(() => {
                if (!data || (!data.checkins && !data.registrations)) return 1;
                const fifteenMinsAgo = Date.now() - (15 * 60000);
                const uniqueRecent = new Set();
                (data.checkins || []).forEach(c => { if (new Date(c.Timestamp).getTime() >= fifteenMinsAgo && c.StudentID) uniqueRecent.add(String(c.StudentID).trim()); });
                (data.registrations || []).forEach(r => { if (new Date(r.Timestamp).getTime() >= fifteenMinsAgo && r.StudentID) uniqueRecent.add(String(r.StudentID).trim()); });
                return uniqueRecent.size > 0 ? uniqueRecent.size + 1 : 1; 
            }, [data]);

            const overviewStats = useMemo(() => {
                if (!data) return { totalUniqueUsers: 0, todayCheckins: 0, todayOrders: 0, todaysTransactions: 0 };
                const uniqueUsers = new Set();
                const startOfToday = new Date(); startOfToday.setHours(0, 0, 0, 0); const startOfTodayTime = startOfToday.getTime();
                let todayCheckins = 0; let todayOrders = 0; let todayRegis = 0;
                (data.checkins || []).forEach(c => { if(c.StudentID) uniqueUsers.add(String(c.StudentID).trim()); if(c.Timestamp && new Date(c.Timestamp).getTime() >= startOfTodayTime) todayCheckins++; });
                (data.shirtOrders || []).forEach(o => { if(o.StudentID) uniqueUsers.add(String(o.StudentID).trim()); if(o.Timestamp && new Date(o.Timestamp).getTime() >= startOfTodayTime) todayOrders++; });
                (data.evaluations || []).forEach(e => { if(e.StudentID) uniqueUsers.add(String(e.StudentID).trim()); });
                (data.registrations || []).forEach(r => { if(r.StudentID) uniqueUsers.add(String(r.StudentID).trim()); if(r.Timestamp && new Date(r.Timestamp).getTime() >= startOfTodayTime) todayRegis++; });
                return { totalUniqueUsers: uniqueUsers.size, todayCheckins, todayOrders, todaysTransactions: todayCheckins + todayOrders + todayRegis };
            }, [data]);

            const checkinCountByActivity = useMemo(() => {
                const counts = {}; if (!data || !data.checkins) return counts;
                (data.checkins || []).forEach(c => { const id = String(c.ActivityID).trim(); counts[id] = (counts[id] || 0) + 1; });
                return counts;
            }, [data]);

            const regisCountByRecruit = useMemo(() => {
                const counts = {}; if (!data || !data.registrations) return counts;
                (data.registrations || []).forEach(r => { const id = String(r.RecruitID).trim(); counts[id] = (counts[id] || 0) + 1; });
                return counts;
            }, [data]);

            const filteredCheckins = useMemo(() => {
                if (!data || !data.checkins) return [];
                return (data.checkins || []).filter(c => {
                    const matchActivity = selectedActivityForSummary ? String(c.ActivityID).trim() === String(selectedActivityForSummary).trim() : true;
                    if (!matchActivity) return false;
                    const term = (searchCheckinTerm || '').toLowerCase().trim();
                    if (!term) return true;
                    return String(c.StudentID || '').toLowerCase().includes(term) || String(c.Name || '').toLowerCase().includes(term) || String(c.Major || '').toLowerCase().includes(term) || String(c.IDCard || '').toLowerCase().includes(term);
                });
            }, [data, selectedActivityForSummary, searchCheckinTerm]);

            const filteredRegistrations = useMemo(() => {
                if (!data || !data.registrations) return [];
                return (data.registrations || []).filter(r => {
                    const matchRecruit = selectedRecruitForRegis ? String(r.RecruitID).trim() === String(selectedRecruitForRegis).trim() : true;
                    if (!matchRecruit) return false;
                    const term = (searchRegisTerm || '').toLowerCase().trim();
                    if (!term) return true;
                    return String(r.StudentID || '').toLowerCase().includes(term) || String(r.Name || '').toLowerCase().includes(term) || String(r.Major || '').toLowerCase().includes(term) || String(r.IDCard || '').toLowerCase().includes(term);

                                    <div className="lg:col-span-1 bg-gray-900 p-7 rounded-[1.5rem] shadow-lg shadow-gray-900/10 flex flex-col justify-between h-48 relative overflow-hidden group"><div className="absolute right-0 top-0 w-32 h-32 bg-rose-500 rounded-full mix-blend-screen filter blur-3xl opacity-30 group-hover:scale-150 transition-transform duration-700"></div><div className="relative z-10 flex justify-between items-start"><div className="w-12 h-12 bg-white/10 rounded-xl flex items-center justify-center text-rose-400 border border-white/10 shadow-inner text-xl backdrop-blur-sm"><i className="fa-solid fa-sack-dollar"></i></div><span className="bg-white/10 text-white/90 text-[9px] font-black uppercase tracking-widest px-2.5 py-1 rounded border border-white/20 flex items-center gap-1.5"><i className="fa-solid fa-receipt"></i> {(data.shirtOrders||[]).length} บิล</span></div><div className="relative z-10 mt-auto pt-4"><p className="text-[10px] font-bold text-gray-400 uppercase tracking-[0.2em] mb-1">ยอดรับชำระทั้งหมด</p><p className="text-4xl lg:text-5xl font-black text-white tracking-tight drop-shadow-md"><span className="text-xl opacity-50 mr-1 font-medium">฿</span>{(data.shirtOrders||[]).reduce((sum, o) => sum + (Number(o.TotalPrice) || 0), 0).toLocaleString()}</p></div></div>
                                    <div className="lg:col-span-3 bg-white p-7 rounded-[1.5rem] border border-gray-100 shadow-sm relative">
                                        <div className="flex items-center gap-4 mb-6 pb-4 border-b border-gray-50"><div className="w-10 h-10 bg-blue-50 rounded-xl flex items-center justify-center text-blue-500 border border-blue-100"><i className="fa-solid fa-chart-pie"></i></div><div><h3 className="text-base font-bold text-gray-900 tracking-tight">สรุปยอดตามสาขา</h3><p className="text-[10px] text-gray-400 font-bold uppercase tracking-widest mt-0.5">Statistics by Major</p></div></div>
                                        <div className="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 gap-4">
                                            {shirtOrdersByMajor.map(([major, stats], idx) => (
                                                <div key={idx} className="group relative p-4 bg-gray-50 rounded-xl border border-gray-100 hover:border-blue-300 hover:bg-white hover:shadow-md transition-all duration-300"><div className="flex justify-between items-start mb-2"><div className="w-7 h-7 bg-white text-gray-400 group-hover:bg-blue-500 group-hover:text-white rounded-lg flex items-center justify-center transition-colors shadow-sm border border-gray-100 group-hover:border-blue-500 text-xs"><i className="fa-solid fa-graduation-cap"></i></div><span className="bg-gray-200 text-gray-600 group-hover:bg-blue-100 group-hover:text-blue-700 px-2 py-0.5 rounded font-black text-[9px] transition-colors border border-transparent group-hover:border-blue-200">{stats.count} บิล</span></div><h4 className="font-bold text-gray-900 text-xs mb-2 line-clamp-1 group-hover:text-blue-600 transition-colors" title={major}>{major}</h4><div className="flex items-baseline gap-1 mt-auto"><span className="text-[10px] font-bold text-gray-400">฿</span><span className="text-base font-black text-gray-900 group-hover:text-blue-600 transition-colors tracking-tight">{stats.total.toLocaleString()}</span></div></div>
                                            ))}
                                            {(data.shirtOrders||[]).length === 0 && (<div className="col-span-full flex flex-col items-center justify-center py-10 bg-gray-50/50 rounded-xl border-2 border-dashed border-gray-200"><div className="w-12 h-12 bg-white rounded-full flex items-center justify-center shadow-sm border border-gray-100 mb-3"><i className="fa-solid fa-box-open text-xl text-gray-300"></i></div><p className="text-sm text-gray-500 font-bold">ยังไม่มีข้อมูลการสั่งจองเสื้อ</p></div>)}
                                        </div>
                                    </div>
                                </div>
                                <div className="bg-white border border-gray-100 rounded-[1.5rem] overflow-hidden shadow-sm">
                                    <div className="overflow-x-auto">
                                        <table className="w-full text-left whitespace-nowrap modern-table">
                                            <thead><tr><th>วัน/เวลา</th><th>ข้อมูลผู้สั่งจอง</th><th className="text-center">โปโล</th><th className="text-center">เสื้อยืด</th><th className="text-right">ยอดรวม</th><th className="text-center">หลักฐาน</th><th className="text-center">สถานะออเดอร์</th></tr></thead>
                                            <tbody className="text-sm text-gray-800">
                                            {currentShirtOrders.map((o,i)=>(
                                                <tr key={i} className="hover:bg-rose-50/30 transition-colors group">
                                                    <td><span className="block font-bold text-gray-900 text-xs">{new Date(o.Timestamp).toLocaleDateString('th-TH')}</span><span className="block text-[10px] text-gray-400 font-bold tracking-widest mt-0.5"><i className="fa-regular fa-clock"></i> {new Date(o.Timestamp).toLocaleTimeString('th-TH', {hour:'2-digit',minute:'2-digit'})}</span></td>
                                                    <td><div className="flex flex-col gap-1"><span className="inline-block bg-gray-100 text-gray-600 text-[9px] font-black tracking-widest px-2 py-0.5 rounded border border-gray-200 w-fit">{o.StudentID}</span><span className="font-bold text-gray-900">{o.Name}</span></div></td>
                                                    <td className="text-center"><div className="inline-flex items-center justify-center gap-1.5 bg-gray-50 px-2.5 py-1 rounded-md border border-gray-100 text-xs"><span className="text-gray-600">{o.PoloGender}</span><span className="text-gray-300">|</span><span className="text-gray-600 font-bold">{o.PoloSize}</span><span className="font-black text-gray-900 ml-1 text-[10px] bg-white px-1.5 rounded border border-gray-200">x{o.PoloQty}</span></div></td>
                                                    <td className="text-center"><div className="inline-flex items-center justify-center gap-1.5 bg-gray-50 px-2.5 py-1 rounded-md border border-gray-100 text-xs"><span className="text-gray-600">{o.TshirtGender}</span><span className="text-gray-300">|</span><span className="text-gray-600 font-bold">{o.TshirtSize}</span><span className="font-black text-gray-900 ml-1 text-[10px] bg-white px-1.5 rounded border border-gray-200">x{o.TshirtQty}</span></div></td>
                                                    <td className="text-right font-black text-gray-900 text-sm">฿{o.TotalPrice.toLocaleString()}</td>
                                                    <td className="text-center">
                                                        {(() => {
                                                            const rawSlip = o.SlipImage || o.SlipURL || o.Slip || ''; const slipStr = String(rawSlip).trim(); const hasValidSlip = slipStr && slipStr !== 'null' && slipStr !== 'undefined' && slipStr !== '-';
                                                            if (o.PaymentMethod === 'cash') { return <span className="text-[9px] font-black text-amber-600 bg-amber-50 border border-amber-200 px-2 py-1 rounded shadow-sm whitespace-nowrap"><i className="fa-solid fa-coins mr-1"></i> เงินสด</span>; } else if (hasValidSlip) { return (<button onClick={() => { if (slipStr.startsWith('data:image')) { Swal.fire({imageUrl: slipStr, imageAlt: 'Slip'}); } else if (slipStr.startsWith('http')) { window.open(slipStr, '_blank'); } else if (/^[a-zA-Z0-9_-]{15,}$/.test(slipStr)) { window.open(`https://drive.google.com/file/d/${slipStr}/view`, '_blank'); } else { Swal.fire('ข้อผิดพลาด', 'ข้อมูลรูปภาพไม่ถูกต้อง', 'error'); } }} className="text-blue-500 hover:text-white bg-blue-50 hover:bg-blue-500 w-8 h-8 rounded-lg flex items-center justify-center mx-auto transition-all shadow-sm border border-blue-100" title="ดูสลิปโอนเงิน"><i className="fa-solid fa-image"></i></button>); } else { return <span className="text-xs text-gray-300 font-bold">-</span>; }
                                                        })()}
                                                    </td>
                                                    <td className="text-center">
                                                        <button onClick={async () => { Swal.fire({ title: 'กำลังอัปเดต...', allowOutsideClick: false, didOpen: () => Swal.showLoading() }); try { const newStatus = o.Status === 'received' ? 'paid' : 'received'; await runGAS('updateShirtOrderStatus', o.StudentID, newStatus); setAdminData(prev => ({ ...prev, shirtOrders: prev.shirtOrders.map(so => so.StudentID === o.StudentID ? { ...so, Status: newStatus } : so) })); Swal.close(); Swal.fire({ toast: true, position: 'top-end', showConfirmButton: false, timer: 1500, icon: 'success', title: `อัปเดตสถานะสำเร็จ` }); } catch(err) { Swal.fire('ข้อผิดพลาด', err.message, 'error'); } }} className={`px-3 py-1.5 rounded-lg text-[9px] font-black uppercase tracking-widest border transition-all shadow-sm w-full max-w-[90px] mx-auto block ${o.Status === 'received' ? 'text-rose-600 border-rose-200 bg-rose-50 hover:bg-rose-500 hover:text-white hover:border-rose-500' : 'text-green-700 border-green-200 bg-green-50 hover:bg-green-500 hover:text-white hover:border-green-500'}`}><i className={`fa-solid ${o.Status === 'received' ? 'fa-spinner' : 'fa-check'} mr-1`}></i> {o.Status === 'received' ? 'รอยืนยัน' : 'ชำระแล้ว'}</button>
                                                    </td>
                                                </tr>
                                            ))}
                                            {(data.shirtOrders||[]).length===0 && <tr><td colSpan="7" className="text-center py-16 text-gray-400 font-bold text-sm bg-gray-50/50"><i className="fa-solid fa-inbox block text-3xl mb-3 text-gray-300"></i> ยังไม่มีออเดอร์</td></tr>}
                                        </tbody></table>
                                    </div>
                                    {totalShirtPages > 1 && (<div className="flex justify-between items-center p-4 border-t border-gray-100 bg-gray-50/50"><button disabled={shirtOrderPage===1} onClick={()=>setShirtOrderPage(p=>Math.max(1,p-1))} className="text-[10px] uppercase tracking-widest font-bold text-gray-500 hover:text-gray-900 px-3 py-1.5 transition-colors disabled:opacity-30">ก่อนหน้า</button><span className="text-gray-500 font-bold text-[10px] uppercase tracking-widest bg-white px-3 py-1.5 rounded-lg border border-gray-200 shadow-sm">หน้า {shirtOrderPage} จาก {totalShirtPages}</span><button disabled={shirtOrderPage===totalShirtPages} onClick={()=>setShirtOrderPage(p=>Math.min(totalShirtPages,p+1))} className="text-[10px] uppercase tracking-widest font-bold text-gray-500 hover:text-gray-900 px-3 py-1.5 transition-colors disabled:opacity-30">ถัดไป</button></div>)}
                                </div>
                            </div>
                        )}
                        
                        <div className="mt-12 pt-6 border-t border-gray-200 text-left flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                            <div><p className="text-[10px] font-black text-gray-400 tracking-[0.2em] uppercase mb-1">Digit Platform Architecture</p><p className="text-[9px] text-gray-500 font-bold tracking-widest uppercase">Faculty of Digital Technology, Chiang Rai Rajabhat University</p></div>
                            <div className="text-[9px] text-gray-400 font-black tracking-[0.2em] uppercase bg-gray-100 px-3 py-1 rounded-md">SYSTEM V 3.0</div>
                        </div>
                    </main>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
