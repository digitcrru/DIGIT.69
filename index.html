                                        <div className="relative z-10 flex justify-between items-start">
                                            <div className="w-12 h-12 bg-white/10 rounded-xl flex items-center justify-center text-brand-400 border border-white/20 shadow-inner text-xl"><i className="fa-solid fa-sack-dollar"></i></div>
                                            <span className="bg-white/10 text-white/90 text-[10px] font-bold uppercase tracking-widest px-3 py-1.5 rounded-lg border border-white/20 flex items-center gap-1.5"><i className="fa-solid fa-receipt"></i> {(data.shirtOrders||[]).length} บิล</span>
                                        </div>
                                        <div className="relative z-10 mt-auto pt-4">
                                            <p className="text-[10px] font-bold text-gray-400 uppercase tracking-[0.2em] mb-1">ยอดรับชำระทั้งหมด</p>
                                            <p className="text-4xl lg:text-5xl font-extrabold text-white tracking-tight drop-shadow-md">
                                                <span className="text-xl opacity-60 mr-1 font-medium">฿</span>
                                                {(data.shirtOrders||[]).reduce((sum, o) => sum + (Number(o.TotalPrice) || 0), 0).toLocaleString()}
                                            </p>
                                        </div>
                                    </div>

                                    <div className="lg:col-span-3 bg-white p-8 rounded-3xl border border-gray-200 shadow-sm relative">
                                        <div className="flex items-center gap-4 mb-8 pb-4 border-b border-gray-100">
                                            <div className="w-12 h-12 bg-blue-50 rounded-xl flex items-center justify-center text-blue-500 shadow-sm border border-blue-100">
                                                <i className="fa-solid fa-chart-pie text-xl"></i>
                                            </div>
                                            <div>
                                                <h3 className="text-xl font-bold text-gray-900 tracking-tight">สรุปยอดตามสาขาวิชา</h3>
                                                <p className="text-xs text-gray-500 font-medium mt-1">สถิติการสั่งจองและยอดเงิน เรียงตามจำนวนผู้สั่งซื้อ</p>
                                            </div>
                                        </div>

                                        <div className="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 gap-4">
                                            {shirtOrdersByMajor.map(([major, stats], idx) => (
                                                <div key={idx} className="group relative p-5 bg-gray-50 rounded-2xl border border-gray-200 hover:border-blue-400 hover:bg-white hover:shadow-lg hover:shadow-blue-500/10 transition-all duration-300 transform hover:-translate-y-1">
                                                    <div className="flex justify-between items-start mb-3">
                                                        <div className="w-8 h-8 bg-white text-gray-400 group-hover:bg-blue-500 group-hover:text-white rounded-lg flex items-center justify-center transition-colors shadow-sm border border-gray-100 group-hover:border-blue-500 text-sm">
                                                            <i className="fa-solid fa-graduation-cap"></i>
                                                        </div>
                                                        <span className="bg-gray-200 text-gray-600 group-hover:bg-blue-100 group-hover:text-blue-700 px-2.5 py-1 rounded-md font-bold text-[10px] transition-colors border border-transparent group-hover:border-blue-200">
                                                            {stats.count} บิล
                                                        </span>
                                                    </div>
                                                    <h4 className="font-bold text-gray-900 text-sm mb-2 line-clamp-1 group-hover:text-blue-600 transition-colors" title={major}>
                                                        {major}
                                                    </h4>
                                                    <div className="flex items-baseline gap-1 mt-auto">
                                                        <span className="text-[10px] font-bold text-gray-400">฿</span>
                                                        <span className="text-lg font-extrabold text-gray-900 group-hover:text-blue-600 transition-colors tracking-tight">{stats.total.toLocaleString()}</span>
                                                    </div>
                                                </div>
                                            ))}
                                            {(data.shirtOrders||[]).length === 0 && (
                                                <div className="col-span-full flex flex-col items-center justify-center py-12 bg-gray-50/50 rounded-2xl border-2 border-dashed border-gray-200">
                                                    <div className="w-16 h-16 bg-white rounded-full flex items-center justify-center shadow-sm border border-gray-100 mb-4">
                                                        <i className="fa-solid fa-box-open text-2xl text-gray-300"></i>
                                                    </div>
                                                    <p className="text-base text-gray-500 font-bold">ยังไม่มีข้อมูลการสั่งจองเสื้อ</p>
                                                </div>
                                            )}
                                        </div>
                                    </div>
                                </div>

                                <div className="bg-white border border-gray-200 rounded-3xl overflow-x-auto shadow-sm">
                                    <table className="w-full text-sm text-left whitespace-nowrap">
                                        <thead className="bg-gray-50 border-b border-gray-200 text-[10px] text-gray-500 font-bold uppercase tracking-[0.2em]">
                                            <tr>
                                                <th className="px-8 py-5">วันและเวลา</th>
                                                <th className="px-8 py-5">ข้อมูลนักศึกษา</th>
                                                <th className="px-8 py-5 text-center">เสื้อโปโล</th>
                                                <th className="px-8 py-5 text-center">เสื้อยืด</th>
                                                <th className="px-8 py-5 text-right">จำนวนเงิน</th>
                                                <th className="px-8 py-5 text-center">หลักฐาน</th>
                                                <th className="px-8 py-5 text-right">สถานะ</th>
                                            </tr>
                                        </thead>
                                        <tbody className="divide-y divide-gray-100 font-medium text-gray-800">
                                        {currentShirtOrders.map((o,i)=>(
                                            <tr key={i} className="hover:bg-brand-50/30 transition-colors group">
                                                <td className="px-8 py-5">
                                                    <span className="block text-sm text-gray-900">{new Date(o.Timestamp).toLocaleDateString('th-TH')}</span>
                                                    <span className="block text-xs text-gray-400 mt-1"><i className="fa-regular fa-clock mr-1"></i> {new Date(o.Timestamp).toLocaleTimeString('th-TH', {hour:'2-digit',minute:'2-digit'})} น.</span>
                                                </td>
                                                <td className="px-8 py-5">
                                                    <span className="inline-block bg-gray-100 text-gray-700 text-[10px] font-bold px-2 py-0.5 rounded border border-gray-200 mb-1">{o.StudentID}</span>
                                                    <p className="text-sm font-bold text-gray-900">{o.Name}</p>
                                                </td>
                                                <td className="px-8 py-5 text-center">
                                                    <div className="inline-flex items-center justify-center gap-2 bg-gray-50 px-3 py-1.5 rounded-lg border border-gray-100">
                                                        <span className="text-xs text-gray-600">{o.PoloGender}</span>
                                                        <span className="text-gray-300">|</span>
                                                        <span className="text-xs text-gray-600">{o.PoloSize}</span>
                                                        <span className="font-black text-gray-900 ml-1">x{o.PoloQty}</span>
                                                    </div>
                                                </td>
                                                <td className="px-8 py-5 text-center">
                                                    <div className="inline-flex items-center justify-center gap-2 bg-gray-50 px-3 py-1.5 rounded-lg border border-gray-100">
                                                        <span className="text-xs text-gray-600">{o.TshirtGender}</span>
                                                        <span className="text-gray-300">|</span>
                                                        <span className="text-xs text-gray-600">{o.TshirtSize}</span>
                                                        <span className="font-black text-gray-900 ml-1">x{o.TshirtQty}</span>
                                                    </div>
                                                </td>
                                                <td className="px-8 py-5 text-right font-black text-gray-900 text-base">฿{o.TotalPrice.toLocaleString()}</td>
                                                <td className="px-8 py-5 text-center">
                                                    {(() => {
                                                        const rawSlip = o.SlipImage || o.SlipURL || o.Slip || '';
                                                        const slipStr = String(rawSlip).trim();
                                                        const hasValidSlip = slipStr && slipStr !== 'null' && slipStr !== 'undefined' && slipStr !== '-';
                                                        
                                                        if (o.PaymentMethod === 'cash') {
                                                            return <span className="text-[10px] font-bold text-amber-600 bg-amber-50 border border-amber-200 px-3 py-1.5 rounded-lg whitespace-nowrap"><i className="fa-solid fa-money-bill-wave mr-1"></i> เงินสด</span>;
                                                        } else if (hasValidSlip) {
                                                            return (
                                                                <button onClick={() => {
                                                                    if (slipStr.startsWith('data:image')) { Swal.fire({imageUrl: slipStr, imageAlt: 'Slip'}); } 
                                                                    else if (slipStr.startsWith('http')) { window.open(slipStr, '_blank'); } 
                                                                    else if (/^[a-zA-Z0-9_-]{15,}$/.test(slipStr)) { window.open(`https://drive.google.com/file/d/${slipStr}/view`, '_blank'); } 
                                                                    else { Swal.fire('ข้อผิดพลาด', 'ข้อมูลรูปภาพไม่ถูกต้อง', 'error'); }
                                                                }} className="text-blue-500 hover:text-white bg-blue-50 hover:bg-blue-600 w-10 h-10 rounded-xl flex items-center justify-center mx-auto transition-all shadow-sm border border-blue-100 hover:border-blue-600" title="ดูสลิปโอนเงิน">
                                                                    <i className="fa-solid fa-file-invoice text-lg"></i>
                                                                </button>
                                                            );
                                                        } else {
                                                            return <span className="text-xs text-gray-300 font-bold">-</span>;
                                                        }
                                                    })()}
                                                </td>
                                                <td className="px-8 py-5 text-right">
                                                    <button onClick={async () => {
                                                        Swal.fire({ title: 'กำลังอัปเดต...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });
                                                        try { 
                                                            const newStatus = o.Status === 'received' ? 'paid' : 'received';
                                                            await runGAS('updateShirtOrderStatus', o.StudentID, newStatus); 
                                                            setAdminData(prev => ({
                                                                ...prev,
                                                                shirtOrders: prev.shirtOrders.map(so => so.StudentID === o.StudentID ? { ...so, Status: newStatus } : so)
                                                            }));
                                                            Swal.close(); 
                                                            Swal.fire({ toast: true, position: 'top-end', showConfirmButton: false, timer: 1500, icon: 'success', title: `อัปเดตสถานะสำเร็จ` });
                                                        } catch(err) { Swal.fire('ข้อผิดพลาด', err.message, 'error'); }
                                                    }} className={`px-4 py-2 rounded-xl text-[10px] font-black uppercase tracking-widest border-2 transition-all shadow-sm ${o.Status === 'received' ? 'text-brand-600 border-brand-200 bg-brand-50 hover:bg-brand-500 hover:text-white hover:border-brand-500' : 'text-gray-900 border-gray-900 hover:bg-gray-900 hover:text-white'}`}>
                                                        {o.Status === 'received' ? 'รับออเดอร์' : 'จ่ายเงินแล้ว'}
                                                    </button>
                                                </td>
                                            </tr>
                                        ))}
                                        {(data.shirtOrders||[]).length===0 && <tr><td colSpan="7" className="text-center py-20 text-gray-400 font-bold text-lg"><i className="fa-solid fa-box-open block text-4xl mb-3 text-gray-300"></i> ยังไม่มีข้อมูลการสั่งจอง</td></tr>}
                                    </tbody></table>
                                </div>
                                {totalShirtPages > 1 && (
                                    <div className="flex justify-between items-center mt-6 bg-white p-4 rounded-2xl border border-gray-200 shadow-sm">
                                        <button disabled={shirtOrderPage===1} onClick={()=>setShirtOrderPage(p=>Math.max(1,p-1))} className="text-[10px] uppercase tracking-widest font-bold text-gray-600 bg-gray-100 hover:bg-gray-200 hover:text-gray-900 px-4 py-2 rounded-lg transition-colors disabled:opacity-30 disabled:cursor-not-allowed">ก่อนหน้า</button>
                                        <span className="text-gray-500 font-bold text-xs uppercase tracking-widest bg-gray-50 px-4 py-2 rounded-lg border border-gray-100">หน้า {shirtOrderPage} จาก {totalShirtPages}</span>
                                        <button disabled={shirtOrderPage===totalShirtPages} onClick={()=>setShirtOrderPage(p=>Math.min(totalShirtPages,p+1))} className="text-[10px] uppercase tracking-widest font-bold text-gray-600 bg-gray-100 hover:bg-gray-200 hover:text-gray-900 px-4 py-2 rounded-lg transition-colors disabled:opacity-30 disabled:cursor-not-allowed">ถัดไป</button>
                                    </div>
                                )}
                            </div>
                        )}
                        
                        <div className="mt-16 pt-8 border-t border-gray-200 text-left flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                            <div>
                                <p className="text-[10px] font-bold text-brand-500 tracking-[0.3em] uppercase mb-1">Digit Platform Architecture</p>
                                <p className="text-[9px] text-gray-400 font-bold tracking-widest uppercase">Faculty of Digital Technology, Chiang Rai Rajabhat University</p>
                            </div>
                            <div className="text-[9px] text-gray-300 font-medium tracking-[0.2em] uppercase">
                                SYSTEM V 2.5
                            </div>
                        </div>
                    </main>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
