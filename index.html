                                                        {drugAllergy === 'แพ้' && <input type="text" required placeholder="ระบุชื่อยา..." className="w-full input-modern rounded-xl px-4 py-3 text-sm mt-3 animate-fade-in" value={drugDetail} onChange={e => setDrugDetail(e.target.value)}/>}
                                                    </div>
                                                </div>
                                            </div>

                                            <button disabled={isSubmitting} type="submit" className="w-full py-4 rounded-xl text-base font-bold text-white brand-gradient hover:brand-gradient-hover shadow-lg shadow-brand/20 hover:shadow-brand/40 flex justify-center items-center gap-2 btn-interactive">
                                                {isSubmitting ? <Icon name="loader-2" className="animate-spin"/> : 'ยืนยันการลงทะเบียน'}
                                            </button>
                                        </form>
                                    </div>
                                ) : (
                                    /* Restored Check Public Tab */
                                    <div className="glass-panel p-5 sm:p-8 md:p-10 rounded-2xl md:rounded-[2rem] shadow-premium dark:shadow-premium-dark animate-slide-up">
                                        <div className="flex flex-col md:flex-row justify-between md:items-center gap-4 mb-6">
                                            <div>
                                                <h3 className="text-lg md:text-xl font-bold text-gray-900 dark:text-white">รายชื่อผู้ขึ้นทะเบียน</h3>
                                                <p className="text-xs md:text-sm text-gray-500 mt-1">ตรวจสอบสถานะการขึ้นทะเบียนของคุณ</p>
                                            </div>
                                            <div className="relative w-full md:w-64">
                                                <div className="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-gray-400"><Icon name="search" size={16}/></div>
                                                <input type="text" placeholder="ค้นหา รหัส, ชื่อ, สาขา..." value={searchPublic} onChange={e => { setSearchPublic(e.target.value); setPublicPage(1); }} className="w-full pl-10 pr-4 py-2.5 rounded-xl input-modern text-sm" />
                                            </div>
                                        </div>

                                        {loadingPublic ? (
                                            <div className="flex flex-col justify-center items-center py-16 animate-pulse-slow">
                                                <Icon name="loader-2" size={32} className="text-brand animate-spin mb-4" />
                                                <p className="text-sm font-medium text-gray-500">กำลังดาวน์โหลดข้อมูล...</p>
                                            </div>
                                        ) : (
                                            <div className="rounded-xl border border-gray-200/50 dark:border-zinc-800/50 overflow-hidden">
                                                <div className="overflow-x-auto w-full custom-scrollbar">
                                                    <table className="w-full text-sm text-left min-w-[500px]">
                                                        <thead className="text-xs text-gray-500 uppercase bg-gray-50 dark:bg-zinc-800/50">
                                                            <tr><th className="px-5 py-4 font-medium">รหัสนักศึกษา</th><th className="px-5 py-4 font-medium">ชื่อ-นามสกุล</th><th className="px-5 py-4 font-medium">สาขาวิชา</th></tr>
                                                        </thead>
                                                        <tbody className="divide-y divide-gray-100 dark:divide-zinc-800/50 bg-white/30 dark:bg-zinc-900/30">
                                                            {(() => {
                                                                const itemsPerPage = 10;
                                                                const currentItems = publicFilteredData.slice((publicPage - 1) * itemsPerPage, publicPage * itemsPerPage);
                                                                if (currentItems.length === 0) return <tr><td colSpan="3" className="text-center py-12 text-gray-400">ไม่พบข้อมูลผู้ขึ้นทะเบียน</td></tr>;
                                                                return currentItems.map((row, i) => (
                                                                    <tr key={i} className="hover:bg-white dark:hover:bg-zinc-800/50 transition-colors">
                                                                        <td className="px-5 py-4 font-mono font-bold text-brand">{row.StudentID}</td>
                                                                        <td className="px-5 py-4 font-medium text-gray-900 dark:text-white">{row.FullName}</td>
                                                                        <td className="px-5 py-4 text-xs text-gray-500">{row.Major}</td>
                                                                    </tr>
                                                                ));
                                                            })()}
                                                        </tbody>
                                                    </table>
                                                </div>
                                                {publicFilteredData.length > 0 && (
                                                    <div className="flex flex-col sm:flex-row justify-between items-center px-5 py-4 border-t border-gray-100 dark:border-zinc-800/50 gap-3 text-sm bg-white/50 dark:bg-zinc-900/50">
                                                        <span className="text-gray-500 text-xs sm:text-sm">แสดง {(publicPage - 1) * 10 + 1} - {Math.min(publicPage * 10, publicFilteredData.length)} จาก {publicFilteredData.length} รายการ</span>
                                                        <div className="flex gap-2">
                                                            <button onClick={() => setPublicPage(p => Math.max(1, p - 1))} disabled={publicPage === 1} className="px-3 py-1.5 rounded-lg bg-white dark:bg-zinc-800 border border-gray-200 dark:border-zinc-700 disabled:opacity-40 transition-colors text-xs sm:text-sm">ก่อนหน้า</button>
                                                            <button onClick={() => setPublicPage(p => p + 1)} disabled={publicPage * 10 >= publicFilteredData.length} className="px-3 py-1.5 rounded-lg bg-white dark:bg-zinc-800 border border-gray-200 dark:border-zinc-700 disabled:opacity-40 transition-colors text-xs sm:text-sm">ถัดไป</button>
                                                        </div>
                                                    </div>
                                                )}
                                            </div>
                                        )}
                                    </div>
                                )}
                                
                                <div className="text-center mt-8 pb-4 text-xs text-gray-400 font-medium">
                                    DIGIT.69 © {new Date().getFullYear()}
                                </div>
                            </div>
                        )}
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
