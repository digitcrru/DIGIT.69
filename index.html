                                <div className="text-center mb-10">
                                    <h2 className="text-2xl font-light text-white tracking-widest uppercase">Workspace</h2>
                                    <p className="text-gray-500 mt-2 text-sm font-light">สำหรับเจ้าหน้าที่เท่านั้น</p>
                                </div>
                                <form onSubmit={handleAdminLogin} className="space-y-6">
                                    <input type="text" name="username" placeholder="Username" required
                                           className="w-full border-b border-gray-700 bg-transparent text-white px-0 py-3 focus:border-orange-500 outline-none transition-colors font-light text-sm" />
                                    <input type="password" name="password" placeholder="Password" required
                                           className="w-full border-b border-gray-700 bg-transparent text-white px-0 py-3 focus:border-orange-500 outline-none transition-colors font-light text-sm" />
                                    <button type="submit" className="w-full bg-gradient-to-r from-orange-500 to-orange-600 text-white font-semibold py-4 rounded-lg hover:from-orange-400 hover:to-orange-500 transition-colors mt-8 text-sm tracking-wider shadow-lg">LOGIN</button>
                                </form>
                                <button onClick={goHome} className="w-full text-gray-500 hover:text-white mt-6 text-xs transition-colors font-light uppercase tracking-widest">กลับหน้าแรก</button>
                            </div>
                        </div>
                        <div className="absolute bottom-6 w-full text-center z-10">
                            <p className="text-[10px] text-gray-600 font-medium tracking-wider mb-1">Copyright &copy; 2026 DIGIT Good Deed System PRO.</p>
                            <p className="text-[9px] text-gray-700 font-light">ฝ่ายกิจการนักศึกษา คณะเทคโนโลยีดิจิทัล มหาวิทยาลัยราชภัฏเชียงราย</p>
                        </div>
                    </div>
                );
            }

            if (view === 'admin_dashboard') return <AdminDashboard data={adminData} reloadData={loadAdminData} goHome={goHome} setAdminData={setAdminData} />;

            return null;
        }

        function AdminDashboard({ data, reloadData, goHome, setAdminData }) {
            const [activeTab, setActiveTab] = useState('overview');
            const [selectedActivityForSummary, setSelectedActivityForSummary] = useState('');
            const [searchCheckinTerm, setSearchCheckinTerm] = useState('');
            const [selectedActivityForSpss, setSelectedActivityForSpss] = useState('');
            const [currentPage, setCurrentPage] = useState(1);
            const [overviewActivityPage, setOverviewActivityPage] = useState(1);
            const [searchOverviewActTerm, setSearchOverviewActTerm] = useState('');
            const [shirtOrderPage, setShirtOrderPage] = useState(1);
            const [selectedRecruitForRegis, setSelectedRecruitForRegis] = useState('');
            const [searchRegisTerm, setSearchRegisTerm] = useState('');
            const [regisPage, setRegisPage] = useState(1);
            
            const itemsPerPage = 10; const shirtItemsPerPage = 10; const regisItemsPerPage = 10;
            const systemOpen = data?.shirtPrice?.systemStatus !== 'maintenance';

            const activeUsersCount = useMemo(() => {
                if (!data) return 1;
                const minAgo = Date.now() - (15 * 60000);
                const s = new Set();
                (data.checkins||[]).forEach(c=>{if(new Date(c.Timestamp).getTime()>=minAgo && c.StudentID) s.add(c.StudentID);});
                (data.registrations||[]).forEach(c=>{if(new Date(c.Timestamp).getTime()>=minAgo && c.StudentID) s.add(c.StudentID);});
                return s.size > 0 ? s.size + 1 : 1; 
            }, [data]);

            const overviewStats = useMemo(() => {
                if (!data) return { totalUniqueUsers: 0, todayCheckins: 0, todayOrders: 0, todaysTransactions: 0 };
                const uniqueUsers = new Set();
                const startOfToday = new Date(); startOfToday.setHours(0, 0, 0, 0); const startOfTodayTime = startOfToday.getTime();
                let todayCheckins = 0; let todayOrders = 0; let todayRegis = 0;
                (data.checkins || []).forEach(c => { if(c.StudentID) uniqueUsers.add(String(c.StudentID).trim()); if(c.Timestamp && new Date(c.Timestamp).getTime() >= startOfTodayTime) todayCheckins++; });
                (data.shirtOrders || []).forEach(o => { if(o.StudentID) uniqueUsers.add(String(o.StudentID).trim()); if(o.Timestamp && new Date(o.Timestamp).getTime() >= startOfTodayTime) todayOrders++; });
                (data.evaluations || []).forEach(e => { if(e.StudentID) uniqueUsers.add(String(e.StudentID).trim()); });
                (data.registrations || []).forEach(r => { if(r.StudentID) uniqueUsers.add(String(r.StudentID).trim()); if(r.Timestamp && new Date(r.Timestamp).getTime() >= startOfTodayTime) todayRegis++; });
                return { totalUniqueUsers: uniqueUsers.size, todayCheckins, todayOrders, todaysTransactions: todayCheckins + todayOrders + todayRegis };
            }, [data]);

            const checkinCountByActivity = useMemo(() => {
                const counts = {}; if (!data || !data.checkins) return counts;
                (data.checkins || []).forEach(c => { const id = String(c.ActivityID).trim(); counts[id] = (counts[id] || 0) + 1; });
                return counts;
            }, [data]);

            const regisCountByRecruit = useMemo(() => {
                const counts = {}; if (!data || !data.registrations) return counts;
                (data.registrations || []).forEach(r => { const id = String(r.RecruitID).trim(); counts[id] = (counts[id] || 0) + 1; });
                return counts;
            }, [data]);

            const filteredCheckins = useMemo(() => {
                if (!data || !data.checkins) return [];
                return (data.checkins || []).filter(c => {
                    const matchActivity = selectedActivityForSummary ? String(c.ActivityID).trim() === String(selectedActivityForSummary).trim() : true;
                    if (!matchActivity) return false;
                    const term = (searchCheckinTerm || '').toLowerCase().trim();
                    if (!term) return true;
                    return String(c.StudentID || '').toLowerCase().includes(term) || String(c.Name || '').toLowerCase().includes(term) || String(c.Major || '').toLowerCase().includes(term) || String(c.IDCard || '').toLowerCase().includes(term);
                });
            }, [data, selectedActivityForSummary, searchCheckinTerm]);
            const sortedCheckins = useMemo(() => [...filteredCheckins].reverse(), [filteredCheckins]);

            const filteredRegistrations = useMemo(() => {
                if (!data || !data.registrations) return [];
                return (data.registrations || []).filter(r => {
                    const matchRecruit = selectedRecruitForRegis ? String(r.RecruitID).trim() === String(selectedRecruitForRegis).trim() : true;
                    if (!matchRecruit) return false;
                    const term = (searchRegisTerm || '').toLowerCase().trim();
                    if (!term) return true;
                    return String(r.StudentID || '').toLowerCase().includes(term) || String(r.Name || '').toLowerCase().includes(term) || String(r.Major || '').toLowerCase().includes(term) || String(r.IDCard || '').toLowerCase().includes(term);
                });
            }, [data, selectedRecruitForRegis, searchRegisTerm]);
            const sortedRegistrationsList = useMemo(() => [...filteredRegistrations].reverse(), [filteredRegistrations]);

            const shirtOrdersByMajor = useMemo(() => {
                if (!data || !data.shirtOrders) return [];
                const acc = {};
                (data.shirtOrders || []).forEach(o => {
                    const m = o.Major || 'ไม่ระบุสาขา'; if(!acc[m]) acc[m] = { count: 0, total: 0 };
                    acc[m].count++; acc[m].total += Number(o.TotalPrice) || 0;
                });
                return Object.entries(acc).sort((a,b) => b[1].count - a[1].count);
            }, [data]);
            const sortedShirtOrders = useMemo(() => [...(data?.shirtOrders || [])].reverse(), [data]);

            const filteredOverviewActivities = useMemo(() => {
                if (!data || !data.activities) return [];
                const term = (searchOverviewActTerm || '').toLowerCase().trim();
                if (!term) return data.activities;
                return (data.activities || []).filter(a => String(a.Name || '').toLowerCase().includes(term) || String(a.Location || '').toLowerCase().includes(term) || String(a.Date || '').toLowerCase().includes(term));
            }, [data, searchOverviewActTerm]);

            useEffect(() => { setCurrentPage(1); }, [selectedActivityForSummary, searchCheckinTerm]);
            useEffect(() => { setRegisPage(1); }, [selectedRecruitForRegis, searchRegisTerm]); 
            useEffect(() => { setOverviewActivityPage(1); }, [searchOverviewActTerm]); 
            useEffect(() => { setShirtOrderPage(1); }, [activeTab]); 

            const toggleSystem = async () => {
                const currentStatus = systemOpen ? 'maintenance' : 'open';
                Swal.fire({ title: 'กำลังอัปเดต...', allowOutsideClick: false, didOpen: () => { Swal.showLoading() } });
                try { 
                    await runGAS('toggleMasterSystemStatus', currentStatus); 
                    Swal.close(); reloadData(); 
                } catch(err) { Swal.fire('Error', err.message, 'error'); }
            };

            const handleCreateActivity = async (e) => {
                e.preventDefault(); Swal.fire({ title: 'กำลังบันทึก...', allowOutsideClick: false, didOpen: () => { Swal.showLoading() } });
                try { await runGAS('createActivity', { name: e.target.name.value, date: e.target.date.value, location: e.target.location.value }); Swal.fire('สำเร็จ', 'สร้างกิจกรรมเรียบร้อยแล้ว', 'success'); e.target.reset(); reloadData(); } catch(err) { Swal.fire('Error', err.message, 'error'); }
            };

            const toggleActivityStatus = async (id, currentStatus) => {
                Swal.fire({ title: 'กำลังอัปเดต...', allowOutsideClick: false, didOpen: () => { Swal.showLoading() } });
                try { 
                    const newStatus = currentStatus === 'open' ? 'closed' : 'open';
                    await runGAS('toggleActivityStatus', id, currentStatus); 
                    setAdminData(prev => ({...prev, activities: (prev?.activities || []).map(a => a.ActivityID === id ? { ...a, Status: newStatus } : a)}));
                    Swal.close(); Swal.fire({ toast: true, position: 'top-end', showConfirmButton: false, timer: 1500, icon: 'success', title: `อัปเดตกิจกรรมเป็น ${newStatus === 'open' ? 'เปิดรับ' : 'ปิดแล้ว'}` });
                } catch(err) { Swal.fire('Error', err.message, 'error'); }
            };

            const handleCreateRecruit = async (e) => {
                e.preventDefault(); Swal.fire({ title: 'กำลังบันทึก...', allowOutsideClick: false, didOpen: () => { Swal.showLoading() } });
                try { await runGAS('createRecruit', { name: e.target.name.value, date: e.target.date.value, location: e.target.location.value }); Swal.fire('สำเร็จ', 'สร้างประกาศรับสมัครเรียบร้อยแล้ว', 'success'); e.target.reset(); reloadData(); } catch(err) { Swal.fire('ข้อผิดพลาด', err.message, 'error'); }
            };

            const toggleRecruitStatus = async (id, currentStatus) => {
                Swal.fire({ title: 'กำลังอัปเดต...', allowOutsideClick: false, didOpen: () => { Swal.showLoading() } });
                try { const newStatus = currentStatus === 'open' ? 'closed' : 'open'; await runGAS('toggleRecruitStatus', id, currentStatus); setAdminData(prev => ({ ...prev, recruitments: prev.recruitments.map(r => r.RecruitID === id ? { ...r, Status: newStatus } : r) })); Swal.close(); Swal.fire({ toast: true, position: 'top-end', showConfirmButton: false, timer: 1500, icon: 'success', title: `อัปเดตสถานะแล้ว` }); } catch(err) { Swal.fire('ข้อผิดพลาด', err.message, 'error'); }
            };

            const handleToggleShirtSystem = async (currentStatus) => {
                Swal.fire({ title: 'กำลังอัปเดต...', allowOutsideClick: false, didOpen: () => { Swal.showLoading() } });
                try { const newStatus = currentStatus === 'open' ? 'closed' : 'open'; await runGAS('toggleShirtStatus', currentStatus); setAdminData(prev => ({ ...prev, shirtPrice: { ...(prev?.shirtPrice || {}), status: newStatus } })); Swal.close(); Swal.fire({ toast: true, position: 'top-end', showConfirmButton: false, timer: 1500, icon: 'success', title: `อัปเดตจองเสื้อเป็น ${newStatus === 'open' ? 'เปิดรับ' : 'ปิดรับ'}` }); } catch(err) { Swal.fire('Error', err.message, 'error'); }
            };

            const handleToggleRecruitSystem = async (currentStatus) => {
                Swal.fire({ title: 'กำลังอัปเดต...', allowOutsideClick: false, didOpen: () => { Swal.showLoading() } });
                try { const newStatus = currentStatus === 'open' ? 'closed' : 'open'; await runGAS('toggleRecruitSystemStatus', currentStatus); setAdminData(prev => ({ ...prev, recruitStatus: newStatus })); Swal.close(); Swal.fire({ toast: true, position: 'top-end', showConfirmButton: false, timer: 1500, icon: 'success', title: `อัปเดตระบบรับสมัครแล้ว` }); } catch(err) { Swal.fire('ข้อผิดพลาด', err.message, 'error'); }
            };

            const handleUpdateShirtPrice = async () => {
                const { value: formValues } = await Swal.fire({
                    title: 'ตั้งราคาเสื้อ',
                    html: `<div class="text-left text-sm mb-1 font-medium">S, M, L (฿)</div><input id="swal-n" type="number" class="w-full border p-2 mb-3 rounded" value="${data?.shirtPrice?.normal||250}"><div class="text-left text-sm mb-1 font-medium">XL, 2XL, 3XL (฿)</div><input id="swal-o" type="number" class="w-full border p-2 rounded" value="${data?.shirtPrice?.oversize||380}">`,
                    showCancelButton: true, confirmButtonColor: '#ea580c', preConfirm: () => ({ normal: document.getElementById('swal-n').value, oversize: document.getElementById('swal-o').value })
                });
                if (formValues) { 
                    Swal.fire({ title: 'กำลังบันทึก...', allowOutsideClick: false, didOpen: () => { Swal.showLoading() } }); 
                    try { await runGAS('updateShirtPrice', formValues); setAdminData(prev => ({ ...prev, shirtPrice: { ...(prev?.shirtPrice || {}), normal: formValues.normal, oversize: formValues.oversize } })); Swal.close(); Swal.fire({ toast: true, position: 'top-end', showConfirmButton: false, timer: 1500, icon: 'success', title: `อัปเดตราคาสำเร็จ` }); } catch (err) { Swal.fire('Error', err.message, 'error'); } 
                }
            };

            const handleUpdateReceiptConfig = async () => {
                const { value: formValues } = await Swal.fire({
                    title: 'ตั้งค่าใบเสร็จ',
                    html: `<div class="text-left text-sm mb-1 font-medium">หัวใบเสร็จ</div><textarea id="swal-h" rows="2" class="w-full border p-2 mb-3 rounded text-sm">${data?.shirtPrice?.receiptHeader||''}</textarea><div class="text-left text-sm mb-1 font-medium">หมายเหตุ</div><textarea id="swal-n" rows="2" class="w-full border p-2 rounded text-sm">${data?.shirtPrice?.receiptNote||''}</textarea>`,
                    showCancelButton: true, confirmButtonColor: '#ea580c', preConfirm: () => ({ header: document.getElementById('swal-h').value, note: document.getElementById('swal-n').value })
                });
                if (formValues) { 
                    Swal.fire({ title: 'กำลังบันทึก...', allowOutsideClick: false, didOpen: () => { Swal.showLoading() } }); 
                    try { await runGAS('updateReceiptConfig', formValues); setAdminData(prev => ({ ...prev, shirtPrice: { ...(prev?.shirtPrice || {}), receiptHeader: formValues.header, receiptNote: formValues.note } })); Swal.close(); Swal.fire({ toast: true, position: 'top-end', showConfirmButton: false, timer: 1500, icon: 'success', title: `อัปเดตใบเสร็จสำเร็จ` }); } catch (err) { Swal.fire('Error', err.message, 'error'); } 
                }
            };

            const handleUpdateShirtPopup = async () => {
                const { value: formValues } = await Swal.fire({
                    title: 'ตั้งค่า Popup แจ้งเตือน/ไซส์เสื้อ',
                    html: `<div class="text-left text-sm mb-1 font-medium text-gray-700">ข้อความประกาศ</div><textarea id="swal-popup-text" rows="3" class="w-full border p-3 mb-4 rounded-xl text-sm focus:border-orange-500 outline-none" placeholder="โปรดตรวจสอบรายละเอียดไซส์ก่อนสั่งซื้อ...">${data?.shirtPrice?.popupText || ''}</textarea><div class="text-left text-sm mb-1 font-medium text-gray-700">ลิงก์รูปภาพ (URL)</div><input id="swal-popup-img" type="text" class="w-full border p-3 rounded-xl text-sm focus:border-orange-500 outline-none" placeholder="https://..." value="${data?.shirtPrice?.popupImage || ''}"><p class="text-xs text-gray-400 mt-2 text-left">* หากปล่อยว่างไว้ แบนเนอร์ Popup จะถูกซ่อนอัตโนมัติ</p>`,
                    showCancelButton: true, confirmButtonColor: '#ea580c', cancelButtonText: 'ยกเลิก', confirmButtonText: 'บันทึก',
                    preConfirm: () => ({ text: document.getElementById('swal-popup-text').value, image: document.getElementById('swal-popup-img').value })
                });
                if (formValues) { 
                    Swal.fire({ title: 'กำลังบันทึก...', allowOutsideClick: false, didOpen: () => { Swal.showLoading() } }); 
                    try { await runGAS('updateShirtPopup', formValues); setAdminData(prev => ({ ...prev, shirtPrice: { ...(prev?.shirtPrice || {}), popupText: formValues.text, popupImage: formValues.image } })); Swal.close(); Swal.fire({ toast: true, position: 'top-end', showConfirmButton: false, timer: 1500, icon: 'success', title: `ตั้งค่า Popup สำเร็จ` }); } catch (err) { Swal.fire('Error', err.message, 'error'); } 
                }
            };

            const handleImportCSV = (e) => {
                const file = e.target.files[0]; if(!file) return;
                Papa.parse(file, { header: true, skipEmptyLines: true, complete: async function(results) {
                    if(results.data.length === 0) return Swal.fire('Error', 'Empty CSV', 'error');
                    Swal.fire({ title: `กำลังนำเข้า ${results.data.length} รายการ...`, didOpen: () => { Swal.showLoading() } });
                    try { const res = await runGAS('importCheckins', results.data); if(res.success) { Swal.fire('สำเร็จ', `นำเข้าแล้ว ${res.count} รายการ`, 'success'); reloadData(); } else Swal.fire('Error', res.error, 'error'); } catch(err) { Swal.fire('Error', err.message, 'error'); } e.target.value = '';
                }});
            };

            const exportCSV = (arr, fn, fields) => {
                if(!arr||arr.length===0) return Swal.fire('แจ้งเตือน','ไม่มีข้อมูล','warning');
                const dataToExport = arr.map(r => {
                    const keys = Object.keys(r);
                    return fields.map(f => {
                        const kwMatch = f.toLowerCase();
                        const foundK = keys.find(k => k.toLowerCase().replace(/\s+/g,'').includes(kwMatch));
                        return foundK ? r[foundK] : (r[f] || '');
                    });
                });
                const csv = Papa.unparse({fields, data:dataToExport});
                const link = document.createElement("a"); link.href = URL.createObjectURL(new Blob(['\ufeff'+csv], {type:'text/csv;charset=utf-8;'})); link.download = fn; link.click();
            };

            const renderSpssContent = () => {
                if(!selectedActivityForSpss) return <div id="spss-ex" className="text-center py-10 text-gray-400 font-light border border-gray-100 rounded-xl bg-white">กรุณาเลือกกิจกรรมเพื่อดูรายงาน</div>;
                const selectedActivityName = (data?.activities || []).find(a=>String(a.ActivityID)===String(selectedActivityForSpss))?.Name;
                const evals = (data?.evaluations || []).filter(e => {
                    const keys = Object.keys(e);
                    const actNameKey = keys.find(k => k.toLowerCase().includes('activityname') || k.toLowerCase().includes('ชื่อกิจกรรม'));
                    return actNameKey && String(e[actNameKey]).trim() === String(selectedActivityName).trim();
                });
                if(evals.length === 0) return <div id="spss-ex" className="text-center py-10 text-gray-400 font-light border border-gray-100 rounded-xl bg-white">ไม่พบข้อมูลการประเมิน</div>;

                const actCheckins = (data?.checkins || []).filter(c => {
                    const keys = Object.keys(c);
                    const actIdKey = keys.find(k => k.toLowerCase() === 'activityid' || k.toLowerCase() === 'รหัสกิจกรรม');
                    return actIdKey && String(c[actIdKey]).trim() === String(selectedActivityForSpss).trim();
                });
                
                let mCount = 0; let fCount = 0;
                actCheckins.forEach(c => {
                    const keys = Object.keys(c);
                    const nameKey = keys.find(k => k.toLowerCase() === 'name' || k.toLowerCase() === 'ชื่อ');
                    const n = nameKey ? String(c[nameKey]).trim() : '';
                    if (n.startsWith('นาย')) mCount++;
                    else if (n) fCount++;
                });
                
                const totalDemo = mCount + fCount || 1;
                const mPct = ((mCount / totalDemo) * 100).toFixed(2);
                const fPct = ((fCount / totalDemo) * 100).toFixed(2);
                
                const majorityGender = mCount >= fCount ? 'ชาย' : 'หญิง';
                const majorityCount = mCount >= fCount ? mCount : fCount;
                const majorityPct = mCount >= fCount ? mPct : fPct;
                const minorityGender = mCount >= fCount ? 'หญิง' : 'ชาย';
                const minorityCount = mCount >= fCount ? fCount : mCount;
                const minorityPct = mCount >= fCount ? fPct : mPct;

                const getMeaning = (m) => m >= 4.5 ? 'มากที่สุด' : m >= 3.5 ? 'มาก' : m >= 2.5 ? 'ปานกลาง' : m >= 1.5 ? 'น้อย' : 'น้อยที่สุด';
                const qStats = []; let overallIdx = 1;
                let allScoresForGrand = [];
                
                surveyData.forEach(cat => {
                    cat.questions.forEach(q => {
                        const hKey = ['Q1_1','Q1_2','Q1_3','Q1_4','Q2_1','Q2_2','Q2_3','Q2_4','Q3_1','Q3_2','Q3_3','Q3_4','Q3_5'][overallIdx - 1];
                        const scores = evals.map(e => {
                            const keys = Object.keys(e);
                            const matchedKey = keys.find(x => x.toLowerCase() === hKey.toLowerCase() || x.toLowerCase() === `q${overallIdx}`);
                            return Number(matchedKey ? e[matchedKey] : 0) || 0;
                        }).filter(s => s > 0);
                        
                        allScoresForGrand.push(...scores);

                        const n = scores.length; let mean = 0, sd = 0;
                        if(n > 0) { 
                            mean = scores.reduce((a,b)=>a+b, 0) / n; 
                            if(n > 1) sd = Math.sqrt(scores.reduce((a,b)=>a+Math.pow(b-mean, 2), 0) / (n - 1)); 
                        }
                        qStats.push({ no: overallIdx, text: q.text.split(' ').slice(1).join(' '), n, mean, sd });
                        overallIdx++;
                    });
                });
                
                let grandMean = 0, grandSd = 0;
                if (allScoresForGrand.length > 0) {
                    grandMean = allScoresForGrand.reduce((a,b)=>a+b, 0) / allScoresForGrand.length;
                    if (allScoresForGrand.length > 1) {
                        grandSd = Math.sqrt(allScoresForGrand.reduce((a,b)=>a+Math.pow(b-grandMean, 2), 0) / (allScoresForGrand.length - 1));
                    }
                }

                const sortedQStats = [...qStats].sort((a,b) => b.mean - a.mean);
                const top1 = sortedQStats[0] || {text: '-', mean: 0};
                const top2 = sortedQStats[1] || {text: '-', mean: 0};
                const top3 = sortedQStats[2] || {text: '-', mean: 0};

                const validComments = evals
                    .map(e => {
                        const keys = Object.keys(e);
                        const k = keys.find(x => ['comment', 'ข้อเสนอแนะ', 'suggestion'].includes(x.toLowerCase()));
                        return k ? String(e[k]).trim() : '';
                    })
                    .filter(text => text !== '' && text !== '-' && text !== '.' && text !== 'ไม่มี' && text !== 'ไม่มีครับ' && text !== 'ไม่มีค่ะ' && text !== 'ไม่มีข้อเสนอแนะ');

                return (
                    <div id="spss-ex" className="overflow-x-auto border border-gray-100 bg-white rounded-xl p-6 transition-colors shadow-sm mt-6">
                        <div style={{ display: 'none' }} className="word-export-title">
                            <h3 style={{ textAlign: 'center', fontSize: '18pt', fontWeight: 'bold' }}>รายงานผลการประเมินความพึงพอใจ</h3>
                            <p style={{ textAlign: 'center', marginBottom: '20pt' }}>กิจกรรม: {selectedActivityName}</p>
                        </div>

                        <div className="mb-10 min-w-[600px]">
                            <h4 className="font-semibold text-charcoal-900 mb-3 text-sm border-l-4 border-orange-500 pl-2">ตารางที่ 1 ข้อมูลทั่วไปของผู้ตอบแบบสอบถาม (Demographic Data)</h4>
                            <table className="w-full text-sm text-left border-collapse mb-4 border border-gray-300">
                                <thead className="bg-orange-50 border-b border-gray-300 text-charcoal-900">
                                    <tr>
                                        <th className="p-3 font-medium text-center border-r border-gray-300 w-1/3">ข้อมูลทั่วไป</th>
                                        <th className="p-3 font-medium text-center border-r border-gray-300 w-1/3">จำนวน (คน)</th>
                                        <th className="p-3 font-medium text-center w-1/3">ร้อยละ (%)</th>
                                    </tr>
                                </thead>
                                <tbody className="text-charcoal-900">
                                    <tr className="border-b border-gray-300">
                                        <td className="p-3 font-semibold bg-gray-50" colSpan="3">เพศ</td>
                                    </tr>
                                    <tr className="border-b border-gray-200 hover:bg-orange-50/50">
                                        <td className="p-3 pl-8 border-r border-gray-300">ชาย</td>
                                        <td className="p-3 text-center border-r border-gray-300">{mCount}</td>
                                        <td className="p-3 text-center">{mPct}</td>
                                    </tr>
                                    <tr className="border-b border-gray-200 hover:bg-orange-50/50">
                                        <td className="p-3 pl-8 border-r border-gray-300">หญิง</td>
                                        <td className="p-3 text-center border-r border-gray-300">{fCount}</td>
                                        <td className="p-3 text-center">{fPct}</td>
                                    </tr>
                                    <tr className="bg-orange-50/50 font-medium">
                                        <td className="p-3 text-right border-r border-gray-300">รวม</td>
                                        <td className="p-3 text-center border-r border-gray-300 text-orange-600">{mCount + fCount}</td>
                                        <td className="p-3 text-center text-orange-600">100.00</td>
                                    </tr>
                                </tbody>
                            </table>
                            <p className="text-gray-700 text-sm leading-relaxed indent-8">
                                <span className="font-semibold text-orange-600">สรุปผล:</span> จากตารางที่ 1 พบว่า ผู้ตอบแบบสอบถามส่วนใหญ่เป็นเพศ{majorityGender} จำนวน {majorityCount} คน คิดเป็นร้อยละ {majorityPct} และเพศ{minorityGender} จำนวน {minorityCount} คน คิดเป็นร้อยละ {minorityPct}
                            </p>
                        </div>

                        <div className="mb-8 min-w-[800px]">
                            <h4 className="font-semibold text-charcoal-900 mb-3 text-sm border-l-4 border-orange-500 pl-2">ตารางที่ 2 ค่าสถิติเชิงพรรณนา (Descriptive Statistics)</h4>
                            <table className="w-full text-sm text-left border-collapse mb-4 border border-gray-300">
                                <thead className="bg-orange-50 border-b border-gray-300 text-charcoal-900">
                                    <tr>
                                        <th className="p-3 text-center font-medium border-r border-gray-300 w-12">ข้อ</th>
                                        <th className="p-3 font-medium border-r border-gray-300">รายการประเมิน</th>
                                        <th className="p-3 text-center font-medium border-r border-gray-300 w-20">x̄</th>
                                        <th className="p-3 text-center font-medium border-r border-gray-300 w-20">S.D.</th>
                                        <th className="p-3 text-center font-medium w-24">ระดับ</th>
                                    </tr>
                                </thead>
                                <tbody className="text-charcoal-900">
                                    {qStats.map(q => (
                                        <tr key={q.no} className="border-b border-gray-200 hover:bg-orange-50/50 transition-colors">
                                            <td className="p-3 text-center border-r border-gray-300">{q.no}</td>
                                            <td className="p-3 border-r border-gray-300">{q.text}</td>
                                            <td className="p-3 text-center text-orange-600 font-medium border-r border-gray-300">{q.mean.toFixed(2)}</td>
                                            <td className="p-3 text-center border-r border-gray-300">{q.sd.toFixed(2)}</td>
                                            <td className="p-3 text-center">{getMeaning(q.mean)}</td>
                                        </tr>
                                    ))}
                                    <tr className="bg-orange-50/80 font-medium border-t border-gray-300">
                                        <td className="p-3 text-right border-r border-gray-300" colSpan="2">รวมเฉลี่ย</td>
                                        <td className="p-3 text-center text-orange-700 border-r border-gray-300 text-lg">{grandMean.toFixed(2)}</td>
                                        <td className="p-3 text-center border-r border-gray-300">{grandSd.toFixed(2)}</td>
                                        <td className="p-3 text-center text-orange-700">{getMeaning(grandMean)}</td>
                                    </tr>
                                </tbody>
                            </table>
                            <p className="text-gray-700 text-sm leading-relaxed indent-8">
                                <span className="font-semibold text-orange-600">สรุปผล:</span> ผลการสำรวจความพึงพอใจในการจัดกิจกรรม พบว่า ผู้ตอบแบบสอบถามส่วนใหญ่มีความพึงพอใจในระดับ{getMeaning(grandMean)} โดยมีค่าเฉลี่ยเท่ากับ <span className="font-semibold text-charcoal-900">{grandMean.toFixed(2)}</span> ซึ่งเมื่อพิจารณาเป็นรายข้อ พบว่า {top1.text} (ค่าเฉลี่ย {top1.mean.toFixed(2)}) รองลงมาคือ {top2.text} (ค่าเฉลี่ย {top2.mean.toFixed(2)}) อันดับที่ 3 คือ {top3.text} (ค่าเฉลี่ย {top3.mean.toFixed(2)})
                            </p>
                        </div>

                        <div className="mt-8 pt-6 border-t border-gray-100">
                            <h4 className="font-semibold text-charcoal-900 mb-4 text-sm border-l-4 border-orange-500 pl-2">สรุปข้อเสนอแนะเพิ่มเติมและแนวทางในการพัฒนา (Qualitative Feedback)</h4>
                            <div className="bg-orange-50/30 p-6 rounded-xl border border-orange-100 text-sm text-gray-800 leading-relaxed shadow-sm">
                                {validComments.length > 0 ? (
                                    <>
                                        <p className="indent-8 mb-4">
                                            จากการเก็บรวบรวมข้อมูลเชิงคุณภาพ (Qualitative Data) ในส่วนของข้อเสนอแนะเพิ่มเติมจากผู้เข้าร่วมกิจกรรม 
                                            พบว่ามีผู้แสดงความคิดเห็นและให้ข้อเสนอแนะเพื่อการพัฒนาปรับปรุงจำนวนทั้งสิ้น <span className="font-semibold text-orange-600">{validComments.length}</span> รายการ 
                                            โดยสามารถรวบรวมและสรุปประเด็นข้อคิดเห็นได้ดังนี้:
                                        </p>
                                        <ul className="list-decimal pl-10 space-y-3 mb-6 font-medium text-charcoal-900">
                                            {validComments.map((comment, idx) => (
                                                <li key={idx} className="leading-relaxed pl-2 bg-white px-4 py-2 rounded-lg border border-gray-100 shadow-sm">{comment}</li>
                                            ))}
                                        </ul>
                                        <p className="indent-8">
                                            <span className="font-semibold text-orange-600">แนวทางการนำไปใช้ประโยชน์:</span> ข้อเสนอแนะดังกล่าวสะท้อนให้เห็นถึงความต้องการและมุมมองของผู้เข้าร่วมกิจกรรม 
                                            ซึ่งเป็นข้อมูลที่เป็นประโยชน์อย่างยิ่งต่อคณะผู้จัดทำโครงการ ในการนำไปใช้วิเคราะห์และเป็นแนวทางสำหรับการวางแผน ปรับปรุง 
                                            และพัฒนารูปแบบการจัดกิจกรรมในครั้งต่อไปให้มีประสิทธิภาพ และตอบสนองต่อความมุ่งหวังของผู้เข้าร่วมโครงการได้อย่างดียิ่งขึ้น
                                        </p>
                                    </>
                                ) : (
                                    <p className="indent-8 text-gray-500">
                                        จากการเก็บรวบรวมข้อมูลเชิงคุณภาพในส่วนของข้อเสนอแนะเพิ่มเติม พบว่า <span className="font-semibold">ไม่มีผู้เข้าร่วมกิจกรรมท่านใดให้ข้อเสนอแนะเพิ่มเติม</span> 
                                        แต่อย่างไรก็ตาม คณะผู้จัดทำโครงการจะนำผลการประเมินเชิงปริมาณจากตารางข้างต้น ไปวิเคราะห์และใช้เป็นแนวทางในการวางแผนและพัฒนาการจัดกิจกรรมในลำดับต่อไป
                                    </p>
                                )}
                            </div>
                        </div>

                    </div>
                );
            };

            const indexOfLastItem = currentPage * itemsPerPage;
            const indexOfFirstItem = indexOfLastItem - itemsPerPage;
            const currentCheckins = sortedCheckins.slice(indexOfFirstItem, indexOfLastItem);
            const totalPages = Math.ceil(sortedCheckins.length / itemsPerPage) || 1;

            const currentShirtOrders = sortedShirtOrders.slice((shirtOrderPage - 1) * shirtItemsPerPage, shirtOrderPage * shirtItemsPerPage);
            const totalShirtPages = Math.ceil(sortedShirtOrders.length / shirtItemsPerPage) || 1;

            const currentRegistrations = sortedRegistrationsList.slice((regisPage - 1) * regisItemsPerPage, regisPage * regisItemsPerPage);
            const totalRegisPages = Math.ceil(sortedRegistrationsList.length / regisItemsPerPage) || 1;

            const menuGroups = [
                { 
                    label: 'Dashboard', 
                    items: [{ id: 'overview', icon: 'fa-chart-pie', text: 'ภาพรวมระบบ' }] 
                },
                { 
                    label: 'Activity System', 
                    items: [
                        { id: 'activities', icon: 'fa-list', text: 'จัดการกิจกรรม' },
                        { id: 'summary', icon: 'fa-users', text: 'ยอดเช็คชื่อ' },
                        { id: 'spss', icon: 'fa-file-lines', text: 'รายงานผลประเมิน' }
                    ] 
                },
                { 
                    label: 'Recruitment', 
                    items: [
                        { id: 'manage_recruit', icon: 'fa-bullhorn', text: 'จัดการรับสมัคร' },
                        { id: 'registrations', icon: 'fa-user-plus', text: 'ข้อมูลผู้สมัคร' }
                    ] 
                },
                { 
                    label: 'Welfare / Orders', 
                    items: [{ id: 'shirt_summary', icon: 'fa-shirt', text: 'สรุปการสั่งจองเสื้อ' }] 
                }
            ];

            return (
                <div className="min-h-screen bg-[#fffcf9] dark:bg-[#121212] flex flex-col md:flex-row transition-colors">
                    <aside className="w-full md:w-64 bg-charcoal-900 text-white flex-shrink-0 flex flex-col z-20 shadow-xl border-r border-charcoal-800">
                        <div className="p-6 border-b border-gray-800 flex justify-between items-center md:block">
                            <h2 className="text-xl font-semibold tracking-widest uppercase text-orange-500">Workspace</h2>
                            <button onClick={goHome} className="md:hidden text-xs bg-gray-800 text-gray-300 px-3 py-1.5 rounded font-bold">ออก</button>
                        </div>
                        <nav className="flex-1 px-4 py-4 md:py-6 overflow-x-auto md:overflow-y-auto custom-scrollbar flex md:flex-col gap-2 md:gap-6">
                            {menuGroups.map((group, gIdx) => (
                                <div key={gIdx} className="flex md:flex-col gap-2">
                                    <p className="hidden md:block text-[10px] text-gray-500 font-semibold px-3 uppercase tracking-widest mb-1">{group.label}</p>
                                    <div className="flex md:flex-col gap-2 md:gap-1.5">
                                        {group.items.map(m => (
                                            <button key={m.id} onClick={() => setActiveTab(m.id)} className={`flex-shrink-0 w-auto md:w-full flex items-center justify-center md:justify-start gap-3 px-4 py-3 md:px-5 md:py-3.5 rounded-xl transition-all text-xs font-medium tracking-wide ${activeTab === m.id ? 'bg-gradient-to-r from-orange-500 to-orange-600 text-white shadow-md md:translate-x-1' : 'text-gray-400 hover:text-white hover:bg-white/5 border border-gray-800 md:border-transparent'}`}><i className={`fa-solid ${m.icon} w-5 opacity-80 text-center text-sm`}></i> <span className="hidden md:inline">{m.text}</span><span className="md:hidden inline">{activeTab === m.id ? m.text : ''}</span></button>
                                        ))}
                                    </div>
                                </div>
                            ))}
                        </nav>
                        <div className="p-6 bg-charcoal-900 border-t border-gray-800 hidden md:block">
                            <p className="text-[9px] text-gray-500 font-medium mb-3 px-4 uppercase tracking-widest">สถานะแพลตฟอร์ม</p>

                                        <div className="flex items-center gap-4 mb-6 pb-4 border-b border-gray-100">
                                            <div className="w-12 h-12 bg-orange-50 rounded-xl flex items-center justify-center text-orange-500 border border-orange-100"><i className="fa-solid fa-chart-pie text-xl"></i></div>
                                            <div><h3 className="text-lg font-bold text-charcoal-900 tracking-tight">สรุปยอดตามสาขา</h3><p className="text-[10px] text-gray-500 font-medium uppercase tracking-widest mt-0.5">Statistics by Major</p></div>
                                        </div>
                                        <div className="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 gap-4">
                                            {shirtOrdersByMajor.map(([major, stats], idx) => (
                                                <div key={idx} className="group relative p-5 bg-gray-50 rounded-xl border border-gray-100 hover:border-orange-300 hover:bg-white hover:shadow-md transition-all duration-300">
                                                    <div className="flex justify-between items-start mb-3">
                                                        <div className="w-8 h-8 bg-white text-gray-400 group-hover:bg-gradient-to-br group-hover:from-orange-400 group-hover:to-orange-600 group-hover:text-white rounded-lg flex items-center justify-center transition-all shadow-sm border border-gray-100 group-hover:border-transparent text-sm"><i className="fa-solid fa-graduation-cap"></i></div>
                                                        <span className="bg-gray-200 text-gray-600 group-hover:bg-orange-100 group-hover:text-orange-700 px-2 py-0.5 rounded font-black text-[10px] transition-colors">{stats.count} บิล</span>
                                                    </div>
                                                    <h4 className="font-bold text-charcoal-900 text-sm mb-2 line-clamp-1 group-hover:text-orange-600 transition-colors" title={major}>{major}</h4>
                                                    <div className="flex items-baseline gap-1 mt-auto pt-2 border-t border-gray-200/50">
                                                        <span className="text-[10px] font-bold text-gray-400">฿</span><span className="text-lg font-black text-charcoal-900 group-hover:text-orange-600 transition-colors tracking-tight">{stats.total.toLocaleString()}</span>
                                                    </div>
                                                </div>
                                            ))}
                                            {(data.shirtOrders||[]).length === 0 && (
                                                <div className="col-span-full flex flex-col items-center justify-center py-10 bg-gray-50/50 rounded-xl border-2 border-dashed border-gray-200">
                                                    <div className="w-12 h-12 bg-white rounded-full flex items-center justify-center shadow-sm border border-gray-100 mb-3"><i className="fa-solid fa-box-open text-xl text-gray-300"></i></div>
                                                    <p className="text-sm text-gray-500 font-medium">ยังไม่มีข้อมูลการสั่งจองเสื้อ</p>
                                                </div>
                                            )}
                                        </div>
                                    </div>
                                </div>
                                <div className="bg-white/90 backdrop-blur border border-orange-100/50 rounded-[1.5rem] overflow-hidden shadow-sm">
                                    <div className="overflow-x-auto">
                                        <table className="w-full text-left whitespace-nowrap modern-table">
                                            <thead className="bg-orange-50/50 border-b border-orange-100">
                                                <tr><th className="font-semibold text-gray-500 tracking-wider">วัน/เวลา</th><th className="font-semibold text-gray-500 tracking-wider">ข้อมูลผู้สั่งจอง</th><th className="text-center font-semibold text-gray-500 tracking-wider">คอปกโปโล</th><th className="text-center font-semibold text-gray-500 tracking-wider">เสื้อยืด</th><th className="text-right font-semibold text-gray-500 tracking-wider">ยอดรวม</th><th className="text-center font-semibold text-gray-500 tracking-wider">สลิป</th><th className="text-center font-semibold text-gray-500 tracking-wider">สถานะออเดอร์</th></tr>
                                            </thead>
                                            <tbody className="text-sm text-charcoal-900 divide-y divide-gray-50">
                                            {currentShirtOrders.map((o,i)=>(
                                                <tr key={i} className="hover:bg-orange-50/30 transition-colors group">
                                                    <td className="px-6 py-4">
                                                        <span className="block font-medium text-charcoal-900 text-xs">{new Date(o.Timestamp).toLocaleDateString('th-TH')}</span>
                                                        <span className="block text-[10px] text-gray-400 font-medium tracking-widest mt-0.5"><i className="fa-regular fa-clock"></i> {new Date(o.Timestamp).toLocaleTimeString('th-TH', {hour:'2-digit',minute:'2-digit'})}</span>
                                                    </td>
                                                    <td className="px-6 py-4">
                                                        <div className="flex flex-col gap-1">
                                                            <span className="inline-block bg-gray-100 text-gray-600 text-[9px] font-bold tracking-widest px-2 py-0.5 rounded border border-gray-200 w-fit">{o.StudentID}</span>
                                                            <span className="font-semibold text-charcoal-900">{o.Name}</span>
                                                        </div>
                                                    </td>
                                                    <td className="px-6 py-4 text-center">
                                                        <div className="inline-flex items-center justify-center gap-1.5 bg-gray-50 px-2.5 py-1.5 rounded-md border border-gray-100 text-xs">
                                                            <span className="text-gray-500">{o.PoloGender}</span><span className="text-gray-300">|</span><span className="text-gray-700 font-bold">{o.PoloSize}</span><span className="font-black text-charcoal-900 ml-1 text-[10px] bg-white px-1.5 py-0.5 rounded shadow-sm border border-gray-200">x{o.PoloQty}</span>
                                                        </div>
                                                    </td>
                                                    <td className="px-6 py-4 text-center">
                                                        <div className="inline-flex items-center justify-center gap-1.5 bg-gray-50 px-2.5 py-1.5 rounded-md border border-gray-100 text-xs">
                                                            <span className="text-gray-500">{o.TshirtGender}</span><span className="text-gray-300">|</span><span className="text-gray-700 font-bold">{o.TshirtSize}</span><span className="font-black text-charcoal-900 ml-1 text-[10px] bg-white px-1.5 py-0.5 rounded shadow-sm border border-gray-200">x{o.TshirtQty}</span>
                                                        </div>
                                                    </td>
                                                    <td className="px-6 py-4 text-right font-black text-rose-600 text-base">฿{Number(o.TotalPrice||0).toLocaleString()}</td>
                                                    <td className="px-6 py-4 text-center">
                                                        {(() => {
                                                            const rawSlip = o.SlipImage || o.SlipURL || o.Slip || ''; const slipStr = String(rawSlip).trim(); const hasValidSlip = slipStr && slipStr !== 'null' && slipStr !== 'undefined' && slipStr !== '-';
                                                            if (o.PaymentMethod === 'cash') { return <span className="text-[9px] font-bold text-amber-600 bg-amber-50 border border-amber-200 px-2.5 py-1.5 rounded-md shadow-sm whitespace-nowrap"><i className="fa-solid fa-coins mr-1"></i> เงินสด</span>; } else if (hasValidSlip) { return (<button onClick={() => { if (slipStr.startsWith('data:image')) { Swal.fire({imageUrl: slipStr, imageAlt: 'Slip'}); } else if (slipStr.startsWith('http')) { window.open(slipStr, '_blank'); } else if (/^[a-zA-Z0-9_-]{15,}$/.test(slipStr)) { window.open(`https://drive.google.com/file/d/${slipStr}/view`, '_blank'); } else { Swal.fire('ข้อผิดพลาด', 'ข้อมูลรูปภาพไม่ถูกต้อง', 'error'); } }} className="text-emerald-500 hover:text-white bg-emerald-50 hover:bg-emerald-500 w-9 h-9 rounded-lg flex items-center justify-center mx-auto transition-all shadow-sm border border-emerald-200" title="ดูสลิปโอนเงิน"><i className="fa-solid fa-image"></i></button>); } else { return <span className="text-xs text-gray-300 font-medium">-</span>; }
                                                        })()}
                                                    </td>
                                                    <td className="px-6 py-4 text-center">
                                                        <button onClick={async () => { Swal.fire({ title: 'กำลังอัปเดต...', allowOutsideClick: false, didOpen: () => Swal.showLoading() }); try { const newStatus = o.Status === 'received' ? 'paid' : 'received'; await runGAS('updateShirtOrderStatus', o.StudentID, newStatus); setAdminData(prev => ({ ...prev, shirtOrders: prev.shirtOrders.map(so => so.StudentID === o.StudentID ? { ...so, Status: newStatus } : so) })); Swal.close(); Swal.fire({ toast: true, position: 'top-end', showConfirmButton: false, timer: 1500, icon: 'success', title: `อัปเดตสถานะสำเร็จ` }); } catch(err) { Swal.fire('ข้อผิดพลาด', err.message, 'error'); } }} className={`px-4 py-2 rounded-lg text-[10px] font-bold uppercase tracking-widest border transition-all shadow-sm w-full max-w-[100px] mx-auto block ${o.Status === 'received' ? 'text-rose-600 border-rose-200 bg-rose-50 hover:bg-rose-500 hover:text-white hover:border-rose-500' : 'text-emerald-700 border-emerald-200 bg-emerald-50 hover:bg-emerald-500 hover:text-white hover:border-emerald-500'}`}>
                                                            <i className={`fa-solid ${o.Status === 'received' ? 'fa-spinner' : 'fa-check'} mr-1`}></i> {o.Status === 'received' ? 'รอยืนยัน' : 'ชำระแล้ว'}
                                                        </button>
                                                    </td>
                                                </tr>
                                            ))}
                                            {(data.shirtOrders||[]).length===0 && <tr><td colSpan="7" className="text-center py-16 text-gray-400 font-medium text-sm bg-gray-50/50"><i className="fa-solid fa-inbox block text-3xl mb-3 text-gray-300"></i> ยังไม่มีออเดอร์</td></tr>}
                                            </tbody>
                                        </table>
                                    </div>
                                    {totalShirtPages > 1 && (
                                        <div className="flex justify-between items-center px-6 py-4 border-t border-gray-100 bg-gray-50/50">
                                            <button disabled={shirtOrderPage===1} onClick={()=>setShirtOrderPage(p=>Math.max(1,p-1))} className="text-[10px] uppercase tracking-widest font-bold text-gray-500 hover:text-orange-600 px-3 py-1.5 transition-colors disabled:opacity-30">ก่อนหน้า</button>
                                            <span className="text-gray-500 font-medium text-[10px] uppercase tracking-widest bg-white px-3 py-1.5 rounded-lg border border-gray-200 shadow-sm">หน้า {shirtOrderPage} จาก {totalShirtPages}</span>
                                            <button disabled={shirtOrderPage===totalShirtPages} onClick={()=>setShirtOrderPage(p=>Math.min(totalShirtPages,p+1))} className="text-[10px] uppercase tracking-widest font-bold text-gray-500 hover:text-orange-600 px-3 py-1.5 transition-colors disabled:opacity-30">ถัดไป</button>
                                        </div>
                                    )}
                                </div>
                            </div>
                        )}
                        <div className="mt-12 border-t border-gray-200 pt-6 text-center">
                            <p className="text-[10px] font-bold text-gray-400 uppercase tracking-widest mb-1">DIGITAL TECHNOLOGY STUDENT AFFAIRS • V4.0</p>
                            <p className="text-[9px] text-gray-500 font-light">Faculty of Digital Technology, Chiang Rai Rajabhat University</p>
                        </div>
                    </main>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
