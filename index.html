<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DIGIT.69</title>
    
    <!-- Tailwind CSS with Dark Mode Support -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: { 
                        brand: '#ff6600',
                        brandDark: '#cc5200',
                        brandLight: '#ff8533',
                        lightBg: '#f8fafc',
                        darkBg: '#09090b',
                        panelLight: '#ffffff',
                        panelDark: 'rgba(24, 24, 27, 0.85)'
                    },
                    boxShadow: {
                        'glow-brand': '0 0 25px rgba(255, 102, 0, 0.3)',
                        'glow-red': '0 0 25px rgba(239, 68, 68, 0.3)',
                        'glass': '0 8px 32px 0 rgba(31, 38, 135, 0.07)',
                        'soft': '0 10px 40px -10px rgba(0, 0, 0, 0.08)',
                    },
                    animation: { 
                        'fade-in': 'fadeIn 0.4s cubic-bezier(0.22, 1, 0.36, 1)',
                        'slide-up': 'slideUp 0.5s cubic-bezier(0.22, 1, 0.36, 1)',
                        'float': 'float 6s ease-in-out infinite',
                    },
                    keyframes: { 
                        fadeIn: { '0%': { opacity: '0', transform: 'scale(0.98)' }, '100%': { opacity: '1', transform: 'scale(1)' } },
                        slideUp: { '0%': { opacity: '0', transform: 'translateY(20px)' }, '100%': { opacity: '1', transform: 'translateY(0)' } },
                        float: { '0%, 100%': { transform: 'translateY(0)' }, '50%': { transform: 'translateY(-10px)' } }
                    }
                }
            }
        }

    <!-- Fonts & Libraries -->
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-is@18/umd/react-is.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prop-types/15.8.1/prop-types.min.js"></script>
    <script src="https://unpkg.com/recharts@2.1.12/umd/Recharts.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <!-- SweetAlert2 -->
    <link href="https://cdn.jsdelivr.net/npm/@sweetalert2/theme-dark@4/dark.css" rel="stylesheet" id="swal-theme">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <style>
        body { 
            font-family: 'Prompt', sans-serif; 
            margin: 0; 
            padding: 0; 
            overflow-x: hidden; 
            -webkit-font-smoothing: antialiased; 
            background-color: #f8fafc;
            background-image: 
                radial-gradient(at 0% 0%, hsla(28, 100%, 74%, 0.15) 0px, transparent 50%),
                radial-gradient(at 100% 0%, hsla(250, 100%, 74%, 0.1) 0px, transparent 50%),
                radial-gradient(at 100% 100%, hsla(28, 100%, 74%, 0.15) 0px, transparent 50%);
            background-attachment: fixed;
        }
        .dark body {
            background-color: #09090b;
            background-image: 
                radial-gradient(at 0% 0%, hsla(28, 100%, 50%, 0.08) 0px, transparent 50%),
                radial-gradient(at 100% 0%, hsla(250, 100%, 50%, 0.05) 0px, transparent 50%),
                radial-gradient(at 100% 100%, hsla(28, 100%, 50%, 0.08) 0px, transparent 50%);
        }
        
        .glass-panel { 
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(20px); 
            -webkit-backdrop-filter: blur(20px); 
            border: 1px solid rgba(255, 255, 255, 0.6);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.03);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); 
        }
        .dark .glass-panel { 
            background: rgba(24, 24, 27, 0.65);
            border: 1px solid rgba(255, 255, 255, 0.08); 
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.3); 
        }

        .input-modern { 
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); 
            outline: none; 
            background: rgba(255, 255, 255, 0.8);
            border: 1px solid #e2e8f0;
            color: #0f172a;
        }
        .input-modern:focus { 
            border-color: #ff6600; 
            box-shadow: 0 0 0 4px rgba(255, 102, 0, 0.1); 
            background: #ffffff;
        }
        .dark .input-modern { 
            background: rgba(0, 0, 0, 0.3); 
            border: 1px solid rgba(255, 255, 255, 0.1); 
            color: #f8fafc; 
        }
        .dark .input-modern:focus { 
            border-color: #ff6600; 
            box-shadow: 0 0 0 4px rgba(255, 102, 0, 0.15); 
            background: rgba(0, 0, 0, 0.5); 
        }

        .brand-gradient { background: linear-gradient(135deg, #ff8533 0%, #ff6600 50%, #e65c00 100%); }
        .brand-text-gradient { background-clip: text; -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-image: linear-gradient(135deg, #ff8533, #ff6600); }
        
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        .light-mode ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        .dark ::-webkit-scrollbar-thumb { background: #3f3f46; border-radius: 10px; }

        .btn-interactive { transition: transform 0.15s ease, box-shadow 0.3s ease, background 0.3s ease, border-color 0.3s ease, opacity 0.2s ease; }
        .btn-interactive:active:not(:disabled) { transform: scale(0.97); }
        .btn-interactive:disabled { opacity: 0.7; cursor: not-allowed; }

        @media print {
            body { background: white !important; color: black !important; }
            .no-print { display: none !important; }
            .print-area { display: block !important; width: 100% !important; margin: 0 !important; padding: 0 !important; }
            .glass-panel { border: none !important; box-shadow: none !important; background: white !important; }
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo, useRef } = React;
        const Recharts = window.Recharts || {};
        const { BarChart, Bar, LineChart, Line, XAxis, YAxis, Tooltip, ResponsiveContainer, PieChart, Pie, Cell, Legend } = Recharts;

        // ==========================================
        // ⚙️ตั้งค่า API
        // ==========================================
        const API_URL = "https://script.google.com/macros/s/AKfycbwviBRd_BbtvGyEpZSq5ab5A0iEpXkG9iMwAUQyGyZb-nDI2R5-x8GE5ZEI3gpmzA3zug/exec";
        const SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/1MoZpnDniVF5pKr0tEgmYwlPO3wZdA7DaO_MvZjbC-ec/gviz/tq?tqx=out:csv&sheet=Registration";
        
        const MAJOR_LIST = [
            "เทคโนโลยีดิจิทัลเพื่อธุรกิจ", "เทคโนโลยีดิจิทัลเพื่อธุรกิจ(เทียบโอน)",
            "เทคโนโลยีปัญญาประดิษฐ์", "เทคโนโลยีสารสนเทศ", "เทคโนโลยีสารสนเทศ(เทียบโอน)",
            "วิทยาการคอมพิวเตอร์", "กราฟิกดีไซน์เทคโนโลยีสื่อดิจิทัล",
            "กราฟิกดีไซน์สื่อศิลปะและการออกแบบ", "กราฟิกดีไซน์สื่อศิลปะและการออกแบบ(เทียบโอน)",
            "วิศวกรรมคอมพิวเตอร์"
        ];

        const cleanMajor = (str) => str ? str.replace(/\s*\([a-zA-Z\s]+\)/g, '').trim() : '';

        const submitToAPI = async (action, payload) => {
            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify({ action, payload })
                });
                return await response.json();
            } catch (err) {
                throw new Error("การเชื่อมต่อระบบเซิร์ฟเวอร์ล้มเหลว กรุณาลองใหม่อีกครั้ง");
            }
        };

        // UI Components
        function Icon({ name, size = 20, className = '' }) {
            const containerRef = useRef(null);
            useEffect(() => {
                if (containerRef.current) {
                    containerRef.current.innerHTML = `<i data-lucide="${name}" class="${className}" style="width:${size}px; height:${size}px;"></i>`;
                    if (window.lucide) {
                        lucide.createIcons({ root: containerRef.current });
                    }
                }
            }, [name, size, className]);
            return <span ref={containerRef} className="inline-flex items-center justify-center shrink-0" />;
        }

        function TogglePill({ options, value, onChange, isWarningType }) {
            return (
                <div className="flex flex-wrap gap-3">
                    {options.map(opt => {
                        const isActive = value === opt.value;
                        const isAlert = isWarningType && opt.value !== 'ไม่มี' && opt.value !== 'ไม่แพ้';
                        return (
                            <button key={opt.value} type="button" onClick={() => onChange(opt.value)}
                                className={`flex-1 min-w-[100px] py-3.5 px-4 rounded-xl font-bold transition-all duration-300 border flex items-center justify-center gap-2 text-sm btn-interactive shadow-sm
                                    ${isActive 
                                        ? isAlert ? 'border-red-500 bg-red-500 text-white shadow-glow-red' : 'border-brand bg-brand text-white shadow-glow-brand'
                                        : 'border-slate-200 dark:border-white/10 bg-white/50 dark:bg-black/20 text-slate-500 hover:bg-white dark:hover:bg-white/10 hover:border-slate-300 dark:hover:border-white/20 hover:text-slate-700 dark:hover:text-slate-200'}`}
                            >
                                {isActive && <Icon name={isAlert ? "alert-triangle" : "check-circle"} size={16} />}
                                {opt.label}
                            </button>
                        )
                    })}
                </div>
            );
        }

        function SectionHeader({ icon, title, colorClass }) {
            return (
                <div className="flex items-center gap-3 mb-6 pb-4 border-b border-slate-200/50 dark:border-white/5">
                    <div className={`p-3 rounded-2xl shadow-sm ${colorClass}`}><Icon name={icon} size={22}/></div>
                    <h3 className="text-xl md:text-2xl font-black text-slate-800 dark:text-white tracking-tight">{title}</h3>
                </div>
            );
        }

        // ย้าย InputField ออกมาไว้ด้านนอก เพื่อป้องกันปัญหาเคอร์เซอร์หลุดเวลาพิมพ์
        function InputField({ label, type="text", value, onChange, placeholder, maxLength, required, numeric }) {
            return (
                <div className="flex flex-col gap-1.5 w-full">
                    <label className="text-xs font-bold text-slate-600 dark:text-slate-400 uppercase tracking-widest">{label} {required && <span className="text-red-500">*</span>}</label>
                    <input 
                        type={type} value={value} onChange={e => {
                            let val = e.target.value;
                            if (numeric) val = val.replace(/\D/g, '');
                            onChange(val);
                        }} 
                        placeholder={placeholder} maxLength={maxLength} required={required}
                        className={`w-full input-modern rounded-xl px-4 py-3.5 text-sm font-semibold shadow-sm ${numeric ? 'font-mono' : ''}`}
                    />
                </div>
            );
        }

        // ==========================================
        // 🛡️ PDPA Modal Component
        // ==========================================
        function PdpaModal({ onAccept, onAdminClick, isDarkMode }) {
            const [isChecked, setIsChecked] = useState(false);

            const handleDecline = () => Swal.fire({ 
                icon: 'warning', 
                title: 'จำเป็นต้องให้ความยินยอม', 
                text: 'ระบบจำเป็นต้องเก็บข้อมูลเพื่อความปลอดภัยและสิทธิประโยชน์ของท่าน หากปฏิเสธจะไม่สามารถดำเนินการลงทะเบียนต่อได้', 
                confirmButtonText: 'รับทราบ', 
                confirmButtonColor: '#ff6600', 
                background: isDarkMode ? '#18181b' : '#fff', 
                color: isDarkMode ? '#f8fafc' : '#0f172a', 
                customClass: { popup: 'rounded-[2rem]' } 
            });

            const promptAdmin = () => {
                Swal.fire({
                    title: '<h3 class="text-2xl font-black text-slate-800 dark:text-white">Admin Access</h3>',
                    html: '<p class="text-sm text-slate-500 mb-4">เข้าสู่ระบบจัดการข้อมูลผู้ดูแล</p>',
                    input: 'password',
                    inputAttributes: { autocapitalize: 'off', autocorrect: 'off' },
                    showCancelButton: true,
                    confirmButtonText: 'เข้าสู่ระบบ',
                    cancelButtonText: 'ยกเลิก',
                    confirmButtonColor: '#ff6600',
                    background: isDarkMode ? '#18181b' : '#ffffff',
                    color: isDarkMode ? '#ffffff' : '#0f172a',
                    customClass: {
                        popup: 'rounded-[2rem]',
                        input: 'text-center font-mono text-xl tracking-[0.5em] rounded-xl bg-slate-50 dark:bg-black/20 border-slate-200 dark:border-white/10'
                    }
                }).then((result) => {
                    if (result.isConfirmed) {
                        if (result.value === '000000') {
                            onAdminClick();
                        } else {
                            Swal.fire({
                                icon: 'error',
                                title: 'รหัสผ่านไม่ถูกต้อง',
                                text: 'กรุณาลองใหม่อีกครั้ง',
                                confirmButtonColor: '#ff6600',
                                background: isDarkMode ? '#18181b' : '#ffffff',
                                color: isDarkMode ? '#ffffff' : '#0f172a',
                                customClass: { popup: 'rounded-[2rem]' }
                            });
                        }
                    }
                });
            };

            return (
                <div className="fixed inset-0 z-[100] flex items-end sm:items-center justify-center sm:p-6 bg-slate-900/80 dark:bg-black/90 backdrop-blur-sm animate-fade-in">
                    
                    {/* Modal Box - Bottom Sheet on Mobile, Centered Modal on Desktop */}
                    <div className="bg-white dark:bg-zinc-900 w-full sm:max-w-3xl relative flex flex-col h-[92vh] sm:h-auto sm:max-h-[90vh] rounded-t-[2rem] sm:rounded-[2.5rem] shadow-[0_-10px_40px_rgba(0,0,0,0.2)] sm:shadow-[0_20px_60px_rgba(0,0,0,0.3)] animate-slide-up overflow-hidden">
                        
                        {/* Decorative Top Line */}
                        <div className="absolute top-0 left-0 right-0 h-1.5 sm:h-2 brand-gradient z-20"></div>

                        {/* Mobile Pull Indicator (Visual Only) */}
                        <div className="absolute top-3 left-1/2 -translate-x-1/2 w-12 h-1.5 bg-slate-300 dark:bg-slate-600 rounded-full sm:hidden z-20"></div>

                        {/* Admin Login Button */}
                        <button onClick={promptAdmin} className="absolute top-4 sm:top-5 right-4 sm:right-5 p-2.5 sm:p-3 text-slate-400 hover:text-brand bg-slate-50/50 dark:bg-black/20 hover:bg-slate-100 dark:hover:bg-white/10 backdrop-blur-md transition-all z-20 rounded-full shadow-sm hover:shadow-md border border-slate-200/50 dark:border-white/5" title="เข้าสู่ระบบผู้ดูแล">
                            <Icon name="lock" size={16} className="sm:w-[18px] sm:h-[18px]" />
                        </button>
                        
                        {/* Header Section */}
                        <div className="p-5 sm:p-8 pt-8 sm:pt-8 pb-4 sm:pb-5 bg-white dark:bg-zinc-900 border-b border-slate-100 dark:border-white/5 flex items-start gap-4 relative overflow-hidden shrink-0">
                            <div className="absolute -right-8 -top-8 opacity-[0.03] text-brand transform rotate-12 pointer-events-none"><Icon name="shield-check" size={120}/></div>
                            
                            <div className="p-3 bg-brand/10 dark:bg-brand/20 rounded-2xl shrink-0 shadow-inner relative z-10 hidden sm:block">
                                <Icon name="shield-check" size={32} className="text-brand" />
                            </div>
                            
                            <div className="relative z-10 w-full pr-8 sm:pr-0">
                                <div className="inline-flex items-center gap-1.5 px-2.5 py-1 bg-slate-100 dark:bg-white/10 text-slate-600 dark:text-slate-300 text-[10px] font-black tracking-widest uppercase rounded-lg mb-1.5 shadow-sm">
                                    <Icon name="shield" size={10} className="text-brand sm:hidden" /> Privacy Policy
                                </div>
                                <h2 className="text-xl sm:text-3xl font-black text-slate-800 dark:text-white leading-tight">นโยบายความยินยอม (PDPA)</h2>
                                <p className="text-brand dark:text-brandLight text-xs sm:text-sm mt-1 font-semibold">เพื่อสิทธิประโยชน์ ความปลอดภัย และการดูแลอย่างใกล้ชิด</p>
                            </div>
                        </div>
                        
                        {/* Content Scrollable Section */}
                        <div className="p-5 sm:p-8 overflow-y-auto custom-scrollbar flex-1 bg-slate-50/50 dark:bg-black/20">
                            <p className="text-slate-600 dark:text-slate-300 text-sm mb-5 leading-relaxed">
                                คณะเทคโนโลยีดิจิทัล ให้ความสำคัญอย่างยิ่งกับการคุ้มครองข้อมูลส่วนบุคคลของท่าน 
                                ตามพระราชบัญญัติคุ้มครองข้อมูลส่วนบุคคล พ.ศ. 2562 เรามีความจำเป็นต้องจัดเก็บและประมวลผลข้อมูลของท่านเพื่อใช้ในกิจกรรม ดังรายละเอียดต่อไปนี้:
                            </p>
                            
                            <div className="grid grid-cols-1 sm:grid-cols-3 gap-3 sm:gap-4 mb-5 sm:mb-6">
                                {/* Card 1 */}
                                <div className="bg-white dark:bg-zinc-800/80 p-4 sm:p-5 rounded-2xl border border-slate-200/60 dark:border-white/5 shadow-sm hover:shadow-md transition-all flex flex-row sm:flex-col items-center sm:items-start gap-4 sm:gap-0 text-left">
                                    <div className="w-10 h-10 sm:mb-3 bg-blue-50 dark:bg-blue-500/10 text-blue-600 rounded-xl flex items-center justify-center shrink-0"><Icon name="user" size={18}/></div>
                                    <div>
                                        <h4 className="font-bold text-slate-800 dark:text-white text-sm sm:mb-1">ข้อมูลส่วนตัวเบื้องต้น</h4>
                                        <p className="text-[11px] sm:text-xs text-slate-500 dark:text-slate-400 leading-snug">ชื่อ, รหัส นศ., สาขา, เบอร์โทร เพื่อใช้ตรวจสอบสิทธิ์และประสานงาน</p>
                                    </div>
                                </div>
                                
                                {/* Card 2 */}
                                <div className="bg-white dark:bg-zinc-800/80 p-4 sm:p-5 rounded-2xl border border-slate-200/60 dark:border-white/5 shadow-sm hover:shadow-md transition-all flex flex-row sm:flex-col items-center sm:items-start gap-4 sm:gap-0 text-left">
                                    <div className="w-10 h-10 sm:mb-3 bg-orange-50 dark:bg-orange-500/10 text-orange-600 rounded-xl flex items-center justify-center shrink-0"><Icon name="pizza" size={18}/></div>
                                    <div>
                                        <h4 className="font-bold text-slate-800 dark:text-white text-sm sm:mb-1">ข้อมูลด้านโภชนาการ</h4>
                                        <p className="text-[11px] sm:text-xs text-slate-500 dark:text-slate-400 leading-snug">ประวัติแพ้อาหาร, อาหารเฉพาะทาง เพื่อจัดเตรียมมื้ออาหารที่ปลอดภัย</p>
                                    </div>
                                </div>

                                {/* Card 3 */}
                                <div className="bg-white dark:bg-zinc-800/80 p-4 sm:p-5 rounded-2xl border border-slate-200/60 dark:border-white/5 shadow-sm hover:shadow-md transition-all flex flex-row sm:flex-col items-center sm:items-start gap-4 sm:gap-0 text-left">
                                    <div className="w-10 h-10 sm:mb-3 bg-red-50 dark:bg-red-500/10 text-red-600 rounded-xl flex items-center justify-center shrink-0"><Icon name="heart-pulse" size={18}/></div>
                                    <div>
                                        <h4 className="font-bold text-slate-800 dark:text-white text-sm sm:mb-1">ข้อมูลสุขภาพ/การแพทย์</h4>
                                        <p className="text-[11px] sm:text-xs text-slate-500 dark:text-slate-400 leading-snug">โรคประจำตัว, ประวัติการแพ้ยา เพื่อวางแผนปฐมพยาบาลในกรณีฉุกเฉิน</p>
                                    </div>
                                </div>
                            </div>

                            <div className="bg-blue-50/80 dark:bg-blue-900/20 border border-blue-100 dark:border-blue-800/30 p-4 rounded-2xl flex items-start gap-3 shadow-sm">
                                <Icon name="shield-alert" className="text-blue-500 mt-0.5 shrink-0" size={16}/>
                                <div className="text-[11px] sm:text-xs text-blue-800 dark:text-blue-300 leading-relaxed">
                                    <span className="font-bold text-blue-900 dark:text-blue-200">การรักษาความปลอดภัย:</span> ข้อมูลทั้งหมดจะถูกเก็บรักษาเป็นความลับอย่างสูงสุด เข้าถึงได้เฉพาะทีมงานที่เกี่ยวข้อง และจะถูกทำลายทิ้งเมื่อเสร็จสิ้นโครงการ
                                </div>
                            </div>
                        </div>
                        
                        {/* Footer Section */}
                        <div className="p-5 sm:p-8 border-t border-slate-100 dark:border-white/5 bg-white dark:bg-zinc-900 shrink-0 pb-6 sm:pb-8">

                                    {isChecked && <Icon name="check" size={14} className="text-white"/>}

                            </label>

                            <div className="flex flex-col sm:flex-row justify-end gap-3">
                                <button onClick={handleDecline} className="w-full sm:w-auto px-6 py-3.5 sm:py-3.5 rounded-xl bg-slate-100 dark:bg-white/5 text-slate-600 dark:text-slate-400 font-bold hover:bg-slate-200 dark:hover:bg-white/10 transition-colors btn-interactive text-sm">ไม่ยินยอม</button>
                                <button 
                                    onClick={() => isChecked ? onAccept() : null} 
                                    disabled={!isChecked}
                                    className={`w-full sm:w-auto px-8 py-3.5 sm:py-3.5 rounded-xl font-bold flex items-center justify-center gap-2 transition-all duration-300 btn-interactive text-sm
                                        ${isChecked ? 'brand-gradient text-white shadow-glow-brand hover:shadow-lg transform hover:-translate-y-0.5' : 'bg-slate-200 dark:bg-white/5 text-slate-400 dark:text-slate-600 border border-slate-300 dark:border-white/10 cursor-not-allowed'}`}
                                >
                                    <Icon name="check-circle" size={16} className="sm:w-[18px] sm:h-[18px]" /> ยินยอมและขึ้นทะเบียน
                                </button>

                    </div>

            );

        // ==========================================
        // 📝 Registration Form Component (ฟอร์มขึ้นทะเบียน)
        // ==========================================
        function RegistrationForm({ onBack, onSuccess, isDarkMode }) {
            const [formData, setFormData] = useState({
                FullName: '', StudentID: '', IDCard: '', Major: '', 
                Religion: '', BloodGroup: '',
                StudentPhone: '', ParentPhone: '',
                FoodAllergy: '', SpecificDiet: 'ไม่มี', 
                Disease: '', DrugAllergy: ''
            });

            const [hasFoodAllergy, setHasFoodAllergy] = useState(false);
            const [hasDisease, setHasDisease] = useState(false);
            const [hasDrugAllergy, setHasDrugAllergy] = useState(false);
            const [isSubmitting, setIsSubmitting] = useState(false);

            const handleSubmit = async (e) => {
                e.preventDefault();

                // Validation
                if (!formData.FullName || !formData.StudentID || !formData.Major || !formData.Religion || !formData.BloodGroup || !formData.StudentPhone || !formData.ParentPhone) {
                    Swal.fire({ icon: 'warning', title: 'ข้อมูลไม่ครบถ้วน', text: 'กรุณากรอกข้อมูลในช่องที่มีเครื่องหมาย * ให้ครบ', background: isDarkMode?'#18181b':'#fff', color: isDarkMode?'#f8fafc':'#0f172a' });
                    return;
                }

                if (formData.StudentID && formData.StudentID.length !== 9) {
                    Swal.fire({ icon: 'warning', title: 'รหัสนักศึกษาไม่ถูกต้อง', text: 'กรุณากรอกรหัสนักศึกษาให้ครบ 9 หลัก', background: isDarkMode?'#18181b':'#fff', color: isDarkMode?'#f8fafc':'#0f172a' });
                    return;
                }

                if (formData.StudentPhone.length !== 10 || formData.ParentPhone.length !== 10) {
                    Swal.fire({ icon: 'warning', title: 'เบอร์โทรศัพท์ไม่ถูกต้อง', text: 'กรุณากรอกเบอร์โทรศัพท์ให้ครบ 10 หลัก', background: isDarkMode?'#18181b':'#fff', color: isDarkMode?'#f8fafc':'#0f172a' });
                    return;
                }

                if (hasFoodAllergy && !formData.FoodAllergy.trim()) {
                    Swal.fire({ icon: 'warning', title: 'โปรดระบุอาหารที่แพ้', background: isDarkMode?'#18181b':'#fff', color: isDarkMode?'#f8fafc':'#0f172a' });
                    return;
                }

                if (hasDisease && !formData.Disease.trim()) {
                    Swal.fire({ icon: 'warning', title: 'โปรดระบุโรคประจำตัว', background: isDarkMode?'#18181b':'#fff', color: isDarkMode?'#f8fafc':'#0f172a' });
                    return;
                }

                if (hasDrugAllergy && !formData.DrugAllergy.trim()) {
                    Swal.fire({ icon: 'warning', title: 'โปรดระบุยาที่แพ้', background: isDarkMode?'#18181b':'#fff', color: isDarkMode?'#f8fafc':'#0f172a' });
                    return;
                }

                const finalData = {
                    ...formData,
                    FoodAllergy: hasFoodAllergy ? formData.FoodAllergy : 'ไม่แพ้',
                    Disease: hasDisease ? formData.Disease : 'ไม่มี',
                    DrugAllergy: hasDrugAllergy ? formData.DrugAllergy : 'ไม่แพ้'
                };

                setIsSubmitting(true);
                Swal.fire({ title: 'กำลังบันทึกข้อมูล...', allowOutsideClick: false, didOpen: () => Swal.showLoading(), background: isDarkMode?'#18181b':'#fff', color: isDarkMode?'#f8fafc':'#0f172a' });

                try {
                    // ใช้ Action 'register' สำหรับการเพิ่มข้อมูลใหม่
                    const res = await submitToAPI('register', finalData);
                    if (res.success) {
                        Swal.close();
                        onSuccess();
                    } else {
                        throw new Error(res.message || "ระบบขัดข้อง กรุณาลองใหม่อีกครั้ง");
                    }
                } catch (err) {
                    Swal.fire({ icon: 'error', title: 'เกิดข้อผิดพลาด', text: err.message, background: isDarkMode?'#18181b':'#fff', color: isDarkMode?'#f8fafc':'#0f172a' });
                } finally {
                    setIsSubmitting(false);
                }
            };

            return (
                <div className="max-w-4xl mx-auto animate-fade-in pb-10">
                    <button onClick={onBack} className="flex items-center gap-2 text-slate-500 hover:text-brand font-bold text-sm mb-6 transition-colors px-2">
                        <Icon name="arrow-left" size={16} /> ย้อนกลับ
                    </button>

                    <form onSubmit={handleSubmit} className="space-y-6 md:space-y-8">
                        {/* ส่วนที่ 1: ข้อมูลส่วนตัว */}

                            <SectionHeader icon="user" title="ข้อมูลส่วนตัวนักศึกษา" colorClass="bg-blue-100 dark:bg-blue-500/20 text-blue-600" />
                            <div className="grid grid-cols-1 md:grid-cols-2 gap-5">
                                <InputField label="ชื่อ-นามสกุล (ระบุคำนำหน้า)" value={formData.FullName} onChange={v => setFormData({...formData, FullName: v})} placeholder="เช่น นายสมชาย ใจดี" required />
                                
                                <div className="flex flex-col gap-1.5">
                                    <label className="text-xs font-bold text-slate-600 dark:text-slate-400 uppercase tracking-widest">สาขาวิชา <span className="text-red-500">*</span></label>
                                    <div className="relative">
                                        <select value={formData.Major} onChange={e => setFormData({...formData, Major: e.target.value})} required className="w-full appearance-none input-modern rounded-xl pl-4 pr-10 py-3.5 text-sm font-semibold shadow-sm cursor-pointer bg-white/80 dark:bg-black/40">
                                            <option value="">-- โปรดเลือกสาขาวิชา --</option>
                                            {MAJOR_LIST.map(m => <option key={m} value={m}>{m}</option>)}
                                        </select>
                                        <div className="absolute right-4 top-1/2 -translate-y-1/2 text-slate-400 pointer-events-none"><Icon name="chevron-down" size={16}/></div>
                                    </div>
                                </div>

                                <InputField label="รหัสนักศึกษา (9 หลัก)" value={formData.StudentID} onChange={v => setFormData({...formData, StudentID: v})} placeholder="เช่น 67xxxxxxx" numeric required maxLength="9" />
                                <InputField label="รหัสประจำตัวประชาชน / Passport" value={formData.IDCard} onChange={v => setFormData({...formData, IDCard: v})} placeholder="ระบุ 13 หลัก หรือ เลขพาสปอร์ต" maxLength="20" />
                                
                                <div className="flex flex-col gap-1.5">
                                    <label className="text-xs font-bold text-slate-600 dark:text-slate-400 uppercase tracking-widest">ศาสนา <span className="text-red-500">*</span></label>
                                    <div className="relative">
                                        <select value={formData.Religion} onChange={e => setFormData({...formData, Religion: e.target.value})} required className="w-full appearance-none input-modern rounded-xl pl-4 pr-10 py-3.5 text-sm font-semibold shadow-sm cursor-pointer bg-white/80 dark:bg-black/40">
                                            <option value="">-- โปรดเลือกศาสนา --</option>
                                            <option value="พุทธ">พุทธ</option>
                                            <option value="อิสลาม">อิสลาม</option>
                                            <option value="คริสต์">คริสต์</option>
                                            <option value="อื่นๆ">อื่นๆ</option>
                                        </select>
                                        <div className="absolute right-4 top-1/2 -translate-y-1/2 text-slate-400 pointer-events-none"><Icon name="chevron-down" size={16}/></div>
                                    </div>
                                </div>

                                <div className="flex flex-col gap-1.5">
                                    <label className="text-xs font-bold text-slate-600 dark:text-slate-400 uppercase tracking-widest">กรุ๊ปเลือด <span className="text-red-500">*</span></label>
                                    <div className="relative">
                                        <select value={formData.BloodGroup} onChange={e => setFormData({...formData, BloodGroup: e.target.value})} required className="w-full appearance-none input-modern rounded-xl pl-4 pr-10 py-3.5 text-sm font-semibold shadow-sm cursor-pointer bg-white/80 dark:bg-black/40">
                                            <option value="">-- โปรดเลือกกรุ๊ปเลือด --</option>
                                            <option value="A">A</option>
                                            <option value="B">B</option>
                                            <option value="O">O</option>
                                            <option value="AB">AB</option>
                                        </select>
                                        <div className="absolute right-4 top-1/2 -translate-y-1/2 text-slate-400 pointer-events-none"><Icon name="chevron-down" size={16}/></div>
                                    </div>
                                </div>
                            </div>
                        </div>

                        {/* ส่วนที่ 2: ข้อมูลติดต่อ */}
                        <div className="glass-panel p-6 md:p-8 rounded-[2.5rem] border border-slate-200/50 dark:border-white/5 shadow-soft">
                            <SectionHeader icon="phone" title="ข้อมูลการติดต่อ" colorClass="bg-emerald-100 dark:bg-emerald-500/20 text-emerald-600" />
                            <div className="grid grid-cols-1 md:grid-cols-2 gap-5">
                                <InputField label="เบอร์โทรศัพท์นักศึกษา" value={formData.StudentPhone} onChange={v => setFormData({...formData, StudentPhone: v})} placeholder="08xxxxxxxx" numeric required maxLength="10" />
                                <InputField label="เบอร์โทรศัพท์ผู้ปกครอง (ฉุกเฉิน)" value={formData.ParentPhone} onChange={v => setFormData({...formData, ParentPhone: v})} placeholder="08xxxxxxxx" numeric required maxLength="10" />
                            </div>
                        </div>

                        {/* ส่วนที่ 3: โภชนาการ */}
                        <div className="glass-panel p-6 md:p-8 rounded-[2.5rem] border-t-[8px] border-t-orange-500 border border-slate-200/50 dark:border-white/5 shadow-soft">
                            <SectionHeader icon="pizza" title="ข้อมูลโภชนาการ" colorClass="bg-orange-100 dark:bg-orange-500/20 text-orange-600" />
                            <div className="space-y-6">
                                <div>
                                    <label className="text-sm font-bold text-slate-700 dark:text-slate-300 mb-3 block">1. อาหารเฉพาะทาง (เลือก 1 ข้อ) <span className="text-red-500">*</span></label>
                                    <TogglePill 
                                        options={[{label: 'ไม่มี (ทานปกติ)', value: 'ไม่มี'}, {label: 'ฮาลาล', value: 'ฮาลาล'}, {label: 'มังสวิรัติ', value: 'มังสวิรัติ'}, {label: 'เจ', value: 'เจ'}]}
                                        value={formData.SpecificDiet}
                                        onChange={v => setFormData({...formData, SpecificDiet: v})}
                                        isWarningType={true}
                                    />
                                </div>
                                
                                <div className="p-5 bg-orange-50 dark:bg-orange-950/20 border border-orange-100 dark:border-orange-900/30 rounded-2xl">
                                    <label className="text-sm font-bold text-slate-700 dark:text-slate-300 mb-3 block">2. ประวัติการแพ้อาหาร <span className="text-red-500">*</span></label>
                                    <div className="flex gap-4 mb-4">
                                        <label className="flex items-center gap-2 cursor-pointer text-sm font-semibold">
                                            <input type="radio" name="foodAllergy" checked={!hasFoodAllergy} onChange={() => setHasFoodAllergy(false)} className="w-4 h-4 text-brand accent-brand" /> ไม่แพ้
                                        </label>
                                        <label className="flex items-center gap-2 cursor-pointer text-sm font-semibold text-orange-600 dark:text-orange-400">
                                            <input type="radio" name="foodAllergy" checked={hasFoodAllergy} onChange={() => setHasFoodAllergy(true)} className="w-4 h-4 text-brand accent-brand" /> มีประวัติแพ้อาหาร
                                        </label>
                                    </div>
                                    {hasFoodAllergy && (
                                        <div className="animate-slide-up">
                                            <InputField label="โปรดระบุอาหารที่แพ้ หรือ อาการ" value={formData.FoodAllergy} onChange={v => setFormData({...formData, FoodAllergy: v})} placeholder="เช่น กุ้ง, ถั่วลิสง, นมวัว" required={hasFoodAllergy} />
                                        </div>
                                    )}
                                </div>
                            </div>
                        </div>

                        {/* ส่วนที่ 4: สุขภาพ */}
                        <div className="glass-panel p-6 md:p-8 rounded-[2.5rem] border-t-[8px] border-t-red-500 border border-slate-200/50 dark:border-white/5 shadow-soft">
                            <SectionHeader icon="heart-pulse" title="ข้อมูลสุขภาพทางการแพทย์" colorClass="bg-red-100 dark:bg-red-500/20 text-red-600" />
                            <div className="space-y-6">
                                <div className="p-5 bg-red-50/50 dark:bg-red-950/20 border border-red-100 dark:border-red-900/30 rounded-2xl">
                                    <label className="text-sm font-bold text-slate-700 dark:text-slate-300 mb-3 block">1. โรคประจำตัว <span className="text-red-500">*</span></label>
                                    <div className="flex gap-4 mb-4">
                                        <label className="flex items-center gap-2 cursor-pointer text-sm font-semibold">
                                            <input type="radio" name="disease" checked={!hasDisease} onChange={() => setHasDisease(false)} className="w-4 h-4 accent-red-500" /> ไม่มี
                                        </label>
                                        <label className="flex items-center gap-2 cursor-pointer text-sm font-semibold text-red-600 dark:text-red-400">
                                            <input type="radio" name="disease" checked={hasDisease} onChange={() => setHasDisease(true)} className="w-4 h-4 accent-red-500" /> มีโรคประจำตัว
                                        </label>
                                    </div>
                                    {hasDisease && (
                                        <div className="animate-slide-up">
                                            <InputField label="โปรดระบุโรคประจำตัว" value={formData.Disease} onChange={v => setFormData({...formData, Disease: v})} placeholder="เช่น หอบหืด, ภูมิแพ้, หัวใจ" required={hasDisease} />
                                        </div>
                                    )}
                                </div>

                                <div className="p-5 bg-pink-50/50 dark:bg-pink-950/20 border border-pink-100 dark:border-pink-900/30 rounded-2xl">
                                    <label className="text-sm font-bold text-slate-700 dark:text-slate-300 mb-3 block">2. ประวัติการแพ้ยา <span className="text-red-500">*</span></label>
                                    <div className="flex gap-4 mb-4">
                                        <label className="flex items-center gap-2 cursor-pointer text-sm font-semibold">
                                            <input type="radio" name="drugAllergy" checked={!hasDrugAllergy} onChange={() => setHasDrugAllergy(false)} className="w-4 h-4 accent-pink-500" /> ไม่เคยแพ้ยา
                                        </label>
                                        <label className="flex items-center gap-2 cursor-pointer text-sm font-semibold text-pink-600 dark:text-pink-400">
                                            <input type="radio" name="drugAllergy" checked={hasDrugAllergy} onChange={() => setHasDrugAllergy(true)} className="w-4 h-4 accent-pink-500" /> มีประวัติแพ้ยา
                                        </label>
                                    </div>
                                    {hasDrugAllergy && (
                                        <div className="animate-slide-up">
                                            <InputField label="โปรดระบุยาที่แพ้ หรือ อาการ" value={formData.DrugAllergy} onChange={v => setFormData({...formData, DrugAllergy: v})} placeholder="เช่น Penicillin, Amoxicillin" required={hasDrugAllergy} />
                                        </div>
                                    )}

                            </div>
                        </div>

                        {/* Submit Button */}
                        <div className="pt-4 flex justify-center">
                            <button 
                                type="submit" 
                                disabled={isSubmitting}

                            >
                                {isSubmitting ? <Icon name="loader-2" className="animate-spin" /> : <Icon name="save" />}

                            </button>
                        </div>
                    </form>
                </div>
            );
        }

        // ==========================================
        // ✅ Success View Component
        // ==========================================
        function SuccessView({ onHome, isDarkMode }) {

                <div className="flex items-center justify-center min-h-[80vh] p-4 animate-fade-in">

        }

        // ==========================================
        // 📊 Admin Dashboard Component
        // ==========================================
        function AdminDashboard({ goBack, isDarkMode }) {
            const [data, setData] = useState([]);
            const [loading, setLoading] = useState(true);
            const [selectedMajor, setSelectedMajor] = useState(null);
            const [selectedSurveillanceStudent, setSelectedSurveillanceStudent] = useState(null);
            const [editItem, setEditItem] = useState(null);
            const [activeTab, setActiveTab] = useState('overview');
            const [drilldownData, setDrilldownData] = useState({ title: '', list: [], type: '' });
            const [currentPage, setCurrentPage] = useState(1);
            const [searchTerm, setSearchTerm] = useState('');
            const [executiveMajor, setExecutiveMajor] = useState('ทั้งหมด');

            const loadData = () => {
                setLoading(true);
                Papa.parse(`${SHEET_CSV_URL}&_cb=${new Date().getTime()}`, {
                    download: true, header: true,
                    complete: (res) => {
                        setData(res.data.filter(row => row.StudentID).map(r => ({ ...r, Major: cleanMajor(r.Major) })));
                        setLoading(false);
                    },
                    error: () => { Swal.fire('ข้อผิดพลาด', 'เชื่อมต่อฐานข้อมูลล้มเหลว', 'warning'); setLoading(false); }
                });
            };
            useEffect(() => { loadData(); }, []);

            const executiveBaseMajors = useMemo(() => {
                const mSet = new Set();
                data.forEach(r => {
                    if(r.Major) mSet.add(r.Major.replace(/\s*\(เทียบโอน\)/g, '').trim());
                });
                return Array.from(mSet).sort();
            }, [data]);

            const filteredData = useMemo(() => {
                let result = data;
                if (searchTerm) {
                    const s = searchTerm.toLowerCase();
                    result = result.filter(r => 
                        (r.FullName || '').toLowerCase().includes(s) ||
                        (r.StudentID || '').toLowerCase().includes(s) ||
                        (r.Major || '').toLowerCase().includes(s) ||
                        (r.StudentPhone || '').includes(s) ||
                        (r.ParentPhone || '').includes(s)
                    );
                }
                
                if (activeTab === 'executive' && executiveMajor !== 'ทั้งหมด') {
                    result = result.filter(r => {
                        const baseMajor = r.Major ? r.Major.replace(/\s*\(เทียบโอน\)/g, '').trim() : '';
                        return baseMajor === executiveMajor;
                    });
                }
                
                return result;
            }, [data, searchTerm, activeTab, executiveMajor]);

            const stats = useMemo(() => {
                let total = filteredData.length, normalCount = 0, transferCount = 0, foodAlert = 0, healthAlert = 0;
                let majorCount = {}, dietStats = { 'ฮาลาล': 0, 'มังสวิรัติ': 0, 'เจ': 0, 'อาหารปกติ': 0 }, foodAllergies = [], diseases = [], drugAllergies = [];
                const surveillanceList = [];
                let surveillanceRiskPie = { 'ด้านการแพทย์': 0, 'ด้านโภชนาการ': 0, 'ความเสี่ยงซ้อน (ทั้งสอง)': 0 };

                filteredData.forEach(s => {
                    if(s.Major) {
                        majorCount[s.Major] = (majorCount[s.Major] || 0) + 1;
                        s.Major.includes("เทียบโอน") ? transferCount++ : normalCount++;
                    }
                    let hasF = s.FoodAllergy !== 'ไม่แพ้' || s.SpecificDiet !== 'ไม่มี';
                    let hasH = s.Disease !== 'ไม่มี' || s.DrugAllergy !== 'ไม่แพ้';
                    if (hasF) foodAlert++; if (hasH) healthAlert++;

                    if (s.FoodAllergy && s.FoodAllergy !== 'ไม่แพ้') foodAllergies.push(s);
                    if (s.SpecificDiet) {
                        if (s.SpecificDiet === 'ไม่มี') dietStats['อาหารปกติ']++;
                        else if (s.SpecificDiet.includes('ฮาลาล')) dietStats['ฮาลาล']++;
                        else if (s.SpecificDiet.includes('มังสวิรัติ')) dietStats['มังสวิรัติ']++;
                        else if (s.SpecificDiet.includes('เจ')) dietStats['เจ']++;
                    }
                    if (s.Disease && s.Disease !== 'ไม่มี') diseases.push(s);
                    if (s.DrugAllergy && s.DrugAllergy !== 'ไม่แพ้') drugAllergies.push(s);

                    if (hasF || hasH) {
                        let issues = [];
                        if (s.FoodAllergy !== 'ไม่แพ้') issues.push({ type: 'food', text: `แพ้อาหาร: ${s.FoodAllergy}` });
                        if (s.SpecificDiet !== 'ไม่มี') issues.push({ type: 'food', text: `อาหารเฉพาะ: ${s.SpecificDiet}` });
                        if (s.Disease !== 'ไม่มี') issues.push({ type: 'health', text: `โรคประจำตัว: ${s.Disease}` });
                        if (s.DrugAllergy !== 'ไม่แพ้') issues.push({ type: 'health', text: `แพ้ยา: ${s.DrugAllergy}` });
                        surveillanceList.push({ ...s, issues });

                        if (hasF && hasH) surveillanceRiskPie['ความเสี่ยงซ้อน (ทั้งสอง)']++;
                        else if (hasF) surveillanceRiskPie['ด้านโภชนาการ']++;
                        else if (hasH) surveillanceRiskPie['ด้านการแพทย์']++;
                    }
                });

                const surveillancePieData = Object.keys(surveillanceRiskPie).map(k => ({name: k, value: surveillanceRiskPie[k]})).filter(d => d.value > 0);

                return { total, pieData: Object.keys(majorCount).map(k=>({name:k, value:majorCount[k]})), COLORS: ['#ff6600', '#3b82f6', '#10b981', '#8b5cf6', '#ec4899', '#facc15', '#06b6d4'], foodAlert, healthAlert, surveillanceList, surveillancePieData, normalCount, transferCount, dietStats, foodAllergies, diseases, drugAllergies };
            }, [filteredData]);

            const handleDrilldown = (title, type, key) => {
                let filtered = [];
                if (type === 'religion_diet') filtered = filteredData.filter(s => s.SpecificDiet && s.SpecificDiet.includes(key));
                else if (type === 'food_allergy') filtered = filteredData.filter(s => s.FoodAllergy && s.FoodAllergy !== 'ไม่แพ้');
                else if (type === 'food_alert') filtered = filteredData.filter(s => (s.FoodAllergy && s.FoodAllergy !== 'ไม่แพ้') || (s.SpecificDiet && s.SpecificDiet !== 'ไม่มี'));
                else if (type === 'health_alert') filtered = filteredData.filter(s => (s.Disease && s.Disease !== 'ไม่มี') || (s.DrugAllergy && s.DrugAllergy !== 'ไม่แพ้'));
                else if (type === 'disease') filtered = filteredData.filter(s => s.Disease && s.Disease !== 'ไม่มี');
                else if (type === 'drug_allergy') filtered = filteredData.filter(s => s.DrugAllergy && s.DrugAllergy !== 'ไม่แพ้');
                else if (type === 'demographics') {
                    if (key === 'normal') filtered = filteredData.filter(s => s.Major && !s.Major.includes('เทียบโอน'));
                    else if (key === 'transfer') filtered = filteredData.filter(s => s.Major && s.Major.includes('เทียบโอน'));
                }
                setDrilldownData({ title, type, list: filtered });
            };

            const handleDelete = (id, name) => {
                Swal.fire({ title: 'ยืนยันลบข้อมูล?', text: `ลบข้อมูลของ ${name}`, icon: 'warning', showCancelButton: true, confirmButtonColor: '#ef4444', confirmButtonText: 'ลบ', cancelButtonText: 'ยกเลิก', background: isDarkMode?'#18181b':'#fff', color: isDarkMode?'#f8fafc':'#0f172a', customClass:{popup:'rounded-3xl'} }).then((res) => {
                    if (res.isConfirmed) {
                        Swal.fire({ title: 'กำลังลบ...', didOpen: () => Swal.showLoading(), background: isDarkMode?'#18181b':'#fff', color: isDarkMode?'#f8fafc':'#0f172a' });
                        submitToAPI('delete', { StudentID: id }).then(r => { if(r.success) { Swal.fire({ icon:'success', title:'สำเร็จ', timer:1500, showConfirmButton:false, background: isDarkMode?'#18181b':'#fff' }); loadData(); } }).catch(err => Swal.fire('Error', err.message, 'error'));
                    }
                });
            };

            const handleSaveEdit = (e) => {
                e.preventDefault();
                if (editItem.StudentID && editItem.StudentID.length !== 9) {
                    Swal.fire({ icon: 'warning', title: 'ข้อมูลไม่ถูกต้อง', text: 'กรุณาระบุรหัสนักศึกษาให้ครบ 9 หลัก', confirmButtonColor: '#ff6600', background: isDarkMode?'#18181b':'#fff', color: isDarkMode?'#f8fafc':'#0f172a' });
                    return;
                }
                if (editItem.StudentPhone.length !== 10 || editItem.ParentPhone.length !== 10) {
                    Swal.fire({ icon: 'warning', title: 'ข้อมูลไม่ถูกต้อง', text: 'กรุณาระบุเบอร์โทรศัพท์ให้ครบ 10 หลัก', confirmButtonColor: '#ff6600', background: isDarkMode?'#18181b':'#fff', color: isDarkMode?'#f8fafc':'#0f172a' });
                    return;
                }
                Swal.fire({ title: 'กำลังอัปเดต...', didOpen: () => Swal.showLoading(), background: isDarkMode?'#18181b':'#fff' });
                submitToAPI('update', { oldStudentID: editItem.oldStudentID, newData: editItem }).then(res => { if(res.success) { Swal.fire({ icon:'success', title:'บันทึกสำเร็จ', timer:1500, showConfirmButton:false, background: isDarkMode?'#18181b':'#fff' }); setEditItem(null); loadData(); } }).catch(err => Swal.fire('Error', err.message, 'error'));
            };

            const exportExcel = () => {
                if (filteredData.length === 0) return;
                const exportData = filteredData.map(r => ({ 'วันที่': r.Timestamp||'', 'รหัสนักศึกษา': r.StudentID||'', 'ชื่อ-นามสกุล': r.FullName||'', 'สาขาวิชา': r.Major||'', 'ศาสนา': r.Religion||'', 'กรุ๊ปเลือด': r.BloodGroup||'', 'เบอร์ นศ.': r.StudentPhone||'', 'เบอร์ ผปค.': r.ParentPhone||'', 'แพ้อาหาร': r.FoodAllergy||'', 'อาหารเฉพาะ': r.SpecificDiet||'', 'โรคประจำตัว': r.Disease||'', 'แพ้ยา': r.DrugAllergy||'' }));
                const ws = window.XLSX.utils.json_to_sheet(exportData);
                const wb = window.XLSX.utils.book_new(); window.XLSX.utils.book_append_sheet(wb, ws, "Students");
                window.XLSX.writeFile(wb, `DIGIT_Export_${new Date().toISOString().slice(0,10)}.xlsx`);
            };

            if (loading) return (
                <div className="flex flex-col justify-center items-center h-[70vh]">
                    <div className="p-4 bg-brand/10 rounded-2xl mb-4 animate-pulse-slow shadow-glow-brand"><Icon name="loader-2" size={40} className="text-brand animate-spin" /></div>
                    <p className="text-slate-500 font-bold tracking-widest uppercase text-sm">กำลังเชื่อมต่อฐานข้อมูล...</p>
                </div>
            );

            // 🌟 Updated TABS to match the exact requirement
            const TABS = [
                { id: 'overview', icon: 'users', label: 'ยอดขึ้นทะเบียน' },
                { id: 'majors', icon: 'pie-chart', label: 'สรุปยอดสาขาวิชา' },
                { id: 'health_diet', icon: 'activity', label: 'สุขภาพและโภชนาการ' },
                { id: 'surveillance', icon: 'shield-alert', label: 'กลุ่มเฝ้าระวังพิเศษ' },
                { id: 'executive', icon: 'layout-dashboard', label: 'รายงานผู้บริหาร' }
            ];

            return (
                <div className="flex flex-col md:flex-row gap-6 animate-fade-in pb-20 items-start w-full">
                    {/* Admin Sidebar */}
                    <div className="w-full md:w-64 glass-panel p-5 rounded-[2rem] flex flex-col md:sticky md:top-24 z-20 shrink-0 no-print border border-slate-200/50 dark:border-white/5 shadow-soft">
                        <div className="flex items-center gap-4 mb-8 px-2 pt-2">
                            <div className="w-12 h-12 bg-slate-900 dark:bg-white rounded-[1rem] flex items-center justify-center text-white dark:text-black shadow-lg"><Icon name="command" size={24}/></div>
                            <div>
                                <p className="text-[10px] text-brand font-black tracking-widest uppercase">Admin Portal</p>
                                <h3 className="font-black text-slate-800 dark:text-white leading-none text-lg mt-0.5">Dashboard</h3>
                            </div>
                        </div>
                        <div className="flex flex-row md:flex-col overflow-x-auto hide-scrollbar gap-2 pb-2 md:pb-0">
                            {TABS.map(tab => (
                                <button key={tab.id} onClick={() => { setActiveTab(tab.id); setCurrentPage(1); }} 
                                    className={`flex items-center gap-3 px-4 py-3.5 rounded-xl transition-all font-bold whitespace-nowrap btn-interactive
                                    ${activeTab === tab.id ? 'bg-brand text-white shadow-glow-brand hover:-translate-y-0.5' : 'text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-white/10 hover:text-slate-900 dark:hover:text-white'}`}>
                                    <Icon name={tab.icon} size={18} className={activeTab === tab.id ? 'text-white' : 'text-slate-400'}/> {tab.label}
                                </button>
                            ))}
                        </div>
                    </div>

                    {/* Admin Main Content */}
                    <div className="flex-1 w-full space-y-6 print-area min-w-0">
                        {/* Header Action Bar */}
                        <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center glass-panel p-5 md:px-8 md:py-6 rounded-[2.5rem] gap-4 no-print shadow-soft border border-slate-200/50 dark:border-white/5">
                            <h2 className="text-xl md:text-2xl font-black text-slate-800 dark:text-white flex items-center gap-3 whitespace-nowrap">
                                <div className="p-2.5 bg-brand/10 text-brand rounded-xl shadow-sm"><Icon name={(TABS.find(t=>t.id===activeTab) || {}).icon} size={20}/></div>
                                {(TABS.find(t=>t.id===activeTab) || {}).label}
                            </h2>
                            <div className="flex flex-col xl:flex-row flex-wrap w-full sm:w-auto gap-3 items-start xl:items-center">
                                {/* ช่องค้นหา */}
                                <div className="relative w-full sm:w-64">
                                    <div className="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
                                        <Icon name="search" size={16}/>
                                    </div>
                                    <input 
                                        type="text" 
                                        placeholder="ค้นหาชื่อ, รหัส, สาขา, เบอร์..." 
                                        value={searchTerm}
                                        onChange={(e) => {setSearchTerm(e.target.value); setCurrentPage(1);}}
                                        className="w-full pl-10 pr-8 py-2.5 rounded-xl input-modern text-sm font-semibold"
                                    />
                                    {searchTerm && (
                                        <button onClick={() => {setSearchTerm(''); setCurrentPage(1);}} className="absolute inset-y-0 right-0 pr-3 flex items-center text-slate-400 hover:text-red-500 transition-colors">
                                            <Icon name="x" size={14}/>
                                        </button>
                                    )}
                                </div>
                                <div className="flex flex-wrap w-full sm:w-auto gap-2 justify-start sm:justify-end">
                                    {activeTab === 'executive' && <button onClick={window.print} className="px-5 py-2.5 bg-slate-100 dark:bg-white/10 text-slate-700 dark:text-white rounded-xl font-bold text-sm flex items-center gap-2 btn-interactive hover:bg-slate-200"><Icon name="printer" size={16} /> พิมพ์</button>}
                                    <button onClick={exportExcel} className="px-5 py-2.5 bg-emerald-50 dark:bg-emerald-500/10 text-emerald-600 dark:text-emerald-400 hover:bg-emerald-500 hover:text-white rounded-xl font-bold text-sm flex items-center gap-2 transition-all btn-interactive shadow-sm"><Icon name="download" size={16} /> Excel</button>
                                    <button onClick={loadData} className="p-2.5 bg-slate-100 dark:bg-white/10 rounded-xl text-slate-500 hover:text-slate-800 dark:hover:text-white btn-interactive shadow-sm"><Icon name="refresh-cw" size={18}/></button>
                                    <button onClick={goBack} className="p-2.5 bg-red-50 dark:bg-red-500/10 text-red-500 rounded-xl hover:bg-red-500 hover:text-white btn-interactive shadow-sm"><Icon name="log-out" size={18}/></button>
                                </div>
                            </div>
                        </div>

                        {/* ========================================================= */}
                        {/* TAB 1: OVERVIEW (ยอดขึ้นทะเบียน และ กราฟรายงาน) */}
                        {/* ========================================================= */}
                        {activeTab === 'overview' && (
                            <div className="space-y-6 animate-fade-in">
                                {/* Top KPI Cards */}
                                <div className="grid grid-cols-2 lg:grid-cols-4 gap-4 md:gap-6">
                                    {[
                                        {l:'ยอดขึ้นทะเบียนรวม', v:stats.total, i:'users', c:'text-brand', bg:'bg-brand/10'}, 
                                        {l:'กลุ่มเปราะบาง (แพทย์)', v:stats.healthAlert, i:'activity', c:'text-red-500', bg:'bg-red-500/10'}, 
                                        {l:'จัดการอาหารพิเศษ', v:stats.foodAlert, i:'utensils', c:'text-orange-500', bg:'bg-orange-500/10'},
                                        {l:'สุขภาพปกติ', v:(stats.total - stats.healthAlert), i:'check-circle', c:'text-emerald-500', bg:'bg-emerald-500/10'}
                                    ].map((card, i) => (
                                        <div key={i} className="glass-panel p-6 md:p-8 rounded-[2rem] border border-slate-200/50 dark:border-white/5 relative overflow-hidden shadow-soft">
                                            <div className="flex justify-between items-start mb-4 relative z-10">
                                                <div className={`p-3.5 rounded-[1rem] ${card.bg} ${card.c} shadow-sm`}><Icon name={card.i} size={28} /></div>
                                            </div>
                                            <p className="text-slate-500 text-sm font-bold uppercase tracking-wider mb-1 relative z-10">{card.l}</p>
                                            <h3 className={`text-4xl md:text-5xl font-black text-slate-800 dark:text-white relative z-10 drop-shadow-sm`}>{card.v}</h3>
                                        </div>
                                    ))}
                                </div>

                                {/* Bar Chart (Modernized Horizontal Bar Chart) */}
                                <div className="glass-panel p-6 md:p-8 rounded-[2.5rem] border-t-[8px] border-t-brand shadow-soft flex flex-col relative overflow-hidden bg-gradient-to-b from-white to-slate-50/50 dark:from-zinc-900 dark:to-zinc-900/50">
                                    <div className="absolute top-0 right-0 p-8 opacity-5 text-brand pointer-events-none transform translate-x-4 -translate-y-4">
                                        <Icon name="bar-chart-2" size={120} />
                                    </div>
                                    <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 mb-8 relative z-10">
                                        <h3 className="text-xl md:text-2xl font-black text-slate-800 dark:text-white flex items-center gap-3">
                                            <div className="p-3 bg-brand/10 text-brand rounded-2xl shadow-inner"><Icon name="bar-chart-2" size={24}/></div>
                                            ยอดขึ้นทะเบียนแยกตามสาขาวิชา
                                        </h3>
                                        <div className="bg-brand/10 text-brand px-4 py-2 rounded-xl text-sm font-bold shadow-sm border border-brand/20">
                                            รวมทั้งหมด {stats.total} คน
                                        </div>
                                    </div>
                                    
                                    <div className="w-full min-h-[450px] relative z-10">
                                        {stats.pieData.length === 0 ? (
                                            <div className="w-full h-full flex flex-col items-center justify-center text-slate-400 bg-slate-50/50 dark:bg-white/5 rounded-[2rem] border border-dashed border-slate-200 dark:border-white/10">
                                                <Icon name="inbox" size={48} className="mb-4 opacity-20" />
                                                <p className="font-semibold text-lg">ไม่มีข้อมูลแสดงกราฟ</p>
                                            </div>
                                        ) : (
                                            <ResponsiveContainer width="100%" height="100%">
                                                <BarChart data={stats.pieData.sort((a,b)=>b.value-a.value)} layout="vertical" margin={{ top: 0, right: 50, left: 0, bottom: 0 }}>
                                                    <XAxis type="number" hide />
                                                    <YAxis dataKey="name" type="category" axisLine={false} tickLine={false} tick={{fill: isDarkMode ? '#cbd5e1' : '#475569', fontSize: 13, fontWeight: 700}} width={200} />
                                                    <Tooltip 
                                                        cursor={{fill: isDarkMode ? 'rgba(255,255,255,0.05)' : 'rgba(0,0,0,0.03)'}} 
                                                        contentStyle={{ backgroundColor: isDarkMode ? 'rgba(24, 24, 27, 0.95)' : 'rgba(255, 255, 255, 0.95)', backdropFilter: 'blur(10px)', border: '1px solid rgba(255,255,255,0.1)', borderRadius: '16px', boxShadow: '0 20px 40px rgba(0,0,0,0.2)', fontWeight: 'bold', padding: '12px 20px' }} 
                                                        itemStyle={{ color: isDarkMode ? '#fff' : '#0f172a', fontWeight: '900', fontSize: '16px' }}
                                                        formatter={(value) => [value + ' คน', 'จำนวน']}
                                                    />
                                                    <Bar dataKey="value" radius={[0, 12, 12, 0]} barSize={28} label={{ position: 'right', fill: isDarkMode ? '#fff' : '#0f172a', fontSize: 16, fontWeight: '900', formatter: (val) => val }}>
                                                        {stats.pieData.map((e, i) => (
                                                            <Cell key={i} fill={stats.COLORS[i % stats.COLORS.length]} className="hover:opacity-80 transition-all duration-300 drop-shadow-sm cursor-pointer" />
                                                        ))}
                                                    </Bar>
                                                </BarChart>
                                            </ResponsiveContainer>
                                        )}
                                    </div>
                                </div>

                                {/* Table รายชื่อล่าสุด (Clickable) */}
                                <div className="glass-panel rounded-[2rem] overflow-hidden border border-slate-200/50 dark:border-white/5 shadow-soft">
                                    <div className="p-6 md:px-8 border-b border-slate-100 dark:border-white/5 bg-slate-50/50 dark:bg-white/5 flex justify-between items-center">
                                        <h3 className="font-bold text-slate-800 dark:text-white flex items-center gap-3"><Icon name="list" className="text-slate-400" size={18}/> รายชื่ออัปเดตล่าสุด <span className="text-xs bg-slate-200 dark:bg-white/10 px-2 py-1 rounded-md text-slate-500 font-semibold">(คลิกที่รายชื่อเพื่อดู/แก้ไข)</span></h3>
                                    </div>
                                    <div className="overflow-x-auto p-2 custom-scrollbar">
                                        <table className="w-full text-sm text-left min-w-[700px]">
                                            <thead className="text-[11px] text-slate-400 uppercase tracking-widest bg-transparent">
                                                <tr><th className="px-6 py-3">ชื่อ-นามสกุล</th><th className="px-6 py-3">สาขาวิชา</th><th className="px-6 py-3 text-center">สถานะ</th><th className="px-6 py-3">ข้อมูลติดต่อ</th></tr>
                                            </thead>
                                            <tbody className="divide-y divide-slate-100 dark:divide-white/5">
                                                {(() => {
                                                    const reversedData = [...filteredData].reverse();
                                                    const itemsPerPage = 15;
                                                    const indexOfLastItem = currentPage * itemsPerPage;
                                                    const indexOfFirstItem = indexOfLastItem - itemsPerPage;
                                                    const currentItems = reversedData.slice(indexOfFirstItem, indexOfLastItem);
                                                    
                                                    if (currentItems.length === 0) return <tr><td colSpan="4" className="text-center py-12 text-slate-400 font-medium">ไม่พบข้อมูลที่ค้นหา</td></tr>;
                                                    
                                                    return currentItems.map((row, i) => {
                                                        const issues = [];
                                                        if (row.FoodAllergy && row.FoodAllergy !== 'ไม่แพ้') issues.push({ type: 'food', text: `แพ้อาหาร: ${row.FoodAllergy}` });
                                                        if (row.SpecificDiet && row.SpecificDiet !== 'ไม่มี') issues.push({ type: 'food', text: `อาหารเฉพาะ: ${row.SpecificDiet}` });
                                                        if (row.Disease && row.Disease !== 'ไม่มี') issues.push({ type: 'health', text: `โรคประจำตัว: ${row.Disease}` });
                                                        if (row.DrugAllergy && row.DrugAllergy !== 'ไม่แพ้') issues.push({ type: 'health', text: `แพ้ยา: ${row.DrugAllergy}` });
                                                        const isRisk = issues.length > 0;
                                                        
                                                        return (
                                                            <tr key={i} onClick={() => setEditItem({...row, oldStudentID: row.StudentID})} className="hover:bg-slate-50/80 dark:hover:bg-white/5 transition-colors cursor-pointer group">
                                                                <td className="px-6 py-4 font-bold text-slate-800 dark:text-slate-200 group-hover:text-brand transition-colors">{row.FullName}</td>
                                                                <td className="px-6 py-4 text-xs font-medium text-slate-500">{row.Major}</td>
                                                                <td className="px-6 py-4 text-center">
                                                                    {isRisk ? <span className="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-lg bg-red-50 dark:bg-red-500/10 text-red-600 dark:text-red-400 text-[10px] font-bold border border-red-200 dark:border-red-500/20 shadow-sm"><Icon name="shield-alert" size={12}/> เฝ้าระวัง</span> 
                                                                            : <span className="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-lg bg-emerald-50 dark:bg-emerald-500/10 text-emerald-600 dark:text-emerald-400 text-[10px] font-bold border border-emerald-200 dark:border-emerald-500/20 shadow-sm"><Icon name="check-circle" size={12}/> ปกติ</span>}
                                                                </td>
                                                                <td className="px-6 py-4 text-xs">
                                                                    <div className="text-slate-500 dark:text-slate-400 font-semibold flex items-center gap-1.5"><Icon name="user" size={12}/> {row.StudentPhone || '-'}</div>
                                                                </td>
                                                            </tr>
                                                        );
                                                    });
                                                })()}
                                            </tbody>
                                        </table>
                                    </div>
                                    {filteredData.length > 0 && (
