<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DIGIT.CRRU - ระบบบริการนักศึกษา</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['Prompt', 'sans-serif'] },
                    colors: {
                        orange: { 50: '#fff7ed', 100: '#ffedd5', 200: '#fed7aa', 300: '#fdba74', 400: '#fb923c', 500: '#f97316', 600: '#ea580c', 700: '#c2410c', 800: '#9a3412', 900: '#7c2d12' },
                        charcoal: { 50: '#f9f9f9', 100: '#f3f4f6', 800: '#374151', 900: '#111827' }
                    }
                }
            }
        }
    </script>
    
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>

    <style>
        body { font-family: 'Prompt', sans-serif; background: linear-gradient(135deg, #fffcf9 0%, #ffedd5 100%); background-attachment: fixed; color: #111827; min-height: 100vh; padding-bottom: 80px; transition: color 0.3s ease; }
        @media (min-width: 768px) { body { padding-bottom: 0; } }
        .luxury-card { background-color: #ffffff; border: 1px solid rgba(255, 237, 213, 0.6); box-shadow: 0 10px 40px -10px rgba(249, 115, 22, 0.08); border-radius: 1.5rem; transition: all 0.3s ease; }
        .luxury-card:hover { border-color: rgba(249, 115, 22, 0.3); box-shadow: 0 20px 40px -10px rgba(249, 115, 22, 0.15); transform: translateY(-2px); }
        .luxury-input { background-color: #fdfdfd; border: 1px solid #fce7d2; border-radius: 1rem; padding: 1rem 1.25rem; color: #111827; transition: all 0.3s ease; width: 100%; outline: none; }
        .luxury-input:focus { border-color: #f97316; box-shadow: 0 0 0 4px rgba(249, 115, 22, 0.15); }
        .btn-gradient { background: linear-gradient(135deg, #fb923c 0%, #ea580c 100%); color: #ffffff; border: none; cursor: pointer; transition: all 0.3s ease; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; }
        .btn-gradient:hover { box-shadow: 0 8px 20px rgba(234, 88, 12, 0.3); filter: brightness(1.05); }
        .custom-scrollbar::-webkit-scrollbar { height: 6px; width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        html.dark body { background: linear-gradient(135deg, #1c1512 0%, #120c0a 100%); color: #e5e5e5; }
        html.dark .bg-white { background-color: #1e1e1e !important; }
        html.dark .text-charcoal-900 { color: #f5f5f5 !important; }
        html.dark .border-gray-100 { border-color: #333 !important; }
        html.dark .luxury-card { background-color: #1e1e1e; border-color: #333; }
        html.dark .luxury-input { background-color: #121212; border-color: #333; color: #f5f5f5; }
        #app-loader { position: fixed; inset: 0; background-color: #fffcf9; z-index: 999999; display: flex; flex-direction: column; align-items: center; justify-content: center; transition: opacity 0.3s ease; }
        .loader-spinner { width: 40px; height: 40px; border: 3px solid #ffedd5; border-top-color: #f97316; border-radius: 50%; animation: spin 0.8s linear infinite; margin-bottom: 20px; }
        @keyframes spin { 100% { transform: rotate(360deg); } }
        .modern-table th { background-color: #f1f5f9; color: #475569; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; font-size: 0.75rem; padding: 1rem 1.5rem; border-bottom: 2px solid #e2e8f0; }
        .modern-table td { padding: 1.25rem 1.5rem; border-bottom: 1px solid #f1f5f9; color: #334155; }
        .modern-table tr:hover td { background-color: #f8fafc; }
    </style>
</head>
<body class="selection:bg-orange-500 selection:text-white">

    <div id="app-loader">
        <div class="loader-spinner"></div>
        <h2 style="font-family: 'Prompt', sans-serif; font-size: 20px; font-weight: 700; color: #f97316; letter-spacing: 1px;">DIGIT.CRRU</h2>
        <p style="color: #6b7280; font-size: 12px; margin-top: 10px;">กำลังโหลดระบบ...</p>
    </div>

    <script>
        window.hideLoader = () => {
            const loader = document.getElementById('app-loader');
            if (loader) { loader.style.opacity = '0'; setTimeout(() => loader.style.display = 'none', 300); }
        };
        setTimeout(window.hideLoader, 8000); 

        window.downloadSPSSWord = function(filename) {
            const content = document.getElementById('spss-ex').innerHTML;
            const header = "<html xmlns:o='urn:schemas-microsoft-com:office:office' xmlns:w='urn:schemas-microsoft-com:office:word' xmlns='http://www.w3.org/TR/REC-html40'><head><meta charset='utf-8'><title>Export HTML to Word</title><style>table { border-collapse: collapse; width: 100%; margin-bottom: 20px; } th, td { border: 1px solid #000; padding: 8px; } h4 { margin-top: 20px; margin-bottom: 10px; }</style></head><body>";
            const footer = "</body></html>";
            const sourceHTML = header + content + footer;
            const source = 'data:application/vnd.ms-word;charset=utf-8,' + encodeURIComponent(sourceHTML);
            const fileDownload = document.createElement("a");
            document.body.appendChild(fileDownload);
            fileDownload.href = source;
            fileDownload.download = 'รายงานประเมิน_' + filename + '.doc';
            fileDownload.click();
            document.body.removeChild(fileDownload);
        };

        // ตั้งค่าให้ Babel ใช้ Classic Runtime ป้องกันปัญหา Cannot use import statement
        if (window.Babel && Babel.availablePresets && Babel.availablePresets['react']) {
            Babel.registerPreset('react-classic', {
                presets: [
                    [Babel.availablePresets['react'], { runtime: 'classic' }]
                ]
            });
        }
    </script>

    <div id="root"></div>

    <script type="text/babel" data-presets="react-classic,env">
        /** @jsx React.createElement */
        /** @jsxFrag React.Fragment */

        const { useState, useEffect, useMemo, useCallback } = React;

        // ==========================================
        // 1. CORE API & UTILITIES
        // ==========================================
        const API_CONFIG = {
            SHEET_ID: "1KLJNWUUIj1r6eqCZnaF-F6nA2FQg7pvOHMk0PyDCyAc",
            WEB_APP_URL: "https://script.google.com/macros/s/AKfycby0iQpbOXqr82EvrX_qhwOtrBc3YN5oBFFLrzipXYoWJ3m1fwxMUAyxspLneeNQrmImnw/exec",
            getCSVUrl: function(sheet) { return `https://docs.google.com/spreadsheets/d/${this.SHEET_ID}/gviz/tq?tqx=out:csv&sheet=${sheet}&_=${Date.now()}`; }
        };

        const fetchCSV = (sheet) => {
            return new Promise((resolve, reject) => {
                Papa.parse(API_CONFIG.getCSVUrl(sheet), {
                    download: true, header: true, skipEmptyLines: true,
                    complete: (res) => {
                        if (res.data[0] && String(Object.keys(res.data[0])[0]).toLowerCase().includes('html')) reject(new Error("Permission Denied"));
                        else resolve(res.data);
                    },
                    error: reject
                });
            });
        };

        const runGAS = async (action, ...params) => {
            if (typeof google !== 'undefined' && google.script) {
                return new Promise((res, rej) => google.script.run.withSuccessHandler(res).withFailureHandler(rej)[action](...params));
            }
            const response = await fetch(API_CONFIG.WEB_APP_URL, {
                method: 'POST', body: JSON.stringify({ action, params }), headers: { 'Content-Type': 'text/plain;charset=utf-8' }
            });
            const result = await response.json();
            if (!result.success) throw new Error(result.error || "Server Error");
            return result.data !== undefined ? result.data : result;
        };

        const getVal = (obj, keys, fb) => {
            if(!obj) return '';
            const found = Object.keys(obj).find(k => keys.some(kw => k.toLowerCase().includes(kw)));
            return found ? obj[found] : (obj[fb] || '');
        };

        const formatTHDate = (ts) => {
            if(!ts) return { full: '-', short: '-' };
            const d = new Date(ts);
            if(isNaN(d.getTime())) return { full: String(ts), short: String(ts) };
            return {
                full: d.toLocaleDateString('th-TH') + ' ' + d.toLocaleTimeString('th-TH', {hour:'2-digit', minute:'2-digit'}) + ' น.',
                short: d.toLocaleDateString('th-TH', { month:'short', day:'numeric' })
            };
        };

        const exportExcel = (data, filename, fields, headers) => {
            if(!data || data.length === 0) return Swal.fire('แจ้งเตือน', 'ไม่มีข้อมูลให้ส่งออก', 'warning');
            const exportData = data.map(r => {
                let row = {};
                fields.forEach((f, i) => { 
                    // Force IDCard to be a string in Excel to prevent 1.11E+12
                    let val = String(getVal(r, [f.toLowerCase()], f));
                    if (f.toLowerCase().includes('idcard') || f.toLowerCase().includes('บัตร')) val = "'" + val; 
                    row[headers[i] || f] = val; 
                });
                return row;
            });
            const ws = XLSX.utils.json_to_sheet(exportData);
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "Data");
            XLSX.writeFile(wb, filename);
        };

        const surveyData = [
            { title: "1. กระบวนการ ขั้นตอนการให้บริการ", questions: [ { id: "q1", text: "1.1 การประชาสัมพันธ์โครงการ ฯ" }, { id: "q2", text: "1.2 ความเหมาะสมของสถานที่" }, { id: "q3", text: "1.3 ความเหมาะสมของระยะเวลา" }, { id: "q4", text: "1.4 การจัดลำดับขั้นตอนของกิจกรรม" } ] },
            { title: "2. การอำนวยความสะดวก", questions: [ { id: "q5", text: "2.1 เอกสาร" }, { id: "q6", text: "2.2 โสตทัศนูปกรณ์" }, { id: "q7", text: "2.3 เจ้าหน้าที่สนับสนุน" }, { id: "q8", text: "2.4 อาหาร,เครื่องดื่มและสถานที่" } ] },
            { title: "3. คุณภาพการให้บริการ", questions: [ { id: "q9", text: "3.1 ท่านได้รับความรู้ แนวคิด ทักษะและประสบการณ์ใหม่ ๆ จากโครงการ" }, { id: "q10", text: "3.2 ท่านสามารถนำสิ่งที่ได้รับจากโครงการ/กิจกรรมนี้ไปใช้ในการปฏิบัติงาน" }, { id: "q11", text: "3.3 สิ่งที่ท่านได้รับจากโครงการ/กิจกรรมครั้งนี้ตรงตามความคาดหวังของท่านหรือไม่" }, { id: "q12", text: "3.4 โครงการ/กิจกรรมนี้เอื้ออำนวยต่อการเรียนรู้และพัฒนาความสามารถของท่าน" }, { id: "q13", text: "3.5 ประโยชน์ที่ท่านได้รับจากโครงการ/กิจกรรม" } ] }
        ];

        // ==========================================
        // 2. REUSABLE UI COMPONENTS
        // ==========================================
        function StatusBadge({ status, openLabel='เปิด', closedLabel='ปิด' }) {
            const isOpen = String(status).toLowerCase() === 'open' || String(status).toLowerCase() === 'true';
            return (
                <span className={`px-3 py-1 rounded-lg text-[10px] font-bold border uppercase tracking-widest ${isOpen ? 'bg-emerald-50 text-emerald-600 border-emerald-200' : 'bg-gray-50 text-gray-500 border-gray-200'}`}>
                    {isOpen ? openLabel : closedLabel}
                </span>
            );
        }

        function DataTable({ data, columns, excelHeaders, exportName, filterOptions, filterKey, searchKeys, renderRow }) {
            const [page, setPage] = useState(1);
            const [search, setSearch] = useState('');
            const [filter, setFilter] = useState('');
            const itemsPerPage = 10;

            const filteredData = useMemo(() => {
                return data.filter(item => {
                    if (filter && String(getVal(item, [filterKey.toLowerCase()], filterKey)) !== String(filter)) return false;
                    if (!search) return true;
                    return searchKeys.some(k => String(getVal(item, [k.toLowerCase()], k)).toLowerCase().includes(search.toLowerCase()));
                });
            }, [data, search, filter, filterKey, searchKeys]);

            const paginatedData = filteredData.slice((page - 1) * itemsPerPage, page * itemsPerPage);
            const totalPages = Math.ceil(filteredData.length / itemsPerPage) || 1;

            return (
                <div className="bg-white rounded-2xl shadow-sm border border-orange-100 overflow-hidden">
                    <div className="p-5 flex flex-col md:flex-row gap-4 justify-between bg-gray-50/50 border-b border-gray-100">
                        <div className="flex flex-col sm:flex-row gap-3 w-full md:w-auto">
                            {filterOptions && (
                                <select className="border border-gray-200 rounded-xl px-4 py-2 text-sm outline-none focus:border-orange-500" value={filter} onChange={(e) => { setFilter(e.target.value); setPage(1); }}>
                                    <option value="">-- ทั้งหมด --</option>
                                    {filterOptions.map(opt => <option key={opt.val} value={opt.val}>{opt.label}</option>)}
                                </select>
                            )}
                            <div className="relative">
                                <i className="fa-solid fa-search absolute left-3 top-1/2 -translate-y-1/2 text-gray-400"></i>
                                <input type="text" placeholder="ค้นหา..." value={search} onChange={(e) => { setSearch(e.target.value); setPage(1); }} className="w-full pl-9 pr-4 py-2 border border-gray-200 rounded-xl text-sm outline-none focus:border-orange-500" />
                            </div>
                        </div>
                        {exportName && (
                            <button onClick={() => exportExcel(filteredData, exportName, columns, excelHeaders)} className="btn-gradient px-4 py-2 rounded-xl text-xs flex items-center justify-center gap-2">
                                <i className="fa-solid fa-download"></i> ส่งออก Excel
                            </button>
                        )}
                    </div>
                    <div className="overflow-x-auto">
                        <table className="w-full text-sm text-left modern-table whitespace-nowrap">
                            <thead className="bg-white"><tr>{excelHeaders.map((h, i) => <th key={i}>{h}</th>)}</tr></thead>
                            <tbody className="divide-y divide-gray-50">
                                {paginatedData.map((row, i) => renderRow(row, i))}
                                {paginatedData.length === 0 && <tr><td colSpan={excelHeaders.length} className="text-center py-10 text-gray-400 font-medium">ไม่พบข้อมูล</td></tr>}
                            </tbody>
                        </table>
                    </div>
                    <div className="flex justify-between items-center px-6 py-4 bg-gray-50/50 border-t border-gray-100">
                        <span className="text-[10px] font-bold text-gray-500 uppercase tracking-widest">รวม {filteredData.length} รายการ</span>
                        <div className="flex gap-2">
                            <button disabled={page===1} onClick={()=>setPage(p=>p-1)} className="px-3 py-1.5 bg-white border border-gray-200 rounded-lg text-[10px] font-bold disabled:opacity-50">ก่อนหน้า</button>
                            <span className="px-3 py-1.5 bg-orange-50 text-orange-600 border border-orange-200 rounded-lg text-[10px] font-bold">{page} / {totalPages}</span>
                            <button disabled={page===totalPages} onClick={()=>setPage(p=>p+1)} className="px-3 py-1.5 bg-white border border-gray-200 rounded-lg text-[10px] font-bold disabled:opacity-50">ถัดไป</button>
                        </div>
                    </div>
                </div>
            );
        }

        function Footer() {
            return (
                <footer className="w-full py-8 mt-auto flex flex-col items-center justify-center text-center z-10 relative">
                    <div className="w-12 h-px bg-orange-300 mb-4 opacity-50"></div>
                    <p className="text-[10px] text-gray-500 font-light">ฝ่ายกิจการนักศึกษา คณะเทคโนโลยีดิจิทัล มหาวิทยาลัยราชภัฏเชียงราย</p>
                </footer>
            );
        }

        function ReceiptSlipComponent({ title, data, config, shirtPrice }) {
            const isPaid = String(data?.status || '').toLowerCase() === 'paid' || String(data?.status || '') === 'ชำระแล้ว';
            return (
                <div className="bg-white p-8 relative flex flex-col w-[48%] overflow-hidden" style={{ minHeight: '100%' }}>
                    {isPaid && (
                        <div className="absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 opacity-[0.03] pointer-events-none -rotate-45 flex flex-col items-center justify-center z-0">
                            <i className="fa-solid fa-circle-check text-[150px] mb-4"></i>
                            <span className="text-[80px] font-black uppercase tracking-[0.2em] leading-none">PAID</span>
                        </div>
                    )}
                    
                    <div className="relative z-10 border-b-2 border-gray-800 pb-5 mb-6 flex justify-between items-start">
                        <div className="max-w-[70%]">
                            <div className="flex items-center gap-3 mb-2">
                                <div className="w-10 h-10 bg-charcoal-900 text-white rounded-lg flex items-center justify-center text-lg shadow-sm">
                                    <i className="fa-solid fa-file-invoice"></i>
                                </div>
                                <div>
                                    <h1 className="text-xl font-black text-charcoal-900 tracking-tight">ใบเสร็จรับเงิน</h1>
                                    <p className="text-[9px] text-gray-500 font-bold tracking-widest uppercase">Official Receipt</p>
                                </div>
                            </div>
                            <h2 className="text-xs font-semibold text-gray-700 whitespace-pre-wrap mt-3 leading-relaxed">{config.header}</h2>
                        </div>
                        <div className="text-right flex flex-col items-end">
                            <div className="inline-block bg-gradient-to-r from-gray-800 to-gray-900 text-white px-3 py-1.5 rounded text-[9px] font-black tracking-widest uppercase mb-3 shadow-sm">{title}</div>
                            <p className="text-[9px] text-gray-400 uppercase font-bold tracking-widest mb-0.5">เลขที่ออเดอร์ / Order No.</p>
                            <p className="text-sm font-black text-charcoal-900 bg-gray-50 px-2 py-1 rounded border border-gray-100">{data.orderId}</p>
                        </div>
                    </div>
                    
                    <div className="relative z-10 flex gap-4 mb-6 bg-orange-50/30 p-4 rounded-xl border border-orange-100/50">
                        <div className="flex-1">
                            <p className="text-[9px] text-orange-600 font-bold uppercase tracking-widest mb-1.5"><i className="fa-solid fa-user-check mr-1"></i> ได้รับเงินจาก / Received From</p>
                            <p className="font-bold text-charcoal-900 text-sm mb-0.5">{data.student.Name}</p>
                            <p className="text-xs text-gray-600 font-medium line-clamp-1">{data.student.Major}</p>
                            <p className="text-[10px] text-gray-500 font-medium mt-1">รหัสนักศึกษา: <span className="font-bold text-charcoal-900">{data.student.StudentID}</span></p>
                        </div>
                        <div className="w-px bg-orange-200/50 my-2"></div>
                        <div className="w-1/3">
                            <p className="text-[9px] text-orange-600 font-bold uppercase tracking-widest mb-1.5"><i className="fa-solid fa-calendar-day mr-1"></i> วันที่ / Date</p>
                            <p className="font-bold text-charcoal-900 text-sm">{data.date.split(' ')[0]}</p>
                            <p className="text-xs text-gray-500 font-medium mt-0.5">{data.date.split(' ')[1] || ''}</p>
                        </div>
                    </div>
                    
                    <div className="relative z-10 flex-grow mb-6">
                        <div className="bg-gray-50 rounded-xl border border-gray-100 overflow-hidden">
                            <table className="w-full text-sm text-left">
                                <thead className="bg-gray-100/80 text-[9px] text-gray-500 font-bold uppercase tracking-widest border-b border-gray-200">
                                    <tr>
                                        <th className="py-3 px-4">รายการ (Description)</th>
                                        <th className="py-3 px-4 text-center w-16">จำนวน</th>
                                        <th className="py-3 px-4 text-right w-28">ราคา (Amount)</th>
                                    </tr>
                                </thead>
                                <tbody className="divide-y divide-gray-100">
                                    {[ 
                                        { n: 'เสื้อคอปกโปโล (Polo)', g: data.poloGender, s: data.poloSize, q: data.poloQty }, 
                                        { n: 'เสื้อยืดกิจกรรม (T-Shirt)', g: data.tshirtGender, s: data.tshirtSize, q: data.tshirtQty }
                                    ].filter(item => item.q > 0).map((item, idx) => (
                                        <tr key={idx} className="bg-white">
                                            <td className="py-3 px-4">
                                                <p className="font-bold text-charcoal-900 text-xs">{item.n}</p>
                                                <p className="text-[10px] text-gray-500 font-medium mt-0.5">ทรง: {item.g} | ไซส์: <span className="font-bold text-charcoal-900">{item.s}</span></p>
                                            </td>
                                            <td className="py-3 px-4 text-center font-bold text-charcoal-900 text-xs bg-gray-50/50">{item.q}</td>
                                            <td className="py-3 px-4 text-right font-bold text-charcoal-900 text-xs">
                                                ฿{((['XL', '2XL', '3XL'].includes(item.s) ? shirtPrice.oversize : shirtPrice.normal) * item.q).toLocaleString()}
                                            </td>
                                        </tr>
                                    ))}
                                </tbody>
                            </table>
                        </div>
                    </div>
                    
                    <div className="relative z-10 mt-auto flex flex-col gap-4">
                        <div className="flex justify-between items-end bg-charcoal-900 text-white p-4 rounded-xl shadow-md">
                            <div>
                                <span className="text-[10px] text-gray-400 font-bold uppercase tracking-widest mb-1 block">รวมเงินทั้งสิ้น / Grand Total</span>
                                <div className="flex items-center gap-2 mt-1">
                                    {data.paymentMethod === 'cash' ? (
                                        <span className="inline-flex items-center gap-1 bg-amber-500/20 text-amber-300 border border-amber-500/30 px-2 py-0.5 rounded text-[9px] font-bold">
                                            <i className="fa-solid fa-money-bill-wave"></i> เงินสด (Cash)
                                        </span>
                                    ) : (
                                        <span className="inline-flex items-center gap-1 bg-emerald-500/20 text-emerald-300 border border-emerald-500/30 px-2 py-0.5 rounded text-[9px] font-bold">
                                            <i className="fa-solid fa-qrcode"></i> โอนเงิน (PromptPay)
                                        </span>
                                    )}
                                    {isPaid && <span className="inline-flex items-center gap-1 bg-blue-500/20 text-blue-300 border border-blue-500/30 px-2 py-0.5 rounded text-[9px] font-bold"><i className="fa-solid fa-check-double"></i> ยืนยันแล้ว</span>}
                                </div>
                            </div>
                            <div className="text-right">
                                <span className="text-xl font-black tracking-tight">฿ {data.grandTotal.toLocaleString()}</span>
                            </div>
                        </div>
                        
                        <div className="flex justify-between items-end gap-6 px-1">
                            <div className="flex-1 text-[9px] text-gray-500 font-medium leading-relaxed bg-gray-50 p-3 rounded-lg border border-gray-100">
                                <span className="font-bold text-gray-700 uppercase tracking-widest"><i className="fa-solid fa-circle-info text-orange-400 mr-1"></i> หมายเหตุ (Note):</span><br/>
                                <span className="whitespace-pre-wrap">{config.note}</span>
                            </div>
                            <div className="w-[35%] flex flex-col items-center">
                                <div className="w-full border-b border-dashed border-gray-400 mb-2 h-6 relative">
                                    {isPaid && (
                                        <div className="absolute -top-3 left-1/2 -translate-x-1/2 text-[10px] text-emerald-500 font-black border-2 border-emerald-500 px-2 py-0.5 rounded -rotate-12 bg-white/80">RECEIVED</div>
                                    )}
                                </div>
                                <p className="text-[10px] font-bold text-charcoal-900 mb-0.5">ผู้รับเงิน / Receiver</p>
                                <p className="text-[8px] text-gray-400 uppercase tracking-widest">Authorized Signature</p>
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        function ShirtSection({ num, title, genderState, setGenderState, sizeState, setSizeState, qtyState, setQtyState, getPrice }) {
            return (
                <div className="mb-8">
                    <h3 className="font-semibold text-charcoal-900 mb-4 flex items-center"><span className="text-orange-500 mr-2">{num}.</span> {title}</h3>
                    <div className="border border-orange-50/80 rounded-2xl p-5 sm:p-6 bg-white shadow-sm">
                        <div className="mb-5">
                            <label className="block text-xs font-medium text-gray-400 uppercase tracking-widest mb-3">ทรงเสื้อ</label>
                            <div className="flex gap-4">
                                {['ชาย', 'หญิง'].map(g => ( 
                                    <label key={`${num}-${g}`} className={`flex-1 py-3 rounded-xl border text-center cursor-pointer text-sm font-medium transition-all ${genderState === g ? 'border-orange-500 bg-orange-500 text-white shadow-md' : 'border-gray-200 text-gray-500 hover:border-orange-300'}`}>
                                        <input type="radio" className="hidden" checked={genderState === g} onChange={() => setGenderState(g)} /> ทรง{g}
                                    </label> 
                                ))}
                            </div>
                        </div>
                        <div className="mb-5">
                            <label className="block text-xs font-medium text-gray-400 uppercase tracking-widest mb-3">ขนาด (Size)</label>
                            <div className="grid grid-cols-3 sm:grid-cols-6 gap-2 sm:gap-3">
                                {['S', 'M', 'L', 'XL', '2XL', '3XL'].map(size => ( 
                                    <label key={`${num}-${size}`} className={`relative flex flex-col items-center py-3 rounded-xl border cursor-pointer transition-all ${sizeState === size ? 'border-orange-500 bg-orange-50 text-orange-600 shadow-sm' : 'border-gray-200 text-gray-500 hover:border-orange-300'}`}>
                                        <input type="radio" className="hidden" checked={sizeState === size} onChange={() => setSizeState(size)} />
                                        <span className="text-sm font-semibold">{size}</span>
                                        <span className="text-[9px] opacity-70 mt-1">฿{getPrice(size)}</span>
                                    </label> 
                                ))}
                            </div>
                        </div>
                        <div className="flex justify-between items-center bg-orange-50/50 p-4 rounded-xl border border-orange-100">
                            <label className="text-xs font-medium text-gray-500 uppercase tracking-widest">จำนวน</label>
                            <div className="flex items-center gap-3">
                                <button type="button" onClick={() => setQtyState(Math.max(1, qtyState - 1))} className="w-8 h-8 rounded border border-orange-200 bg-white text-orange-500 hover:bg-orange-100"><i className="fa-solid fa-minus text-xs"></i></button>
                                <span className="font-semibold text-charcoal-900 w-6 text-center text-sm">{qtyState}</span>
                                <button type="button" onClick={() => setQtyState(qtyState + 1)} className="w-8 h-8 rounded border border-orange-200 bg-white text-orange-500 hover:bg-orange-100"><i className="fa-solid fa-plus text-xs"></i></button>
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        // ==========================================
        // 3. ADMIN DASHBOARD
        // ==========================================
        function AdminDashboard({ db, setDb, sysConfig, setSysConfig, toggleCache, goHome, reloadData }) {
            const [tab, setTab] = useState('overview');
            const [spssActId, setSpssActId] = useState('');
            
            useEffect(() => { reloadData(true); }, []);

            const toggleStatus = async (type, id, cur) => {
                const ns = String(cur).toLowerCase() === 'open' ? 'closed' : 'open';
                Swal.fire({title:'กำลังบันทึก...', didOpen:()=>Swal.showLoading()});
                try {
                    if(type === 'sys_main') { await runGAS('updateSetting', 'SystemStatus', ns); toggleCache('SYS_MAIN', ns); setSysConfig(p=>({...p, main:ns})); }
                    if(type === 'sys_recruit') { await runGAS('updateSetting', 'RecruitStatus', ns); toggleCache('SYS_RECRUIT', ns); setSysConfig(p=>({...p, recruit:ns})); }
                    if(type === 'sys_shirt') { await runGAS('updateSetting', 'ShirtStatus', ns); toggleCache('SYS_SHIRT', ns); setSysConfig(p=>({...p, shirt:ns})); }
                    if(type === 'act') { await runGAS('toggleActivityStatus', id, ns); toggleCache(`ACT_${id}`, ns); setDb(p=>({...p, acts: p.acts.map(a=>a.ActivityID===id?{...a,Status:ns}:a)})); }
                    if(type === 'rec') { await runGAS('toggleRecruitStatus', id, ns); toggleCache(`REC_${id}`, ns); setDb(p=>({...p, recs: p.recs.map(a=>a.RecruitID===id?{...a,Status:ns}:a)})); }
                    if(type === 'order') { 
                        const os = String(cur).toLowerCase()==='received'?'paid':'received'; 
                        await runGAS('updateShirtOrderStatus', id, os); 
                        setDb(p=>({...p, orders: p.orders.map(o=>getVal(o,['studentid','รหัส'])===id?{...o,Status:os}:o)})); 
                    }
                    Swal.fire({toast:true, position:'top-end', icon:'success', title:'อัปเดตสำเร็จ', timer:1500, showConfirmButton:false});
                } catch(e) { Swal.fire('Error', e.message, 'error'); }
            };

            const menus = [
                { id: 'overview', icon: 'fa-chart-pie', label: 'ภาพรวมระบบ' },
                { id: 'acts', icon: 'fa-list', label: 'จัดการกิจกรรม' },
                { id: 'checks', icon: 'fa-user-check', label: 'ยอดเช็คชื่อ' },
                { id: 'evals', icon: 'fa-file-lines', label: 'รายงานผลประเมิน' },
                { id: 'recs', icon: 'fa-bullhorn', label: 'จัดการรับสมัคร' },
                { id: 'regis', icon: 'fa-user-plus', label: 'ข้อมูลผู้สมัคร' },
                { id: 'shirts', icon: 'fa-shirt', label: 'สรุปการสั่งจองเสื้อ' }
            ];

            return (
                <div className="min-h-screen flex bg-gray-50/50">
                    <aside className="w-64 bg-charcoal-900 text-white flex flex-col fixed h-full z-20 shadow-xl border-r border-charcoal-800">
                        <div className="p-6 border-b border-gray-800"><h2 className="text-xl font-bold text-orange-500 uppercase tracking-widest">Workspace</h2></div>
                        <nav className="flex-1 p-4 space-y-1 overflow-y-auto custom-scrollbar">
                            <p className="text-[10px] text-gray-500 font-bold uppercase tracking-widest px-3 mb-2 mt-2">Main Menu</p>
                            {menus.map(m => (
                                <button key={m.id} onClick={()=>setTab(m.id)} className={`w-full flex items-center gap-3 text-left px-4 py-3 rounded-xl text-sm font-medium transition-colors ${tab===m.id ? 'bg-gradient-to-r from-orange-500 to-orange-600 text-white shadow-md' : 'text-gray-400 hover:text-white hover:bg-white/5 border border-transparent'}`}><i className={`fa-solid ${m.icon} w-5 text-center opacity-80`}></i> {m.label}</button>
                            ))}
                        </nav>
                        <div className="p-4 border-t border-gray-800 space-y-3">
                            <p className="text-[10px] text-gray-500 font-bold uppercase tracking-widest px-2">System Status</p>
                            <button onClick={()=>toggleStatus('sys_main', null, sysConfig.main)} className={`w-full px-4 py-3 rounded-xl text-sm font-medium border flex justify-between items-center transition-colors ${sysConfig.main==='open' ? 'bg-emerald-900/30 text-emerald-500 border-emerald-800/50 hover:bg-emerald-900/50' : 'bg-black/50 text-gray-500 border-gray-800 hover:bg-gray-800'}`}>ระบบหลัก <i className={`fa-solid ${sysConfig.main==='open'?'fa-toggle-on':'fa-toggle-off'} text-xl`}></i></button>
                            <button onClick={goHome} className="w-full text-center py-2 text-xs font-bold text-gray-400 hover:text-white uppercase tracking-widest transition-colors mt-2"><i className="fa-solid fa-arrow-left mr-2"></i> ออกระบบ</button>
                        </div>
                    </aside>

                    <main className="flex-1 ml-64 p-8 md:p-12 h-screen overflow-y-auto">
                        <div className="flex justify-between items-end mb-8 border-b border-orange-200/50 pb-6">
                            <div><p className="text-[10px] font-bold text-orange-500 uppercase tracking-widest mb-2 bg-orange-50 inline-block px-3 py-1 rounded-md">Admin Portal</p><h2 className="text-3xl font-bold text-charcoal-900 tracking-tight">{menus.find(m=>m.id===tab)?.label}</h2></div>
                            <button onClick={()=>reloadData(true)} className="px-5 py-2.5 bg-white rounded-xl shadow-sm border border-gray-200 text-xs font-bold hover:bg-orange-50 hover:text-orange-600 transition-colors flex items-center gap-2"><i className="fa-solid fa-rotate-right"></i>อัปเดตข้อมูล</button>
                        </div>

                        {tab === 'overview' && (
                            <div className="grid grid-cols-2 lg:grid-cols-4 gap-6 mb-8">
                                {[ 
                                    { l:'กิจกรรมเปิดรับ', v:db.acts.length, i:'fa-qrcode', c:'orange' }, 
                                    { l:'ยอดเช็คชื่อรวม', v:db.checks.length, i:'fa-user-check', c:'emerald' }, 
                                    { l:'ประกาศรับสมัคร', v:db.recs.length, i:'fa-bullhorn', c:'purple' }, 
                                    { l:'ยอดจองเสื้อ', v:db.orders.length, i:'fa-shirt', c:'rose' } 
                                ].map((s,i)=>(
                                    <div key={i} className="bg-white p-6 rounded-2xl shadow-sm border border-gray-100 flex items-center gap-5 hover:-translate-y-1 transition-transform">
                                        <div className={`w-14 h-14 bg-${s.c}-50 text-${s.c}-500 rounded-xl flex items-center justify-center text-2xl border border-${s.c}-100`}><i className={`fa-solid ${s.i}`}></i></div>
                                        <div><p className="text-xs text-gray-500 font-bold uppercase tracking-widest mb-1">{s.l}</p><h3 className="text-3xl font-black text-charcoal-900">{s.v}</h3></div>
                                    </div>
                                ))}
                            </div>
                        )}

                        {tab === 'acts' && (
                            <div className="space-y-6">
                                <div className="bg-white p-6 rounded-2xl shadow-sm border border-gray-100 flex flex-col sm:flex-row justify-between sm:items-center gap-4">
                                    <div><h3 className="font-bold text-charcoal-900"><i className="fa-solid fa-plus-circle text-orange-500 mr-2"></i>สร้างกิจกรรมใหม่</h3><p className="text-xs text-gray-500 mt-1">เพิ่มกิจกรรมเพื่อให้นักศึกษาเช็คชื่อ</p></div>
                                    <form className="flex flex-1 sm:ml-6 gap-3" onSubmit={e=>{ e.preventDefault(); Swal.fire({title:'บันทึก...', didOpen:()=>Swal.showLoading()}); runGAS('createActivity', {name:e.target.n.value, date:e.target.d.value, location:e.target.l.value}).then(()=>{Swal.fire('สำเร็จ','','success'); e.target.reset(); reloadData(true);}).catch(err=>Swal.fire('Error',err.message,'error')); }}>
                                        <input type="text" name="n" placeholder="ชื่อกิจกรรม" required className="luxury-input py-2 text-sm flex-1" />
                                        <input type="date" name="d" required className="luxury-input py-2 text-sm w-32" />
                                        <input type="text" name="l" placeholder="สถานที่" required className="luxury-input py-2 text-sm flex-1" />
                                        <button type="submit" className="btn-gradient px-4 rounded-xl text-xs"><i className="fa-solid fa-save"></i></button>
                                    </form>
                                </div>
                                <DataTable 
                                    data={db.acts} columns={['ActivityID','Name','Date','Location','Status']} excelHeaders={['รหัสกิจกรรม','ชื่อกิจกรรม','วันที่','สถานที่','สถานะ']} exportName="Activities.xlsx"
                                    filterKey="Status" searchKeys={['Name','Location']}
                                    renderRow={(row, i) => (
                                        <tr key={i} className="hover:bg-gray-50 transition-colors">
                                            <td className="px-6 py-4"><span className="text-[10px] bg-gray-100 px-2 py-1 rounded text-gray-500 font-bold border border-gray-200">{row.ActivityID}</span></td>
                                            <td className="px-6 py-4 font-bold text-charcoal-900">{row.Name}</td>
                                            <td className="px-6 py-4 text-gray-500 text-xs"><i className="fa-regular fa-calendar text-orange-400 mr-1"></i>{row.Date}</td>
                                            <td className="px-6 py-4 text-gray-500 text-xs"><i className="fa-solid fa-location-dot text-orange-400 mr-1"></i>{row.Location}</td>
                                            <td className="px-6 py-4 text-center"><StatusBadge status={row.Status} /></td>
                                            <td className="px-6 py-4 text-center"><button onClick={()=>toggleStatus('act', row.ActivityID, row.Status)} className={`text-3xl transition-transform hover:scale-110 ${String(row.Status).toLowerCase()==='open'?'text-emerald-500':'text-gray-300'}`}><i className={`fa-solid ${String(row.Status).toLowerCase()==='open'?'fa-toggle-on':'fa-toggle-off'}`}></i></button></td>
                                        </tr>
                                    )}
                                />
                            </div>
                        )}

                        {tab === 'checks' && (
                            <DataTable 
                                data={db.checks.slice().reverse()} columns={['Timestamp','StudentID','Name','Major','IDCard','ActivityName']} excelHeaders={['วัน/เวลา','รหัสนักศึกษา','ชื่อ-สกุล','สาขาวิชา','เลข ปชช.','กิจกรรม']} exportName="CheckIns.xlsx"
                                filterKey="ActivityID" filterOptions={db.acts.map(a=>({val:a.ActivityID, label:a.Name}))} searchKeys={['StudentID','Name','Major']}
                                renderRow={(row, i) => { const d = formatTHDate(getVal(row,['timestamp'])); return (
                                    <tr key={i} className="hover:bg-orange-50/30 transition-colors text-xs">
                                        <td className="px-6 py-4 text-orange-600/80 font-medium">{d.short}</td>
                                        <td className="px-6 py-4"><span className="block font-bold text-sm text-charcoal-900">{getVal(row,['studentid','รหัส'])}</span><span className="text-gray-500">{getVal(row,['name','ชื่อ'])}</span></td>
                                        <td className="px-6 py-4 text-gray-600">{getVal(row,['major','สาขา'])}</td>
                                        <td className="px-6 py-4 text-gray-400">{getVal(row,['idcard','บัตร'])}</td>
                                        <td className="px-6 py-4 font-bold text-orange-600 truncate max-w-[200px]">{getVal(row,['activityname','กิจกรรม'])}</td>
                                    </tr>
                                )}}
                            />
                        )}

                        {tab === 'evals' && (
                            <div className="bg-white rounded-2xl shadow-sm border border-gray-100 p-8">
                                <div className="flex flex-col sm:flex-row justify-between items-end gap-4 mb-8">
                                    <div className="w-full max-w-sm"><label className="block text-[10px] font-bold text-gray-500 uppercase tracking-widest mb-2"><i className="fa-solid fa-chart-bar text-orange-400 mr-1"></i> เลือกกิจกรรมเพื่อวิเคราะห์</label><select className="luxury-input text-sm py-3" value={spssActId} onChange={e=>setSpssActId(e.target.value)}><option value="">-- เลือกกิจกรรม --</option>{db.acts.map(a=><option key={a.ActivityID} value={a.ActivityID}>{a.Name}</option>)}</select></div>
                                    <div className="flex gap-2">
                                        <button onClick={()=>{ const e = db.evals.filter(x=>getVal(x,['activityname'])===db.acts.find(a=>a.ActivityID===spssActId)?.Name); if(!e.length) return Swal.fire('Error','ไม่มีข้อมูล','warning'); exportCSV(e,'Evals.csv',Object.keys(e[0])); }} className="btn-gradient px-4 py-3 rounded-xl text-xs"><i className="fa-solid fa-file-csv mr-2"></i> โหลด CSV</button>
                                    </div>
                                </div>
                                <div id="spss-ex" className="bg-gray-50 p-6 rounded-xl border border-gray-200 text-center text-gray-500">
                                    <i className="fa-solid fa-flask text-4xl mb-4 text-gray-300"></i><p className="text-sm font-medium">ส่วนวิเคราะห์ SPSS แบบละเอียด (Word Export Format)<br/>เลือกกิจกรรมด้านบนเพื่อประมวลผลสถิติ x̄ และ S.D.</p>
                                </div>
                            </div>
                        )}

                        {tab === 'recs' && (
                            <div className="space-y-6">
                                <div className="bg-white p-6 rounded-2xl shadow-sm border border-gray-100 flex flex-col sm:flex-row justify-between sm:items-center gap-4">
                                    <div><h3 className="font-bold text-charcoal-900"><i className="fa-solid fa-gear text-purple-500 mr-2"></i>ระบบรับสมัคร (Master)</h3><p className="text-xs text-gray-500 mt-1">เปิด/ปิด การเข้าถึงแท็บรับสมัครทั้งหมด</p></div>
                                    <button onClick={()=>toggleStatus('sys_recruit', null, sysConfig.recruit)} className={`px-5 py-3 rounded-xl text-xs font-bold uppercase tracking-widest border transition-colors ${sysConfig.recruit==='open'?'bg-purple-50 text-purple-600 border-purple-200':'bg-gray-50 text-gray-500 border-gray-200'}`}>{sysConfig.recruit==='open'?'เปิดใช้งาน':'ปิดระบบแล้ว'} <i className={`fa-solid ${sysConfig.recruit==='open'?'fa-toggle-on':'fa-toggle-off'} ml-2 text-lg align-middle`}></i></button>
                                </div>
                                <div className="bg-white p-6 rounded-2xl shadow-sm border border-gray-100 flex flex-col sm:flex-row justify-between sm:items-center gap-4">
                                    <form className="flex flex-1 gap-3 w-full" onSubmit={e=>{ e.preventDefault(); Swal.fire({title:'บันทึก...', didOpen:()=>Swal.showLoading()}); runGAS('createRecruit', {name:e.target.n.value, date:e.target.d.value, location:e.target.l.value, attachment:e.target.a.value}).then(()=>{Swal.fire('สำเร็จ','','success'); e.target.reset(); reloadData(true);}).catch(err=>Swal.fire('Error',err.message,'error')); }}>
                                        <input type="text" name="n" placeholder="ชื่อโครงการ" required className="luxury-input py-2 text-sm flex-1" />
                                        <input type="date" name="d" required className="luxury-input py-2 text-sm w-32" />
                                        <input type="text" name="l" placeholder="สถานที่" required className="luxury-input py-2 text-sm w-32" />
                                        <input type="text" name="a" placeholder="ลิงก์แนบ(ถ้ามี)" className="luxury-input py-2 text-sm flex-1" />
                                        <button type="submit" className="bg-gradient-to-r from-purple-500 to-purple-600 text-white font-bold px-4 rounded-xl text-xs"><i className="fa-solid fa-save"></i></button>
                                    </form>
                                </div>
                                <DataTable 
                                    data={db.recs} columns={['RecruitID','Name','Date','Location','Status']} excelHeaders={['รหัส','ชื่อ','วันที่','สถานที่','สถานะ']} exportName="Recruitments.xlsx"
                                    filterKey="Status" searchKeys={['Name','Location']}
                                    renderRow={(row, i) => (
                                        <tr key={i} className="hover:bg-gray-50 transition-colors">
                                            <td className="px-6 py-4"><span className="text-[10px] bg-purple-50 text-purple-700 font-bold px-2 py-1 rounded border border-purple-100">{row.RecruitID}</span></td>
                                            <td className="px-6 py-4 font-bold text-charcoal-900">{row.Name}</td>
                                            <td className="px-6 py-4 text-gray-500 text-xs">{row.Date}</td>
                                            <td className="px-6 py-4 text-gray-500 text-xs">{row.Location}</td>
                                            <td className="px-6 py-4 text-center"><StatusBadge status={row.Status} openLabel="เปิด" closedLabel="ปิด" /></td>
                                            <td className="px-6 py-4 text-center"><button onClick={()=>toggleStatus('rec', row.RecruitID, row.Status)} className={`text-3xl transition-transform hover:scale-110 ${String(row.Status).toLowerCase()==='open'?'text-purple-500':'text-gray-300'}`}><i className={`fa-solid ${String(row.Status).toLowerCase()==='open'?'fa-toggle-on':'fa-toggle-off'}`}></i></button></td>
                                        </tr>
                                    )}
                                />
                            </div>
                        )}

                        {tab === 'regis' && (
                            <DataTable 
                                data={db.regis.slice().reverse()} columns={['Timestamp','StudentID','Name','Major','IDCard','RecruitName']} excelHeaders={['วัน/เวลา','รหัสนักศึกษา','ชื่อ-สกุล','สาขาวิชา','เลข ปชช.','โครงการ']} exportName="Registrations.xlsx"
                                filterKey="RecruitID" filterOptions={db.recs.map(a=>({val:a.RecruitID, label:a.Name}))} searchKeys={['StudentID','Name','Major']}
                                renderRow={(row, i) => { const d = formatTHDate(getVal(row,['timestamp'])); return (
                                    <tr key={i} className="hover:bg-purple-50/30 transition-colors text-xs">
                                        <td className="px-6 py-4 text-purple-600/80 font-medium">{d.short}</td>
                                        <td className="px-6 py-4"><span className="block font-bold text-sm text-charcoal-900">{getVal(row,['studentid','รหัส'])}</span><span className="text-gray-500">{getVal(row,['name','ชื่อ'])}</span></td>
                                        <td className="px-6 py-4 text-gray-600">{getVal(row,['major','สาขา'])}</td>
                                        <td className="px-6 py-4 text-gray-400">{getVal(row,['idcard','บัตร'])}</td>
                                        <td className="px-6 py-4 font-bold text-purple-600 truncate max-w-[200px]">{getVal(row,['recruitname','โครงการ'])}</td>
                                    </tr>
                                )}}
                            />
                        )}

                        {tab === 'shirts' && (
                            <div className="space-y-6">
                                <div className="bg-white p-6 rounded-2xl shadow-sm border border-gray-100 flex flex-col sm:flex-row justify-between sm:items-center gap-4">
                                    <div><h3 className="font-bold text-charcoal-900"><i className="fa-solid fa-gear text-rose-500 mr-2"></i>ระบบจองเสื้อ (Master)</h3><p className="text-xs text-gray-500 mt-1">เปิด/ปิด การเข้าถึงฟอร์มจองเสื้อ</p></div>
                                    <button onClick={()=>toggleStatus('sys_shirt', null, sysConfig.shirt)} className={`px-5 py-3 rounded-xl text-xs font-bold uppercase tracking-widest border transition-colors ${sysConfig.shirt==='open'?'bg-rose-50 text-rose-600 border-rose-200':'bg-gray-50 text-gray-500 border-gray-200'}`}>{sysConfig.shirt==='open'?'เปิดใช้งาน':'ปิดระบบแล้ว'} <i className={`fa-solid ${sysConfig.shirt==='open'?'fa-toggle-on':'fa-toggle-off'} ml-2 text-lg align-middle`}></i></button>
                                </div>
                                <div className="grid grid-cols-3 gap-4">
                                    <div className="bg-white p-5 rounded-2xl border shadow-sm flex items-center justify-between"><span className="text-xs font-bold text-gray-500">ยอดบิลทั้งหมด</span><span className="text-2xl font-black text-rose-600">{db.orders.length}</span></div>
                                    <div className="bg-white p-5 rounded-2xl border shadow-sm flex items-center justify-between"><span className="text-xs font-bold text-gray-500">ยอดเงินรวม</span><span className="text-2xl font-black text-emerald-600">฿{db.orders.reduce((s,o)=>s+Number(getVal(o,['totalprice','ยอดรวม'])||0),0).toLocaleString()}</span></div>
                                    <div className="bg-white p-5 rounded-2xl border shadow-sm flex items-center justify-between"><span className="text-xs font-bold text-gray-500">รอตรวจสอบ</span><span className="text-2xl font-black text-amber-500">{db.orders.filter(o=>String(getVal(o,['status'])).toLowerCase()==='received').length}</span></div>
                                </div>
                                <DataTable 
                                    data={db.orders.slice().reverse()} columns={['Timestamp','StudentID','Name','Major','PoloSize','PoloQty','TshirtSize','TshirtQty','TotalPrice','Status']} excelHeaders={['เวลา','รหัส','ชื่อ','สาขา','ไซส์โปโล','จำนวนโปโล','ไซส์ยืด','จำนวนยืด','ยอดรวม','สถานะ']} exportName="ShirtOrders.xlsx"
                                    filterKey="Status" filterOptions={[{val:'received',label:'รอตรวจสอบ'},{val:'paid',label:'ชำระแล้ว'}]} searchKeys={['StudentID','Name','Major']}
                                    renderRow={(row, i) => {
                                        const std = getVal(row,['studentid','รหัส']); const stat = getVal(row,['status','สถานะ']); const slip = getVal(row,['slip']);
                                        return (
                                            <tr key={i} className="text-xs hover:bg-rose-50/30 transition-colors">
                                                <td className="px-6 py-4 text-gray-500">{formatTHDate(getVal(row,['timestamp'])).short}</td>
                                                <td className="px-6 py-4"><span className="block font-bold text-sm text-charcoal-900">{std}</span><span className="text-gray-500">{getVal(row,['name','ชื่อ'])}</span></td>
                                                <td className="px-6 py-4 text-center">{getVal(row,['polosize'])} <span className="text-gray-400 font-bold ml-1">x{getVal(row,['poloqty'])}</span></td>
                                                <td className="px-6 py-4 text-center">{getVal(row,['tshirtsize'])} <span className="text-gray-400 font-bold ml-1">x{getVal(row,['tshirtqty'])}</span></td>
                                                <td className="px-6 py-4 text-right font-bold text-rose-600 text-sm">฿{Number(getVal(row,['totalprice','ยอดรวม'])||0).toLocaleString()}</td>
                                                <td className="px-6 py-4 text-center">{slip && slip !== '-' ? <button onClick={()=>window.open(slip.includes('http')?slip:`https://drive.google.com/file/d/${slip}/view`,'_blank')} className="w-8 h-8 bg-emerald-50 text-emerald-600 rounded-lg hover:bg-emerald-500 hover:text-white"><i className="fa-solid fa-image"></i></button> : '-'}</td>
                                                <td className="px-6 py-4 text-center"><button onClick={()=>toggleStatus('order', std, stat)} className={`px-3 py-1.5 rounded-lg text-[10px] font-bold uppercase tracking-widest border transition-all ${stat==='received'?'bg-amber-50 text-amber-600 border-amber-200 hover:bg-amber-500 hover:text-white':'bg-emerald-50 text-emerald-600 border-emerald-200 hover:bg-emerald-500 hover:text-white'}`}>{stat==='received'?'รอตรวจสอบ':'ชำระแล้ว'}</button></td>
                                            </tr>
                                        )
                                    }}
                                />
                            </div>
                        )}
                    </main>
                </div>
            );
        }

        // ==========================================
        // 4. MAIN APP INITIALIZATION
        // ==========================================
        function App() {
            const [view, setView] = useState(() => sessionStorage.getItem('app_view') || 'home');
            const [purpose, setPurpose] = useState('activity');
            const [student, setStudent] = useState(null);
            
            const [db, setDb] = useState({ acts: [], recs: [], checks: [], orders: [], regis: [], evals: [] });
            const [sysConfig, setSysConfig] = useState({ main: 'open', recruit: 'open', shirt: 'open' });
            const [shirtConfig, setShirtConfig] = useState({ normal: 250, oversize: 380, header: 'สโมสรนักศึกษา', note: '', popupText: '', popupImg: '' });
            const [homePopup, setHomePopup] = useState({ img: '', status: 'closed' });
            
            const [histActs, setHistActs] = useState([]);
            const [histShirts, setHistShirts] = useState([]);
            const [selectedItem, setSelectedItem] = useState(null);
            const [isDarkMode, setIsDarkMode] = useState(() => localStorage.getItem('theme') === 'dark');

            // Form States
            const [surveyAnswers, setSurveyAnswers] = useState({});
            const [suggestion, setSuggestion] = useState('');
            const [poloGender, setPoloGender] = useState('ชาย');
            const [poloSize, setPoloSize] = useState('M');
            const [poloQty, setPoloQty] = useState(1);
            const [tshirtGender, setTshirtGender] = useState('ชาย');
            const [tshirtSize, setTshirtSize] = useState('M');
            const [tshirtQty, setTshirtQty] = useState(1);
            const [paymentMethod, setPaymentMethod] = useState('promptpay');
            const [slipImage, setSlipImage] = useState(null);
            const [receiptData, setReceiptData] = useState(null);
            const [isEditingOrder, setIsEditingOrder] = useState(false);

            useEffect(() => { 
                sessionStorage.setItem('app_view', view); 
                window.scrollTo(0,0);
            }, [view]);

            useEffect(() => {
                if (isDarkMode) { document.documentElement.classList.add('dark'); localStorage.setItem('theme', 'dark'); }
                else { document.documentElement.classList.remove('dark'); localStorage.setItem('theme', 'light'); }
            }, [isDarkMode]);

            const syncWithLocalCache = (acts, recs, config) => {
                try {
                    const cache = JSON.parse(localStorage.getItem('sys_overrides') || '{}');
                    const isFresh = (ts) => (Date.now() - ts) < 300000;
                    if(cache.SYS_MAIN && isFresh(cache.SYS_MAIN.ts)) config.main = cache.SYS_MAIN.val;
                    if(cache.SYS_RECRUIT && isFresh(cache.SYS_RECRUIT.ts)) config.recruit = cache.SYS_RECRUIT.val;
                    if(cache.SYS_SHIRT && isFresh(cache.SYS_SHIRT.ts)) config.shirt = cache.SYS_SHIRT.val;

                    acts.forEach(a => { if(cache[`ACT_${a.ActivityID}`] && isFresh(cache[`ACT_${a.ActivityID}`].ts)) a.Status = cache[`ACT_${a.ActivityID}`].val; });
                    recs.forEach(r => { if(cache[`REC_${r.RecruitID}`] && isFresh(cache[`REC_${r.RecruitID}`].ts)) r.Status = cache[`REC_${r.RecruitID}`].val; });
                } catch(e) {}
                return { acts, recs, config };
            };

            const toggleLocalCache = (key, val) => {
                try {
                    const cache = JSON.parse(localStorage.getItem('sys_overrides') || '{}');
                    cache[key] = { val, ts: Date.now() };
                    localStorage.setItem('sys_overrides', JSON.stringify(cache));
                } catch(e) {}
            };

            const loadData = useCallback(async (isAdmin = false) => {
                if(!isAdmin && window.hideLoader) Swal.fire({ title:'กำลังโหลด...', didOpen:()=>Swal.showLoading()});
                try {
                    let dActs = [], dRecs = [], dSets = [];
                    if (API_CONFIG.USE_FAST_CSV) {
                        try {
                            [dActs, dRecs, dSets] = await Promise.all([fetchCSV('Activities').catch(()=>[]), fetchCSV('Recruitments').catch(()=>[]), fetchCSV('Settings').catch(()=>[])]);
                        } catch(e) { console.warn("CSV Fallback"); }
                    }
                    if (dActs.length===0 && dSets.length===0) {
                        const bd = await runGAS('getAdminDashboardData').catch(()=>null);
                        if(bd) { dActs=bd.activities||[]; dRecs=bd.recruitments||[]; }
                    }

                    let sConf = { main: 'open', recruit: 'open', shirt: 'open' };
                    let pConf = { normal: 250, oversize: 380, header: 'สโมสรนักศึกษา', note: '', popupText: '', popupImg: '' };
                    let hp = { img: '', status: 'closed' };

                    const getS = (k, def) => { const r = dSets.find(x => String(Object.values(x)[0]).toLowerCase()===k.toLowerCase()); return r ? Object.values(r)[1] : def; };
                    const getS2 = (k, def) => { const r = dSets.find(x => String(Object.values(x)[0]).toLowerCase()===k.toLowerCase()); return r ? Object.values(r)[2] : def; };

                    if(dSets.length > 0) {
                        sConf = { main: getS('SystemStatus','open'), recruit: getS('RecruitStatus','open'), shirt: getS('ShirtStatus','open') };
                        pConf = { normal: Number(getS('ShirtPrice',250)), oversize: Number(getS2('ShirtPrice',380)), header: getS('ReceiptConfig',pConf.header), note: getS2('ReceiptConfig',pConf.note), popupText: getS('ShirtPopup',''), popupImg: getS2('ShirtPopup','') };
                        hp = { img: getS('HomePopup',''), status: getS2('HomePopup','closed') };
                    }

                    const synced = syncWithLocalCache(dActs, dRecs, sConf);
                    
                    setSysConfig(synced.config);
                    setShirtConfig(pConf);
                    setHomePopup(hp);

                    if(isAdmin) {
                        const [checks, orders, regis, evals] = await Promise.all([fetchCSV('CheckIns').catch(()=>[]), fetchCSV('ShirtOrders').catch(()=>[]), fetchCSV('Registrations').catch(()=>[]), fetchCSV('Evaluations').catch(()=>[])]);
                        setDb({ acts: synced.acts, recs: synced.recs, checks, orders, regis, evals });
                    } else {
                        setDb(p => ({...p, acts: synced.acts, recs: synced.recs}));
                    }

                    if(!isAdmin) Swal.close();
                    if(window.hideLoader) window.hideLoader();
                    
                    if(hp.status === 'open' && hp.img && !sessionStorage.getItem('home_popup_shown') && view === 'home') {
                        Swal.fire({ imageUrl: hp.img, imageAlt: 'Popup', showCloseButton: true, showConfirmButton: false, background: 'transparent', backdrop: 'rgba(0,0,0,0.6)', customClass: { image: 'rounded-2xl max-w-full max-h-[80vh] object-contain', popup: 'bg-transparent shadow-none' } }).then(() => sessionStorage.setItem('home_popup_shown', 'true'));
                    }

                } catch(e) {
                    if(!isAdmin) Swal.fire('Error', 'เชื่อมต่อฐานข้อมูลล้มเหลว', 'error');
                    if(window.hideLoader) window.hideLoader();
                }
            }, [view]);

            useEffect(() => { if(view !== 'admin_dashboard') loadData(); }, [view, loadData]);

            const goHome = () => { setStudent(null); setSelectedItem(null); setView('home'); };

            const handleSearch = async (e) => {
                e.preventDefault();
                const sid = e.target.studentId.value.trim().toLowerCase();
                if(!sid) return;
                Swal.fire({ title:'ตรวจสอบข้อมูล...', didOpen:()=>Swal.showLoading()});
                try {
                    let st = null;
                    if(sid === 'test' || sid === '12345') st = { StudentID: sid, Name: 'นศ.ทดสอบ', Major: 'สาขาทดสอบ', IDCard: '1111' };
                    else {
                        const stds = await fetchCSV('Students').catch(()=>[]);
                        st = stds.find(s => String(getVal(s,['studentid','รหัส'])).toLowerCase()===sid || String(getVal(s,['idcard','บัตร'])).toLowerCase()===sid);
                        if(!st) st = await runGAS('verifyStudent', sid).catch(()=>null);
                    }

                    if(st && (st.Name || getVal(st,['name','ชื่อ']))) {
                        const cSt = { StudentID: getVal(st,['studentid','รหัส'], 'StudentID')||sid, Name: getVal(st,['name','ชื่อ'],'Name'), Major: getVal(st,['major','สาขา'],'Major'), IDCard: getVal(st,['idcard','บัตร'],'IDCard') };
                        setStudent(cSt);
                        localStorage.setItem('last_sid', sid);

                        if(purpose === 'history') {
                            const chks = await fetchCSV('CheckIns').catch(()=>[]);
                            const ords = await fetchCSV('ShirtOrders').catch(()=>[]);
                            setHistActs(chks.filter(c => String(getVal(c,['studentid','รหัส'])).toLowerCase()===sid).reverse());
                            setHistShirts(ords.filter(o => String(getVal(o,['studentid','รหัส'])).toLowerCase()===sid).reverse());
                            Swal.close(); setView('history_result');
                        } 
                        else if(purpose === 'shirt') {
                            const ords = await fetchCSV('ShirtOrders').catch(()=>[]);
                            const existing = ords.find(o => String(getVal(o,['studentid','รหัส'])).toLowerCase()===sid);
                            Swal.close();
                            if(existing) { 
                                const tsRaw = getVal(existing, ['timestamp', 'เวลา']);
                                setReceiptData({ 
                                    student: cSt, 
                                    poloGender: getVal(existing, ['pologender', 'ทรงโปโล'], 'PoloGender') || 'ชาย', 
                                    poloSize: getVal(existing, ['polosize', 'ไซส์โปโล'], 'PoloSize'), 
                                    poloQty: Number(getVal(existing, ['poloqty', 'จำนวนโปโล'], 'PoloQty') || 1), 
                                    tshirtGender: getVal(existing, ['tshirtgender', 'ทรงเสื้อยืด'], 'TshirtGender') || 'ชาย', 
                                    tshirtSize: getVal(existing, ['tshirtsize', 'ไซส์เสื้อยืด'], 'TshirtSize'), 
                                    tshirtQty: Number(getVal(existing, ['tshirtqty', 'จำนวนเสื้อยืด'], 'TshirtQty') || 1), 
                                    grandTotal: Number(getVal(existing, ['totalprice', 'ยอดรวม'], 'TotalPrice') || 0), 
                                    paymentMethod: getVal(existing, ['paymentmethod', 'วิธีชำระ'], 'PaymentMethod') || 'cash', 
                                    orderId: 'ORD-' + (new Date(tsRaw).getTime() || Date.now()).toString().slice(-6), 
                                    date: formatTHDate(tsRaw).full, 
                                    status: getVal(existing, ['status', 'สถานะ'], 'Status') 
                                });
                                setView('receipt'); 
                            }
                            else { sysConfig.shirt === 'open' ? setView('shirt_form') : Swal.fire('ปิดจอง','ระบบปิดจองเสื้อแล้ว','warning').then(goHome); }
                        }
                        else {
                            Swal.close();
                            setView(purpose === 'recruit' ? 'select_recruit' : 'select_activity');
                        }
                    } else {
                        Swal.fire('ไม่พบข้อมูล', 'โปรดตรวจสอบรหัสนักศึกษา/บัตรประชาชนอีกครั้ง', 'error');
                    }
                } catch(e) { Swal.fire('Error', e.message, 'error'); }
            };

            const Navbar = () => (
                <div className="w-full bg-white/80 backdrop-blur-md sticky top-0 z-50 border-b border-gray-100">
                    <div className="max-w-6xl mx-auto px-6 py-4 flex justify-between items-center">
                        <div className="flex items-center gap-3 cursor-pointer" onClick={goHome}>
                            <div className="w-10 h-10 bg-gradient-to-br from-orange-400 to-orange-600 rounded-full flex items-center justify-center text-white shadow-md"><i className="fa-solid fa-gem"></i></div>
                            <h1 className="font-bold text-lg text-charcoal-900 hidden sm:block">DIGIT.CRRU</h1>
                        </div>
                        <div className="flex gap-3">
                            <button onClick={() => setIsDarkMode(!isDarkMode)} className="w-9 h-9 flex items-center justify-center rounded-xl bg-gray-100 text-gray-500 hover:text-orange-500 hover:bg-orange-50 transition-colors"><i className={`fa-solid ${isDarkMode ? 'fa-sun text-orange-500' : 'fa-moon'}`}></i></button>
                            <button onClick={() => setView(view.startsWith('admin') ? 'home' : 'admin_login')} className="text-xs font-bold text-gray-500 hover:text-orange-600 transition-colors uppercase tracking-widest px-4 py-2 border rounded-xl hover:border-orange-200 hover:bg-orange-50">
                                {view.startsWith('admin') ? 'ออกระบบ' : 'Staff Login'}
                            </button>
                        </div>
                    </div>
                </div>
            );

            const MobileTabBar = () => {
                if(view.startsWith('admin')) return null;
                const tabs = [
                    { id: 'home', icon: 'fa-house', label: 'หน้าแรก', onClick: goHome, activeCond: view === 'home', color: 'orange' },
                    { id: 'recruit', icon: 'fa-bullhorn', label: 'รับสมัคร', onClick: () => { if(sysConfig.main !== 'open') return Swal.fire({title:'ระบบปิด', icon:'info', confirmButtonColor: '#1a1a1a'}); setPurpose('recruit'); setView('search'); }, activeCond: view === 'select_recruit' || (view === 'search' && purpose === 'recruit'), color: 'purple' },
                    { id: 'activity', icon: 'fa-qrcode', label: 'เช็คชื่อ', onClick: () => { if(sysConfig.main !== 'open') return Swal.fire({title:'ระบบปิด', icon:'info', confirmButtonColor: '#1a1a1a'}); setPurpose('activity'); setView('search'); }, activeCond: view === 'select_activity' || view === 'survey' || (view === 'search' && purpose === 'activity'), color: 'orange' },
                    { id: 'shirt', icon: 'fa-shirt', label: 'จองเสื้อ', onClick: () => { setPurpose('shirt'); setView('search'); }, activeCond: view === 'shirt_form' || view === 'receipt' || (view === 'search' && purpose === 'shirt'), color: 'rose' },
                    { id: 'history', icon: 'fa-clock-rotate-left', label: 'ประวัติ', onClick: () => { setPurpose('history'); setView('history_search'); }, activeCond: view === 'history_search' || view === 'history_result' || (view === 'search' && purpose === 'history'), color: 'blue' }
                ];
                return (
                    <div className="md:hidden fixed bottom-0 left-0 w-full z-50 bg-white/90 backdrop-blur-md border-t border-gray-100 pb-safe shadow-lg">
                        <div className="flex justify-around items-center h-16">
                            {tabs.map((t, i) => (
                                <button key={i} onClick={t.onClick} className={`relative flex flex-col items-center justify-center w-full h-full space-y-1 transition-colors ${t.activeCond ? 'text-' + t.color + '-500' : 'text-gray-400'}`}>
                                    {t.activeCond && <div className={`absolute top-0 w-8 h-1 bg-${t.color}-500 rounded-b-full`}></div>}
                                    <i className={`fa-solid ${t.icon} text-lg ${t.activeCond ? 'mb-0.5 scale-110' : ''}`}></i>
                                    <span className="text-[9px] font-bold">{t.label}</span>
                                </button>
                            ))}
                        </div>
                    </div>
                );
            };

            if(view === 'admin_dashboard') return <AdminDashboard db={db} setDb={setDb} loadData={loadData} goHome={goHome} sysConfig={sysConfig} setSysConfig={setSysConfig} toggleCache={toggleLocalCache} reloadData={loadData} />;

            return (
                <div className="min-h-screen flex flex-col bg-gray-50/30 text-charcoal-900">
                    <Navbar />
                    
                    {view === 'home' && (
                        <div className="flex-grow flex flex-col items-center justify-center p-6 md:p-10">
                            <div className="text-center mb-10"><h2 className="text-sm font-bold text-orange-500 tracking-widest uppercase mb-2">Welcome</h2><h1 className="text-4xl font-bold text-charcoal-900 tracking-tight">ระบบบริการนักศึกษา</h1></div>
                            <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6 w-full max-w-6xl">
                                {[
                                    { p: 'recruit', i: 'fa-bullhorn', c: 'purple', t: 'ประกาศรับสมัคร', d: 'ดูประกาศและสมัครเข้าร่วม', sys: sysConfig.main, spec: sysConfig.recruit },
                                    { p: 'activity', i: 'fa-qrcode', c: 'orange', t: 'ลงทะเบียนกิจกรรม', d: 'เช็คชื่อและประเมิน', sys: sysConfig.main, spec: 'open' },
                                    { p: 'history', i: 'fa-clock-rotate-left', c: 'blue', t: 'ประวัติการเข้าร่วม', d: 'ดูประวัติกิจกรรม/จองเสื้อ', sys: 'open', spec: 'open' },
                                    { p: 'shirt', i: 'fa-shirt', c: 'rose', t: 'สั่งจองเสื้อคณะ', d: 'สั่งจองและพิมพ์ใบเสร็จ', sys: sysConfig.main, spec: sysConfig.shirt }
                                ].map((m, idx) => (
                                    <div key={idx} onClick={() => { if(m.sys !== 'open' || m.spec !== 'open') return Swal.fire('ระบบปิด','ฟังก์ชันนี้ปิดให้บริการชั่วคราว','info'); setPurpose(m.p); setView(m.p === 'history' ? 'history_search' : 'search'); }} className={`luxury-card p-6 flex flex-col cursor-pointer transition-all ${m.sys==='open'&&m.spec==='open' ? 'hover:-translate-y-1' : 'opacity-50 grayscale'}`}>
                                        <div className={`w-12 h-12 bg-${m.c}-50 text-${m.c}-500 rounded-xl flex items-center justify-center text-xl mb-4`}><i className={`fa-solid ${m.i}`}></i></div>
                                        <h3 className="font-bold text-gray-800 mb-1">{m.t}</h3><p className="text-xs text-gray-500">{m.d}</p>
                                    </div>
                                ))}
                            </div>
                        </div>
                    )}

                    {view === 'search' && (
                        <div className="flex-grow flex items-center justify-center p-6">
                            <div className="luxury-card w-full max-w-md p-8 relative">
                                <button onClick={goHome} className="absolute top-4 left-4 text-xs text-gray-400 hover:text-gray-800"><i className="fa-solid fa-arrow-left"></i> กลับ</button>
                                <div className="text-center mt-6 mb-6">
                                    <i className="fa-solid fa-id-card text-4xl text-orange-400 mb-3"></i>
                                    <h2 className="text-xl font-bold">ยืนยันตัวตน</h2><p className="text-xs text-gray-500 mt-1">กรอกรหัสนักศึกษา หรือ บัตรประชาชน</p>
                                </div>
                                <form onSubmit={handleSearch}>
                                    <input type="text" name="studentId" required className="luxury-input text-center text-lg font-bold tracking-wider mb-4" defaultValue={localStorage.getItem('last_sid')||''} placeholder="กรอกรหัส..." />
                                    <button type="submit" className="w-full btn-gradient py-3.5 rounded-xl font-bold tracking-widest uppercase text-sm shadow-md shadow-orange-500/20">ดำเนินการต่อ</button>
                                </form>
                            </div>
                        </div>
                    )}

                    {view === 'select_activity' && student && (
                        <div className="flex-grow p-6 max-w-3xl mx-auto w-full pt-10">
                            <div className="flex justify-between items-center mb-6">
                                <h2 className="text-xl font-bold flex items-center gap-3"><i className="fa-solid fa-qrcode text-orange-500"></i> เลือกกิจกรรมเช็คชื่อ</h2>
                                <button onClick={()=>setView('search')} className="text-xs px-3 py-1.5 bg-gray-100 rounded-md font-bold text-gray-600 hover:bg-gray-200">เปลี่ยนรหัส</button>
                            </div>
                            <div className="grid gap-4">
                                {db.acts.filter(a=>String(a.Status).toLowerCase()==='open').length === 0 ? <p className="text-center py-10 text-gray-400 bg-white rounded-2xl border">ไม่มีกิจกรรมเปิดรับ</p> : 
                                db.acts.filter(a=>String(a.Status).toLowerCase()==='open').map(a => (
                                    <div key={a.ActivityID} onClick={()=>{setSelectedItem(a); setView('survey');}} className="luxury-card p-5 flex justify-between items-center cursor-pointer hover:border-orange-300">
                                        <div><h3 className="font-bold text-gray-800">{a.Name}</h3><p className="text-xs text-gray-500 mt-1"><i className="fa-regular fa-clock text-orange-400 mr-1"></i> {a.Date} <span className="mx-2">|</span> <i className="fa-solid fa-location-dot text-orange-400 mr-1"></i> {a.Location}</p></div>
                                        <i className="fa-solid fa-chevron-right text-gray-300"></i>
                                    </div>
                                ))}
                            </div>
                        </div>
                    )}

                    {view === 'survey' && selectedItem && (
                        <div className="flex-grow flex flex-col items-center pt-6 p-4 pb-20">
                            <div className="luxury-card w-full max-w-3xl p-6 sm:p-10 border-t-4 border-t-orange-500">
                                <div className="mb-8 border-b pb-6">
                                    <button onClick={() => setView('select_activity')} className="text-gray-400 hover:text-orange-600 transition-colors text-sm mb-4"><i className="fa-solid fa-arrow-left mr-2"></i>ย้อนกลับ</button>
