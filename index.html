                const totalDemo = mCount + fCount || 1;
                const mPct = ((mCount / totalDemo) * 100).toFixed(2);
                const fPct = ((fCount / totalDemo) * 100).toFixed(2);
                
                const majorityGender = mCount >= fCount ? 'ชาย' : 'หญิง';
                const majorityCount = mCount >= fCount ? mCount : fCount;
                const majorityPct = mCount >= fCount ? mPct : fPct;
                const minorityGender = mCount >= fCount ? 'หญิง' : 'ชาย';
                const minorityCount = mCount >= fCount ? fCount : mCount;
                const minorityPct = mCount >= fCount ? fPct : mPct;

                const getMeaning = (m) => m >= 4.5 ? 'มากที่สุด' : m >= 3.5 ? 'มาก' : m >= 2.5 ? 'ปานกลาง' : m >= 1.5 ? 'น้อย' : 'น้อยที่สุด';
                const qStats = []; let overallIdx = 1;
                let allScoresForGrand = [];
                
                surveyData.forEach(cat => {
                    cat.questions.forEach(q => {
                        const hKey = ['Q1_1','Q1_2','Q1_3','Q1_4','Q2_1','Q2_2','Q2_3','Q2_4','Q3_1','Q3_2','Q3_3','Q3_4','Q3_5'][overallIdx - 1];
                        const scores = evals.map(e => {
                            let val = e[hKey];
                            if (val === undefined || val === null || val === '') val = e[`q${overallIdx}`];
                            return Number(val) || 0;
                        }).filter(s => s > 0);
                        
                        allScoresForGrand.push(...scores);

                        const n = scores.length; let mean = 0, sd = 0;
                        if(n > 0) { 
                            mean = scores.reduce((a,b)=>a+b, 0) / n; 
                            if(n > 1) sd = Math.sqrt(scores.reduce((a,b)=>a+Math.pow(b-mean, 2), 0) / (n - 1)); 
                        }
                        qStats.push({ no: overallIdx, text: q.text.split(' ').slice(1).join(' '), n, mean, sd });
                        overallIdx++;
                    });
                });
                
                let grandMean = 0, grandSd = 0;
                if (allScoresForGrand.length > 0) {

                    if (allScoresForGrand.length > 1) {
                        grandSd = Math.sqrt(allScoresForGrand.reduce((a,b)=>a+Math.pow(b-grandMean, 2), 0) / (allScoresForGrand.length - 1));
                    }
                }

                const sortedQStats = [...qStats].sort((a,b) => b.mean - a.mean);
                const top1 = sortedQStats[0] || {text: '-', mean: 0};

                const top3 = sortedQStats[2] || {text: '-', mean: 0};

                                </tbody>

                                            <span className="font-semibold text-orange-600">แนวทางการนำไปใช้ประโยชน์:</span> ข้อเสนอแนะดังกล่าวสะท้อนให้เห็นถึงความต้องการและมุมมองของผู้เข้าร่วมกิจกรรม 
                                            ซึ่งเป็นข้อมูลที่เป็นประโยชน์อย่างยิ่งต่อคณะผู้จัดทำโครงการ ในการนำไปใช้วิเคราะห์และเป็นแนวทางสำหรับการวางแผน ปรับปรุง 
                                            และพัฒนารูปแบบการจัดกิจกรรมในครั้งต่อไปให้มีประสิทธิภาพ และตอบสนองต่อความมุ่งหวังของผู้เข้าร่วมโครงการได้อย่างดียิ่งขึ้น
                                        </p>
                                    </>
                                ) : (
                                    <p className="indent-8 text-gray-500">
                                        จากการเก็บรวบรวมข้อมูลเชิงคุณภาพในส่วนของข้อเสนอแนะเพิ่มเติม พบว่า <span className="font-semibold">ไม่มีผู้เข้าร่วมกิจกรรมท่านใดให้ข้อเสนอแนะเพิ่มเติม</span> 
                                        แต่อย่างไรก็ตาม คณะผู้จัดทำโครงการจะนำผลการประเมินเชิงปริมาณจากตารางข้างต้น ไปวิเคราะห์และใช้เป็นแนวทางในการวางแผนและพัฒนาการจัดกิจกรรมในลำดับต่อไป
                                    </p>
                                )}
                            </div>
                        </div>

                    </div>
                );
            };

            const indexOfLastItem = currentPage * itemsPerPage;
            const indexOfFirstItem = indexOfLastItem - itemsPerPage;
            const currentCheckins = sortedCheckins.slice(indexOfFirstItem, indexOfLastItem);
            const totalPages = Math.ceil(sortedCheckins.length / itemsPerPage) || 1;

            const currentShirtOrders = sortedShirtOrders.slice((shirtOrderPage - 1) * shirtItemsPerPage, shirtOrderPage * shirtItemsPerPage);

                <div className="min-h-screen bg-[#fffcf9] dark:bg-[#121212] flex flex-col md:flex-row transition-colors">

                        <nav className="flex-1 px-4 py-6 space-y-1">

                                );

                                <button onClick={toggleSystem} className={`w-full flex items-center justify-between px-4 py-3 rounded-lg text-sm transition-all ${systemOpen ? 'text-white bg-green-900/30 hover:bg-green-900/50 border border-green-800' : 'text-gray-400 bg-black/30 border border-gray-800'}`}>

                                </button>
                            </div>
                        </nav>
                        <div className="p-4 border-t border-gray-800">

                        </div>
                    </aside>

                    <main className="flex-1 p-6 md:p-12 overflow-y-auto bg-gradient-to-br from-[#fffcf9] to-[#ffedd5] dark:from-[#1c1512] dark:to-[#120c0a]">

                            <h2 className="text-3xl font-light text-charcoal-900 tracking-tight capitalize">

                                {activeTab === 'activities' && 'การจัดการกิจกรรม (Activities)'}
                                {activeTab === 'summary' && 'ยอดเช็คชื่อ (Check-ins)'}
                                {activeTab === 'spss' && 'รายงานผลการประเมิน (SPSS)'}
                                {activeTab === 'shirt_summary' && 'สรุปการสั่งจองเสื้อ (Orders)'}
                            </h2>
                            <button onClick={reloadData} className="text-xs font-medium text-orange-500 hover:text-orange-700 tracking-widest uppercase transition-colors bg-white/50 px-3 py-1.5 rounded-lg border border-orange-100 shadow-sm"><i className="fa-solid fa-rotate-right mr-1"></i> ซิงค์ข้อมูล</button>
                        </div>

                        {activeTab === 'overview' && (
                            <div>
                                <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6 mb-8">

                                    </div>
                                    <div className="bg-white p-6 rounded-2xl shadow-sm border border-orange-100/50 flex items-center space-x-4 transition-transform hover:scale-[1.02]">

                                    </div>
                                    <div className="bg-white p-6 rounded-2xl shadow-sm border border-orange-100/50 flex items-center space-x-4 transition-transform hover:scale-[1.02]">

                                        </div>
                                    </div>
                                    <div onClick={() => { setSelectedActivityForSpss(''); setActiveTab('spss'); }} className="cursor-pointer group bg-white/80 backdrop-blur p-8 border border-orange-100/50 rounded-2xl shadow-sm transition-all hover:shadow-xl hover:shadow-orange-500/10 hover:-translate-y-1 relative overflow-hidden">

                                            <div>
                                                <p className="text-xs text-orange-500 font-semibold uppercase tracking-widest mb-1">แบบประเมินรวม</p>
                                                <p className="text-4xl font-light text-charcoal-900">{(data?.evaluations || []).length}</p>
                                            </div>
                                            <div className="w-12 h-12 bg-orange-100 text-orange-600 rounded-xl flex items-center justify-center text-xl shadow-sm group-hover:bg-gradient-to-br group-hover:from-orange-400 group-hover:to-orange-600 group-hover:text-white transition-colors"><i className="fa-solid fa-star"></i></div>
                                        </div>
                                    </div>
                                </div>

                                <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center mb-6 gap-4">
                                    <h3 className="text-sm font-medium text-charcoal-900 uppercase tracking-widest pl-1 border-l-2 border-orange-500">ยอดผู้เข้าร่วมแยกตามกิจกรรม</h3>
                                    <div className="relative w-full sm:max-w-xs">
                                        <i className="fa-solid fa-search absolute left-3 top-1/2 -translate-y-1/2 text-gray-400"></i>
                                        <input 
                                            type="text" 
                                            placeholder="ค้นหาชื่อกิจกรรม, สถานที่..." 
                                            value={searchOverviewActTerm} 
                                            onChange={(e) => setSearchOverviewActTerm(e.target.value)} 
                                            className="w-full pl-10 pr-4 py-2.5 border border-gray-200 rounded-xl text-sm bg-white outline-none focus:border-orange-500 focus:ring-2 focus:ring-orange-500/10 transition-all shadow-sm" 
                                        />
                                    </div>
                                </div>

                                <div className="flex flex-col space-y-4">
                                    {(() => {
                                        const actsPerPage = 5;
                                        const totalActPages = Math.ceil(filteredOverviewActivities.length / actsPerPage) || 1;
                                        const currentActs = filteredOverviewActivities.slice((overviewActivityPage - 1) * actsPerPage, overviewActivityPage * actsPerPage);
                                        
                                        if (filteredOverviewActivities.length === 0) {
                                            return (
                                                <div className="text-center py-12 bg-white rounded-2xl border border-dashed border-gray-200">

                                                    <p className="text-gray-400 font-medium">ไม่พบกิจกรรมที่คุณค้นหา</p>
                                                </div>
                                            );
                                        }

                                        return (
                                            <>
                                                {currentActs.map(act => {
                                                    const checkinCount = checkinCountByActivity[String(act.ActivityID).trim()] || 0;
                                                    
                                                    let dateObj = new Date(act.Date);
                                                    if(isNaN(dateObj)) dateObj = new Date();
                                                    const monthStr = dateObj.toLocaleDateString('th-TH', { month: 'short' });
                                                    const dateNum = dateObj.getDate();

                                                    return (
                                                        <div key={act.ActivityID} 
                                                             onClick={() => { setSelectedActivityForSummary(act.ActivityID); setActiveTab('summary'); }}

                                                            <div className={`absolute left-0 top-0 bottom-0 w-1.5 transition-colors duration-300 ${act.Status === 'open' ? 'bg-emerald-400 group-hover:bg-emerald-500' : 'bg-gray-300'}`}></div>

                                                            <div className="flex items-center gap-5 md:gap-6 pl-2 md:pl-4 flex-grow w-full md:w-auto">
                                                                <div className="flex-shrink-0 w-14 h-14 rounded-xl flex flex-col items-center justify-center bg-gray-50 border border-gray-100 group-hover:bg-orange-50 group-hover:border-orange-200 transition-colors">
                                                                    <span className="text-[10px] font-bold text-gray-400 group-hover:text-orange-400 uppercase tracking-widest leading-none mb-1">{monthStr}</span>
                                                                    <span className="text-xl font-extrabold text-charcoal-900 group-hover:text-orange-600 leading-none">{dateNum}</span>

                                                                        <i className="fa-solid fa-location-dot text-orange-400/70 w-3 text-center"></i>

                                                                <div className="text-left md:text-right">
                                                                    <p className="text-[10px] font-semibold text-slate-400 uppercase tracking-widest mb-1">ยอดผู้เข้าร่วม</p>
                                                                    <div className="flex items-baseline gap-1.5 md:justify-end">
                                                                        <span className="text-3xl md:text-4xl font-black text-slate-800 group-hover:text-orange-600 transition-colors tracking-tight leading-none">{checkinCount}</span>
                                                                        <span className="text-xs font-medium text-slate-500">คน</span>
                                                                    </div>
                                                                </div>
                                                                <div className="w-10 h-10 rounded-full bg-slate-50 border border-slate-100 flex items-center justify-center text-slate-400 group-hover:bg-orange-500 group-hover:border-orange-500 group-hover:text-white group-hover:shadow-md group-hover:shadow-orange-500/30 transition-all duration-300 flex-shrink-0">
                                                                    <i className="fa-solid fa-arrow-right -rotate-45 group-hover:rotate-0 transition-transform duration-300 text-sm"></i>
                                                                </div>
                                                            </div>
                                                        </div>
                                                    );
                                                })}
                                                {totalActPages > 1 && (
                                                    <div className="flex justify-between items-center text-sm bg-white px-4 py-3 rounded-2xl border border-gray-100 mt-2 shadow-sm">
                                                        <button disabled={overviewActivityPage===1} onClick={()=>setOverviewActivityPage(prev=>Math.max(1,prev-1))} className={`text-xs uppercase tracking-widest font-bold px-3 py-1.5 rounded-lg transition-colors ${overviewActivityPage===1?'text-gray-300 cursor-not-allowed':'text-orange-500 hover:bg-orange-50'}`}>ก่อนหน้า</button>
                                                        <span className="text-gray-400 font-medium text-xs bg-gray-50 px-3 py-1.5 rounded-lg">หน้าที่ {overviewActivityPage} จาก {totalActPages}</span>
                                                        <button disabled={overviewActivityPage===totalActPages} onClick={()=>setOverviewActivityPage(prev=>Math.min(totalActPages,prev+1))} className={`text-xs uppercase tracking-widest font-bold px-3 py-1.5 rounded-lg transition-colors ${overviewActivityPage===totalActPages?'text-gray-300 cursor-not-allowed':'text-orange-500 hover:bg-orange-50'}`}>ถัดไป</button>
                                                    </div>

                                        );

                                </div>
                            </div>
                        )}

                        {activeTab === 'activities' && (
                            <div className="grid lg:grid-cols-3 gap-8">

                                    </h3>

                                        <div className="relative">
                                            <i className="fa-solid fa-heading absolute left-4 top-1/2 -translate-y-1/2 text-orange-300"></i>
