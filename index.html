<body class="selection:bg-orange-500 selection:text-white">

    <!-- 🚀 หน้าต่างโหลดจะแสดงบังหน้าจอขาวตอนที่เบราว์เซอร์กำลังแปลไฟล์ -->

    <!-- 🚀 หากเกิดข้อผิดพลาดรุนแรงในการโหลด React ระบบจะบังคับซ่อน Loader ใน 8 วินาทีเพื่อไม่ให้ค้างถาวร -->
    <script>
        setTimeout(() => {

                loader.style.opacity = '0';
                setTimeout(() => { loader.style.display = 'none'; }, 300);

    </script>

    <div id="root"></div>

    <script type="text/babel">
        // เพิ่ม useMemo เพื่อใช้จดจำข้อมูลและลดการประมวลผลซ้ำซ้อน
        const { useState, useEffect, useMemo } = React;

        const API_CONFIG = {
            USE_FAST_CSV: true,
            SHEET_ID: "1KLJNWUUIj1r6eqCZnaF-F6nA2FQg7pvOHMk0PyDCyAc", 
            WEB_APP_URL: "https://script.google.com/macros/s/AKfycbz07BB-ibm51q9SC2ZnVVP-FyxwF0jTqPlCg9QZ-TN4d1zqvReQjEU-3Qv1Q27cjgq5zw/exec", 
            getCSVUrl: function(sheetName) {
                // 🚀 เปลี่ยน headers=0 เพื่อบังคับไม่ให้ Google Sheets เดาและยุบรวมข้อมูลแถวแรก
                return `https://docs.google.com/spreadsheets/d/${this.SHEET_ID}/gviz/tq?tqx=out:csv&headers=0&sheet=${sheetName}&_=${new Date().getTime()}`;
            }
        };

        const isFastCSVReady = () => API_CONFIG.USE_FAST_CSV && API_CONFIG.SHEET_ID && !API_CONFIG.SHEET_ID.includes('ใส่_SHEET_ID');

        // 🚀 เขียนระบบแยกข้อมูลดิบใหม่ ป้องกันข้อมูลลำดับที่ 1 หาย
        const fetchFastCSV = (sheetName) => {
            return new Promise((resolve, reject) => {
                if(!isFastCSVReady()) return reject(new Error("CSV Mode Disabled"));
                Papa.parse(API_CONFIG.getCSVUrl(sheetName), {
                    download: true, 
                    header: false, // ปิดโหมด auto-header 
                    skipEmptyLines: true,
                    complete: (results) => {
                        const raw = results.data;
                        if (!raw || raw.length === 0) return resolve([]);
                        
                        // เช็คว่าไฟล์ติดสถานะ HTML (แชร์ไม่สาธารณะ) หรือไม่
                        const firstCell = String(raw[0][0] || '').toLowerCase();
                        if (firstCell.includes('<!doctype') || firstCell.includes('<html')) {
                            return reject(new Error("Permission Denied: ไม่สามารถโหลดข้อมูลได้ กรุณาตั้งค่าแชร์ไฟล์ Google Sheets เป็น 'ทุกคนที่มีลิงก์ (Anyone with the link)'"));
                        }

                        if (raw.length < 2) return resolve([]); // มีแค่หัวตาราง

                        // ดึงหัวตารางจากบรรทัดที่ 1 (และกำจัดอักขระพิเศษ BOM)
                        const headers = raw[0].map(h => String(h).trim().replace(/^\uFEFF/, ''));
                        const formattedData = [];

                        // วนลูปข้อมูลตั้งแต่บรรทัดที่ 2 (รับรองว่าข้อมูลคนที่ 1 ไม่โดนกลืนแน่นอน)
                        for (let i = 1; i < raw.length; i++) {
                            const row = raw[i];
                            const obj = {};
                            for (let j = 0; j < headers.length; j++) {
                                obj[headers[j]] = row[j] !== undefined ? row[j] : '';
                            }
                            formattedData.push(obj);
                        }
                        resolve(formattedData);
                    },
                    error: (error) => reject(error)
                });
            });
        };

        const runGAS = async (functionName, ...args) => {
            if (typeof google !== 'undefined' && google.script && google.script.run) {
                return new Promise((resolve, reject) => {
                    google.script.run.withSuccessHandler(resolve).withFailureHandler(reject)[functionName](...args);
                });
            } else if (API_CONFIG.WEB_APP_URL && API_CONFIG.WEB_APP_URL.startsWith("https://script.google.com")) {
                try {
                    const response = await fetch(API_CONFIG.WEB_APP_URL, {
                        method: 'POST', redirect: 'follow',
                        body: JSON.stringify({ action: functionName, params: args }),
                        headers: { 'Content-Type': 'text/plain' } 
                    });
                    const result = await response.json();
                    if (result.success === false && result.error) throw new Error(result.error);
                    return result.data !== undefined ? result.data : result;
                } catch (error) { 
                    console.warn(`runGAS Fetch Error (${functionName}):`, error);
                    if (error.name === 'TypeError' || error.message.includes('Failed to fetch')) {
                        throw new Error('ไม่สามารถเชื่อมต่อฐานข้อมูลได้ \nกรุณาตรวจสอบว่าสิทธิ์การแชร์ของ Web App เป็น "ทุกคน (Anyone)" และอัปเดตเป็น "เวอร์ชันใหม่ (New version)" แล้ว');
                    }
                    throw error; 
                }
            } else {
                Swal.fire({
                    title: 'ตั้งค่าระบบยังไม่สมบูรณ์', 
                    text: 'กรุณานำลิงก์ Web App และ Sheet ID ของคุณ มาวางในโค้ดบรรทัดที่ 105-108 ก่อนเริ่มใช้งานครับ', 
                    icon: 'warning',
                    confirmButtonColor: '#ea580c'
                });
                return new Promise((resolve) => setTimeout(() => resolve({ success: false, error: 'Missing WEB_APP_URL' }), 500));
            }
        };

        const surveyData = [
            {
                title: "1. กระบวนการ ขั้นตอนการให้บริการ",
                questions: [
                    { id: "q1", text: "1.1 การประชาสัมพันธ์โครงการ ฯ" }, { id: "q2", text: "1.2 ความเหมาะสมของสถานที่" },
                    { id: "q3", text: "1.3 ความเหมาะสมของระยะเวลา" }, { id: "q4", text: "1.4 การจัดลำดับขั้นตอนของกิจกรรม" }
                ]
            },
            {
                title: "2. การอำนวยความสะดวก",
                questions: [
                    { id: "q5", text: "2.1 เอกสาร" }, { id: "q6", text: "2.2 โสตทัศนูปกรณ์" },
                    { id: "q7", text: "2.3 เจ้าหน้าที่สนับสนุน" }, { id: "q8", text: "2.4 อาหาร,เครื่องดื่มและสถานที่" }
                ]
            },
            {
                title: "3. คุณภาพการให้บริการ",
                questions: [
                    { id: "q9", text: "3.1 ท่านได้รับความรู้ แนวคิด ทักษะและประสบการณ์ใหม่ ๆ จากโครงการ" },
                    { id: "q10", text: "3.2 ท่านสามารถนำสิ่งที่ได้รับจากโครงการ/กิจกรรมนี้ไปใช้ในการปฏิบัติงาน" },
                    { id: "q11", text: "3.3 สิ่งที่ท่านได้รับจากโครงการ/กิจกรรมครั้งนี้ตรงตามความคาดหวังของท่านหรือไม่" },
                    { id: "q12", text: "3.4 โครงการ/กิจกรรมนี้เอื้ออำนวยต่อการเรียนรู้และพัฒนาความสามารถของท่าน" },
                    { id: "q13", text: "3.5 ประโยชน์ที่ท่านได้รับจากโครงการ/กิจกรรม" }
                ]
            }
        ];

        const getGenderProps = (nameStr) => {
            if (!nameStr) return { icon: 'fa-user', bg: 'bg-orange-50', text: 'text-orange-600' };
            if (nameStr.startsWith('นาย')) return { icon: 'fa-person', bg: 'bg-slate-100', text: 'text-slate-600' };
            if (nameStr.startsWith('นาง') || nameStr.startsWith('น.ส.')) return { icon: 'fa-person-dress', bg: 'bg-rose-50', text: 'text-rose-600' };
            return { icon: 'fa-user', bg: 'bg-orange-50', text: 'text-orange-600' };
        };

        function App() {
            const [view, setView] = useState(() => {
                const savedView = sessionStorage.getItem('app_view');
                if (savedView === 'admin_dashboard' && localStorage.getItem('admin_logged_in') === 'true') return 'admin_dashboard';
                if (['home', 'search', 'history_search', 'admin_login'].includes(savedView)) return savedView;
                return 'home';
            }); 
            
            const [student, setStudent] = useState(null);
            const [activities, setActivities] = useState([]);
            const [selectedActivity, setSelectedActivity] = useState(null);
            const [surveyAnswers, setSurveyAnswers] = useState({});
            const [suggestion, setSuggestion] = useState('');
            const [historyData, setHistoryData] = useState([]);

            const [systemOpen, setSystemOpen] = useState(true);
            const [adminData, setAdminData] = useState(null);

            const [searchPurpose, setSearchPurpose] = useState(() => sessionStorage.getItem('search_purpose') || 'activity');
            
            const [shirtSystemOpen, setShirtSystemOpen] = useState(true);
            const [shirtPrice, setShirtPrice] = useState({ normal: 250, oversize: 380, status: 'open', popupText: '', popupImage: '' });
            const [receiptSettings, setReceiptSettings] = useState({ header: 'สโมสรนักศึกษาคณะเทคโนโลยีดิจิทัล มหาวิทยาลัยราชภัฏเชียงราย\nที่อยู่: 80 ซอย 9 ตำบล บ้านดู่ อำเภอเมืองเชียงราย เชียงราย 57100', note: 'กรุณานำใบเสร็จนี้มาแสดงในวันรับเสื้อ' });
            
            const [isEditingOrder, setIsEditingOrder] = useState(false);
            const [poloGender, setPoloGender] = useState('ชาย');
            const [poloSize, setPoloSize] = useState('M');
            const [poloQty, setPoloQty] = useState(1);
            const [tshirtGender, setTshirtGender] = useState('ชาย');
            const [tshirtSize, setTshirtSize] = useState('M');
            const [tshirtQty, setTshirtQty] = useState(1);
            const [paymentMethod, setPaymentMethod] = useState('promptpay'); 
            const [slipImage, setSlipImage] = useState(null); 
            const [receiptData, setReceiptData] = useState(null);

            const [isDarkMode, setIsDarkMode] = useState(() => localStorage.getItem('theme') === 'dark');

            useEffect(() => {
                const loader = document.getElementById('app-loader');
                if (loader) {
                    loader.style.opacity = '0';
                    setTimeout(() => {
                        loader.style.visibility = 'hidden';
                        loader.style.display = 'none';
                    }, 300);
                }
            }, []);

            useEffect(() => { sessionStorage.setItem('app_view', view); }, [view]);
            useEffect(() => { sessionStorage.setItem('search_purpose', searchPurpose); }, [searchPurpose]);

            useEffect(() => {
                if (isDarkMode) { document.documentElement.classList.add('dark'); localStorage.setItem('theme', 'dark'); }
                else { document.documentElement.classList.remove('dark'); localStorage.setItem('theme', 'light'); }
            }, [isDarkMode]);

            const loadAdminData = () => {
                if (API_CONFIG.USE_FAST_CSV && !isFastCSVReady()) {
                    Swal.fire({ title: 'ตั้งค่าระบบดึงข้อมูลเร็วไม่สมบูรณ์', text: 'กรุณาใส่ SHEET_ID ของคุณในโค้ด (บรรทัดที่ 106) ให้ถูกต้องครับ', icon: 'warning', confirmButtonColor: '#ea580c' });
                    return;
                }

                Swal.fire({ title: 'โปรดรอสักครู่...', allowOutsideClick: false, didOpen: () => { Swal.showLoading() } });
                setTimeout(async () => {
                    try {
                        let data;
                        if (isFastCSVReady()) {
                            const [acts, chks, evals, shirts, settings] = await Promise.all([
                                fetchFastCSV('Activities').catch(() => []), 
                                fetchFastCSV('CheckIns').catch(() => []),
                                fetchFastCSV('Evaluations').catch(() => []), 
                                fetchFastCSV('ShirtOrders').catch(() => []),
                                fetchFastCSV('Settings').catch(() => [])
                            ]);
                            
                            let priceInfo = { normal: 250, oversize: 380, status: 'open', receiptHeader: 'สโมสรนักศึกษาคณะเทคโนโลยีดิจิทัล มหาวิทยาลัยราชภัฏเชียงราย\nที่อยู่: 80 ซอย 9 ตำบล บ้านดู่ อำเภอเมืองเชียงราย เชียงราย 57100', receiptNote: 'กรุณานำใบเสร็จนี้มาแสดงในวันรับเสื้อ', systemStatus: 'open', popupText: '', popupImage: '' };
                            
                            if (settings && settings.length > 0) {
                                const priceRow = settings.find(r => r.Key === 'ShirtPrice') || {Value1: 250, Value2: 380};
                                const statusRow = settings.find(r => r.Key === 'ShirtStatus') || {Value1: 'open', Value2: ''};
                                const receiptRow = settings.find(r => r.Key === 'ReceiptConfig') || {Value1: priceInfo.receiptHeader, Value2: priceInfo.receiptNote};
                                const systemRow = settings.find(r => r.Key === 'SystemStatus') || {Value1: 'open', Value2: ''};
                                const popupRow = settings.find(r => r.Key === 'ShirtPopup') || {Value1: '', Value2: ''};
                                
                                priceInfo = { 
                                    normal: Number(priceRow.Value1), oversize: Number(priceRow.Value2), 
                                    status: statusRow.Value1, receiptHeader: receiptRow.Value1, receiptNote: receiptRow.Value2,
                                    systemStatus: systemRow.Value1,
                                    popupText: popupRow.Value1, popupImage: popupRow.Value2 
                                };
                            } else {
                                try { priceInfo = await runGAS('getShirtPrice'); } catch(err) { console.warn("Fallback to default settings"); }
                            }
                            
                            data = { activities: acts, checkins: chks, evaluations: evals, shirtOrders: shirts, shirtPrice: priceInfo };
                        } else { 
                            data = await runGAS('getAdminDashboardData'); 
                        }
                        
                        setAdminData(data || { activities: [], checkins: [], evaluations: [], shirtOrders: [], shirtPrice: {} }); 
                        if (data && data.shirtPrice) { 
                            setShirtPrice(data.shirtPrice); 
                            setShirtSystemOpen(data.shirtPrice.status !== 'closed'); 
                            setSystemOpen(data.shirtPrice.systemStatus !== 'maintenance');
                        }
                        
                        setTimeout(() => {
                            Swal.close(); 
                            setView('admin_dashboard');
                        }, 50);

                    } catch(e) { Swal.fire('ข้อผิดพลาดการเชื่อมต่อ', e.message, 'error'); }
                }, 100);
            };

            useEffect(() => {
                const loadInitialData = async () => {
                    try {
                        let acts = [];
                        if (isFastCSVReady()) {
                            const allActs = await fetchFastCSV('Activities');
                            acts = allActs.filter(a => a.Status === 'open');
                        } else { acts = await runGAS('getActiveActivities'); }
                        setActivities(acts || []);
                        
                        let priceInfo = null;
                        if (isFastCSVReady()) {
                            try {
                                const settings = await fetchFastCSV('Settings');
                                const priceRow = settings.find(r => r.Key === 'ShirtPrice') || {Value1: 250, Value2: 380};
                                const statusRow = settings.find(r => r.Key === 'ShirtStatus') || {Value1: 'open', Value2: ''};
                                const receiptRow = settings.find(r => r.Key === 'ReceiptConfig') || {Value1: 'สโมสรนักศึกษาคณะเทคโนโลยีดิจิทัล มหาวิทยาลัยราชภัฏเชียงราย\nที่อยู่: 80 ซอย 9 ตำบล บ้านดู่ อำเภอเมืองเชียงราย เชียงราย 57100', Value2: 'กรุณานำใบเสร็จนี้มาแสดงในวันรับเสื้อ'};
                                const systemRow = settings.find(r => r.Key === 'SystemStatus') || {Value1: 'open', Value2: ''};
                                const popupRow = settings.find(r => r.Key === 'ShirtPopup') || {Value1: '', Value2: ''};
                                
                                priceInfo = { 
                                    normal: Number(priceRow.Value1), oversize: Number(priceRow.Value2), 
                                    status: statusRow.Value1, receiptHeader: receiptRow.Value1, receiptNote: receiptRow.Value2,
                                    systemStatus: systemRow.Value1,
                                    popupText: popupRow.Value1, popupImage: popupRow.Value2
                                };
                            } catch(e) { priceInfo = await runGAS('getShirtPrice'); }
                        } else { priceInfo = await runGAS('getShirtPrice'); }

                        if (priceInfo) {
                            setShirtPrice(priceInfo);
                            setShirtSystemOpen(priceInfo.status !== 'closed');
                            setSystemOpen(priceInfo.systemStatus !== 'maintenance');
                            setReceiptSettings({ header: priceInfo.receiptHeader, note: priceInfo.receiptNote });
                        }
                    } catch (e) { console.error("Initial load failed", e); }
                };

                if (view === 'admin_dashboard' && localStorage.getItem('admin_logged_in') === 'true') {
                    if (!adminData) loadAdminData();
                } else {
                    loadInitialData();
                }
            }, []); 

            const goHome = () => {
                setStudent(null); setSearchPurpose('activity');
                setPoloGender('ชาย'); setPoloSize('M'); setPoloQty(1);
                setTshirtGender('ชาย'); setTshirtSize('M'); setTshirtQty(1);
                setPaymentMethod('promptpay'); 
                setReceiptData(null); setIsEditingOrder(false); setSlipImage(null); setView('home');
            };

            const handleSearchStudent = async (rawStudentId) => {
                const studentId = String(rawStudentId).trim();
                if(!studentId) return Swal.fire('แจ้งเตือน', 'กรุณากรอกรหัสนักศึกษา', 'warning');
                Swal.fire({ title: 'ตรวจสอบข้อมูล...', allowOutsideClick: false, didOpen: () => { Swal.showLoading() } });
                try {
                    let res = { success: false };
                    if (isFastCSVReady()) {
                        try {
                            const allStudents = await fetchFastCSV('Students');
                            const studentData = allStudents.find(s => String(s.StudentID).trim() === studentId || String(s.IDCard).trim() === studentId);
                            if (studentData) res = { success: true, data: studentData };
                            else res = { success: false };
                        } catch(csvErr) { res = await runGAS('verifyStudent', studentId).catch(e => { throw e }); }
                    } else { res = await runGAS('verifyStudent', studentId); }

                    if(res.success) {
                        setStudent(res.data);
                        localStorage.setItem('last_student_id', studentId);

                        if (searchPurpose === 'shirt') {
                            let orderCheck = { hasOrdered: false };
                            if (isFastCSVReady()) {
                                try {
                                    const allOrders = await fetchFastCSV('ShirtOrders');
                                    for (let i = allOrders.length - 1; i >= 0; i--) {
                                        if (String(allOrders[i].StudentID).trim() === studentId) {
                                            orderCheck = { hasOrdered: true, data: allOrders[i] };
                                            break;
                                        }
                                    }
                                } catch(csvErr) { orderCheck = await runGAS('checkShirtOrder', studentId); }
                            } else { orderCheck = await runGAS('checkShirtOrder', studentId); }

                            Swal.close();
                            if (orderCheck.hasOrdered && orderCheck.data) {
                                const pastOrder = orderCheck.data;
                                setReceiptData({
                                    student: res.data,
                                    poloGender: pastOrder.PoloGender || 'ชาย', poloSize: pastOrder.PoloSize, poloQty: Number(pastOrder.PoloQty),
                                    tshirtGender: pastOrder.TshirtGender || 'ชาย', tshirtSize: pastOrder.TshirtSize, tshirtQty: Number(pastOrder.TshirtQty),
                                    grandTotal: Number(pastOrder.TotalPrice),
                                    paymentMethod: pastOrder.PaymentMethod || (pastOrder.SlipImage || pastOrder.SlipURL || pastOrder.Slip ? 'promptpay' : 'cash'),
                                    orderId: 'ORD-' + new Date(pastOrder.Timestamp).getTime().toString().slice(-6),
                                    date: new Date(pastOrder.Timestamp).toLocaleString('th-TH')
                                });
                                setPoloGender(pastOrder.PoloGender || 'ชาย'); setPoloSize(pastOrder.PoloSize); setPoloQty(Number(pastOrder.PoloQty));
                                setTshirtGender(pastOrder.TshirtGender || 'ชาย'); setTshirtSize(pastOrder.TshirtSize); setTshirtQty(Number(pastOrder.TshirtQty));
                                setPaymentMethod(pastOrder.PaymentMethod || (pastOrder.SlipImage || pastOrder.SlipURL || pastOrder.Slip ? 'promptpay' : 'cash'));
                                setView('receipt');
                            } else { setView('shirt_form'); }
                        } else { Swal.close(); setView('select'); }
                    } else { 
                        Swal.close(); 
                        Swal.fire({
                            title:'ไม่พบข้อมูล', 
                            text:'ไม่พบข้อมูลของท่านในฐานข้อมูล กรุณาติดต่อฝ่ายกิจการนักศึกษา คณะเทคโนโลยีดิจิทัล เพื่อตรวจสอบข้อมูล', 
                            icon:'error', 
                            confirmButtonColor: '#1a1a1a'
                        }); 
                    }
                } catch(e) { Swal.fire('ข้อผิดพลาด', e.message, 'error'); }
            };

            const handleSelectActivity = async (act) => {
                Swal.fire({ title: 'กำลังตรวจสอบสิทธิ์...', allowOutsideClick: false, didOpen: () => { Swal.showLoading() } });
                try {
                    let hasJoined = false;
                    if (isFastCSVReady()) {
                        const allChks = await fetchFastCSV('CheckIns').catch(() => []);
                        hasJoined = allChks.some(c => 
                            (String(c.StudentID) === String(student.StudentID) || (student.IDCard && String(c.IDCard) === String(student.IDCard))) && 
                            String(c.ActivityID).trim() === String(act.ActivityID).trim()
                        );
                    } else {
                        const history = await runGAS('getStudentHistory', student.StudentID);
                        hasJoined = history.some(h => String(h.ActivityID).trim() === String(act.ActivityID).trim());
                    }

                    Swal.close();
                    if (hasJoined) {
                        Swal.fire({
                            title: 'ลงทะเบียนซ้ำ!',
                            text: 'คุณได้ลงทะเบียนเข้าร่วมกิจกรรมนี้ไปแล้ว ไม่สามารถลงซ้ำได้ครับ',
                            icon: 'warning',
                            confirmButtonColor: '#ea580c'
                        });
                    } else {
                        setSelectedActivity(act);
                        setView('survey');
                    }
                } catch(e) {
                    Swal.close();
                    setSelectedActivity(act);
                    setView('survey');
                }
            };

                const getPrice = (size) => ['XL', '2XL', '3XL'].includes(size) ? shirtPrice.oversize : shirtPrice.normal;
                const grandTotal = (getPrice(poloSize) * poloQty) + (getPrice(tshirtSize) * tshirtQty);
                
                if (grandTotal > 0 && paymentMethod === 'promptpay' && !slipImage) {
                    return Swal.fire('แจ้งเตือน', 'กรุณาแนบสลิปการโอนเงินเพื่อยืนยันการสั่งจอง', 'warning');

                try {
                    const payload = { student, poloGender, poloSize, poloQty, tshirtGender, tshirtSize, tshirtQty, grandTotal, slipImage, paymentMethod };
                    const res = await runGAS('saveShirtOrder', payload);
                    Swal.close();
                    if(res.success) {
                        setReceiptData({ ...payload, orderId: 'ORD-' + Date.now().toString().slice(-6), date: new Date().toLocaleString('th-TH') });
                        Swal.fire({ title: 'บันทึกสำเร็จ', icon: 'success', confirmButtonColor: '#d19d47' }).then(() => { setIsEditingOrder(false); setView('receipt'); });
                    } else { Swal.fire('ข้อผิดพลาด', res.error, 'error'); }
                } catch(e) { Swal.fire('เกิดข้อผิดพลาด', e.message, 'error'); }
            };

            const handleSubmitSurvey = async (e) => {

                    else Swal.fire('ข้อผิดพลาด', res.error, 'error');
                } catch(e) { Swal.fire('ข้อผิดพลาด', e.message, 'error'); }
            };

            const handleSearchHistory = async (rawStudentId) => {

                                <button onClick={() => setView('admin_login')} className="hidden md:flex text-sm text-gray-400 hover:text-orange-600 transition-colors items-center font-medium">STAFF LOGIN <i className="fa-solid fa-arrow-right-to-bracket ml-2"></i></button>
                            )}
                        </div>
                    </div>
                </div>

                                {view === 'home' && <div className="absolute top-0 w-8 h-1 bg-orange-500 rounded-b-full"></div>}
                                <i className={`fa-solid fa-house text-xl ${view === 'home' ? 'mb-0.5 scale-110' : ''}`}></i><span className="text-[10px] font-medium">หน้าแรก</span>
                            </button>
                            <button onClick={() => { if(!systemOpen) return Swal.fire({title:'วันนี้ผมรักผมทักผมรอ วันไหนผมท้อผมพอผมลา', icon:'info', confirmButtonColor: '#1a1a1a'}); setSearchPurpose('activity'); setView('search'); }} className={`relative flex flex-col items-center justify-center w-full h-full space-y-1 transition-colors ${(view === 'select' || view === 'survey' || (view === 'search' && searchPurpose === 'activity')) ? 'text-orange-600' : 'text-gray-400'}`}>

                                <i className={`fa-solid fa-clock-rotate-left text-xl ${(view === 'history_search' || view === 'history_result') ? 'mb-0.5 scale-110' : ''}`}></i><span className="text-[10px] font-medium">ประวัติ</span>

            if (view === 'home') {
                return (
                    <div className="min-h-screen flex flex-col relative z-10">

                                        <i className={`fa-solid ${isShirtSearch ? 'fa-shirt' : 'fa-id-card'} text-3xl text-orange-600`}></i>

                                    <div><h2 className="text-xl font-semibold text-charcoal-900">{student.Name}</h2><p className="text-gray-500 text-sm font-light mt-0.5">{student.StudentID} <span className="mx-2">•</span> {student.Major}</p></div>
                                </div>
                                <button onClick={() => setView('search')} className="text-xs text-orange-600 hover:text-orange-700 bg-orange-50 px-3 py-1.5 rounded-lg font-medium transition-colors">เปลี่ยนรหัส</button>
                            </div>
                            <div className="w-full max-w-2xl">
                                <h3 className="font-medium text-gray-400 text-sm mb-4 uppercase tracking-widest pl-2">กิจกรรมที่เปิดรับลงทะเบียน</h3>
                                <div className="space-y-4">
                                    {activities.length === 0 ? (<div className="text-center py-12 luxury-card"><p className="text-gray-400 font-light">ไม่มีกิจกรรมที่เปิดให้ลงทะเบียนในขณะนี้</p></div>) : (
                                        activities.map(act => (
                                            <div key={act.ActivityID} onClick={() => handleSelectActivity(act)} className="luxury-card p-6 cursor-pointer group hover:border-orange-300 hover:shadow-orange-500/10">
                                                <div className="flex justify-between items-center">
                                                    <div><h4 className="font-semibold text-lg text-charcoal-900 group-hover:text-orange-600 transition-colors">{act.Name}</h4><div className="flex items-center gap-4 mt-2 text-sm text-gray-500 font-light"><span><i className="fa-regular fa-calendar mr-1 opacity-70 text-orange-400"></i> {act.Date}</span><span><i className="fa-solid fa-location-dot mr-1 opacity-70 text-orange-400"></i> {act.Location}</span></div></div>
                                                    <i className="fa-solid fa-arrow-right text-gray-300 group-hover:text-orange-500 transition-transform transform group-hover:translate-x-1 text-xl"></i>
                                                </div>
                                            </div>
                                        ))
                                    )}
                                </div>
                            </div>
                        </div>
                        <Footer />
                        <MobileTabBar />
                    </div>
                );
            }

                return (
                    <div className="min-h-screen flex flex-col relative z-10">
                        <Navbar />
                        <div className="flex-grow flex flex-col items-center pt-6 p-4 pb-20">
                            <div className="luxury-card w-full max-w-4xl p-6 sm:p-12 border-t-4 border-t-orange-500">
                                <div className="mb-10 relative">
                                    <button onClick={() => setView('select')} className="text-gray-400 hover:text-orange-600 transition-colors text-sm mb-6 flex items-center"><i className="fa-solid fa-arrow-left mr-2"></i> กลับหน้ารายการ</button>
                                    <h2 className="text-2xl sm:text-3xl font-semibold text-charcoal-900 leading-tight">{selectedActivity.Name}</h2>
                                    <p className="text-gray-500 mt-2 font-light">แบบประเมินความพึงพอใจ</p>
                                </div>
                                <form onSubmit={handleSubmitSurvey}>
                                    <div className="hidden md:flex flex-row items-center justify-between px-4 mb-3 border-b border-gray-100 pb-2">
                                        <div className="md:w-3/5 font-semibold text-gray-400 text-[10px] tracking-widest uppercase">หัวข้อการประเมิน</div>
                                        <div className="flex justify-end gap-2 w-auto pr-1">
                                            <div className="w-10 text-center text-[10px] font-medium text-gray-400 uppercase tracking-widest leading-tight">5<br/>ยอดเยี่ยม</div>
                                            <div className="w-10 text-center text-[10px] font-medium text-gray-400 uppercase tracking-widest leading-tight">4<br/>ดีมาก</div>
                                            <div className="w-10 text-center text-[10px] font-medium text-gray-400 uppercase tracking-widest leading-tight">3<br/>ดี</div>
                                            <div className="w-10 text-center text-[10px] font-medium text-gray-400 uppercase tracking-widest leading-tight">2<br/>พอใช้</div>
                                            <div className="w-10 text-center text-[10px] font-medium text-gray-400 uppercase tracking-widest leading-tight">1<br/>ปรับปรุง</div>
                                        </div>
                                    </div>
                                    <div className="md:hidden flex flex-wrap items-center gap-4 text-xs font-light text-gray-500 mb-10 pb-6 border-b border-orange-100">
                                        <span className="font-medium text-charcoal-900">เกณฑ์คะแนน:</span>
                                        <div className="flex items-center gap-1.5"><div className="w-5 h-5 rounded bg-gradient-to-br from-orange-400 to-orange-600 text-white flex justify-center items-center">5</div> ยอดเยี่ยม</div>
                                        <div className="flex items-center gap-1.5"><div className="w-5 h-5 rounded border border-gray-200 text-gray-500 flex justify-center items-center">4</div> ดีมาก</div>
                                        <div className="flex items-center gap-1.5"><div className="w-5 h-5 rounded border border-gray-200 text-gray-500 flex justify-center items-center">3</div> ดี</div>
                                        <div className="flex items-center gap-1.5"><div className="w-5 h-5 rounded border border-gray-200 text-gray-500 flex justify-center items-center">2</div> พอใช้</div>
                                        <div className="flex items-center gap-1.5"><div className="w-5 h-5 rounded border border-gray-200 text-gray-500 flex justify-center items-center">1</div> ปรับปรุง</div>
                                    </div>
                                    {surveyData.map((category, catIdx) => (
                                        <div key={catIdx} className="mb-12">
                                            <h3 className="text-lg font-semibold text-charcoal-900 mb-6 border-l-4 border-orange-500 pl-3">{category.title.split(' ').slice(1).join(' ')}</h3>
                                            <div className="space-y-4">
                                                {category.questions.map((q) => (
                                                    <div key={q.id} className="p-4 sm:p-5 border border-orange-50/80 rounded-xl hover:border-orange-200 hover:bg-orange-50/30 transition-colors flex flex-col md:flex-row md:items-center justify-between gap-4">
                                                        <div className="text-gray-800 font-light text-sm md:w-3/5">{q.text}</div>
                                                        <div className="flex justify-between gap-2 w-full md:w-auto">
                                                            {[5, 4, 3, 2, 1].map(score => (
                                                                <label key={score} className={`relative w-10 h-10 sm:w-12 sm:h-12 flex items-center justify-center rounded-lg cursor-pointer text-sm font-medium transition-all ${surveyAnswers[q.id] === score ? 'bg-gradient-to-br from-orange-400 to-orange-600 text-white shadow-md' : 'bg-white text-gray-400 border border-gray-200 hover:border-orange-300'}`}>
                                                                    <input type="radio" className="hidden" name={q.id} value={score} required onChange={() => setSurveyAnswers({...surveyAnswers, [q.id]: score})} />{score}
                                                                </label>
                                                            ))}
                                                        </div>
                                                    </div>
                                                ))}
                                            </div>
                                        </div>
                                    ))}
                                    <div className="mb-12">
                                        <h3 className="text-lg font-semibold text-charcoal-900 mb-4 border-l-4 border-orange-500 pl-3">ข้อเสนอแนะเพิ่มเติม</h3>
                                        <textarea rows="3" value={suggestion} onChange={(e) => setSuggestion(e.target.value)} className="w-full luxury-input resize-none text-sm font-light" placeholder="ความคิดเห็นเพื่อการพัฒนา (ไม่บังคับ)"></textarea>
                                    </div>
                                    <div className="flex gap-4 pt-6 border-t border-orange-100">
                                        <button type="submit" className="w-full btn-gradient py-4 rounded-xl font-semibold tracking-wider text-sm shadow-lg shadow-orange-500/20">ส่งแบบประเมิน</button>
                                    </div>
                                </form>
                            </div>
                        </div>
                        <Footer />
                    </div>
                );
            }

            if (view === 'shirt_form') {
                const getPrice = (size) => ['XL', '2XL', '3XL'].includes(size) ? shirtPrice.oversize : shirtPrice.normal;
                const grandTotal = (getPrice(poloSize) * poloQty) + (getPrice(tshirtSize) * tshirtQty);
                const gProps = getGenderProps(student.Name);

                return (
                    <div className="min-h-screen flex flex-col relative z-10">
                        <Navbar />
                        <div className="flex-grow flex flex-col items-center pt-8 p-4 pb-20">
                            <div className="luxury-card w-full max-w-2xl p-6 sm:p-12 border-t-4 border-t-orange-500">
                                <div className="flex justify-between items-center mb-10 pb-6 border-b border-orange-100">
                                    <div className="flex items-center gap-4">
                                        <div className={`w-14 h-14 rounded-full flex items-center justify-center text-xl ${gProps.bg} ${gProps.text}`}><i className={`fa-solid ${gProps.icon}`}></i></div>
                                        <div>
                                            <p className="text-xs text-orange-400 font-medium uppercase tracking-widest">ข้อมูลการจองของ</p>
                                            <h2 className="text-xl font-semibold text-charcoal-900">{student.Name}</h2>
                                        </div>
                                    </div>
                                    <button onClick={() => setView('search')} className="text-xs text-orange-500 hover:text-orange-700 bg-orange-50 px-3 py-1.5 rounded-lg font-medium transition-colors">เปลี่ยนรหัส</button>
                                </div>

                                {/* 🚀 Popup Banner แจ้งเตือนหรือตารางไซส์ */}
                                {(shirtPrice.popupText || shirtPrice.popupImage) && (
                                    <div className="mb-8 bg-indigo-50 border border-indigo-100 p-4 rounded-2xl flex items-center justify-between shadow-sm">
                                        <div className="flex items-center gap-3">
                                            <div className="w-10 h-10 bg-indigo-100 text-indigo-600 rounded-full flex items-center justify-center text-lg shrink-0">
                                                <i className="fa-solid fa-bullhorn"></i>
                                            </div>
                                            <div>
                                                <h4 className="text-sm font-bold text-indigo-900">ประกาศ / ตารางไซส์</h4>
                                                <p className="text-xs text-indigo-700/80 line-clamp-1">โปรดตรวจสอบรายละเอียดก่อนสั่งจอง</p>
                                            </div>
                                        </div>
                                        <button type="button" onClick={() => {
                                            Swal.fire({
                                                title: 'ประกาศ / รายละเอียด',
                                                text: shirtPrice.popupText || '',
                                                imageUrl: shirtPrice.popupImage || undefined,
                                                imageAlt: 'Popup Image',
                                                confirmButtonColor: '#ea580c'
                                            });
                                        }} className="px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-semibold rounded-lg shadow-sm transition-colors whitespace-nowrap">
                                            เปิดดู
                                        </button>
                                    </div>
                                )}

                                <form onSubmit={handleSubmitShirtOrder}>
                                    <h2 className="text-2xl font-semibold text-charcoal-900 text-center mb-8">{isEditingOrder ? 'แก้ไขข้อมูลการจอง' : 'แบบฟอร์มสั่งจองเสื้อคณะ'}</h2>
                                    
                                    {/* Polo Section */}
                                    <div className="mb-8">
                                        <h3 className="font-semibold text-charcoal-900 mb-4 flex items-center"><span className="text-orange-500 mr-2">01.</span> เสื้อคอปกโปโล</h3>
                                        <div className="border border-orange-50/80 rounded-2xl p-5 sm:p-6 bg-white shadow-sm">
                                            <div className="mb-5">
                                                <label className="block text-xs font-medium text-gray-400 uppercase tracking-widest mb-3">ทรงเสื้อ</label>
                                                <div className="flex gap-4">
                                                    {['ชาย', 'หญิง'].map(g => (
                                                        <label key={`polo-${g}`} className={`flex-1 py-3 rounded-xl border text-center cursor-pointer text-sm font-medium transition-all ${poloGender === g ? 'border-orange-500 bg-orange-500 text-white shadow-md' : 'border-gray-200 text-gray-500 hover:border-orange-300'}`}>
                                                            <input type="radio" className="hidden" checked={poloGender === g} onChange={() => setPoloGender(g)} /> ทรง{g}
                                                        </label>
                                                    ))}
                                                </div>
                                            </div>
                                            <div className="mb-5">
                                                <label className="block text-xs font-medium text-gray-400 uppercase tracking-widest mb-3">ขนาด (Size)</label>
                                                <div className="grid grid-cols-3 sm:grid-cols-6 gap-2 sm:gap-3">
                                                    {['S', 'M', 'L', 'XL', '2XL', '3XL'].map(size => (
                                                        <label key={`p-${size}`} className={`relative flex flex-col items-center py-3 rounded-xl border cursor-pointer transition-all ${poloSize === size ? 'border-orange-500 bg-orange-50 text-orange-600 shadow-sm' : 'border-gray-200 text-gray-500 hover:border-orange-300'}`}>
                                                            <input type="radio" className="hidden" checked={poloSize === size} onChange={() => setPoloSize(size)} />
                                                            <span className="text-sm font-semibold">{size}</span>
                                                            <span className="text-[9px] opacity-70 mt-1">฿{getPrice(size)}</span>
                                                        </label>
                                                    ))}
                                                </div>
                                            </div>
                                            <div className="flex justify-between items-center bg-orange-50/50 p-4 rounded-xl border border-orange-100">
                                                <label className="text-xs font-medium text-gray-500 uppercase tracking-widest">จำนวน</label>
                                                <div className="flex items-center gap-3">
                                                    <button type="button" onClick={() => setPoloQty(Math.max(1, poloQty - 1))} className="w-8 h-8 rounded border border-orange-200 bg-white text-orange-500 hover:bg-orange-100"><i className="fa-solid fa-minus text-xs"></i></button>
                                                    <span className="font-semibold text-charcoal-900 w-6 text-center text-sm">{poloQty}</span>
                                                    <button type="button" onClick={() => setPoloQty(poloQty + 1)} className="w-8 h-8 rounded border border-orange-200 bg-white text-orange-500 hover:bg-orange-100"><i className="fa-solid fa-plus text-xs"></i></button>
                                                </div>
                                            </div>
                                        </div>
                                    </div>

                                    {/* Tshirt Section */}
                                    <div className="mb-10">
                                        <h3 className="font-semibold text-charcoal-900 mb-4 flex items-center"><span className="text-orange-500 mr-2">02.</span> เสื้อยืดกิจกรรม</h3>
                                        <div className="border border-orange-50/80 rounded-2xl p-5 sm:p-6 bg-white shadow-sm">
                                            <div className="mb-5">
                                                <label className="block text-xs font-medium text-gray-400 uppercase tracking-widest mb-3">ทรงเสื้อ</label>
                                                <div className="flex gap-4">
                                                    {['ชาย', 'หญิง'].map(g => (
                                                        <label key={`ts-${g}`} className={`flex-1 py-3 rounded-xl border text-center cursor-pointer text-sm font-medium transition-all ${tshirtGender === g ? 'border-orange-500 bg-orange-500 text-white shadow-md' : 'border-gray-200 text-gray-500 hover:border-orange-300'}`}>
                                                            <input type="radio" className="hidden" checked={tshirtGender === g} onChange={() => setTshirtGender(g)} /> ทรง{g}
                                                        </label>
                                                    ))}
                                                </div>
                                            </div>
                                            <div className="mb-5">
                                                <label className="block text-xs font-medium text-gray-400 uppercase tracking-widest mb-3">ขนาด (Size)</label>
                                                <div className="grid grid-cols-3 sm:grid-cols-6 gap-2 sm:gap-3">
                                                    {['S', 'M', 'L', 'XL', '2XL', '3XL'].map(size => (
                                                        <label key={`t-${size}`} className={`relative flex flex-col items-center py-3 rounded-xl border cursor-pointer transition-all ${tshirtSize === size ? 'border-orange-500 bg-orange-50 text-orange-600 shadow-sm' : 'border-gray-200 text-gray-500 hover:border-orange-300'}`}>
                                                            <input type="radio" className="hidden" checked={tshirtSize === size} onChange={() => setTshirtSize(size)} />
                                                            <span className="text-sm font-semibold">{size}</span>
                                                            <span className="text-[9px] opacity-70 mt-1">฿{getPrice(size)}</span>
                                                        </label>
                                                    ))}
                                                </div>
                                            </div>
                                            <div className="flex justify-between items-center bg-orange-50/50 p-4 rounded-xl border border-orange-100">
                                                <label className="text-xs font-medium text-gray-500 uppercase tracking-widest">จำนวน</label>
                                                <div className="flex items-center gap-3">
                                                    <button type="button" onClick={() => setTshirtQty(Math.max(1, tshirtQty - 1))} className="w-8 h-8 rounded border border-orange-200 bg-white text-orange-500 hover:bg-orange-100"><i className="fa-solid fa-minus text-xs"></i></button>
                                                    <span className="font-semibold text-charcoal-900 w-6 text-center text-sm">{tshirtQty}</span>
                                                    <button type="button" onClick={() => setTshirtQty(tshirtQty + 1)} className="w-8 h-8 rounded border border-orange-200 bg-white text-orange-500 hover:bg-orange-100"><i className="fa-solid fa-plus text-xs"></i></button>
                                                </div>
                                            </div>
                                        </div>
                                    </div>

                                    {/* Payment Method Section */}
                                    {grandTotal > 0 && (
                                        <div className="mb-8">
                                            <h3 className="font-semibold text-charcoal-900 mb-4 flex items-center"><span className="text-orange-500 mr-2">03.</span> วิธีการชำระเงิน</h3>
                                            <div className="flex gap-4">
                                                <label className={`flex-1 py-4 rounded-xl border text-center cursor-pointer text-sm font-medium transition-all flex flex-col items-center justify-center gap-2 ${paymentMethod === 'promptpay' ? 'border-orange-500 bg-orange-50 text-orange-600 shadow-sm' : 'border-gray-200 text-gray-500 hover:border-orange-300'}`}>
                                                    <input type="radio" className="hidden" checked={paymentMethod === 'promptpay'} onChange={() => setPaymentMethod('promptpay')} />
                                                    <i className="fa-solid fa-qrcode text-2xl mb-1"></i>
                                                    ชำระผ่าน PromptPay
                                                </label>
                                                <label className={`flex-1 py-4 rounded-xl border text-center cursor-pointer text-sm font-medium transition-all flex flex-col items-center justify-center gap-2 ${paymentMethod === 'cash' ? 'border-orange-500 bg-orange-50 text-orange-600 shadow-sm' : 'border-gray-200 text-gray-500 hover:border-orange-300'}`}>
                                                    <input type="radio" className="hidden" checked={paymentMethod === 'cash'} onChange={() => setPaymentMethod('cash')} />
                                                    <i className="fa-solid fa-money-bill-wave text-2xl mb-1"></i>
                                                    ชำระด้วยเงินสด
                                                </label>
                                            </div>
                                        </div>
                                    )}

                                    <div className="bg-gradient-to-r from-orange-50 to-orange-100 p-6 rounded-2xl mb-6 flex justify-between items-center border border-orange-200/50">
                                        <div><p className="text-xs font-medium text-orange-600/70 uppercase tracking-widest mb-1">Grand Total</p><p className="text-sm font-semibold text-charcoal-900">ยอดชำระสุทธิ</p></div>
                                        <div className="text-3xl font-bold text-orange-600">฿{grandTotal.toLocaleString()}</div>
                                    </div>

                                    {/* 🚀 ส่วนแสดง PromptPay QR Code และ อัปโหลดสลิป หรือ เงินสด */}
                                    {grandTotal > 0 ? (
                                        paymentMethod === 'promptpay' ? (
                                            <div className="bg-white border border-blue-100 p-6 rounded-2xl mb-8 flex flex-col gap-6 shadow-sm">
                                                <div className="flex flex-col sm:flex-row items-center justify-center gap-6">
                                                    <div className="bg-white p-2 rounded-xl border border-gray-200 shadow-sm relative">
                                                        {/* 🚨 แก้ไขเบอร์โทรศัพท์ 0812345678 ด้านล่างนี้ ให้เป็นเบอร์พร้อมเพย์ของคุณ */}
                                                        <img src={`https://promptpay.io/0812345678/${grandTotal}.png`} alt="PromptPay QR" className="w-32 h-32 object-contain" />
                                                    </div>
                                                    <div className="text-center sm:text-left">
                                                        <h4 className="font-bold text-[#113566] mb-1 flex items-center justify-center sm:justify-start gap-2 text-lg">
                                                            PromptPay
                                                        </h4>
                                                        {/* 🚨 แก้ไขเบอร์โทรศัพท์ และ ชื่อบัญชี ที่จะแสดงให้ผู้ใช้เห็น */}
                                                        <p className="text-sm text-gray-600 font-medium mb-0.5">เบอร์พร้อมเพย์: 081-234-5678</p>
                                                        <p className="text-xs text-gray-500 mb-2">ชื่อบัญชี: สโมสรนักศึกษา คณะเทคโนโลยีดิจิทัล</p>
                                                        <div className="inline-block bg-orange-50 text-orange-600 px-3 py-1.5 rounded-lg text-[10px] font-semibold border border-orange-100">
                                                            * โอนเงินยอด ฿{grandTotal.toLocaleString()} แล้วแนบสลิปด้านล่าง
                                                        </div>
                                                    </div>
                                                </div>

                                                {/* Slip Upload Area */}
                                                <div className="border-t border-dashed border-gray-200 pt-6">
                                                    <label className="block text-sm font-semibold text-charcoal-900 mb-3 text-center sm:text-left">
                                                        <i className="fa-solid fa-file-invoice-dollar text-orange-500 mr-2"></i>แนบสลิปโอนเงิน (บังคับ)
                                                    </label>
                                                    <label className="flex flex-col items-center justify-center w-full h-40 border-2 border-orange-200 border-dashed rounded-xl cursor-pointer bg-orange-50/30 hover:bg-orange-50 transition-colors relative overflow-hidden group">
                                                        {slipImage ? (
                                                            <div className="flex flex-col items-center justify-center relative w-full h-full">
                                                                <img src={slipImage} className="absolute inset-0 w-full h-full object-cover opacity-30 blur-sm" alt="slip-bg" />
                                                                <img src={slipImage} className="z-10 h-32 object-contain shadow-md rounded border border-white/50" alt="slip-preview" />
                                                                <div className="absolute inset-0 bg-black/40 flex items-center justify-center opacity-0 group-hover:opacity-100 transition-opacity z-20">
                                                                    <span className="text-white text-xs font-medium px-4 py-2 bg-black/60 rounded-lg backdrop-blur-md flex items-center gap-2">
                                                                        <i className="fa-solid fa-pen"></i> เปลี่ยนรูปสลิป
                                                                    </span>
                                                                </div>
                                                            </div>
                                                        ) : (
                                                            <div className="flex flex-col items-center justify-center pt-5 pb-6">
                                                                <div className="w-12 h-12 bg-white rounded-full flex items-center justify-center shadow-sm border border-orange-100 mb-3 text-orange-400 group-hover:scale-110 transition-transform">
                                                                    <i className="fa-solid fa-cloud-arrow-up text-xl"></i>
                                                                </div>
                                                                <p className="mb-1 text-sm text-gray-600 font-medium"><span className="text-orange-600">คลิกเพื่ออัปโหลด</span> หรือลากไฟล์มาวาง</p>
                                                                <p className="text-xs text-gray-400">รองรับไฟล์ PNG, JPG ขนาดไม่เกิน 5MB</p>
                                                            </div>
                                                        )}
                                                        <input type="file" className="hidden" accept="image/png, image/jpeg, image/jpg" onChange={(e) => {
                                                            const file = e.target.files[0];
                                                            if (file) {
                                                                if (file.size > 5 * 1024 * 1024) {
                                                                    Swal.fire('ไฟล์ใหญ่เกินไป', 'กรุณาอัปโหลดรูปขนาดไม่เกิน 5MB', 'warning');
                                                                    e.target.value = '';
                                                                    return;
                                                                }
                                                                const reader = new FileReader();
                                                                reader.onloadend = () => setSlipImage(reader.result);
                                                                reader.readAsDataURL(file);
                                                            }
                                                        }} />
                                                    </label>
                                                </div>

                return (
                    <div className="min-h-screen flex flex-col relative z-10">

                                    <div><h2 className="text-2xl font-semibold text-charcoal-900">เอกสารยืนยันการจอง</h2><p className="text-gray-500 text-sm font-light mt-1">โปรดดาวน์โหลดใบเสร็จนี้เก็บไว้เป็นหลักฐาน</p></div>
                                    <p className="text-xs text-orange-500 font-medium xl:hidden"><i className="fa-solid fa-arrows-left-right"></i> เลื่อนซ้ายขวาเพื่อดูฉบับเต็ม</p>
                                </div>

                                <div className="w-full overflow-x-auto pb-6 custom-scrollbar">
                                    <div id="receipt-card" className="bg-white flex flex-row justify-between items-stretch shadow-sm border border-orange-100/50" style={{ width: '1123px', minHeight: '794px', margin: '0 auto' }}>
                                        <ReceiptSlip title="ORIGINAL" data={receiptData} config={receiptSettings} />
                                        <div className="flex flex-col items-center justify-center gap-4 text-gray-300 bg-orange-50/30 px-1 border-x border-dashed border-orange-200/50">
                                            <i className="fa-solid fa-scissors text-orange-300 text-xs transform -rotate-90"></i>
                                            <span className="text-[9px] font-medium uppercase tracking-[0.2em] whitespace-nowrap opacity-50 text-orange-400" style={{ writingMode: 'vertical-rl', transform: 'rotate(180deg)' }}>Cut Here</span>
                                            <i className="fa-solid fa-scissors text-orange-300 text-xs transform rotate-90"></i>
                                        </div>
                                        <ReceiptSlip title="COPY" data={receiptData} config={receiptSettings} />
                                    </div>
                                </div>
                                
                                <div className="flex flex-col sm:flex-row justify-center gap-4 mt-4 max-w-[800px] w-full mx-auto">
                                    <button onClick={goHome} className="w-full sm:w-1/4 bg-white text-charcoal-900 font-semibold py-4 rounded-xl border border-gray-200 hover:bg-orange-50 transition-colors text-sm tracking-wider">กลับหน้าแรก</button>
                                    {shirtSystemOpen && <button onClick={() => { setIsEditingOrder(true); setView('shirt_form'); }} className="w-full sm:w-1/4 btn-primary py-4 rounded-xl font-semibold text-sm tracking-wider hover:bg-gray-800">แก้ไขข้อมูล</button>}
                                    <button onClick={handleDownloadReceipt} className="w-full sm:w-2/4 btn-gradient py-4 rounded-xl font-semibold flex justify-center items-center gap-2 text-sm tracking-wider shadow-lg shadow-orange-500/20"><i className="fa-solid fa-download"></i> โหลดใบเสร็จ</button>
                                </div>
                            </div>
                        </div>
                        <Footer />
                        <MobileTabBar />
                    </div>

            }

            if (view === 'history_search') {
                return (
                    <div className="min-h-screen flex flex-col relative z-10">
                        <Navbar />
                        <div className="flex-grow flex flex-col items-center justify-center p-6">
                            <div className="luxury-card w-full max-w-md p-10 relative">
                                <button onClick={goHome} className="absolute top-6 left-6 text-gray-400 hover:text-orange-500 transition-colors text-sm">
                                    <i className="fa-solid fa-arrow-left mr-1"></i> กลับหน้าหลัก
                                </button>
                                <div className="text-center mt-10 mb-8">
                                    <h2 className="text-2xl font-semibold text-charcoal-900 tracking-tight">ตรวจสอบประวัติ</h2>
                                    <p className="text-gray-500 mt-2 text-sm font-light">ตรวจสอบประวัติการเข้าร่วมกิจกรรมของคุณ</p>
                                </div>
                                <form onSubmit={(e) => { e.preventDefault(); handleSearchHistory(e.target.studentId.value); }}>
                                    <div className="mb-8">
                                        <input type="text" name="studentId" required placeholder="รหัสนักศึกษา หรือ เลข ปชช." defaultValue={localStorage.getItem('last_student_id')||''}
                                               className="w-full luxury-input text-center tracking-widest text-lg font-medium" />
                                    </div>
                                    <button type="submit" className="w-full btn-gradient py-4 rounded-xl font-semibold tracking-wider text-sm shadow-lg shadow-orange-500/20">
                                        ค้นหาประวัติ <i className="fa-solid fa-search ml-2"></i>
                                    </button>
                                </form>
                            </div>
                        </div>
                        <Footer />
                        <MobileTabBar />
                    </div>
                );
            }

            if (view === 'history_result') {
                return (
                    <div className="min-h-screen flex flex-col relative z-10">
                        <Navbar />
                        <div className="flex-grow flex flex-col items-center pt-8 p-6 pb-20">
                            <div className="luxury-card w-full max-w-2xl p-6 sm:p-10 border-t-4 border-t-orange-500">
                                <div className="flex items-center justify-between mb-8 pb-4 border-b border-orange-100">
                                    <div><h2 className="text-xl font-semibold text-charcoal-900">ประวัติการเข้าร่วมกิจกรรม</h2><p className="text-gray-500 text-sm font-light mt-1">พบข้อมูลทั้งหมด {historyData.length} รายการ</p></div>
                                    <button onClick={() => setView('history_search')} className="text-xs text-orange-500 hover:text-orange-700 bg-orange-50 px-3 py-1.5 rounded-lg transition-colors font-medium">ค้นหาใหม่</button>
                                </div>
                                
                                <div className="space-y-4">
                                    {historyData.length === 0 ? (
                                        <div className="text-center py-16"><p className="text-gray-400 font-light">ไม่พบประวัติการเข้าร่วมกิจกรรม</p></div>
                                    ) : (
                                        <div className="relative border-l border-orange-200 ml-4 sm:ml-6 pl-6 sm:pl-8 space-y-8 py-2">
                                            {historyData.map((h, i) => (
                                                <div key={i} className="relative group">
                                                    <div className="absolute -left-[30px] sm:-left-[38px] top-1.5 w-3 h-3 bg-white border-2 border-orange-500 rounded-full transition-transform group-hover:scale-125 group-hover:bg-orange-100"></div>
                                                    <div className="bg-white p-5 rounded-xl border border-orange-50/80 shadow-[0_2px_10px_rgba(249,115,22,0.03)] transition-all hover:shadow-[0_4px_15px_rgba(249,115,22,0.08)] hover:border-orange-200">
                                                        <div className="flex flex-col sm:flex-row sm:justify-between sm:items-start gap-4">
                                                            <div>
                                                                <p className="text-[10px] text-orange-400 font-medium uppercase tracking-widest mb-1">เข้าร่วมแล้ว</p>
                                                                <h4 className="font-semibold text-charcoal-900 text-lg mb-1">{h.ActivityName}</h4>
                                                                <p className="text-sm text-gray-500 font-light">{h.Name} ({h.StudentID})</p>
                                                            </div>
                                                            <div className="text-xs text-gray-500 font-light whitespace-nowrap bg-orange-50/80 text-orange-700 px-3 py-1.5 rounded-md border border-orange-100">
                                                                {new Date(h.Timestamp).toLocaleString('th-TH')}
                                                            </div>
                                                        </div>
                                                    </div>
                                                </div>
                                            ))}
                                        </div>
                                    )}
                                </div>
                            </div>
                        </div>
                        <Footer />
                        <MobileTabBar />
                    </div>
                );
            }

            const handleAdminLogin = (e) => {
                e.preventDefault();
                if(e.target.username.value === 'admin' && e.target.password.value === '9999') {
                    localStorage.setItem('admin_logged_in', 'true'); loadAdminData();
                } else { 
                    Swal.fire({
                        title: 'ข้อมูลไม่ถูกต้อง', 
                        text: 'รหัสผ่านหรือชื่อผู้ใช้ผิด กรุณาลองใหม่', 
                        icon: 'error',
                        confirmButtonColor: '#ea580c'
                    }).then(() => {
                        goHome();
                    }); 
                }
            };

            if (view === 'admin_login') {
                return (
                    <div className="min-h-screen flex flex-col bg-charcoal-900 relative">
                        <Navbar />
                        <div className="flex-grow flex items-center justify-center p-6 relative z-10">
                            <div className="bg-[#1f1f1f] w-full max-w-md p-10 rounded-2xl border border-[#333] shadow-2xl shadow-orange-500/5">
                                <div className="text-center mb-10">
                                    <h2 className="text-2xl font-light text-white tracking-widest uppercase">Workspace</h2>
                                    <p className="text-gray-500 mt-2 text-sm font-light">สำหรับเจ้าหน้าที่เท่านั้น</p>
                                </div>
                                <form onSubmit={handleAdminLogin} className="space-y-6">
                                    <input type="text" name="username" placeholder="Username" required
                                           className="w-full border-b border-gray-700 bg-transparent text-white px-0 py-3 focus:border-orange-500 outline-none transition-colors font-light text-sm" />
                                    <input type="password" name="password" placeholder="Password" required
                                           className="w-full border-b border-gray-700 bg-transparent text-white px-0 py-3 focus:border-orange-500 outline-none transition-colors font-light text-sm" />
                                    <button type="submit" className="w-full bg-gradient-to-r from-orange-500 to-orange-600 text-white font-semibold py-4 rounded-lg hover:from-orange-400 hover:to-orange-500 transition-colors mt-8 text-sm tracking-wider shadow-lg">LOGIN</button>
                                </form>
                                <button onClick={goHome} className="w-full text-gray-500 hover:text-white mt-6 text-xs transition-colors font-light uppercase tracking-widest">กลับหน้าแรก</button>
                            </div>
                        </div>
                        <div className="absolute bottom-6 w-full text-center z-10">
                            <p className="text-[10px] text-gray-600 font-medium tracking-wider mb-1">Copyright &copy; 2026 DIGIT Good Deed System PRO.</p>
                            <p className="text-[9px] text-gray-700 font-light">ฝ่ายกิจการนักศึกษา คณะเทคโนโลยีดิจิทัล มหาวิทยาลัยราชภัฏเชียงราย</p>
                        </div>
                    </div>
                );
            }

            if (view === 'admin_dashboard') return <AdminDashboard data={adminData} reloadData={loadAdminData} goHome={goHome} setAdminData={setAdminData} />;

            return null;
        }

        function AdminDashboard({ data, reloadData, goHome, setAdminData }) {
            const [activeTab, setActiveTab] = useState('overview');
            const [selectedActivityForSummary, setSelectedActivityForSummary] = useState('');
            const [searchCheckinTerm, setSearchCheckinTerm] = useState('');
            const [selectedActivityForSpss, setSelectedActivityForSpss] = useState('');
            const [currentPage, setCurrentPage] = useState(1);
            const [overviewActivityPage, setOverviewActivityPage] = useState(1);
            const [searchOverviewActTerm, setSearchOverviewActTerm] = useState('');
            const [shirtOrderPage, setShirtOrderPage] = useState(1);
            const itemsPerPage = 10;
            const shirtItemsPerPage = 10;

            const systemOpen = data?.shirtPrice?.systemStatus !== 'maintenance';

            const activeUsersCount = useMemo(() => {
                if (!data || !data.checkins) return 1;
                const fifteenMinsAgo = Date.now() - (15 * 60000);
                const uniqueRecent = new Set();
                
                for (let i = (data.checkins || []).length - 1; i >= 0; i--) {
                    const c = data.checkins[i];
                    if (new Date(c.Timestamp).getTime() >= fifteenMinsAgo) {
                        if (c.StudentID) uniqueRecent.add(String(c.StudentID).trim());
                    } else if (i < (data.checkins || []).length - 150) {
                        break;
                    }
                }
                return uniqueRecent.size > 0 ? uniqueRecent.size + 1 : 1; 
            }, [data]);

            const overviewStats = useMemo(() => {
                if (!data) return { totalUniqueUsers: 0, todayCheckins: 0, todayOrders: 0, todaysTransactions: 0 };
                
                const uniqueUsers = new Set();
                
                const startOfToday = new Date();
                startOfToday.setHours(0, 0, 0, 0);
                const startOfTodayTime = startOfToday.getTime();
                
                let todayCheckins = 0;
                (data.checkins || []).forEach(c => { 
                    if(c.StudentID) uniqueUsers.add(String(c.StudentID).trim()); 
                    if(c.Timestamp && new Date(c.Timestamp).getTime() >= startOfTodayTime) todayCheckins++;
                });
                
                let todayOrders = 0;
                (data.shirtOrders || []).forEach(o => { 
                    if(o.StudentID) uniqueUsers.add(String(o.StudentID).trim()); 
                    if(o.Timestamp && new Date(o.Timestamp).getTime() >= startOfTodayTime) todayOrders++;
                });
                
                (data.evaluations || []).forEach(e => { 
                    if(e.StudentID) uniqueUsers.add(String(e.StudentID).trim()); 
                });
                
                return {
                    totalUniqueUsers: uniqueUsers.size,
                    todayCheckins,
                    todayOrders,
                    todaysTransactions: todayCheckins + todayOrders
                };
            }, [data]);

            const checkinCountByActivity = useMemo(() => {
                const counts = {};
                if (!data || !data.checkins) return counts;
                (data.checkins || []).forEach(c => {
                    const id = String(c.ActivityID).trim();
                    counts[id] = (counts[id] || 0) + 1;
                });
                return counts;
            }, [data]);

            const filteredCheckins = useMemo(() => {
                if (!data || !data.checkins) return [];
                return (data.checkins || []).filter(c => {
                    const matchActivity = selectedActivityForSummary ? String(c.ActivityID).trim() === String(selectedActivityForSummary).trim() : true;
                    if (!matchActivity) return false;
                    
                    const term = (searchCheckinTerm || '').toLowerCase().trim();
                    if (!term) return true;
                    
                    return String(c.StudentID || '').toLowerCase().includes(term) || 
                           String(c.Name || '').toLowerCase().includes(term) || 
                           String(c.Major || '').toLowerCase().includes(term) ||

                });

            const shirtOrdersByMajor = useMemo(() => {

                    const m = o.Major || 'ไม่ระบุสาขา';
                    if(!acc[m]) acc[m] = { count: 0, total: 0 };
                    acc[m].count++;
                    acc[m].total += Number(o.TotalPrice) || 0;
                });
                return Object.entries(acc).sort((a,b) => b[1].count - a[1].count);
            }, [data]);

            const sortedShirtOrders = useMemo(() => {
                return [...(data?.shirtOrders || [])].reverse();
            }, [data]);

            const filteredOverviewActivities = useMemo(() => {
                if (!data || !data.activities) return [];

                return (data.activities || []).filter(a => 
                    String(a.Name || '').toLowerCase().includes(term) ||
                    String(a.Location || '').toLowerCase().includes(term) ||
                    String(a.Date || '').toLowerCase().includes(term)
                );
            }, [data, searchOverviewActTerm]);

            useEffect(() => { setOverviewActivityPage(1); }, [searchOverviewActTerm]);

                    `,
                    showCancelButton: true,

                if (formValues) {

                        Swal.fire({ toast: true, position: 'top-end', showConfirmButton: false, timer: 1500, icon: 'success', title: `ตั้งค่า Popup สำเร็จ` });

                }

            const handleImportCSV = (e) => {

                    if(results.data.length === 0) return Swal.fire('Error', 'Empty CSV', 'error');
                    Swal.fire({ title: `กำลังนำเข้า ${results.data.length} รายการ...`, didOpen: () => { Swal.showLoading() } });
                    try { const res = await runGAS('importCheckins', results.data); if(res.success) { Swal.fire('สำเร็จ', `นำเข้าแล้ว ${res.count} รายการ`, 'success'); reloadData(); } else Swal.fire('Error', res.error, 'error'); } catch(err) { Swal.fire('Error', err.message, 'error'); } e.target.value = '';
                }});

                const selectedActivityName = (data?.activities || []).find(a=>String(a.ActivityID)===String(selectedActivityForSpss))?.Name;

                let mCount = 0; let fCount = 0;
                actCheckins.forEach(c => {
                    if (c.Name && c.Name.trim().startsWith('นาย')) mCount++;
                    else if (c.Name) fCount++;
