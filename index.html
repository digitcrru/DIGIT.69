                    },
                    error: () => {
                        setLoadingPublic(false);
                    }
                });
            };

            useEffect(() => {
                if (publicTab === 'check' && publicData.length === 0) {
                    loadPublicData();
                }
            }, [publicTab]);

            const maskIDCard = (id) => {
                if (!id) return '-';
                const str = String(id);
                if (str.length <= 3) return str;
                return str.substring(0, 3) + 'X'.repeat(Math.max(0, str.length - 3));
            };

            const publicFilteredData = useMemo(() => {
                if (!searchPublic) return publicData;
                const s = searchPublic.toLowerCase();
                return publicData.filter(r => 
                    (r.FullName || '').toLowerCase().includes(s) ||
                    (r.StudentID || '').toLowerCase().includes(s) ||
                    (r.Major || '').toLowerCase().includes(s)
                );
            }, [publicData, searchPublic]);

            const handleSubmit = (e) => {
                e.preventDefault();
                
                // ตรวจสอบความถูกต้องของ Thai ID 13 หลัก
                if (idCard.length !== 13) {
                    Swal.fire({ icon: 'warning', title: 'ข้อมูลไม่ถูกต้อง', text: 'กรุณาระบุ Thai ID (เลขประจำตัวประชาชน) ให้ครบ 13 หลัก', confirmButtonColor: '#ff6600', background: isDarkMode?'#18181b':'#ffffff', color: isDarkMode?'#f8fafc':'#0f172a', customClass:{popup:'rounded-[2rem]', confirmButton:'rounded-xl font-bold px-8 py-3'} });
                    return;
                }

                // ตรวจสอบความถูกต้องของเบอร์โทรศัพท์ 10 หลัก
                if (studentPhone.length !== 10) {
                    Swal.fire({ icon: 'warning', title: 'ข้อมูลไม่ถูกต้อง', text: 'กรุณาระบุเบอร์โทรศัพท์นักศึกษาให้ครบ 10 หลัก', confirmButtonColor: '#ff6600', background: isDarkMode?'#18181b':'#ffffff', color: isDarkMode?'#f8fafc':'#0f172a', customClass:{popup:'rounded-[2rem]', confirmButton:'rounded-xl font-bold px-8 py-3'} });
                    return;
                }
                if (parentPhone.length !== 10) {
                    Swal.fire({ icon: 'warning', title: 'ข้อมูลไม่ถูกต้อง', text: 'กรุณาระบุเบอร์โทรศัพท์ผู้ปกครองให้ครบ 10 หลัก', confirmButtonColor: '#ff6600', background: isDarkMode?'#18181b':'#ffffff', color: isDarkMode?'#f8fafc':'#0f172a', customClass:{popup:'rounded-[2rem]', confirmButton:'rounded-xl font-bold px-8 py-3'} });
                    return;
                }

                setIsSubmitting(true); // ป้องกันกดเบิ้ล
                const payload = {
                    StudentID: studentId, IDCard: idCard, FullName: fullName, Major: major, StudentPhone: studentPhone, ParentPhone: parentPhone,
                    Religion: religion || 'ไม่ระบุ', BloodGroup: bloodGroup === 'อื่นๆ' ? bloodGroupOther || 'อื่นๆ' : bloodGroup || 'ไม่ระบุ',
                    FoodAllergy: foodAllergy === 'ไม่แพ้' ? 'ไม่แพ้' : foodDetail || 'แพ้', SpecificDiet: specificDiet === 'ไม่มี' ? 'ไม่มี' : specificDietDetail || 'มี',
                    Disease: disease === 'ไม่มี' ? 'ไม่มี' : diseaseDetail || 'มี', DrugAllergy: drugAllergy === 'ไม่แพ้' ? 'ไม่แพ้' : drugDetail || 'แพ้'
                };
                Swal.fire({ title: 'กำลังบันทึกข้อมูล...', text: 'กรุณารอสักครู่ ระบบกำลังจัดส่งข้อมูล', allowOutsideClick: false, didOpen: () => Swal.showLoading(), background: isDarkMode?'#18181b':'#ffffff', color: isDarkMode?'#f8fafc':'#0f172a', customClass:{popup:'rounded-[2rem]'} });
                submitToAPI('register', payload).then(res => {
                    setIsSubmitting(false);
                    if(res.success) { Swal.fire({ icon: 'success', title: 'ลงทะเบียนสำเร็จ!', text: 'ยินดีต้อนรับเข้าสู่กิจกรรม', confirmButtonColor: '#ff6600', background: isDarkMode?'#18181b':'#ffffff', color: isDarkMode?'#f8fafc':'#0f172a', customClass:{popup:'rounded-[2rem]', confirmButton:'rounded-xl font-bold px-8 py-3'} }); resetForm(); }
                    else throw new Error(res.message);
                }).catch(err => {
                    setIsSubmitting(false);
                    Swal.fire({icon: 'error', title: 'เกิดข้อผิดพลาด', text: err.message, confirmButtonColor: '#ff6600', background: isDarkMode?'#18181b':'#ffffff', color: isDarkMode?'#f8fafc':'#0f172a', customClass:{popup:'rounded-[2rem]', confirmButton:'rounded-xl font-bold px-8 py-3'}});
                });
            };

            return (
                <div className={`light-mode min-h-screen transition-colors duration-500 ${isDarkMode ? 'dark bg-darkBg text-white' : 'bg-lightBg text-slate-900'}`}>
                    
                    {/* Header */}
                    <header className="glass-panel px-5 md:px-8 py-4 flex justify-between items-center z-30 sticky top-0 no-print shadow-sm border-b-0">
                        <h1 className="text-lg md:text-2xl font-black flex items-center gap-3">
                            <div className="p-2 md:p-2.5 bg-brand rounded-xl md:rounded-2xl text-white shadow-glow-brand transform hover:scale-105 transition-transform"><Icon name="box" size={20}/></div>
                            <span className="tracking-tight hidden sm:block">DIGIT <span className="brand-text-gradient">.69</span></span>
                            <span className="tracking-tight sm:hidden">DIGIT <span className="brand-text-gradient">.69</span></span>
                        </h1>
                        <div className="flex items-center gap-3">
                            <button onClick={() => setIsDarkMode(!isDarkMode)} className="p-2.5 md:p-3 rounded-xl md:rounded-2xl bg-white/50 dark:bg-black/20 hover:bg-white dark:hover:bg-white/10 transition-colors btn-interactive shadow-sm border border-slate-200 dark:border-white/10"><Icon name={isDarkMode ? "sun" : "moon"} size={18} className={isDarkMode ? 'text-yellow-400' : 'text-slate-600'}/></button>
                            <button onClick={handleAdminLogin} className="flex items-center gap-2 px-5 py-2.5 md:py-3 bg-slate-900 dark:bg-white text-white dark:text-slate-900 rounded-xl md:rounded-2xl font-bold text-sm shadow-md hover:shadow-lg hover:-translate-y-0.5 transition-all btn-interactive">
                                <Icon name={isAdmin ? "log-out" : "shield-check"} size={16}/> <span className="hidden sm:inline">{isAdmin ? "ออกจากระบบ" : "เข้าสู่ระบบจัดการ"}</span>
                            </button>
                        </div>
                    </header>

                    <div className="flex h-[calc(100vh-76px)] md:h-[calc(100vh-84px)] overflow-hidden relative z-10">
                        {/* PDPA Modal will only show if user hasn't agreed, isn't admin, and is in the 'register' tab */}
                        {!agreedPDPA && !isAdmin && publicTab === 'register' && <PdpaModal onAccept={() => setAgreedPDPA(true)} isDarkMode={isDarkMode} />}
                        
                        <div className="flex-1 flex flex-col h-full overflow-hidden relative w-full">

                            {/* Main Scrollable Area */}
                            <main className="flex-1 overflow-y-auto p-4 md:p-8 custom-scrollbar">
                                <div className="max-w-7xl mx-auto h-full pb-12">
                                    {isAdmin ? <AdminDashboard goBack={() => setIsAdmin(false)} isDarkMode={isDarkMode} /> : (
                                        <>
                                            {/* Public Toggle Tabs */}
                                            <div className="max-w-md mx-auto mb-6 md:mb-8 bg-white/60 dark:bg-black/40 p-1.5 rounded-2xl border border-slate-200/80 dark:border-white/10 flex backdrop-blur-xl relative z-10 animate-fade-in shadow-sm">
                                                <button onClick={() => setPublicTab('register')} className={`flex-1 py-3.5 px-4 rounded-[0.85rem] text-sm font-bold flex items-center justify-center gap-2 transition-all duration-300 ${publicTab === 'register' ? 'bg-white dark:bg-zinc-800 text-brand shadow-sm scale-100' : 'text-slate-500 hover:text-slate-700 dark:text-slate-400 dark:hover:text-white btn-interactive scale-95 hover:scale-100 hover:bg-white/30 dark:hover:bg-white/5'}`}>
                                                    <Icon name="user-plus" size={18}/> ลงทะเบียน
                                                </button>
                                                <button onClick={() => { setPublicTab('check'); setPublicPage(1); }} className={`flex-1 py-3.5 px-4 rounded-[0.85rem] text-sm font-bold flex items-center justify-center gap-2 transition-all duration-300 ${publicTab === 'check' ? 'bg-white dark:bg-zinc-800 text-brand shadow-sm scale-100' : 'text-slate-500 hover:text-slate-700 dark:text-slate-400 dark:hover:text-white btn-interactive scale-95 hover:scale-100 hover:bg-white/30 dark:hover:bg-white/5'}`}>
                                                    <Icon name="search" size={18}/> ตรวจสอบรายชื่อ
                                                </button>
                                            </div>

                                            {publicTab === 'register' ? (
                                                <div className="max-w-3xl mx-auto glass-panel p-6 md:p-12 rounded-[2.5rem] border border-white/40 dark:border-white/10 shadow-[0_10px_40px_-10px_rgba(0,0,0,0.1)] dark:shadow-[0_10px_40px_-10px_rgba(0,0,0,0.5)] relative overflow-hidden mt-2 animate-fade-in">
                                                    {/* Decorative Top Line */}
                                                    <div className="absolute top-0 left-0 right-0 h-2.5 brand-gradient opacity-90"></div>

                                                    <div className="mb-12 text-center relative">
                                                        <div className="w-24 h-24 bg-brand/10 dark:bg-brand/20 rounded-[2rem] flex items-center justify-center mx-auto mb-6 shadow-glow-brand transform rotate-3 hover:rotate-6 transition-transform duration-500"><Icon name="user-plus" size={40} className="text-brand -rotate-3"/></div>
                                                        <h2 className="text-3xl md:text-4xl font-black mb-3 tracking-tight text-slate-800 dark:text-white">ขึ้นทะเบียนนักศึกษาใหม่</h2>
                                                        <p className="text-slate-500 dark:text-slate-400 font-medium text-sm md:text-base px-4">กรุณากรอกข้อมูลส่วนบุคคลและข้อมูลสุขภาวะตามความเป็นจริง เพื่อการดูแลอย่างมีประสิทธิภาพ</p>
                                                    </div>

                                                    <form onSubmit={handleSubmit} className="space-y-8">
                                                        {/* Section 1: Personal Info */}
                                                        <div className="bg-white/50 dark:bg-black/20 p-6 md:p-8 rounded-[2rem] shadow-sm border border-slate-200/60 dark:border-white/5">
                                                            <SectionHeader icon="user" title="ข้อมูลส่วนตัวเบื้องต้น" colorClass="bg-brand/10 text-brand" />
                                                            
                                                            <div className="space-y-6">
                                                                <div className="grid grid-cols-1 sm:grid-cols-2 gap-5 md:gap-6">
                                                                    <div>
                                                                        <label className="block text-sm font-bold mb-2.5 text-slate-700 dark:text-slate-300">รหัสนักศึกษา <span className="text-red-500">*</span></label>
                                                                        <input type="text" required maxLength="9" inputMode="numeric" placeholder="Ex. 66xxxxxxx" className="w-full input-modern rounded-xl px-4 py-4 font-mono text-sm shadow-sm" value={studentId} onChange={e => setStudentId(e.target.value)} />
                                                                    </div>
                                                                    <div>
                                                                        <label className="block text-sm font-bold mb-1 text-slate-700 dark:text-slate-300">Thai ID (เลขประจำตัวประชาชน) <span className="text-red-500">*</span></label>
                                                                        <p className="text-[11px] text-brand mb-2.5 font-semibold">* สำหรับเชื่อมข้อมูลส่วนตัวเบื้องต้น</p>
                                                                        <div className="relative">
                                                                            <div className="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-slate-400"><Icon name="credit-card" size={18}/></div>
                                                                            <input type="text" required maxLength="13" pattern="[0-9]{13}" inputMode="numeric" placeholder="เลข 13 หลัก" className="w-full input-modern rounded-xl pl-11 pr-4 py-4 font-mono text-sm shadow-sm" value={idCard} onChange={e => setIdCard(e.target.value.replace(/\D/g, ''))} />
                                                                        </div>
                                                                    </div>
                                                                </div>
                                                                <div>
                                                                    <label className="block text-sm font-bold mb-2.5 text-slate-700 dark:text-slate-300">ชื่อ - นามสกุล (ระบุคำนำหน้า) <span className="text-red-500">*</span></label>
                                                                    <input type="text" required placeholder="นาย / นางสาว..." className="w-full input-modern rounded-xl px-4 py-4 text-sm shadow-sm" value={fullName} onChange={e => setFullName(e.target.value)} />
                                                                </div>
                                                                
                                                                <div>
                                                                    <label className="block text-sm font-bold mb-2.5 text-slate-700 dark:text-slate-300">สาขาวิชา <span className="text-red-500">*</span></label>
                                                                    <div className="relative group">
                                                                        <select required className="w-full input-modern rounded-xl px-4 py-4 appearance-none bg-transparent relative z-10 cursor-pointer font-bold text-sm shadow-sm group-hover:border-brand/50 transition-colors" value={major} onChange={e => setMajor(e.target.value)}>
                                                                            <option value="" disabled className="text-slate-400">-- เลือกสาขาวิชา --</option>
                                                                            {MAJOR_LIST.map(m => <option key={m} value={m} className="dark:bg-zinc-800">{m}</option>)}
                                                                        </select>
                                                                        <div className="absolute right-4 top-1/2 -translate-y-1/2 text-brand z-0 group-hover:translate-y-0 transition-transform"><Icon name="chevron-down" size={20}/></div>
                                                                    </div>
                                                                </div>

                                                                <div className="grid grid-cols-1 sm:grid-cols-2 gap-5 md:gap-6 pt-6 border-t border-slate-200/80 dark:border-white/10">
                                                                    <div>
                                                                        <label className="block text-sm font-bold mb-2.5 text-slate-700 dark:text-slate-300">เบอร์โทรศัพท์ นศ. <span className="text-red-500">*</span></label>
                                                                        <div className="relative">
                                                                            <div className="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-slate-400"><Icon name="smartphone" size={18}/></div>
                                                                            <input type="tel" required maxLength="10" pattern="[0-9]{10}" inputMode="numeric" placeholder="08xxxxxxxx (10 หลัก)" className="w-full input-modern rounded-xl pl-11 pr-4 py-4 font-mono text-sm shadow-sm" value={studentPhone} onChange={e => setStudentPhone(e.target.value.replace(/\D/g, ''))} />
                                                                        </div>
                                                                    </div>
                                                                    <div>
                                                                        <label className="block text-sm font-bold mb-2.5 text-slate-700 dark:text-slate-300 flex items-center gap-1.5">เบอร์ ผปค. (ฉุกเฉิน) <span className="text-red-500">*</span></label>
                                                                        <div className="relative">
                                                                            <div className="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-orange-500/50"><Icon name="phone" size={18}/></div>
                                                                            <input type="tel" required maxLength="10" pattern="[0-9]{10}" inputMode="numeric" placeholder="08xxxxxxxx (10 หลัก)" className="w-full input-modern rounded-xl pl-11 pr-4 py-4 font-mono text-sm border-orange-200 focus:border-orange-500 focus:ring-orange-500/20 dark:border-orange-500/30 dark:focus:border-orange-500 shadow-sm" value={parentPhone} onChange={e => setParentPhone(e.target.value.replace(/\D/g, ''))} />
                                                                        </div>
                                                                    </div>
                                                                </div>

                                                                <div className="grid grid-cols-1 sm:grid-cols-2 gap-5 md:gap-6 pt-2">
                                                                    <div>
                                                                        <label className="block text-sm font-bold mb-2.5 text-slate-700 dark:text-slate-300">ศาสนา <span className="text-red-500">*</span></label>
                                                                        <div className="relative group">
                                                                            <select required className="w-full input-modern rounded-xl px-4 py-4 appearance-none bg-transparent relative z-10 cursor-pointer font-bold text-sm shadow-sm group-hover:border-slate-400 transition-colors" value={religion} onChange={e => setReligion(e.target.value)}>
                                                                                <option value="" disabled className="text-slate-400">-- ระบุศาสนา --</option>
                                                                                {['พุทธ', 'อิสลาม', 'คริสต์', 'อื่นๆ'].map(r => <option key={r} value={r} className="dark:bg-zinc-800">{r}</option>)}
                                                                            </select>
                                                                            <div className="absolute right-4 top-1/2 -translate-y-1/2 text-slate-400 z-0 group-hover:translate-y-0 transition-transform"><Icon name="chevron-down" size={20}/></div>
                                                                        </div>
                                                                    </div>
                                                                    <div>
                                                                        <label className="block text-sm font-bold mb-2.5 text-slate-700 dark:text-slate-300">กรุ๊ปเลือด <span className="text-red-500">*</span></label>
                                                                        <TogglePill options={[{label:'A',value:'A'},{label:'B',value:'B'},{label:'O',value:'O'},{label:'AB',value:'AB'},{label:'อื่นๆ',value:'อื่นๆ'}]} value={bloodGroup} onChange={val => { setBloodGroup(val); if(val!=='อื่นๆ') setBloodGroupOther(''); }} />
                                                                        {bloodGroup === 'อื่นๆ' && <input type="text" required placeholder="โปรดระบุ (เช่น Rh-)" className="w-full input-modern rounded-xl px-4 py-4 mt-3 animate-fade-in text-sm shadow-sm" value={bloodGroupOther} onChange={e => setBloodGroupOther(e.target.value)}/>}
                                                                    </div>
                                                                </div>
                                                            </div>
                                                        </div>

                                                        {/* Section 2: Diet */}
                                                        <div className="bg-orange-50/40 dark:bg-orange-950/10 p-6 md:p-8 rounded-[2rem] shadow-sm border border-orange-100 dark:border-orange-500/10 relative overflow-hidden">
                                                            <div className="absolute -right-8 -top-8 text-orange-500/10 dark:text-orange-500/5 rotate-12 pointer-events-none"><Icon name="pizza" size={150}/></div>
                                                            <div className="relative z-10">
                                                                <SectionHeader icon="pizza" title="ข้อมูลโภชนาการ" colorClass="bg-orange-100 dark:bg-orange-500/20 text-orange-600 dark:text-orange-400" />
                                                                <div className="space-y-6 md:space-y-8">
                                                                    <div>
                                                                        <label className="block text-sm font-bold mb-3.5 text-slate-700 dark:text-slate-300">ท่านมีประวัติแพ้อาหารหรือไม่?</label>
                                                                        <TogglePill isWarningType options={[{label: 'ทานได้ปกติ', value: 'ไม่แพ้'}, {label: 'มีประวัติแพ้', value: 'แพ้'}]} value={foodAllergy} onChange={val => { setFoodAllergy(val); if(val==='ไม่แพ้') setFoodDetail(''); }} />
                                                                        {foodAllergy === 'แพ้' && <div className="mt-4 animate-fade-in"><input type="text" required placeholder="โปรดระบุอาหารที่แพ้ (เช่น กุ้ง, ถั่ว, นมวัว)..." className="w-full input-modern border-orange-300 focus:border-orange-500 focus:ring-4 focus:ring-orange-500/20 rounded-xl px-4 py-4 text-sm shadow-sm bg-white dark:bg-black/40" value={foodDetail} onChange={e => setFoodDetail(e.target.value)}/></div>}
                                                                    </div>
                                                                    <div className="pt-6 border-t border-orange-200/50 dark:border-orange-500/20">
                                                                        <label className="block text-sm font-bold mb-3.5 text-slate-700 dark:text-slate-300">ต้องการอาหารที่จัดเตรียมพิเศษหรือไม่?</label>
                                                                        <TogglePill options={[{label: 'อาหารปกติ', value: 'ไม่มี'}, {label: 'ต้องการอาหารพิเศษ', value: 'มี'}]} value={specificDiet} onChange={val => { setSpecificDiet(val); if(val==='ไม่มี') setSpecificDietDetail(''); }} />
                                                                        {specificDiet === 'มี' && (
                                                                            <div className="mt-4 p-6 animate-fade-in bg-white/60 dark:bg-black/40 rounded-2xl border border-orange-200/60 dark:border-orange-500/30 shadow-sm relative">
                                                                                <div className="relative group">
                                                                                    <select required className="w-full input-modern border-orange-200 hover:border-orange-400 focus:border-orange-500 focus:ring-4 focus:ring-orange-500/20 rounded-xl px-4 py-4 appearance-none bg-transparent relative z-10 cursor-pointer font-bold text-sm text-orange-700 dark:text-orange-400 transition-all" value={specificDietDetail} onChange={(e) => setSpecificDietDetail(e.target.value)}>
                                                                                        <option value="" disabled>-- เลือกประเภทโภชนาการ --</option>
                                                                                        {['ฮาลาล', 'มังสวิรัติ', 'เจ'].map(v => <option key={v} value={v} className="text-slate-800 dark:text-slate-200 bg-white dark:bg-zinc-800">{v}</option>)}
                                                                                    </select>
                                                                                    <div className="absolute right-4 top-1/2 -translate-y-1/2 text-orange-500 z-0 group-hover:translate-y-0 transition-transform"><Icon name="chevron-down" size={20}/></div>
                                                                                </div>
                                                                            </div>
                                                                        )}
                                                                    </div>
                                                                </div>
                                                            </div>
                                                        </div>

                                                        {/* Section 3: Health */}
                                                        <div className="bg-red-50/40 dark:bg-red-950/10 p-6 md:p-8 rounded-[2rem] shadow-sm border border-red-100 dark:border-red-500/10 relative overflow-hidden">
                                                            <div className="absolute -right-8 -top-8 text-red-500/10 dark:text-red-500/5 rotate-12 pointer-events-none"><Icon name="heart-pulse" size={150}/></div>
                                                            <div className="relative z-10">
                                                                <SectionHeader icon="heart-pulse" title="ข้อมูลสุขภาพและการแพทย์" colorClass="bg-red-100 dark:bg-red-500/20 text-red-600 dark:text-red-400" />
                                                                <div className="space-y-6 md:space-y-8">
                                                                    <div>
                                                                        <label className="block text-sm font-bold mb-3.5 text-slate-700 dark:text-slate-300">ท่านมีโรคประจำตัวหรือไม่?</label>
                                                                        <TogglePill isWarningType options={[{label: 'ไม่มี', value: 'ไม่มี'}, {label: 'มีโรคประจำตัว', value: 'มี'}]} value={disease} onChange={val => { setDisease(val); if(val==='ไม่มี') setDiseaseDetail(''); }} />
                                                                        {disease === 'มี' && <div className="mt-4 animate-fade-in"><input type="text" required placeholder="โปรดระบุชื่อโรค (เพื่อการเตรียมปฐมพยาบาล)..." className="w-full input-modern border-red-300 focus:border-red-500 focus:ring-4 focus:ring-red-500/20 rounded-xl px-4 py-4 text-sm shadow-sm bg-white dark:bg-black/40" value={diseaseDetail} onChange={e => setDiseaseDetail(e.target.value)}/></div>}
                                                                    </div>
                                                                    <div className="pt-6 border-t border-red-200/50 dark:border-red-500/20">
                                                                        <label className="block text-sm font-bold mb-3.5 text-slate-700 dark:text-slate-300">ท่านมีประวัติแพ้ยาหรือไม่?</label>
                                                                        <TogglePill isWarningType options={[{label: 'ไม่แพ้', value: 'ไม่แพ้'}, {label: 'มีประวัติแพ้ยา', value: 'แพ้'}]} value={drugAllergy} onChange={val => { setDrugAllergy(val); if(val==='ไม่แพ้') setDrugDetail(''); }} />
                                                                        {drugAllergy === 'แพ้' && <div className="mt-4 animate-fade-in"><input type="text" required placeholder="โปรดระบุชื่อกลุ่มยา หรือตัวยาที่แพ้..." className="w-full input-modern border-red-300 focus:border-red-500 focus:ring-4 focus:ring-red-500/20 rounded-xl px-4 py-4 text-sm shadow-sm bg-white dark:bg-black/40" value={drugDetail} onChange={e => setDrugDetail(e.target.value)}/></div>}
                                                                    </div>
                                                                </div>
                                                            </div>
                                                        </div>

                                                        <button disabled={isSubmitting} type="submit" className="w-full py-5 md:py-6 rounded-[1.5rem] md:rounded-[2rem] text-lg font-black text-white brand-gradient shadow-glow-brand hover:shadow-[0_0_35px_rgba(255,102,0,0.5)] transform hover:-translate-y-1 transition-all duration-300 flex justify-center items-center gap-3 mt-12 btn-interactive group border border-white/20">
                                                            {isSubmitting ? (
                                                                <><Icon name="loader-2" className="animate-spin" size={24}/> <span className="tracking-wide">กำลังบันทึกข้อมูล...</span></>
                                                            ) : (
                                                                <><Icon name="save" className="group-hover:scale-110 transition-transform" size={24}/> <span className="tracking-wide">บันทึกและส่งข้อมูลขึ้นทะเบียน</span> <Icon name="arrow-right" className="group-hover:translate-x-2 transition-transform" size={24}/></>
                                                            )}
                                                        </button>
                                                    </form>

                                                    {/* Footer Credit */}
                                                    <div className="mt-20 pt-8 border-t border-slate-200/80 dark:border-white/10 text-center no-print relative">
                                                        <div className="absolute top-0 left-1/2 transform -translate-x-1/2 -translate-y-1/2 bg-white dark:bg-zinc-900 px-4">
                                                            <div className="w-8 h-8 rounded-full bg-slate-100 dark:bg-white/10 flex items-center justify-center text-slate-400"><Icon name="shield-check" size={16}/></div>
                                                        </div>
                                                        <div className="inline-flex items-center justify-center gap-2 px-5 py-2.5 bg-slate-100/80 dark:bg-white/5 rounded-full mb-5 border border-slate-200/80 dark:border-white/10 shadow-sm mt-4"><Icon name="code-2" size={14} className="text-brand"/><p className="text-[10px] text-slate-500 dark:text-slate-400 font-bold tracking-[0.2em] uppercase">System Developer</p></div>
                                                        <p className="text-xl font-black text-slate-800 dark:text-white tracking-[0.3em] uppercase">JENNARONG</p>
                                                        <p className="text-xs text-slate-400 dark:text-slate-500 mt-2 font-medium">DIGIT.69 © {new Date().getFullYear()}</p>
                                                    </div>
                                                </div>
                                            ) : (
                                                <div className="max-w-4xl mx-auto glass-panel p-6 md:p-10 rounded-[2.5rem] border border-white/40 dark:border-white/10 shadow-[0_10px_40px_-10px_rgba(0,0,0,0.1)] dark:shadow-[0_10px_40px_-10px_rgba(0,0,0,0.5)] relative overflow-hidden mt-2 animate-fade-in">
                                                    <div className="absolute top-0 left-0 right-0 h-2.5 brand-gradient opacity-90"></div>
                                                    
                                                    <div className="mb-8 flex flex-col md:flex-row md:items-end justify-between gap-5">
                                                        <div>
                                                            <h2 className="text-2xl md:text-3xl font-black mb-3 tracking-tight text-slate-800 dark:text-white flex items-center gap-3">
                                                                <div className="p-3 bg-brand/10 text-brand rounded-[1rem] shadow-sm"><Icon name="users" size={24}/></div>
                                                                ตรวจสอบผู้ขึ้นทะเบียน
                                                            </h2>
                                                            <p className="text-slate-500 dark:text-slate-400 font-medium text-sm md:text-base">ค้นหาและตรวจสอบรายชื่อนักศึกษาใหม่ที่ขึ้นทะเบียนเรียบร้อยแล้ว</p>
                                                        </div>
                                                        <div className="relative w-full md:w-80 shrink-0 group">
                                                            <div className="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-slate-400 group-focus-within:text-brand transition-colors"><Icon name="search" size={18}/></div>
                                                            <input type="text" placeholder="ค้นหา รหัส นศ., ชื่อ, สาขา..." value={searchPublic} onChange={e => { setSearchPublic(e.target.value); setPublicPage(1); }} className="w-full pl-11 pr-4 py-3.5 rounded-xl border border-slate-200 dark:border-white/10 bg-white/70 dark:bg-black/30 text-sm font-semibold focus:outline-none focus:border-brand focus:ring-2 focus:ring-brand/20 dark:text-white transition-all shadow-sm" />
                                                        </div>
                                                    </div>

                                                    {loadingPublic ? (
                                                        <div className="flex flex-col justify-center items-center py-24">
                                                            <div className="p-5 bg-brand/10 rounded-[1.5rem] mb-5 shadow-glow-brand"><Icon name="loader-2" size={48} className="text-brand animate-spin" /></div>
                                                            <p className="text-slate-500 font-bold tracking-widest uppercase text-sm">กำลังโหลดข้อมูลระบบ...</p>
                                                        </div>
                                                    ) : (
                                                        <div className="bg-white/60 dark:bg-black/20 rounded-[1.5rem] border border-slate-200/80 dark:border-white/10 overflow-hidden shadow-sm">
                                                            <div className="overflow-x-auto p-2">
                                                                <table className="w-full text-sm text-left min-w-[700px]">
                                                                    <thead className="text-[11px] text-slate-500 dark:text-slate-400 uppercase tracking-widest bg-slate-100/80 dark:bg-white/5 rounded-xl border-b border-slate-200/50 dark:border-white/5">
                                                                        <tr>
                                                                            <th className="px-6 py-5 rounded-tl-xl w-36 font-black">รหัสนักศึกษา</th>
                                                                            <th className="px-6 py-5 w-44 font-black">เลขประจำตัวประชาชน</th>
                                                                            <th className="px-6 py-5 font-black">ชื่อ-นามสกุล</th>
                                                                            <th className="px-6 py-5 rounded-tr-xl font-black">สาขาวิชา</th>
                                                                        </tr>
                                                                    </thead>
                                                                    <tbody className="divide-y divide-slate-100 dark:divide-white/5">
                                                                        {(() => {
                                                                            const itemsPerPage = 15;
                                                                            const totalPages = Math.ceil(publicFilteredData.length / itemsPerPage);
                                                                            const indexOfLastItem = publicPage * itemsPerPage;
                                                                            const indexOfFirstItem = indexOfLastItem - itemsPerPage;
                                                                            const currentItems = publicFilteredData.slice(indexOfFirstItem, indexOfLastItem);
                                                                            
                                                                            if (currentItems.length === 0) return <tr><td colSpan="4" className="text-center py-20 text-slate-400 font-medium text-base">ไม่พบข้อมูลผู้ขึ้นทะเบียน</td></tr>;

                                                                            return currentItems.map((row, i) => (
                                                                                <tr key={i} className="hover:bg-white dark:hover:bg-white/5 transition-colors">
                                                                                    <td className="px-6 py-4 font-mono font-bold text-brand">{row.StudentID}</td>
                                                                                    <td className="px-6 py-4 font-mono text-slate-500 dark:text-slate-400 tracking-widest">{maskIDCard(row.IDCard)}</td>
                                                                                    <td className="px-6 py-4 font-bold text-slate-800 dark:text-white">{row.FullName}</td>
                                                                                    <td className="px-6 py-4 text-xs font-bold text-slate-500 dark:text-slate-400">{row.Major}</td>
                                                                                </tr>
                                                                            ));
                                                                        })()}
                                                                    </tbody>
                                                                </table>
                                                            </div>
                                                            {publicFilteredData.length > 0 && (
                                                                <div className="flex flex-col sm:flex-row justify-between items-center p-5 border-t border-slate-200/60 dark:border-white/10 gap-4 bg-slate-50/80 dark:bg-transparent">
                                                                    <span className="text-xs font-semibold text-slate-500">
                                                                        แสดง {((publicPage - 1) * 15) + 1} - {Math.min(publicPage * 15, publicFilteredData.length)} จากทั้งหมด <span className="font-black text-slate-700 dark:text-slate-300">{publicFilteredData.length}</span> รายการ
                                                                    </span>
                                                                    <div className="flex gap-2">
                                                                        <button onClick={() => setPublicPage(p => Math.max(1, p - 1))} disabled={publicPage === 1} className="p-2.5 rounded-xl bg-white dark:bg-white/10 border border-slate-200 dark:border-white/5 disabled:opacity-50 disabled:cursor-not-allowed hover:bg-slate-50 dark:hover:bg-white/20 transition-all btn-interactive shadow-sm hover:shadow-md"><Icon name="chevron-left" size={18}/></button>
                                                                        <span className="px-5 py-2.5 rounded-xl font-bold text-sm bg-brand/10 text-brand border border-brand/20 shadow-sm">หน้า {publicPage} / {Math.ceil(publicFilteredData.length / 15) || 1}</span>
                                                                        <button onClick={() => setPublicPage(p => Math.min(Math.ceil(publicFilteredData.length / 15), p + 1))} disabled={publicPage === Math.ceil(publicFilteredData.length / 15) || Math.ceil(publicFilteredData.length / 15) === 0} className="p-2.5 rounded-xl bg-white dark:bg-white/10 border border-slate-200 dark:border-white/5 disabled:opacity-50 disabled:cursor-not-allowed hover:bg-slate-50 dark:hover:bg-white/20 transition-all btn-interactive shadow-sm hover:shadow-md"><Icon name="chevron-right" size={18}/></button>
                                                                    </div>
                                                                </div>
                                                            )}
                                                        </div>
                                                    )}
                                                </div>
                                            )}
                                        </>
                                    )}
                                </div>
                            </main>
                        </div>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
