<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DIGIT.CRRU - ระบบบริการนักศึกษา</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config={darkMode:'class',theme:{extend:{fontFamily:{sans:['Prompt','sans-serif']},colors:{orange:{50:'#fff7ed',100:'#ffedd5',200:'#fed7aa',300:'#fdba74',400:'#fb923c',500:'#f97316',600:'#ea580c',700:'#c2410c',800:'#9a3412',900:'#7c2d12'},charcoal:{50:'#f9f9f9',100:'#f3f4f6',800:'#374151',900:'#111827'}},animation:{'fade-in-up':'fInUp 0.5s ease-out forwards'},keyframes:{fInUp:{'0%':{opacity:'0',transform:'translateY(15px)'},'100%':{opacity:'1',transform:'translateY(0)'}}}}}};
    </script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <style>
        body{font-family:'Prompt',sans-serif;background-color:#fffcf9;background-image:radial-gradient(at 0% 0%,hsla(28,100%,90%,1) 0,transparent 50%),radial-gradient(at 100% 100%,hsla(28,100%,94%,1) 0,transparent 50%);background-attachment:fixed;color:#111827;min-height:100vh;padding-bottom:80px;-webkit-font-smoothing:antialiased;}@media(min-width:768px){body{padding-bottom:0;}}.luxury-card{background-color:rgba(255,255,255,0.85);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid rgba(255,237,213,0.5);box-shadow:0 10px 35px -10px rgba(249,115,22,0.08);border-radius:1.5rem;transition:all 0.3s ease;}.luxury-card:hover{border-color:rgba(249,115,22,0.35);box-shadow:0 15px 35px -10px rgba(249,115,22,0.15);transform:translateY(-2px);}.luxury-input{background-color:rgba(253,253,253,0.9);border:1px solid #fce7d2;border-radius:1rem;padding:0.85rem 1.25rem;color:#111827;outline:none;transition:all 0.3s ease;}.luxury-input:focus{border-color:#f97316;box-shadow:0 0 0 4px rgba(249,115,22,0.12);}.btn-gradient{background:linear-gradient(135deg,#fb923c 0%,#ea580c 100%);color:#ffffff;border:none;font-weight:700;transition:all 0.3s ease;}.btn-gradient:hover{box-shadow:0 6px 15px rgba(234,88,12,0.25);filter:brightness(1.03);transform:translateY(-1px);}.custom-scrollbar::-webkit-scrollbar{height:6px;width:6px;}.custom-scrollbar::-webkit-scrollbar-thumb{background:#cbd5e1;border-radius:10px;}.modern-table th{background-color:rgba(241,245,249,0.6);color:#475569;font-weight:700;font-size:0.75rem;padding:1rem 1.25rem;border-bottom:2px solid #e2e8f0;}.modern-table td{padding:1rem 1.25rem;border-bottom:1px solid #f1f5f9;color:#334155;}#app-loader{position:fixed;inset:0;background-color:#fffcf9;z-index:999999;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity 0.3s ease;}.loader-spinner{width:40px;height:40px;border:3px solid #ffedd5;border-top-color:#f97316;border-radius:50%;animation:spin 0.8s linear infinite;}@keyframes spin{100%{transform:rotate(360deg);}}html.dark body{background-color:#0f0a08;color:#e5e5e5;}html.dark .bg-white{background-color:#1e1e1e !important;}html.dark .luxury-card{background-color:rgba(30,30,30,0.85);border-color:#333;}html.dark .luxury-input{background-color:#121212;border-color:#333;color:#fff;}
    </style>
</head>
<body>
    <div id="app-loader">
        <div class="loader-spinner mb-4"></div>
        <h2 style="font-weight:700;color:#f97316;">DIGIT.CRRU</h2>
        <p style="color:#6b7280;font-size:12px;margin-top:4px;">กำลังโหลดระบบ...</p>
    </div>
    
    <script>
        window.hideLoader = () => {
            const l = document.getElementById('app-loader');
            if (l) {
                l.style.opacity = '0';
                setTimeout(() => l.style.display = 'none', 300);
            }
        };
        setTimeout(window.hideLoader, 8000);
        
        window.downloadSPSSWord = function(filename) {
            const el = document.getElementById('spss-ex');
            if (!el) return Swal.fire('ข้อผิดพลาด', 'ไม่พบข้อมูลสำหรับส่งออก กรุณาเลือกกิจกรรมก่อน', 'warning');
            const sourceHTML = "<html xmlns:o='urn:schemas-microsoft-com:office:office' xmlns:w='urn:schemas-microsoft-com:office:word' xmlns='http://www.w3.org/TR/REC-html40'><head><meta charset='utf-8'><style>table{border-collapse:collapse;width:100%;margin-bottom:20px;font-family:sans-serif;}th,td{border:1px solid #000;padding:8px;font-size:14px;}h4{margin-top:20px;margin-bottom:10px;font-family:sans-serif;}</style></head><body>" + el.innerHTML + "</body></html>";
            const fileDownload = document.createElement("a");
            document.body.appendChild(fileDownload);
            fileDownload.href = 'data:application/vnd.ms-word;charset=utf-8,' + encodeURIComponent(sourceHTML);
            fileDownload.download = 'รายงานประเมิน_' + filename + '.doc';
            fileDownload.click();
            document.body.removeChild(fileDownload);
        };
        
        if (window.Babel && Babel.availablePresets && Babel.availablePresets['react']) {
            Babel.registerPreset('react-classic', { presets: [[Babel.availablePresets['react'], { runtime: 'classic' }]] });
        }
    </script>
    
    <div id="root"></div>

    <script type="text/babel" data-presets="react-classic,env">
        const { useState, useEffect, useMemo, useCallback } = React;

        const API_CONFIG = {
            SHEET_ID: "1KLJNWUUIj1r6eqCZnaF-F6nA2FQg7pvOHMk0PyDCyAc",
            WEB_APP_URL: "https://script.google.com/macros/s/AKfycbwIFHcOYu_pPLjM6JW8c-55gIzOqh8OAPo6of49Xaz_EjouyX8iZ2XvjEXSympu1aUrAA/exec",
            getCSVUrl: function(s) { 
                return `https://docs.google.com/spreadsheets/d/${this.SHEET_ID}/gviz/tq?tqx=out:csv&sheet=${s}&_=${Date.now()}`; 
            }
        };

        const fetchCSV = (s) => new Promise((res, rej) => { 
            Papa.parse(API_CONFIG.getCSVUrl(s), {
                download: true,
                header: true,
                skipEmptyLines: true,
                complete: (r) => {
                    if (r.data[0] && String(Object.keys(r.data[0])[0]).toLowerCase().includes('html')) {
                        rej(new Error("Denied"));
                    } else {
                        res(r.data || []);
                    }
                },
                error: rej
            }); 
        });

        const runGAS = async (act, ...p) => {
            if (typeof google !== 'undefined' && google.script) {
                return new Promise((rs, rj) => google.script.run.withSuccessHandler(rs).withFailureHandler(rj)[act](...p));
            }
            const r = await fetch(API_CONFIG.WEB_APP_URL, {
                method: 'POST',
                body: JSON.stringify({action: act, params: p}),
                headers: {'Content-Type': 'text/plain;charset=utf-8'}
            });
            const res = await r.json();
            if (!res.success) throw new Error(res.error || "Error");
            return res.data !== undefined ? res.data : res;
        };

        const getVal = (o, k, fb) => {
            if (!o) return '';
            const found = Object.keys(o).find(x => k.some(kw => x.toLowerCase().replace(/\s+/g, '').includes(kw)));
            return found ? o[found] : (o[fb] || '');
        };

        const checkIsOpen = (s) => ['open','true','1','yes'].includes(String(s).trim().toLowerCase());

        const formatTHDate = (ts) => {
            if (!ts) return { date: '-', time: '', full: '-', short: '-' };
            let d = new Date(ts);
            if (isNaN(d.getTime())) return { full: String(ts), short: String(ts) };
            const full = d.toLocaleDateString('th-TH') + ' ' + d.toLocaleTimeString('th-TH', { hour: '2-digit', minute: '2-digit' }) + ' น.';
            const short = d.toLocaleDateString('th-TH', { month: 'short', day: 'numeric' });
            return { full, short, date: d.toLocaleDateString('th-TH'), time: d.toLocaleTimeString('th-TH') };
        };

        const exportExcel = (data, filename, fields, headers) => {
            if(!data || data.length === 0) return Swal.fire('แจ้งเตือน', 'ไม่มีข้อมูลให้ส่งออก', 'warning');
            const exportData = data.map(r => {
                let row = {};
                fields.forEach((f, i) => { 
                    let val = String(getVal(r, [f.toLowerCase()], f));
                    if (f.toLowerCase().includes('idcard') || f.toLowerCase().includes('บัตร')) val = "'" + val; 
                    row[headers[i] || f] = val; 
                });
                return row;
            });
            const ws = XLSX.utils.json_to_sheet(exportData);
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "Data");
            XLSX.writeFile(wb, filename);
        };

        const surveyData = [
            { title: "1. กระบวนการ ขั้นตอนการให้บริการ", questions: [ { id: "q1", text: "1.1 การประชาสัมพันธ์โครงการ ฯ" }, { id: "q2", text: "1.2 ความเหมาะสมของสถานที่" }, { id: "q3", text: "1.3 ความเหมาะสมของระยะเวลา" }, { id: "q4", text: "1.4 การจัดลำดับขั้นตอนของกิจกรรม" } ] },
            { title: "2. การอำนวยความสะดวก", questions: [ { id: "q5", text: "2.1 เอกสาร" }, { id: "q6", text: "2.2 โสตทัศนูปกรณ์" }, { id: "q7", text: "2.3 เจ้าหน้าที่สนับสนุน" }, { id: "q8", text: "2.4 อาหาร,เครื่องดื่มและสถานที่" } ] },
            { title: "3. คุณภาพการให้บริการ", questions: [ { id: "q9", text: "3.1 ท่านได้รับความรู้ แนวคิด ทักษะและประสบการณ์ใหม่ ๆ จากโครงการ" }, { id: "q10", text: "3.2 ท่านสามารถนำสิ่งที่ได้รับจากโครงการ/กิจกรรมนี้ไปใช้ในการปฏิบัติงาน" }, { id: "q11", text: "3.3 สิ่งที่ท่านได้รับจากโครงการ/กิจกรรมครั้งนี้ตรงตามความคาดหวังของท่านหรือไม่" }, { id: "q12", text: "3.4 โครงการ/กิจกรรมนี้เอื้ออำนวยต่อการเรียนรู้และพัฒนาความสามารถของท่าน" }, { id: "q13", text: "3.5 ประโยชน์ที่ท่านได้รับจากโครงการ/กิจกรรม" } ] }
        ];

        // ==========================================
        // UI COMPONENTS
        // ==========================================

        const StatusBadge = ({ status, openLabel='เปิด', closedLabel='ปิด' }) => {
            const isOpen = checkIsOpen(status);
            return (
                <span className={`px-3 py-1 rounded-lg text-[10px] font-bold border uppercase tracking-widest ${isOpen ? 'bg-emerald-50 text-emerald-600 border-emerald-200' : 'bg-gray-50 text-gray-500 border-gray-200'}`}>
                    {isOpen ? openLabel : closedLabel}
                </span>
            );
        };

        const Footer = () => (
            <footer className="w-full py-8 mt-auto flex flex-col items-center justify-center text-center z-10 relative">
                <div className="w-12 h-px bg-orange-300 mb-4 opacity-50"></div>
                <p className="text-[10px] text-gray-500 font-medium">ฝ่ายกิจการนักศึกษา คณะเทคโนโลยีดิจิทัล มหาวิทยาลัยราชภัฏเชียงราย</p>
            </footer>
        );

        const ReceiptSlipComponent = ({ title, data, config, shirtPrice }) => {
            const isPaid = String(data?.status || '').toLowerCase() === 'paid' || String(data?.status || '') === 'ชำระแล้ว';
            return (
                <div className="bg-white p-6 md:p-8 relative flex flex-col w-[48%] overflow-hidden" style={{ minHeight: '100%' }}>
                    {isPaid && (
                        <div className="absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 opacity-[0.03] pointer-events-none -rotate-45 flex flex-col items-center justify-center z-0">
                            <i className="fa-solid fa-circle-check text-[150px] mb-4"></i>
                            <span className="text-[80px] font-black uppercase tracking-[0.2em] leading-none">PAID</span>
                        </div>
                    )}
                    
                    <div className="relative z-10 border-b-2 border-gray-800 pb-5 mb-6 flex justify-between items-start">
                        <div className="max-w-[70%]">
                            <div className="flex items-center gap-3 mb-2">
                                <div className="w-10 h-10 bg-charcoal-900 text-white rounded-lg flex items-center justify-center text-lg shadow-sm">
                                    <i className="fa-solid fa-file-invoice"></i>
                                </div>
                                <div>
                                    <h1 className="text-xl font-black text-charcoal-900 tracking-tight">ใบเสร็จรับเงิน</h1>
                                    <p className="text-[9px] text-gray-500 font-bold tracking-widest uppercase">Official Receipt</p>
                                </div>
                            </div>
                            <h2 className="text-xs font-semibold text-gray-700 whitespace-pre-wrap mt-3 leading-relaxed">{config.header}</h2>
                        </div>
                        <div className="text-right flex flex-col items-end">
                            <div className="inline-block bg-gradient-to-r from-gray-800 to-gray-900 text-white px-3 py-1.5 rounded text-[9px] font-black tracking-widest uppercase mb-3 shadow-sm">{title}</div>
                            <p className="text-[9px] text-gray-400 uppercase font-bold tracking-widest mb-0.5">เลขที่ออเดอร์ / Order No.</p>
                            <p className="text-sm font-black text-charcoal-900 bg-gray-50 px-2 py-1 rounded border border-gray-100">{data.orderId}</p>
                        </div>
                    </div>
                    
                    <div className="relative z-10 flex gap-4 mb-6 bg-orange-50/30 p-4 rounded-xl border border-orange-100/50">
                        <div className="flex-1">
                            <p className="text-[9px] text-orange-600 font-bold uppercase tracking-widest mb-1.5"><i className="fa-solid fa-user-check mr-1"></i> ได้รับเงินจาก / Received From</p>
                            <p className="font-bold text-charcoal-900 text-sm mb-0.5">{data.student.Name}</p>
                            <p className="text-xs text-gray-600 font-medium line-clamp-1">{data.student.Major}</p>
                            <p className="text-[10px] text-gray-500 font-medium mt-1">รหัสนักศึกษา: <span className="font-bold text-charcoal-900">{data.student.StudentID}</span></p>
                        </div>
                        <div className="w-px bg-orange-200/50 my-2"></div>
                        <div className="w-1/3">
                            <p className="text-[9px] text-orange-600 font-bold uppercase tracking-widest mb-1.5"><i className="fa-solid fa-calendar-day mr-1"></i> วันที่ / Date</p>
                            <p className="font-bold text-charcoal-900 text-sm">{data.date.split(' ')[0]}</p>
                            <p className="text-xs text-gray-500 font-medium mt-0.5">{data.date.split(' ')[1] || ''}</p>
                        </div>
                    </div>
                    
                    <div className="relative z-10 flex-grow mb-6">
                        <div className="bg-gray-50 rounded-xl border border-gray-100 overflow-hidden">
                            <table className="w-full text-sm text-left">
                                <thead className="bg-gray-100/80 text-[9px] text-gray-500 font-bold uppercase tracking-widest border-b border-gray-200">
                                    <tr>
                                        <th className="py-3 px-4">รายการ (Description)</th>
                                        <th className="py-3 px-4 text-center w-16">จำนวน</th>
                                        <th className="py-3 px-4 text-right w-28">ราคา (Amount)</th>
                                    </tr>
                                </thead>
                                <tbody className="divide-y divide-gray-100">
                                    {[ 
                                        { n: 'เสื้อคอปกโปโล (Polo)', g: data.poloGender, s: data.poloSize, q: data.poloQty }, 
                                        { n: 'เสื้อยืดกิจกรรม (T-Shirt)', g: data.tshirtGender, s: data.tshirtSize, q: data.tshirtQty }
                                    ].filter(item => item.q > 0).map((item, idx) => (
                                        <tr key={idx} className="bg-white">
                                            <td className="py-3 px-4">
                                                <p className="font-bold text-charcoal-900 text-xs">{item.n}</p>
                                                <p className="text-[10px] text-gray-500 font-medium mt-0.5">ทรง: {item.g} | ไซส์: <span className="font-bold text-charcoal-900">{item.s}</span></p>
                                            </td>
                                            <td className="py-3 px-4 text-center font-bold text-charcoal-900 text-xs bg-gray-50/50">{item.q}</td>
                                            <td className="py-3 px-4 text-right font-bold text-charcoal-900 text-xs">
                                                ฿{((['XL', '2XL', '3XL'].includes(item.s) ? shirtPrice.oversize : shirtPrice.normal) * item.q).toLocaleString()}
                                            </td>
                                        </tr>
                                    ))}
                                </tbody>
                            </table>
                        </div>
                    </div>
                    
                    <div className="relative z-10 mt-auto flex flex-col gap-4">
                        <div className="flex justify-between items-end bg-charcoal-900 text-white p-4 rounded-xl shadow-md">
                            <div>
                                <span className="text-[10px] text-gray-400 font-bold uppercase tracking-widest mb-1 block">รวมเงินทั้งสิ้น / Grand Total</span>
                                <div className="flex items-center gap-2 mt-1">
                                    {data.paymentMethod === 'cash' ? (
                                        <span className="inline-flex items-center gap-1 bg-amber-500/20 text-amber-300 border border-amber-500/30 px-2 py-0.5 rounded text-[9px] font-bold">
                                            <i className="fa-solid fa-money-bill-wave"></i> เงินสด (Cash)
                                        </span>
                                    ) : (
                                        <span className="inline-flex items-center gap-1 bg-emerald-500/20 text-emerald-300 border border-emerald-500/30 px-2 py-0.5 rounded text-[9px] font-bold">
                                            <i className="fa-solid fa-qrcode"></i> โอนเงิน (PromptPay)
                                        </span>
                                    )}
                                    {isPaid && <span className="inline-flex items-center gap-1 bg-blue-500/20 text-blue-300 border border-blue-500/30 px-2 py-0.5 rounded text-[9px] font-bold"><i className="fa-solid fa-check-double"></i> ยืนยันแล้ว</span>}
                                </div>
                            </div>
                            <div className="text-right">
                                <span className="text-xl font-black tracking-tight">฿ {data.grandTotal.toLocaleString()}</span>
                            </div>
                        </div>
                        
                        <div className="flex justify-between items-end gap-6 px-1">
                            <div className="flex-1 text-[9px] text-gray-500 font-medium leading-relaxed bg-gray-50 p-3 rounded-lg border border-gray-100">
                                <span className="font-bold text-gray-700 uppercase tracking-widest"><i className="fa-solid fa-circle-info text-orange-400 mr-1"></i> หมายเหตุ (Note):</span><br/>
                                <span className="whitespace-pre-wrap">{config.note}</span>
                            </div>
                            <div className="w-[35%] flex flex-col items-center">
                                <div className="w-full border-b border-dashed border-gray-400 mb-2 h-6 relative">
                                    {isPaid && (
                                        <div className="absolute -top-3 left-1/2 -translate-x-1/2 text-[10px] text-emerald-500 font-black border-2 border-emerald-500 px-2 py-0.5 rounded -rotate-12 bg-white/80">RECEIVED</div>
                                    )}
                                </div>
                                <p className="text-[10px] font-bold text-charcoal-900 mb-0.5">ผู้รับเงิน / Receiver</p>
                                <p className="text-[8px] text-gray-400 uppercase tracking-widest">Authorized Signature</p>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        const ShirtSection = ({ num, title, genderState, setGenderState, sizeState, setSizeState, qtyState, setQtyState, getPrice }) => (
            <div className="mb-6">
                <h3 className="font-semibold text-charcoal-900 mb-3 flex items-center text-sm">
                    <span className="text-orange-500 mr-2">{num}.</span> {title}
                </h3>
                <div className="border border-orange-50/80 rounded-2xl p-4 sm:p-5 bg-white shadow-sm">
                    <div className="mb-4">
                        <label className="block text-[10px] font-medium text-gray-400 uppercase tracking-widest mb-2">ทรงเสื้อ</label>
                        <div className="flex gap-3">
                            {['ชาย', 'หญิง'].map(g => (
                                <label key={`${num}-${g}`} className={`flex-1 py-2.5 rounded-xl border text-center cursor-pointer text-xs font-bold transition-all ${genderState === g ? 'border-orange-500 bg-orange-500 text-white shadow-md' : 'border-gray-200 text-gray-500 hover:border-orange-300'}`}>
                                    <input type="radio" className="hidden" checked={genderState === g} onChange={() => setGenderState(g)} /> ทรง{g}
                                </label>
                            ))}
                        </div>
                    </div>
                    <div className="mb-4">
                        <label className="block text-[10px] font-medium text-gray-400 uppercase tracking-widest mb-2">ขนาด (Size)</label>
                        <div className="grid grid-cols-3 sm:grid-cols-6 gap-2">
                            {['S', 'M', 'L', 'XL', '2XL', '3XL'].map(size => (
                                <label key={`${num}-${size}`} className={`relative flex flex-col items-center py-2.5 rounded-xl border cursor-pointer transition-all ${sizeState === size ? 'border-orange-500 bg-orange-50 text-orange-600 shadow-sm' : 'border-gray-200 text-gray-500 hover:border-orange-300'}`}>
                                    <input type="radio" className="hidden" checked={sizeState === size} onChange={() => setSizeState(size)} />
                                    <span className="text-xs font-bold">{size}</span>
                                    <span className="text-[9px] opacity-70 mt-0.5">฿{getPrice(size)}</span>
                                </label>
                            ))}
                        </div>
                    </div>
                    <div className="flex justify-between items-center bg-orange-50/50 p-3 rounded-xl border border-orange-100">
                        <label className="text-[10px] font-bold text-gray-500 uppercase tracking-widest">จำนวน (ตัว)</label>
                        <div className="flex items-center gap-3">
                            <button type="button" onClick={() => setQtyState(Math.max(1, qtyState - 1))} className="w-7 h-7 rounded border border-orange-200 bg-white text-orange-500 hover:bg-orange-100 transition-colors">
                                <i className="fa-solid fa-minus text-[10px]"></i>
                            </button>
                            <span className="font-bold text-charcoal-900 w-6 text-center text-sm">{qtyState}</span>
                            <button type="button" onClick={() => setQtyState(qtyState + 1)} className="w-7 h-7 rounded border border-orange-200 bg-white text-orange-500 hover:bg-orange-100 transition-colors">
                                <i className="fa-solid fa-plus text-[10px]"></i>
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        );

        function DataTable({ data, columns, excelHeaders, exportName, filterOptions, filterKey, searchKeys, renderRow }) {
            const [page, setPage] = useState(1); 
            const [search, setSearch] = useState(''); 
            const [filter, setFilter] = useState(''); 
            const limit = 10;
            
            const filtered = useMemo(() => data.filter(item => {
                if (filter && String(getVal(item, [filterKey.toLowerCase()], filterKey)) !== String(filter)) return false;
                if (!search) return true; 
                return searchKeys.some(k => String(getVal(item, [k.toLowerCase()], k)).toLowerCase().includes(search.toLowerCase()));
            }), [data, search, filter, filterKey, searchKeys]);
            
            const paginated = filtered.slice((page - 1) * limit, page * limit); 
            const totalPage = Math.ceil(filtered.length / limit) || 1;
            
            return (
                <div className="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden text-sm">
                    <div className="p-4 bg-gray-50/50 border-b border-gray-100 flex flex-col sm:flex-row gap-3 justify-between">
                        <div className="flex gap-2 flex-1 max-w-md">
                            {filterOptions && (
                                <select className="border rounded-xl px-3 py-1.5 text-xs bg-white outline-none" value={filter} onChange={e=>{setFilter(e.target.value);setPage(1);}}>
                                    <option value="">ทั้งหมด</option>
                                    {filterOptions.map(o => <option key={o.val} value={o.val}>{o.label}</option>)}
                                </select>
                            )}
                            <input type="text" placeholder="ค้นหาข้อมูล..." value={search} onChange={e=>{setSearch(e.target.value);setPage(1);}} className="border rounded-xl px-3 py-1.5 text-xs flex-1 bg-white outline-none focus:border-orange-500" />
                        </div>
                        {exportName && (
                            <button onClick={() => exportExcel(filtered, exportName, columns, excelHeaders)} className="btn-gradient px-4 py-1.5 rounded-xl text-xs">
                                <i className="fa-solid fa-download mr-1"></i>Excel
                            </button>
                        )}
                    </div>
                    <div className="overflow-x-auto">
                        <table className="w-full text-left modern-table whitespace-nowrap">
                            <thead>
                                <tr>{excelHeaders.map((h, i) => <th key={i}>{h}</th>)}</tr>
                            </thead>
                            <tbody>
                                {paginated.map((r, i) => renderRow(r, i))}
                                {filtered.length === 0 && <tr><td colSpan={excelHeaders.length} className="text-center py-8 text-gray-400">ไม่พบข้อมูล</td></tr>}
                            </tbody>
                        </table>
                    </div>
                    <div className="flex justify-between items-center p-4 bg-gray-50/50 border-t border-gray-100 text-xs">
                        <span className="text-gray-500 font-medium">รวม {filtered.length} รายการ</span>
                        <div className="flex gap-1">
                            <button disabled={page===1} onClick={()=>setPage(p=>p-1)} className="px-2 py-1 bg-white border rounded disabled:opacity-40">ก่อนหน้า</button>
                            <span className="px-3 py-1 bg-orange-50 font-bold text-orange-600 rounded">หน้า {page}/{totalPage}</span>
                            <button disabled={page===totalPage} onClick={()=>setPage(p=>p+1)} className="px-2 py-1 bg-white border rounded disabled:opacity-40">ถัดไป</button>
                        </div>
                    </div>
                </div>
            );
        }

        // ==========================================
        // ADMIN DASHBOARD
        // ==========================================
        function AdminDashboard({ db, setDb, sysConfig, setSysConfig, toggleCache, goHome, reloadData }) {
            const [tab, setTab] = useState('overview'); 
            const [spssActId, setSpssActId] = useState('');
            
            useEffect(() => { reloadData(true); }, []);

            const toggleStatus = async (type, id, cur) => {
                const ns = String(cur).toLowerCase() === 'open' ? 'closed' : 'open'; 
                Swal.fire({title: 'กำลังบันทึก...', didOpen: () => Swal.showLoading()});
                try {
                    if(type === 'sys_main') { await runGAS('updateSetting','SystemStatus',ns); toggleCache('SYS_MAIN',ns); setSysConfig(p=>({...p,main:ns})); }
                    if(type === 'sys_recruit') { await runGAS('updateSetting','RecruitStatus',ns); toggleCache('SYS_RECRUIT',ns); setSysConfig(p=>({...p,recruit:ns})); }
                    if(type === 'sys_shirt') { await runGAS('updateSetting','ShirtStatus',ns); toggleCache('SYS_SHIRT',ns); setSysConfig(p=>({...p,shirt:ns})); }
                    if(type === 'act') { await runGAS('toggleActivityStatus',id,ns); toggleCache(`ACT_${id}`,ns); setDb(p=>({...p,acts:p.acts.map(a=>a.ActivityID===id?{...a,Status:ns}:a)})); }
                    if(type === 'rec') { await runGAS('toggleRecruitStatus',id,ns); toggleCache(`REC_${id}`,ns); setDb(p=>({...p,recs:p.recs.map(r=>r.RecruitID===id?{...r,Status:ns}:r)})); }
                    if(type === 'order') { 
                        const os = String(cur).toLowerCase() === 'received' ? 'paid' : 'received'; 
                        await runGAS('updateShirtOrderStatus',id,os); 
                        setDb(p=>({...p, orders:p.orders.map(o=>getVal(o,['studentid','รหัส'])===id?{...o,Status:os}:o)})); 
                    }
                    Swal.fire({toast:true, position:'top-end', icon:'success', title:'อัปเดตสำเร็จ', timer:1500, showConfirmButton:false});
                } catch(e) { Swal.fire('Error', e.message, 'error'); }
            };

            const renderSpssContent = () => {
                if(!spssActId) return (
                    <div className="text-center py-12 text-gray-400 border border-dashed rounded-2xl bg-gray-50/50 mt-6">
                        <i className="fa-solid fa-chart-pie text-3xl mb-2 text-orange-300 block"></i>ยังไม่ได้เลือกกิจกรรม
                    </div>
                );
                
                const act = db.acts.find(a => String(a.ActivityID) === String(spssActId)); 
                const actName = act ? String(act.Name).trim() : '';
                
                const evals = db.evals.filter(e => {
                    const eid = String(getVal(e, ['activityid', 'รหัสกิจกรรม'], 'ActivityID')).trim();
                    const ename = String(getVal(e, ['activityname', 'ชื่อกิจกรรม'], 'ActivityName')).trim();
                    return eid === String(spssActId).trim() || (actName && ename === actName);
                });
                
                if(evals.length === 0) return (
                    <div className="text-center py-12 text-gray-400 border border-dashed rounded-2xl bg-white mt-6">
                        <i className="fa-solid fa-folder-open text-3xl mb-2 text-gray-300 block"></i>ไม่พบข้อมูลการประเมินในกิจกรรมนี้
                    </div>
                );

                let m = 0, f = 0; 
                evals.forEach(e => {
                    const sid = String(getVal(e, ['studentid', 'รหัส'], 'StudentID')).trim(); 
                    const chk = db.checks.find(c => String(getVal(c, ['studentid', 'รหัส'], 'StudentID')).trim() === sid);
                    const name = chk ? String(getVal(chk, ['name', 'ชื่อ'], 'Name')).trim() : ''; 
                    if (name.startsWith('นาย')) m++; else if (name) f++;
                });
                
                if(m === 0 && f === 0) { f = evals.length; } 
                
                const total = m + f || 1; 
                const mPct = ((m / total) * 100).toFixed(2); 
                const fPct = ((f / total) * 100).toFixed(2);
                
                const getMeanText = (v) => v >= 4.51 ? 'มากที่สุด' : v >= 3.51 ? 'มาก' : v >= 2.51 ? 'ปานกลาง' : v >= 1.51 ? 'น้อย' : 'น้อยที่สุด';
                
                const categoryStats = []; 
                let qIdx = 1; 
                let allScores = []; 
                const allQStats = [];
                
                surveyData.forEach(cat => {
                    let catS = []; 
                    const qStats = [];
                    cat.questions.forEach(q => {
                        const k = ['Q1_1','Q1_2','Q1_3','Q1_4','Q2_1','Q2_2','Q2_3','Q2_4','Q3_1','Q3_2','Q3_3','Q3_4','Q3_5'][qIdx-1];
                        const scores = evals.map(e => Number(getVal(e, [k.toLowerCase(), `q${qIdx}`], k)) || 0).filter(s => s > 0);
                        allScores.push(...scores); 
                        catS.push(...scores);
                        let mean = 0, sd = 0; 
                        if(scores.length > 0){ 
                            mean = scores.reduce((a,b)=>a+b, 0) / scores.length; 
                            if(scores.length > 1) sd = Math.sqrt(scores.reduce((a,b) => a + Math.pow(b - mean, 2), 0) / (scores.length - 1)); 
                        }
                        const qs = { no: q.text.split(' ')[0], text: q.text.split(' ').slice(1).join(' '), mean, sd };
                        qStats.push(qs); 
                        allQStats.push(qs); 
                        qIdx++;
                    });
                    let cMean = 0, cSd = 0; 
                    if(catS.length > 0){ 
                        cMean = catS.reduce((a,b) => a+b, 0) / catS.length; 
                        if(catS.length > 1) cSd = Math.sqrt(catS.reduce((a,b) => a + Math.pow(b - cMean, 2), 0) / (catS.length - 1)); 
                    }
                    categoryStats.push({ title: cat.title, mean: cMean, sd: cSd, questions: qStats });
                });

                let gMean = 0, gSd = 0; 
                if(allScores.length > 0){ 
                    gMean = allScores.reduce((a,b) => a+b, 0) / allScores.length; 
                    if(allScores.length > 1) gSd = Math.sqrt(allScores.reduce((a,b) => a + Math.pow(b - gMean, 2), 0) / (allScores.length - 1)); 
                }
                
                const topQ = [...allQStats].sort((a,b) => b.mean - a.mean);
                const comments = evals.map(e => String(getVal(e, ['comment', 'ข้อเสนอแนะ'], 'Comment')).trim()).filter(t => t && t !== '-' && t !== '.' && !t.includes('ไม่มี'));
                
                return (
                    <div className="mt-6 animate-fade-in-up">
                        <div id="spss-ex" className="bg-white p-6 rounded-2xl border border-gray-100 shadow-sm max-w-4xl mx-auto text-sm leading-relaxed text-gray-700">
                            <h3 className="text-center font-bold text-base text-gray-900 mb-4">รายงานผลการประเมินความพึงพอใจโครงการ<br/><span className="text-orange-600 font-extrabold">{actName}</span></h3>
                            <p className="font-bold mb-2">เกณฑ์ในการแปลความหมายของค่าคะแนนเฉลี่ย แบ่งออกเป็น 5 ระดับ คือ</p>
                            <ul className="list-disc pl-5 mb-4 text-xs space-y-0.5">
                                <li>ค่าเฉลี่ยระหว่าง 4.51 - 5.00 หมายถึง มีความพึงพอใจมากที่สุด</li>
                                <li>ค่าเฉลี่ยระหว่าง 3.51 - 4.50 หมายถึง มีความพึงพอใจมาก</li>
                                <li>ค่าเฉลี่ยระหว่าง 2.51 - 3.50 หมายถึง มีความพึงพอใจปานกลาง</li>
                                <li>ค่าเฉลี่ยระหว่าง 1.51 - 2.50 หมายถึง มีความพึงพอใจน้อย</li>
                                <li>ค่าเฉลี่ยระหว่าง 1.00 - 1.50 หมายถึง มีความพึงพอใจน้อยที่สุด</li>
                            </ul>
                            
                            <h4 className="font-bold text-gray-900 mt-4 mb-2">ตารางที่ 1 จำนวนและร้อยละของผู้ตอบแบบสอบถาม จำแนกตามลักษณะเพศ</h4>
                            <table className="w-full border-collapse border text-xs text-center mb-2">
                                <thead className="bg-gray-50"><tr><th className="border p-2">เพศ</th><th className="border p-2">จำนวน (คน)</th><th className="border p-2">ร้อยละ (%)</th></tr></thead>
                                <tbody>
                                    <tr><td className="border p-2 text-left pl-6">ชาย</td><td className="border p-2">{m}</td><td className="border p-2">{mPct}</td></tr>
                                    <tr><td className="border p-2 text-left pl-6">หญิง</td><td className="border p-2">{f}</td><td className="border p-2">{fPct}</td></tr>
                                    <tr className="bg-gray-50 font-bold"><td className="border p-2 text-right pr-6">รวม</td><td className="border p-2">{m+f}</td><td className="border p-2">100.00</td></tr>
                                </tbody>
                            </table>
                            <p className="text-xs text-gray-600 mb-6 indent-8">จากตารางที่ 1 พบว่า ผู้ตอบแบบสอบถามส่วนใหญ่เป็นเพศ{m>=f?'ชาย':'หญิง'} จำนวน {Math.max(m,f)} คน คิดเป็นร้อยละ {m>=f?mPct:fPct} และเพศ{m<f?'ชาย':'หญิง'} จำนวน {Math.min(m,f)} คน คิดเป็นร้อยละ {m<f?mPct:fPct}</p>

                            <h4 className="font-bold text-gray-900 mt-4 mb-2">ตารางที่ 2 แสดงค่าเฉลี่ย และค่าเบี่ยงเบนมาตรฐาน ความพึงพอใจ จำแนกตามด้าน</h4>
                            <table className="w-full border-collapse border text-xs text-left mb-2">
                                <thead className="bg-gray-50 text-center"><tr><th className="border p-2 w-12">ข้อ</th><th className="border p-2">รายการประเมิน</th><th className="border p-2 w-14">x̄</th><th className="border p-2 w-14">S.D.</th><th className="border p-2 w-20">ระดับ</th></tr></thead>
                                <tbody>
                                    {categoryStats.map((c,i)=>(
                                        <React.Fragment key={i}>
                                            <tr className="bg-orange-50/40 font-bold"><td colSpan="2" className="border p-2 text-orange-800">{c.title}</td><td className="border p-2 text-center">{c.mean.toFixed(2)}</td><td className="border p-2 text-center">{c.sd.toFixed(2)}</td><td className="border p-2 text-center text-orange-700">{getMeanText(c.mean)}</td></tr>
                                            {c.questions.map(q=><tr key={q.no}><td className="border p-2 text-center text-gray-400">{q.no}</td><td className="border p-2 text-gray-600">{q.text}</td><td className="border p-2 text-center font-medium">{q.mean.toFixed(2)}</td><td className="border p-2 text-center text-gray-400">{q.sd.toFixed(2)}</td><td className="border p-2 text-center text-gray-500">{getMeanText(q.mean)}</td></tr>)}
                                        </React.Fragment>
                                    ))}
                                    <tr className="bg-gray-100 font-extrabold text-gray-900"><td colSpan="2" className="border p-2 text-right pr-4">รวมเฉลี่ยภาพรวม</td><td className="border p-2 text-center text-indigo-600">{gMean.toFixed(2)}</td><td className="border p-2 text-center text-gray-500">{gSd.toFixed(2)}</td><td className="border p-2 text-center text-indigo-600">{getMeanText(gMean)}</td></tr>
                                </tbody>
                            </table>
                            <p className="text-xs text-gray-600 mb-6 indent-8">จากตารางที่ 2 ผลการสำรวจความพึงพอใจในการจัดกิจกรรม พบว่า ผู้ตอบแบบสอบถามส่วนใหญ่มีความพึงพอใจในระดับ<span className="font-bold text-gray-800">{getMeanText(gMean)}</span> โดยมีค่าเฉลี่ยเท่ากับ ({gMean.toFixed(2)}) ซึ่งเมื่อพิจารณาเป็นรายข้อ พบว่า อันดับที่ 1 คือ <span className="font-bold">{topQ[0]?.text||'-'}</span> (ค่าเฉลี่ย {topQ[0]?.mean.toFixed(2)}) รองลงมาคือ <span className="font-bold">{topQ[1]?.text||'-'}</span> (ค่าเฉลี่ย {topQ[1]?.mean.toFixed(2)}) และอันดับที่ 3 คือ <span className="font-bold">{topQ[2]?.text||'-'}</span> (ค่าเฉลี่ย {topQ[2]?.mean.toFixed(2)})ตามลำดับ</p>

                            <h4 className="font-bold text-gray-900 mt-4 mb-1">ตอนที่ 3 ข้อเสนอแนะ</h4>
                            <ul className="list-decimal pl-5 text-xs text-gray-600 space-y-1">{comments.length>0?comments.map((c,i)=><li key={i}>{c}</li>):<li>ไม่มีข้อเสนอแนะเพิ่มเติม</li>}</ul>
                        </div>
                        <div className="flex justify-center mt-4 bg-white p-4 rounded-xl border max-w-4xl mx-auto"><p className="text-xs font-semibold text-emerald-600"><i className="fa-solid fa-circle-check mr-1"></i>วิเคราะห์ข้อมูลและสรุปความเรียงตามข้อกำหนดเรียบร้อยแล้ว แอดมินสามารถกดปุ่ม "โหลดรายงาน Word" ด้านบนเพื่อนำไฟล์ไปใช้งานได้ทันที</p></div>
                    </div>
                );
            };

            const menuGroups = [
                { title:'แดชบอร์ด', items:[{ id:'overview', icon:'fa-chart-pie', label:'ภาพรวมระบบ' }] },
                { title:'ระบบกิจกรรม', items:[{ id:'acts', icon:'fa-list', label:'จัดการกิจกรรม' }, { id:'checks', icon: 'fa-user-check', label: 'ยอดเช็คชื่อ' }, { id: 'evals', icon: 'fa-file-lines', label: 'รายงานผลประเมิน' }] },
                { title:'ระบบรับสมัคร', items:[{ id:'recs', icon:'fa-bullhorn', label:'จัดการรับสมัคร' }, { id:'regis', icon:'fa-user-plus', label:'ข้อมูลผู้สมัคร' }] },
                { title:'ระบบสั่งจองเสื้อ', items:[{ id:'shirts', icon:'fa-shirt', label:'สรุปการสั่งจองเสื้อ' }] }
            ];

            return (
                <div className="min-h-screen flex bg-gray-50/50">
                    <aside className="w-64 bg-charcoal-900 text-white flex flex-col fixed h-full z-20 border-r border-charcoal-800">
                        <div className="p-5 border-b border-gray-800"><h2 className="text-lg font-bold text-orange-500 uppercase tracking-widest">Workspace</h2></div>
                        <nav className="flex-1 p-4 space-y-5 overflow-y-auto custom-scrollbar">
                            {menuGroups.map((g,i)=>(
                                <div key={i} className="space-y-1">
                                    <p className="text-[10px] text-gray-500 font-bold uppercase tracking-widest px-3 mb-1">{g.title}</p>
                                    {g.items.map(m=><button key={m.id} onClick={()=>setTab(m.id)} className={`w-full flex items-center gap-3 text-left px-3 py-2 rounded-xl text-xs font-medium transition-all ${tab===m.id ? 'bg-gradient-to-r from-orange-500 to-orange-600 text-white shadow-md font-bold' : 'text-gray-400 hover:text-white hover:bg-white/5 border border-transparent'}`}><i className={`fa-solid ${m.icon} w-4 text-center opacity-80`}></i>{m.label}</button>)}
                                </div>
                            ))}
                        </nav>
                        <div className="p-4 border-t border-gray-800 space-y-2">
                            <button onClick={()=>toggleStatus('sys_main', null, sysConfig.main)} className={`w-full px-4 py-2.5 rounded-xl text-xs font-medium border flex justify-between items-center transition-colors ${checkIsOpen(sysConfig.main)?'bg-emerald-900/30 text-emerald-500 border-emerald-800/50':'bg-black/50 text-gray-500 border-gray-800'}`}>ระบบหลัก <i className={`fa-solid ${checkIsOpen(sysConfig.main)?'fa-toggle-on':'fa-toggle-off'} text-lg`}></i></button>
                            <button onClick={goHome} className="w-full text-center py-2 text-[10px] font-bold text-gray-400 hover:text-white uppercase tracking-widest transition-colors block"><i className="fa-solid fa-arrow-left mr-2"></i>ออกระบบ</button>
                        </div>
                    </aside>
                    <main className="flex-1 ml-64 p-8 h-screen overflow-y-auto">
                        <div className="flex justify-between items-end mb-6 border-b border-orange-100 pb-4">
                            <div><p className="text-[9px] font-bold text-orange-500 uppercase tracking-widest mb-1 bg-orange-50 inline-block px-2 py-0.5 rounded">Admin Panel</p><h2 className="text-2xl font-bold text-charcoal-900 tracking-tight">{menuGroups.flatMap(g=>g.items).find(m=>m.id===tab)?.label}</h2></div>
                            <button onClick={()=>reloadData(true)} className="px-4 py-2 bg-white rounded-xl shadow-sm border text-xs font-bold hover:bg-orange-50 hover:text-orange-600 transition-all"><i className="fa-solid fa-rotate-right mr-1"></i>อัปเดตข้อมูล</button>
                        </div>

                        {tab==='overview'&& (
                            <div className="grid grid-cols-2 lg:grid-cols-4 gap-4 mb-6 animate-fade-in-up">
                                {[

        // ==========================================

            const [surveyAnswers, setSurveyAnswers] = useState({}); 
            const [suggestion, setSuggestion] = useState('');
            const [poloGender, setPoloGender] = useState('ชาย'); 
            const [poloSize, setPoloSize] = useState('M'); 
            const [poloQty, setPoloQty] = useState(1);
            const [tshirtGender, setTshirtGender] = useState('ชาย');

            const [slipImage, setSlipImage] = useState(null); 
            const [receiptData, setReceiptData] = useState(null);

            useEffect(()=>{ sessionStorage.setItem('app_view',view); window.scrollTo(0,0); },[view]);
            useEffect(()=>{ if(isDarkMode){document.documentElement.classList.add('dark');localStorage.setItem('theme','dark');}else{document.documentElement.classList.remove('dark');localStorage.setItem('theme','light');} },[isDarkMode]);

            const loadData = useCallback(async (isAdmin=false)=>{
                try {
                    let dActs=[], dRecs=[], dSets=[], fallback=null;
                    try { [dActs, dRecs, dSets] = await Promise.all([fetchCSV('Activities'), fetchCSV('Recruitments'), fetchCSV('Settings')]); } catch(e){ fallback=await runGAS('getAdminDashboardData').catch(()=>null); if(fallback){ dActs=fallback.activities||[]; dRecs=fallback.recruitments||[]; } }
                    let sConf={ main:'open', recruit:'open', shirt:'open' }, pConf={ normal:250, oversize:380, header:'สโมสรนักศึกษา', note:'' };
                    if(dSets.length>0){
                        const getS=(k,df)=>{const r=dSets.find(x=>String(Object.values(x)[0]).toLowerCase()===k.toLowerCase());return r?String(Object.values(r)[1]).trim():df;};
                        sConf={main:getS('SystemStatus','open'), recruit:getS('RecruitStatus','open'), shirt:getS('ShirtStatus','open')};
                    } else if(fallback&&fallback.shirtPrice){ sConf.main=fallback.shirtPrice.systemStatus||'open'; sConf.shirt=fallback.shirtPrice.status||'open'; }
                    setSysConfig(sConf); if(isAdmin){ const [checks,orders,regis,evals]=await Promise.all([fetchCSV('CheckIns').catch(()=>[]),fetchCSV('ShirtOrders').catch(()=>[]),fetchCSV('Registrations').catch(()=>[]),fetchCSV('Evaluations').catch(()=>[])]); setDb({acts:dActs,recs:dRecs,checks,orders,regis,evals,students:[]}); }else{ setDb(p=>({...p,acts:dActs,recs:dRecs})); }
                    if(window.hideLoader) window.hideLoader();
                }catch(e){ if(window.hideLoader) window.hideLoader(); }
            },[]);

            useEffect(()=>{ if(view!=='admin_dashboard') loadData(); },[view, loadData]);
            const goHome = () => { setStudent(null); setSelectedItem(null); setView('home'); };

            const handleSearch = async (e) => {
                e.preventDefault(); const searchId = e.target.studentId.value.trim().toLowerCase(); if(!searchId) return;
                Swal.fire({title:'ตรวจสอบข้อมูล...',allowOutsideClick:false,didOpen:()=>Swal.showLoading()});
                try {
                    let st=null; let curDb={...db};
                    const ensureCache=async(sheet,key)=>{ if(!curDb[key]||curDb[key].length===0){ const data=await fetchCSV(sheet); curDb[key]=data; setDb(p=>({...p,[key]:data})); } return curDb[key]||[]; };
                    if(searchId==='test'||searchId==='12345'){ st={StudentID:searchId,Name:'นศ.ทดสอบ',Major:'สาขาทดสอบ',IDCard:'1111'}; }else{
                        if(purpose==='history'){
                            const chks=await ensureCache('CheckIns','checks'); const ords=await ensureCache('ShirtOrders','orders');
                            let f=chks.find(c=>String(getVal(c,['studentid','รหัส'])).toLowerCase()===searchId||String(getVal(c,['idcard','บัตร'])).toLowerCase()===searchId);
                            if(f) st={StudentID:getVal(f,['studentid','รหัส'],'StudentID'),Name:getVal(f,['name','ชื่อ'],'Name'),Major:getVal(f,['major','สาขา'],'Major'),IDCard:getVal(f,['idcard','บัตร'],'IDCard')};

                        } else {
                            const stds=await ensureCache('Students','students'); let raw=stds.find(s=>String(getVal(s,['studentid','รหัส'])).toLowerCase()===searchId||String(getVal(s,['idcard','บัตร'])).toLowerCase()===searchId);

                        }

                            setHistActs(chks.filter(c=>String(getVal(c,['studentid','รหัส'])).toLowerCase()===String(st.StudentID).toLowerCase()||String(getVal(c,['idcard','บัตร'])).toLowerCase()===searchId).reverse());
                            const myO=ords.filter(o=>String(getVal(o,['studentid','รหัส'])).toLowerCase()===String(st.StudentID).toLowerCase()).reverse(); setHistShirts(myO.length>0?[myO[0]]:[]); Swal.close(); setView('history_result');
                        } else if(purpose==='shirt') {
                            const ords=await ensureCache('ShirtOrders','orders'); let ex=ords.reverse().find(o=>String(getVal(o,['studentid','รหัส'])).toLowerCase()===String(st.StudentID).toLowerCase());

                        } else { Swal.close(); setView(purpose==='recruit'?'select_recruit':'select_activity'); }
                    } else { Swal.fire('ไม่พบข้อมูล','ไม่พบประวัติหรือข้อมูลนักศึกษาในระบบ','error'); }
                }catch(e){Swal.fire('Error',e.message,'error');}

                const menu=[ {id:'home',icon:'fa-house',label:'หน้าแรก',onClick:goHome,active:view==='home',c:'orange'}, {id:'recruit',icon:'fa-bullhorn',label:'รับสมัคร',onClick:()=>{if(!checkIsOpen(sysConfig.main))return;setPurpose('recruit');setView('search');},active:view==='select_recruit'||(view==='search'&&purpose==='recruit'),c:'purple'}, {id:'activity',icon:'fa-qrcode',label:'เช็คชื่อ',onClick:()=>{if(!checkIsOpen(sysConfig.main))return;setPurpose('activity');setView('search');},active:view==='select_activity'||view==='survey'||(view==='search'&&purpose==='activity'),c:'orange'}, {id:'shirt',icon:'fa-shirt',label:'จองเสื้อ',onClick:()=>{if(!checkIsOpen(sysConfig.main))return;setPurpose('shirt');setView('search');},active:view==='shirt_form'||view==='receipt'||(view==='search'&&purpose==='shirt'),c:'rose'}, {id:'history',icon:'fa-clock-rotate-left',label:'ประวัติ',onClick:()=>{setPurpose('history');setView('history_search');},active:view==='history_search'||view==='history_result',c:'blue'} ];

                        <div className="flex-grow flex items-center justify-center p-6"><div className="luxury-card w-full max-w-sm p-8 text-center relative"><button onClick={goHome} className="absolute top-4 left-4 text-xs text-gray-400"><i className="fa-solid fa-arrow-left"></i></button><div className="w-14 h-14 bg-gray-900 text-white rounded-2xl flex items-center justify-center text-xl mx-auto mb-4"><i className="fa-solid fa-fingerprint"></i></div><h2 className="text-xl font-bold mb-4 text-gray-900">Admin Platform Login</h2><form onSubmit={e=>{e.preventDefault(); if(e.target.u.value==='admin'&&e.target.p.value==='9999'){localStorage.setItem('admin_logged_in','true');setView('admin_dashboard');}else{Swal.fire('Error','สิทธิ์ไม่ถูกต้อง','error');}}}><input type="text" name="u" placeholder="Username" required className="luxury-input w-full mb-3 text-xs" /><input type="password" name="p" placeholder="Password" required className="luxury-input w-full mb-5 text-xs" /><button type="submit" className="w-full bg-gray-900 text-white font-bold py-2.5 rounded-xl text-xs tracking-widest uppercase">Sign In</button></form></div></div>
                    )}

                    {view!=='admin_login'&&view!=='admin_dashboard'&&<Footer/>}
                    <MobileTabBar />
                </div>
            );
        }

        try{ const root=ReactDOM.createRoot(document.getElementById('root')); root.render(React.createElement(App)); }catch(err){ document.body.innerHTML='<div style="display:flex;height:100vh;align-items:center;justify-content:center;color:#ef4444;font-family:sans-serif;"><h1>ระบบขัดข้อง กรุณารีเฟรช</h1></div>'; }
    </script>
</body>
</html>
