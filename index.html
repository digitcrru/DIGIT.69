    <style>
        body { font-family: 'Prompt', sans-serif; background: linear-gradient(135deg, #fffcf9 0%, #ffedd5 100%); background-attachment: fixed; color: #111827; min-height: 100vh; -webkit-font-smoothing: antialiased; padding-bottom: 80px; transition: color 0.3s ease; }
        @media (min-width: 768px) { body { padding-bottom: 0; } }

        .luxury-card:hover { border-color: rgba(249, 115, 22, 0.3); box-shadow: 0 20px 40px -10px rgba(249, 115, 22, 0.15); transform: translateY(-4px); }

        .luxury-input:focus { border-color: #f97316; box-shadow: 0 0 0 4px rgba(249, 115, 22, 0.15); }
        .btn-primary { background-color: #111827; color: #ffffff; border: 1px solid #111827; transition: all 0.3s ease; }

        .no-scrollbar::-webkit-scrollbar { display: none; }

</head>
<body class="selection:bg-orange-500 selection:text-white">

    <!-- Loader Structure -->
    <div id="app-loader">
        <div class="loader-spinner"></div>
        <h2 style="font-family: 'Prompt', sans-serif; font-size: 20px; font-weight: 700; color: #f97316; letter-spacing: 1px;">DIGIT.CRRU</h2>
        <p id="loader-text" style="color: #6b7280; font-size: 12px; margin-top: 10px;">กำลังประมวลผลระบบ...</p>
    </div>

    <!-- Global Scripts (Outside Babel) -->
    <script>
        // แก้ไขปัญหาระบบหา hideMainLoader ไม่เจอ โดยตั้งเป็น Global Function
        window.hideMainLoader = function() {
            const loader = document.getElementById('app-loader');
            if (loader && loader.style.display !== 'none') {
                loader.style.opacity = '0';
                setTimeout(() => { loader.style.display = 'none'; }, 300);
            }
        };
        // Fallback: ซ่อน Loader อัตโนมัติหากโหลดนานเกิน
        setTimeout(window.hideMainLoader, 8000); 

        // Function สำหรับดาวน์โหลดไฟล์รายงาน Word ออกจากระบบพร้อมสไตล์
        window.downloadSPSSWord = function(filename) {
            const content = document.getElementById('spss-ex').innerHTML;
            const header = "<html xmlns:o='urn:schemas-microsoft-com:office:office' xmlns:w='urn:schemas-microsoft-com:office:word' xmlns='http://www.w3.org/TR/REC-html40'><head><meta charset='utf-8'><title>Export HTML to Word</title><style>table { border-collapse: collapse; width: 100%; margin-bottom: 20px; } th, td { border: 1px solid #000; padding: 8px; } h4 { margin-top: 20px; margin-bottom: 10px; }</style></head><body>";
            const footer = "</body></html>";
            const sourceHTML = header + content + footer;
            const source = 'data:application/vnd.ms-word;charset=utf-8,' + encodeURIComponent(sourceHTML);
            const fileDownload = document.createElement("a");
            document.body.appendChild(fileDownload);
            fileDownload.href = source;
            fileDownload.download = 'รายงานประเมิน_' + filename + '.doc';
            fileDownload.click();
            document.body.removeChild(fileDownload);
        };
    </script>

    <!-- React App Root -->
    <div id="root"></div>

    <script type="text/babel" data-presets="react">
        const { useState, useEffect, useMemo, useCallback } = React;

        // ==========================================
        // 1. CONFIGURATION & CORE HELPERS
        // ==========================================
        const API_CONFIG = {
            USE_FAST_CSV: true,
            SHEET_ID: "1KLJNWUUIj1r6eqCZnaF-F6nA2FQg7pvOHMk0PyDCyAc", 
            WEB_APP_URL: "https://script.google.com/macros/s/AKfycby0iQpbOXqr82EvrX_qhwOtrBc3YN5oBFFLrzipXYoWJ3m1fwxMUAyxspLneeNQrmImnw/exec", 
            getCSVUrl: function(sheetName) {
                return `https://docs.google.com/spreadsheets/d/${this.SHEET_ID}/gviz/tq?tqx=out:csv&sheet=${sheetName}&_=${new Date().getTime()}`;
            }
        };

        const isFastCSVReady = () => API_CONFIG.USE_FAST_CSV && API_CONFIG.SHEET_ID && !API_CONFIG.SHEET_ID.includes('ใส่_SHEET_ID');

        const fetchFastCSV = (sheetName) => {
            return new Promise((resolve, reject) => {
                if(!isFastCSVReady()) return reject(new Error("CSV Mode Disabled"));
                Papa.parse(API_CONFIG.getCSVUrl(sheetName), {
                    download: true, header: true, skipEmptyLines: true,
                    complete: (results) => {
                        if (results.data && results.data.length > 0) {
                            const firstKey = Object.keys(results.data[0])[0] || '';
                            if (firstKey.toLowerCase().includes('html') || firstKey.toLowerCase().includes('doctype')) {
                                return reject(new Error("Permission Denied: ไม่สามารถโหลดข้อมูลได้ กรุณาตั้งค่าแชร์ไฟล์ Google Sheets เป็น 'ทุกคนที่มีลิงก์ (Anyone with the link)'"));
                            }
                        }
                        resolve(results.data);
                    },
                    error: (error) => reject(error)
                });
            });
        };

        const runGAS = async (functionName, ...args) => {
            if (typeof google !== 'undefined' && google.script && google.script.run) {
                return new Promise((resolve, reject) => {
                    google.script.run.withSuccessHandler(resolve).withFailureHandler(reject)[functionName](...args);
                });
            } else if (API_CONFIG.WEB_APP_URL && API_CONFIG.WEB_APP_URL.startsWith("https://script.google.com")) {
                try {
                    const response = await fetch(API_CONFIG.WEB_APP_URL, {
                        method: 'POST', redirect: 'follow',
                        body: JSON.stringify({ action: functionName, params: args }),
                        headers: { 'Content-Type': 'text/plain;charset=utf-8' } 
                    });
                    const result = await response.json();
                    if (result.success === false) {
                        if (result.error && (result.error.includes("Unknown action") || result.error.includes("ไม่พบคำสั่ง"))) {
                            throw new Error(`ระบบหลังบ้านยังไม่รองรับคำสั่ง "${functionName}" \nกรุณาอัปเดตไฟล์ Code.gs และกด Deploy เป็นเวอร์ชันใหม่ (New Version)`);
                        }
                        throw new Error(result.error || "เกิดข้อผิดพลาดจากเซิร์ฟเวอร์");
                    }
                    return result.data !== undefined ? result.data : result;
                } catch (error) { 
                    if (error.name === 'TypeError' || error.message.includes('Failed to fetch') || error.message.includes('Unexpected token')) {
                        throw new Error('ไม่สามารถเชื่อมต่อฐานข้อมูลได้ \nกรุณาตรวจสอบว่าลิงก์ Web App ถูกต้อง และตั้งค่าการแชร์เป็น "ทุกคน (Anyone)" แล้ว');
                    }
                    throw error; 
                }
            } else {
                Swal.fire({ title: 'ตั้งค่าระบบยังไม่สมบูรณ์', text: 'กรุณานำลิงก์ Web App และ Sheet ID มาวาง', icon: 'warning', confirmButtonColor: '#ea580c' });
                return new Promise((resolve, reject) => setTimeout(() => reject(new Error('Missing WEB_APP_URL')), 500));
            }
        };

        const exportCSV = (arr, fn, fields) => {
            if(!arr||arr.length===0) return Swal.fire('แจ้งเตือน','ไม่มีข้อมูล','warning');
            const dataToExport = arr.map(r => fields.map(f => getVal(r, [f.toLowerCase()], f)));
            const csv = Papa.unparse({fields, data:dataToExport});
            const link = document.createElement("a"); 
            link.href = URL.createObjectURL(new Blob(['\ufeff'+csv], {type:'text/csv;charset=utf-8;'})); 
            link.download = fn; 
            link.click();
        };

        const surveyData = [
            { title: "1. กระบวนการ ขั้นตอนการให้บริการ", questions: [ { id: "q1", text: "1.1 การประชาสัมพันธ์โครงการ ฯ" }, { id: "q2", text: "1.2 ความเหมาะสมของสถานที่" }, { id: "q3", text: "1.3 ความเหมาะสมของระยะเวลา" }, { id: "q4", text: "1.4 การจัดลำดับขั้นตอนของกิจกรรม" } ] },
            { title: "2. การอำนวยความสะดวก", questions: [ { id: "q5", text: "2.1 เอกสาร" }, { id: "q6", text: "2.2 โสตทัศนูปกรณ์" }, { id: "q7", text: "2.3 เจ้าหน้าที่สนับสนุน" }, { id: "q8", text: "2.4 อาหาร,เครื่องดื่มและสถานที่" } ] },
            { title: "3. คุณภาพการให้บริการ", questions: [ { id: "q9", text: "3.1 ท่านได้รับความรู้ แนวคิด ทักษะและประสบการณ์ใหม่ ๆ จากโครงการ" }, { id: "q10", text: "3.2 ท่านสามารถนำสิ่งที่ได้รับจากโครงการ/กิจกรรมนี้ไปใช้ในการปฏิบัติงาน" }, { id: "q11", text: "3.3 สิ่งที่ท่านได้รับจากโครงการ/กิจกรรมครั้งนี้ตรงตามความคาดหวังของท่านหรือไม่" }, { id: "q12", text: "3.4 โครงการ/กิจกรรมนี้เอื้ออำนวยต่อการเรียนรู้และพัฒนาความสามารถของท่าน" }, { id: "q13", text: "3.5 ประโยชน์ที่ท่านได้รับจากโครงการ/กิจกรรม" } ] }
        ];

        const getGenderProps = (nameStr) => {
            if (!nameStr) return { icon: 'fa-user', bg: 'bg-orange-50', text: 'text-orange-600' };
            if (nameStr.startsWith('นาย')) return { icon: 'fa-person', bg: 'bg-slate-100', text: 'text-slate-600' };
            if (nameStr.startsWith('นาง') || nameStr.startsWith('น.ส.')) return { icon: 'fa-person-dress', bg: 'bg-rose-50', text: 'text-rose-600' };
            return { icon: 'fa-user', bg: 'bg-orange-50', text: 'text-orange-600' };
        };

        const findKey = (keys, kws) => keys.find(k => kws.some(kw => String(k).toLowerCase().replace(/\s+/g, '').includes(kw)));
        const getVal = (obj, kws, fallback) => {
            if(!obj) return '';
            const keys = Object.keys(obj);
            const found = findKey(keys, kws);
            return found ? obj[found] : (obj[fallback] || '');
        };

        const formatDisplayDate = (dateStr) => {
            if (!dateStr) return { month: '-', date: '-' };
            const d = new Date(dateStr);
            if (!isNaN(d.getTime())) return { month: d.toLocaleDateString('en-US',{month:'short'}).toUpperCase(), date: d.getDate() };
            const parts = String(dateStr).split(/[/-]/);
            if (parts.length >= 3) {
                const day = parts[0].length === 4 ? parseInt(parts[2], 10) : parseInt(parts[0], 10);
                const mNum = parts[0].length === 4 ? parseInt(parts[1], 10) : parseInt(parts[1], 10);
                const mNames = ['JAN', 'FEB', 'MAR', 'APR', 'MAY', 'JUN', 'JUL', 'AUG', 'SEP', 'OCT', 'NOV', 'DEC'];
                return { month: mNames[mNum-1] || '-', date: day || '-' };
            }
            return { month: '-', date: '-' };
        };

        // ตัวช่วยสำหรับแปลงรูปแบบเวลา
        const formatDateTimeTH = (ts) => {
            if (!ts) return { date: '-', time: '', full: '-' };
            let d = new Date(ts);
            // กรณีรูปแบบวันที่แปลกๆ หรือเป็นปี พ.ศ.
            if (isNaN(d.getTime()) && typeof ts === 'string') {
                const parts = ts.trim().split(/[\s,T]+/);
                const datePart = parts[0];
                const timePart = parts[1] ? parts[1].split('.')[0] : '00:00:00';
                if (datePart.includes('/')) {
                    const [d1, d2, d3] = datePart.split('/');
                    if (d1 && d2 && d3) {
                        let year = parseInt(d3, 10);
                        if (year > 2500) year -= 543; // แปลง พ.ศ. เป็น ค.ศ.
                        d = new Date(`${year}-${d2.padStart(2, '0')}-${d1.padStart(2, '0')}T${timePart}`);
                    }
                } else if (datePart.includes('-')) {
                    const [y, m, day] = datePart.split('-');
                    if (y && m && day) {
                        let year = parseInt(y, 10);
                        if (year > 2500) year -= 543;
                        d = new Date(`${year}-${m.padStart(2, '0')}-${day.padStart(2, '0')}T${timePart}`);
                    }
                }
            }
            if (!isNaN(d.getTime())) {
                const dateStr = d.toLocaleDateString('th-TH');
                const timeStr = d.toLocaleTimeString('th-TH', { hour: '2-digit', minute: '2-digit' }) + ' น.';
                return { date: dateStr, time: timeStr, full: `${dateStr} ${timeStr}` };
            }
            const strParts = String(ts).trim().split(/\s+/);
            return { date: strParts[0] || '-', time: strParts.slice(1).join(' ') || '', full: String(ts) };
        };

        // ==========================================
        // 2. SHARED UI COMPONENTS
        // ==========================================
        const RenderPagination = ({ currentPage, totalPages, setCurrentPage, totalItems, itemsPerPage }) => {
            if (totalPages <= 1 && totalItems === 0) return null;
            const cMin = Math.min(totalItems, (currentPage - 1) * itemsPerPage + 1); 
            const cMax = Math.min(totalItems, currentPage * itemsPerPage);
            return (
                <div className="flex flex-col sm:flex-row justify-between items-center px-6 py-4 border-t border-gray-100 bg-gray-50/50 gap-4 rounded-b-2xl">
                    <span className="text-[10px] font-bold text-gray-500 tracking-widest">แสดง {cMin} - {cMax} จากทั้งหมด {totalItems} รายการ</span>
                    <div className="flex items-center gap-2">
                        <button disabled={currentPage === 1} onClick={() => setCurrentPage(p => Math.max(1, p - 1))} className="text-[10px] uppercase tracking-widest font-bold text-gray-500 hover:text-orange-600 px-3 py-1.5 bg-white border border-gray-200 rounded-lg disabled:opacity-50 transition-colors">ก่อนหน้า</button>
                        <span className="text-orange-600 font-bold text-[10px] uppercase tracking-widest bg-white px-3 py-1.5 rounded-lg border border-orange-200 shadow-sm">หน้า {currentPage} / {totalPages}</span>
                        <button disabled={currentPage === totalPages} onClick={() => setCurrentPage(p => Math.min(totalPages, p + 1))} className="text-[10px] uppercase tracking-widest font-bold text-gray-500 hover:text-orange-600 px-3 py-1.5 bg-white border border-gray-200 rounded-lg disabled:opacity-50 transition-colors">ถัดไป</button>
                    </div>
                </div>
            );
        };

        const ReceiptSlipComponent = ({ title, data, config, shirtPrice }) => (
            <div className="bg-white p-10 relative flex flex-col w-[48%]" style={{ minHeight: '100%' }}>
                <div className="border-b border-gray-800 pb-5 mb-6 flex justify-between items-start">
                    <div className="max-w-[75%]">
                        <h1 className="text-2xl font-bold text-charcoal-900 mb-1">ใบเสร็จรับเงิน</h1>
                        <p className="text-[10px] text-gray-500 font-semibold tracking-widest uppercase mb-4">RECEIPT</p>
                        <h2 className="text-sm font-semibold text-charcoal-900 whitespace-pre-wrap">{config.header}</h2>
                    </div>
                    <div className="text-right">
                        <div className="inline-block bg-charcoal-900 text-white px-3 py-1 rounded text-[10px] font-bold tracking-widest uppercase mb-3">{title}</div>
                        <p className="text-[10px] text-gray-400 uppercase tracking-widest mb-1">เลขที่ / No.</p>
                        <p className="text-base font-bold text-charcoal-900">{data.orderId}</p>
                    </div>
                </div>
                
                <div className="grid grid-cols-2 gap-6 mb-8 text-sm border-b border-gray-200 pb-6 p-4 bg-gray-50 rounded-lg">
                    <div>
                        <p className="text-[10px] text-gray-500 font-semibold tracking-widest mb-1">ได้รับเงินจาก / Received From</p>
                        <p className="font-bold text-charcoal-900 text-base mb-1 break-words">{data.student.Name}</p>
                        <p className="text-gray-600 font-medium break-words">{data.student.Major}</p>
                        <p className="text-gray-500 font-light mt-1 break-words">รหัสนักศึกษา: {data.student.StudentID}</p>
                    </div>
                    <div>
                        <p className="text-[10px] text-gray-500 font-semibold tracking-widest mb-1">วันที่ / Date</p>
                        <p className="font-bold text-charcoal-900 text-base">{data.date.split(' ')[0]}</p>

                            const canvas = document.createElement('canvas'); let width = img.width; let height = img.height; const MAX_WIDTH = 800;

                    title: 'ตั้งค่าป๊อปอัปหน้าแรก',

                    showCancelButton: true, confirmButtonColor: '#ea580c', confirmButtonText: 'บันทึกการตั้งค่า', cancelButtonText: 'ยกเลิก',
                    didOpen: () => setupImageUpload('swal-hp-file', 'swal-hp-img'),
                    preConfirm: () => ({ image: document.getElementById('swal-hp-img').value, status: document.getElementById('swal-hp-status').checked ? 'open' : 'closed' })
                });
                if (formValues) {
                    Swal.fire({ title: 'กำลังบันทึก...', allowOutsideClick: false, didOpen: () => { Swal.showLoading() } });
                    try { await runGAS('updateHomePopup', formValues); setAdminData(prev => ({ ...prev, homePopup: formValues })); Swal.close(); Swal.fire({ toast: true, position: 'top-end', showConfirmButton: false, timer: 1500, icon: 'success', title: `ตั้งค่าสำเร็จ` }); } catch (err) { Swal.fire('Error', err.message, 'error'); }
                }
            };

            const handleUpdateShirtPrice = async () => {
                const { value: formValues } = await Swal.fire({
                    title: 'ตั้งราคาเสื้อ',
                    html: `<div class="text-left text-sm mb-1 font-medium">S, M, L (฿)</div><input id="swal-n" type="number" class="w-full border p-2 mb-3 rounded" value="${data?.shirtPrice?.normal||250}"><div class="text-left text-sm mb-1 font-medium">XL, 2XL, 3XL (฿)</div><input id="swal-o" type="number" class="w-full border p-2 rounded" value="${data?.shirtPrice?.oversize||380}">`,
                    showCancelButton: true, confirmButtonColor: '#ea580c', preConfirm: () => ({ normal: document.getElementById('swal-n').value, oversize: document.getElementById('swal-o').value })
                });
                if (formValues) { 
                    Swal.fire({ title: 'กำลังบันทึก...', allowOutsideClick: false, didOpen: () => { Swal.showLoading() } }); 
                    try { await runGAS('updateShirtPrice', formValues); setAdminData(prev => ({ ...prev, shirtPrice: { ...(prev?.shirtPrice || {}), normal: formValues.normal, oversize: formValues.oversize } })); Swal.close(); Swal.fire({ toast: true, position: 'top-end', showConfirmButton: false, timer: 1500, icon: 'success', title: `อัปเดตราคาสำเร็จ` }); } catch (err) { Swal.fire('Error', err.message, 'error'); } 
                }
            };

            const handleUpdateReceiptConfig = async () => {
                const { value: formValues } = await Swal.fire({
                    title: 'ตั้งค่าใบเสร็จ',
                    html: `<div class="text-left text-sm mb-1 font-medium">หัวใบเสร็จ</div><textarea id="swal-h" rows="2" class="w-full border p-2 mb-3 rounded text-sm">${data?.shirtPrice?.receiptHeader||''}</textarea><div class="text-left text-sm mb-1 font-medium">หมายเหตุ</div><textarea id="swal-n" rows="2" class="w-full border p-2 rounded text-sm">${data?.shirtPrice?.receiptNote||''}</textarea>`,
                    showCancelButton: true, confirmButtonColor: '#ea580c', preConfirm: () => ({ header: document.getElementById('swal-h').value, note: document.getElementById('swal-n').value })
                });
                if (formValues) { 
                    Swal.fire({ title: 'กำลังบันทึก...', allowOutsideClick: false, didOpen: () => { Swal.showLoading() } }); 
                    try { await runGAS('updateReceiptConfig', formValues); setAdminData(prev => ({ ...prev, shirtPrice: { ...(prev?.shirtPrice || {}), receiptHeader: formValues.header, receiptNote: formValues.note } })); Swal.close(); Swal.fire({ toast: true, position: 'top-end', showConfirmButton: false, timer: 1500, icon: 'success', title: `อัปเดตใบเสร็จสำเร็จ` }); } catch (err) { Swal.fire('Error', err.message, 'error'); } 
                }
            };

            const handleUpdateShirtPopup = async () => {
                const formHtml = `
                    <div class="text-left text-sm mb-1 font-medium text-gray-700">ข้อความประกาศ</div>
                    <textarea id="swal-popup-text" rows="2" class="w-full border border-gray-200 p-3 mb-4 rounded-xl text-sm focus:border-orange-500 outline-none" placeholder="โปรดตรวจสอบรายละเอียดไซส์ก่อนสั่งซื้อ...">${data?.shirtPrice?.popupText || ''}</textarea>
                    <div class="mb-4 text-left">
                        <label class="block text-sm font-medium text-gray-700 mb-2">อัปโหลดรูปภาพ</label>
                        <input type="file" id="swal-shirt-file" accept="image/*" class="w-full text-sm text-gray-500 file:mr-4 file:py-2.5 file:px-4 file:rounded-xl file:border-0 file:text-xs file:font-bold file:bg-orange-50 file:text-orange-600 cursor-pointer border border-gray-200 rounded-xl bg-gray-50" />
                    </div>
                    <div class="text-left text-sm mb-1 font-medium text-gray-700">หรือวางลิงก์รูปภาพ (URL)</div>
                    <input id="swal-popup-img" type="text" class="w-full border border-gray-200 p-3 rounded-xl text-sm outline-none focus:border-orange-500" value="${data?.shirtPrice?.popupImage || ''}">
                `;
                const { value: formValues } = await Swal.fire({
                    title: 'ตั้งค่าป๊อปอัปจองเสื้อ',
                    html: formHtml,
                    showCancelButton: true, confirmButtonColor: '#ea580c', confirmButtonText: 'บันทึกการตั้งค่า',
                    didOpen: () => setupImageUpload('swal-shirt-file', 'swal-popup-img'),
                    preConfirm: () => ({ text: document.getElementById('swal-popup-text').value, image: document.getElementById('swal-popup-img').value })
                });
                if (formValues) { 
                    Swal.fire({ title: 'กำลังบันทึก...', allowOutsideClick: false, didOpen: () => { Swal.showLoading() } }); 
                    try { await runGAS('updateShirtPopup', formValues); setAdminData(prev => ({ ...prev, shirtPrice: { ...(prev?.shirtPrice || {}), popupText: formValues.text, popupImage: formValues.image } })); Swal.close(); Swal.fire({ toast: true, position: 'top-end', showConfirmButton: false, timer: 1500, icon: 'success', title: `ตั้งค่าสำเร็จ` }); } catch (err) { Swal.fire('Error', err.message, 'error'); } 
                }
            };

            const handleImportCSV = (e) => {
                const file = e.target.files[0]; if(!file) return;
                Papa.parse(file, { header: true, skipEmptyLines: true, complete: async function(results) {
                    if(results.data.length === 0) return Swal.fire('Error', 'Empty CSV', 'error');
                    Swal.fire({ title: `กำลังนำเข้า ${results.data.length} รายการ...`, didOpen: () => { Swal.showLoading() } });
                    try { await runGAS('importCheckins', results.data); Swal.fire('สำเร็จ', `นำเข้าสำเร็จ`, 'success'); reloadData(true); } catch(err) { Swal.fire('Error', err.message, 'error'); } e.target.value = '';
                }});
            };

            const toggleShirtOrderStatus = async (studentId, currentStatus) => {
                Swal.fire({ title: 'กำลังอัปเดต...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });
                try { 
                    const newStatus = currentStatus === 'received' ? 'paid' : 'received'; 
                    await runGAS('updateShirtOrderStatus', studentId, newStatus); 
                    setAdminData(prev => ({ ...prev, shirtOrders: (prev?.shirtOrders || []).map(so => getVal(so, ['studentid', 'รหัส'], 'StudentID') === studentId ? { ...so, Status: newStatus } : so) })); 
                    Swal.close(); Swal.fire({ toast: true, position: 'top-end', showConfirmButton: false, timer: 1500, icon: 'success', title: `อัปเดตสถานะสำเร็จ` }); 
                } catch(err) { Swal.fire('ข้อผิดพลาด', err.message, 'error'); }
            };

            const renderSpssContent = () => {
                if(!selectedActivityForSpss) return <div className="text-center py-16 text-gray-400 border-2 border-dashed border-gray-200 rounded-2xl bg-gray-50 mt-8"><i className="fa-solid fa-chart-pie text-4xl text-orange-300 mb-4 block"></i><h3 className="text-lg font-bold text-gray-600">ยังไม่ได้เลือกกิจกรรม</h3></div>;
                const actName = (data?.activities || []).find(a=>String(a.ActivityID)===String(selectedActivityForSpss))?.Name;
                const evals = (data?.evaluations || []).filter(e => getVal(e, ['activityname', 'ชื่อกิจกรรม'], 'ActivityName') === actName);
                if(evals.length === 0) return <div className="text-center py-16 text-gray-400 border-2 border-dashed border-gray-200 rounded-2xl bg-white mt-8"><i className="fa-solid fa-file-circle-xmark text-4xl text-gray-300 mb-4 block"></i><h3 className="text-lg font-bold text-gray-600">ไม่พบข้อมูลการประเมิน</h3></div>;

                const actCheckins = (data?.checkins || []).filter(c => getVal(c, ['activityid', 'รหัสกิจกรรม'], 'ActivityID') === selectedActivityForSpss);
                let mCount = 0, fCount = 0; actCheckins.forEach(c => { const n = getVal(c, ['name', 'ชื่อ'], 'Name').trim(); if (n.startsWith('นาย')) mCount++; else if (n) fCount++; });
                const totalDemo = mCount + fCount || 1; const mPct = ((mCount / totalDemo) * 100).toFixed(2); const fPct = ((fCount / totalDemo) * 100).toFixed(2);
                
                const getMeaning = (m) => { const r = Number(m.toFixed(2)); return r >= 4.51 ? 'มากที่สุด' : r >= 3.51 ? 'มาก' : r >= 2.51 ? 'ปานกลาง' : r >= 1.51 ? 'น้อย' : 'น้อยที่สุด'; };
                const getBadgeColor = (m) => { const r = Number(m.toFixed(2)); return r >= 4.51 ? 'bg-emerald-50 text-emerald-700' : r >= 3.51 ? 'bg-blue-50 text-blue-700' : r >= 2.51 ? 'bg-amber-50 text-amber-700' : r >= 1.51 ? 'bg-orange-50 text-orange-700' : 'bg-rose-50 text-rose-700'; };

                const qStats = []; let overallIdx = 1, allScores = [];
                surveyData.forEach(cat => {
                    cat.questions.forEach(q => {
                        const hKey = ['Q1_1','Q1_2','Q1_3','Q1_4','Q2_1','Q2_2','Q2_3','Q2_4','Q3_1','Q3_2','Q3_3','Q3_4','Q3_5'][overallIdx - 1];
                        const scores = evals.map(e => Number(getVal(e, [hKey.toLowerCase(), `q${overallIdx}`], hKey)) || 0).filter(s => s > 0);
                        allScores.push(...scores); let mean = 0, sd = 0;
                        if(scores.length > 0) { mean = scores.reduce((a,b)=>a+b, 0) / scores.length; if(scores.length > 1) sd = Math.sqrt(scores.reduce((a,b)=>a+Math.pow(b-mean, 2), 0) / (scores.length - 1)); }
                        qStats.push({ no: overallIdx++, text: q.text.split(' ').slice(1).join(' '), mean, sd });
                    });
                });
                let grandMean = 0, grandSd = 0; if (allScores.length > 0) { grandMean = allScores.reduce((a,b)=>a+b, 0) / allScores.length; if (allScores.length > 1) grandSd = Math.sqrt(allScores.reduce((a,b)=>a+Math.pow(b-grandMean, 2), 0) / (allScores.length - 1)); }
                const comments = evals.map(e => String(getVal(e, ['comment', 'ข้อเสนอแนะ'], 'Comment')).trim()).filter(t => t && t !== '-' && t !== '.' && !t.includes('ไม่มี'));

                const sortedQStats = [...qStats].sort((a, b) => b.mean - a.mean);
                const top1 = sortedQStats[0] || { text: '-', mean: 0 };
                const top2 = sortedQStats[1] || { text: '-', mean: 0 };
                const top3 = sortedQStats[2] || { text: '-', mean: 0 };

                const maxGender = mCount >= fCount ? 'ชาย' : 'หญิง';
                const maxCount = Math.max(mCount, fCount);
                const maxPct = maxGender === 'ชาย' ? mPct : fPct;
                const minGender = mCount < fCount ? 'ชาย' : 'หญิง';
                const minCount = Math.min(mCount, fCount);
                const minPct = minGender === 'ชาย' ? mPct : fPct;

                return (
                    <div className="mt-8">
                        <div id="spss-ex" style={{ display: 'none' }}>
                            <div className="word-export-title"><h3 style={{ textAlign: 'center', fontSize: '18pt', fontWeight: 'bold' }}>รายงานผลการประเมินความพึงพอใจ</h3><p style={{ textAlign: 'center', marginBottom: '20pt' }}>กิจกรรม: {actName}</p></div>
                            
                            <p><b>เกณฑ์ในการแปลความหมายของค่าคะแนนเฉลี่ย</b><br/>ทั้งนี้ในการวิเคราะห์ข้อมูล แบ่งออกเป็น 5 ระดับ คือ</p>
                            <table style={{ marginBottom: '20pt', width: '100%', borderCollapse: 'collapse' }} border="1">
                                <thead><tr><th style={{padding: '5px'}}>คะแนนเฉลี่ย</th><th style={{padding: '5px'}}>ระดับความคิดเห็น</th></tr></thead>
                                <tbody>
                                    <tr><td style={{textAlign:'center', padding: '5px'}}>4.51 - 5.00</td><td style={{padding: '5px'}}>มีความพึงพอใจมากที่สุด</td></tr>
                                    <tr><td style={{textAlign:'center', padding: '5px'}}>3.51 - 4.50</td><td style={{padding: '5px'}}>มีความพึงพอใจมาก</td></tr>
                                    <tr><td style={{textAlign:'center', padding: '5px'}}>2.51 - 3.50</td><td style={{padding: '5px'}}>มีความพึงพอใจปานกลาง</td></tr>
                                    <tr><td style={{textAlign:'center', padding: '5px'}}>1.51 - 2.50</td><td style={{padding: '5px'}}>มีความพึงพอใจน้อย</td></tr>
                                    <tr><td style={{textAlign:'center', padding: '5px'}}>1.00 - 1.50</td><td style={{padding: '5px'}}>มีความพึงพอใจน้อยที่สุด</td></tr>
                                </tbody>
                            </table>

                            <h4>ตารางที่ 1 จำนวนและร้อยละของผู้ตอบแบบสอบถาม จำแนกตามลักษณะเพศ</h4>
                            <table style={{ marginBottom: '10pt', width: '100%', borderCollapse: 'collapse' }} border="1">
                                <thead><tr><th style={{padding: '5px'}}>ข้อมูลทั่วไป (เพศ)</th><th style={{padding: '5px'}}>จำนวน (คน)</th><th style={{padding: '5px'}}>ร้อยละ (%)</th></tr></thead>
                                <tbody>
                                    <tr><td style={{padding: '5px'}}>ชาย</td><td style={{textAlign:'center', padding: '5px'}}>{mCount}</td><td style={{textAlign:'center', padding: '5px'}}>{mPct}</td></tr>
                                    <tr><td style={{padding: '5px'}}>หญิง</td><td style={{textAlign:'center', padding: '5px'}}>{fCount}</td><td style={{textAlign:'center', padding: '5px'}}>{fPct}</td></tr>
                                    <tr><td style={{textAlign:'right', padding: '5px'}}><b>รวม</b></td><td style={{textAlign:'center', padding: '5px'}}><b>{mCount + fCount}</b></td><td style={{textAlign:'center', padding: '5px'}}><b>100.00</b></td></tr>
                                </tbody>
                            </table>
                            <p style={{ marginBottom: '20pt', textIndent: '2em' }}>
                                จากตารางที่ 1 พบว่า ผู้ตอบแบบสอบถามส่วนใหญ่เป็นเพศ{maxGender} จำนวน {maxCount} คน คิดเป็นร้อยละ {maxPct} และเพศ{minGender} จำนวน {minCount} คน คิดเป็นร้อยละ {minPct}
                            </p>
                            
                            <h4>ตารางที่ 2 แสดงค่าเฉลี่ย และค่าเบี่ยงเบนมาตรฐาน ความพึงพอใจในการจัดกิจกรรม</h4>
                            <table style={{ marginBottom: '10pt', width: '100%', borderCollapse: 'collapse' }} border="1">
                                <thead><tr><th style={{padding: '5px'}}>ข้อ</th><th style={{padding: '5px'}}>รายการประเมิน</th><th style={{padding: '5px'}}>x̄</th><th style={{padding: '5px'}}>S.D.</th><th style={{padding: '5px'}}>ระดับ</th></tr></thead>
                                <tbody>
                                    {qStats.map(q => (<tr key={q.no}><td style={{textAlign:'center', padding: '5px'}}>{q.no}</td><td style={{padding: '5px'}}>{q.text}</td><td style={{textAlign:'center', padding: '5px'}}>{q.mean.toFixed(2)}</td><td style={{textAlign:'center', padding: '5px'}}>{q.sd.toFixed(2)}</td><td style={{textAlign:'center', padding: '5px'}}>{getMeaning(q.mean)}</td></tr>))}
                                    <tr><td colSpan="2" style={{textAlign:'right', padding: '5px'}}><b>รวมเฉลี่ย</b></td><td style={{textAlign:'center', padding: '5px'}}><b>{grandMean.toFixed(2)}</b></td><td style={{textAlign:'center', padding: '5px'}}><b>{grandSd.toFixed(2)}</b></td><td style={{textAlign:'center', padding: '5px'}}><b>{getMeaning(grandMean)}</b></td></tr>
                                </tbody>
                            </table>
                            <p style={{ marginBottom: '20pt', textIndent: '2em', lineHeight: '1.5' }}>
                                จากตารางที่ 2 ผลการสำรวจความพึงพอใจในการจัดกิจกรรม พบว่า ผู้ตอบแบบสอบถามส่วนใหญ่มีความพึงพอใจในระดับ{getMeaning(grandMean)} โดยมีค่าเฉลี่ยเท่ากับ {grandMean.toFixed(2)} ซึ่งเมื่อพิจารณาเป็นรายข้อ พบว่า {top1.text} (ค่าเฉลี่ย {top1.mean.toFixed(2)}) รองลงมาคือ {top2.text} (ค่าเฉลี่ย {top2.mean.toFixed(2)}) อันดับที่ 3 คือ {top3.text} (ค่าเฉลี่ย {top3.mean.toFixed(2)})
                            </p>
                            
                            <h4>ตอนที่ 3 ข้อเสนอแนะ</h4>
                            <ul>{comments.length > 0 ? comments.map((c, i) => <li key={i}>{c}</li>) : <li>ไม่มีข้อเสนอแนะ</li>}</ul>
                        </div>

                        <div className="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
                            <div className="bg-gradient-to-br from-orange-500 to-orange-600 rounded-[2rem] p-8 text-white shadow-lg relative overflow-hidden">
                                <i className="fa-solid fa-users absolute -right-2 -bottom-2 text-8xl opacity-10 transform -rotate-12"></i>
                                <div className="relative z-10 flex flex-col h-full justify-between"><div className="w-12 h-12 bg-white/20 rounded-2xl flex items-center justify-center text-white mb-6 border border-white/20"><i className="fa-solid fa-file-signature text-xl"></i></div><div><p className="text-orange-100 text-xs font-bold uppercase tracking-widest mb-1">ผู้ตอบแบบประเมิน</p><h3 className="text-5xl font-black">{evals.length} <span className="text-base font-medium opacity-80">คน</span></h3></div></div>
                            </div>
                            <div className="md:col-span-2 bg-gradient-to-br from-indigo-500 to-indigo-700 rounded-[2rem] p-8 text-white shadow-lg relative overflow-hidden">
                                <i className="fa-solid fa-ranking-star absolute -right-4 top-4 text-9xl opacity-10"></i>
                                <div className="relative z-10 flex flex-col md:flex-row md:items-end justify-between h-full gap-6">
                                    <div><div className="w-12 h-12 bg-white/20 rounded-2xl flex items-center justify-center text-white mb-6 border border-white/20"><i className="fa-solid fa-chart-line text-xl"></i></div><p className="text-indigo-100 text-xs font-bold uppercase tracking-widest mb-1">ความพึงพอใจภาพรวม</p><div className="flex items-end gap-3"><h3 className="text-5xl font-black">{grandMean.toFixed(2)}</h3><p className="text-indigo-200 text-lg font-medium mb-1.5">/ 5.00 ({getMeaning(grandMean)})</p></div></div>
                                </div>
                            </div>
                        </div>

                        <div className="bg-white rounded-[1.5rem] border border-gray-100 shadow-sm overflow-hidden mb-8">
                            <div className="p-5 border-b border-gray-100 bg-gray-50/50"><h3 className="font-bold text-charcoal-900 text-sm">ส่วนที่ 2: ผลการประเมินรายข้อ</h3></div>
                            <div className="overflow-x-auto">
                                <table className="w-full text-left whitespace-nowrap"><thead className="bg-gray-50 border-b border-gray-100"><tr><th className="px-6 py-4 text-[10px] font-bold text-gray-500 uppercase text-center">ข้อ</th><th className="px-6 py-4 text-[10px] font-bold text-gray-500 uppercase">รายการประเมิน</th><th className="px-6 py-4 text-[10px] font-bold text-gray-500 uppercase text-center">คะแนนเฉลี่ย</th><th className="px-6 py-4 text-[10px] font-bold text-gray-500 uppercase text-center">ระดับ</th></tr></thead><tbody className="divide-y divide-gray-50 text-sm">
                                    {qStats.map(q => ( <tr key={q.no} className="hover:bg-orange-50/30"><td className="px-6 py-4 text-center font-bold text-gray-400">{q.no}.</td><td className="px-6 py-4 font-medium">{q.text}</td><td className="px-6 py-4 text-center font-bold">{q.mean.toFixed(2)}</td><td className="px-6 py-4 text-center"><span className={`inline-block px-3 py-1 rounded-md text-[10px] font-bold ${getBadgeColor(q.mean)}`}>{getMeaning(q.mean)}</span></td></tr> ))}
                                </tbody></table>
                            </div>
                        </div>
                    </div>
                );
            };

            const menuGroups = [
                { label: 'Dashboard', items: [{ id: 'overview', icon: 'fa-chart-pie', text: 'ภาพรวมระบบ' }] },
                { label: 'Activity System', items: [{ id: 'activities', icon: 'fa-list', text: 'จัดการกิจกรรม' }, { id: 'summary', icon: 'fa-users', text: 'ยอดเช็คชื่อ' }, { id: 'spss', icon: 'fa-file-lines', text: 'รายงานผลประเมิน' }] },
                { label: 'Recruitment', items: [{ id: 'manage_recruit', icon: 'fa-bullhorn', text: 'จัดการรับสมัคร' }, { id: 'registrations', icon: 'fa-user-plus', text: 'ข้อมูลผู้สมัคร' }] },
                { label: 'Welfare / Orders', items: [{ id: 'shirt_summary', icon: 'fa-shirt', text: 'สรุปการสั่งจองเสื้อ' }] }
            ];

            return (

                        <div className="flex-grow flex flex-col items-center pt-8 p-4 pb-20">
                            <div className="luxury-card w-full max-w-2xl p-6 sm:p-12 border-t-4 border-t-orange-500">
                                <div className="flex justify-between items-center mb-10 pb-6 border-b border-orange-100"><div className="flex items-center gap-4"><div className={`w-14 h-14 rounded-full flex items-center justify-center text-xl ${gProps.bg} ${gProps.text}`}><i className={`fa-solid ${gProps.icon}`}></i></div><div><p className="text-xs text-orange-400 font-medium uppercase tracking-widest">ข้อมูลการจองของ</p><h2 className="text-xl font-semibold text-charcoal-900">{student?.Name || ''}</h2></div></div><button onClick={() => setView('search')} className="text-xs text-orange-500 hover:text-orange-700 bg-orange-50 px-3 py-1.5 rounded-lg font-medium transition-colors">เปลี่ยนรหัส</button></div>
                                {(shirtPrice.popupText || shirtPrice.popupImage) && ( <div className="mb-8 bg-indigo-50 border border-indigo-100 p-4 rounded-2xl flex items-center justify-between shadow-sm"><div className="flex items-center gap-3"><div className="w-10 h-10 bg-indigo-100 text-indigo-600 rounded-full flex items-center justify-center text-lg shrink-0"><i className="fa-solid fa-bullhorn"></i></div><div><h4 className="text-sm font-bold text-indigo-900">ประกาศ / ตารางไซส์</h4><p className="text-xs text-indigo-700/80 line-clamp-1">โปรดตรวจสอบรายละเอียดก่อนสั่งจอง</p></div></div><button type="button" onClick={() => Swal.fire({ title: 'ประกาศ', text: shirtPrice.popupText || '', imageUrl: shirtPrice.popupImage || undefined, imageAlt: 'Popup', confirmButtonColor: '#ea580c' })} className="px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-semibold rounded-lg shadow-sm transition-colors whitespace-nowrap">เปิดดู</button></div> )}
                                <form onSubmit={handleSubmitShirtOrder}>
                                    <h2 className="text-2xl font-semibold text-charcoal-900 text-center mb-8">{isEditingOrder ? 'แก้ไขข้อมูลการจอง' : 'แบบฟอร์มสั่งจองเสื้อคณะ'}</h2>
                                    
                                    <ShirtSection num="01" title="เสื้อคอปกโปโล" genderState={poloGender} setGenderState={setPoloGender} sizeState={poloSize} setSizeState={setPoloSize} qtyState={poloQty} setQtyState={setPoloQty} getPrice={getPrice} />
                                    <ShirtSection num="02" title="เสื้อยืดกิจกรรม" genderState={tshirtGender} setGenderState={setTshirtGender} sizeState={tshirtSize} setSizeState={setTshirtSize} qtyState={tshirtQty} setQtyState={setTshirtQty} getPrice={getPrice} />
                                    
                                    <div className="bg-gradient-to-r from-orange-50 to-orange-100 p-6 rounded-2xl mb-6 flex justify-between items-center border border-orange-200/50"><div><p className="text-xs font-medium text-orange-600/70 uppercase tracking-widest mb-1">Grand Total</p><p className="text-sm font-semibold text-charcoal-900">ยอดชำระสุทธิ</p></div><div className="text-3xl font-bold text-orange-600">฿{grandTotal.toLocaleString()}</div></div>

                                    {grandTotal > 0 && (
                                        <div className="mb-8">
                                            <h3 className="font-semibold text-charcoal-900 mb-4 flex items-center"><span className="text-orange-500 mr-2">03.</span> วิธีการชำระเงิน</h3>
                                            <div className="flex gap-4 mb-6">
                                                <label className={`flex-1 py-4 rounded-xl border text-center cursor-pointer text-sm font-medium transition-all flex flex-col items-center justify-center gap-2 ${paymentMethod === 'promptpay' ? 'border-orange-500 bg-orange-50 text-orange-600 shadow-sm' : 'border-gray-200 text-gray-500 hover:border-orange-300'}`}><input type="radio" className="hidden" checked={paymentMethod === 'promptpay'} onChange={() => setPaymentMethod('promptpay')} /><i className="fa-solid fa-qrcode text-2xl mb-1"></i>ชำระผ่าน PromptPay</label>
                                                <label className={`flex-1 py-4 rounded-xl border text-center cursor-pointer text-sm font-medium transition-all flex flex-col items-center justify-center gap-2 ${paymentMethod === 'cash' ? 'border-orange-500 bg-orange-50 text-orange-600 shadow-sm' : 'border-gray-200 text-gray-500 hover:border-orange-300'}`}><input type="radio" className="hidden" checked={paymentMethod === 'cash'} onChange={() => setPaymentMethod('cash')} /><i className="fa-solid fa-money-bill-wave text-2xl mb-1"></i>ชำระด้วยเงินสด</label>
                                            </div>

                                            {paymentMethod === 'promptpay' ? (
                                                <div className="bg-white border border-blue-100 p-6 rounded-2xl mb-8 flex flex-col gap-6 shadow-sm">
                                                    <div className="flex flex-col sm:flex-row items-center justify-center gap-6"><div className="bg-white p-2 rounded-xl border border-gray-200 shadow-sm relative"><img src={`https://promptpay.io/0812345678/${grandTotal}.png`} alt="PromptPay QR" className="w-32 h-32 object-contain" /></div><div className="text-center sm:text-left"><h4 className="font-bold text-[#113566] mb-1 flex items-center justify-center sm:justify-start gap-2 text-lg">PromptPay</h4><p className="text-sm text-gray-600 font-medium mb-0.5">เบอร์พร้อมเพย์: 081-234-5678</p><p className="text-xs text-gray-500 mb-2">ชื่อบัญชี: สโมสรนักศึกษา คณะเทคโนโลยีดิจิทัล</p><div className="inline-block bg-orange-50 text-orange-600 px-3 py-1.5 rounded-lg text-[10px] font-semibold border border-orange-100">* โอนเงินยอด ฿{grandTotal.toLocaleString()} แล้วแนบสลิปด้านล่าง</div></div></div>
                                                    <div className="border-t border-dashed border-gray-200 pt-6">
                                                        <label className="block text-sm font-semibold text-charcoal-900 mb-3 text-center sm:text-left"><i className="fa-solid fa-file-invoice-dollar text-orange-500 mr-2"></i>แนบสลิปโอนเงิน (บังคับ)</label>
                                                        <label className="flex flex-col items-center justify-center w-full h-40 border-2 border-orange-200 border-dashed rounded-xl cursor-pointer bg-orange-50/30 hover:bg-orange-50 transition-colors relative overflow-hidden group">
                                                            {slipImage ? ( <div className="flex flex-col items-center justify-center relative w-full h-full"><img src={slipImage} className="absolute inset-0 w-full h-full object-cover opacity-30 blur-sm" alt="slip-bg" /><img src={slipImage} className="z-10 h-32 object-contain shadow-md rounded border border-white/50" alt="slip-preview" /><div className="absolute inset-0 bg-black/40 flex items-center justify-center opacity-0 group-hover:opacity-100 transition-opacity z-20"><span className="text-white text-xs font-medium px-4 py-2 bg-black/60 rounded-lg backdrop-blur-md flex items-center gap-2"><i className="fa-solid fa-pen"></i> เปลี่ยนรูปสลิป</span></div></div> ) : ( <div className="flex flex-col items-center justify-center pt-5 pb-6"><div className="w-12 h-12 bg-white rounded-full flex items-center justify-center shadow-sm border border-orange-100 mb-3 text-orange-400 group-hover:scale-110 transition-transform"><i className="fa-solid fa-cloud-arrow-up text-xl"></i></div><p className="mb-1 text-sm text-gray-600 font-medium"><span className="text-orange-600">คลิกเพื่ออัปโหลด</span> หรือลากไฟล์มาวาง</p><p className="text-xs text-gray-400">รองรับไฟล์ PNG, JPG ขนาดไม่เกิน 5MB</p></div> )}
                                                            <input type="file" className="hidden" accept="image/png, image/jpeg, image/jpg" onChange={(e) => { const file = e.target.files[0]; if (file) { if (file.size > 5 * 1024 * 1024) { Swal.fire('ไฟล์ใหญ่เกินไป', 'กรุณาอัปโหลดรูปขนาดไม่เกิน 5MB', 'warning'); e.target.value = ''; return; } const reader = new FileReader(); reader.onloadend = () => setSlipImage(reader.result); reader.readAsDataURL(file); } }} />
                                                        </label>
                                                    </div>
                                                </div>
                                            ) : (
                                                <div className="bg-white border border-amber-100 p-6 rounded-2xl mb-8 flex flex-col sm:flex-row items-center justify-center gap-5 shadow-sm bg-amber-50/30"><div className="w-16 h-16 bg-amber-100 text-amber-500 rounded-full flex items-center justify-center text-3xl shadow-sm border border-amber-200 shrink-0"><i className="fa-solid fa-money-bill-wave"></i></div><div className="text-center sm:text-left"><h4 className="font-bold text-amber-700 text-lg mb-1">ชำระด้วยเงินสด</h4><p className="text-sm text-amber-600/80 leading-relaxed">กรุณาเตรียมเงินสด <b className="text-amber-800 text-base">฿{grandTotal.toLocaleString()}</b> <br/>เพื่อนำมาชำระกับเจ้าหน้าที่ในภายหลัง</p></div></div>
                                            )}
                                        </div>
                                    )}

                                    <div className="flex gap-4">
                                        {isEditingOrder && <button type="button" onClick={() => setView('receipt')} className="w-1/3 py-4 rounded-xl border border-gray-200 text-gray-600 font-semibold text-sm hover:bg-gray-50 transition-colors">ยกเลิก</button>}
                                        {shirtSystemOpen ? ( <button type="submit" className={`${isEditingOrder ? 'w-2/3' : 'w-full'} btn-gradient py-4 rounded-xl font-semibold tracking-wider text-sm shadow-lg shadow-orange-500/20`}>ยืนยันการสั่งจอง</button> ) : ( <button type="button" disabled className={`${isEditingOrder ? 'w-2/3' : 'w-full'} bg-gray-200 text-gray-500 py-4 rounded-xl font-bold tracking-wider text-sm cursor-not-allowed`}>ระบบปิดรับจองแล้ว</button> )}
                                    </div>
                                </form>
                            </div>
                        </div>
                    );
                }

                if (view === 'history_search') {
                    return (
                        <div className="flex-grow flex flex-col items-center justify-center p-6">
                            <div className="luxury-card w-full max-w-md p-10 relative">
                                <button onClick={goHome} className="absolute top-6 left-6 text-gray-400 hover:text-orange-500 transition-colors text-sm"><i className="fa-solid fa-arrow-left mr-1"></i> กลับหน้าหลัก</button>
                                <div className="text-center mt-10 mb-8"><h2 className="text-2xl font-semibold text-charcoal-900 tracking-tight">ตรวจสอบประวัติ</h2><p className="text-gray-500 mt-2 text-sm font-light">ตรวจสอบประวัติการเข้าร่วมกิจกรรมของคุณ</p></div>
                                <form onSubmit={(e) => { e.preventDefault(); handleSearchHistory(e.target.studentId.value); }}>
                                    <div className="mb-8"><input type="text" name="studentId" required placeholder="รหัสนักศึกษา หรือ เลข ปชช." defaultValue={localStorage.getItem('last_student_id')||''} className="w-full luxury-input text-center tracking-widest text-lg font-medium" /></div>
                                    <button type="submit" className="w-full btn-gradient py-4 rounded-xl font-semibold tracking-wider text-sm shadow-lg shadow-orange-500/20">ค้นหาประวัติ <i className="fa-solid fa-search ml-2"></i></button>
                                </form>
                            </div>
                        </div>
                    );
                }

                if (view === 'history_result') {
                    return (
                        <div className="flex-grow flex flex-col items-center pt-8 p-6 pb-20">
                            <div className="luxury-card w-full max-w-2xl p-6 sm:p-10 border-t-4 border-t-orange-500">
                                <div className="flex items-center justify-between mb-8 pb-4 border-b border-orange-100"><div><h2 className="text-xl font-semibold text-charcoal-900">ประวัติการเข้าร่วมกิจกรรม</h2><p className="text-gray-500 text-sm font-light mt-1">พบข้อมูลทั้งหมด {historyData.length} รายการ</p></div><button onClick={() => setView('history_search')} className="text-xs text-orange-500 hover:text-orange-700 bg-orange-50 px-3 py-1.5 rounded-lg transition-colors font-medium">ค้นหาใหม่</button></div>
                                <div className="space-y-4">
                                    {historyData.length === 0 ? ( <div className="text-center py-16"><p className="text-gray-400 font-light">ไม่พบประวัติการเข้าร่วมกิจกรรม</p></div> ) : (
                                        <div className="relative border-l border-orange-200 ml-4 sm:ml-6 pl-6 sm:pl-8 space-y-8 py-2">
                                            {historyData.map((h, i) => (
                                                <div key={i} className="relative group">
                                                    <div className="absolute -left-[30px] sm:-left-[38px] top-1.5 w-3 h-3 bg-white border-2 border-orange-500 rounded-full transition-transform group-hover:scale-125 group-hover:bg-orange-100"></div>
                                                    <div className="bg-white p-5 rounded-xl border border-orange-50/80 shadow-[0_2px_10px_rgba(249,115,22,0.03)] transition-all hover:shadow-[0_4px_15px_rgba(249,115,22,0.08)] hover:border-orange-200">
                                                        <div className="flex flex-col sm:flex-row sm:justify-between sm:items-start gap-4"><div><p className="text-[10px] text-orange-400 font-medium uppercase tracking-widest mb-1">เข้าร่วมแล้ว</p><h4 className="font-semibold text-charcoal-900 text-lg mb-1">{h.ActivityName}</h4><p className="text-sm text-gray-500 font-light">{h.Name} ({h.StudentID})</p></div><div className="text-xs text-gray-500 font-light whitespace-nowrap bg-orange-50/80 text-orange-700 px-3 py-1.5 rounded-md border border-orange-100">{h.Timestamp ? new Date(h.Timestamp).toLocaleString('th-TH') : '-'}</div></div>
                                                    </div>
                                                </div>
                                            ))}
                                        </div>
                                    )}
                                </div>
                            </div>
                        </div>
                    );
                }

                if (view === 'receipt') {
                    const handleDownloadReceipt = () => {
                        const receiptElement = document.getElementById('receipt-card'); Swal.fire({ title: 'กำลังประมวลผล...', allowOutsideClick: false, didOpen: () => { Swal.showLoading() } });
                        html2canvas(receiptElement, { scale: 2, backgroundColor: isDarkMode ? '#1e1e1e' : '#fffcf9' }).then(canvas => { const link = document.createElement('a'); link.download = `Receipt_${receiptData.student.StudentID}.png`; link.href = canvas.toDataURL('image/png'); link.click(); Swal.close(); }).catch(() => Swal.fire('Error', 'ไม่สามารถสร้างรูปภาพได้', 'error'));
                    };
                    return (
                        <div className="flex-grow flex flex-col items-center pt-8 p-4 pb-20">
                            <div className="w-full max-w-[1200px]">
                                <div className="flex justify-between items-end mb-6 px-2"><div><h2 className="text-2xl font-semibold text-charcoal-900">เอกสารยืนยันการจอง</h2><p className="text-gray-500 text-sm font-light mt-1">โปรดดาวน์โหลดใบเสร็จนี้เก็บไว้เป็นหลักฐาน</p></div><p className="text-xs text-orange-500 font-medium xl:hidden"><i className="fa-solid fa-arrows-left-right"></i> เลื่อนซ้ายขวาเพื่อดูฉบับเต็ม</p></div>
                                <div className="w-full overflow-x-auto pb-6 custom-scrollbar">
                                    <div id="receipt-card" className="bg-white flex flex-row justify-between items-stretch shadow-sm border border-orange-100/50" style={{ width: '1123px', minHeight: '794px', margin: '0 auto' }}>
                                        <ReceiptSlipComponent title="ORIGINAL" data={receiptData} config={receiptSettings} shirtPrice={shirtPrice} />
                                        <div className="flex flex-col items-center justify-center gap-4 text-gray-300 bg-orange-50/30 px-1 border-x border-dashed border-orange-200/50"><i className="fa-solid fa-scissors text-orange-300 text-xs transform -rotate-90"></i><span className="text-[9px] font-medium uppercase tracking-[0.2em] whitespace-nowrap opacity-50 text-orange-400" style={{ writingMode: 'vertical-rl', transform: 'rotate(180deg)' }}>Cut Here</span><i className="fa-solid fa-scissors text-orange-300 text-xs transform rotate-90"></i></div>
                                        <ReceiptSlipComponent title="COPY" data={receiptData} config={receiptSettings} shirtPrice={shirtPrice} />
                                    </div>
                                </div>
                                <div className="flex flex-col sm:flex-row justify-center gap-4 mt-4 max-w-[800px] w-full mx-auto">
                                    <button onClick={goHome} className="w-full sm:w-1/4 bg-white text-charcoal-900 font-semibold py-4 rounded-xl border border-gray-200 hover:bg-orange-50 transition-colors text-sm tracking-wider">กลับหน้าแรก</button>
                                    {shirtSystemOpen && <button onClick={() => { setIsEditingOrder(true); setView('shirt_form'); }} className="w-full sm:w-1/4 btn-primary py-4 rounded-xl font-semibold text-sm tracking-wider hover:bg-gray-800">แก้ไขข้อมูล</button>}
                                    <button onClick={handleDownloadReceipt} className="w-full sm:w-2/4 btn-gradient py-4 rounded-xl font-semibold flex justify-center items-center gap-2 text-sm tracking-wider shadow-lg shadow-orange-500/20"><i className="fa-solid fa-download"></i> โหลดใบเสร็จ</button>
                                </div>
                            </div>
                        </div>
                    );
                }

                if (view === 'admin_login') {
                    const handleAdminLogin = (e) => {
                        e.preventDefault();
                        if(e.target.username.value === 'admin' && e.target.password.value === '9999') {
                            localStorage.setItem('admin_logged_in', 'true'); loadAdminData();
                        } else { 
                            Swal.fire({
                                title: 'ข้อมูลไม่ถูกต้อง', 
                                text: 'รหัสผ่านหรือชื่อผู้ใช้ผิด กรุณาลองใหม่', 
                                icon: 'error',
                                confirmButtonColor: '#ea580c'
                            }).then(() => {
                                goHome();
                            }); 
                        }
                    };

                    return (
                        <div className="flex-grow flex items-center justify-center p-6 relative z-10">
                            <div className="bg-[#1f1f1f] w-full max-w-md p-10 rounded-2xl border border-[#333] shadow-2xl shadow-orange-500/5">
                                <div className="text-center mb-10">
                                    <h2 className="text-2xl font-light text-white tracking-widest uppercase">Workspace</h2>
                                    <p className="text-gray-500 mt-2 text-sm font-light">สำหรับเจ้าหน้าที่เท่านั้น</p>
                                </div>
                                <form onSubmit={handleAdminLogin} className="space-y-6">
                                    <input type="text" name="username" placeholder="Username" required
                                           className="w-full border-b border-gray-700 bg-transparent text-white px-0 py-3 focus:border-orange-500 outline-none transition-colors font-light text-sm" />
                                    <input type="password" name="password" placeholder="Password" required
                                           className="w-full border-b border-gray-700 bg-transparent text-white px-0 py-3 focus:border-orange-500 outline-none transition-colors font-light text-sm" />
                                    <button type="submit" className="w-full bg-gradient-to-r from-orange-500 to-orange-600 text-white font-semibold py-4 rounded-lg hover:from-orange-400 hover:to-orange-500 transition-colors mt-8 text-sm tracking-wider shadow-lg">LOGIN</button>
                                </form>
                                <button onClick={goHome} className="w-full text-gray-500 hover:text-white mt-6 text-xs transition-colors font-light uppercase tracking-widest">กลับหน้าแรก</button>
                            </div>
                        </div>
                    );
                }

                return null;
            };

            if (view === 'admin_dashboard') {
                return <AdminDashboard data={adminData} reloadData={loadAdminData} goHome={goHome} setAdminData={setAdminData} />;
            }

            return (
                <div className="min-h-screen flex flex-col relative z-10">
                    <Navbar />
                    {renderView()}
                    {view !== 'admin_login' && view !== 'admin_dashboard' && <Footer />}
                    <MobileTabBar />
                </div>
            );
        };

        // ==========================================
        // INITIALIZATION
        // ==========================================
        try {
            const root = ReactDOM.createRoot(document.getElementById('root'));
            root.render(<App />);
        } catch (err) {
            console.error("React Failed to Initialize:", err);
            document.getElementById('root').innerHTML = `
                <div style="display:flex; flex-direction:column; align-items:center; justify-content:center; height:100vh; font-family:sans-serif; text-align:center; padding:20px;">
                    <h1 style="color:#e63946;">ระบบขัดข้อง (System Error)</h1>
                    <p style="color:#4b5563; max-width:500px;">เกิดข้อผิดพลาดในการโหลดระบบ กรุณารีเฟรชหน้าเว็บใหม่อีกครั้ง</p>
                    <code style="background:#fee2e2; color:#b91c1c; padding:10px; border-radius:5px; margin-top:15px; font-size:12px;">${err.message}</code>
                </div>
            `;
        }
    </script>
</body>
</html>
