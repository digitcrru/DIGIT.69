        /* Scrollbars */
        .no-scrollbar::-webkit-scrollbar { display: none; }

        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }

<body class="selection:bg-brand-500 selection:text-white">

        <div class="loader-ring"></div>
        <h2 style="font-family: 'Prompt', sans-serif; font-size: 16px; font-weight: 700; background: linear-gradient(135deg, #ff621f 0%, #f43f5e 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; letter-spacing: 0.1em;">DIGIT.CRRU</h2>

    <script>
        setTimeout(() => {
            const loader = document.getElementById('app-loader');
            if (loader && loader.style.display !== 'none') {
                loader.style.opacity = '0';
                setTimeout(() => { loader.style.display = 'none'; }, 400);

    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        // ==========================================
        // ตั้งค่า URL ตรงนี้ให้ถูกต้อง
        // ==========================================
        const API_CONFIG = {
            USE_FAST_CSV: true,
            SHEET_ID: "1KLJNWUUIj1r6eqCZnaF-F6nA2FQg7pvOHMk0PyDCyAc", // เปลี่ยนเป็น Sheet ID ของคุณ
            WEB_APP_URL: "https://script.google.com/macros/s/AKfycbz07BB-ibm51q9SC2ZnVVP-FyxwF0jTqPlCg9QZ-TN4d1zqvReQjEU-3Qv1Q27cjgq5zw/exec", // เปลี่ยนเป็น Web App URL ของคุณ
            getCSVUrl: function(sheetName) {
                return `https://docs.google.com/spreadsheets/d/${this.SHEET_ID}/gviz/tq?tqx=out:csv&headers=0&sheet=${sheetName}&_=${new Date().getTime()}`;
            }
        };

        const isFastCSVReady = () => API_CONFIG.USE_FAST_CSV && API_CONFIG.SHEET_ID && !API_CONFIG.SHEET_ID.includes('ใส่_SHEET_ID');

        const fetchFastCSV = (sheetName) => {
            return new Promise((resolve, reject) => {
                if(!isFastCSVReady()) return reject(new Error("โหมด CSV ถูกปิดใช้งาน"));
                Papa.parse(API_CONFIG.getCSVUrl(sheetName), {
                    download: true, 
                    header: false, 
                    skipEmptyLines: true,
                    complete: (results) => {
                        const raw = results.data;
                        if (!raw || raw.length === 0) return resolve([]);
                        
                        const firstCell = String(raw[0][0] || '').toLowerCase();
                        if (firstCell.includes('<!doctype') || firstCell.includes('<html')) {
                            return reject(new Error("การอนุญาตถูกปฏิเสธ: ไม่สามารถโหลดข้อมูลได้ กรุณาตั้งค่าแชร์ไฟล์ Google Sheets เป็น 'ทุกคนที่มีลิงก์'"));
                        }

                        if (raw.length < 2) return resolve([]); 

                        const headers = raw[0].map(h => String(h).trim().replace(/^\uFEFF/, ''));
                        const formattedData = [];

                        for (let i = 1; i < raw.length; i++) {
                            const row = raw[i];
                            const obj = {};
                            for (let j = 0; j < headers.length; j++) {
                                obj[headers[j]] = row[j] !== undefined ? row[j] : '';
                            }
                            formattedData.push(obj);
                        }
                        resolve(formattedData);
                    },
                    error: (error) => reject(error)
                });
            });
        };

        const runGAS = async (functionName, ...args) => {
            if (typeof google !== 'undefined' && google.script && google.script.run) {
                return new Promise((resolve, reject) => {
                    google.script.run.withSuccessHandler(resolve).withFailureHandler(reject)[functionName](...args);
                });
            } else if (API_CONFIG.WEB_APP_URL && API_CONFIG.WEB_APP_URL.startsWith("https://script.google.com")) {
                try {
                    const response = await fetch(API_CONFIG.WEB_APP_URL, {
                        method: 'POST', redirect: 'follow',
                        body: JSON.stringify({ action: functionName, params: args }),
                        headers: { 'Content-Type': 'text/plain' } 
                    });
                    const result = await response.json();
                    if (result.success === false && result.error) throw new Error(result.error);
                    return result.data !== undefined ? result.data : result;
                } catch (error) { 
                    console.warn(`ข้อผิดพลาดการเชื่อมต่อ API (${functionName}):`, error);
                    if (error.name === 'TypeError' || error.message.includes('Failed to fetch')) {
                        throw new Error('ไม่สามารถเชื่อมต่อฐานข้อมูลได้ \nกรุณาตรวจสอบว่าสิทธิ์การแชร์ของ Web App เป็น "ทุกคน" และอัปเดตเป็น "เวอร์ชันใหม่" แล้ว');
                    }
                    throw error; 
                }
            } else {
                Swal.fire({
                    title: 'การตั้งค่าระบบไม่สมบูรณ์', 
                    text: 'กรุณากำหนดค่า SHEET_ID และ WEB_APP_URL ในโค้ดก่อนเริ่มใช้งานครับ', 
                    icon: 'warning',
                    confirmButtonColor: '#ff621f'
                });
                return new Promise((resolve) => setTimeout(() => resolve({ success: false, error: 'ไม่พบ WEB_APP_URL' }), 500));
            }
        };

        const surveyData = [
            {
                title: "1. กระบวนการ ขั้นตอนการให้บริการ",
                questions: [
                    { id: "q1", text: "1.1 การประชาสัมพันธ์โครงการ ฯ" }, { id: "q2", text: "1.2 ความเหมาะสมของสถานที่" },
                    { id: "q3", text: "1.3 ความเหมาะสมของระยะเวลา" }, { id: "q4", text: "1.4 การจัดลำดับขั้นตอนของกิจกรรม" }
                ]
            },
            {
                title: "2. การอำนวยความสะดวก",
                questions: [
                    { id: "q5", text: "2.1 เอกสาร" }, { id: "q6", text: "2.2 โสตทัศนูปกรณ์" },
                    { id: "q7", text: "2.3 เจ้าหน้าที่สนับสนุน" }, { id: "q8", text: "2.4 อาหาร,เครื่องดื่มและสถานที่" }
                ]
            },
            {
                title: "3. คุณภาพการให้บริการ",
                questions: [
                    { id: "q9", text: "3.1 ท่านได้รับความรู้ แนวคิด ทักษะและประสบการณ์ใหม่ ๆ จากโครงการ" },
                    { id: "q10", text: "3.2 ท่านสามารถนำสิ่งที่ได้รับจากโครงการ/กิจกรรมนี้ไปใช้ในการปฏิบัติงาน" },
                    { id: "q11", text: "3.3 สิ่งที่ท่านได้รับจากโครงการ/กิจกรรมครั้งนี้ตรงตามความคาดหวังของท่านหรือไม่" },
                    { id: "q12", text: "3.4 โครงการ/กิจกรรมนี้เอื้ออำนวยต่อการเรียนรู้และพัฒนาความสามารถของท่าน" },
                    { id: "q13", text: "3.5 ประโยชน์ที่ท่านได้รับจากโครงการ/กิจกรรม" }
                ]
            }
        ];

        const getGenderProps = (nameStr) => {
            if (!nameStr) return { icon: 'fa-user', bg: 'bg-brand-50 text-brand-600 border-brand-200' };
            if (nameStr.startsWith('นาย')) return { icon: 'fa-person', bg: 'bg-blue-50 text-blue-600 border-blue-200' };
            if (nameStr.startsWith('นาง') || nameStr.startsWith('น.ส.')) return { icon: 'fa-person-dress', bg: 'bg-rose-50 text-rose-600 border-rose-200' };
            return { icon: 'fa-user', bg: 'bg-brand-50 text-brand-600 border-brand-200' };
        };

        function App() {
            const [view, setView] = useState(() => {
                const savedView = sessionStorage.getItem('app_view');
                if (savedView === 'admin_dashboard' && localStorage.getItem('admin_logged_in') === 'true') return 'admin_dashboard';
                if (['home', 'search', 'history_search', 'admin_login'].includes(savedView)) return savedView;
                return 'home';
            }); 
            
            const [student, setStudent] = useState(null);
            const [activities, setActivities] = useState([]);
            const [selectedActivity, setSelectedActivity] = useState(null);
            const [surveyAnswers, setSurveyAnswers] = useState({});
            const [suggestion, setSuggestion] = useState('');
            const [historyData, setHistoryData] = useState([]);

            const [systemOpen, setSystemOpen] = useState(true);
            const [adminData, setAdminData] = useState(null);

            const [searchPurpose, setSearchPurpose] = useState(() => sessionStorage.getItem('search_purpose') || 'activity');
            
            const [shirtSystemOpen, setShirtSystemOpen] = useState(true);
            const [shirtPrice, setShirtPrice] = useState({ normal: 250, oversize: 380, status: 'open', popupText: '', popupImage: '' });
            const [receiptSettings, setReceiptSettings] = useState({ header: 'สโมสรนักศึกษาคณะเทคโนโลยีดิจิทัล มหาวิทยาลัยราชภัฏเชียงราย\nที่อยู่: 80 ซอย 9 ตำบล บ้านดู่ อำเภอเมืองเชียงราย เชียงราย 57100', note: 'กรุณานำใบเสร็จนี้มาแสดงในวันรับเสื้อ' });
            
            const [isEditingOrder, setIsEditingOrder] = useState(false);
            const [poloGender, setPoloGender] = useState('ชาย');
            const [poloSize, setPoloSize] = useState('M');
            const [poloQty, setPoloQty] = useState(1);
            const [tshirtGender, setTshirtGender] = useState('ชาย');
            const [tshirtSize, setTshirtSize] = useState('M');
            const [tshirtQty, setTshirtQty] = useState(1);
            const [paymentMethod, setPaymentMethod] = useState('promptpay'); 
            const [slipImage, setSlipImage] = useState(null); 
            const [receiptData, setReceiptData] = useState(null);

            const [isDarkMode, setIsDarkMode] = useState(() => localStorage.getItem('theme') === 'dark');

            useEffect(() => {
                const loader = document.getElementById('app-loader');
                if (loader) {
                    loader.style.opacity = '0';
                    setTimeout(() => {
                        loader.style.visibility = 'hidden';
                        loader.style.display = 'none';
                    }, 300);
                }
            }, []);

            useEffect(() => { sessionStorage.setItem('app_view', view); }, [view]);
            useEffect(() => { sessionStorage.setItem('search_purpose', searchPurpose); }, [searchPurpose]);

            useEffect(() => {
                if (isDarkMode) { document.documentElement.classList.add('dark'); localStorage.setItem('theme', 'dark'); }
                else { document.documentElement.classList.remove('dark'); localStorage.setItem('theme', 'light'); }
            }, [isDarkMode]);

            const loadAdminData = () => {
                if (API_CONFIG.USE_FAST_CSV && !isFastCSVReady()) {
                    Swal.fire({ title: 'การตั้งค่าระบบไม่สมบูรณ์', text: 'กรุณากำหนดค่า SHEET_ID ในโค้ดครับ', icon: 'warning', confirmButtonColor: '#ff621f' });
                    return;
                }

                Swal.fire({ title: 'กำลังซิงค์ข้อมูล...', allowOutsideClick: false, didOpen: () => { Swal.showLoading() } });
                setTimeout(async () => {
                    try {
                        let data;
                        if (isFastCSVReady()) {
                            const [acts, chks, evals, shirts, settings] = await Promise.all([
                                fetchFastCSV('Activities').catch(() => []), 
                                fetchFastCSV('CheckIns').catch(() => []),
                                fetchFastCSV('Evaluations').catch(() => []), 
                                fetchFastCSV('ShirtOrders').catch(() => []),
                                fetchFastCSV('Settings').catch(() => [])
                            ]);
                            
                            let priceInfo = { normal: 250, oversize: 380, status: 'open', receiptHeader: 'สโมสรนักศึกษาคณะเทคโนโลยีดิจิทัล มหาวิทยาลัยราชภัฏเชียงราย', receiptNote: 'กรุณานำใบเสร็จนี้มาแสดงในวันรับเสื้อ', systemStatus: 'open', popupText: '', popupImage: '' };
                            
                            if (settings && settings.length > 0) {
                                const priceRow = settings.find(r => r.Key === 'ShirtPrice') || {Value1: 250, Value2: 380};
                                const statusRow = settings.find(r => r.Key === 'ShirtStatus') || {Value1: 'open', Value2: ''};
                                const receiptRow = settings.find(r => r.Key === 'ReceiptConfig') || {Value1: priceInfo.receiptHeader, Value2: priceInfo.receiptNote};
                                const systemRow = settings.find(r => r.Key === 'SystemStatus') || {Value1: 'open', Value2: ''};
                                const popupRow = settings.find(r => r.Key === 'ShirtPopup') || {Value1: '', Value2: ''};
                                
                                priceInfo = { 
                                    normal: Number(priceRow.Value1), oversize: Number(priceRow.Value2), 
                                    status: statusRow.Value1, receiptHeader: receiptRow.Value1, receiptNote: receiptRow.Value2,
                                    systemStatus: systemRow.Value1,
                                    popupText: popupRow.Value1, popupImage: popupRow.Value2 
                                };
                            } else {
                                try { priceInfo = await runGAS('getShirtPrice'); } catch(err) { console.warn("กลับไปใช้การตั้งค่าเริ่มต้น"); }
                            }
                            
                            data = { activities: acts, checkins: chks, evaluations: evals, shirtOrders: shirts, shirtPrice: priceInfo };
                        } else { 
                            data = await runGAS('getAdminDashboardData'); 
                        }
                        
                        setAdminData(data || { activities: [], checkins: [], evaluations: [], shirtOrders: [], shirtPrice: {} }); 
                        if (data && data.shirtPrice) { 
                            setShirtPrice(data.shirtPrice); 
                            setShirtSystemOpen(data.shirtPrice.status !== 'closed'); 
                            setSystemOpen(data.shirtPrice.systemStatus !== 'maintenance');
                        }
                        
                        setTimeout(() => {
                            Swal.close(); 
                            setView('admin_dashboard');
                        }, 50);

                    } catch(e) { Swal.fire('ข้อผิดพลาดการเชื่อมต่อ', e.message, 'error'); }
                }, 100);
            };

            useEffect(() => {
                const loadInitialData = async () => {
                    try {
                        let acts = [];
                        if (isFastCSVReady()) {
                            const allActs = await fetchFastCSV('Activities');
                            acts = allActs.filter(a => a.Status === 'open');
                        } else { acts = await runGAS('getActiveActivities'); }
                        setActivities(acts || []);
                        
                        let priceInfo = null;
                        if (isFastCSVReady()) {
                            try {
                                const settings = await fetchFastCSV('Settings');
                                const priceRow = settings.find(r => r.Key === 'ShirtPrice') || {Value1: 250, Value2: 380};
                                const statusRow = settings.find(r => r.Key === 'ShirtStatus') || {Value1: 'open', Value2: ''};
                                const receiptRow = settings.find(r => r.Key === 'ReceiptConfig') || {Value1: 'สโมสรนักศึกษาคณะเทคโนโลยีดิจิทัล', Value2: 'กรุณานำใบเสร็จนี้มาแสดงในวันรับเสื้อ'};
                                const systemRow = settings.find(r => r.Key === 'SystemStatus') || {Value1: 'open', Value2: ''};
                                const popupRow = settings.find(r => r.Key === 'ShirtPopup') || {Value1: '', Value2: ''};
                                
                                priceInfo = { 
                                    normal: Number(priceRow.Value1), oversize: Number(priceRow.Value2), 
                                    status: statusRow.Value1, receiptHeader: receiptRow.Value1, receiptNote: receiptRow.Value2,
                                    systemStatus: systemRow.Value1,
                                    popupText: popupRow.Value1, popupImage: popupRow.Value2
                                };
                            } catch(e) { priceInfo = await runGAS('getShirtPrice'); }
                        } else { priceInfo = await runGAS('getShirtPrice'); }

                        if (priceInfo) {
                            setShirtPrice(priceInfo);
                            setShirtSystemOpen(priceInfo.status !== 'closed');
                            setSystemOpen(priceInfo.systemStatus !== 'maintenance');
                            setReceiptSettings({ header: priceInfo.receiptHeader, note: priceInfo.receiptNote });
                        }
                    } catch (e) { console.error("การโหลดข้อมูลเริ่มต้นล้มเหลว", e); }
                };

                if (view === 'admin_dashboard' && localStorage.getItem('admin_logged_in') === 'true') {
                    if (!adminData) loadAdminData();
                } else {
                    loadInitialData();
                }
            }, [view, adminData]); 

            const goHome = () => {
                setStudent(null); setSearchPurpose('activity');
                setPoloGender('ชาย'); setPoloSize('M'); setPoloQty(1);
                setTshirtGender('ชาย'); setTshirtSize('M'); setTshirtQty(1);
                setPaymentMethod('promptpay'); 
                setReceiptData(null); setIsEditingOrder(false); setSlipImage(null); setView('home');
            };

            const handleSearchStudent = async (rawStudentId) => {
                const studentId = String(rawStudentId).trim();
                if(!studentId) return Swal.fire('แจ้งเตือน', 'กรุณากรอกรหัสนักศึกษา', 'warning');
                Swal.fire({ title: 'กำลังตรวจสอบ...', allowOutsideClick: false, didOpen: () => { Swal.showLoading() } });
                try {
                    let res = { success: false };
                    if (isFastCSVReady()) {
                        try {
                            const allStudents = await fetchFastCSV('Students');
                            const studentData = allStudents.find(s => String(s.StudentID).trim() === studentId || String(s.IDCard).trim() === studentId);
                            if (studentData) res = { success: true, data: studentData };
                            else res = { success: false };
                        } catch(csvErr) { res = await runGAS('verifyStudent', studentId).catch(e => { throw e }); }
                    } else { res = await runGAS('verifyStudent', studentId); }

                    if(res.success) {
                        setStudent(res.data);
                        localStorage.setItem('last_student_id', studentId);

                        if (searchPurpose === 'shirt') {
                            let orderCheck = { hasOrdered: false };
                            if (isFastCSVReady()) {
                                try {
                                    const allOrders = await fetchFastCSV('ShirtOrders');
                                    for (let i = allOrders.length - 1; i >= 0; i--) {
                                        if (String(allOrders[i].StudentID).trim() === studentId) {
                                            orderCheck = { hasOrdered: true, data: allOrders[i] };
                                            break;
                                        }
                                    }
                                } catch(csvErr) { orderCheck = await runGAS('checkShirtOrder', studentId); }
                            } else { orderCheck = await runGAS('checkShirtOrder', studentId); }

                            Swal.close();
                            if (orderCheck.hasOrdered && orderCheck.data) {
                                const pastOrder = orderCheck.data;
                                setReceiptData({
                                    student: res.data,
                                    poloGender: pastOrder.PoloGender || 'ชาย', poloSize: pastOrder.PoloSize, poloQty: Number(pastOrder.PoloQty),
                                    tshirtGender: pastOrder.TshirtGender || 'ชาย', tshirtSize: pastOrder.TshirtSize, tshirtQty: Number(pastOrder.TshirtQty),
                                    grandTotal: Number(pastOrder.TotalPrice),
                                    paymentMethod: pastOrder.PaymentMethod || (pastOrder.SlipImage || pastOrder.SlipURL || pastOrder.Slip ? 'promptpay' : 'cash'),
                                    orderId: 'ORD-' + new Date(pastOrder.Timestamp).getTime().toString().slice(-6),
                                    date: new Date(pastOrder.Timestamp).toLocaleString('th-TH')
                                });
                                setPoloGender(pastOrder.PoloGender || 'ชาย'); setPoloSize(pastOrder.PoloSize); setPoloQty(Number(pastOrder.PoloQty));
                                setTshirtGender(pastOrder.TshirtGender || 'ชาย'); setTshirtSize(pastOrder.TshirtSize); setTshirtQty(Number(pastOrder.TshirtQty));
                                setPaymentMethod(pastOrder.PaymentMethod || (pastOrder.SlipImage || pastOrder.SlipURL || pastOrder.Slip ? 'promptpay' : 'cash'));
                                setView('receipt');
                            } else { setView('shirt_form'); }
                        } else { Swal.close(); setView('select'); }
                    } else { 
                        Swal.close(); 
                        Swal.fire({
                            title:'ไม่พบข้อมูล', 
                            text:'ไม่พบข้อมูลของท่านในฐานข้อมูล กรุณาติดต่อฝ่ายกิจการนักศึกษา', 
                            icon:'error', 
                            confirmButtonColor: '#ff621f'
                        }); 
                    }
                } catch(e) { Swal.fire('ข้อผิดพลาด', e.message, 'error'); }
            };

            const handleSelectActivity = async (act) => {
                Swal.fire({ title: 'กำลังตรวจสอบสิทธิ์...', allowOutsideClick: false, didOpen: () => { Swal.showLoading() } });
                try {
                    let hasJoined = false;
                    if (isFastCSVReady()) {
                        const allChks = await fetchFastCSV('CheckIns').catch(() => []);
                        hasJoined = allChks.some(c => 
                            (String(c.StudentID) === String(student.StudentID) || (student.IDCard && String(c.IDCard) === String(student.IDCard))) && 
                            String(c.ActivityID).trim() === String(act.ActivityID).trim()
                        );
                    } else {
                        const history = await runGAS('getStudentHistory', student.StudentID);
                        hasJoined = history.some(h => String(h.ActivityID).trim() === String(act.ActivityID).trim());
                    }

                    Swal.close();
                    if (hasJoined) {
                        Swal.fire({
                            title: 'ลงทะเบียนแล้ว',
                            text: 'คุณได้ลงทะเบียนเข้าร่วมกิจกรรมนี้ไปแล้ว',
                            icon: 'info',
                            confirmButtonColor: '#ff621f'
                        });
                    } else {
                        setSelectedActivity(act);
                        setView('survey');
                    }
                } catch(e) {
                    Swal.close();
                    setSelectedActivity(act);
                    setView('survey');
                }
            };

            const handleSubmitShirtOrder = async (e) => {
                e.preventDefault();
                if (!shirtSystemOpen) return Swal.fire({ title: 'ระบบปิดให้บริการ', text: 'ระบบปิดรับการสั่งจองแล้ว', icon: 'error', confirmButtonColor: '#ff621f' });
                if (poloQty < 1 || tshirtQty < 1) return Swal.fire('แจ้งเตือน', 'ระบุจำนวนอย่างน้อย 1 ตัว', 'warning');
                
                const getPrice = (size) => ['XL', '2XL', '3XL'].includes(size) ? shirtPrice.oversize : shirtPrice.normal;
                const grandTotal = (getPrice(poloSize) * poloQty) + (getPrice(tshirtSize) * tshirtQty);
                
                if (grandTotal > 0 && paymentMethod === 'promptpay' && !slipImage) {
                    return Swal.fire('แจ้งเตือน', 'กรุณาแนบสลิปการโอนเงิน', 'warning');
                }

                Swal.fire({ title: 'กำลังดำเนินการ...', text: 'กรุณารอสักครู่', allowOutsideClick: false, didOpen: () => { Swal.showLoading() } });
                try {
                    const payload = { student, poloGender, poloSize, poloQty, tshirtGender, tshirtSize, tshirtQty, grandTotal, slipImage, paymentMethod };
                    const res = await runGAS('saveShirtOrder', payload);
                    Swal.close();
                    if(res.success) {
                        setReceiptData({ ...payload, orderId: 'ORD-' + Date.now().toString().slice(-6), date: new Date().toLocaleString('th-TH') });
                        Swal.fire({ title: 'สำเร็จ', icon: 'success', confirmButtonColor: '#10b981' }).then(() => { setIsEditingOrder(false); setView('receipt'); });
                    } else { Swal.fire('ข้อผิดพลาด', res.error, 'error'); }
                } catch(e) { Swal.fire('ข้อผิดพลาด', e.message, 'error'); }
            };

            const handleSubmitSurvey = async (e) => {
                e.preventDefault();
                if(Object.keys(surveyAnswers).length < 13) return Swal.fire('แจ้งเตือน', 'กรุณาประเมินให้ครบทุกข้อ', 'warning');
                Swal.fire({ title: 'กำลังบันทึก...', allowOutsideClick: false, didOpen: () => { Swal.showLoading() } });

                    const payload = { student, activity: selectedActivity, answers: surveyAnswers, suggestion };
                    const res = await runGAS('saveCheckInAndSurvey', payload);
                    Swal.close();
                    if(res.success) Swal.fire({title: 'เสร็จสมบูรณ์', text: 'ขอบคุณที่เข้าร่วมกิจกรรม', icon: 'success', confirmButtonColor: '#10b981'}).then(goHome);
                    else Swal.fire('ข้อผิดพลาด', res.error, 'error');
                } catch(e) { Swal.fire('ข้อผิดพลาด', e.message, 'error'); }
            };

            const handleSearchHistory = async (rawStudentId) => {
                const studentId = String(rawStudentId).trim();
                if(!studentId) return Swal.fire('แจ้งเตือน', 'กรอกรหัสนักศึกษา', 'warning');

                    let data = [];

                        data = allChks.filter(c => String(c.StudentID).trim() === studentId || String(c.IDCard).trim() === studentId);

                        <div className="flex justify-around items-center h-16 px-2">
                            <button onClick={goHome} className={`relative flex flex-col items-center justify-center w-full h-full space-y-1 transition-colors ${view === 'home' ? 'text-brand-500' : 'text-gray-400 hover:text-gray-600 dark:hover:text-gray-300'}`}>
                                <i className={`fa-solid fa-house text-xl ${view === 'home' ? 'mb-0.5 scale-110 drop-shadow-md' : ''}`}></i><span className="text-[10px] font-medium tracking-wide">หน้าแรก</span>
                            </button>
                            <button onClick={() => { if(!systemOpen) return Swal.fire({title:'ระบบปิดให้บริการ', icon:'info', confirmButtonColor: '#ff621f'}); setSearchPurpose('activity'); setView('search'); }} className={`relative flex flex-col items-center justify-center w-full h-full space-y-1 transition-colors ${(view === 'select' || view === 'survey' || (view === 'search' && searchPurpose === 'activity')) ? 'text-brand-500' : 'text-gray-400 hover:text-gray-600 dark:hover:text-gray-300'}`}>
                                <i className={`fa-solid fa-qrcode text-xl ${(view === 'select' || view === 'survey' || (view === 'search' && searchPurpose === 'activity')) ? 'mb-0.5 scale-110 drop-shadow-md' : ''}`}></i><span className="text-[10px] font-medium tracking-wide">เช็คชื่อ</span>
                            </button>
                            <button onClick={() => setView('history_search')} className={`relative flex flex-col items-center justify-center w-full h-full space-y-1 transition-colors ${(view === 'history_search' || view === 'history_result') ? 'text-brand-500' : 'text-gray-400 hover:text-gray-600 dark:hover:text-gray-300'}`}>
                                <i className={`fa-solid fa-clock-rotate-left text-xl ${(view === 'history_search' || view === 'history_result') ? 'mb-0.5 scale-110 drop-shadow-md' : ''}`}></i><span className="text-[10px] font-medium tracking-wide">ประวัติ</span>
                            </button>
                            {shirtSystemOpen && systemOpen && (
                                <button onClick={() => { setSearchPurpose('shirt'); setView('search'); }} className={`relative flex flex-col items-center justify-center w-full h-full space-y-1 transition-colors ${(view === 'shirt_form' || view === 'receipt' || (view === 'search' && searchPurpose === 'shirt')) ? 'text-brand-500' : 'text-gray-400 hover:text-gray-600 dark:hover:text-gray-300'}`}>
                                    <i className={`fa-solid fa-shirt text-xl ${(view === 'shirt_form' || view === 'receipt' || (view === 'search' && searchPurpose === 'shirt')) ? 'mb-0.5 scale-110 drop-shadow-md' : ''}`}></i><span className="text-[10px] font-medium tracking-wide">สั่งจอง</span>
                                </button>
                            )}
                        </div>
                    </div>
                );

            const Footer = () => (
                <footer className="w-full py-10 mt-auto flex flex-col items-center justify-center text-center z-10 relative">
                    <p className="text-xs text-gray-500 font-medium tracking-wider">ฝ่ายกิจการนักศึกษา คณะเทคโนโลยีดิจิทัล มหาวิทยาลัยราชภัฏเชียงราย</p>
                </footer>
            );

            if (view === 'home') {
                return (
                    <div className="min-h-screen flex flex-col relative z-10">
                        <Navbar />
                        <div className="flex-grow flex flex-col items-center justify-center p-6 md:p-10 relative">
                            {/* Decorative Background Elements */}
                            <div className="absolute top-10 left-10 w-64 h-64 bg-brand-200 rounded-full mix-blend-multiply filter blur-3xl opacity-30 animate-blob"></div>
                            <div className="absolute top-0 right-10 w-72 h-72 bg-rose-200 rounded-full mix-blend-multiply filter blur-3xl opacity-30 animate-blob animation-delay-2000"></div>
                            <div className="absolute -bottom-8 left-20 w-72 h-72 bg-amber-200 rounded-full mix-blend-multiply filter blur-3xl opacity-30 animate-blob animation-delay-4000"></div>

                            <div className="text-center mb-12 relative z-10">
                                <span className="px-4 py-1.5 rounded-full bg-brand-100 text-brand-600 text-xs font-bold tracking-widest uppercase mb-6 inline-block border border-brand-200 shadow-sm dark:bg-brand-900 dark:border-brand-700 dark:text-brand-400">Welcome to Platform</span>
                                <h1 className="text-5xl md:text-6xl font-bold text-gray-900 tracking-tight dark:text-white leading-tight">
                                    Activities <span className="icon-gradient">DIGIT.CRRU</span>

                                <p className="mt-4 text-gray-500 dark:text-gray-400 font-light text-lg">ระบบจัดการกิจกรรมและสั่งจองเสื้อแบบครบวงจร</p>
                            </div>
                            
                            <div className={`w-full grid gap-8 mx-auto relative z-10 ${(shirtSystemOpen && systemOpen) ? 'max-w-6xl md:grid-cols-3' : 'max-w-4xl md:grid-cols-2'}`}>
                                <div onClick={() => { if(!systemOpen) return Swal.fire({title:'ระบบปิดให้บริการ', text:'ระบบกำลังอยู่ในช่วงปรับปรุง', icon:'info', confirmButtonColor:'#ff621f'}); setSearchPurpose('activity'); setView('search'); }} 
                                     className={`luxury-card p-8 md:p-10 cursor-pointer group flex flex-col items-center text-center ${!systemOpen ? 'opacity-60 grayscale' : ''}`}>
                                    <div className="w-20 h-20 mb-6 rounded-2xl flex items-center justify-center text-brand-500 text-3xl bg-brand-50 border border-brand-100 group-hover:bg-gradient-icon group-hover:text-white group-hover:shadow-glow transition-all duration-500 dark:bg-gray-800 dark:border-gray-700 dark:text-brand-400"><i className="fa-solid fa-qrcode"></i></div>
                                    <h3 className="text-xl font-bold text-gray-900 mb-3 dark:text-white">ลงทะเบียนกิจกรรม</h3>
                                    <p className="text-gray-500 text-sm font-light leading-relaxed">เช็คชื่อเข้าร่วมและทำแบบประเมินความพึงพอใจอย่างสะดวกรวดเร็ว</p>

                                </div>
                                {shirtSystemOpen && systemOpen && (

                                        <div className="w-20 h-20 mb-6 rounded-2xl flex items-center justify-center text-rose-500 text-3xl bg-rose-50 border border-rose-100 group-hover:bg-rose-500 group-hover:text-white group-hover:shadow-[0_8px_25px_-5px_rgba(244,63,94,0.4)] transition-all duration-500 dark:bg-gray-800 dark:border-gray-700 dark:text-rose-400"><i className="fa-solid fa-shirt"></i></div>
                                        <h3 className="text-xl font-bold text-gray-900 mb-3 dark:text-white">สั่งจองเสื้อคณะ</h3>
                                        <p className="text-gray-500 text-sm font-light leading-relaxed">ระบุไซส์ สั่งจอง และแนบหลักฐานการชำระเงินเพื่อรับใบเสร็จ</p>
                                    </div>
                                )}
                            </div>
                        </div>
                        <Footer />
                        <MobileTabBar />
                    </div>
                );
            }

            if (view === 'search') {
                const isShirtSearch = searchPurpose === 'shirt';
                const iconColor = isShirtSearch ? 'text-rose-500' : 'text-brand-500';
                const bgIconColor = isShirtSearch ? 'bg-rose-50 border-rose-100 dark:bg-gray-800 dark:border-gray-700' : 'bg-brand-50 border-brand-100 dark:bg-gray-800 dark:border-gray-700';

                return (
                    <div className="min-h-screen flex flex-col relative z-10">
                        <Navbar />

                                <div className="text-center mt-12 mb-10">
                                    <div className={`w-24 h-24 rounded-3xl mx-auto flex items-center justify-center mb-6 shadow-sm border ${bgIconColor}`}>

                                    </div>

                                </form>
                            </div>
                        </div>
                        <Footer />
                        <MobileTabBar />
                    </div>

                    <div className="min-h-screen flex flex-col relative z-10">
                        <Navbar />
                        <div className="flex-grow flex flex-col items-center pt-10 p-6">
                            <div className="w-full max-w-3xl mb-10 flex flex-col sm:flex-row justify-between items-center sm:items-end bg-white/70 backdrop-blur-xl p-8 rounded-3xl border border-gray-200/50 shadow-glass dark:bg-gray-800/80 dark:border-gray-700 gap-6">
                                <div className="flex flex-col sm:flex-row items-center sm:items-start gap-6 text-center sm:text-left">
                                    <div className={`w-20 h-20 rounded-2xl flex items-center justify-center text-3xl shadow-sm border ${gProps.bg}`}><i className={`fa-solid ${gProps.icon}`}></i></div>
                                    <div className="pt-2">
                                        <p className="text-xs text-gray-400 font-medium uppercase tracking-widest mb-1">ข้อมูลนักศึกษา</p>

                                        <p className="text-gray-500 text-sm font-medium mt-2 bg-gray-100 px-3 py-1 rounded-lg inline-block dark:bg-gray-700 dark:text-gray-300">{student.StudentID} <span className="mx-2 text-gray-300">|</span> {student.Major}</p>

                                </div>

                            </div>
                            <div className="w-full max-w-3xl">
                                <div className="flex items-center gap-3 mb-6">
                                    <h3 className="font-bold text-gray-900 dark:text-white text-lg">กิจกรรมที่เปิดรับลงทะเบียน</h3>

                                </div>
                                <div className="space-y-5">
                                    {activities.length === 0 ? (<div className="text-center py-20 bg-white/50 backdrop-blur rounded-3xl border-2 border-dashed border-gray-200 dark:border-gray-700 dark:bg-gray-800/50"><div className="w-16 h-16 bg-gray-100 rounded-full flex items-center justify-center text-gray-300 text-2xl mx-auto mb-4 dark:bg-gray-700 dark:text-gray-500"><i className="fa-solid fa-calendar-xmark"></i></div><p className="text-gray-500 font-medium">ไม่มีกิจกรรมที่เปิดรับในขณะนี้</p></div>) : (
                                        activities.map(act => (
                                            <div key={act.ActivityID} onClick={() => handleSelectActivity(act)} className="luxury-card p-6 sm:p-8 cursor-pointer group flex flex-col sm:flex-row justify-between items-start sm:items-center gap-6">

                                                    <div className="w-14 h-14 bg-brand-50 text-brand-500 rounded-xl flex flex-col items-center justify-center shrink-0 border border-brand-100 group-hover:bg-gradient-icon group-hover:text-white transition-all duration-300 shadow-sm dark:bg-gray-800 dark:border-gray-700 dark:text-brand-400">
                                                        <span className="text-[10px] font-bold uppercase leading-none mb-1">{new Date(act.Date).toLocaleDateString('en-US',{month:'short'})}</span>
                                                        <span className="text-xl font-extrabold leading-none">{new Date(act.Date).getDate()}</span>
                                                    </div>
                                                    <div>
                                                        <h4 className="font-bold text-xl text-gray-900 dark:text-white group-hover:text-brand-500 transition-colors mb-2">{act.Name}</h4>
                                                        <div className="flex flex-wrap items-center gap-3 text-sm text-gray-500 font-medium">
                                                            <span className="flex items-center gap-1.5"><i className="fa-solid fa-location-dot text-gray-300"></i> {act.Location}</span>
                                                        </div>
                                                    </div>
                                                </div>
                                                <div className="w-12 h-12 rounded-full border-2 border-gray-100 flex items-center justify-center text-gray-400 group-hover:bg-brand-500 group-hover:border-brand-500 group-hover:text-white group-hover:shadow-glow transition-all duration-300 shrink-0 self-end sm:self-auto dark:border-gray-700">
                                                    <i className="fa-solid fa-arrow-right"></i>
                                                </div>
                                            </div>
                                        ))
                                    )}
                                </div>
                            </div>
                        </div>
                        <Footer />

                    </div>

                                    <h2 className="text-2xl sm:text-3xl font-bold text-gray-900 dark:text-white leading-tight px-8">{selectedActivity.Name}</h2>
                                </div>

                                            <div className="w-12 text-center text-xs font-bold text-gray-500">ดีมาก<br/><span className="text-brand-400 text-lg">4</span></div>
                                            <div className="w-12 text-center text-xs font-bold text-gray-500">ปานกลาง<br/><span className="text-gray-400 text-lg">3</span></div>
                                            <div className="w-12 text-center text-xs font-bold text-gray-500">พอใช้<br/><span className="text-gray-400 text-lg">2</span></div>
                                            <div className="w-12 text-center text-xs font-bold text-gray-500">ปรับปรุง<br/><span className="text-gray-400 text-lg">1</span></div>
                                        </div>
                                    </div>
                                    
                                    <div className="md:hidden mb-8 bg-gray-50 dark:bg-gray-800/50 p-4 rounded-xl border border-gray-100 dark:border-gray-700">
                                        <span className="font-bold text-gray-900 dark:text-white block mb-3 text-sm">เกณฑ์คะแนน:</span>
                                        <div className="flex flex-wrap gap-3">
                                            <div className="flex items-center gap-2 text-xs font-medium"><div className="w-6 h-6 rounded-full bg-brand-500 text-white flex items-center justify-center">5</div>ดีเยี่ยม</div>
                                            <div className="flex items-center gap-2 text-xs font-medium"><div className="w-6 h-6 rounded-full bg-brand-400 text-white flex items-center justify-center">4</div>ดีมาก</div>
                                            <div className="flex items-center gap-2 text-xs font-medium"><div className="w-6 h-6 rounded-full bg-gray-200 text-gray-600 flex items-center justify-center">3</div>ปานกลาง</div>
                                            <div className="flex items-center gap-2 text-xs font-medium"><div className="w-6 h-6 rounded-full bg-gray-200 text-gray-600 flex items-center justify-center">2</div>พอใช้</div>
                                            <div className="flex items-center gap-2 text-xs font-medium"><div className="w-6 h-6 rounded-full bg-gray-200 text-gray-600 flex items-center justify-center">1</div>ปรับปรุง</div>
                                        </div>
                                    </div>

                                    {surveyData.map((category, catIdx) => (
                                        <div key={catIdx} className="mb-12 relative">
                                            <div className="flex items-center gap-3 mb-6">
                                                <div className="w-8 h-8 rounded-lg bg-brand-50 text-brand-600 flex items-center justify-center font-bold text-sm border border-brand-100">{catIdx+1}</div>
                                                <h3 className="text-lg font-bold text-gray-900 dark:text-white">{category.title.split(' ').slice(1).join(' ')}</h3>
                                            </div>
                                            <div className="space-y-4">
                                                {category.questions.map((q) => (
                                                    <div key={q.id} className="p-5 border border-gray-100 dark:border-gray-700 rounded-2xl flex flex-col md:flex-row md:items-center justify-between gap-6 hover:border-brand-200 hover:shadow-md transition-all bg-white dark:bg-gray-800/80 group">
                                                        <div className="text-gray-700 dark:text-gray-300 font-medium text-sm md:w-3/5 group-hover:text-brand-600 transition-colors">{q.text}</div>
                                                        <div className="flex justify-between md:justify-end gap-2 w-full md:w-auto">
                                                            {[5, 4, 3, 2, 1].map(score => (
                                                                <label key={score} className={`relative w-12 h-12 flex items-center justify-center rounded-xl cursor-pointer text-lg font-bold transition-all border-2 ${surveyAnswers[q.id] === score ? 'bg-brand-500 text-white border-brand-500 shadow-glow transform scale-110' : 'bg-gray-50 text-gray-400 border-transparent hover:border-gray-200 hover:bg-gray-100 dark:bg-gray-700 dark:text-gray-500'}`}>
                                                                    <input type="radio" className="hidden" name={q.id} value={score} required onChange={() => setSurveyAnswers({...surveyAnswers, [q.id]: score})} />{score}
                                                                </label>
                                                            ))}
                                                        </div>
                                                    </div>
                                                ))}
                                            </div>
                                        </div>
                                    ))}
                                    <div className="mb-12">
                                        <h3 className="text-lg font-bold text-gray-900 dark:text-white mb-4 flex items-center gap-2"><i className="fa-regular fa-comment-dots text-brand-500"></i> ข้อเสนอแนะเพิ่มเติม</h3>
                                        <textarea rows="4" value={suggestion} onChange={(e) => setSuggestion(e.target.value)} className="w-full luxury-input resize-none text-sm font-light bg-gray-50/50" placeholder="เขียนข้อเสนอแนะหรือความคิดเห็นเพื่อการพัฒนา (ไม่บังคับ)"></textarea>
                                    </div>
                                    <div className="pt-8 border-t border-gray-200 dark:border-gray-800">
                                        <button type="submit" className="w-full btn-premium py-5 font-bold text-lg rounded-2xl">ส่งแบบประเมิน <i className="fa-solid fa-paper-plane ml-2"></i></button>
                                    </div>
                                </form>
                            </div>
                        </div>
                        <Footer />
                    </div>
                );
            }

                const getPrice = (size) => ['XL', '2XL', '3XL'].includes(size) ? shirtPrice.oversize : shirtPrice.normal;

                const gProps = getGenderProps(student.Name);

                return (
                    <div className="min-h-screen flex flex-col relative z-10">
                        <Navbar />
                        <div className="flex-grow flex flex-col items-center pt-8 p-4 pb-20">
                            <div className="luxury-card w-full max-w-3xl p-6 sm:p-12 relative overflow-hidden">
                                <div className="absolute top-0 left-0 w-full h-2 bg-gradient-to-r from-rose-400 to-rose-600"></div>
                                <div className="flex flex-col sm:flex-row justify-between items-center sm:items-end mb-10 border-b border-gray-100 dark:border-gray-800 pb-6 gap-6 pt-4">
                                    <div className="flex items-center gap-5 text-center sm:text-left">
                                        <div className={`w-16 h-16 rounded-2xl flex items-center justify-center text-3xl shadow-sm border ${gProps.bg}`}><i className={`fa-solid ${gProps.icon}`}></i></div>
                                        <div>
                                            <p className="text-xs text-rose-500 font-bold uppercase tracking-widest mb-1">ข้อมูลผู้สั่งจอง</p>
                                            <h2 className="text-2xl font-bold text-gray-900 dark:text-white">{student.Name}</h2>
                                        </div>
                                    </div>

                                </div>

                                {(shirtPrice.popupText || shirtPrice.popupImage) && (
                                    <div className="mb-10 bg-rose-50 dark:bg-gray-800 border border-rose-100 dark:border-gray-700 p-5 rounded-2xl flex items-center justify-between shadow-sm">
                                        <div className="flex items-center gap-4">
                                            <div className="w-12 h-12 bg-rose-100 text-rose-600 rounded-xl flex items-center justify-center text-xl shrink-0 dark:bg-gray-700">
                                                <i className="fa-solid fa-ruler-combined"></i>
                                            </div>
                                            <div>
                                                <h4 className="text-sm font-bold text-gray-900 dark:text-white">ตารางขนาดและรายละเอียด</h4>
                                                <p className="text-xs text-gray-500 mt-1 font-medium line-clamp-1">โปรดตรวจสอบรายละเอียดก่อนสั่งจอง</p>
                                            </div>
                                        </div>
                                        <button type="button" onClick={() => {
                                            Swal.fire({
                                                title: 'รายละเอียด',
                                                text: shirtPrice.popupText || '',
                                                imageUrl: shirtPrice.popupImage || undefined,
                                                imageAlt: 'ภาพประกาศ',
                                                confirmButtonColor: '#f43f5e'
                                            });
                                        }} className="px-5 py-2.5 bg-rose-500 text-white hover:bg-rose-600 text-xs font-bold rounded-xl transition-all shadow-md hover:shadow-lg whitespace-nowrap">
                                            เปิดดู
                                        </button>
                                    </div>
                                )}

                                    {/* Polo Section */}
                                    <div className="mb-12 bg-white dark:bg-gray-800/50 p-6 sm:p-8 rounded-3xl border border-gray-100 dark:border-gray-700 shadow-sm hover:shadow-md transition-shadow">
                                        <div className="flex items-center justify-between mb-8 pb-4 border-b border-gray-100 dark:border-gray-700">
                                            <h3 className="font-bold text-gray-900 dark:text-white text-lg flex items-center gap-3"><div className="w-8 h-8 rounded-lg bg-rose-100 text-rose-600 flex items-center justify-center text-sm border border-rose-200">01</div> เสื้อโปโล</h3>
                                        </div>
                                        
                                        <div className="mb-8">
                                            <label className="block text-xs font-bold text-gray-600 dark:text-gray-400 mb-3">ทรงเสื้อ / เพศ</label>
                                            <div className="flex gap-4">
                                                {['ชาย', 'หญิง'].map(g => (
                                                    <label key={`polo-${g}`} className={`flex-1 py-4 border-2 rounded-2xl text-center cursor-pointer text-sm font-bold transition-all flex items-center justify-center gap-2 ${poloGender === g ? 'border-rose-500 bg-rose-50 text-rose-600 dark:bg-rose-500/10' : 'border-gray-200 text-gray-500 hover:border-rose-300 hover:bg-rose-50/50 dark:border-gray-700'}`}>
                                                        <input type="radio" className="hidden" checked={poloGender === g} onChange={() => setPoloGender(g)} /> 
                                                        <i className={`fa-solid ${g==='ชาย'?'fa-mars text-blue-500':'fa-venus text-pink-500'} text-lg`}></i> ทรง{g}
                                                    </label>
                                                ))}
                                            </div>
                                        </div>
                                        
                                        <div className="mb-8">
                                            <label className="block text-xs font-bold text-gray-600 dark:text-gray-400 mb-3">ขนาด</label>
                                            <div className="grid grid-cols-3 sm:grid-cols-6 gap-3">
                                                {['S', 'M', 'L', 'XL', '2XL', '3XL'].map(size => (
                                                    <label key={`p-${size}`} className={`relative flex flex-col items-center justify-center h-20 border-2 rounded-2xl transition-all duration-300 cursor-pointer ${poloSize === size ? 'border-rose-500 bg-rose-50 text-rose-600 dark:bg-rose-500/10 shadow-sm' : 'border-gray-200 bg-white text-gray-600 hover:border-rose-300 dark:border-gray-700 dark:bg-gray-800'}`}>
                                                        <input type="radio" className="hidden" checked={poloSize === size} onChange={() => setPoloSize(size)} />
                                                        <span className="text-lg font-bold">{size}</span>
                                                        <span className={`text-[10px] font-medium mt-1 ${poloSize === size ? 'text-rose-500' : 'text-gray-400'}`}>฿{getPrice(size)}</span>
                                                    </label>
                                                ))}
                                            </div>
                                        </div>
                                        
                                        <div className="flex justify-between items-center bg-gray-50 dark:bg-gray-900/50 p-5 rounded-2xl border border-gray-100 dark:border-gray-700">
                                            <label className="text-sm font-bold text-gray-700 dark:text-gray-300">จำนวนที่ต้องการ</label>

                                                <button type="button" onClick={() => setPoloQty(Math.max(1, poloQty - 1))} className="w-10 h-10 rounded-lg flex items-center justify-center text-gray-600 hover:bg-gray-100 hover:text-rose-500 transition-colors"><i className="fa-solid fa-minus text-sm"></i></button>
                                                <span className="font-bold text-gray-900 dark:text-white w-8 text-center text-lg">{poloQty}</span>
                                                <button type="button" onClick={() => setPoloQty(poloQty + 1)} className="w-10 h-10 rounded-lg flex items-center justify-center text-gray-600 hover:bg-gray-100 hover:text-rose-500 transition-colors"><i className="fa-solid fa-plus text-sm"></i></button>
                                            </div>
                                        </div>
                                    </div>

                                    {/* Tshirt Section */}
                                    <div className="mb-12 bg-white dark:bg-gray-800/50 p-6 sm:p-8 rounded-3xl border border-gray-100 dark:border-gray-700 shadow-sm hover:shadow-md transition-shadow">
                                        <div className="flex items-center justify-between mb-8 pb-4 border-b border-gray-100 dark:border-gray-700">
                                            <h3 className="font-bold text-gray-900 dark:text-white text-lg flex items-center gap-3"><div className="w-8 h-8 rounded-lg bg-rose-100 text-rose-600 flex items-center justify-center text-sm border border-rose-200">02</div> เสื้อยืด</h3>
                                        </div>
                                        
                                        <div className="mb-8">
                                            <label className="block text-xs font-bold text-gray-600 dark:text-gray-400 mb-3">ทรงเสื้อ / เพศ</label>
                                            <div className="flex gap-4">
                                                {['ชาย', 'หญิง'].map(g => (
                                                    <label key={`ts-${g}`} className={`flex-1 py-4 border-2 rounded-2xl text-center cursor-pointer text-sm font-bold transition-all flex items-center justify-center gap-2 ${tshirtGender === g ? 'border-rose-500 bg-rose-50 text-rose-600 dark:bg-rose-500/10' : 'border-gray-200 text-gray-500 hover:border-rose-300 hover:bg-rose-50/50 dark:border-gray-700'}`}>
                                                        <input type="radio" className="hidden" checked={tshirtGender === g} onChange={() => setTshirtGender(g)} /> 
                                                        <i className={`fa-solid ${g==='ชาย'?'fa-mars text-blue-500':'fa-venus text-pink-500'} text-lg`}></i> ทรง{g}
                                                    </label>
                                                ))}
                                            </div>
                                        </div>
                                        
                                        <div className="mb-8">
                                            <label className="block text-xs font-bold text-gray-600 dark:text-gray-400 mb-3">ขนาด</label>
                                            <div className="grid grid-cols-3 sm:grid-cols-6 gap-3">
                                                {['S', 'M', 'L', 'XL', '2XL', '3XL'].map(size => (
                                                    <label key={`t-${size}`} className={`relative flex flex-col items-center justify-center h-20 border-2 rounded-2xl transition-all duration-300 cursor-pointer ${tshirtSize === size ? 'border-rose-500 bg-rose-50 text-rose-600 dark:bg-rose-500/10 shadow-sm' : 'border-gray-200 bg-white text-gray-600 hover:border-rose-300 dark:border-gray-700 dark:bg-gray-800'}`}>
                                                        <input type="radio" className="hidden" checked={tshirtSize === size} onChange={() => setTshirtSize(size)} />
                                                        <span className="text-lg font-bold">{size}</span>
                                                        <span className={`text-[10px] font-medium mt-1 ${tshirtSize === size ? 'text-rose-500' : 'text-gray-400'}`}>฿{getPrice(size)}</span>
                                                    </label>
                                                ))}
                                            </div>
                                        </div>
                                        
                                        <div className="flex justify-between items-center bg-gray-50 dark:bg-gray-900/50 p-5 rounded-2xl border border-gray-100 dark:border-gray-700">
                                            <label className="text-sm font-bold text-gray-700 dark:text-gray-300">จำนวนที่ต้องการ</label>
                                            <div className="flex items-center gap-4 bg-white dark:bg-gray-800 p-1.5 rounded-xl border border-gray-200 dark:border-gray-600 shadow-sm">
                                                <button type="button" onClick={() => setTshirtQty(Math.max(1, tshirtQty - 1))} className="w-10 h-10 rounded-lg flex items-center justify-center text-gray-600 hover:bg-gray-100 hover:text-rose-500 transition-colors"><i className="fa-solid fa-minus text-sm"></i></button>
                                                <span className="font-bold text-gray-900 dark:text-white w-8 text-center text-lg">{tshirtQty}</span>
                                                <button type="button" onClick={() => setTshirtQty(tshirtQty + 1)} className="w-10 h-10 rounded-lg flex items-center justify-center text-gray-600 hover:bg-gray-100 hover:text-rose-500 transition-colors"><i className="fa-solid fa-plus text-sm"></i></button>
                                            </div>
                                        </div>
                                    </div>

                                    {/* Payment Method Section */}
                                    {grandTotal > 0 && (
                                        <div className="mb-10 p-6 sm:p-8 bg-white dark:bg-gray-800/50 rounded-3xl border border-gray-100 dark:border-gray-700 shadow-sm">
                                            <div className="flex items-center justify-between mb-6 pb-4 border-b border-gray-100 dark:border-gray-700">
                                                <h3 className="font-bold text-gray-900 dark:text-white text-lg flex items-center gap-3"><div className="w-8 h-8 rounded-lg bg-rose-100 text-rose-600 flex items-center justify-center text-sm border border-rose-200">03</div> วิธีการชำระเงิน</h3>
                                            </div>
                                            <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                                <label className={`relative p-6 border-2 rounded-2xl cursor-pointer transition-all flex items-center gap-4 ${paymentMethod === 'promptpay' ? 'border-blue-500 bg-blue-50 shadow-md dark:bg-blue-900/20' : 'border-gray-200 bg-white hover:border-blue-300 dark:border-gray-700 dark:bg-gray-800'}`}>
                                                    <input type="radio" className="hidden" checked={paymentMethod === 'promptpay'} onChange={() => setPaymentMethod('promptpay')} />
                                                    <div className={`w-12 h-12 rounded-full flex items-center justify-center shrink-0 ${paymentMethod === 'promptpay' ? 'bg-blue-500 text-white' : 'bg-gray-100 text-gray-400 dark:bg-gray-700'}`}><i className="fa-solid fa-qrcode text-xl"></i></div>
                                                    <div>
                                                        <h4 className={`font-bold text-base ${paymentMethod === 'promptpay' ? 'text-blue-900 dark:text-blue-400' : 'text-gray-700 dark:text-gray-300'}`}>พร้อมเพย์ (QR)</h4>
                                                        <p className="text-xs text-gray-500 mt-1">โอนเงินและแนบสลิป</p>
                                                    </div>
                                                    {paymentMethod === 'promptpay' && <div className="absolute top-4 right-4 text-blue-500"><i className="fa-solid fa-circle-check text-xl"></i></div>}
                                                </label>
                                                <label className={`relative p-6 border-2 rounded-2xl cursor-pointer transition-all flex items-center gap-4 ${paymentMethod === 'cash' ? 'border-amber-500 bg-amber-50 shadow-md dark:bg-amber-900/20' : 'border-gray-200 bg-white hover:border-amber-300 dark:border-gray-700 dark:bg-gray-800'}`}>
                                                    <input type="radio" className="hidden" checked={paymentMethod === 'cash'} onChange={() => setPaymentMethod('cash')} />
                                                    <div className={`w-12 h-12 rounded-full flex items-center justify-center shrink-0 ${paymentMethod === 'cash' ? 'bg-amber-500 text-white' : 'bg-gray-100 text-gray-400 dark:bg-gray-700'}`}><i className="fa-solid fa-money-bill-wave text-xl"></i></div>
                                                    <div>
                                                        <h4 className={`font-bold text-base ${paymentMethod === 'cash' ? 'text-amber-900 dark:text-amber-400' : 'text-gray-700 dark:text-gray-300'}`}>เงินสด</h4>
                                                        <p className="text-xs text-gray-500 mt-1">ชำระด้วยตัวเอง</p>
                                                    </div>
                                                    {paymentMethod === 'cash' && <div className="absolute top-4 right-4 text-amber-500"><i className="fa-solid fa-circle-check text-xl"></i></div>}
                                                </label>
                                            </div>
                                        </div>
                                    )}

                                    <div className="bg-gray-900 p-8 rounded-3xl mb-8 flex flex-col sm:flex-row justify-between items-center sm:items-end shadow-xl relative overflow-hidden">
                                        <div className="absolute -right-10 -top-10 w-40 h-40 bg-rose-500 rounded-full mix-blend-screen filter blur-3xl opacity-50"></div>
                                        <div className="relative z-10 text-center sm:text-left mb-4 sm:mb-0">
                                            <p className="text-xs font-bold text-gray-400 uppercase tracking-widest mb-1">ยอดรวมทั้งสิ้น</p>
                                            <p className="text-sm font-medium text-gray-300">ยอดชำระสุทธิที่ต้องดำเนินการ</p>
                                        </div>
                                        <div className="relative z-10 text-5xl font-extrabold text-white tracking-tight drop-shadow-md">
                                            <span className="text-3xl opacity-70 mr-1">฿</span>{grandTotal.toLocaleString()}
                                        </div>
                                    </div>

                                    {/* 🚀 Section Slip Upload / Cash Instruction */}
                                    {grandTotal > 0 ? (
                                        paymentMethod === 'promptpay' ? (
                                            <div className="border border-gray-200 dark:border-gray-700 p-8 mb-10 flex flex-col gap-8 rounded-3xl bg-white dark:bg-gray-800/50 shadow-sm">
                                                <div className="flex flex-col sm:flex-row items-center justify-center gap-8 bg-blue-50 dark:bg-blue-900/10 p-6 rounded-2xl border border-blue-100 dark:border-blue-800/30">
                                                    <div className="p-3 bg-white rounded-2xl shadow-md border border-gray-100">
                                                        <img src={`https://promptpay.io/0812345678/${grandTotal}.png`} alt="PromptPay QR" className="w-36 h-36 object-contain" />
                                                    </div>
                                                    <div className="text-center sm:text-left">
                                                        <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/e/e5/PromptPay_logo.svg/1024px-PromptPay_logo.svg.png" alt="PromptPay" className="h-6 mb-3 mx-auto sm:mx-0 object-contain" />
                                                        <h4 className="font-bold text-blue-900 dark:text-blue-400 text-lg mb-2">สแกนเพื่อโอนเงิน</h4>
                                                        <p className="text-sm text-gray-700 dark:text-gray-300 font-medium mb-1 flex items-center justify-center sm:justify-start gap-2"><i className="fa-solid fa-phone text-gray-400"></i> 081-234-5678</p>
                                                        <p className="text-xs text-gray-500 font-medium mb-4 flex items-center justify-center sm:justify-start gap-2"><i className="fa-solid fa-building-columns text-gray-400"></i> สโมสรนักศึกษา คณะเทคโนโลยีดิจิทัล</p>
                                                        <div className="inline-block bg-white dark:bg-gray-800 text-blue-600 dark:text-blue-400 px-4 py-2 rounded-xl text-xs font-bold border border-blue-100 dark:border-blue-800 shadow-sm">
                                                            ยอดที่ต้องโอน: ฿{grandTotal.toLocaleString()}
                                                        </div>
                                                    </div>
                                                </div>

                                                <div className="border-t border-dashed border-gray-200 dark:border-gray-700 pt-8">
                                                    <label className="block text-sm font-bold text-gray-900 dark:text-white mb-4 text-center sm:text-left">
                                                        อัปโหลดสลิปการชำระเงิน <span className="text-rose-500">*</span>
                                                    </label>
                                                    <label className="flex flex-col items-center justify-center w-full h-56 border-2 border-gray-300 dark:border-gray-600 border-dashed rounded-3xl cursor-pointer bg-gray-50 hover:bg-gray-100 dark:bg-gray-800/80 dark:hover:bg-gray-800 transition-all relative overflow-hidden group">
                                                        {slipImage ? (
                                                            <div className="flex flex-col items-center justify-center relative w-full h-full p-4 bg-black">
                                                                <img src={slipImage} className="absolute inset-0 w-full h-full object-cover opacity-40 blur-md" alt="slip-bg" />
                                                                <img src={slipImage} className="z-10 h-full object-contain drop-shadow-2xl rounded-lg border border-white/20" alt="slip-preview" />
                                                                <div className="absolute inset-0 bg-black/60 flex items-center justify-center opacity-0 group-hover:opacity-100 transition-opacity z-20 backdrop-blur-sm">
                                                                    <span className="text-gray-900 font-bold px-6 py-3 rounded-xl bg-white flex items-center gap-2 transition-transform transform hover:scale-105 shadow-xl">
                                                                        <i className="fa-solid fa-pen"></i> อัปโหลดรูปใหม่
                                                                    </span>
                                                                </div>
                                                            </div>
                                                        ) : (
                                                            <div className="flex flex-col items-center justify-center pt-5 pb-6 text-center">
                                                                <div className="w-16 h-16 bg-white dark:bg-gray-700 rounded-full flex items-center justify-center shadow-sm border border-gray-200 dark:border-gray-600 mb-4 text-blue-500 group-hover:scale-110 group-hover:text-rose-500 group-hover:border-rose-200 transition-all duration-300">
                                                                    <i className="fa-solid fa-cloud-arrow-up text-2xl"></i>
                                                                </div>
                                                                <p className="mb-2 text-base text-gray-700 dark:text-gray-300 font-bold"><span className="text-brand-500">คลิกเพื่ออัปโหลด</span> หรือลากไฟล์มาวาง</p>
                                                                <p className="text-xs text-gray-500 font-medium">รองรับไฟล์ PNG, JPG ขนาดไม่เกิน 5MB</p>
                                                            </div>
                                                        )}
                                                        <input type="file" className="hidden" accept="image/png, image/jpeg, image/jpg" onChange={(e) => {
                                                            const file = e.target.files[0];
                                                            if (file) {
                                                                if (file.size > 5 * 1024 * 1024) {
                                                                    Swal.fire('ไฟล์มีขนาดใหญ่เกินไป', 'กรุณาอัปโหลดไฟล์ขนาดไม่เกิน 5MB', 'warning');
                                                                    e.target.value = '';
                                                                    return;
                                                                }
                                                                const reader = new FileReader();
                                                                reader.onloadend = () => setSlipImage(reader.result);
                                                                reader.readAsDataURL(file);
                                                            }
                                                        }} />
                                                    </label>
                                                </div>
                                            </div>
                                        ) : (
                                            <div className="border border-amber-200 dark:border-amber-900/50 p-8 mb-10 flex flex-col sm:flex-row items-center justify-center gap-6 bg-amber-50 dark:bg-amber-900/10 rounded-3xl shadow-sm">
                                                <div className="w-20 h-20 bg-amber-100 dark:bg-amber-800/50 text-amber-600 dark:text-amber-400 rounded-2xl flex items-center justify-center text-4xl shadow-inner border border-amber-200 shrink-0">
                                                    <i className="fa-solid fa-money-bill-wave"></i>
                                                </div>
                                                <div className="text-center sm:text-left">
                                                    <h4 className="font-bold text-amber-800 dark:text-amber-300 text-xl mb-2">ชำระด้วยเงินสดที่จุดรับบริการ</h4>
                                                    <p className="text-sm text-amber-700/80 dark:text-amber-400/80 font-medium leading-relaxed bg-white/50 dark:bg-black/20 px-4 py-2 rounded-xl">
                                                        กรุณาเตรียมเงินสด <b className="text-amber-900 dark:text-amber-200 text-lg">฿{grandTotal.toLocaleString()}</b> <br className="hidden sm:block"/>
                                                        เพื่อนำมาชำระกับเจ้าหน้าที่ในภายหลัง
                                                    </p>
                                                </div>
                                            </div>
                                        )
                                    ) : null}

                                    <div className="flex gap-4 mt-8 pt-8 border-t border-gray-100 dark:border-gray-800">
                                        {isEditingOrder && <button type="button" onClick={() => setView('receipt')} className="w-1/3 btn-outline py-5 font-bold text-sm uppercase rounded-2xl">ยกเลิก</button>}

                                            <button type="submit" className={`${isEditingOrder ? 'w-2/3' : 'w-full'} btn-premium py-5 font-bold text-lg rounded-2xl flex justify-center items-center gap-2`}>ยืนยันการสั่งจอง <i className="fa-solid fa-check-circle"></i></button>
                                        ) : (
                                            <button type="button" disabled className={`${isEditingOrder ? 'w-2/3' : 'w-full'} bg-gray-200 text-gray-500 py-5 font-bold text-lg rounded-2xl cursor-not-allowed`}>ระบบปิดให้บริการ</button>
                                        )}
                                    </div>
                                </form>
                            </div>
                        </div>
                        <Footer />
                        <MobileTabBar />
                    </div>
                );

                    Swal.fire({ title: 'กำลังประมวลผล...', allowOutsideClick: false, didOpen: () => { Swal.showLoading() } });

                        const link = document.createElement('a');
                        link.download = `Receipt_${receiptData.student.StudentID}.png`;
                        link.href = canvas.toDataURL('image/png');
                        link.click();
                        Swal.close();
