                        <button onClick={onHome} className="w-full py-4 bg-slate-100 dark:bg-white/10 text-slate-800 dark:text-white rounded-xl font-bold hover:bg-slate-200 dark:hover:bg-white/20 transition-colors shadow-sm flex justify-center items-center gap-2 btn-interactive">
                            <Icon name="home" size={18} /> กลับสู่หน้าแรก
                        </button>
                    </div>
                </div>
            );
        }

        // ==========================================
        // 📊 Admin Dashboard
        // ==========================================
        function AdminDashboard({ goBack, currentUser, isRegistrationOpen, setIsRegistrationOpen }) {
            const { isDarkMode = false } = useContext(AppContext) || {};
            const [data, setData] = useState([]);
            const [loading, setLoading] = useState(true);
            const [editItem, setEditItem] = useState(null);
            const [activeTab, setActiveTab] = useState('overview');
            const [drilldownData, setDrilldownData] = useState({ title: '', list: [], type: '' });
            const [showChartModal, setShowChartModal] = useState(false);
            const [currentPage, setCurrentPage] = useState(1);
            const [searchTerm, setSearchTerm] = useState('');
            const [executiveMajor, setExecutiveMajor] = useState('ทั้งหมด');
            const [selectedSurveyActivity, setSelectedSurveyActivity] = useState('ทั้งหมด');
            const [activityDefs, setActivityDefs] = useState([]);
            const [activityLogs, setActivityLogs] = useState([]);
            const [surveys, setSurveys] = useState([]);
            const [activityForm, setActivityForm] = useState({ name: '', date: '', location: '' });

            // User Management State
            const [adminList, setAdminList] = useState([
                { id: 1, username: 'admin', role: 'Super Admin', status: 'Active' },
                { id: 2, username: 'staff1', role: 'Manager', status: 'Active' },
                { id: 3, username: 'guest', role: 'Viewer', status: 'Inactive' }
            ]);
            const [userForm, setUserForm] = useState({ id: null, username: '', password: '', role: 'Manager', status: 'Active' });
            const [showUserModal, setShowUserModal] = useState(false);

            const loadData = (isSilent = false) => {
                if (!isSilent) setLoading(true);
                Papa.parse(REGISTRATION_CSV_URL + `&_cb=${new Date().getTime()}`, {
                    download: true, header: true,
                    complete: (res) => { setData(res.data.filter(row => row.StudentID).map(r => ({ ...r, Major: cleanMajor(r.Major) }))); if (!isSilent) setLoading(false); },
                    error: () => { if (!isSilent) Swal.fire('Error', 'Database Connection Failed', 'warning'); if (!isSilent) setLoading(false); }
                });
            };

            const loadActivities = () => { Papa.parse(ACTIVITY_SHEET_CSV_URL + `&_cb=${new Date().getTime()}`, { download: true, header: true, complete: (res) => { setActivityDefs(res.data.filter(row => row.ActivityName)); } }); };
            const loadLogs = () => { Papa.parse(LOGS_SHEET_CSV_URL + `&_cb=${new Date().getTime()}`, { download: true, header: true, complete: (res) => { setActivityLogs(res.data.filter(row => row.ActivityName)); } }); };
            const loadSurveys = () => { Papa.parse(SURVEY_SHEET_CSV_URL + `&_cb=${new Date().getTime()}`, { download: true, header: true, complete: (res) => { setSurveys(res.data.filter(row => row.ActivityName)); } }); };

            useEffect(() => { 
                loadData(); loadActivities(); loadLogs(); loadSurveys();
                const intervalId = setInterval(() => { loadData(true); loadActivities(); loadLogs(); loadSurveys(); }, 3000);
                return () => clearInterval(intervalId);
            }, []);

            const executiveBaseMajors = useMemo(() => {
                const mSet = new Set();
                data.filter(r => r.FullName !== 'SYSTEM_ACTIVITY_DEF' && r.BloodGroup !== 'Activity').forEach(r => { if(r.Major) mSet.add(r.Major.replace(/\s*\([^)]*\)/g, '').trim()); });
                return Array.from(mSet).sort();
            }, [data]);

            const filteredData = useMemo(() => {
                let result = data;
                if (searchTerm) {
                    const s = searchTerm.toLowerCase();
                    result = result.filter(r => (r.FullName || '').toLowerCase().includes(s) || (r.StudentID || '').toLowerCase().includes(s) || (r.Major || '').toLowerCase().includes(s) || (r.StudentPhone || '').includes(s) || (r.ParentPhone || '').includes(s));
                }
                if (activeTab === 'executive' && executiveMajor !== 'ทั้งหมด') {
                    result = result.filter(r => { const baseMajor = r.Major ? r.Major.replace(/\s*\([^)]*\)/g, '').trim() : ''; return baseMajor === executiveMajor; });
                }
                return result;
            }, [data, searchTerm, activeTab, executiveMajor]);

            // ==========================================
            // 📌 SPSS Data Analysis Calculation
            // ==========================================
            const surveyStats = useMemo(() => {
                let filteredSurveys = surveys;
                if (selectedSurveyActivity !== 'ทั้งหมด') {
                    filteredSurveys = surveys.filter(s => s.ActivityName === selectedSurveyActivity);
                }

                let total = filteredSurveys.length;
                let commentsList = [];
                let majorDemographics = {}; 
                let genderDemographics = { 'ชาย': 0, 'หญิง': 0, 'ไม่ระบุ': 0 };
                
                let qStats = {
                    q1_1: { sum: 0, values: [], counts: {5:0, 4:0, 3:0, 2:0, 1:0} },
                    q1_2: { sum: 0, values: [], counts: {5:0, 4:0, 3:0, 2:0, 1:0} },
                    q1_3: { sum: 0, values: [], counts: {5:0, 4:0, 3:0, 2:0, 1:0} },
                    q1_4: { sum: 0, values: [], counts: {5:0, 4:0, 3:0, 2:0, 1:0} },
                    q2_1: { sum: 0, values: [], counts: {5:0, 4:0, 3:0, 2:0, 1:0} },
                    q2_2: { sum: 0, values: [], counts: {5:0, 4:0, 3:0, 2:0, 1:0} },
                    q2_3: { sum: 0, values: [], counts: {5:0, 4:0, 3:0, 2:0, 1:0} },
                    q2_4: { sum: 0, values: [], counts: {5:0, 4:0, 3:0, 2:0, 1:0} },
                    q3_1: { sum: 0, values: [], counts: {5:0, 4:0, 3:0, 2:0, 1:0} },
                    q3_2: { sum: 0, values: [], counts: {5:0, 4:0, 3:0, 2:0, 1:0} },
                    q3_3: { sum: 0, values: [], counts: {5:0, 4:0, 3:0, 2:0, 1:0} },
                    q3_4: { sum: 0, values: [], counts: {5:0, 4:0, 3:0, 2:0, 1:0} },
                    q3_5: { sum: 0, values: [], counts: {5:0, 4:0, 3:0, 2:0, 1:0} }
                };

                const parseVal = (val) => { const n = Number(val); return isNaN(n) ? 0 : n; };

                const getVal = (row, key) => {
                    const exactKeys = [key, key.toUpperCase(), `Q${key.replace('q','')}`, `q${key.replace('q','')}`];
                    for (let ek of exactKeys) {
                        if (row[ek] !== undefined && row[ek] !== '') return row[ek];
                    }
                    const numStr = key.replace('q', '').replace('_', '.');
                    for (let header in row) {
                        if (header.includes(numStr) || header.toLowerCase().includes(key)) {
                            if (row[header] !== undefined && row[header] !== '') return row[header];
                        }
                    }
                    return undefined;
                };

                filteredSurveys.forEach(s => {
                    const student = data.find(st => st.StudentID === s.StudentID);
                    let major = 'ไม่ระบุสาขา / บุคคลภายนอก';
                    if (student && student.Major) {
                        major = student.Major.replace(/\s*\([^)]*\)/g, '').trim(); 
                    }
                    majorDemographics[major] = (majorDemographics[major] || 0) + 1;

                    if (student && student.FullName) {
                        const fname = student.FullName.trim();
                        if (fname.startsWith('นาย')) {
                            genderDemographics['ชาย']++;
                        } else if (fname.startsWith('นางสาว') || fname.startsWith('นาง')) {
                            genderDemographics['หญิง']++;
                        } else {
                            genderDemographics['ไม่ระบุ']++;
                        }
                    } else {
                        genderDemographics['ไม่ระบุ']++;
                    }

                    const keys = Object.keys(qStats);
                    keys.forEach((key) => {
                        let val = getVal(s, key);
                        const v = parseVal(val);
                        if (v > 0) { 
                            qStats[key].sum += v; 
                            qStats[key].values.push(v); 
                            qStats[key].counts[v] = (qStats[key].counts[v] || 0) + 1; 
                        }
                    });

                    if (s.Comment && s.Comment.trim() !== '') {
                        commentsList.push({ text: s.Comment, date: s.Timestamp, student: s.StudentID });
                    }
                });

                const genderArray = Object.keys(genderDemographics).map(k => ({
                    label: k,
                    count: genderDemographics[k],
                    percent: total > 0 ? ((genderDemographics[k] / total) * 100).toFixed(1) : 0
                })).filter(d => d.count > 0).sort((a,b) => b.count - a.count);

                let table1Summary = "";
                if (genderArray.length >= 1) {
                    const first = genderArray[0];
                    const second = genderArray.length > 1 ? genderArray[1] : null;
                    table1Summary = `จากตารางที่ 1 พบว่า ผู้ตอบแบบสอบถามส่วนใหญ่เป็นเพศ${first.label} จำนวน ${first.count} คน คิดเป็นร้อยละ ${first.percent}`;
                    if (second && second.label !== 'ไม่ระบุ') {
                        table1Summary += ` และเพศ${second.label} จำนวน ${second.count} คน คิดเป็นร้อยละ ${second.percent}`;
                    } else if (second) {
                        table1Summary += ` และ${second.label} จำนวน ${second.count} คน คิดเป็นร้อยละ ${second.percent}`;
                    }
                }

                const getMean = (sum, count) => count > 0 ? (sum / count) : 0;
                const getSD = (values, mean) => {
                    if (values.length <= 1) return 0;
                    const variance = values.reduce((acc, val) => acc + Math.pow(val - mean, 2), 0) / (values.length - 1);
                    return Math.sqrt(variance);
                };

                const questionsMap = {
                    q1_1: '1.1 การประชาสัมพันธ์โครงการ ฯ', q1_2: '1.2 ความเหมาะสมของสถานที่', q1_3: '1.3 ความเหมาะสมของระยะเวลา', q1_4: '1.4 การจัดลำดับขั้นตอนของกิจกรรม',

                return { total, pieData: pieDataList, COLORS: ['#ff6600', '#3b82f6', '#10b981', '#8b5cf6', '#ec4899', '#facc15', '#06b6d4'], foodAlert, healthAlert, surveillanceList, surveillancePieData, normalCount, transferCount, dietStats, foodAllergies, diseases, drugAllergies, execBreakdownList, groupedAllergies, uniqueStudents, studentData: uniqueStudents };

                        exportData = activityDefs.map(a => ({ 'ชื่อกิจกรรม': a.ActivityName, 'วันที่จัด': new Date(a.ActivityDate).toLocaleString('th-TH'), 'สถานที่': a.Location, 'สถานะ': a.Status === 'CLOSED' ? 'ปิด' : 'เปิด', 'จำนวนผู้ลงทะเบียน': activityLogs.filter(l => l.ActivityName === a.ActivityName).length }));
                        sheetName = "Activities_List"; break;
                    case 'activity_summary':
                        if (activityLogs.length === 0) return;
                        exportData = activityLogs.map(l => ({ 'รหัสนักศึกษา': l.StudentID, 'ชื่อ-นามสกุล': l.FullName, 'สาขาวิชา': l.Major, 'รหัสประจำตัว ปชช.': l.IDCard || '-', 'ชื่อกิจกรรม': l.ActivityName, 'เวลาลงทะเบียน': new Date(l.Timestamp).toLocaleString('th-TH') }));
                        sheetName = "Activity_Attendees"; break;
                    case 'survey_summary':
                        if (surveys.length === 0 || surveyStats.total === 0) {
                            Swal.fire({ icon: 'info', title: 'ไม่มีข้อมูล', text: 'ไม่มีข้อมูลสำหรับดาวน์โหลดในหมวดหมู่นี้', customClass:{popup:'rounded-[2rem] bg-white dark:bg-zinc-900 text-slate-800 dark:text-white'} });
                            return;
                        }
                        
                        const wb = window.XLSX.utils.book_new();

                        // 1. Raw Data
                        const rawData = (selectedSurveyActivity === 'ทั้งหมด' ? surveys : surveys.filter(s => s.ActivityName === selectedSurveyActivity)).map(s => ({ 
                            'ชื่อกิจกรรม': s.ActivityName, 
                            'รหัสนักศึกษา': s.StudentID, 
                            '1.1 ประชาสัมพันธ์': getVal(s, 'q1_1'),
                            '1.2 สถานที่': getVal(s, 'q1_2'),
                            '1.3 ระยะเวลา': getVal(s, 'q1_3'),
                            '1.4 ลำดับขั้นตอน': getVal(s, 'q1_4'),
                            '2.1 เอกสาร': getVal(s, 'q2_1'),
                            '2.2 โสตทัศนูปกรณ์': getVal(s, 'q2_2'),
                            '2.3 จนท.สนับสนุน': getVal(s, 'q2_3'),
                            '2.4 อาหาร/สถานที่': getVal(s, 'q2_4'),
                            '3.1 ความรู้/ทักษะใหม่': getVal(s, 'q3_1'),
                            '3.2 นำไปใช้ปฏิบัติงาน': getVal(s, 'q3_2'),
                            '3.3 ตรงความคาดหวัง': getVal(s, 'q3_3'),
                            '3.4 เอื้อต่อการเรียนรู้': getVal(s, 'q3_4'),
                            '3.5 ประโยชน์': getVal(s, 'q3_5'),
                            'ข้อเสนอแนะ': s.Comment, 
                            'เวลาประเมิน': new Date(s.Timestamp).toLocaleString('th-TH') 
                        }));
                        window.XLSX.utils.book_append_sheet(wb, window.XLSX.utils.json_to_sheet(rawData), "Raw_Data");

                        // 2. Table 1: Demographics
                        let demoExport = [];
                        surveyStats.genderArray.forEach(g => demoExport.push({'เพศ (Gender)': g.label, 'จำนวน (N)': g.count, 'ร้อยละ (%)': g.percent}));
                        demoExport.push({'เพศ (Gender)': 'รวมทั้งหมด (Total)', 'จำนวน (N)': surveyStats.total, 'ร้อยละ (%)': 100.0});
                        window.XLSX.utils.book_append_sheet(wb, window.XLSX.utils.json_to_sheet(demoExport), "Table1_Demographics");

                        // 3. Table 2: Descriptive Statistics
                        let descExport = [];
                        surveyStats.groupedDetails.forEach(sec => {
                            descExport.push({'ประเด็นการประเมิน': sec.title, 'Mean': '', 'S.D.': '', 'แปลความหมาย': ''});
                            sec.items.forEach(item => {
                                descExport.push({
                                    'ประเด็นการประเมิน': `${item.id.replace('_', '.').replace('q','')} ${item.q.substring(item.q.indexOf(' ')+1)}`,
                                    'Mean': item.mean,
                                    'S.D.': item.sd,
                                    'แปลความหมาย': item.interp.text
                                });
                            });
                        });
                        descExport.push({
                            'ประเด็นการประเมิน': 'สรุปภาพรวมทั้งหมด (Overall)',
                            'Mean': surveyStats.overallMean,
                            'S.D.': surveyStats.overallSD,
                            'แปลความหมาย': surveyStats.overallInterp.text
                        });
                        window.XLSX.utils.book_append_sheet(wb, window.XLSX.utils.json_to_sheet(descExport), "Table2_Descriptive");

                        // 4. Table 3: Frequencies
                        let freqExport = surveyStats.chartData.map(c => ({
                            'ประเด็นการประเมิน': `${c.name} ${c.question.substring(c.question.indexOf(' ')+1)}`,
                            '5 ดาว (คน)': c['5'],
                            '4 ดาว (คน)': c['4'],
                            '3 ดาว (คน)': c['3'],
                            '2 ดาว (คน)': c['2'],
                            '1 ดาว (คน)': c['1']
                        }));
                        window.XLSX.utils.book_append_sheet(wb, window.XLSX.utils.json_to_sheet(freqExport), "Table3_Frequencies");

                        // 5. Comments
                        if (surveyStats.commentsList.length > 0) {
                            let commentsExport = surveyStats.commentsList.map(c => ({
                                'รหัสนักศึกษา': c.student,
                                'ข้อเสนอแนะ': c.text,
                                'เวลาประเมิน': new Date(c.date).toLocaleString('th-TH')
                            }));
                            window.XLSX.utils.book_append_sheet(wb, window.XLSX.utils.json_to_sheet(commentsExport), "Comments");
                        }

                        // Write to file and return immediately
                        window.XLSX.writeFile(wb, fileName);
                        return;
                    default:
                        exportData = stats.studentData;
                }

                if (exportData && exportData.length > 0) {
                    const ws = window.XLSX.utils.json_to_sheet(exportData); const wb = window.XLSX.utils.book_new(); window.XLSX.utils.book_append_sheet(wb, ws, sheetName); window.XLSX.writeFile(wb, fileName);
                } else { Swal.fire({ icon: 'info', title: 'ไม่มีข้อมูล', text: 'ไม่มีข้อมูลสำหรับดาวน์โหลดในหมวดหมู่นี้', customClass:{popup:'rounded-[2rem] bg-white dark:bg-zinc-900 text-slate-800 dark:text-white'} }); }
            };

            const handleExportWord = () => {
                if (surveyStats.total === 0) {
                    Swal.fire({ icon: 'info', title: 'ไม่มีข้อมูล', text: 'ไม่มีข้อมูลสำหรับดาวน์โหลด', customClass:{popup:'rounded-[2rem] bg-white dark:bg-zinc-900 text-slate-800 dark:text-white'} });
                    return;
                }

                let htmlContent = `
                    <html xmlns:o='urn:schemas-microsoft-com:office:office' xmlns:w='urn:schemas-microsoft-com:office:word' xmlns='http://www.w3.org/TR/REC-html40'>
                    <head>
                        <meta charset='utf-8'>
                        <style>
                            body { font-family: 'TH SarabunPSK', 'Sarabun', sans-serif; font-size: 16pt; }
                            table { border-collapse: collapse; width: 100%; margin-bottom: 20px; border: 1px solid black; }
                            th, td { border: 1px solid black; padding: 8px; text-align: left; }
                            th { text-align: center; font-weight: bold; background-color: #f2f2f2; }
                            .text-center { text-align: center; }
                            .text-right { text-align: right; }
                        </style>
                    </head>
                    <body>
                        <h2 style="text-align: center; font-weight: bold;">รายงานผลการวิเคราะห์ข้อมูล</h2>
                        <h3 style="text-align: center;">${selectedSurveyActivity === 'ทั้งหมด' ? 'รวมข้อมูลทุกกิจกรรม' : selectedSurveyActivity}</h3>
                        <br/>
                        
                        <h4>ตารางที่ 1 ข้อมูลทั่วไปของผู้ตอบแบบสอบถาม (Demographic Data)</h4>
                        <table>
                            <thead>
                                <tr>
                                    <th>ข้อมูลทั่วไป</th>
                                    <th>จำนวน (N)</th>
                                    <th>ร้อยละ (%)</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr><td colspan="3"><b>เพศ (Gender)</b></td></tr>
                                ${surveyStats.genderArray.map(g => `
                                    <tr>
                                        <td style="padding-left: 20px;">${g.label}</td>
                                        <td class="text-center">${g.count}</td>
                                        <td class="text-center">${g.percent}</td>
                                    </tr>
                                `).join('')}
                            </tbody>
                            <tfoot>
                                <tr>
                                    <td class="text-right"><b>รวมทั้งหมด (Total)</b></td>
                                    <td class="text-center"><b>${surveyStats.total}</b></td>
                                    <td class="text-center"><b>100.0</b></td>
                                </tr>
                            </tfoot>
                        </table>
                        <p style="text-indent: 36pt;"><b>สรุปผล:</b> ${surveyStats.table1Summary}</p>
                        <br/>

                        <h4>ตารางที่ 2 ค่าสถิติเชิงพรรณนา (Descriptive Statistics)</h4>
                        <table>
                            <thead>
                                <tr>
                                    <th>ประเด็นการประเมิน</th>
                                    <th>ค่าเฉลี่ย (Mean)</th>
                                    <th>S.D.</th>
                                    <th>ระดับความคิดเห็น</th>
                                </tr>
                            </thead>
                            <tbody>
                                ${surveyStats.groupedDetails.map(sec => `
                                    <tr>
                                        <td colspan="4" style="background-color: #f9f9f9;"><b>${sec.title}</b></td>
                                    </tr>
                                    ${sec.items.map(item => `
                                        <tr>
                                            <td style="padding-left: 20px;">${item.id.replace('_', '.').replace('q','')} ${item.q.substring(item.q.indexOf(' ')+1)}</td>
                                            <td class="text-center">${item.mean}</td>
                                            <td class="text-center">${item.sd}</td>
                                            <td class="text-center">${item.interp.text}</td>
                                        </tr>
                                    `).join('')}
                                `).join('')}
                            </tbody>
                            <tfoot>
                                <tr style="background-color: #f2f2f2;">
                                    <td class="text-right"><b>สรุปภาพรวมทั้งหมด (Overall)</b></td>
                                    <td class="text-center"><b>${surveyStats.overallMean}</b></td>
                                    <td class="text-center"><b>${surveyStats.overallSD}</b></td>
                                    <td class="text-center"><b>ระดับ${surveyStats.overallInterp.text}</b></td>
                                </tr>
                            </tfoot>
                        </table>
                        <p style="text-indent: 36pt;"><b>สรุปผล:</b> ${surveyStats.table2Summary}</p>
                    </body>
                    </html>
                `;

                const blob = new Blob(['\ufeff', htmlContent], { type: 'application/msword' });
                const url = URL.createObjectURL(blob);
                const link = document.createElement('a');
                link.href = url;
                link.download = `Survey_Report_Word_${new Date().toISOString().slice(0,10)}.doc`;
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
            };

            // Role-Based Tab Filtering
            const ALL_TABS = [
                { id: 'overview', icon: 'users', label: 'ภาพรวม', roles: ['Super Admin', 'Manager', 'Viewer'] },
                { id: 'majors', icon: 'pie-chart', label: 'สาขาวิชา', roles: ['Super Admin', 'Manager', 'Viewer'] },
                { id: 'health_diet', icon: 'activity', label: 'โภชนาการ', roles: ['Super Admin', 'Manager'] },
                { id: 'surveillance', icon: 'shield-alert', label: 'กลุ่มเฝ้าระวัง', roles: ['Super Admin', 'Manager'] },
                { id: 'executive', icon: 'layout-dashboard', label: 'รายงานสรุปผู้บริหาร', roles: ['Super Admin', 'Viewer'] },
                { id: 'create_activity', icon: 'calendar-plus', label: 'สร้างกิจกรรม', roles: ['Super Admin', 'Manager'] },
                { id: 'activity_summary', icon: 'radio', label: 'Real-Time Recording', roles: ['Super Admin', 'Manager', 'Viewer'] },
                { id: 'survey_summary', icon: 'star', label: 'สรุปแบบสอบถาม (SPSS)', roles: ['Super Admin', 'Manager', 'Viewer'] },
                { id: 'admin_users', icon: 'users-cog', label: 'จัดการผู้ดูแลระบบ', roles: ['Super Admin'] },
                { id: 'settings', icon: 'settings', label: 'ตั้งค่าระบบ', roles: ['Super Admin', 'Manager'] }
            ];

            const TABS = useMemo(() => ALL_TABS.filter(tab => tab.roles.includes(currentUser?.role || 'Viewer')), [currentUser]);

            // Ensure activeTab is valid for current user
            useEffect(() => {
                if (!TABS.find(t => t.id === activeTab)) {
                    setActiveTab(TABS[0].id);
                }
            }, [activeTab, TABS]);

            if (loading && stats.total === 0) return (
                <div className="flex flex-col justify-center items-center h-[70vh]">
                    <div className="p-4 bg-brand/10 rounded-2xl mb-4 animate-pulse-slow shadow-glow-brand"><Icon name="loader-2" size={40} className="text-brand animate-spin" /></div>
                    <p className="text-slate-500 font-bold tracking-widest uppercase text-sm">กำลังโหลดข้อมูล...</p>
                </div>
            );

            const pieTooltipStyle = { backgroundColor: isDarkMode ? 'rgba(24, 24, 27, 0.95)' : 'rgba(255, 255, 255, 0.95)', backdropFilter: 'blur(10px)', border: '1px solid rgba(255,255,255,0.1)', borderRadius: '16px', boxShadow: '0 20px 40px rgba(0,0,0,0.15)' };
            const pieItemStyle = {fontWeight: 'bold', color: isDarkMode ? '#fff' : '#1e293b'};
            const drilldownIcon = drilldownData.type === 'activity_regs' || drilldownData.type === 'activity_major' ? "calendar-check" : "users";
            const drilldownHeaderColor = (drilldownData.type === 'activity_regs' || drilldownData.type === 'activity_major') ? 'bg-purple-500 shadow-glow-brand' : (drilldownData.type.includes('diet') || drilldownData.type.includes('food') || drilldownData.type === 'allergy_group') ? 'bg-orange-500 shadow-glow-brand' : (drilldownData.type === 'demographics' || drilldownData.type === 'major_breakdown' || drilldownData.type === 'majors') ? 'bg-blue-500' : drilldownData.title.includes('ทั้งหมด') ? 'bg-brand shadow-glow-brand' : drilldownData.type === 'healthy' ? 'bg-emerald-500' : 'bg-red-500 shadow-glow-red';

            return (
                <div className="flex flex-col md:flex-row gap-6 animate-fade-in pb-20 items-start w-full">
                    {/* Admin Sidebar */}
                    <div className="w-full md:w-64 glass-panel p-5 rounded-[2rem] flex flex-col md:sticky md:top-24 z-20 shrink-0 no-print border border-slate-200/50 dark:border-white/5 shadow-soft">
                        <div className="flex items-center gap-4 mb-6 px-2 pt-2">
                            <div className="w-12 h-12 bg-slate-900 dark:bg-white rounded-[1rem] flex items-center justify-center text-white dark:text-black shadow-lg shrink-0"><Icon name="command" size={24}/></div>
                            <div className="overflow-hidden">
                                <p className="text-[10px] text-brand font-black tracking-widest uppercase truncate">{currentUser?.username || 'Admin'}</p>
                                <h3 className="font-black text-slate-800 dark:text-white leading-none text-base mt-1 truncate">{currentUser?.role || 'Staff'}</h3>
                            </div>
                        </div>
                        <div className="flex flex-row md:flex-col overflow-x-auto hide-scrollbar gap-2 pb-2 md:pb-0">
                            {TABS.map(tab => (
                                <button key={tab.id} onClick={() => { setActiveTab(tab.id); setCurrentPage(1); }} 
                                    className={`flex items-center gap-3 px-4 py-3.5 rounded-xl transition-all font-bold whitespace-nowrap btn-interactive text-sm
                                    ${activeTab === tab.id ? (tab.id === 'activity_summary' ? 'bg-red-500 text-white shadow-glow-red hover:-translate-y-0.5' : tab.id === 'survey_summary' ? 'bg-yellow-500 text-white shadow-glow-brand hover:-translate-y-0.5' : tab.id === 'admin_users' ? 'bg-slate-800 text-white shadow-lg hover:-translate-y-0.5' : tab.id === 'settings' ? 'bg-slate-600 text-white shadow-lg hover:-translate-y-0.5' : 'bg-brand text-white shadow-glow-brand hover:-translate-y-0.5') : 'text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-white/10 hover:text-slate-900 dark:hover:text-white'}`}>
                                    <Icon name={tab.icon} size={18} className={activeTab === tab.id ? 'text-white' : 'text-slate-400'}/> {tab.label}
                                </button>
                            ))}
                        </div>
                    </div>

                    {/* Admin Main Content */}
                    <div className="flex-1 w-full space-y-6 print-area min-w-0">
                        {/* Header Action Bar */}
                        <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center glass-panel p-5 md:px-8 md:py-6 rounded-[2.5rem] gap-4 no-print shadow-soft border border-slate-200/50 dark:border-white/5">
                            <h2 className="text-xl md:text-2xl font-black text-slate-800 dark:text-white flex items-center gap-3 whitespace-nowrap">
                                <div className={`p-2.5 rounded-xl shadow-sm ${activeTab === 'activity_summary' ? 'bg-red-500/10 text-red-500' : activeTab === 'survey_summary' ? 'bg-yellow-500/10 text-yellow-600' : activeTab === 'admin_users' ? 'bg-slate-800/10 text-slate-800 dark:text-white' : activeTab === 'settings' ? 'bg-slate-600/10 text-slate-600 dark:text-slate-400' : 'bg-brand/10 text-brand'}`}><Icon name={(TABS.find(t=>t.id===activeTab) || {}).icon} size={20}/></div> {(TABS.find(t=>t.id===activeTab) || {}).label}
                            </h2>
                            <div className="flex flex-col xl:flex-row flex-wrap w-full sm:w-auto gap-3 items-start xl:items-center">
                                <div className="relative w-full sm:w-64">
                                    <div className="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400"><Icon name="search" size={16}/></div>
                                    <input type="text" placeholder="ค้นหาชื่อ, รหัสนศ..." value={searchTerm} onChange={(e) => {setSearchTerm(e.target.value); setCurrentPage(1);}} className="w-full pl-10 pr-8 py-2.5 rounded-xl input-modern text-sm font-semibold"/>
                                </div>
                                <div className="flex flex-wrap w-full sm:w-auto gap-2 justify-start sm:justify-end">
                                    {activeTab !== 'admin_users' && activeTab !== 'settings' && <button onClick={exportExcel} className="px-5 py-2.5 bg-emerald-50 dark:bg-emerald-500/10 text-emerald-600 dark:text-emerald-400 hover:bg-emerald-500 hover:text-white rounded-xl font-bold text-sm flex items-center gap-2 transition-all btn-interactive shadow-sm whitespace-nowrap"><Icon name="download" size={16} /> Export</button>}
                                    <button onClick={goBack} className="px-5 py-2.5 bg-red-50 dark:bg-red-500/10 text-red-500 rounded-xl hover:bg-red-50 hover:text-white font-bold text-sm btn-interactive shadow-sm flex items-center gap-2 whitespace-nowrap"><Icon name="log-out" size={16}/> ออกจากระบบ</button>
                                </div>
                            </div>
                        </div>

                        {/* TAB 1: OVERVIEW */}
                        {activeTab === 'overview' && (
                            <div className="space-y-6 animate-fade-in">
                                <div className="grid grid-cols-2 lg:grid-cols-4 gap-4 md:gap-6">
                                    <StatCard label="ขึ้นทะเบียนรวม" value={stats.total} icon="users" color="brand" onClick={() => handleDrilldown('ขึ้นทะเบียนรวมทั้งหมด', 'all', '')} subtext="คน" />
                                    <StatCard label="สุขภาพแข็งแรง" value={stats.total - stats.healthAlert} icon="check-circle" color="emerald" onClick={() => handleDrilldown('สุขภาพแข็งแรง', 'healthy', '')} subtext="คน" />
                                    <StatCard label="เฝ้าระวัง (การแพทย์)" value={stats.healthAlert} icon="activity" color="red" onClick={() => handleDrilldown('กลุ่มเปราะบาง (การแพทย์)', 'health_alert', '')} subtext="คน" />
                                    <StatCard label="เฝ้าระวัง (อาหาร)" value={stats.foodAlert} icon="alert-triangle" color="orange" onClick={() => handleDrilldown('จัดการอาหารพิเศษ', 'food_alert', '')} subtext="คน" />
                                </div>
                                <div className="glass-panel rounded-[2rem] overflow-hidden border border-slate-200/50 dark:border-white/5 shadow-soft">
                                    <div className="p-6 md:px-8 border-b border-slate-100 dark:border-white/5 bg-slate-50/50 dark:bg-white/5 flex justify-between items-center">
                                        <h3 className="font-bold text-slate-800 dark:text-white flex items-center gap-3"><Icon name="list" className="text-slate-400" size={18}/> รายชื่ออัปเดตล่าสุด</h3>
                                    </div>
                                    <div className="overflow-x-auto p-2 custom-scrollbar">
                                        <table className="w-full text-sm text-left min-w-[700px]">
                                            <thead className="text-[11px] text-slate-400 uppercase tracking-widest bg-transparent">
                                                <tr><th className="px-6 py-3">ชื่อ-นามสกุล</th><th className="px-6 py-3">สาขาวิชา</th><th className="px-6 py-3 text-center">สถานะ</th><th className="px-6 py-3">ข้อมูลติดต่อ</th></tr>
                                            </thead>
                                            <tbody className="divide-y divide-slate-100 dark:divide-white/5">
                                                {(() => {
                                                    const reversedData = [...stats.studentData].reverse();
                                                    const itemsPerPage = 15;
                                                    const indexOfLastItem = currentPage * itemsPerPage;
                                                    const indexOfFirstItem = indexOfLastItem - itemsPerPage;
                                                    const currentItems = reversedData.slice(indexOfFirstItem, indexOfLastItem);
                                                    
                                                    if (currentItems.length === 0) return <tr><td colSpan="4" className="text-center py-12 text-slate-400 font-medium">ไม่พบข้อมูล</td></tr>;
                                                    
                                                    return currentItems.map((row, i) => {

                                </div>
                            </div>

                                                            <span className={`inline-flex items-center gap-1.5 px-3 py-1 rounded-lg text-xs font-bold shadow-sm border
                                                                ${user.role === 'Super Admin' ? 'bg-red-50 text-red-600 border-red-200 dark:bg-red-500/10 dark:text-red-400 dark:border-red-500/20' : 
                                                                  user.role === 'Manager' ? 'bg-blue-50 text-blue-600 border-blue-200 dark:bg-blue-500/10 dark:text-blue-400 dark:border-blue-500/20' : 
                                                                  'bg-emerald-50 text-emerald-600 border-emerald-200 dark:bg-emerald-500/10 dark:text-emerald-400 dark:border-emerald-500/20'}`}>
                                                                {user.role === 'Super Admin' ? <Icon name="shield-alert" size={12}/> : user.role === 'Manager' ? <Icon name="edit-3" size={12}/> : <Icon name="eye" size={12}/>}
                                                                {user.role}
                                                            </span>
                                                        </td>
                                                        <td className="px-6 py-4 text-center">
                                                            <span className={`inline-block w-2.5 h-2.5 rounded-full mr-2 ${user.status === 'Active' ? 'bg-emerald-500' : 'bg-slate-300'}`}></span>
                                                            <span className="text-xs font-semibold text-slate-500">{user.status}</span>
                                                        </td>
                                                        <td className="px-6 py-4 text-right">
                                                            <div className="flex justify-end gap-2">
                                                                <button onClick={() => { setUserForm({ ...user, password: '' }); setShowUserModal(true); }} className="p-2 bg-slate-100 dark:bg-white/5 text-slate-600 dark:text-slate-300 rounded-lg hover:bg-blue-50 hover:text-blue-600 dark:hover:bg-blue-900/20 dark:hover:text-blue-400 transition-colors btn-interactive" title="แก้ไข">
                                                                    <Icon name="edit" size={16}/>
                                                                </button>
                                                                <button onClick={() => handleDeleteUser(user.id)} disabled={user.username === 'admin'} className="p-2 bg-slate-100 dark:bg-white/5 text-slate-600 dark:text-slate-300 rounded-lg hover:bg-red-50 hover:text-red-600 dark:hover:bg-red-900/20 dark:hover:text-red-400 transition-colors btn-interactive disabled:opacity-30" title="ลบ">
                                                                    <Icon name="trash-2" size={16}/>
                                                                </button>
                                                            </div>
                                                        </td>
                                                    </tr>
                                                ))}
                                            </tbody>
                                        </table>
                                    </div>
                                </div>
                            </div>
                        )}

                        {/* TAB 10: SETTINGS */}
                        {activeTab === 'settings' && (
                            <div className="space-y-6 animate-fade-in print:hidden">
                                <div className="glass-panel p-6 md:p-8 rounded-[2.5rem] border-t-[8px] border-t-slate-500 shadow-soft relative overflow-hidden bg-gradient-to-b from-white to-slate-50/50 dark:from-zinc-900 dark:to-zinc-900/50">
                                    <div className="absolute top-0 right-0 p-8 opacity-5 text-slate-500 pointer-events-none transform translate-x-4 -translate-y-4"><Icon name="settings" size={120} /></div>
                                    <div className="flex flex-col gap-4 relative z-10">
                                        <h3 className="text-xl md:text-2xl font-black text-slate-800 dark:text-white flex items-center gap-3">
                                            <div className="p-3 bg-slate-100 dark:bg-white/10 text-slate-800 dark:text-white rounded-2xl shadow-inner"><Icon name="settings" size={24}/></div>
                                            ตั้งค่าระบบ
                                        </h3>
                                        <p className="text-slate-500 font-medium text-sm">จัดการเปิด/ปิดฟังก์ชันต่างๆ ภายในระบบ</p>
                                    </div>
                                </div>

                                <div className="glass-panel rounded-[2rem] overflow-hidden border border-slate-200/50 dark:border-white/5 shadow-soft p-6 md:p-8">
                                    <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-6">
                                        <div>
                                            <h4 className="font-bold text-lg text-slate-800 dark:text-white flex items-center gap-2">
                                                <Icon name={isRegistrationOpen ? "user-check" : "user-minus"} size={20} className={isRegistrationOpen ? "text-emerald-500" : "text-slate-400"} /> 
                                                สถานะการขึ้นทะเบียนนักศึกษาใหม่
                                            </h4>
                                            <p className="text-sm text-slate-500 mt-1">เปิดหรือปิดระบบเพื่อไม่ให้นักศึกษาเข้ามาลงทะเบียนชั่วคราว (เช่น เมื่อหมดเขตรับสมัครแล้ว)</p>
                                        </div>
                                        <button onClick={() => {
                                            setIsRegistrationOpen(!isRegistrationOpen);
                                            Swal.fire({ icon: 'success', title: !isRegistrationOpen ? 'เปิดระบบสำเร็จ' : 'ปิดระบบสำเร็จ', timer: 1500, showConfirmButton: false, customClass:{popup:'rounded-[2rem] bg-white dark:bg-zinc-900 text-slate-800 dark:text-white'} });
                                        }} className={`relative inline-flex h-8 w-14 shrink-0 cursor-pointer rounded-full border-2 border-transparent transition-colors duration-200 ease-in-out focus:outline-none shadow-sm ${isRegistrationOpen ? 'bg-emerald-500 hover:bg-emerald-400' : 'bg-slate-300 dark:bg-slate-600 hover:bg-slate-400'}`}>
                                            <span className={`pointer-events-none inline-block h-7 w-7 transform rounded-full bg-white shadow ring-0 transition duration-200 ease-in-out ${isRegistrationOpen ? 'translate-x-6' : 'translate-x-0'}`} />
                                        </button>
                                    </div>
                                </div>
                            </div>
                        )}
                    </div>

                    {/* MODALS: Drilldown */}
                    {drilldownData.list.length > 0 && (
                        <div className="fixed inset-0 z-[90] flex items-center justify-center p-4 sm:p-6 bg-slate-900/70 dark:bg-black/90 backdrop-blur-lg animate-fade-in print:hidden">
                            <div className="bg-white dark:bg-zinc-900 border border-slate-200 dark:border-white/10 p-6 md:p-8 rounded-[2.5rem] w-full max-w-5xl max-h-[90vh] flex flex-col shadow-[0_20px_60px_rgba(0,0,0,0.3)] dark:shadow-[0_20px_60px_rgba(0,0,0,0.8)] animate-slide-up text-left overflow-hidden">
                                <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 mb-6 shrink-0">
                                    <div>
                                        <h3 className="text-xl md:text-2xl font-black text-slate-800 dark:text-white flex items-center gap-3">
                                            <div className={`p-3 rounded-2xl text-white shadow-md ${drilldownHeaderColor}`}><Icon name={drilldownIcon} size={24}/></div>
                                            {drilldownData.title}
                                        </h3>
                                        <p className="text-sm font-semibold text-slate-500 mt-2">พบทั้งหมด <span className="text-brand font-black bg-brand/10 px-2 py-0.5 rounded-md">{drilldownData.list.length}</span> รายการ</p>
                                    </div>
                                    <button onClick={() => setDrilldownData({ title: '', list: [], type: '' })} className="p-2.5 bg-slate-100 dark:bg-white/10 rounded-xl hover:bg-slate-200 transition-colors"><Icon name="x" size={20}/></button>
                                </div>
                                <div className="overflow-y-auto flex-1 custom-scrollbar -mx-2 px-2">
                                    <table className="w-full text-sm text-left">
                                        <thead className="text-xs text-slate-500 uppercase tracking-widest bg-slate-100/80 dark:bg-zinc-800/80 sticky top-0 rounded-xl z-10 shadow-sm backdrop-blur-md">
                                            <tr>
                                                <th className="px-6 py-5 rounded-l-xl font-black">ชื่อ-นามสกุล</th>
                                                <th className="px-6 py-5 font-black">รหัสนักศึกษา</th>
                                                <th className="px-6 py-5 font-black">สาขาวิชา</th>
                                                <th className="px-6 py-5 rounded-r-xl font-black">ข้อมูลติดต่อ</th>
                                            </tr>
                                        </thead>
                                        <tbody className="divide-y divide-slate-100 dark:divide-white/5">
                                            {drilldownData.list.map((row, idx) => (
                                                <tr key={idx} className="hover:bg-slate-50/80 dark:hover:bg-white/5 transition-colors">
                                                    <td className="px-6 py-5 font-bold text-slate-800 dark:text-white">{row.FullName}</td>
                                                    <td className="px-6 py-5"><span className="font-mono text-xs font-bold text-brand bg-brand/10 px-2 py-1 rounded-md border border-brand/20">{row.StudentID || '-'}</span></td>
                                                    <td className="px-6 py-5 text-xs font-semibold text-slate-600 dark:text-slate-400">{row.Major}</td>
                                                    <td className="px-6 py-5 text-xs">
                                                        <div className="font-semibold text-slate-600 dark:text-slate-400 mb-1.5 flex items-center gap-1.5"><Icon name="phone" size={14}/> นศ: {row.StudentPhone}</div>
                                                        {row.ParentPhone && row.ParentPhone !== '-' && <div className="font-bold text-red-500 flex items-center gap-1.5"><Icon name="phone-call" size={14}/> ผปค: {row.ParentPhone}</div>}
                                                    </td>
                                                </tr>
                                            ))}
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Chart Modal */}
                    {showChartModal && (
                        <div className="fixed inset-0 z-[90] flex items-center justify-center p-4 sm:p-6 bg-slate-900/70 dark:bg-black/90 backdrop-blur-lg animate-fade-in print:hidden">
                            <div className="bg-white dark:bg-zinc-900 border border-slate-200 dark:border-white/10 p-6 md:p-8 rounded-[2.5rem] w-full max-w-5xl max-h-[90vh] flex flex-col shadow-[0_20px_60px_rgba(0,0,0,0.3)] dark:shadow-[0_20px_60px_rgba(0,0,0,0.8)] animate-slide-up text-left overflow-hidden">
                                <div className="flex justify-between items-center mb-6 shrink-0">
                                    <h3 className="text-xl md:text-2xl font-black text-slate-800 dark:text-white flex items-center gap-3">
                                        <div className="p-3 rounded-2xl bg-yellow-500 text-white shadow-md"><Icon name="bar-chart-2" size={24}/></div>
                                        การแจกแจงความถี่ของระดับความพึงพอใจ (Frequencies)
                                    </h3>
                                    <button onClick={() => setShowChartModal(false)} className="p-2.5 bg-slate-100 dark:bg-white/10 rounded-xl hover:bg-slate-200 transition-colors"><Icon name="x" size={20}/></button>
                                </div>
                                <div className="overflow-y-auto flex-1 custom-scrollbar -mx-2 px-2 pb-4">
                                    <div className="w-full h-[800px]">
                                        <ResponsiveContainer width="100%" height="100%">
                                            <BarChart data={surveyStats.chartData} layout="vertical" margin={{ top: 0, right: 0, left: 10, bottom: 0 }} stackOffset="expand">
                                                <XAxis type="number" hide />
                                                <YAxis dataKey="name" type="category" axisLine={false} tickLine={false} tick={{fill: isDarkMode ? '#94a3b8' : '#475569', fontSize: 12, fontWeight: 'bold'}} />
                                                <Tooltip 
                                                    cursor={{fill: isDarkMode ? 'rgba(255,255,255,0.05)' : 'rgba(0,0,0,0.03)'}} 
                                                    contentStyle={pieTooltipStyle}
                                                    formatter={(value, name, props) => {
                                                        const count = props.payload[name];
                                                        const percent = (value * 100).toFixed(1);
                                                        return [`${count} คน (${percent}%)`, `${name} ดาว`];
                                                    }}
                                                />
                                                <Legend verticalAlign="top" height={36} iconType="circle" wrapperStyle={{fontSize: '12px', fontWeight: 'bold'}} formatter={(value) => `${value} ดาว`}/>
                                                <Bar dataKey="5" stackId="a" fill="#10b981" radius={[0, 0, 0, 0]} />
                                                <Bar dataKey="4" stackId="a" fill="#3b82f6" radius={[0, 0, 0, 0]} />
                                                <Bar dataKey="3" stackId="a" fill="#facc15" radius={[0, 0, 0, 0]} />
                                                <Bar dataKey="2" stackId="a" fill="#f97316" radius={[0, 0, 0, 0]} />
                                                <Bar dataKey="1" stackId="a" fill="#ef4444" radius={[0, 0, 0, 0]} />
                                            </BarChart>
                                        </ResponsiveContainer>
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Edit Student Modal */}
                    {editItem && (
                        <div className="fixed inset-0 z-[70] flex items-center justify-center p-4 sm:p-6 bg-slate-900/70 dark:bg-black/90 backdrop-blur-lg animate-fade-in print:hidden">
                            <div className="bg-white dark:bg-zinc-900 border border-slate-200 dark:border-white/10 p-6 md:p-8 rounded-[2.5rem] w-full max-w-lg max-h-[90vh] flex flex-col shadow-[0_20px_60px_rgba(0,0,0,0.3)] dark:shadow-[0_20px_60px_rgba(0,0,0,0.8)] animate-slide-up text-left overflow-hidden">
                                <div className="flex justify-between items-center mb-6 shrink-0">
                                    <h3 className="text-xl md:text-2xl font-black text-slate-800 dark:text-white flex items-center gap-3"><Icon name="edit" size={24}/> แก้ไขข้อมูลนักศึกษา</h3>
                                    <button onClick={() => setEditItem(null)} className="p-2.5 bg-slate-100 dark:bg-white/10 rounded-xl hover:bg-slate-200 transition-colors"><Icon name="x" size={20}/></button>
                                </div>
                                <form onSubmit={handleSaveEdit} className="space-y-5 overflow-y-auto flex-1 custom-scrollbar pr-2 pb-4">
                                    <div className="p-5 md:p-6 bg-slate-50/80 dark:bg-black/20 rounded-3xl border border-slate-200/60 dark:border-white/5 space-y-4 shadow-inner">
                                        <InputField label="ชื่อ-นามสกุล" value={editItem.FullName} onChange={v => setEditItem({...editItem, FullName: v})} />
                                        <div className="grid grid-cols-2 gap-4">
                                            <InputField label="รหัสนักศึกษา" numeric maxLength="9" value={editItem.StudentID} onChange={v => setEditItem({...editItem, StudentID: v})} />
                                            <InputField label="บัตรประชาชน/Passport" maxLength="20" value={editItem.IDCard || ''} onChange={v => setEditItem({...editItem, IDCard: v})} />
                                        </div>
                                        <InputField label="สาขาวิชา" value={editItem.Major} onChange={v => setEditItem({...editItem, Major: v})} />
                                        <div className="grid grid-cols-2 gap-4">
                                            <InputField label="ศาสนา" value={editItem.Religion || ''} onChange={v => setEditItem({...editItem, Religion: v})} />
                                            <InputField label="กรุ๊ปเลือด" value={editItem.BloodGroup || ''} onChange={v => setEditItem({...editItem, BloodGroup: v})} />
                                        </div>
                                        <div className="grid grid-cols-2 gap-4">
                                            <InputField label="เบอร์ นศ." numeric maxLength="10" value={editItem.StudentPhone} onChange={v => setEditItem({...editItem, StudentPhone: v})} />
                                            <InputField label="เบอร์ ผปค." numeric maxLength="10" value={editItem.ParentPhone} onChange={v => setEditItem({...editItem, ParentPhone: v})} />
                                        </div>
                                    </div>
                                    <div className="p-5 md:p-6 bg-orange-50/80 dark:bg-orange-950/20 rounded-3xl border border-orange-200/60 dark:border-orange-500/20 space-y-4 shadow-sm">
                                        <InputField label="แพ้อาหาร" value={editItem.FoodAllergy} onChange={v => setEditItem({...editItem, FoodAllergy: v})} />
                                        <InputField label="อาหารเฉพาะทาง" value={editItem.SpecificDiet} onChange={v => setEditItem({...editItem, SpecificDiet: v})} />
                                    </div>
                                    <div className="p-5 md:p-6 bg-red-50/80 dark:bg-red-950/20 rounded-3xl border border-red-200/60 dark:border-red-500/20 space-y-4 shadow-sm">
                                        <InputField label="โรคประจำตัว" value={editItem.Disease} onChange={v => setEditItem({...editItem, Disease: v})} />
                                        <InputField label="แพ้ยา" value={editItem.DrugAllergy} onChange={v => setEditItem({...editItem, DrugAllergy: v})} />
                                    </div>
                                    <div className="flex gap-4 pt-6 sticky bottom-0 bg-white dark:bg-zinc-900 pb-2 z-10 border-t border-slate-100 dark:border-white/5 mt-6">
                                        <button type="button" onClick={() => setEditItem(null)} className="flex-1 py-4 bg-slate-100 dark:bg-white/5 text-sm rounded-xl font-bold btn-interactive hover:bg-slate-200 dark:hover:bg-white/10 transition-colors text-slate-600 dark:text-slate-300">ยกเลิก</button>
                                        <button type="submit" className="flex-1 py-4 brand-gradient text-white text-sm rounded-xl font-bold shadow-glow-brand btn-interactive transform hover:-translate-y-0.5 transition-all flex items-center justify-center gap-2"><Icon name="save" size={18}/> บันทึกข้อมูล</button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        // ==========================================
        // 🚀 Main App 
        // ==========================================
        function App() {
            const [isDarkMode, setIsDarkMode] = useState(false);
            const [currentView, setCurrentView] = useState('home'); 
            const [surveyData, setSurveyData] = useState({ act: '', sid: '' });
            const [currentUser, setCurrentUser] = useState(null);
            const [isRegistrationOpen, setIsRegistrationOpen] = useState(true);

            // Mock Data สำหรับระบบจำลองสิทธิ์
            const [mockUsers] = useState([
                { id: 1, username: 'admin', password: '0000', role: 'Super Admin', status: 'Active' },
                { id: 2, username: 'staff1', password: '123', role: 'Manager', status: 'Active' },
                { id: 3, username: 'guest', password: '123', role: 'Viewer', status: 'Active' }
            ]);
            
            useEffect(() => {
                const isDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
                setIsDarkMode(isDark);
            }, []);

            useEffect(() => {
                if (isDarkMode) document.documentElement.classList.add('dark');
                else document.documentElement.classList.remove('dark');
            }, [isDarkMode]);

            return (
                <AppContext.Provider value={{ isDarkMode }}>
                    <div className="min-h-screen p-4 md:p-6 transition-colors duration-300 relative">
                        {currentView === 'home' && <HomeView onSelectNewStudent={() => setCurrentView('pdpa')} onSelectActivity={() => setCurrentView('activity_form')} onCheckActivity={() => setCurrentView('check_activity')} onAdminClick={(user) => { setCurrentUser(user); setCurrentView('admin'); }} mockUsers={mockUsers} isRegistrationOpen={isRegistrationOpen} />}
                        {currentView === 'pdpa' && <PdpaModal onAccept={() => setCurrentView('register')} onBack={() => setCurrentView('home')} />}
                        {currentView === 'register' && <RegistrationForm onBack={() => setCurrentView('home')} onSuccess={() => setCurrentView('success')} />}
                        {currentView === 'activity_form' && <ActivityForm onBack={() => setCurrentView('home')} onSuccess={(act, sid) => { setSurveyData({act, sid}); setCurrentView('survey_form'); }} />}
                        {currentView === 'check_activity' && <CheckActivityView onBack={() => setCurrentView('home')} />}
                        {currentView === 'survey_form' && <SurveyForm onBack={() => setCurrentView('home')} onSuccess={() => setCurrentView('success')} activityName={surveyData.act} studentID={surveyData.sid} />}
                        {currentView === 'success' && <SuccessView onHome={() => setCurrentView('home')} />}
                        {currentView === 'admin' && <AdminDashboard goBack={() => { setCurrentUser(null); setCurrentView('home'); }} currentUser={currentUser} isRegistrationOpen={isRegistrationOpen} setIsRegistrationOpen={setIsRegistrationOpen} />}

                        <div className="fixed bottom-6 right-6 flex flex-col gap-3 z-50 print:hidden">
                            <button onClick={() => setIsDarkMode(!isDarkMode)} className="w-12 h-12 bg-white dark:bg-zinc-800 text-slate-800 dark:text-white rounded-full shadow-lg border border-slate-200 dark:border-zinc-700 hover:scale-110 transition-transform flex items-center justify-center" title="สลับโหมดกลางคืน">
                                <Icon name={isDarkMode ? "sun" : "moon"} size={20} />
                            </button>
                        </div>
                    </div>
                </AppContext.Provider>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
