<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DIGIT.69</title>
    
    <!-- Tailwind CSS with Dark Mode Support -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: { 
                        brand: '#ff6600', brandDark: '#cc5200', brandLight: '#ff8533',
                        lightBg: '#f8fafc', darkBg: '#09090b',
                        panelLight: '#ffffff', panelDark: 'rgba(24, 24, 27, 0.85)'
                    },
                    boxShadow: {
                        'glow-brand': '0 0 25px rgba(255, 102, 0, 0.3)',
                        'glow-red': '0 0 25px rgba(239, 68, 68, 0.3)',
                        'glass': '0 8px 32px 0 rgba(31, 38, 135, 0.07)',
                        'soft': '0 10px 40px -10px rgba(0, 0, 0, 0.08)',
                    },
                    animation: { 
                        'fade-in': 'fadeIn 0.4s cubic-bezier(0.22, 1, 0.36, 1)',
                        'slide-up': 'slideUp 0.5s cubic-bezier(0.22, 1, 0.36, 1)'
                    },
                    keyframes: { 
                        fadeIn: { '0%': { opacity: '0', transform: 'scale(0.98)' }, '100%': { opacity: '1', transform: 'scale(1)' } },
                        slideUp: { '0%': { opacity: '0', transform: 'translateY(20px)' }, '100%': { opacity: '1', transform: 'translateY(0)' } }
                    }
                }
            }
        }
    </script>
    
    <!-- Fonts & Libraries -->
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <script src="https://unpkg.com/recharts@2.1.12/umd/Recharts.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <!-- SweetAlert2 -->
    <link href="https://cdn.jsdelivr.net/npm/@sweetalert2/theme-dark@4/dark.css" rel="stylesheet" id="swal-theme">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <style>
        body { font-family: 'Prompt', sans-serif; margin: 0; padding: 0; overflow-x: hidden; -webkit-font-smoothing: antialiased; background-color: #f8fafc; }
        .dark body { background-color: #09090b; }
        body::before {
            content: ""; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: -1; pointer-events: none;
            background-image: radial-gradient(at 0% 0%, hsla(28, 100%, 74%, 0.15) 0px, transparent 50%), radial-gradient(at 100% 0%, hsla(250, 100%, 74%, 0.1) 0px, transparent 50%), radial-gradient(at 100% 100%, hsla(28, 100%, 74%, 0.15) 0px, transparent 50%);
        }
        .dark body::before {
            background-image: radial-gradient(at 0% 0%, hsla(28, 100%, 50%, 0.08) 0px, transparent 50%), radial-gradient(at 100% 0%, hsla(250, 100%, 50%, 0.05) 0px, transparent 50%), radial-gradient(at 100% 100%, hsla(28, 100%, 50%, 0.08) 0px, transparent 50%);
        }
        
        .glass-panel { background: rgba(255, 255, 255, 0.7); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.6); box-shadow: 0 4px 30px rgba(0, 0, 0, 0.03); transition: all 0.3s ease; }
        .dark .glass-panel { background: rgba(24, 24, 27, 0.65); border: 1px solid rgba(255, 255, 255, 0.08); box-shadow: 0 4px 30px rgba(0, 0, 0, 0.3); }

        .input-modern { outline: none; background: rgba(255, 255, 255, 0.8); border: 1px solid #e2e8f0; color: #0f172a; transition: all 0.3s ease; }
        .input-modern:focus { border-color: #ff6600; box-shadow: 0 0 0 4px rgba(255, 102, 0, 0.1); background: #ffffff; }
        .dark .input-modern { background: rgba(0, 0, 0, 0.3); border: 1px solid rgba(255, 255, 255, 0.1); color: #f8fafc; }
        .dark .input-modern:focus { border-color: #ff6600; box-shadow: 0 0 0 4px rgba(255, 102, 0, 0.15); background: rgba(0, 0, 0, 0.5); }

        .brand-gradient { background: linear-gradient(135deg, #ff8533 0%, #ff6600 50%, #e65c00 100%); }
        .brand-text-gradient { background-clip: text; -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-image: linear-gradient(135deg, #ff8533, #ff6600); }
        
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        .light-mode ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        .dark ::-webkit-scrollbar-thumb { background: #3f3f46; border-radius: 10px; }
        .btn-interactive { transition: transform 0.15s ease, box-shadow 0.3s ease, background 0.3s ease; }
        .btn-interactive:active:not(:disabled) { transform: scale(0.97); }
        .btn-interactive:disabled { opacity: 0.7; cursor: not-allowed; }

        @media print {
            body { background: white !important; color: black !important; }
            body::before { display: none; }
            .no-print { display: none !important; }
            .print-area { display: block !important; width: 100% !important; margin: 0 !important; padding: 0 !important; }
            .glass-panel { border: none !important; box-shadow: none !important; background: white !important; }
            .avoid-break { break-inside: avoid; }
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo, useRef, createContext, useContext } = React;
        const { BarChart, Bar, LineChart, Line, XAxis, YAxis, Tooltip, ResponsiveContainer, PieChart, Pie, Cell, Legend } = window.Recharts || {};

        const AppContext = createContext();

        const API_URL = "https://script.google.com/macros/s/AKfycbwviBRd_BbtvGyEpZSq5ab5A0iEpXkG9iMwAUQyGyZb-nDI2R5-x8GE5ZEI3gpmzA3zug/exec";
        const SHEET_ID = "1MoZpnDniVF5pKr0tEgmYwlPO3wZdA7DaO_MvZjbC-ec";
        
        const SHEET_CSV_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&sheet=Registration`;
        const ACTIVITY_SHEET_CSV_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&sheet=Activities`;
        const LOGS_SHEET_CSV_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&sheet=Logs`;
        
        const MAJOR_LIST = [
            "เทคโนโลยีดิจิทัลเพื่อธุรกิจ", "เทคโนโลยีดิจิทัลเพื่อธุรกิจ(เทียบโอน)",
            "เทคโนโลยีปัญญาประดิษฐ์", "เทคโนโลยีสารสนเทศ", "เทคโนโลยีสารสนเทศ(เทียบโอน)",
            "วิทยาการคอมพิวเตอร์", "กราฟิกดีไซน์เทคโนโลยีสื่อดิจิทัล",
            "กราฟิกดีไซน์สื่อศิลปะและการออกแบบ", "กราฟิกดีไซน์สื่อศิลปะและการออกแบบ(เทียบโอน)",
            "วิศวกรรมคอมพิวเตอร์"
        ];

        const cleanMajor = (str) => str ? str.replace(/\s*\([a-zA-Z\s]+\)/g, '').trim() : '';

        const submitToAPI = async (action, payload) => {
            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify({ action, payload })
                });
                return await response.json();
            } catch (err) {
                throw new Error("การเชื่อมต่อระบบล้มเหลว กรุณาลองใหม่อีกครั้ง");
            }
        };

        function Icon({ name, size = 20, className = '' }) {
            const containerRef = useRef(null);
            useEffect(() => {
                if (containerRef.current) {
                    containerRef.current.innerHTML = `<i data-lucide="${name}" class="${className}" style="width:${size}px; height:${size}px;"></i>`;
                    if (window.lucide) lucide.createIcons({ root: containerRef.current });
                }
            }, [name, size, className]);
            return <span ref={containerRef} className={`inline-flex items-center justify-center shrink-0 ${className}`} />;
        }

        function SectionHeader({ icon, title, colorClass }) {
            return (
                <div className="flex items-center gap-3 mb-6 pb-4 border-b border-slate-200/50 dark:border-white/5">
                    <div className={`p-3 rounded-2xl shadow-sm ${colorClass}`}><Icon name={icon} size={22}/></div>
                    <h3 className="text-xl md:text-2xl font-black text-slate-800 dark:text-white tracking-tight">{title}</h3>
                </div>
            );
        }

        function InputField({ label, type="text", value, onChange, placeholder, maxLength, required, numeric }) {
            return (
                <div className="flex flex-col gap-1.5 w-full">
                    <label className="text-xs font-bold text-slate-600 dark:text-slate-400 uppercase tracking-widest">{label} {required && <span className="text-red-500">*</span>}</label>
                    <input 
                        type={type} value={value} onChange={e => {
                            let val = e.target.value;
                            if (numeric) val = val.replace(/\D/g, '');
                            onChange(val);
                        }} 
                        placeholder={placeholder} maxLength={maxLength} required={required}
                        className={`w-full input-modern rounded-xl px-4 py-3.5 text-sm font-semibold shadow-sm ${numeric ? 'font-mono' : ''}`}
                    />
                </div>
            );
        }

        function TogglePill({ options, value, onChange, isWarningType }) {
            return (
                <div className="flex flex-wrap gap-3">
                    {options.map(opt => {
                        const isActive = value === opt.value;
                        const isAlert = isWarningType && opt.value !== 'ไม่มี' && opt.value !== 'ไม่แพ้';
                        return (
                            <button key={opt.value} type="button" onClick={() => onChange(opt.value)}
                                className={`flex-1 min-w-[100px] py-3.5 px-4 rounded-xl font-bold transition-all duration-300 border flex items-center justify-center gap-2 text-sm btn-interactive shadow-sm
                                    ${isActive ? (isAlert ? 'border-red-500 bg-red-500 text-white shadow-glow-red' : 'border-brand bg-brand text-white shadow-glow-brand')
                                               : 'border-slate-200 dark:border-white/10 bg-white/50 dark:bg-black/20 text-slate-500 hover:bg-white dark:hover:bg-white/10 hover:border-slate-300 dark:hover:border-white/20 hover:text-slate-700 dark:hover:text-slate-200'}`}
                            >
                                {isActive && <Icon name={isAlert ? "alert-triangle" : "check-circle"} size={16} />}
                                {opt.label}
                            </button>
                        )
                    })}
                </div>
            );
        }

        // ==========================================
        // 🏠 Home View 
        // ==========================================
        function HomeView({ onSelectNewStudent, onSelectActivity, onAdminClick }) {
            return (
                <div className="flex flex-col items-center justify-center min-h-[85vh] animate-fade-in relative">
                    <button onClick={onAdminClick} className="absolute top-0 right-0 p-3.5 text-slate-400 hover:text-brand bg-white/50 dark:bg-black/20 hover:bg-white dark:hover:bg-white/10 backdrop-blur-md transition-all z-20 rounded-full shadow-sm border border-slate-200/50 dark:border-white/5 btn-interactive" title="เข้าสู่ระบบผู้ดูแล">
                        <Icon name="unlock" size={20} />
                    </button>

                    <div className="text-center mb-10 md:mb-12 mt-10">
                        <div className="inline-flex items-center justify-center p-5 bg-brand/10 text-brand rounded-[2rem] shadow-glow-brand mb-6 transform hover:scale-110 transition-transform duration-500">
                            <Icon name="box" size={56} />
                        </div>
                        <h1 className="text-5xl md:text-6xl font-black text-slate-800 dark:text-white tracking-tight mb-4">DIGIT<span className="brand-text-gradient">.69</span></h1>
                        <p className="text-slate-500 dark:text-slate-400 font-bold text-sm md:text-base uppercase tracking-widest">Student Service Portal</p>
                    </div>

                    <div className="grid grid-cols-1 md:grid-cols-2 gap-6 w-full max-w-4xl px-2">
                        <div onClick={onSelectNewStudent} className="glass-panel p-8 md:p-10 rounded-[2.5rem] border-t-[8px] border-t-brand shadow-soft hover:shadow-[0_20px_40px_-10px_rgba(255,102,0,0.2)] hover:-translate-y-2 transition-all duration-300 cursor-pointer group flex flex-col items-center text-center relative overflow-hidden">
                            <div className="absolute -right-10 -top-10 opacity-5 text-brand group-hover:scale-125 transition-transform duration-500 pointer-events-none"><Icon name="user-plus" size={150}/></div>
                            <div className="w-20 h-20 bg-brand/10 text-brand rounded-[1.5rem] flex items-center justify-center mb-6 group-hover:scale-110 transition-transform shadow-inner relative z-10"><Icon name="user-plus" size={40} /></div>
                            <h3 className="text-xl md:text-2xl font-black text-slate-800 dark:text-white mb-4 relative z-10">1. ขึ้นทะเบียนนักศึกษาใหม่</h3>
                            <p className="text-slate-500 dark:text-slate-400 font-medium relative z-10 text-sm">บันทึกประวัติส่วนตัว ข้อมูลสุขภาพ และโภชนาการสำหรับนักศึกษาใหม่</p>
                            <div className="mt-8 px-6 py-3 bg-slate-100 dark:bg-white/5 rounded-xl font-bold text-slate-600 dark:text-slate-300 group-hover:bg-brand group-hover:text-white transition-colors flex items-center gap-2 relative z-10">
                                เริ่มต้นใช้งาน <Icon name="arrow-right" size={16}/>
                            </div>
                        </div>

                        <div onClick={onSelectActivity} className="glass-panel p-8 md:p-10 rounded-[2.5rem] border-t-[8px] border-t-purple-500 shadow-soft hover:shadow-[0_20px_40px_-10px_rgba(168,85,247,0.2)] hover:-translate-y-2 transition-all duration-300 cursor-pointer group flex flex-col items-center text-center relative overflow-hidden">
                            <div className="absolute -right-10 -top-10 opacity-5 text-purple-500 group-hover:scale-125 transition-transform duration-500 pointer-events-none"><Icon name="calendar-check" size={150}/></div>
                            <div className="w-20 h-20 bg-purple-50 dark:bg-purple-500/10 text-purple-600 rounded-[1.5rem] flex items-center justify-center mb-6 group-hover:scale-110 transition-transform shadow-inner relative z-10"><Icon name="calendar-check" size={40} /></div>
                            <h3 className="text-xl md:text-2xl font-black text-slate-800 dark:text-white mb-4 relative z-10">2. ลงทะเบียนเข้าร่วมกิจกรรม</h3>
                            <p className="text-slate-500 dark:text-slate-400 font-medium relative z-10 text-sm">ระบบลงทะเบียนและเช็คชื่อเข้าร่วมกิจกรรมต่างๆ ของคณะ</p>
                            <div className="mt-8 px-6 py-3 bg-slate-100 dark:bg-white/5 rounded-xl font-bold text-slate-600 dark:text-slate-300 group-hover:bg-purple-500 group-hover:text-white transition-colors flex items-center gap-2 relative z-10">
                                เริ่มต้นใช้งาน <Icon name="arrow-right" size={16}/>
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        // ==========================================
        // 🛡️ PDPA Modal
        // ==========================================
        function PdpaModal({ onAccept, onBack }) {
            const [isChecked, setIsChecked] = useState(false);

            const handleDecline = () => Swal.fire({ 
                icon: 'warning', title: 'ไม่ยินยอม', text: 'คณะเทคโนโลยีดิจิทัล ให้ความสำคัญอย่างยิ่งกับการคุ้มครองข้อมูลส่วนบุคคลของท่าน', confirmButtonText: 'ตกลง', confirmButtonColor: '#ff6600',
                customClass: { popup: 'rounded-[2rem] bg-white dark:bg-zinc-900 text-slate-800 dark:text-white' } 
            });

            return (
                <div className="fixed inset-0 z-[100] flex items-end sm:items-center justify-center sm:p-6 bg-slate-900/80 dark:bg-black/90 backdrop-blur-sm animate-fade-in">
                    <div className="bg-white dark:bg-zinc-900 w-full sm:max-w-3xl relative flex flex-col h-[92vh] sm:h-auto sm:max-h-[90vh] rounded-t-[2rem] sm:rounded-[2.5rem] shadow-[0_-10px_40px_rgba(0,0,0,0.2)] sm:shadow-[0_20px_60px_rgba(0,0,0,0.3)] animate-slide-up overflow-hidden">
                        <div className="absolute top-0 left-0 right-0 h-1.5 sm:h-2 brand-gradient z-20"></div>
                        <div className="absolute top-3 left-1/2 -translate-x-1/2 w-12 h-1.5 bg-slate-300 dark:bg-slate-600 rounded-full sm:hidden z-20"></div>

                        <button onClick={onBack} className="absolute top-4 sm:top-5 right-4 sm:right-5 p-2.5 sm:p-3 text-slate-400 hover:text-brand bg-slate-50/50 dark:bg-black/20 hover:bg-slate-100 dark:hover:bg-white/10 backdrop-blur-md transition-all z-20 rounded-full shadow-sm hover:shadow-md border border-slate-200/50 dark:border-white/5 btn-interactive">
                            <Icon name="x" size={16} />
                        </button>
                        
                        <div className="p-5 sm:p-8 pt-8 sm:pt-8 pb-4 sm:pb-5 bg-white dark:bg-zinc-900 border-b border-slate-100 dark:border-white/5 flex items-start gap-4 relative overflow-hidden shrink-0">
                            <div className="absolute -right-8 -top-8 opacity-[0.03] text-brand transform rotate-12 pointer-events-none"><Icon name="shield-check" size={120}/></div>
                            <div className="p-3 bg-brand/10 dark:bg-brand/20 rounded-2xl shrink-0 shadow-inner relative z-10 hidden sm:block"><Icon name="shield-check" size={32} className="text-brand" /></div>
                            <div className="relative z-10 w-full pr-8 sm:pr-0">
                                <div className="inline-flex items-center gap-1.5 px-2.5 py-1 bg-slate-100 dark:bg-white/10 text-slate-600 dark:text-slate-300 text-[10px] font-black tracking-widest uppercase rounded-lg mb-1.5 shadow-sm"><Icon name="shield" size={10} className="text-brand sm:hidden" /> Privacy Policy</div>
                                <h2 className="text-xl sm:text-3xl font-black text-slate-800 dark:text-white leading-tight">นโยบายความยินยอม (PDPA)</h2>
                                <p className="text-brand dark:text-brandLight text-xs sm:text-sm mt-1 font-semibold">เพื่อสิทธิประโยชน์ ความปลอดภัย และการดูแลอย่างใกล้ชิด</p>
                            </div>
                        </div>
                        
                        <div className="p-5 sm:p-8 overflow-y-auto custom-scrollbar flex-1 bg-slate-50/50 dark:bg-black/20">
                            <p className="text-slate-600 dark:text-slate-300 text-sm mb-5 leading-relaxed">คณะเทคโนโลยีดิจิทัล ให้ความสำคัญอย่างยิ่งกับการคุ้มครองข้อมูลส่วนบุคคลของท่าน ตามพระราชบัญญัติคุ้มครองข้อมูลส่วนบุคคล พ.ศ. 2562 เรามีความจำเป็นต้องจัดเก็บและประมวลผลข้อมูลของท่านเพื่อใช้ในกิจกรรม ดังรายละเอียดต่อไปนี้:</p>
                            <div className="grid grid-cols-1 sm:grid-cols-3 gap-3 sm:gap-4 mb-5 sm:mb-6">
                                <div className="bg-white dark:bg-zinc-800/80 p-4 sm:p-5 rounded-2xl border border-slate-200/60 dark:border-white/5 shadow-sm hover:shadow-md transition-all flex flex-row sm:flex-col items-center sm:items-start gap-4 sm:gap-0 text-left">
                                    <div className="w-10 h-10 sm:mb-3 bg-blue-50 dark:bg-blue-500/10 text-blue-600 rounded-xl flex items-center justify-center shrink-0"><Icon name="user" size={18}/></div>
                                    <div><h4 className="font-bold text-slate-800 dark:text-white text-sm sm:mb-1">ข้อมูลส่วนตัวเบื้องต้น</h4><p className="text-[11px] sm:text-xs text-slate-500 dark:text-slate-400 leading-snug">ชื่อ, รหัส นศ., สาขา, เบอร์โทร เพื่อใช้ตรวจสอบสิทธิ์และประสานงาน</p></div>
                                </div>
                                <div className="bg-white dark:bg-zinc-800/80 p-4 sm:p-5 rounded-2xl border border-slate-200/60 dark:border-white/5 shadow-sm hover:shadow-md transition-all flex flex-row sm:flex-col items-center sm:items-start gap-4 sm:gap-0 text-left">
                                    <div className="w-10 h-10 sm:mb-3 bg-orange-50 dark:bg-orange-500/10 text-orange-600 rounded-xl flex items-center justify-center shrink-0"><Icon name="pizza" size={18}/></div>
                                    <div><h4 className="font-bold text-slate-800 dark:text-white text-sm sm:mb-1">ข้อมูลด้านโภชนาการ</h4><p className="text-[11px] sm:text-xs text-slate-500 dark:text-slate-400 leading-snug">ประวัติแพ้อาหาร, อาหารเฉพาะทาง เพื่อจัดเตรียมมื้ออาหารที่ปลอดภัย</p></div>
                                </div>
                                <div className="bg-white dark:bg-zinc-800/80 p-4 sm:p-5 rounded-2xl border border-slate-200/60 dark:border-white/5 shadow-sm hover:shadow-md transition-all flex flex-row sm:flex-col items-center sm:items-start gap-4 sm:gap-0 text-left">
                                    <div className="w-10 h-10 sm:mb-3 bg-red-50 dark:bg-red-500/10 text-red-600 rounded-xl flex items-center justify-center shrink-0"><Icon name="heart-pulse" size={18}/></div>
                                    <div><h4 className="font-bold text-slate-800 dark:text-white text-sm sm:mb-1">ข้อมูลสุขภาพ/การแพทย์</h4><p className="text-[11px] sm:text-xs text-slate-500 dark:text-slate-400 leading-snug">โรคประจำตัว, ประวัติการแพ้ยา เพื่อวางแผนปฐมพยาบาลในกรณีฉุกเฉิน</p></div>
                                </div>
                            </div>
                            <div className="bg-blue-50/80 dark:bg-blue-900/20 border border-blue-100 dark:border-blue-800/30 p-4 rounded-2xl flex items-start gap-3 shadow-sm">
                                <Icon name="shield-alert" className="text-blue-500 mt-0.5 shrink-0" size={16}/>
                                <div className="text-[11px] sm:text-xs text-blue-800 dark:text-blue-300 leading-relaxed"><span className="font-bold text-blue-900 dark:text-blue-200">การรักษาความปลอดภัย:</span> ข้อมูลทั้งหมดจะถูกเก็บรักษาเป็นความลับอย่างสูงสุด เข้าถึงได้เฉพาะทีมงานที่เกี่ยวข้อง และจะถูกทำลายทิ้งเมื่อเสร็จสิ้นโครงการ</div>
                            </div>
                        </div>
                        <div className="p-5 sm:p-8 border-t border-slate-100 dark:border-white/5 bg-white dark:bg-zinc-900 shrink-0 pb-6 sm:pb-8">
                            <label className="flex items-start sm:items-center gap-3 cursor-pointer group mb-5 w-full bg-slate-50 dark:bg-white/5 p-4 rounded-xl border border-slate-200 dark:border-white/10 hover:border-brand/50 transition-colors shadow-sm">
                                <input type="checkbox" checked={isChecked} onChange={e => setIsChecked(e.target.checked)} className="hidden" />
                                <div className={`w-5 h-5 sm:w-6 sm:h-6 rounded-md border-2 flex items-center justify-center transition-all shrink-0 mt-0.5 sm:mt-0 ${isChecked ? 'bg-brand border-brand shadow-sm' : 'border-slate-300 dark:border-slate-600 group-hover:border-brand'}`}>
                                    {isChecked && <Icon name="check" size={14} className="text-white"/>}
                                </div>
                                <span className="text-xs sm:text-sm font-bold text-slate-700 dark:text-slate-300 select-none leading-snug">ฉันได้อ่านและยินยอมให้ประมวลผลข้อมูลส่วนบุคคลดังกล่าว</span>
                            </label>

                            <div className="flex flex-col sm:flex-row justify-end gap-3">
                                <button onClick={handleDecline} className="w-full sm:w-auto px-6 py-3.5 sm:py-3.5 rounded-xl bg-slate-100 dark:bg-white/5 text-slate-600 dark:text-slate-400 font-bold hover:bg-slate-200 dark:hover:bg-white/10 transition-colors btn-interactive text-sm">ไม่ยินยอม</button>
                                <button onClick={() => isChecked ? onAccept() : null} disabled={!isChecked} className={`w-full sm:w-auto px-8 py-3.5 sm:py-3.5 rounded-xl font-bold flex items-center justify-center gap-2 transition-all duration-300 btn-interactive text-sm ${isChecked ? 'brand-gradient text-white shadow-glow-brand hover:shadow-lg transform hover:-translate-y-0.5' : 'bg-slate-200 dark:bg-white/5 text-slate-400 dark:text-slate-600 border border-slate-300 dark:border-white/10 cursor-not-allowed'}`}>
                                    <Icon name="check-circle" size={16} /> ยินยอมและขึ้นทะเบียน
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        // ==========================================
        // 📝 Registration Form
        // ==========================================
        function RegistrationForm({ onBack, onSuccess }) {
            const [formData, setFormData] = useState({ FullName: '', StudentID: '', IDCard: '', Major: '', Religion: '', BloodGroup: '', StudentPhone: '', ParentPhone: '', FoodAllergy: '', SpecificDiet: 'ไม่มี', Disease: '', DrugAllergy: '' });
            const [hasFoodAllergy, setHasFoodAllergy] = useState(false);
            const [hasDisease, setHasDisease] = useState(false);
            const [hasDrugAllergy, setHasDrugAllergy] = useState(false);
            const [isSubmitting, setIsSubmitting] = useState(false);

            const handleSubmit = async (e) => {
                e.preventDefault();
                if (!formData.FullName || !formData.StudentID || !formData.Major || !formData.Religion || !formData.BloodGroup || !formData.StudentPhone || !formData.ParentPhone) { Swal.fire({ icon: 'warning', title: 'แจ้งเตือน', text: 'กรุณากรอกข้อมูลที่จำเป็นให้ครบถ้วน', customClass:{popup:'rounded-[2rem] bg-white dark:bg-zinc-900 text-slate-800 dark:text-white'} }); return; }
                if (formData.StudentID.length !== 9) { Swal.fire({ icon: 'warning', title: 'แจ้งเตือน', text: 'รหัสนักศึกษาต้องมี 9 หลัก', customClass:{popup:'rounded-[2rem] bg-white dark:bg-zinc-900 text-slate-800 dark:text-white'} }); return; }
                if (formData.StudentPhone.length !== 10 || formData.ParentPhone.length !== 10) { Swal.fire({ icon: 'warning', title: 'แจ้งเตือน', text: 'เบอร์โทรศัพท์ต้องมี 10 หลัก', customClass:{popup:'rounded-[2rem] bg-white dark:bg-zinc-900 text-slate-800 dark:text-white'} }); return; }
                
                const finalData = {
                    ...formData,
                    FoodAllergy: hasFoodAllergy ? formData.FoodAllergy : 'ไม่แพ้',
                    Disease: hasDisease ? formData.Disease : 'ไม่มี',
                    DrugAllergy: hasDrugAllergy ? formData.DrugAllergy : 'ไม่แพ้'
                };

                setIsSubmitting(true);
                Swal.fire({ title: 'กำลังบันทึก...', allowOutsideClick: false, didOpen: () => Swal.showLoading(), customClass:{popup:'rounded-[2rem] bg-white dark:bg-zinc-900 text-slate-800 dark:text-white'} });

                try {
                    const res = await submitToAPI('register', finalData);
                    if (res.success) { Swal.close(); onSuccess(); } 
                    else { throw new Error(res.message); }
                } catch (err) {
                    Swal.fire({ icon: 'error', title: 'เกิดข้อผิดพลาด', text: err.message, customClass:{popup:'rounded-[2rem] bg-white dark:bg-zinc-900 text-slate-800 dark:text-white'} });
                } finally { setIsSubmitting(false); }
            };

            return (
                <div className="max-w-4xl mx-auto animate-fade-in pb-10">
                    <button onClick={onBack} className="flex items-center gap-2 text-slate-500 hover:text-brand font-bold text-sm mb-6 transition-colors px-2 btn-interactive"><Icon name="arrow-left" size={16} /> ย้อนกลับ</button>

                    <form onSubmit={handleSubmit} className="space-y-6 md:space-y-8">
                        <div className="glass-panel p-6 md:p-8 rounded-[2.5rem] border border-slate-200/50 dark:border-white/5 shadow-soft">
                            <SectionHeader icon="user" title="ข้อมูลส่วนตัวนักศึกษา" colorClass="bg-blue-100 dark:bg-blue-500/20 text-blue-600" />
                            <div className="grid grid-cols-1 md:grid-cols-2 gap-5">
                                <InputField label="ชื่อ-นามสกุล (ระบุคำนำหน้า)" value={formData.FullName} onChange={v => setFormData({...formData, FullName: v})} placeholder="เช่น นายสมมติ ทดสอบ" required />
                                <div className="flex flex-col gap-1.5">
                                    <label className="text-xs font-bold text-slate-600 dark:text-slate-400 uppercase tracking-widest">สาขาวิชา <span className="text-red-500">*</span></label>
                                    <div className="relative">
                                        <select value={formData.Major} onChange={e => setFormData({...formData, Major: e.target.value})} required className="w-full appearance-none input-modern rounded-xl pl-4 pr-10 py-3.5 text-sm font-semibold shadow-sm cursor-pointer bg-white/80 dark:bg-black/40">
                                            <option value="">-- โปรดเลือก --</option>
                                            {MAJOR_LIST.map(m => <option key={m} value={m}>{m}</option>)}
                                        </select>
                                        <div className="absolute right-4 top-1/2 -translate-y-1/2 text-slate-400 pointer-events-none"><Icon name="chevron-down" size={16}/></div>
                                    </div>
                                </div>
                                <InputField label="รหัสนักศึกษา (9 หลัก)" value={formData.StudentID} onChange={v => setFormData({...formData, StudentID: v})} placeholder="67xxxxxxx" numeric required maxLength="9" />
                                <InputField label="รหัสประจำตัวประชาชน / Passport" value={formData.IDCard} onChange={v => setFormData({...formData, IDCard: v})} placeholder="13 หลัก" maxLength="20" />
                                <div className="flex flex-col gap-1.5">
                                    <label className="text-xs font-bold text-slate-600 dark:text-slate-400 uppercase tracking-widest">ศาสนา <span className="text-red-500">*</span></label>
                                    <div className="relative">
                                        <select value={formData.Religion} onChange={e => setFormData({...formData, Religion: e.target.value})} required className="w-full appearance-none input-modern rounded-xl pl-4 pr-10 py-3.5 text-sm font-semibold shadow-sm cursor-pointer bg-white/80 dark:bg-black/40">
                                            <option value="">-- โปรดเลือก --</option>
                                            {['พุทธ', 'อิสลาม', 'คริสต์', 'อื่นๆ'].map(r => <option key={r} value={r}>{r}</option>)}
                                        </select>
                                        <div className="absolute right-4 top-1/2 -translate-y-1/2 text-slate-400 pointer-events-none"><Icon name="chevron-down" size={16}/></div>
                                    </div>
                                </div>
                                <div className="flex flex-col gap-1.5">
                                    <label className="text-xs font-bold text-slate-600 dark:text-slate-400 uppercase tracking-widest">กรุ๊ปเลือด <span className="text-red-500">*</span></label>
                                    <div className="relative">
                                        <select value={formData.BloodGroup} onChange={e => setFormData({...formData, BloodGroup: e.target.value})} required className="w-full appearance-none input-modern rounded-xl pl-4 pr-10 py-3.5 text-sm font-semibold shadow-sm cursor-pointer bg-white/80 dark:bg-black/40">
                                            <option value="">-- โปรดเลือก --</option>
                                            <option value="A">A</option><option value="B">B</option><option value="O">O</option><option value="AB">AB</option>
                                        </select>
                                        <div className="absolute right-4 top-1/2 -translate-y-1/2 text-slate-400 pointer-events-none"><Icon name="chevron-down" size={16}/></div>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div className="glass-panel p-6 md:p-8 rounded-[2.5rem] border-t-[8px] border-t-emerald-500 border border-slate-200/50 dark:border-white/5 shadow-soft">
                            <SectionHeader icon="phone" title="ข้อมูลการติดต่อ" colorClass="bg-emerald-100 dark:bg-emerald-500/20 text-emerald-600" />
                            <div className="grid grid-cols-1 md:grid-cols-2 gap-5">
                                <InputField label="เบอร์โทรศัพท์นักศึกษา" value={formData.StudentPhone} onChange={v => setFormData({...formData, StudentPhone: v})} placeholder="08xxxxxxxx" numeric required maxLength="10" />
                                <InputField label="เบอร์โทรศัพท์ผู้ปกครอง (ฉุกเฉิน)" value={formData.ParentPhone} onChange={v => setFormData({...formData, ParentPhone: v})} placeholder="08xxxxxxxx" numeric required maxLength="10" />
                            </div>
                        </div>

                        <div className="glass-panel p-6 md:p-8 rounded-[2.5rem] border-t-[8px] border-t-orange-500 border border-slate-200/50 dark:border-white/5 shadow-soft">
                            <SectionHeader icon="pizza" title="ข้อมูลโภชนาการ" colorClass="bg-orange-100 dark:bg-orange-500/20 text-orange-600" />
                            <div className="space-y-6">
                                <div>
                                    <label className="text-sm font-bold text-slate-700 dark:text-slate-300 mb-3 block">1. อาหารเฉพาะทาง (เลือก 1 ข้อ) <span className="text-red-500">*</span></label>
                                    <TogglePill options={[{label: 'ไม่มี', value: 'ไม่มี'}, {label: 'ฮาลาล', value: 'ฮาลาล'}, {label: 'มังสวิรัติ', value: 'มังสวิรัติ'}, {label: 'เจ', value: 'เจ'}]} value={formData.SpecificDiet} onChange={v => setFormData({...formData, SpecificDiet: v})} isWarningType={true} />
                                </div>
                                <div className="p-5 bg-orange-50 dark:bg-orange-950/20 border border-orange-100 dark:border-orange-900/30 rounded-2xl">
                                    <label className="text-sm font-bold text-slate-700 dark:text-slate-300 mb-3 block">2. ประวัติการแพ้อาหาร <span className="text-red-500">*</span></label>
                                    <div className="flex gap-4 mb-4">
                                        <label className="flex items-center gap-2 cursor-pointer text-sm font-semibold"><input type="radio" name="foodAllergy" checked={!hasFoodAllergy} onChange={() => setHasFoodAllergy(false)} className="w-4 h-4 text-brand accent-brand" /> ไม่แพ้</label>
                                        <label className="flex items-center gap-2 cursor-pointer text-sm font-semibold text-orange-600 dark:text-orange-400"><input type="radio" name="foodAllergy" checked={hasFoodAllergy} onChange={() => setHasFoodAllergy(true)} className="w-4 h-4 text-brand accent-brand" /> มีประวัติแพ้อาหาร</label>
                                    </div>
                                    {hasFoodAllergy && <div className="animate-slide-up"><InputField label="โปรดระบุอาหารที่แพ้ หรือ อาการ" value={formData.FoodAllergy} onChange={v => setFormData({...formData, FoodAllergy: v})} placeholder="เช่น อาหารทะเล, ถั่วลิสง" required={hasFoodAllergy} /></div>}
                                </div>
                            </div>
                        </div>

                        <div className="glass-panel p-6 md:p-8 rounded-[2.5rem] border-t-[8px] border-t-red-500 border border-slate-200/50 dark:border-white/5 shadow-soft">
                            <SectionHeader icon="heart-pulse" title="ข้อมูลสุขภาพทางการแพทย์" colorClass="bg-red-100 dark:bg-red-500/20 text-red-600" />
                            <div className="space-y-6">
                                <div className="p-5 bg-red-50/50 dark:bg-red-950/20 border border-red-100 dark:border-red-900/30 rounded-2xl">
                                    <label className="text-sm font-bold text-slate-700 dark:text-slate-300 mb-3 block">1. โรคประจำตัว <span className="text-red-500">*</span></label>
                                    <div className="flex gap-4 mb-4">
                                        <label className="flex items-center gap-2 cursor-pointer text-sm font-semibold"><input type="radio" name="disease" checked={!hasDisease} onChange={() => setHasDisease(false)} className="w-4 h-4 accent-red-500" /> ไม่มี</label>
                                        <label className="flex items-center gap-2 cursor-pointer text-sm font-semibold text-red-600 dark:text-red-400"><input type="radio" name="disease" checked={hasDisease} onChange={() => setHasDisease(true)} className="w-4 h-4 accent-red-500" /> มีโรคประจำตัว</label>
                                    </div>
                                    {hasDisease && <div className="animate-slide-up"><InputField label="โปรดระบุโรคประจำตัว" value={formData.Disease} onChange={v => setFormData({...formData, Disease: v})} placeholder="เช่น หอบหืด, ภูมิแพ้" required={hasDisease} /></div>}
                                </div>
                                <div className="p-5 bg-pink-50/50 dark:bg-pink-950/20 border border-pink-100 dark:border-pink-900/30 rounded-2xl">
                                    <label className="text-sm font-bold text-slate-700 dark:text-slate-300 mb-3 block">2. ประวัติการแพ้ยา <span className="text-red-500">*</span></label>
                                    <div className="flex gap-4 mb-4">
                                        <label className="flex items-center gap-2 cursor-pointer text-sm font-semibold"><input type="radio" name="drugAllergy" checked={!hasDrugAllergy} onChange={() => setHasDrugAllergy(false)} className="w-4 h-4 accent-pink-500" /> ไม่เคยแพ้ยา</label>
                                        <label className="flex items-center gap-2 cursor-pointer text-sm font-semibold text-pink-600 dark:text-pink-400"><input type="radio" name="drugAllergy" checked={hasDrugAllergy} onChange={() => setHasDrugAllergy(true)} className="w-4 h-4 accent-pink-500" /> มีประวัติแพ้ยา</label>
                                    </div>
                                    {hasDrugAllergy && <div className="animate-slide-up"><InputField label="โปรดระบุยาที่แพ้ หรือ อาการ" value={formData.DrugAllergy} onChange={v => setFormData({...formData, DrugAllergy: v})} placeholder="เช่น ยาเพนิซิลลิน" required={hasDrugAllergy} /></div>}
                                </div>
                            </div>
                        </div>

                        <div className="pt-4 flex justify-center">
                            <button type="submit" disabled={isSubmitting} className="w-full md:w-auto min-w-[280px] py-4 px-8 brand-gradient text-white rounded-2xl font-black text-lg shadow-glow-brand hover:shadow-lg transform hover:-translate-y-1 transition-all btn-interactive flex items-center justify-center gap-2">
                                {isSubmitting ? <Icon name="loader-2" className="animate-spin" /> : <Icon name="save" />} บันทึกข้อมูล
                            </button>
                        </div>
                    </form>
                </div>
            );
        }

        // ==========================================
        // 🎫 Activity Form 
        // ==========================================
        function ActivityForm({ onBack, onSuccess }) {
            const [step, setStep] = useState(1);
            const [searchID, setSearchID] = useState('');
            const [formData, setFormData] = useState({ ActivityName: '', StudentID: '', FullName: '', Major: '', StudentPhone: '', IDCard: '' });
            const [isSearching, setIsSearching] = useState(false);
            const [isSubmitting, setIsSubmitting] = useState(false);
            const [availableActivities, setAvailableActivities] = useState([]);

            useEffect(() => {
                Papa.parse(`${ACTIVITY_SHEET_CSV_URL}&_cb=${new Date().getTime()}`, {
                    download: true, header: true,
                    complete: (res) => {
                        const defs = res.data.filter(r => r.ActivityName && r.Status !== 'CLOSED').map(r => r.ActivityName);
                        setAvailableActivities(defs);
                    }
                });
            }, []);

            const handleSearch = (e) => {
                e.preventDefault();
                if (!searchID.trim()) { Swal.fire({ icon: 'warning', title: 'แจ้งเตือน', text: 'กรุณากรอกรหัสนักศึกษา หรือ รหัสประจำตัวประชาชน', customClass:{popup:'rounded-[2rem] bg-white dark:bg-zinc-900 text-slate-800 dark:text-white'} }); return; }

                setIsSearching(true);
                Papa.parse(`${SHEET_CSV_URL}&_cb=${new Date().getTime()}`, {
                    download: true, header: true,
                    complete: (res) => {
                        const validStudents = res.data.filter(r => r.FullName !== 'SYSTEM_ACTIVITY_DEF' && r.BloodGroup !== 'Activity');
                        const searchTerm = searchID.trim().toLowerCase();
                        const found = validStudents.find(row => (row.IDCard && row.IDCard.toString().trim().toLowerCase() === searchTerm) || (row.StudentID && row.StudentID.toString().trim().toLowerCase() === searchTerm));
                        
                        if (found) {
                            setFormData({ ActivityName: '', StudentID: found.StudentID || '', FullName: found.FullName || '', Major: cleanMajor(found.Major) || '', StudentPhone: found.StudentPhone || '', IDCard: found.IDCard || '' });
                            setStep(2); 
                        } else {
                            Swal.fire({ icon: 'error', title: 'ไม่พบข้อมูล', text: 'ไม่พบข้อมูลนักศึกษาที่ตรงกับรหัสที่คุณกรอก กรุณาตรวจสอบอีกครั้ง หรือไปที่เมนู "1. ขึ้นทะเบียนนักศึกษาใหม่" ก่อนครับ', customClass:{popup:'rounded-[2rem] bg-white dark:bg-zinc-900 text-slate-800 dark:text-white'} });
                        }
                        setIsSearching(false);
                    },
                    error: () => { Swal.fire({ icon: 'error', title: 'Error', text: 'การเชื่อมต่อฐานข้อมูลล้มเหลว', customClass:{popup:'rounded-[2rem] bg-white dark:bg-zinc-900 text-slate-800 dark:text-white'} }); setIsSearching(false); }
                });
            };

            const handleSubmit = async (e) => {
                e.preventDefault();
                if (!formData.ActivityName.trim()) { Swal.fire({ icon: 'warning', title: 'แจ้งเตือน', text: 'กรุณาระบุชื่อกิจกรรมที่เข้าร่วม', customClass:{popup:'rounded-[2rem] bg-white dark:bg-zinc-900 text-slate-800 dark:text-white'} }); return; }

                setIsSubmitting(true);
                Swal.fire({ title: 'กำลังบันทึก...', allowOutsideClick: false, didOpen: () => Swal.showLoading(), customClass:{popup:'rounded-[2rem] bg-white dark:bg-zinc-900 text-slate-800 dark:text-white'} });

                try {
                    const payload = { StudentID: formData.StudentID, FullName: formData.FullName, Major: formData.Major, IDCard: formData.IDCard, StudentPhone: formData.StudentPhone, ActivityName: formData.ActivityName };
                    const res = await submitToAPI('log_activity', payload); 
                    if (res.success) { Swal.close(); onSuccess(); } 
                    else { throw new Error(res.message); }
                } catch (err) {
                    Swal.fire({ icon: 'error', title: 'Error', text: err.message, customClass:{popup:'rounded-[2rem] bg-white dark:bg-zinc-900 text-slate-800 dark:text-white'} });
                } finally { setIsSubmitting(false); }
            };

            return (
                <div className="max-w-3xl mx-auto animate-fade-in pb-10">
                    <button onClick={step === 1 ? onBack : () => setStep(1)} className="flex items-center gap-2 text-slate-500 hover:text-purple-600 font-bold text-sm mb-6 transition-colors px-2 btn-interactive">
                        <Icon name="arrow-left" size={16} /> {step === 1 ? 'ย้อนกลับ' : 'ค้นหาใหม่'}
                    </button>

                    {step === 1 && (
                        <form onSubmit={handleSearch} className="space-y-6">
                            <div className="glass-panel p-6 md:p-10 rounded-[2.5rem] border-t-[8px] border-t-purple-500 border border-slate-200/50 dark:border-white/5 shadow-soft text-center">
                                <div className="w-20 h-20 bg-purple-100 dark:bg-purple-500/20 text-purple-600 rounded-full flex items-center justify-center mx-auto mb-6 shadow-inner"><Icon name="search" size={40} /></div>
                                <h2 className="text-2xl font-black text-slate-800 dark:text-white mb-2">ค้นหาข้อมูลนักศึกษา</h2>
                                <p className="text-slate-500 dark:text-slate-400 mb-8 font-medium">กรุณากรอกรหัสนักศึกษา, บัตร ปชช. หรือ Passport เพื่อดึงข้อมูล</p>
                                
                                <div className="max-w-md mx-auto">
                                    <input type="text" value={searchID} onChange={e => setSearchID(e.target.value)} placeholder="รหัสนักศึกษา / เลขบัตร ปชช. / Passport" className="w-full input-modern rounded-xl px-4 py-4 text-center font-mono text-lg font-bold shadow-sm mb-6 placeholder-slate-400" maxLength="20" required />
                                    <button type="submit" disabled={isSearching} className="w-full py-4 bg-gradient-to-r from-purple-500 to-indigo-600 text-white rounded-xl font-black text-lg shadow-[0_0_20px_rgba(168,85,247,0.3)] hover:shadow-[0_0_30px_rgba(168,85,247,0.5)] transform hover:-translate-y-1 transition-all btn-interactive flex items-center justify-center gap-2">
                                        {isSearching ? <Icon name="loader-2" className="animate-spin" /> : <Icon name="search" />} ค้นหาข้อมูล
                                    </button>
                                </div>
                            </div>
                        </form>
                    )}

                    {step === 2 && (
                        <form onSubmit={handleSubmit} className="space-y-6 animate-fade-in">
                            <div className="glass-panel p-6 md:p-8 rounded-[2.5rem] border-t-[8px] border-t-purple-500 border border-slate-200/50 dark:border-white/5 shadow-soft">
                                <SectionHeader icon="user-check" title="ยืนยันข้อมูลนักศึกษา" colorClass="bg-purple-100 dark:bg-purple-500/20 text-purple-600" />
                                
                                <div className="bg-slate-50 dark:bg-white/5 p-6 rounded-2xl border border-slate-200 dark:border-white/10 mb-8 flex flex-col sm:flex-row gap-6 items-center sm:items-start shadow-inner">
                                    <div className="w-20 h-20 bg-slate-200 dark:bg-black/30 rounded-full flex items-center justify-center text-slate-400 shrink-0 border border-slate-300 dark:border-white/10 shadow-sm"><Icon name="user" size={40}/></div>
                                    <div className="flex-1 text-center sm:text-left">
                                        <h3 className="text-xl font-black text-slate-800 dark:text-white mb-1">{formData.FullName}</h3>
                                        <p className="text-brand font-bold mb-3 tracking-wider">รหัสนักศึกษา: {formData.StudentID}</p>
                                        <div className="flex flex-wrap gap-2 justify-center sm:justify-start">
                                            <span className="bg-slate-200/70 dark:bg-white/10 px-3 py-1.5 rounded-lg text-xs font-semibold text-slate-700 dark:text-slate-300 border border-slate-300 dark:border-white/5">{formData.Major}</span>
                                            <span className="bg-slate-200/70 dark:bg-white/10 px-3 py-1.5 rounded-lg text-xs font-semibold text-slate-700 dark:text-slate-300 border border-slate-300 dark:border-white/5 flex items-center"><Icon name="phone" size={12} className="mr-1.5"/>{formData.StudentPhone}</span>
                                        </div>
                                    </div>
                                </div>

                                <div className="space-y-5 border-t border-slate-200 dark:border-white/10 pt-6">
                                    <div className="flex flex-col gap-1.5 w-full">
                                        <label className="text-xs font-bold text-slate-600 dark:text-slate-400 uppercase tracking-widest">ชื่อกิจกรรมที่เข้าร่วม <span className="text-red-500">*</span></label>
                                        {availableActivities.length > 0 ? (
                                            <div className="relative">
                                                <select value={formData.ActivityName} onChange={e => setFormData({...formData, ActivityName: e.target.value})} required className="w-full appearance-none input-modern rounded-xl pl-4 pr-10 py-3.5 text-sm font-semibold shadow-sm cursor-pointer bg-white/80 dark:bg-black/40">
                                                    <option value="">-- โปรดเลือก --</option>
                                                    {availableActivities.map((act, i) => <option key={i} value={act}>{act}</option>)}
                                                </select>
                                                <div className="absolute right-4 top-1/2 -translate-y-1/2 text-slate-400 pointer-events-none"><Icon name="chevron-down" size={16}/></div>
                                            </div>
                                        ) : (
                                            <div className="text-center p-4 bg-red-50 dark:bg-red-900/20 border border-red-200 dark:border-red-800/50 rounded-xl text-red-600 dark:text-red-400 font-bold text-sm">
                                                ไม่มีกิจกรรมที่เปิดให้ลงทะเบียนในขณะนี้
                                            </div>
                                        )}
                                    </div>
                                </div>
                            </div>
                            <div className="pt-4 flex justify-center">
                                <button type="submit" disabled={isSubmitting || availableActivities.length === 0} className={`w-full md:w-auto min-w-[280px] py-4 px-8 rounded-2xl font-black text-lg transition-all btn-interactive flex items-center justify-center gap-2 ${availableActivities.length === 0 ? 'bg-slate-300 dark:bg-slate-700 text-slate-500 cursor-not-allowed' : 'bg-gradient-to-r from-purple-500 to-indigo-600 text-white shadow-[0_0_25px_rgba(168,85,247,0.3)] hover:shadow-[0_0_35px_rgba(168,85,247,0.5)] transform hover:-translate-y-1'}`}>
                                    {isSubmitting ? <Icon name="loader-2" className="animate-spin" /> : <Icon name="check-circle" />} ยืนยันการลงทะเบียนกิจกรรม
                                </button>
                            </div>
                        </form>
                    )}
                </div>
            );
        }

        // ==========================================
        // ✅ Success View
        // ==========================================
        function SuccessView({ onHome }) {
            return (
                <div className="flex items-center justify-center min-h-[80vh] p-4 animate-fade-in">
                    <div className="glass-panel p-8 md:p-12 rounded-[3rem] text-center max-w-md w-full animate-slide-up shadow-2xl border-t-8 border-t-emerald-500">
                        <div className="w-24 h-24 bg-emerald-100 dark:bg-emerald-500/20 text-emerald-500 rounded-full flex items-center justify-center mx-auto mb-6 shadow-inner relative">
                            <Icon name="check-circle" size={48} className="relative z-10" />
                            <div className="absolute inset-0 bg-emerald-400 rounded-full blur-xl opacity-30 animate-pulse"></div>
                        </div>
                        <h2 className="text-3xl font-black text-slate-800 dark:text-white mb-3 tracking-tight">ลงทะเบียนสำเร็จ!</h2>
                        <p className="text-slate-500 dark:text-slate-400 font-medium mb-8 leading-relaxed">ระบบได้รับข้อมูลของท่านเรียบร้อยแล้ว ขอบคุณที่ให้ความร่วมมือครับ</p>
                        <button onClick={onHome} className="w-full py-4 bg-slate-100 dark:bg-white/10 text-slate-800 dark:text-white rounded-xl font-bold hover:bg-slate-200 dark:hover:bg-white/20 transition-colors shadow-sm flex justify-center items-center gap-2 btn-interactive">
                            <Icon name="home" size={18} /> กลับสู่หน้าแรก
                        </button>
                    </div>
                </div>
            );
        }

        // ==========================================
        // 📊 Admin Dashboard
        // ==========================================
        function AdminDashboard({ goBack }) {
            const { isDarkMode = false } = useContext(AppContext) || {};
            const [data, setData] = useState([]);
            const [loading, setLoading] = useState(true);
            const [editItem, setEditItem] = useState(null);
            const [activeTab, setActiveTab] = useState('overview');
            const [drilldownData, setDrilldownData] = useState({ title: '', list: [], type: '' });
            const [currentPage, setCurrentPage] = useState(1);
            const [searchTerm, setSearchTerm] = useState('');
            const [executiveMajor, setExecutiveMajor] = useState('ทั้งหมด');
            const [activityDefs, setActivityDefs] = useState([]);
            const [activityLogs, setActivityLogs] = useState([]);
            const [activityForm, setActivityForm] = useState({ name: '', date: '', location: '' });

            const loadData = (isSilent = false) => {
                if (!isSilent) setLoading(true);
                Papa.parse(SHEET_CSV_URL + `&_cb=${new Date().getTime()}`, {
                    download: true, header: true,
                    complete: (res) => { setData(res.data.filter(row => row.StudentID).map(r => ({ ...r, Major: cleanMajor(r.Major) }))); if (!isSilent) setLoading(false); },
                    error: () => { if (!isSilent) Swal.fire('Error', 'Database Connection Failed', 'warning'); if (!isSilent) setLoading(false); }
                });
            };

            const loadActivities = () => { Papa.parse(ACTIVITY_SHEET_CSV_URL + `&_cb=${new Date().getTime()}`, { download: true, header: true, complete: (res) => { setActivityDefs(res.data.filter(row => row.ActivityName)); } }); };
            const loadLogs = () => { Papa.parse(LOGS_SHEET_CSV_URL + `&_cb=${new Date().getTime()}`, { download: true, header: true, complete: (res) => { setActivityLogs(res.data.filter(row => row.ActivityName)); } }); };

            useEffect(() => { 
                loadData(); loadActivities(); loadLogs();
                const intervalId = setInterval(() => { loadData(true); loadActivities(); loadLogs(); }, 2000);
                return () => clearInterval(intervalId);
            }, []);

            const executiveBaseMajors = useMemo(() => {
                const mSet = new Set();
                data.filter(r => r.FullName !== 'SYSTEM_ACTIVITY_DEF' && r.BloodGroup !== 'Activity').forEach(r => { if(r.Major) mSet.add(r.Major.replace(/\s*\(เทียบโอน\)/g, '').trim()); });
                return Array.from(mSet).sort();
            }, [data]);

            const filteredData = useMemo(() => {
                let result = data;
                if (searchTerm) {
                    const s = searchTerm.toLowerCase();
                    result = result.filter(r => (r.FullName || '').toLowerCase().includes(s) || (r.StudentID || '').toLowerCase().includes(s) || (r.Major || '').toLowerCase().includes(s) || (r.StudentPhone || '').includes(s) || (r.ParentPhone || '').includes(s));
                }
                if (activeTab === 'executive' && executiveMajor !== 'ทั้งหมด') {
                    result = result.filter(r => { const baseMajor = r.Major ? r.Major.replace(/\s*\(เทียบโอน\)/g, '').trim() : ''; return baseMajor === executiveMajor; });
                }
                return result;
            }, [data, searchTerm, activeTab, executiveMajor]);

            const stats = useMemo(() => {
                const studentData = filteredData.filter(r => r.FullName !== 'SYSTEM_ACTIVITY_DEF' && r.BloodGroup !== 'Activity');
                const uniqueDataMap = new Map();
                studentData.forEach(s => { let uid = (s.StudentID && s.StudentID.trim() !== '') ? s.StudentID.trim() : (s.IDCard && s.IDCard.trim() !== '') ? s.IDCard.trim() : Math.random().toString(); uniqueDataMap.set(uid, s); });
                const uniqueStudents = Array.from(uniqueDataMap.values());

                let total = uniqueStudents.length, normalCount = 0, transferCount = 0, foodAlert = 0, healthAlert = 0;
                let majorCount = {}, dietStats = { 'ฮาลาล': 0, 'มังสวิรัติ': 0, 'เจ': 0, 'อาหารปกติ': 0 }, foodAllergies = [], diseases = [], drugAllergies = [];
                let religionStats = { 'พุทธ': 0, 'อิสลาม': 0, 'คริสต์': 0, 'อื่นๆ': 0 };
                let bloodStats = { 'A': 0, 'B': 0, 'O': 0, 'AB': 0 };
                
                const surveillanceList = []; let surveillanceRiskPie = { 'ด้านการแพทย์': 0, 'ด้านโภชนาการ': 0, 'ความเสี่ยงซ้อน (ทั้งสอง)': 0 };
                let execBreakdownMap = {}; let allergyCounts = {};

                uniqueStudents.forEach(s => {
                    // สาขาและเทียบโอน
                    if(s.Major) {
                        majorCount[s.Major] = (majorCount[s.Major] || 0) + 1;
                        s.Major.includes("เทียบโอน") ? transferCount++ : normalCount++;
                        const baseName = s.Major.replace(/\s*\(เทียบโอน\)/g, '').trim();
                        if (!execBreakdownMap[baseName]) execBreakdownMap[baseName] = { name: baseName, normal: 0, transfer: 0, total: 0 };
                        s.Major.includes('เทียบโอน') ? execBreakdownMap[baseName].transfer++ : execBreakdownMap[baseName].normal++;
                        execBreakdownMap[baseName].total++;
                    }

                    // ศาสนาและกรุ๊ปเลือด
                    if(s.Religion) {
                        if(religionStats[s.Religion] !== undefined) religionStats[s.Religion]++;
                        else religionStats['อื่นๆ']++;
                    } else religionStats['อื่นๆ']++;

                    if(s.BloodGroup && bloodStats[s.BloodGroup] !== undefined) bloodStats[s.BloodGroup]++;

                    // สุขภาพและโภชนาการ
                    let hasF = s.FoodAllergy !== 'ไม่แพ้' || s.SpecificDiet !== 'ไม่มี';
                    let hasH = s.Disease !== 'ไม่มี' || s.DrugAllergy !== 'ไม่แพ้';
                    if (hasF) foodAlert++; if (hasH) healthAlert++;

                    if (s.FoodAllergy && s.FoodAllergy !== 'ไม่แพ้') { foodAllergies.push(s); let foodStr = s.FoodAllergy.trim(); allergyCounts[foodStr] = (allergyCounts[foodStr] || 0) + 1; }
                    if (s.SpecificDiet) {
                        if (s.SpecificDiet === 'ไม่มี') dietStats['อาหารปกติ']++;
                        else if (s.SpecificDiet.includes('ฮาลาล')) dietStats['ฮาลาล']++;
                        else if (s.SpecificDiet.includes('มังสวิรัติ')) dietStats['มังสวิรัติ']++;
                        else if (s.SpecificDiet.includes('เจ')) dietStats['เจ']++;
                    }
                    if (s.Disease && s.Disease !== 'ไม่มี') diseases.push(s);
                    if (s.DrugAllergy && s.DrugAllergy !== 'ไม่แพ้') drugAllergies.push(s);

                    if (hasF || hasH) {
                        let issues = [];
                        if (s.FoodAllergy !== 'ไม่แพ้') issues.push({ type: 'food', text: `แพ้อาหาร: ${s.FoodAllergy}` });
                        if (s.SpecificDiet !== 'ไม่มี') issues.push({ type: 'food', text: `อาหาร: ${s.SpecificDiet}` });
                        if (s.Disease !== 'ไม่มี') issues.push({ type: 'health', text: `โรคประจำตัว: ${s.Disease}` });
                        if (s.DrugAllergy !== 'ไม่แพ้') issues.push({ type: 'health', text: `แพ้ยา: ${s.DrugAllergy}` });
                        surveillanceList.push({ ...s, issues });

                        if (hasF && hasH) surveillanceRiskPie['ความเสี่ยงซ้อน (ทั้งสอง)']++;
                        else if (hasF) surveillanceRiskPie['ด้านโภชนาการ']++;
                        else if (hasH) surveillanceRiskPie['ด้านการแพทย์']++;
                    }
                });

                const surveillancePieData = Object.keys(surveillanceRiskPie).map(k => ({name: k, value: surveillanceRiskPie[k]})).filter(d => d.value > 0);
                const pieDataList = Object.keys(majorCount).map(k=>({name:k, value:majorCount[k]}));
                const execBreakdownList = Object.values(execBreakdownMap).sort((a,b) => b.total - a.total);
                const groupedAllergies = Object.keys(allergyCounts).map(name => ({name, count: allergyCounts[name]})).sort((a,b) => b.count - a.count);

                return { total, pieData: pieDataList, COLORS: ['#ff6600', '#3b82f6', '#10b981', '#8b5cf6', '#ec4899', '#facc15', '#06b6d4'], foodAlert, healthAlert, surveillanceList, surveillancePieData, normalCount, transferCount, religionStats, bloodStats, dietStats, foodAllergies, diseases, drugAllergies, execBreakdownList, groupedAllergies, uniqueStudents, studentData: uniqueStudents };
            }, [filteredData]);

            const handleDrilldown = (title, type, key) => {
                let filtered = [];
                if (type === 'all') filtered = stats.uniqueStudents;
                else if (type === 'healthy') filtered = stats.uniqueStudents.filter(s => s.Disease === 'ไม่มี' && s.DrugAllergy === 'ไม่แพ้');
                else if (type === 'religion_diet') filtered = stats.uniqueStudents.filter(s => s.SpecificDiet && s.SpecificDiet.includes(key));
                else if (type === 'food_allergy') filtered = stats.uniqueStudents.filter(s => s.FoodAllergy && s.FoodAllergy !== 'ไม่แพ้');
                else if (type === 'food_alert') filtered = stats.uniqueStudents.filter(s => (s.FoodAllergy && s.FoodAllergy !== 'ไม่แพ้') || (s.SpecificDiet && s.SpecificDiet !== 'ไม่มี'));
                else if (type === 'health_alert') filtered = stats.uniqueStudents.filter(s => (s.Disease && s.Disease !== 'ไม่มี') || (s.DrugAllergy && s.DrugAllergy !== 'ไม่แพ้'));
                else if (type === 'disease') filtered = stats.uniqueStudents.filter(s => s.Disease && s.Disease !== 'ไม่มี');
                else if (type === 'drug_allergy') filtered = stats.uniqueStudents.filter(s => s.DrugAllergy && s.DrugAllergy !== 'ไม่แพ้');
                else if (type === 'demographics') {
                    if (key === 'normal') filtered = stats.uniqueStudents.filter(s => s.Major && !s.Major.includes('เทียบโอน'));
                    else if (key === 'transfer') filtered = stats.uniqueStudents.filter(s => s.Major && s.Major.includes('เทียบโอน'));
                } else if (type === 'major_breakdown') {
                    if (key.type === 'normal') filtered = stats.uniqueStudents.filter(s => s.Major && s.Major.includes(key.major) && !s.Major.includes('เทียบโอน'));
                    else if (key.type === 'transfer') filtered = stats.uniqueStudents.filter(s => s.Major && s.Major.includes(key.major) && s.Major.includes('เทียบโอน'));
                    else filtered = stats.uniqueStudents.filter(s => s.Major && s.Major.includes(key.major));
                } else if (type === 'majors') {
                    filtered = stats.uniqueStudents.filter(s => s.Major && s.Major.includes(key));
                } else if (type === 'surveillance_all') {
                    filtered = stats.surveillanceList;
                } else if (type === 'surveillance_pie') {
                    if (key === 'ด้านโภชนาการ') filtered = stats.surveillanceList.filter(s => (s.FoodAllergy !== 'ไม่แพ้' || s.SpecificDiet !== 'ไม่มี') && !(s.Disease !== 'ไม่มี' || s.DrugAllergy !== 'ไม่แพ้'));
                    else if (key === 'ด้านการแพทย์') filtered = stats.surveillanceList.filter(s => !(s.FoodAllergy !== 'ไม่แพ้' || s.SpecificDiet !== 'ไม่มี') && (s.Disease !== 'ไม่มี' || s.DrugAllergy !== 'ไม่แพ้'));
                    else if (key === 'ความเสี่ยงซ้อน (ทั้งสอง)') filtered = stats.surveillanceList.filter(s => (s.FoodAllergy !== 'ไม่แพ้' || s.SpecificDiet !== 'ไม่มี') && (s.Disease !== 'ไม่มี' || s.DrugAllergy !== 'ไม่แพ้'));
                } else if (type === 'allergy_group') {
                    filtered = stats.uniqueStudents.filter(s => s.FoodAllergy && s.FoodAllergy.includes(key));
                } else if (type === 'activity_regs') {
                    filtered = activityLogs.filter(r => r.ActivityName === key);
                } else if (type === 'activity_major') {
                    filtered = activityLogs.filter(r => r.ActivityName === key.activity && (r.Major || 'ไม่ระบุ') === key.major);
                } else if (type === 'religion') {
                    filtered = stats.uniqueStudents.filter(s => s.Religion === key || (key==='อื่นๆ' && (!s.Religion || !['พุทธ','อิสลาม','คริสต์'].includes(s.Religion))));
                } else if (type === 'blood_group') {
                    filtered = stats.uniqueStudents.filter(s => s.BloodGroup === key);
                }
                setDrilldownData({ title, type, list: filtered });
            };

            const handleSaveEdit = (e) => {
                e.preventDefault();
                if (editItem.StudentID && editItem.StudentID.length !== 9) {
                    Swal.fire({ icon: 'warning', title: 'แจ้งเตือน', text: 'รหัสนักศึกษาต้องมี 9 หลัก', confirmButtonColor: '#ff6600', customClass:{popup:'rounded-[2rem] bg-white dark:bg-zinc-900 text-slate-800 dark:text-white'} });
                    return;
                }
                Swal.fire({ title: 'กำลังบันทึก...', didOpen: () => Swal.showLoading(), customClass:{popup:'rounded-[2rem] bg-white dark:bg-zinc-900 text-slate-800 dark:text-white'} });
                submitToAPI('update', { oldStudentID: editItem.oldStudentID, newData: editItem }).then(res => { if(res.success) { Swal.fire({ icon:'success', title:'บันทึกสำเร็จ', timer:1500, showConfirmButton:false, customClass:{popup:'rounded-[2rem] bg-white dark:bg-zinc-900 text-slate-800 dark:text-white'} }); setEditItem(null); loadData(); } }).catch(err => Swal.fire('Error', err.message, 'error'));
            };

            const handleToggleActivity = async (actName, currentStatus) => {
                const newStatus = currentStatus === 'CLOSED' ? 'OPEN' : 'CLOSED';
                setActivityDefs(prev => prev.map(a => a.ActivityName === actName ? { ...a, Status: newStatus } : a));
                try {
                    const res = await submitToAPI('toggle_activity', { ActivityName: actName, Status: newStatus });
                    if (!res.success) throw new Error(res.message);
                } catch (err) {
                    loadActivities();
                    Swal.fire({ icon: 'error', title: 'Error', text: err.message, customClass:{popup:'rounded-[2rem] bg-white dark:bg-zinc-900 text-slate-800 dark:text-white'} });
                }
            };

            const handleCreateActivity = async (e) => {
                e.preventDefault();
                if (!activityForm.name || !activityForm.date || !activityForm.location) { Swal.fire({ icon: 'warning', title: 'ข้อมูลไม่ครบ', text: 'กรุณากรอกข้อมูลให้ครบถ้วน', customClass:{popup:'rounded-[2rem] bg-white dark:bg-zinc-900 text-slate-800 dark:text-white'} }); return; }
                Swal.fire({ title: 'กำลังบันทึกข้อมูล...', allowOutsideClick: false, didOpen: () => Swal.showLoading(), customClass:{popup:'rounded-[2rem] bg-white dark:bg-zinc-900 text-slate-800 dark:text-white'} });
                try {
                    const payload = { ActivityName: activityForm.name, ActivityDate: activityForm.date, Location: activityForm.location };
                    const res = await submitToAPI('create_activity', payload); 
                    if (res.success) {
                        Swal.fire({ icon: 'success', title: 'สร้างกิจกรรมสำเร็จ', timer: 1500, showConfirmButton: false, customClass:{popup:'rounded-[2rem] bg-white dark:bg-zinc-900 text-slate-800 dark:text-white'} });
                        setActivityForm({ name: '', date: '', location: '' });
                        loadActivities(); 
                    } else { throw new Error(res.message); }
                } catch (err) { Swal.fire({ icon: 'error', title: 'Error', text: err.message, customClass:{popup:'rounded-[2rem] bg-white dark:bg-zinc-900 text-slate-800 dark:text-white'} }); }
            };

            const exportExcel = () => {
                if (stats.studentData.length === 0) return;
                const exportData = stats.studentData.map(r => ({ 'วันที่': r.Timestamp||'', 'รหัสนักศึกษา': r.StudentID||'', 'ชื่อ-นามสกุล': r.FullName||'', 'สาขาวิชา': r.Major||'', 'ศาสนา': r.Religion||'', 'กรุ๊ปเลือด': r.BloodGroup||'', 'เบอร์ นศ.': r.StudentPhone||'', 'เบอร์ ผปค.': r.ParentPhone||'', 'แพ้อาหาร': r.FoodAllergy||'', 'อาหารเฉพาะ': r.SpecificDiet||'', 'โรคประจำตัว': r.Disease||'', 'แพ้ยา': r.DrugAllergy||'' }));
                const ws = window.XLSX.utils.json_to_sheet(exportData);
                const wb = window.XLSX.utils.book_new(); window.XLSX.utils.book_append_sheet(wb, ws, "Students");
                window.XLSX.writeFile(wb, `DIGIT_Export_${new Date().toISOString().slice(0,10)}.xlsx`);
            };

            if (loading && stats.total === 0) return (
                <div className="flex flex-col justify-center items-center h-[70vh]">
                    <div className="p-4 bg-brand/10 rounded-2xl mb-4 animate-pulse-slow shadow-glow-brand"><Icon name="loader-2" size={40} className="text-brand animate-spin" /></div>
                    <p className="text-slate-500 font-bold tracking-widest uppercase text-sm">กำลังโหลดข้อมูล...</p>
                </div>
            );

            const TABS = [
                { id: 'overview', icon: 'users', label: 'ภาพรวม' },
                { id: 'majors', icon: 'pie-chart', label: 'สาขาวิชา' },
                { id: 'health_diet', icon: 'activity', label: 'โภชนาการ' },
                { id: 'surveillance', icon: 'shield-alert', label: 'กลุ่มเฝ้าระวัง' },
                { id: 'executive', icon: 'layout-dashboard', label: 'รายงานสรุปผู้บริหาร' },
                { id: 'create_activity', icon: 'calendar-plus', label: 'สร้างกิจกรรม' },
                { id: 'activity_summary', icon: 'bar-chart-2', label: 'สรุปกิจกรรม' }
            ];

            const pieTooltipStyle = { backgroundColor: isDarkMode ? 'rgba(24, 24, 27, 0.95)' : 'rgba(255, 255, 255, 0.95)', backdropFilter: 'blur(10px)', border: '1px solid rgba(255,255,255,0.1)', borderRadius: '16px', boxShadow: '0 20px 40px rgba(0,0,0,0.15)' };
            const pieItemStyle = {fontWeight: 'bold', color: isDarkMode ? '#fff' : '#1e293b'};
            const drilldownIcon = drilldownData.type === 'activity_regs' || drilldownData.type === 'activity_major' ? "calendar-check" : "users";
            const drilldownHeaderColor = (drilldownData.type === 'activity_regs' || drilldownData.type === 'activity_major') ? 'bg-purple-500 shadow-glow-brand' : (drilldownData.type.includes('diet') || drilldownData.type.includes('food') || drilldownData.type === 'allergy_group') ? 'bg-orange-500 shadow-glow-brand' : (drilldownData.type === 'demographics' || drilldownData.type === 'major_breakdown' || drilldownData.type === 'majors') ? 'bg-blue-500' : drilldownData.title.includes('ทั้งหมด') ? 'bg-brand shadow-glow-brand' : drilldownData.type === 'healthy' ? 'bg-emerald-500' : 'bg-red-500 shadow-glow-red';
            const showConditions = !['demographics', 'major_breakdown', 'majors', 'activity_regs', 'activity_major', 'healthy'].includes(drilldownData.type) && !drilldownData.title.includes('ทั้งหมด');

            return (
                <div className="flex flex-col md:flex-row gap-6 animate-fade-in pb-20 items-start w-full">
                    <div className="w-full md:w-64 glass-panel p-5 rounded-[2rem] flex flex-col md:sticky md:top-24 z-20 shrink-0 no-print border border-slate-200/50 dark:border-white/5 shadow-soft">
                        <div className="flex items-center gap-4 mb-8 px-2 pt-2">
                            <div className="w-12 h-12 bg-slate-900 dark:bg-white rounded-[1rem] flex items-center justify-center text-white dark:text-black shadow-lg"><Icon name="command" size={24}/></div>
                            <div><p className="text-[10px] text-brand font-black tracking-widest uppercase">Admin Portal</p><h3 className="font-black text-slate-800 dark:text-white leading-none text-lg mt-0.5">แดชบอร์ด</h3></div>
                        </div>
                        <div className="flex flex-row md:flex-col overflow-x-auto hide-scrollbar gap-2 pb-2 md:pb-0">
                            {TABS.map(tab => (
                                <button key={tab.id} onClick={() => { setActiveTab(tab.id); setCurrentPage(1); }} className={`flex items-center gap-3 px-4 py-3.5 rounded-xl transition-all font-bold whitespace-nowrap btn-interactive text-sm ${activeTab === tab.id ? 'bg-brand text-white shadow-glow-brand hover:-translate-y-0.5' : 'text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-white/10 hover:text-slate-900 dark:hover:text-white'}`}>
                                    <Icon name={tab.icon} size={18} className={activeTab === tab.id ? 'text-white' : 'text-slate-400'}/> {tab.label}
                                </button>
                            ))}
                        </div>
                    </div>

                    <div className="flex-1 w-full space-y-6 print-area min-w-0">
                        <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center glass-panel p-5 md:px-8 md:py-6 rounded-[2.5rem] gap-4 no-print shadow-soft border border-slate-200/50 dark:border-white/5">
                            <h2 className="text-xl md:text-2xl font-black text-slate-800 dark:text-white flex items-center gap-3 whitespace-nowrap"><div className="p-2.5 bg-brand/10 text-brand rounded-xl shadow-sm"><Icon name={(TABS.find(t=>t.id===activeTab) || {}).icon} size={20}/></div>{(TABS.find(t=>t.id===activeTab) || {}).label}</h2>
                            <div className="flex flex-col xl:flex-row flex-wrap w-full sm:w-auto gap-3 items-start xl:items-center">
                                <div className="relative w-full sm:w-64"><div className="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400"><Icon name="search" size={16}/></div><input type="text" placeholder="ค้นหา..." value={searchTerm} onChange={(e) => {setSearchTerm(e.target.value); setCurrentPage(1);}} className="w-full pl-10 pr-8 py-2.5 rounded-xl input-modern text-sm font-semibold"/></div>
                                <div className="flex flex-wrap w-full sm:w-auto gap-2 justify-start sm:justify-end">
                                    {activeTab === 'executive' && <button onClick={window.print} className="px-5 py-2.5 bg-slate-100 dark:bg-white/10 text-slate-700 dark:text-white rounded-xl font-bold text-sm flex items-center gap-2 btn-interactive hover:bg-slate-200"><Icon name="printer" size={16} /> พิมพ์</button>}
                                    <button onClick={exportExcel} className="px-5 py-2.5 bg-emerald-50 dark:bg-emerald-500/10 text-emerald-600 dark:text-emerald-400 hover:bg-emerald-500 hover:text-white rounded-xl font-bold text-sm flex items-center gap-2 transition-all btn-interactive shadow-sm"><Icon name="download" size={16} /> Excel</button>
                                    <button onClick={goBack} className="p-2.5 bg-red-50 dark:bg-red-500/10 text-red-500 rounded-xl hover:bg-red-500 hover:text-white btn-interactive shadow-sm"><Icon name="log-out" size={18}/></button>
                                </div>
                            </div>
                        </div>

                        {/* TAB 1: OVERVIEW */}
                        {activeTab === 'overview' && (
                            <div className="space-y-6 animate-fade-in">
                                <div className="grid grid-cols-2 lg:grid-cols-4 gap-4 md:gap-6">
                                    {[
                                        {l:'ยอดขึ้นทะเบียนรวม', v:stats.total, i:'users', c:'text-brand', bg:'bg-brand/10', type: 'all'}, 
                                        {l:'กลุ่มเปราะบาง (แพทย์)', v:stats.healthAlert, i:'activity', c:'text-red-500', bg:'bg-red-500/10', type: 'health_alert'}, 
                                        {l:'จัดการอาหารพิเศษ', v:stats.foodAlert, i:'utensils', c:'text-orange-500', bg:'bg-orange-500/10', type: 'food_alert'},
                                        {l:'สุขภาพปกติ', v:(stats.total - stats.healthAlert), i:'check-circle', c:'text-emerald-500', bg:'bg-emerald-500/10', type: 'healthy'}
                                    ].map((card, i) => (
