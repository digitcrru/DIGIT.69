                                                <button onClick={() => setCurrentPage(p => Math.min(Math.ceil(stats.studentData.length / 15), p + 1))} disabled={currentPage === Math.ceil(stats.studentData.length / 15) || Math.ceil(stats.studentData.length / 15) === 0} className="p-2.5 rounded-lg bg-white dark:bg-white/5 border border-slate-200 dark:border-white/10 shadow-sm disabled:opacity-50 btn-interactive"><Icon name="chevron-right" size={16}/></button>
                                            </div>
                                        </div>
                                    )}
                                </div>
                            </div>
                        )}

                        {/* TAB 2: MAJORS SUMMARY */}
                        {activeTab === 'majors' && (
                            <div className="grid lg:grid-cols-5 gap-6 animate-fade-in">
                                <div className="lg:col-span-2 glass-panel p-6 md:p-8 rounded-[2rem] shadow-sm flex flex-col items-center justify-center min-h-[450px]">
                                    <div className="w-full mb-2 text-center"><h3 className="text-2xl font-black text-slate-800 dark:text-white">สัดส่วนสาขาวิชา</h3><p className="text-xs font-bold text-emerald-500 mt-1 uppercase tracking-widest">แยกตามสาขาที่ขึ้นทะเบียน</p></div>
                                    <div className="w-full flex-1 relative min-h-[320px] mt-4">
                                        {stats.pieData.length === 0 ? <div className="w-full h-full flex items-center justify-center text-slate-400">ไม่มีข้อมูล</div> : (
                                            <ResponsiveContainer width="100%" height="100%">
                                                <PieChart>
                                                    <Pie data={[...stats.pieData].sort((a,b)=>b.value-a.value)} innerRadius="65%" outerRadius="90%" paddingAngle={6} dataKey="value" stroke="none" cornerRadius={12}>
                                                        {stats.pieData.map((e, i) => <Cell key={i} fill={stats.COLORS[i % stats.COLORS.length]} onClick={() => handleDrilldown(`นักศึกษา: ${e.name}`, 'majors', e.name)} className="drop-shadow-sm hover:opacity-80 cursor-pointer outline-none"/>)}
                                                    </Pie>
                                                    <Tooltip contentStyle={pieTooltipStyle} itemStyle={pieItemStyle} cursor={false} />
                                                    <text x="50%" y="50%" textAnchor="middle" dominantBaseline="middle">
                                                        <tspan x="50%" dy="-8" fontSize="56" fill={isDarkMode ? "#fff" : "#0f172a"} fontWeight="900">{stats.total}</tspan>
                                                        <tspan x="50%" dy="32" fontSize="13" fill="#64748b" fontWeight="bold" className="uppercase tracking-widest">รวมทั้งหมด</tspan>
                                                    </text>
                                                </PieChart>
                                            </ResponsiveContainer>
                                        )}
                                    </div>
                                </div>
                                <div className="lg:col-span-3 glass-panel p-6 md:p-8 rounded-[2rem] shadow-sm flex flex-col">
                                    <h3 className="text-lg font-black mb-4 text-slate-800 dark:text-white flex items-center gap-2"><Icon name="bar-chart" size={18} className="text-blue-500"/> จำนวนแยกตามสาขาวิชา</h3>
                                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-4 overflow-y-auto custom-scrollbar flex-1 pr-2 max-h-[450px]">
                                        {[...stats.pieData].sort((a,b) => b.value - a.value).map((entry, idx) => (
                                            <div key={idx} onClick={() => handleDrilldown(`นักศึกษา: ${entry.name}`, 'majors', entry.name)} className="p-5 rounded-2xl bg-white dark:bg-zinc-800/80 border border-slate-200/60 dark:border-white/10 hover:border-brand/50 hover:shadow-md transition-all cursor-pointer group btn-interactive relative overflow-hidden flex flex-col justify-between min-h-[110px]">
                                                <div className="absolute inset-y-0 left-0 opacity-10 transition-all duration-700" style={{ width: `${stats.total ? (entry.value / stats.total) * 100 : 0}%`, backgroundColor: stats.COLORS[idx % stats.COLORS.length] }}></div>
                                                <div className="relative z-10 flex items-start gap-3 mb-2">
                                                    <div className="w-3 h-3 rounded-full mt-1 shrink-0" style={{ backgroundColor: stats.COLORS[idx % stats.COLORS.length] }}></div>
                                                    <span className="text-sm font-bold text-slate-700 dark:text-slate-200 leading-snug group-hover:text-brand transition-colors">{entry.name}</span>
                                                </div>
                                                <div className="relative z-10 flex items-end justify-between w-full mt-auto">
                                                    <div className="p-1.5 bg-slate-100 dark:bg-white/5 rounded-lg text-slate-400 group-hover:text-brand transition-colors"><Icon name="users" size={16}/></div>
                                                    <div className="text-right">
                                                        <span className="text-3xl font-black text-slate-800 dark:text-white leading-none">{entry.value} <span className="text-xs font-bold text-slate-400">คน</span></span>
                                                    </div>
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            </div>
                        )}

                        {/* TAB 3: HEALTH & DIET */}
                        {activeTab === 'health_diet' && (
                            <div className="space-y-6 animate-fade-in">
                                <div className="grid grid-cols-2 lg:grid-cols-5 gap-4 md:gap-6">
                                    <StatCard label="ทานได้ปกติ" value={stats.total - stats.foodAlert} icon="utensils" color="blue" onClick={() => handleDrilldown('ทานอาหารได้ทุกอย่าง', 'food_alert', 'ไม่มี')} />
                                    <StatCard label="ฮาลาล" value={stats.dietStats['ฮาลาล']} icon="check-circle" color="emerald" onClick={() => handleDrilldown('อาหารฮาลาล', 'religion_diet', 'ฮาลาล')} />
                                    <StatCard label="มังสวิรัติ" value={stats.dietStats['มังสวิรัติ']} icon="leaf" color="emerald" onClick={() => handleDrilldown('อาหารมังสวิรัติ', 'religion_diet', 'มังสวิรัติ')} />
                                    <StatCard label="เจ" value={stats.dietStats['เจ']} icon="sun" color="brand" onClick={() => handleDrilldown('อาหารเจ', 'religion_diet', 'เจ')} />
                                    <StatCard label="แพ้อาหาร" value={stats.foodAllergies.length} icon="alert-triangle" color="orange" onClick={() => handleDrilldown('ประวัติแพ้อาหาร', 'food_allergy', '')} />
                                </div>

                                <div className="glass-panel p-6 md:p-8 rounded-[2.5rem] shadow-soft">
                                    <div className="flex items-center gap-3 mb-6"><div className="p-3 bg-orange-100 dark:bg-orange-500/20 text-orange-600 rounded-2xl"><Icon name="pizza" size={24}/></div><h3 className="text-xl font-black text-slate-800 dark:text-white">เจาะลึกรายการอาหารที่แพ้</h3></div>
                                    {stats.groupedAllergies.length > 0 ? (
                                        <div className="flex flex-wrap gap-3">
                                            {stats.groupedAllergies.map((alg, idx) => (
                                                <button key={idx} onClick={() => handleDrilldown(`นักศึกษาที่แพ้: ${alg.name}`, 'allergy_group', alg.name)} className="bg-white dark:bg-zinc-800 border border-orange-200 dark:border-orange-500/30 px-4 py-2.5 rounded-xl shadow-sm hover:shadow-md hover:border-orange-400 flex items-center gap-3 transition-all btn-interactive group">
                                                    <span className="text-sm font-bold text-slate-700 dark:text-slate-300 group-hover:text-orange-600 transition-colors">{alg.name}</span>
                                                    <span className="bg-orange-100 dark:bg-orange-900/40 text-orange-700 dark:text-orange-400 text-xs font-black px-2 py-1 rounded-md">{alg.count} คน</span>
                                                </button>
                                            ))}
                                        </div>
                                    ) : <div className="text-center p-8 text-slate-400 font-semibold bg-slate-50 dark:bg-white/5 rounded-2xl border border-dashed border-slate-200 dark:border-white/10">ไม่พบประวัติการแพ้อาหาร</div>}
                                </div>
                            </div>
                        )}

                        {/* TAB 4: SURVEILLANCE */}
                        {activeTab === 'surveillance' && (
                            <div className="space-y-6 animate-fade-in">
                                <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                                    <StatCard label="ผู้ที่มีโรคประจำตัว" value={stats.diseases.length} icon="activity" color="pink" onClick={() => handleDrilldown('รายชื่อผู้มีโรคประจำตัว', 'disease', '')} subtext="คน" />
                                    <StatCard label="ผู้ที่มีประวัติแพ้ยา" value={stats.drugAllergies.length} icon="pill" color="purple" onClick={() => handleDrilldown('รายชื่อผู้มีประวัติแพ้ยา', 'drug_allergy', '')} subtext="คน" />
                                    <StatCard label="กลุ่มเปราะบาง (เสี่ยงรวม)" value={stats.healthAlert} icon="shield-alert" color="red" onClick={() => handleDrilldown('กลุ่มเปราะบาง (เฝ้าระวังพิเศษ)', 'health_alert', '')} subtext="คน" />
                                </div>
                                <div className="glass-panel rounded-[2.5rem] overflow-hidden shadow-soft">
                                    <div className="p-6 md:px-8 border-b border-slate-100 dark:border-white/5 bg-slate-50/50 dark:bg-white/5 flex items-center gap-3">
                                        <Icon name="users" className="text-red-500" size={20}/><h3 className="font-bold text-slate-800 dark:text-white">รายชื่อกลุ่มเปราะบางทั้งหมด</h3>
                                    </div>
                                    {stats.surveillanceList.length > 0 ? (
                                        <div className="overflow-x-auto p-2 custom-scrollbar">
                                            <table className="w-full text-sm text-left min-w-[600px]">
                                                <thead className="text-[11px] text-slate-400 uppercase tracking-widest bg-transparent"><tr><th className="px-6 py-4">ชื่อ-นามสกุล</th><th className="px-6 py-4">สาขาวิชา</th><th className="px-6 py-4">ประเด็นเสี่ยง</th><th className="px-6 py-4"></th></tr></thead>
                                                <tbody className="divide-y divide-slate-100 dark:divide-white/5">
                                                    {stats.surveillanceList.map((row, i) => (
                                                        <tr key={i} onClick={() => setEditItem({...row, oldStudentID: row.StudentID})} className="hover:bg-red-50/50 dark:hover:bg-red-900/10 transition-colors group cursor-pointer">
                                                            <td className="px-6 py-4 font-bold text-slate-800 dark:text-slate-200 group-hover:text-red-600 transition-colors">{row.FullName}</td>
                                                            <td className="px-6 py-4 text-xs font-semibold text-slate-500">{row.Major}</td>
                                                            <td className="px-6 py-4">
                                                                <div className="flex flex-wrap gap-1.5">
                                                                    {row.issues.map((iss, idx) => (
                                                                        <span key={idx} className={`text-[10px] font-bold px-2 py-1 rounded-md border ${iss.type === 'food' ? 'bg-orange-100 text-orange-700 border-orange-200 dark:bg-orange-900/40 dark:text-orange-400 dark:border-orange-800' : 'bg-red-100 text-red-700 border-red-200 dark:bg-red-900/40 dark:text-red-400 dark:border-red-800'}`}>{iss.text}</span>
                                                                    ))}
                                                                </div>
                                                            </td>
                                                            <td className="px-6 py-4 text-right text-slate-300 group-hover:text-red-500 transition-colors"><Icon name="edit" size={18}/></td>
                                                        </tr>
                                                    ))}
                                                </tbody>
                                            </table>
                                        </div>
                                    ) : <div className="text-center p-12 text-slate-400 font-semibold">ไม่พบนักศึกษาในกลุ่มเฝ้าระวังพิเศษ</div>}
                                </div>
                            </div>
                        )}

                        {/* TAB 6: CREATE ACTIVITY */}
                        {activeTab === 'create_activity' && (
                            <div className="space-y-6 animate-fade-in">
                                <div className="glass-panel p-6 md:p-8 rounded-[2.5rem] shadow-soft relative overflow-hidden border-t-[8px] border-t-purple-500">
                                    <div className="absolute top-0 right-0 p-8 opacity-5 text-purple-500 pointer-events-none transform translate-x-4 -translate-y-4"><Icon name="calendar-plus" size={120} /></div>
                                    <h3 className="text-xl md:text-2xl font-black text-slate-800 dark:text-white mb-8 flex items-center gap-3 relative z-10"><div className="p-3 bg-purple-100 dark:bg-purple-500/20 text-purple-600 rounded-2xl shadow-inner"><Icon name="calendar-plus" size={24}/></div> สร้างกิจกรรมใหม่</h3>
                                    <form onSubmit={handleCreateActivity} className="relative z-10 space-y-6">
                                        <div className="grid grid-cols-1 gap-6">
                                            <InputField label="ชื่อกิจกรรม" value={activityForm.name} onChange={v => setActivityForm({...activityForm, name: v})} placeholder="เช่น ปฐมนิเทศนักศึกษาใหม่" required />
                                            <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                                                <InputField type="datetime-local" label="วันที่และเวลา" value={activityForm.date} onChange={v => setActivityForm({...activityForm, date: v})} required />
                                                <InputField label="สถานที่จัดกิจกรรม" value={activityForm.location} onChange={v => setActivityForm({...activityForm, location: v})} placeholder="เช่น หอประชุมใหญ่" required />
                                            </div>
                                        </div>
                                        <div className="pt-4 flex justify-end">
                                            <button type="submit" className="w-full md:w-auto px-8 py-3.5 bg-purple-600 hover:bg-purple-700 text-white rounded-xl font-black text-lg transition-colors btn-interactive flex items-center justify-center gap-2 shadow-sm"><Icon name="plus-circle" size={20} /> บันทึกกิจกรรม</button>
                                        </div>
                                    </form>
                                </div>

                                {activityDefs.length > 0 && (
                                    <div className="glass-panel rounded-[2rem] overflow-hidden shadow-soft">
                                        <div className="p-6 md:px-8 border-b border-slate-100 dark:border-white/5 bg-slate-50/50 dark:bg-white/5"><h3 className="font-bold text-slate-800 dark:text-white flex items-center gap-3"><Icon name="list" className="text-slate-400" size={18}/> รายการกิจกรรมทั้งหมด</h3></div>
                                        <div className="overflow-x-auto p-2 custom-scrollbar">
                                            <table className="w-full text-sm text-left min-w-[700px]">
                                                <thead className="text-[11px] text-slate-400 uppercase tracking-widest bg-transparent"><tr><th className="px-6 py-3">ชื่อกิจกรรม</th><th className="px-6 py-3">วันที่และเวลา</th><th className="px-6 py-3">สถานที่จัดกิจกรรม</th><th className="px-6 py-3 text-center">เปิด/ปิด รับลงทะเบียน</th><th className="px-6 py-3"></th></tr></thead>
                                                <tbody className="divide-y divide-slate-100 dark:divide-white/5">
                                                    {activityDefs.map((act, idx) => (
                                                        <tr key={idx} className="hover:bg-purple-50/50 dark:hover:bg-purple-900/10 transition-colors group">
                                                            <td className="px-6 py-4 font-bold text-slate-800 dark:text-slate-200">{act.ActivityName}</td>
                                                            <td className="px-6 py-4 text-slate-500 font-mono text-xs">{new Date(act.ActivityDate).toLocaleString('th-TH')}</td>
                                                            <td className="px-6 py-4 text-slate-600 dark:text-slate-400 flex items-center gap-2"><Icon name="map-pin" size={14} className="text-slate-400"/> {act.Location}</td>
                                                            <td className="px-6 py-4 text-center">
                                                                <button onClick={() => handleToggleActivity(act.ActivityName, act.Status)} className={`relative inline-flex h-6 w-11 shrink-0 cursor-pointer rounded-full border-2 border-transparent transition-colors duration-200 ease-in-out focus:outline-none shadow-sm ${act.Status !== 'CLOSED' ? 'bg-emerald-500' : 'bg-slate-300 dark:bg-slate-600'}`}>
                                                                    <span className={`pointer-events-none inline-block h-5 w-5 transform rounded-full bg-white shadow ring-0 transition duration-200 ease-in-out ${act.Status !== 'CLOSED' ? 'translate-x-5' : 'translate-x-0'}`} />
                                                                </button>
                                                            </td>
                                                            <td className="px-6 py-4 text-right text-purple-500"><Icon name="calendar-check" size={20}/></td>
                                                        </tr>
                                                    ))}
                                                </tbody>
                                            </table>
                                        </div>
                                    </div>
                                )}
                            </div>
                        )}

                        {/* TAB 7: ACTIVITY SUMMARY */}
                        {activeTab === 'activity_summary' && (
                            <div className="space-y-6 animate-fade-in print:space-y-4">
                                <div className="glass-panel p-6 md:p-8 rounded-[2.5rem] border-t-[8px] border-t-pink-500 shadow-soft relative overflow-hidden bg-gradient-to-b from-white to-pink-50/30 dark:from-zinc-900 dark:to-zinc-900/50">
                                    <div className="absolute top-0 right-0 p-8 opacity-5 text-pink-500 pointer-events-none transform translate-x-4 -translate-y-4 print:hidden"><Icon name="bar-chart-2" size={120} /></div>
                                    <h3 className="text-xl md:text-2xl font-black text-slate-800 dark:text-white flex items-center gap-3 relative z-10 print:text-black print:text-2xl"><div className="p-3 bg-pink-100 dark:bg-pink-500/20 text-pink-600 rounded-2xl shadow-inner print:hidden"><Icon name="bar-chart-2" size={24}/></div> สรุปจำนวนผู้เข้าร่วมกิจกรรม</h3>
                                </div>

                                {activityDefs.length === 0 ? (
                                    <div className="glass-panel p-12 rounded-[2.5rem] flex flex-col items-center justify-center text-slate-400 shadow-soft border border-slate-200/50 dark:border-white/5"><Icon name="inbox" size={48} className="mb-4 opacity-30" /><p className="font-semibold text-lg">ยังไม่มีกิจกรรมที่ถูกสร้างในระบบ</p></div>
                                ) : (
                                    activityDefs.map((act, idx) => {
                                        const attendees = activityLogs.filter(log => log.ActivityName === act.ActivityName);
                                        const majorCounts = attendees.reduce((acc, curr) => { const m = curr.Major || 'ไม่ระบุ'; acc[m] = (acc[m] || 0) + 1; return acc; }, {});

                                        return (
                                            <div key={idx} className="glass-panel p-6 md:p-8 rounded-[2.5rem] border-l-[8px] border-l-pink-500 shadow-soft relative overflow-hidden mb-6 print:border-l-4 print:border-slate-300 print:shadow-none print:break-inside-avoid">
                                                <div className="flex flex-col md:flex-row md:items-center justify-between gap-4 mb-6 border-b border-slate-100 dark:border-white/5 pb-6">
                                                    <div>
                                                        <h3 className="text-xl md:text-2xl font-black text-slate-800 dark:text-white mb-2">{act.ActivityName}</h3>
                                                        <div className="flex flex-wrap items-center gap-4 text-sm text-slate-500 font-semibold"><span className="flex items-center gap-1.5"><Icon name="calendar" size={14} className="text-pink-500"/> {new Date(act.ActivityDate).toLocaleString('th-TH')}</span></div>
                                                    </div>
                                                    <div onClick={() => handleDrilldown(`รายชื่อผู้ร่วมกิจกรรม: ${act.ActivityName}`, 'activity_regs', act.ActivityName)} className="bg-pink-50 dark:bg-pink-500/10 text-pink-600 px-6 py-4 rounded-2xl text-center border border-pink-100 dark:border-pink-500/20 cursor-pointer hover:shadow-md hover:bg-pink-100 dark:hover:bg-pink-500/20 transition-all btn-interactive group">
                                                        <div className="text-xs font-bold uppercase tracking-widest mb-1 flex items-center justify-center gap-1"><Icon name="search" size={12} className="opacity-0 group-hover:opacity-100 transition-opacity"/> ยอดผู้เข้าร่วมรวม</div>
                                                        <div className="text-4xl font-black">{attendees.length}</div>
                                                    </div>
                                                </div>

                                                <h4 className="text-sm font-bold text-slate-700 dark:text-slate-300 mb-4 flex items-center gap-2"><Icon name="pie-chart" size={16} className="text-pink-500"/> แยกตามสาขาวิชา</h4>
                                                
                                                {Object.keys(majorCounts).length > 0 ? (
                                                    <div className="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4">
                                                        {Object.entries(majorCounts).sort((a,b)=>b[1]-a[1]).map(([major, count], mIdx) => (
                                                            <div key={mIdx} onClick={() => handleDrilldown(`ผู้เข้าร่วม: ${act.ActivityName} (${major})`, 'activity_major', {activity: act.ActivityName, major})} className="p-4 rounded-2xl bg-slate-50/80 dark:bg-white/5 border border-slate-200/60 dark:border-white/10 hover:border-pink-400 hover:shadow-md transition-all cursor-pointer group btn-interactive relative overflow-hidden flex flex-col justify-between min-h-[100px]">
                                                                 <div className="absolute top-0 right-0 p-3 opacity-0 group-hover:opacity-10 text-pink-500 transition-opacity transform translate-x-2 -translate-y-2"><Icon name="search" size={32}/></div>
                                                                 <div className="text-xs font-bold text-slate-500 dark:text-slate-400 mb-2 leading-relaxed group-hover:text-pink-600 transition-colors pr-4">{major}</div>
                                                                 <div className="text-2xl font-black text-slate-800 dark:text-white group-hover:text-pink-600 transition-colors">{count} <span className="text-xs font-semibold text-slate-400 ml-1">คน</span></div>
                                                            </div>
                                                        ))}
                                                    </div>
                                                ) : <div className="text-center p-6 text-slate-400 font-semibold bg-slate-50 dark:bg-white/5 rounded-2xl border border-dashed border-slate-200 dark:border-white/10">ยังไม่มีผู้ลงทะเบียนเข้าร่วมกิจกรรมนี้</div>}
                                            </div>
                                        )
                                    })
                                )}
                            </div>
                        )}
                    </div>

                    {/* MODALS: Drilldown */}
                    {drilldownData.list.length > 0 && (
                        <div className="fixed inset-0 z-[90] flex items-center justify-center p-4 sm:p-6 bg-slate-900/70 dark:bg-black/90 backdrop-blur-lg animate-fade-in print:hidden">
                            <div className="bg-white dark:bg-zinc-900 border border-slate-200 dark:border-white/10 p-6 md:p-8 rounded-[2.5rem] w-full max-w-5xl max-h-[90vh] flex flex-col shadow-[0_20px_60px_rgba(0,0,0,0.3)] dark:shadow-[0_20px_60px_rgba(0,0,0,0.8)] animate-slide-up text-left overflow-hidden">
                                <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 mb-6 shrink-0">
                                    <div>
                                        <h3 className="text-xl md:text-2xl font-black text-slate-800 dark:text-white flex items-center gap-3">
                                            <div className="p-3 rounded-2xl text-white shadow-md bg-brand shadow-glow-brand"><Icon name="users" size={24}/></div> {drilldownData.title}
                                        </h3>
                                        <p className="text-sm font-semibold text-slate-500 mt-2">พบทั้งหมด <span className="text-brand font-black bg-brand/10 px-2 py-0.5 rounded-md">{drilldownData.list.length}</span> รายการ</p>
                                    </div>
                                    <button onClick={() => setDrilldownData({ title: '', list: [], type: '' })} className="p-2.5 bg-slate-100 dark:bg-white/10 rounded-xl hover:bg-slate-200 transition-colors"><Icon name="x" size={20}/></button>
                                </div>
                                <div className="overflow-y-auto flex-1 custom-scrollbar -mx-2 px-2">
                                    <table className="w-full text-sm text-left">
                                        <thead className="text-xs text-slate-500 uppercase tracking-widest bg-slate-100/80 dark:bg-zinc-800/80 sticky top-0 rounded-xl z-10 shadow-sm backdrop-blur-md">
                                            <tr><th className="px-6 py-5 rounded-l-xl font-black">ชื่อ-นามสกุล</th><th className="px-6 py-5 font-black">สาขาวิชา</th><th className="px-6 py-5 font-black">เงื่อนไข/อาการ</th><th className="px-6 py-5 rounded-r-xl font-black">ข้อมูลติดต่อ</th></tr>
                                        </thead>
                                        <tbody className="divide-y divide-slate-100 dark:divide-white/5">
                                            {drilldownData.list.map((row, idx) => (
                                                <tr key={idx} className="hover:bg-slate-50/80 dark:hover:bg-white/5 transition-colors">
                                                    <td className="px-6 py-5 font-bold text-slate-800 dark:text-white">{row.FullName}</td>
                                                    <td className="px-6 py-5 text-xs font-semibold text-slate-600 dark:text-slate-400">{row.Major}</td>
                                                    <td className="px-6 py-5">
                                                        <div className="flex flex-col gap-2">
                                                            {row.FoodAllergy && row.FoodAllergy !== 'ไม่แพ้' && <span className="text-orange-700 dark:text-orange-300 bg-orange-100 dark:bg-orange-900/40 px-3 py-1.5 rounded-lg text-xs font-bold w-max">แพ้: {row.FoodAllergy}</span>}
                                                            {row.SpecificDiet && row.SpecificDiet !== 'ไม่มี' && <span className="text-blue-700 dark:text-blue-300 bg-blue-100 dark:bg-blue-900/40 px-3 py-1.5 rounded-lg text-xs font-bold w-max">อาหาร: {row.SpecificDiet}</span>}
                                                            {row.Disease && row.Disease !== 'ไม่มี' && <span className="text-purple-700 dark:text-purple-300 bg-purple-100 dark:bg-purple-900/40 px-3 py-1.5 rounded-lg text-xs font-bold w-max">โรค: {row.Disease}</span>}
                                                            {row.DrugAllergy && row.DrugAllergy !== 'ไม่แพ้' && <span className="text-pink-700 dark:text-pink-300 bg-pink-100 dark:bg-pink-900/40 px-3 py-1.5 rounded-lg text-xs font-bold w-max">แพ้ยา: {row.DrugAllergy}</span>}
                                                        </div>
                                                    </td>
                                                    <td className="px-6 py-5 text-xs">
                                                        <div className="font-semibold text-slate-600 dark:text-slate-400 mb-1.5 flex items-center gap-1.5"><Icon name="phone" size={14}/> นศ: {row.StudentPhone}</div>
                                                        {row.ParentPhone && row.ParentPhone !== '-' && <div className="font-bold text-red-500 flex items-center gap-1.5"><Icon name="phone-call" size={14}/> ผปค: {row.ParentPhone}</div>}
                                                    </td>
                                                </tr>
                                            ))}
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* MODALS: Edit Modal */}
                    {editItem && (
                        <div className="fixed inset-0 z-[70] flex items-center justify-center p-4 sm:p-6 bg-slate-900/70 dark:bg-black/90 backdrop-blur-lg animate-fade-in print:hidden">
                            <div className="bg-white dark:bg-zinc-900 border border-slate-200 dark:border-white/10 p-6 md:p-8 rounded-[2.5rem] w-full max-w-lg max-h-[90vh] flex flex-col shadow-[0_20px_60px_rgba(0,0,0,0.3)] dark:shadow-[0_20px_60px_rgba(0,0,0,0.8)] animate-slide-up text-left overflow-hidden">
                                <div className="flex justify-between items-center mb-6 shrink-0">
                                    <h3 className="text-xl md:text-2xl font-black text-slate-800 dark:text-white flex items-center gap-3"><Icon name="edit" size={24}/> แก้ไขข้อมูลนักศึกษา</h3>
                                    <button onClick={() => setEditItem(null)} className="p-2.5 bg-slate-100 dark:bg-white/10 rounded-xl hover:bg-slate-200 transition-colors"><Icon name="x" size={20}/></button>
                                </div>
                                <form onSubmit={handleSaveEdit} className="space-y-5 overflow-y-auto flex-1 custom-scrollbar pr-2 pb-4">
                                    <div className="p-5 md:p-6 bg-slate-50/80 dark:bg-black/20 rounded-3xl border border-slate-200/60 dark:border-white/5 space-y-4 shadow-inner">
                                        <InputField label="ชื่อ-นามสกุล" value={editItem.FullName} onChange={v => setEditItem({...editItem, FullName: v})} />
                                        <div className="grid grid-cols-2 gap-4">
                                            <InputField label="รหัสนักศึกษา" numeric maxLength="9" value={editItem.StudentID} onChange={v => setEditItem({...editItem, StudentID: v})} />
                                            <InputField label="บัตรประชาชน/Passport" maxLength="20" value={editItem.IDCard || ''} onChange={v => setEditItem({...editItem, IDCard: v})} />
                                        </div>
                                        <InputField label="สาขาวิชา" value={editItem.Major} onChange={v => setEditItem({...editItem, Major: v})} />
                                        <div className="grid grid-cols-2 gap-4">
                                            <InputField label="ศาสนา" value={editItem.Religion || ''} onChange={v => setEditItem({...editItem, Religion: v})} />
                                            <InputField label="กรุ๊ปเลือด" value={editItem.BloodGroup || ''} onChange={v => setEditItem({...editItem, BloodGroup: v})} />
                                        </div>
                                        <div className="grid grid-cols-2 gap-4">
                                            <InputField label="เบอร์ นศ." numeric maxLength="10" value={editItem.StudentPhone} onChange={v => setEditItem({...editItem, StudentPhone: v})} />
                                            <InputField label="เบอร์ ผปค." numeric maxLength="10" value={editItem.ParentPhone} onChange={v => setEditItem({...editItem, ParentPhone: v})} />
                                        </div>
                                    </div>
                                    <div className="p-5 md:p-6 bg-orange-50/80 dark:bg-orange-950/20 rounded-3xl border border-orange-200/60 dark:border-orange-500/20 space-y-4 shadow-sm">
                                        <InputField label="แพ้อาหาร" value={editItem.FoodAllergy} onChange={v => setEditItem({...editItem, FoodAllergy: v})} />
                                        <InputField label="อาหารเฉพาะทาง" value={editItem.SpecificDiet} onChange={v => setEditItem({...editItem, SpecificDiet: v})} />
                                    </div>
                                    <div className="p-5 md:p-6 bg-red-50/80 dark:bg-red-950/20 rounded-3xl border border-red-200/60 dark:border-red-500/20 space-y-4 shadow-sm">
                                        <InputField label="โรคประจำตัว" value={editItem.Disease} onChange={v => setEditItem({...editItem, Disease: v})} />
                                        <InputField label="แพ้ยา" value={editItem.DrugAllergy} onChange={v => setEditItem({...editItem, DrugAllergy: v})} />
                                    </div>
                                    <div className="flex gap-4 pt-6 sticky bottom-0 bg-white dark:bg-zinc-900 pb-2 z-10 border-t border-slate-100 dark:border-white/5 mt-6">
                                        <button type="button" onClick={() => setEditItem(null)} className="flex-1 py-4 bg-slate-100 dark:bg-white/5 text-sm rounded-xl font-bold btn-interactive hover:bg-slate-200 dark:hover:bg-white/10 transition-colors text-slate-600 dark:text-slate-300">ยกเลิก</button>
                                        <button type="submit" className="flex-1 py-4 brand-gradient text-white text-sm rounded-xl font-bold shadow-glow-brand btn-interactive transform hover:-translate-y-0.5 transition-all flex items-center justify-center gap-2"><Icon name="save" size={18}/> บันทึกข้อมูล</button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        // ==========================================
        // 🚀 Main App 
        // ==========================================
        function App() {
            const [isDarkMode, setIsDarkMode] = useState(false);
            const [currentView, setCurrentView] = useState('home'); 
            
            useEffect(() => {
                const isDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
                setIsDarkMode(isDark);
            }, []);

            useEffect(() => {
                if (isDarkMode) document.documentElement.classList.add('dark');
                else document.documentElement.classList.remove('dark');
            }, [isDarkMode]);

            return (
                <AppContext.Provider value={{ isDarkMode }}>
                    <div className="min-h-screen p-4 md:p-6 transition-colors duration-300 relative">
                        {currentView === 'home' && <HomeView onSelectNewStudent={() => setCurrentView('pdpa')} onSelectActivity={() => setCurrentView('activity_form')} onAdminClick={() => setCurrentView('admin')} />}
                        {currentView === 'pdpa' && <PdpaModal onAccept={() => setCurrentView('register')} onBack={() => setCurrentView('home')} />}
                        {currentView === 'register' && <RegistrationForm onBack={() => setCurrentView('home')} onSuccess={() => setCurrentView('success')} />}
                        {currentView === 'activity_form' && <ActivityForm onBack={() => setCurrentView('home')} onSuccess={() => setCurrentView('success')} />}
                        {currentView === 'success' && <SuccessView onHome={() => setCurrentView('home')} />}
                        {currentView === 'admin' && <AdminDashboard goBack={() => setCurrentView('home')} />}

                        <div className="fixed bottom-6 right-6 flex flex-col gap-3 z-50 print:hidden">
                            <button onClick={() => setIsDarkMode(!isDarkMode)} className="w-12 h-12 bg-white dark:bg-zinc-800 text-slate-800 dark:text-white rounded-full shadow-lg border border-slate-200 dark:border-zinc-700 hover:scale-110 transition-transform flex items-center justify-center" title="สลับโหมดกลางคืน">
                                <Icon name={isDarkMode ? "sun" : "moon"} size={20} />
                            </button>
                        </div>
                    </div>
                </AppContext.Provider>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
