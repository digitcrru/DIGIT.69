<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DIGIT.69</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config={darkMode:'class',theme:{extend:{fontFamily:{sans:['Prompt','sans-serif']},colors:{brand:'#ff6600',brandDark:'#cc5200',brandLight:'#ff8533'},boxShadow:{'glow-brand':'0 0 25px rgba(255,102,0,0.4)','glow-red':'0 0 25px rgba(239,68,68,0.4)','soft':'0 20px 50px -12px rgba(0,0,0,0.1)'},animation:{'fade-in':'fadeIn 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards','slide-up':'slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards','pulse-slow':'pulse 4s cubic-bezier(0.4, 0, 0.6, 1) infinite'},keyframes:{fadeIn:{'0%':{opacity:'0'},'100%':{opacity:'1'}},slideUp:{'0%':{opacity:'0',transform:'translateY(30px)'},'100%':{opacity:'1',transform:'translateY(0)'}}}}}}
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-is@18/umd/react-is.production.min.js"></script>
    <script src="https://unpkg.com/prop-types@15.8.1/prop-types.min.js"></script>
    <script src="https://unpkg.com/recharts@2.1.12/umd/Recharts.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://cdn.jsdelivr.net/npm/@sweetalert2/theme-dark@4/dark.css" rel="stylesheet" id="swal-theme">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        body{background-color:#f8fafc;color:#334155;overflow-x:hidden;scroll-behavior:smooth;}
        .dark body{background-color:#050507;color:#cbd5e1;}
        body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background-image:radial-gradient(at 10% 10%,hsla(28,100%,74%,0.15) 0px,transparent 60%),radial-gradient(at 90% 10%,hsla(250,100%,74%,0.12) 0px,transparent 60%),radial-gradient(at 50% 90%,hsla(340,100%,74%,0.1) 0px,transparent 60%);}
        .dark body::before{background-image:radial-gradient(at 10% 10%,hsla(28,100%,50%,0.08) 0px,transparent 60%),radial-gradient(at 90% 10%,hsla(250,100%,50%,0.05) 0px,transparent 60%),radial-gradient(at 50% 90%,hsla(340,100%,50%,0.05) 0px,transparent 60%);}
        .glass-panel{background:rgba(255,255,255,0.75);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border:1px solid rgba(255,255,255,0.8);box-shadow:0 20px 40px -10px rgba(0,0,0,0.05);transition:all 0.4s cubic-bezier(0.4, 0, 0.2, 1);}
        .dark .glass-panel{background:rgba(20,20,23,0.75);border:1px solid rgba(255,255,255,0.05);box-shadow:0 20px 40px -10px rgba(0,0,0,0.5);}
        .input-modern{outline:none;background:rgba(255,255,255,0.9);border:1px solid #cbd5e1;color:#0f172a;transition:all 0.3s cubic-bezier(0.4, 0, 0.2, 1);border-radius:1rem;}
        .input-modern:focus{border-color:#ff6600;box-shadow:0 0 0 4px rgba(255,102,0,0.15);background:#ffffff;transform:translateY(-1px);}
        .dark .input-modern{background:rgba(0,0,0,0.4);border:1px solid rgba(255,255,255,0.1);color:#f8fafc;}
        .dark .input-modern:focus{border-color:#ff6600;box-shadow:0 0 0 4px rgba(255,102,0,0.2);background:rgba(0,0,0,0.6);}
        .brand-gradient{background:linear-gradient(135deg,#ff8533 0%,#ff6600 100%);}
        .brand-text-gradient{background-clip:text;-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-image:linear-gradient(135deg,#ff8533,#ff6600);}
        .btn-interactive{transition:all 0.3s cubic-bezier(0.4, 0, 0.2, 1);}.btn-interactive:active:not(:disabled){transform:scale(0.96);}
        .hover-card:hover{transform:translateY(-4px);box-shadow:0 25px 50px -12px rgba(0,0,0,0.15);}
        ::-webkit-scrollbar{width:8px;height:8px;}::-webkit-scrollbar-track{background:transparent;}.light-mode ::-webkit-scrollbar-thumb{background:#cbd5e1;border-radius:10px;}.dark ::-webkit-scrollbar-thumb{background:#3f3f46;border-radius:10px;}
        .custom-scrollbar::-webkit-scrollbar{width:6px;height:6px;}.custom-scrollbar::-webkit-scrollbar-track{background:transparent;}.custom-scrollbar::-webkit-scrollbar-thumb{background:rgba(156,163,175,0.5);border-radius:10px;}
        @media print{body{background:white!important;color:black!important;}body::before{display:none;}.no-print{display:none!important;}.print-area{display:block!important;width:100%!important;margin:0!important;padding:0!important;}.glass-panel{border:none!important;box-shadow:none!important;background:white!important;}.avoid-break{break-inside:avoid;}}
    </style>
</head>
<body>
    <div id="root"></div>
    <script type="text/babel">
        const { useState, useEffect, useMemo, useRef, createContext, useContext } = React;
        const { BarChart, Bar, XAxis, YAxis, Tooltip, ResponsiveContainer, PieChart, Pie, Cell, Legend } = window.Recharts || {};

        const AppContext = createContext();
        const API_URL = "https://script.google.com/macros/s/AKfycbwviBRd_BbtvGyEpZSq5ab5A0iEpXkG9iMwAUQyGyZb-nDI2R5-x8GE5ZEI3gpmzA3zug/exec";
        const SHEET_ID = "1MoZpnDniVF5pKr0tEgmYwlPO3wZdA7DaO_MvZjbC-ec";
        
        const REG_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&sheet=Registration`;
        const REG69_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&sheet=Registration69`;
        const ACT_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&sheet=Activities`;
        const LOGS_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&sheet=Logs`;
        const SURVEY_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&sheet=Surveys`;
        
        const MAJORS = ["เทคโนโลยีดิจิทัลเพื่อธุรกิจ","เทคโนโลยีดิจิทัลเพื่อธุรกิจ(เทียบโอน)","เทคโนโลยีปัญญาประดิษฐ์","เทคโนโลยีสารสนเทศ","เทคโนโลยีสารสนเทศ(เทียบโอน)","วิทยาการคอมพิวเตอร์","กราฟิกดีไซน์เทคโนโลยีสื่อดิจิทัล","กราฟิกดีไซน์สื่อศิลปะและการออกแบบ","กราฟิกดีไซน์สื่อศิลปะและการออกแบบ(เทียบโอน)","วิศวกรรมคอมพิวเตอร์"];
        const cleanMajor = (s) => s ? s.replace(/\s*\([^)]*\)/g, '').trim() : '';

        const submitAPI = async (action, payload) => {
            try { const res = await fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ action, payload }) }); return await res.json(); } 
            catch (err) { throw new Error("การเชื่อมต่อระบบล้มเหลว"); }
        };

        function Icon({ name, size=22, className='' }) {
            const r = useRef(null);
            useEffect(() => { if (r.current) { r.current.innerHTML = `<i data-lucide="${name}" class="${className}" style="width:${size}px; height:${size}px; stroke-width: 2.5;"></i>`; if (window.lucide) lucide.createIcons({ root: r.current }); } }, [name, size, className]);
            return <span ref={r} className={`inline-flex items-center justify-center shrink-0 ${className}`} />;
        }

        function StatCard({ label, value, icon, color, onClick, subtext }) {
            const c = {
                brand: { bg: 'bg-orange-50/80 dark:bg-orange-500/10 border-orange-200/50 dark:border-orange-500/20', text: 'text-brand', shadow: 'hover:shadow-[0_20px_40px_-10px_rgba(255,102,0,0.2)]' },
                emerald: { bg: 'bg-emerald-50/80 dark:bg-emerald-500/10 border-emerald-200/50 dark:border-emerald-500/20', text: 'text-emerald-600 dark:text-emerald-400', shadow: 'hover:shadow-[0_20px_40px_-10px_rgba(16,185,129,0.2)]' },
                red: { bg: 'bg-red-50/80 dark:bg-red-500/10 border-red-200/50 dark:border-red-500/20', text: 'text-red-600 dark:text-red-400', shadow: 'hover:shadow-[0_20px_40px_-10px_rgba(239,68,68,0.2)]' }
            }[color] || { bg: 'bg-slate-50/80 dark:bg-white/5 border-slate-200/50 dark:border-white/10', text: 'text-slate-600 dark:text-slate-400', shadow: 'hover:shadow-[0_20px_40px_-10px_rgba(0,0,0,0.1)]' };
            return (
                <div onClick={onClick} className={`p-8 rounded-[2rem] border ${c.bg} relative overflow-hidden transition-all duration-500 flex flex-col justify-between hover-card ${onClick ? `cursor-pointer btn-interactive ${c.shadow}` : ''}`}>
                    <div className={`absolute -right-4 -top-4 p-8 opacity-[0.04] transition-transform duration-700 group-hover:scale-125 ${c.text}`}><Icon name={icon} size={140} /></div>
                    <div className="flex justify-between items-start mb-6 relative z-10"><div className={`p-4 rounded-2xl bg-white/80 dark:bg-black/30 backdrop-blur-md shadow-sm ${c.text}`}><Icon name={icon} size={28} /></div></div>
                    <div className="relative z-10"><p className="text-slate-500 dark:text-slate-400 text-xs font-bold uppercase tracking-widest mb-2">{label}</p><div className="flex items-baseline gap-2"><h3 className="text-5xl font-black text-slate-800 dark:text-white drop-shadow-sm">{value}</h3>{subtext && <span className="text-sm font-bold text-slate-500">{subtext}</span>}</div></div>
                </div>
            );
        }

        function SecHeader({ icon, title, cClass }) {
            return <div className="flex items-center gap-4 mb-8 pb-4 border-b border-slate-200/60 dark:border-white/10"><div className={`p-3.5 rounded-2xl shadow-sm ${cClass}`}><Icon name={icon} size={24}/></div><h3 className="text-2xl font-black text-slate-800 dark:text-white tracking-tight">{title}</h3></div>;
        }

        function Input({ label, type="text", val, onChange, ph, max, req, num, rows, dis }) {
            return (
                <div className="flex flex-col gap-2 w-full group">
                    <label className="text-xs font-bold text-slate-600 dark:text-slate-400 uppercase tracking-widest transition-colors group-focus-within:text-brand">{label} {req && <span className="text-red-500">*</span>}</label>
                    {rows ? <textarea disabled={dis} value={val} onChange={e=>onChange(e.target.value)} placeholder={ph} maxLength={max} required={req} rows={rows} className="w-full input-modern px-5 py-4 text-sm font-medium resize-none disabled:opacity-50" /> : <input disabled={dis} type={type} value={val} onChange={e=>{let v=e.target.value;if(num)v=v.replace(/\D/g,'');onChange(v);}} placeholder={ph} maxLength={max} required={req} className={`w-full input-modern px-5 py-4 text-base font-medium ${num?'font-mono tracking-wider':''} disabled:opacity-50`} />}
                </div>
            );
        }

        // --- VIEWS ---
        function HomeView({ onNew, onAct, onChk, onAdmin, users, isRegOpen }) {
            const login = () => {
                Swal.fire({
                    title: '<h3 class="text-3xl font-black text-slate-800 dark:text-white mb-2">เข้าสู่ระบบหลังบ้าน</h3>',
                    html: `<div class="flex flex-col gap-5 text-left px-4 mt-4"><div><label class="text-xs font-bold text-slate-500 uppercase tracking-widest mb-2 block">Username</label><input id="sw-user" class="w-full input-modern px-5 py-4 text-base font-semibold shadow-sm" placeholder="ชื่อผู้ใช้งาน" autocapitalize="off"></div><div><label class="text-xs font-bold text-slate-500 uppercase tracking-widest mb-2 block">Password</label><input id="sw-pass" type="password" class="w-full input-modern px-5 py-4 text-base font-semibold shadow-sm font-mono tracking-widest" placeholder="••••••••"></div></div>`,
                    showCancelButton: true, confirmButtonText: 'เข้าสู่ระบบ', cancelButtonText: 'ยกเลิก', confirmButtonColor: '#ff6600',
                    customClass: { popup: 'rounded-[2.5rem] bg-white dark:bg-zinc-900 border border-slate-200/50 dark:border-white/5 shadow-2xl pb-8', confirmButton: 'rounded-2xl font-black px-10 py-4 shadow-md w-full sm:w-auto', cancelButton: 'rounded-2xl font-bold px-10 py-4 w-full sm:w-auto bg-slate-100 text-slate-600 dark:bg-white/5 dark:text-white', actions: 'flex gap-4 w-full justify-center px-8 mt-8' },
                    preConfirm: () => { const u=document.getElementById('sw-user').value.trim(); const p=document.getElementById('sw-pass').value.trim(); if(!u||!p)Swal.showValidationMessage('กรุณากรอกข้อมูลให้ครบถ้วน'); return {u,p}; }
                }).then((r) => {
                    if(r.isConfirmed) {
                        const fu = users.find(x => x.username===r.value.u && x.password===r.value.p && x.status==='Active');
                        if(fu) onAdmin(fu); else Swal.fire({icon:'error',title:'ล้มเหลว',text:'ข้อมูลผู้ใช้งานไม่ถูกต้อง',confirmButtonColor:'#ff6600',customClass:{popup:'rounded-[2.5rem] bg-white dark:bg-zinc-900 text-slate-800 dark:text-white'}});
                    }
                });
            };
            return (
                <div className="flex flex-col items-center justify-center min-h-[85vh] animate-fade-in relative px-4">
                    <button onClick={login} className="absolute top-2 right-2 md:top-6 md:right-6 p-4 text-slate-400 hover:text-brand bg-white/60 dark:bg-black/20 hover:bg-white dark:hover:bg-white/10 backdrop-blur-xl rounded-2xl shadow-sm border border-slate-200/50 dark:border-white/5 btn-interactive flex items-center gap-3"><span className="text-xs font-bold uppercase tracking-widest hidden sm:inline-block">Staff Login</span><Icon name="log-in" size={18} /></button>
                    <div className="text-center mb-12 mt-16 md:mt-10"><div className="inline-flex items-center justify-center p-6 bg-brand/10 text-brand rounded-[2.5rem] shadow-glow-brand mb-8 transform hover:scale-110 transition-transform duration-500 animate-pulse-slow"><Icon name="box" size={64} /></div><h1 className="text-6xl md:text-7xl font-black text-slate-800 dark:text-white tracking-tighter mb-4 drop-shadow-sm">DIGIT<span className="text-brand">.69</span></h1><p className="text-slate-500 font-bold text-sm md:text-base uppercase tracking-[0.3em]">Student Service Portal</p></div>
                    <div className="grid grid-cols-1 md:grid-cols-3 gap-6 md:gap-8 w-full max-w-6xl">
                        <div onClick={()=>{isRegOpen?onNew():Swal.fire({icon:'warning',title:'ปิดให้บริการ',text:'ขณะนี้ปิดรับขึ้นทะเบียนนักศึกษาใหม่ชั่วคราว',customClass:{popup:'rounded-[2.5rem] bg-white dark:bg-zinc-900 dark:text-white'}})}} className={`glass-panel p-10 rounded-[3rem] border-t-[8px] ${isRegOpen?'border-t-brand hover-card cursor-pointer group':'border-t-slate-400 opacity-80 cursor-not-allowed'} flex flex-col items-center text-center relative overflow-hidden`}>
                            <div className={`w-24 h-24 ${isRegOpen?'bg-brand/10 text-brand group-hover:scale-110 group-hover:bg-brand group-hover:text-white':'bg-slate-100 dark:bg-slate-800 text-slate-400'} rounded-[2rem] flex items-center justify-center mb-8 transition-all duration-500 shadow-inner`}><Icon name={isRegOpen?"user-plus":"lock"} size={44} /></div>
                            <h3 className="text-2xl font-black text-slate-800 dark:text-white mb-3">1. ขึ้นทะเบียน นศ.ใหม่</h3>
                            <p className="text-slate-500 font-medium text-sm leading-relaxed mb-6">{isRegOpen?'บันทึกประวัติ ข้อมูลสุขภาพ และโภชนาการ':'(ระบบปิดให้บริการชั่วคราว)'}</p>
                            <div className={`mt-auto w-full py-4 ${isRegOpen?'bg-slate-50 dark:bg-white/5 text-slate-600 dark:text-slate-300 group-hover:bg-brand/10 group-hover:text-brand':'bg-slate-100 dark:bg-slate-800 text-slate-400'} rounded-2xl font-bold transition-colors flex items-center justify-center gap-2`}>{isRegOpen?<>เริ่มต้น <Icon name="arrow-right" size={18}/></>:<>ระงับการใช้งาน</>}</div>
                        </div>
                        <div onClick={onAct} className="glass-panel p-10 rounded-[3rem] border-t-[8px] border-t-purple-500 hover-card cursor-pointer group flex flex-col items-center text-center relative overflow-hidden">
                            <div className="w-24 h-24 bg-purple-50 dark:bg-purple-500/10 text-purple-600 rounded-[2rem] flex items-center justify-center mb-8 group-hover:scale-110 group-hover:bg-purple-500 group-hover:text-white transition-all duration-500 shadow-inner"><Icon name="calendar-check" size={44} /></div>
                            <h3 className="text-2xl font-black text-slate-800 dark:text-white mb-3">2. ลงทะเบียนกิจกรรม</h3>
                            <p className="text-slate-500 font-medium text-sm leading-relaxed mb-6">ระบบเช็คชื่อเข้าร่วมกิจกรรมต่างๆ ของคณะ</p>
                            <div className="mt-auto w-full py-4 bg-slate-50 dark:bg-white/5 text-slate-600 dark:text-slate-300 group-hover:bg-purple-500/10 group-hover:text-purple-600 rounded-2xl font-bold transition-colors flex items-center justify-center gap-2">เริ่มต้น <Icon name="arrow-right" size={18}/></div>
                        </div>
                        <div onClick={onChk} className="glass-panel p-10 rounded-[3rem] border-t-[8px] border-t-blue-500 hover-card cursor-pointer group flex flex-col items-center text-center relative overflow-hidden">
                            <div className="w-24 h-24 bg-blue-50 dark:bg-blue-500/10 text-blue-600 rounded-[2rem] flex items-center justify-center mb-8 group-hover:scale-110 group-hover:bg-blue-500 group-hover:text-white transition-all duration-500 shadow-inner"><Icon name="history" size={44} /></div>
                            <h3 className="text-2xl font-black text-slate-800 dark:text-white mb-3">3. ตรวจสอบประวัติ</h3>
                            <p className="text-slate-500 font-medium text-sm leading-relaxed mb-6">ตรวจสอบประวัติการเข้าร่วมกิจกรรมของคุณ</p>
                            <div className="mt-auto w-full py-4 bg-slate-50 dark:bg-white/5 text-slate-600 dark:text-slate-300 group-hover:bg-blue-500/10 group-hover:text-blue-600 rounded-2xl font-bold transition-colors flex items-center justify-center gap-2">ตรวจสอบ <Icon name="arrow-right" size={18}/></div>
                        </div>
                    </div>
                </div>
            );
        }

        function CheckActivityView({ onBack }) {
            const [step, setStep] = useState(1); const [searchID, setSearchID] = useState(''); const [isSearching, setIsSearching] = useState(false); const [stdData, setStdData] = useState(null); const [acts, setActs] = useState([]);
            const handleSearch = (e) => {
                e.preventDefault(); if (!searchID.trim()) return Swal.fire({ icon: 'warning', title: 'กรุณากรอกรหัส', customClass:{popup:'rounded-[2.5rem]'} }); 
                setIsSearching(true);
                Papa.parse(`${REG69_URL}&_cb=${Date.now()}`, { download: true, header: true, complete: (res) => {
                        const f = res.data.find(r => r.IDCard?.trim()===searchID.trim() || r.StudentID?.trim()===searchID.trim());
                        if (!f) { Swal.fire({ icon:'error', title:'ไม่พบข้อมูล', customClass:{popup:'rounded-[2.5rem]'} }); setIsSearching(false); return; }
                        Papa.parse(`${LOGS_URL}&_cb=${Date.now()}`, { download: true, header: true, complete: (logRes) => {
                                setStdData({ FullName: f.FullName, StudentID: f.StudentID, Major: cleanMajor(f.Major), IDCard: f.IDCard });
                                setActs(logRes.data.filter(l => l.StudentID === f.StudentID)); setStep(2); setIsSearching(false);
                            }});
                    }
                });
            };
            return (
                <div className="max-w-3xl mx-auto animate-fade-in pb-12 pt-6"><button onClick={step===1?onBack:()=>setStep(1)} className="flex items-center gap-2 text-slate-500 font-bold mb-8 btn-interactive hover:text-blue-600 bg-white/50 dark:bg-white/5 px-5 py-2.5 rounded-full"><Icon name="arrow-left" size={18}/> {step===1?'ย้อนกลับ':'ค้นหาใหม่'}</button>
                    {step===1 && <form onSubmit={handleSearch} className="glass-panel p-12 rounded-[3rem] border-t-[8px] border-blue-500 text-center"><div className="w-24 h-24 bg-blue-50 dark:bg-blue-500/10 text-blue-600 rounded-[2rem] flex justify-center items-center mx-auto mb-8 shadow-inner"><Icon name="search" size={48}/></div><h2 className="text-3xl font-black dark:text-white mb-3">ตรวจสอบประวัติ</h2><p className="text-slate-500">กรอกรหัสนักศึกษา หรือ เลขบัตรประชาชน</p><div className="max-w-sm mx-auto mt-10"><input type="text" value={searchID} onChange={e=>setSearchID(e.target.value)} placeholder="รหัสนักศึกษา / เลขบัตร ปชช." className="w-full input-modern px-6 py-5 text-center font-mono font-bold text-lg mb-6 shadow-sm focus:border-blue-500 focus:shadow-[0_0_0_4px_rgba(59,130,246,0.15)]" required /><button type="submit" disabled={isSearching} className="w-full py-5 bg-blue-600 text-white rounded-2xl font-black text-lg btn-interactive shadow-lg shadow-blue-500/30 flex items-center justify-center gap-2">{isSearching?<><Icon name="loader-2" className="animate-spin"/> กำลังค้นหา</>:<><Icon name="search"/> ค้นหาข้อมูล</>}</button></div></form>}

                    <div className="glass-panel p-8 md:p-12 rounded-[3rem] border-t-[8px] border-orange-500"><SecHeader icon="pizza" title="โภชนาการ" cClass="bg-orange-100 text-orange-600"/><div className="space-y-8"><div className="bg-slate-50/50 dark:bg-black/10 p-6 rounded-[2rem] border border-slate-100 dark:border-white/5"><label className="text-sm font-black mb-4 block dark:text-white">1. อาหารเฉพาะทาง <span className="text-red-500">*</span></label><TogglePill options={[{label:'ไม่มี',value:'ไม่มี'},{label:'ฮาลาล',value:'ฮาลาล'},{label:'มังสวิรัติ',value:'มังสวิรัติ'},{label:'เจ',value:'เจ'}]} value={f.SpecificDiet} onChange={v=>setF({...f,SpecificDiet:v})} isWarningType/></div><div className="p-6 md:p-8 bg-orange-50/80 dark:bg-orange-500/10 rounded-[2rem] border border-orange-200 dark:border-orange-500/20"><label className="text-sm font-black mb-4 block dark:text-white">2. ประวัติแพ้อาหาร <span className="text-red-500">*</span></label><div className="flex flex-col sm:flex-row gap-4 mb-6"><label className="flex items-center gap-3 p-4 bg-white dark:bg-zinc-800 rounded-xl cursor-pointer shadow-sm border border-transparent hover:border-orange-300 transition-colors"><input type="radio" checked={!hF} onChange={()=>setHF(false)} className="w-5 h-5 accent-brand"/> <span className="font-bold">ไม่แพ้</span></label><label className="flex items-center gap-3 p-4 bg-white dark:bg-zinc-800 rounded-xl cursor-pointer shadow-sm border border-transparent hover:border-orange-300 transition-colors"><input type="radio" checked={hF} onChange={()=>setHF(true)} className="w-5 h-5 accent-brand"/> <span className="font-bold text-orange-600">มีประวัติแพ้อาหาร</span></label></div>{hF && <div className="animate-fade-in"><Input label="ระบุอาหารที่แพ้" val={f.FoodAllergy} onChange={v=>setF({...f,FoodAllergy:v})} req={hF}/></div>}</div></div></div>

e="flex items-center gap-3 p-4 bg-white dark:bg-zinc-800 rounded-xl cursor-pointer shadow-sm border border-transparent hover:border-purple-300 transition-colors"><input type="radio" checked={hDr} onChange={()=>setHDr(true)} className="w-5 h-5 accent-purple-500"/> <span className="font-bold text-purple-600">มีประวัติแพ้ยา</span></label></div>{hDr && <div className="animate-fade-in"><Input label="ระบุยาที่แพ้" val={f.DrugAllergy} onChange={v=>setF({...f,DrugAllergy:v})} req={hDr}/></div>}</div></div></div>
                    <div className="flex justify-center pt-4"><button type="submit" disabled={sub} className="w-full sm:w-auto px-16 py-5 brand-gradient text-white rounded-[2rem] font-black text-xl shadow-glow-brand btn-interactive flex items-center justify-center gap-3"><Icon name="save" size={24}/> บันทึกข้อมูลขึ้นทะเบียน</button></div>

        function ActivityForm({ onBack, onSuccess }) {
            const [step, setStep] = useState(1); const [sid, setSid] = useState(''); const [f, setF] = useState({}); const [sub, setSub] = useState(false); const [acts, setActs] = useState([]);
            useEffect(() => { Papa.parse(`${ACT_URL}&_cb=${Date.now()}`, { download:true, header:true, complete:res=>setActs(res.data.filter(r=>r.ActivityName&&r.Status!=='CLOSED').map(r=>r.ActivityName))}); }, []);
            const handleSearch = e => {
                e.preventDefault(); if(!sid.trim())return; setSub(true);
                Papa.parse(`${REG69_URL}&_cb=${Date.now()}`, {
                    download:true, header:true, complete: res => {
                        const row = res.data.filter(r=>r.FullName!=='SYSTEM_ACTIVITY_DEF').find(r=>(r.IDCard===sid.trim()||r.StudentID===sid.trim()));
                        if(row){setF({ActivityName:'',StudentID:row.StudentID||'',FullName:row.FullName||'',Major:cleanMajor(row.Major)||'',StudentPhone:row.StudentPhone||'',IDCard:row.IDCard||''});setStep(2);}
                        else Swal.fire({title:'ไม่พบข้อมูล', text:'กรุณาตรวจสอบรหัสอีกครั้ง หรือขึ้นทะเบียนก่อน', icon:'error', customClass:{popup:'rounded-[2.5rem]'}});
                        setSub(false);
                    }
                });

            const handleSubmit = async e => {

                try { const r=await submitAPI('log_activity',f); if(r.success){Swal.close();onSuccess(f.ActivityName,f.StudentID);}else throw new Error(r.message); } catch(err){Swal.fire('Error',err.message,'error');} finally{setSub(false);}
            };

iv>

            const submit = async e => { e.preventDefault(); if(!Object.values(r).every(v=>v>0))return Swal.fire({title:'แจ้งเตือน',text:'ประเมินให้ครบ 13 ข้อ',icon:'warning',customClass:{popup:'rounded-[2.5rem]'}}); setSub(true); Swal.fire({title:'บันทึก...',didOpen:()=>Swal.showLoading(),customClass:{popup:'rounded-[2.5rem] bg-white dark:bg-zinc-900'}}); try{const res=await submitAPI('save_survey',{ActivityName:activityName,StudentID:studentID,...r,Comment:cmt}); if(res.success){Swal.close();onSuccess();}else throw new Error(res.message);}catch(err){Swal.fire({icon:'error',text:err.message,customClass:{popup:'rounded-[2.5rem]'}});}finally{setSub(false);} };
            return (
                <div className="max-w-4xl mx-auto animate-fade-in pb-12 pt-6"><div className="text-center mb-10"><div className="w-24 h-24 mx-auto bg-purple-100 text-purple-600 rounded-[2rem] flex items-center justify-center mb-6 shadow-inner relative"><Icon name="clipboard-check" size={48}/><span className="absolute -top-2 -right-2 flex h-6 w-6"><span className="animate-ping absolute inline-flex h-full w-full rounded-full bg-purple-400 opacity-75"></span><span className="relative inline-flex rounded-full h-6 w-6 bg-purple-500 border-2 border-white"></span></span></div><h2 className="text-3xl md:text-4xl font-black dark:text-white mb-3">แบบประเมินความพึงพอใจ</h2><span className="inline-block px-5 py-2 bg-slate-100 dark:bg-white/5 rounded-full font-bold text-slate-700 dark:text-slate-300 text-sm">{activityName}</span></div><form onSubmit={submit} className="space-y-8">
                {qs.map((sec, i)=><div key={i} className="glass-panel p-6 md:p-10 rounded-[3rem] shadow-soft"><h3 className={`text-xl md:text-2xl font-black mb-8 pb-4 border-b border-slate-200/50 dark:border-white/10 ${sec.c}`}>{sec.t}</h3><div className="space-y-6">{sec.q.map(q=><div key={q.id} className={`p-6 rounded-[2rem] border border-slate-100 dark:border-white/5 ${sec.b}`}><p className="font-bold dark:text-white mb-5 text-base md:text-lg">{q.t}</p><div className="flex gap-2 sm:gap-4">{[1,2,3,4,5].map(s=><button key={s} type="button" onClick={()=>setR({...r,[q.id]:s})} className={`flex-1 py-3 sm:py-4 rounded-2xl font-black transition-all btn-interactive flex flex-col items-center justify-center gap-1 ${r[q.id]===s?'bg-purple-600 text-white shadow-lg transform scale-105':'bg-white dark:bg-zinc-800 text-slate-400 border border-slate-200 dark:border-white/10 hover:border-purple-300'}`}><span className="text-2xl leading-none">{s}</span><span className="text-[10px] sm:text-xs font-bold opacity-80">{s===5?'มากสุด':s===4?'มาก':s===3?'ปานกลาง':s===2?'น้อย':'น้อยสุด'}</span></button>)}</div></div>)}</div></div>)}

        // ==========================================
        // 📊 Admin Dashboard

        function AdminDashboard({ goBack, curUser, isRegOpen, setRegOpen }) {
            const { isDarkMode = false } = useContext(AppContext) || {};
            const [data, setData] = useState([]); const [loading, setLoading] = useState(true); const [actTab, setActTab] = useState('overview'); const [dd, setDd] = useState({t:'', l:[], ty:''}); const [search, setSearch] = useState(''); const [actDefs, setActDefs] = useState([]); const [actLogs, setActLogs] = useState([]); const [surveys, setSurveys] = useState([]); const [actForm, setActForm] = useState({n:'',d:'',l:''}); const [showChart, setShowChart] = useState(false);
            const [adminList, setAdminList] = useState([{id:1,user:'admin',role:'Super Admin',status:'Active'},{id:2,user:'staff1',role:'Manager',status:'Active'},{id:3,user:'guest',role:'Viewer',status:'Inactive'}]);
            const [uForm, setUForm] = useState({id:null,user:'',pass:'',role:'Manager',status:'Active'}); const [showU, setShowU] = useState(false); const [selSurvey, setSelSurvey] = useState('ทั้งหมด');

            useEffect(() => {

                l(); const i = setInterval(()=>l(true), 5000); return ()=>clearInterval(i);
            }, []);

            const toggleActStatus = async (actName, curStatus) => {
                const nStatus = curStatus === 'CLOSED' ? 'OPEN' : 'CLOSED';
                setActDefs(prev => prev.map(a => a.ActivityName === actName ? { ...a, Status: nStatus } : a));
                try {
                    const res = await submitAPI('toggle_activity', { ActivityName: actName, Status: nStatus });
                    if (!res.success) throw new Error(res.message);
                } catch (err) {
                    Swal.fire({icon:'error', text:err.message, customClass:{popup:'rounded-[2.5rem]'}});
                }
            };

            const TABS = [{id:'overview',l:'ภาพรวม',i:'users',r:['Super Admin','Manager','Viewer']},{id:'majors',l:'สาขาวิชา',i:'pie-chart',r:['Super Admin','Manager','Viewer']},{id:'health',l:'สุขภาพ/โภชนาการ',i:'activity',r:['Super Admin','Manager']},{id:'surv',l:'กลุ่มเฝ้าระวัง',i:'shield-alert',r:['Super Admin','Manager']},{id:'create_act',l:'จัดการกิจกรรม',i:'calendar-plus',r:['Super Admin','Manager']},{id:'act_sum',l:'Real-Time Logs',i:'radio',r:['Super Admin','Manager','Viewer']},{id:'survey',l:'SPSS Report',i:'star',r:['Super Admin','Manager','Viewer']},{id:'users',l:'จัดการแอดมิน',i:'users-cog',r:['Super Admin']},{id:'settings',l:'ตั้งค่าระบบ',i:'settings',r:['Super Admin','Manager']}].filter(t=>t.r.includes(curUser?.role));
            useEffect(()=>{if(!TABS.find(t=>t.id===actTab))setActTab(TABS[0].id);},[actTab, TABS]);

            const fData = useMemo(()=>data.filter(r=>search?((r.FullName||'').includes(search)||(r.StudentID||'').includes(search)):true), [data, search]);
            const stats = useMemo(()=>{
                const sd = fData.filter(r=>r.FullName!=='SYSTEM_ACTIVITY_DEF'); const um = new Map(); sd.forEach(s=>um.set(s.StudentID||s.IDCard||Math.random(), s)); const us = Array.from(um.values());
                let mc={}, ds={'ฮาลาล':0,'มังสวิรัติ':0,'เจ':0,'ไม่มี':0}, fa=[], md=[], ma=[]; const sl=[]; let sp={'ด้านการแพทย์':0,'ด้านโภชนาการ':0,'เสี่ยงซ้อน':0};
                us.forEach(s=>{ if(s.Major) mc[s.Major]=(mc[s.Major]||0)+1; let hF=s.FoodAllergy!=='ไม่แพ้'||s.SpecificDiet!=='ไม่มี'; let hH=s.Disease!=='ไม่มี'||s.DrugAllergy!=='ไม่แพ้'; if(s.FoodAllergy!=='ไม่แพ้')fa.push(s); if(s.SpecificDiet)ds[s.SpecificDiet]=(ds[s.SpecificDiet]||0)+1; if(s.Disease!=='ไม่มี')md.push(s); if(s.DrugAllergy!=='ไม่แพ้')ma.push(s); if(hF||hH){sl.push({...s,i:[]}); if(hF&&hH)sp['เสี่ยงซ้อน']++;else if(hF)sp['ด้านโภชนาการ']++;else sp['ด้านการแพทย์']++;} });
                return { t:us.length, pd:Object.keys(mc).map(k=>({name:k,value:mc[k]})), c:['#ff6600','#3b82f6','#10b981','#8b5cf6','#ec4899','#facc15','#06b6d4'], fA:fa.length, hA:md.length+ma.length, sl, sp:Object.keys(sp).map(k=>({name:k,value:sp[k]})).filter(d=>d.value>0), us, fa, md, ma, ds };
            },[fData]);

            const sStats = useMemo(()=>{

                const qm = {q1_1:'1.1 ประชาสัมพันธ์',q1_2:'1.2 สถานที่',q1_3:'1.3 ระยะเวลา',q1_4:'1.4 ขั้นตอน',q2_1:'2.1 เอกสาร',q2_2:'2.2 โสตทัศนูปกรณ์',q2_3:'2.3 เจ้าหน้าที่',q2_4:'2.4 อาหาร',q3_1:'3.1 ได้ความรู้',q3_2:'3.2 นำไปใช้ได้',q3_3:'3.3 ตรงคาดหวัง',q3_4:'3.4 เอื้อต่อเรียนรู้',q3_5:'3.5 ประโยชน์'};
                let cd=[], flat=[]; let oSum=0, aVals=[];

                    const mean=vals.length?sum/vals.length:0; oSum+=sum; aVals.push(...vals);
                    cd.push({name:k.replace('_','.').replace('q',''), q:qm[k], 5:cnt[5], 4:cnt[4], 3:cnt[3], 2:cnt[2], 1:cnt[1]});
                    flat.push({id:k, q:qm[k], mean:mean.toFixed(2), interp:mean>=4.5?'มากที่สุด':mean>=3.5?'มาก':mean>=2.5?'ปานกลาง':mean>=1.5?'น้อย':mean>0?'น้อยที่สุด':'ไม่มีข้อมูล'});
                });
                return { t, oMean: aVals.length?(oSum/aVals.length).toFixed(2):0, cd, flat, cmts:cmts.filter((v,i,a)=>a.findIndex(t=>(t.text===v.text))===i) };
            }, [surveys, selSurvey]);

            const dl = (t, ty, k) => {

                    {dd.l.length > 0 && <div className="fixed inset-0 z-[90] flex items-center justify-center p-4 sm:p-6 bg-slate-900/80 backdrop-blur-md print:hidden animate-fade-in"><div className="bg-white dark:bg-zinc-900 border border-slate-200 dark:border-white/10 p-8 md:p-10 rounded-[3rem] w-full max-w-4xl max-h-[90vh] flex flex-col shadow-2xl animate-slide-up"><div className="flex flex-col sm:flex-row justify-between items-start sm:items-center mb-8 gap-4"><h3 className="text-2xl font-black dark:text-white leading-tight">{dd.t} <span className="block sm:inline text-brand text-sm bg-brand/10 px-3 py-1.5 rounded-lg sm:ml-2 mt-2 sm:mt-0 font-bold">{dd.l.length} รายการ</span></h3><button onClick={()=>setDd({t:'',l:[],ty:''})} className="p-3 bg-slate-100 dark:bg-white/10 rounded-2xl hover:bg-slate-200 transition-colors btn-interactive"><Icon name="x"/></button></div><div className="overflow-y-auto flex-1 custom-scrollbar -mx-2 px-2"><table className="w-full text-sm text-left"><thead className="text-[11px] text-slate-500 uppercase tracking-widest sticky top-0 bg-white/95 dark:bg-zinc-900/95 backdrop-blur-md z-10"><tr><th className="py-4 px-4 font-black rounded-l-xl">ชื่อ-นามสกุล</th><th className="py-4 px-4 font-black">รหัส/ปชช.</th><th className="py-4 px-4 font-black">สาขาวิชา</th><th className="py-4 px-4 font-black rounded-r-xl">ข้อมูลติดต่อ</th></tr></thead><tbody className="divide-y divide-slate-100 dark:divide-white/5">{dd.l.map((r,i)=><tr key={i} className="hover:bg-slate-50/80 dark:hover:bg-white/5 transition-colors"><td className="py-4 px-4 font-bold dark:text-white">{r.FullName}</td><td className="py-4 px-4 font-mono text-xs font-bold text-brand">{r.StudentID||r.IDCard}</td><td className="py-4 px-4 text-xs font-semibold text-slate-500">{r.Major}</td><td className="py-4 px-4 text-xs"><div className="font-semibold text-slate-600 dark:text-slate-400 mb-1 flex items-center gap-1.5"><Icon name="phone" size={12}/> {r.StudentPhone}</div>{r.ParentPhone && r.ParentPhone!=='-' && <div className="font-bold text-red-500 flex items-center gap-1.5"><Icon name="phone-call" size={12}/> {r.ParentPhone}</div>}</td></tr>)}</tbody></table></div></div></div>}
                    {showU && <div className="fixed inset-0 z-[90] flex items-center justify-center p-4 sm:p-6 bg-slate-900/80 backdrop-blur-md print:hidden animate-fade-in"><div className="bg-white dark:bg-zinc-900 p-8 md:p-10 rounded-[3rem] w-full max-w-md shadow-2xl animate-slide-up"><div className="flex justify-between items-center mb-8"><h3 className="text-2xl font-black dark:text-white flex items-center gap-2"><Icon name={uForm.id?'edit':'user-plus'} className="text-brand"/> {uForm.id?'แก้ไขแอดมิน':'เพิ่มแอดมิน'}</h3><button onClick={()=>setShowU(false)} className="p-3 bg-slate-100 dark:bg-white/10 rounded-2xl hover:bg-slate-200 transition-colors btn-interactive"><Icon name="x"/></button></div><form onSubmit={e=>{e.preventDefault(); if(uForm.id) setAdminList(adminList.map(u=>u.id===uForm.id?uForm:u)); else setAdminList([...adminList, {...uForm, id:Date.now()}]); setShowU(false); Swal.fire({icon:'success',title:'สำเร็จ',timer:1500,showConfirmButton:false,customClass:{popup:'rounded-[2.5rem]'}} );}} className="space-y-5"><Input label="Username" val={uForm.user} onChange={v=>setUForm({...uForm,user:v})} req dis={uForm.user==='admin'}/><Input type="password" label={uForm.id?"รหัสผ่านใหม่":"รหัสผ่าน"} val={uForm.pass} onChange={v=>setUForm({...uForm,pass:v})} req={!uForm.id}/><div className="flex flex-col gap-2"><label className="text-xs font-bold uppercase tracking-widest text-slate-600 dark:text-slate-400">สิทธิ์</label><select value={uForm.role} onChange={e=>setUForm({...uForm,role:e.target.value})} className="input-modern px-5 py-4 text-sm font-semibold disabled:opacity-50" disabled={uForm.user==='admin'}><option value="Manager">Manager</option><option value="Viewer">Viewer</option>{curUser?.role==='Super Admin'&&<option value="Super Admin">Super Admin</option>}</select></div><button type="submit" className="w-full py-4 brand-gradient text-white rounded-2xl font-black text-lg mt-6 shadow-glow-brand hover:-translate-y-1 transition-all btn-interactive">บันทึกข้อมูล</button></form></div></div>}
                </div>
            );
        }

        function App() {
            const [isDarkMode, setIsDarkMode] = useState(false); const [currentView, setCurrentView] = useState('home'); const [surveyData, setSurveyData] = useState({ act: '', sid: '' }); const [currentUser, setCurrentUser] = useState(null);
            const [isRegOpen, setRegOpen] = useState(()=>{ try { const s = localStorage.getItem('digit69_isRegOpen'); return s!==null?s==='true':true; } catch(e) { return true; } });
            const [mockUsers] = useState([{ id: 1, username: 'admin', password: '0000', role: 'Super Admin', status: 'Active' }, { id: 2, username: 'staff', password: '0000', role: 'Manager', status: 'Active' }]);
            
            useEffect(() => { const isDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches; setIsDarkMode(isDark); }, []);
            useEffect(() => { if (isDarkMode) document.documentElement.classList.add('dark'); else document.documentElement.classList.remove('dark'); }, [isDarkMode]);

            return (
                <AppContext.Provider value={{ isDarkMode }}>
                    <div className="min-h-screen p-4 md:p-6 transition-colors duration-300 relative max-w-7xl mx-auto">
                        <div className="flex justify-between items-center mb-8 bg-white/50 dark:bg-black/20 p-4 rounded-[2rem] shadow-sm border border-slate-200/50 dark:border-white/5 backdrop-blur-md sticky top-4 z-50 print:hidden"><div className="flex items-center gap-4 cursor-pointer group" onClick={() => setCurrentView('home')}><div className="w-14 h-14 bg-brand text-white rounded-2xl flex items-center justify-center font-black text-2xl shadow-glow-brand group-hover:scale-110 transition-transform">D</div><div><h2 className="font-black text-slate-800 dark:text-white leading-none text-xl md:text-2xl group-hover:text-brand transition-colors tracking-tight">DIGIT<span className="text-brand">.69</span></h2><p className="text-[9px] md:text-[10px] font-bold text-slate-500 uppercase tracking-[0.2em] mt-0.5">Service Portal</p></div></div>{currentUser && currentView !== 'home' && currentView !== 'admin' && <button onClick={() => setCurrentView('admin')} className="px-5 py-3 bg-slate-800 dark:bg-white text-white dark:text-black rounded-xl text-sm font-bold shadow-md btn-interactive flex items-center gap-2"><Icon name="layout-dashboard" size={16}/> ไปหน้าหลังบ้าน</button>}</div>
                        {currentView === 'home' && <HomeView onNew={() => setCurrentView('pdpa')} onAct={() => setCurrentView('activity_form')} onChk={() => setCurrentView('check_activity')} onAdmin={(u) => { setCurrentUser(u); setCurrentView('admin'); }} users={mockUsers} isRegOpen={isRegOpen} />}
                        {currentView === 'pdpa' && <PdpaModal onAccept={() => setCurrentView('register')} onBack={() => setCurrentView('home')} />}
                        {currentView === 'register' && <RegistrationForm onBack={() => setCurrentView('home')} onSuccess={() => setCurrentView('success')} />}
                        {currentView === 'activity_form' && <ActivityForm onBack={() => setCurrentView('home')} onSuccess={(act, sid) => { setSurveyData({act, sid}); setCurrentView('survey_form'); }} />}
                        {currentView === 'check_activity' && <CheckActivityView onBack={() => setCurrentView('home')} />}
                        {currentView === 'survey_form' && <SurveyForm onBack={() => setCurrentView('home')} onSuccess={() => setCurrentView('success')} activityName={surveyData.act} studentID={surveyData.sid} />}
                        {currentView === 'success' && <SuccessView onHome={() => setCurrentView('home')} />}
                        {currentView === 'admin' && <AdminDashboard goBack={() => { setCurrentUser(null); setCurrentView('home'); }} curUser={currentUser} isRegOpen={isRegOpen} setRegOpen={setRegOpen} />}
                        <button onClick={() => setIsDarkMode(!isDarkMode)} className="fixed bottom-6 right-6 w-14 h-14 bg-white dark:bg-zinc-800 text-slate-800 dark:text-white rounded-full shadow-2xl hover:scale-110 transition-transform flex items-center justify-center z-50 print:hidden border border-slate-100 dark:border-zinc-700"><Icon name={isDarkMode ? "sun" : "moon"} size={24} /></button>
                    </div>
                </AppContext.Provider>
            );
        }
        const root = ReactDOM.createRoot(document.getElementById('root')); root.render(<App />);
    </script>
</body>
</html>
