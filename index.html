                                            </tr>
                                        </thead>
                                        <tbody className="divide-y divide-slate-100 dark:divide-white/5">
                                            {drilldownData.list.map((row, idx) => (
                                                <tr key={idx} className="hover:bg-slate-50/80 dark:hover:bg-white/5 transition-colors">
                                                    <td className="px-6 py-5 font-bold text-slate-800 dark:text-white">{row.FullName}</td>
                                                    <td className="px-6 py-5 text-xs font-semibold text-slate-600 dark:text-slate-400">{row.Major}</td>
                                                    {drilldownData.type !== 'demographics' && drilldownData.title !== 'นักศึกษาที่ขึ้นทะเบียนทั้งหมด' && (
                                                        <td className="px-6 py-5">
                                                            <div className="flex flex-col gap-2">
                                                                {row.FoodAllergy !== 'ไม่แพ้' && (!drilldownData.type || drilldownData.type === 'food_allergy' || drilldownData.type === 'food_alert' || drilldownData.type === 'health_alert') && <span className="text-orange-700 dark:text-orange-300 bg-orange-100 dark:bg-orange-900/40 px-3 py-1.5 rounded-lg text-xs font-bold w-max border border-orange-200 dark:border-orange-800/50">แพ้: {row.FoodAllergy}</span>}
                                                                {row.SpecificDiet !== 'ไม่มี' && (!drilldownData.type || drilldownData.type === 'religion_diet' || drilldownData.type === 'food_alert') && <span className="text-blue-700 dark:text-blue-300 bg-blue-100 dark:bg-blue-900/40 px-3 py-1.5 rounded-lg text-xs font-bold w-max border border-blue-200 dark:border-blue-800/50">อาหาร: {row.SpecificDiet}</span>}
                                                                {row.Disease !== 'ไม่มี' && (!drilldownData.type || drilldownData.type === 'disease' || drilldownData.type === 'health_alert') && <span className="text-purple-700 dark:text-purple-300 bg-purple-100 dark:bg-purple-900/40 px-3 py-1.5 rounded-lg text-xs font-bold w-max border border-purple-200 dark:border-purple-800/50">โรค: {row.Disease}</span>}
                                                                {row.DrugAllergy !== 'ไม่แพ้' && (!drilldownData.type || drilldownData.type === 'drug_allergy' || drilldownData.type === 'health_alert') && <span className="text-pink-700 dark:text-pink-300 bg-pink-100 dark:bg-pink-900/40 px-3 py-1.5 rounded-lg text-xs font-bold w-max border border-pink-200 dark:border-pink-800/50">แพ้ยา: {row.DrugAllergy}</span>}
                                                            </div>
                                                        </td>
                                                    )}
                                                    <td className="px-6 py-5 text-xs">
                                                        <div className="font-semibold text-slate-600 dark:text-slate-400 mb-1.5 flex items-center gap-1.5"><Icon name="user" size={14}/> นศ: {row.StudentPhone}</div>
                                                        <div className="font-bold text-red-500 flex items-center gap-1.5"><Icon name="phone-call" size={14}/> ผปค: {row.ParentPhone}</div>
                                                    </td>
                                                </tr>
                                            ))}
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Surveillance Detail Modal */}
                    {selectedSurveillanceStudent && (() => {
                        const isSafe = selectedSurveillanceStudent.issues.length === 0;
                        return (
                        <div className="fixed inset-0 z-[80] flex items-center justify-center p-4 sm:p-6 bg-slate-900/70 dark:bg-black/90 backdrop-blur-lg animate-fade-in">
                            <div className={`bg-white dark:bg-zinc-900 p-8 rounded-[2.5rem] w-full max-w-md ${isSafe ? 'shadow-[0_20px_60px_rgba(16,185,129,0.2)] border-emerald-500/30' : 'shadow-[0_20px_60px_rgba(239,68,68,0.2)] border-red-500/30'} border shadow-2xl animate-slide-up text-left overflow-hidden relative`}>
                                <div className={`absolute top-0 left-0 right-0 h-2.5 bg-gradient-to-r ${isSafe ? 'from-emerald-400 to-teal-500' : 'from-red-500 to-orange-500'} z-20`}></div>
                                
                                <div className="flex justify-between items-center mb-8 mt-2">
                                    <h3 className="text-xl md:text-2xl font-black text-slate-800 dark:text-white flex items-center gap-3">
                                        <div className={`p-3 rounded-2xl shadow-sm ${isSafe ? 'bg-emerald-100 dark:bg-emerald-500/20 text-emerald-600' : 'bg-red-100 dark:bg-red-500/20 text-red-600'}`}><Icon name={isSafe ? "user-check" : "shield-alert"} size={24}/></div> 
                                        {isSafe ? 'ข้อมูลนักศึกษา' : 'เฝ้าระวังพิเศษ'}
                                    </h3>
                                    <button onClick={() => setSelectedSurveillanceStudent(null)} className="p-2.5 bg-slate-100 dark:bg-white/10 rounded-xl text-slate-500 hover:bg-slate-200 hover:text-slate-800 dark:hover:text-white btn-interactive transition-colors"><Icon name="x" size={18}/></button>
                                </div>
                                
                                <div className="bg-slate-50 dark:bg-black/20 p-6 rounded-3xl border border-slate-200/60 dark:border-white/5 mb-6 shadow-inner">
                                    <h4 className="text-xl font-black text-slate-800 dark:text-white mb-2">{selectedSurveillanceStudent.FullName}</h4>
                                    <p className="text-sm font-semibold text-slate-500 dark:text-slate-400 mb-6">{selectedSurveillanceStudent.Major}</p>
                                    
                                    <div className="flex flex-col gap-3 text-sm">
                                        <div className="flex justify-between border-b border-slate-200/80 dark:border-white/10 pb-3">
                                            <span className="text-slate-500 flex items-center gap-2"><Icon name="smartphone" size={16}/> เบอร์ นศ.</span>
                                            <span className="font-bold text-slate-800 dark:text-slate-200">{selectedSurveillanceStudent.StudentPhone}</span>
                                        </div>
                                        <div className="flex justify-between pt-1">
                                            <span className="text-slate-500 flex items-center gap-2"><Icon name="phone" size={16}/> เบอร์ ผปค.</span>
                                            <span className="font-black text-red-500 flex items-center gap-1.5"><Icon name="alert-circle" size={14}/> {selectedSurveillanceStudent.ParentPhone}</span>
                                        </div>
                                    </div>
                                </div>
                                
                                <div className={`p-6 rounded-3xl border shadow-sm ${isSafe ? 'bg-emerald-50/80 dark:bg-emerald-950/30 border-emerald-200/60 dark:border-emerald-500/20' : 'bg-red-50/80 dark:bg-red-950/30 border-red-200/60 dark:border-red-500/20'}`}>
                                    <p className={`text-xs font-black uppercase mb-4 tracking-widest ${isSafe ? 'text-emerald-700 dark:text-emerald-400' : 'text-red-700 dark:text-red-400'}`}>ประเด็นเสี่ยง ({selectedSurveillanceStudent.issues.length})</p>
                                    <div className="space-y-3">
                                        {isSafe ? (
                                            <div className="flex items-center gap-2.5 text-emerald-600 dark:text-emerald-400 text-sm font-bold bg-white/50 dark:bg-black/20 p-4 rounded-xl border border-emerald-100 dark:border-emerald-900/30">
                                                <Icon name="check-circle" size={20}/> ปกติ (ไม่มีประเด็นเฝ้าระวัง)
                                            </div>
                                        ) : (
                                            selectedSurveillanceStudent.issues.map((iss, idx) => (
                                                <div key={idx} className={`p-4 rounded-2xl border flex items-start gap-3.5 text-sm font-bold shadow-sm
                                                    ${iss.type === 'food' ? 'bg-white dark:bg-zinc-800/80 border-orange-200 dark:border-orange-500/30 text-orange-800 dark:text-orange-300' : 'bg-white dark:bg-zinc-800/80 border-red-200 dark:border-red-500/30 text-red-800 dark:text-red-300'}`}>
                                                    <div className={`p-2 rounded-xl shrink-0 ${iss.type === 'food' ? 'bg-orange-100 dark:bg-orange-500/20 text-orange-600' : 'bg-red-100 dark:bg-red-500/20 text-red-600'}`}>
                                                        <Icon name={iss.type === 'food' ? 'pizza' : 'heart-pulse'} size={18}/>
                                                    </div>
                                                    <span className="mt-1.5">{iss.text}</span>
                                                </div>
                                            ))
                                        )}
                                    </div>
                                </div>
                            </div>
                        </div>
                        );
                    })()}

                    {/* Majors Modal (เมื่อคลิกจาก Pie Chart) */}
                    {selectedMajor && (
                        <div className="fixed inset-0 z-[60] flex items-center justify-center p-4 sm:p-6 bg-slate-900/70 dark:bg-black/90 backdrop-blur-lg animate-fade-in">
                            <div className="bg-white dark:bg-zinc-900 border border-slate-200 dark:border-white/10 p-6 md:p-8 rounded-[2.5rem] w-full max-w-4xl max-h-[90vh] flex flex-col shadow-[0_20px_60px_rgba(0,0,0,0.3)] dark:shadow-[0_20px_60px_rgba(0,0,0,0.8)] animate-slide-up text-left overflow-hidden">
                                <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 mb-6 shrink-0">
                                    <h3 className="text-2xl md:text-3xl font-black brand-text-gradient flex items-center gap-3">
                                        <div className="p-3 bg-brand/10 rounded-2xl text-brand shadow-sm"><Icon name="book-open" size={24}/></div> 
                                        {selectedMajor}
                                    </h3>
                                    <button onClick={() => setSelectedMajor(null)} className="p-2.5 bg-slate-100 dark:bg-white/10 rounded-xl text-slate-500 hover:bg-slate-200 hover:text-slate-800 dark:hover:text-white btn-interactive transition-colors"><Icon name="x" size={20}/></button>
                                </div>
                                <div className="overflow-y-auto flex-1 custom-scrollbar -mx-2 px-2">
                                    <table className="w-full text-sm text-left">
                                        <thead className="text-xs text-slate-500 uppercase tracking-widest bg-slate-100/80 dark:bg-zinc-800/80 sticky top-0 rounded-xl shadow-sm backdrop-blur-md">
                                            <tr>
                                                <th className="px-6 py-5 rounded-l-xl font-black">รหัส นศ.</th>
                                                <th className="px-6 py-5 font-black">ชื่อ-นามสกุล</th>
                                                <th className="px-6 py-5 rounded-r-xl font-black">เบอร์ติดต่อ</th>
                                            </tr>
                                        </thead>
                                        <tbody className="divide-y divide-slate-100 dark:divide-white/5">
                                            {filteredData.filter(s => s.Major === selectedMajor).map((row, i) => (
                                                <tr key={i} className="hover:bg-slate-50/80 dark:hover:bg-white/5 transition-colors">
                                                    <td className="px-6 py-5 font-mono text-xs font-bold text-slate-500 dark:text-slate-400">{row.StudentID}</td>
                                                    <td className="px-6 py-5 font-bold text-slate-800 dark:text-white">{row.FullName}</td>
                                                    <td className="px-6 py-5 text-xs">
                                                        <div className="font-semibold text-slate-600 dark:text-slate-300 mb-1 flex items-center gap-1.5"><Icon name="user" size={14}/> นศ: {row.StudentPhone}</div>
                                                        <div className="font-bold text-red-500 flex items-center gap-1.5"><Icon name="phone-call" size={14}/> ผปค: {row.ParentPhone}</div>
                                                    </td>
                                                </tr>
                                            ))}
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Edit Modal */}
                    {editItem && (
                        <div className="fixed inset-0 z-[70] flex items-center justify-center p-4 sm:p-6 bg-slate-900/70 dark:bg-black/90 backdrop-blur-lg animate-fade-in">
                            <div className="bg-white dark:bg-zinc-900 border border-slate-200 dark:border-white/10 p-6 md:p-8 rounded-[2.5rem] w-full max-w-lg max-h-[90vh] flex flex-col shadow-[0_20px_60px_rgba(0,0,0,0.3)] dark:shadow-[0_20px_60px_rgba(0,0,0,0.8)] animate-slide-up text-left overflow-hidden">
                                <div className="flex justify-between items-center mb-6 shrink-0">
                                    <h3 className="text-xl md:text-2xl font-black text-slate-800 dark:text-white flex items-center gap-3">
                                        <div className="p-3 bg-blue-500/10 text-blue-500 rounded-2xl shadow-sm"><Icon name="edit" size={24}/></div> แก้ไขข้อมูล
                                    </h3>
                                    <button onClick={() => setEditItem(null)} className="p-2.5 bg-slate-100 dark:bg-white/10 rounded-xl text-slate-500 hover:bg-slate-200 hover:text-slate-800 dark:hover:text-white btn-interactive transition-colors"><Icon name="x" size={20}/></button>
                                </div>
                                <form onSubmit={handleSaveEdit} className="space-y-5 overflow-y-auto flex-1 custom-scrollbar pr-2 pb-4">
                                    <div className="p-5 md:p-6 bg-slate-50/80 dark:bg-black/20 rounded-3xl border border-slate-200/60 dark:border-white/5 space-y-4 shadow-inner">
                                        <div><label className="text-[10px] font-black text-slate-500 mb-1.5 block uppercase tracking-widest">ชื่อ-นามสกุล (ระบุคำนำหน้า)</label><input className="w-full input-modern rounded-xl px-4 py-3.5 text-sm font-bold shadow-sm" value={editItem.FullName} onChange={e => setEditItem({...editItem, FullName: e.target.value})}/></div>
                                        <div className="grid grid-cols-2 gap-4">
                                            <div><label className="text-[10px] font-black text-slate-500 mb-1.5 block uppercase tracking-widest">รหัสนักศึกษา</label><input className="w-full input-modern rounded-xl px-4 py-3.5 text-sm font-mono shadow-sm" inputMode="numeric" maxLength="9" value={editItem.StudentID} onChange={e => setEditItem({...editItem, StudentID: e.target.value.replace(/\D/g, '')})}/></div>
                                            <div><label className="text-[10px] font-black text-slate-500 mb-1.5 block uppercase tracking-widest">Thai ID / Passport</label><input className="w-full input-modern rounded-xl px-4 py-3.5 text-sm font-mono shadow-sm" maxLength="20" value={editItem.IDCard || ''} onChange={e => setEditItem({...editItem, IDCard: e.target.value})}/></div>
                                        </div>
                                        <div><label className="text-[10px] font-black text-slate-500 mb-1.5 block uppercase tracking-widest">สาขาวิชา</label><input className="w-full input-modern rounded-xl px-4 py-3.5 text-sm font-semibold shadow-sm" value={editItem.Major} onChange={e => setEditItem({...editItem, Major: e.target.value})}/></div>
                                        <div className="grid grid-cols-2 gap-4">
                                            <div><label className="text-[10px] font-black text-slate-500 mb-1.5 block uppercase tracking-widest">ศาสนา</label><input className="w-full input-modern rounded-xl px-4 py-3.5 text-sm font-semibold shadow-sm" value={editItem.Religion || ''} onChange={e => setEditItem({...editItem, Religion: e.target.value})}/></div>
                                            <div><label className="text-[10px] font-black text-slate-500 mb-1.5 block uppercase tracking-widest">กรุ๊ปเลือด</label><input className="w-full input-modern rounded-xl px-4 py-3.5 text-sm font-semibold shadow-sm" value={editItem.BloodGroup || ''} onChange={e => setEditItem({...editItem, BloodGroup: e.target.value})}/></div>
                                        </div>
                                        <div className="grid grid-cols-2 gap-4">
                                            <div><label className="text-[10px] font-black text-slate-500 mb-1.5 block uppercase tracking-widest">เบอร์ นศ.</label><input className="w-full input-modern rounded-xl px-4 py-3.5 text-sm font-mono shadow-sm" maxLength="10" pattern="[0-9]{10}" inputMode="numeric" value={editItem.StudentPhone} onChange={e => setEditItem({...editItem, StudentPhone: e.target.value.replace(/\D/g, '')})}/></div>
                                            <div><label className="text-[10px] font-black text-slate-500 mb-1.5 block uppercase tracking-widest">เบอร์ ผปค.</label><input className="w-full input-modern rounded-xl px-4 py-3.5 text-sm font-mono shadow-sm" maxLength="10" pattern="[0-9]{10}" inputMode="numeric" value={editItem.ParentPhone} onChange={e => setEditItem({...editItem, ParentPhone: e.target.value.replace(/\D/g, '')})}/></div>
                                        </div>
                                    </div>
                                    <div className="p-5 md:p-6 bg-orange-50/80 dark:bg-orange-950/20 rounded-3xl border border-orange-200/60 dark:border-orange-500/20 space-y-4 shadow-sm">
                                        <div><label className="text-[10px] font-black text-orange-600 dark:text-orange-400 mb-1.5 block uppercase tracking-widest">แพ้อาหาร</label><input className="w-full input-modern rounded-xl px-4 py-3.5 text-sm font-semibold shadow-sm focus:ring-orange-500/50" value={editItem.FoodAllergy} onChange={e => setEditItem({...editItem, FoodAllergy: e.target.value})}/></div>
                                        <div><label className="text-[10px] font-black text-orange-600 dark:text-orange-400 mb-1.5 block uppercase tracking-widest">อาหารเฉพาะทาง</label><input className="w-full input-modern rounded-xl px-4 py-3.5 text-sm font-semibold shadow-sm focus:ring-orange-500/50" value={editItem.SpecificDiet} onChange={e => setEditItem({...editItem, SpecificDiet: e.target.value})}/></div>
                                    </div>
                                    <div className="p-5 md:p-6 bg-red-50/80 dark:bg-red-950/20 rounded-3xl border border-red-200/60 dark:border-red-500/20 space-y-4 shadow-sm">
                                        <div><label className="text-[10px] font-black text-red-600 dark:text-red-400 mb-1.5 block uppercase tracking-widest">โรคประจำตัว</label><input className="w-full input-modern rounded-xl px-4 py-3.5 text-sm font-semibold shadow-sm focus:ring-red-500/50" value={editItem.Disease} onChange={e => setEditItem({...editItem, Disease: e.target.value})}/></div>
                                        <div><label className="text-[10px] font-black text-red-600 dark:text-red-400 mb-1.5 block uppercase tracking-widest">แพ้ยา</label><input className="w-full input-modern rounded-xl px-4 py-3.5 text-sm font-semibold shadow-sm focus:ring-red-500/50" value={editItem.DrugAllergy} onChange={e => setEditItem({...editItem, DrugAllergy: e.target.value})}/></div>
                                    </div>
                                    
                                    <div className="flex gap-4 pt-6 sticky bottom-0 bg-white dark:bg-zinc-900 pb-2 z-10 border-t border-slate-100 dark:border-white/5 mt-6">
                                        <button type="button" onClick={() => setEditItem(null)} className="flex-1 py-4 bg-slate-100 dark:bg-white/5 text-sm rounded-xl font-bold btn-interactive hover:bg-slate-200 dark:hover:bg-white/10 transition-colors text-slate-600 dark:text-slate-300">ยกเลิก</button>
                                        <button type="submit" className="flex-1 py-4 brand-gradient text-white text-sm rounded-xl font-bold shadow-glow-brand btn-interactive transform hover:-translate-y-0.5 transition-all flex items-center justify-center gap-2"><Icon name="save" size={18}/> บันทึกข้อมูล</button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        // ==========================================
        // 🚀 Main App Component
        // ==========================================
        function App() {
            const [isDarkMode, setIsDarkMode] = useState(false);
            
            // View State: 'pdpa' -> 'register' -> 'success', 'admin'
            const [currentView, setCurrentView] = useState('pdpa'); 
            
            useEffect(() => {
                // ตรวจสอบ Dark Mode จากระบบ (เช่น สลับธีมใน OS)
                const isDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
                setIsDarkMode(isDark);
            }, []);

            useEffect(() => {
                // อัปเดตคลาส dark ไปที่ <html> tag ของ Tailwind CSS
                if (isDarkMode) {
                    document.documentElement.classList.add('dark');
                } else {
                    document.documentElement.classList.remove('dark');
                }
            }, [isDarkMode]);

            return (
                <div className="min-h-screen p-4 md:p-6 transition-colors duration-300">
                    
                    {/* View Router */}
                    {currentView === 'pdpa' && (
                        <PdpaModal 
                            onAccept={() => setCurrentView('register')} 
                            onAdminClick={() => setCurrentView('admin')} 
                            isDarkMode={isDarkMode} 
                        />
                    )}
                    
                    {currentView === 'register' && (
                        <RegistrationForm 
                            onBack={() => setCurrentView('pdpa')} 
                            onSuccess={() => setCurrentView('success')} 
                            isDarkMode={isDarkMode} 
                        />
                    )}

                    {currentView === 'success' && (
                        <SuccessView 
                            onHome={() => setCurrentView('pdpa')} 
                            isDarkMode={isDarkMode} 
                        />
                    )}

                    {currentView === 'admin' && (
                        <AdminDashboard 
                            goBack={() => setCurrentView('pdpa')} 
                            isDarkMode={isDarkMode} 
                        />
                    )}

                    {/* ปุ่มสลับหน้าจอ (เปิด/ปิด Dark Mode อิสระ) */}
                    <button 
                        onClick={() => setIsDarkMode(!isDarkMode)}
                        className="fixed bottom-6 right-6 p-4 bg-white dark:bg-zinc-800 text-slate-800 dark:text-white rounded-full shadow-lg border border-slate-200 dark:border-zinc-700 hover:scale-110 transition-transform z-50 flex items-center justify-center"
                        title="Toggle Dark Mode"
                    >
                        <Icon name={isDarkMode ? "sun" : "moon"} size={24} />
                    </button>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
