                                        <div key={i} onClick={() => handleDrilldown(card.l, card.type, '')} className={`glass-panel p-6 md:p-8 rounded-[2rem] border border-slate-200/50 dark:border-white/5 relative overflow-hidden shadow-soft flex flex-col justify-between min-h-[180px] group cursor-pointer hover:shadow-lg transition-all hover:-translate-y-1 ${card.c === 'text-brand' ? 'hover:border-brand/30' : card.c === 'text-red-500' ? 'hover:border-red-400/30' : card.c === 'text-orange-500' ? 'hover:border-orange-400/30' : 'hover:border-emerald-400/30'}`}>
                                            <div className={`absolute right-0 top-0 p-6 opacity-0 group-hover:opacity-5 transition-all duration-500 transform translate-x-4 -translate-y-4 group-hover:translate-x-0 group-hover:translate-y-0 ${card.c}`}><Icon name={card.i} size={100} /></div>
                                            <div className="flex justify-between items-start mb-4 relative z-10"><div className={`p-3.5 rounded-[1rem] ${card.bg} ${card.c} shadow-sm`}><Icon name={card.i} size={28} /></div><div className={`p-2 bg-slate-50 dark:bg-white/5 rounded-xl opacity-0 group-hover:opacity-100 transition-opacity border border-slate-200 dark:border-white/10 ${card.c}`}><Icon name="search" size={16} /></div></div>
                                            <div className="relative z-10"><p className="text-slate-500 text-xs sm:text-sm font-bold uppercase tracking-wider mb-1 group-hover:text-slate-700 dark:group-hover:text-slate-300 transition-colors">{card.l}</p><div className="flex items-end gap-3"><h3 className={`text-4xl md:text-5xl font-black text-slate-800 dark:text-white drop-shadow-sm leading-none group-hover:${card.c.split('-')[1]} transition-colors`}>{card.v}</h3></div></div>
                                        </div>
                                    ))}
                                </div>
                                <div className="glass-panel rounded-[2rem] overflow-hidden border border-slate-200/50 dark:border-white/5 shadow-soft">
                                    <div className="p-6 md:px-8 border-b border-slate-100 dark:border-white/5 bg-slate-50/50 dark:bg-white/5 flex justify-between items-center">
                                        <h3 className="font-bold text-slate-800 dark:text-white flex items-center gap-3"><Icon name="list" className="text-slate-400" size={18}/> รายชื่ออัปเดตล่าสุด</h3>
                                    </div>
                                    <div className="overflow-x-auto p-2 custom-scrollbar">
                                        <table className="w-full text-sm text-left min-w-[700px]">
                                            <thead className="text-[11px] text-slate-400 uppercase tracking-widest bg-transparent"><tr><th className="px-6 py-3">ชื่อ-นามสกุล</th><th className="px-6 py-3">สาขาวิชา</th><th className="px-6 py-3 text-center">สถานะ</th><th className="px-6 py-3">ข้อมูลติดต่อ</th></tr></thead>
                                            <tbody className="divide-y divide-slate-100 dark:divide-white/5">
                                                {(() => {
                                                    const reversedData = [...stats.studentData].reverse();
                                                    const itemsPerPage = 15;
                                                    const currentItems = reversedData.slice((currentPage - 1) * itemsPerPage, currentPage * itemsPerPage);
                                                    if (currentItems.length === 0) return <tr><td colSpan="4" className="text-center py-12 text-slate-400 font-medium">ไม่พบข้อมูล</td></tr>;
                                                    return currentItems.map((row, i) => {
                                                        const isRisk = (row.FoodAllergy && row.FoodAllergy !== 'ไม่แพ้') || (row.SpecificDiet && row.SpecificDiet !== 'ไม่มี') || (row.Disease && row.Disease !== 'ไม่มี') || (row.DrugAllergy && row.DrugAllergy !== 'ไม่แพ้');
                                                        return (
                                                            <tr key={i} onClick={() => setEditItem({...row, oldStudentID: row.StudentID})} className="hover:bg-slate-50/80 dark:hover:bg-white/5 transition-colors cursor-pointer group">
                                                                <td className="px-6 py-4 font-bold text-slate-800 dark:text-slate-200 group-hover:text-brand transition-colors">{row.FullName}</td>
                                                                <td className="px-6 py-4 text-xs font-medium text-slate-500">{row.Major}</td>
                                                                <td className="px-6 py-4 text-center">{isRisk ? <span className="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-lg bg-red-50 dark:bg-red-500/10 text-red-600 dark:text-red-400 text-[10px] font-bold border border-red-200 dark:border-red-500/20 shadow-sm"><Icon name="shield-alert" size={12}/> เฝ้าระวัง</span> : <span className="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-lg bg-emerald-50 dark:bg-emerald-500/10 text-emerald-600 dark:text-emerald-400 text-[10px] font-bold border border-emerald-200 dark:border-emerald-500/20 shadow-sm"><Icon name="check-circle" size={12}/> ปกติ</span>}</td>
                                                                <td className="px-6 py-4 text-xs"><div className="text-slate-500 dark:text-slate-400 font-semibold flex items-center gap-1.5"><Icon name="user" size={12}/> {row.StudentPhone || '-'}</div></td>
                                                            </tr>
                                                        );
                                                    });
                                                })()}
                                            </tbody>
                                        </table>
                                    </div>
                                    {stats.studentData.length > 0 && (
                                        <div className="flex flex-col sm:flex-row justify-between items-center p-5 border-t border-slate-100 dark:border-white/5 gap-4 bg-slate-50/50 dark:bg-transparent">
                                            <span className="text-xs font-semibold text-slate-500">หน้า {currentPage} จาก {Math.ceil(stats.studentData.length / 15) || 1}</span>
                                            <div className="flex gap-2">
                                                <button onClick={() => setCurrentPage(p => Math.max(1, p - 1))} disabled={currentPage === 1} className="p-2.5 rounded-lg bg-white dark:bg-white/5 border border-slate-200 dark:border-white/10 shadow-sm disabled:opacity-50 hover:bg-slate-50 transition-colors btn-interactive"><Icon name="chevron-left" size={16}/></button>
                                                <button onClick={() => setCurrentPage(p => Math.min(Math.ceil(stats.studentData.length / 15), p + 1))} disabled={currentPage === Math.ceil(stats.studentData.length / 15) || Math.ceil(stats.studentData.length / 15) === 0} className="p-2.5 rounded-lg bg-white dark:bg-white/5 border border-slate-200 dark:border-white/10 shadow-sm disabled:opacity-50 hover:bg-slate-50 transition-colors btn-interactive"><Icon name="chevron-right" size={16}/></button>
                                            </div>
                                        </div>
                                    )}
                                </div>
                            </div>
                        )}

                        {/* TAB 2: MAJORS SUMMARY */}
                        {activeTab === 'majors' && (
                            <div className="grid lg:grid-cols-5 gap-6 animate-fade-in">
                                <div className="lg:col-span-2 glass-panel p-6 md:p-8 rounded-[2rem] border border-slate-200/50 dark:border-white/5 flex flex-col items-center justify-center min-h-[450px] shadow-sm relative overflow-hidden">
                                    <div className="w-full mb-2 text-center relative z-10"><h3 className="text-2xl font-black text-slate-800 dark:text-white">สัดส่วนสาขาวิชา</h3><p className="text-xs font-bold text-emerald-500 mt-1 uppercase tracking-widest flex items-center justify-center gap-1"><Icon name="check-circle" size={12}/> ข้อมูลผ่านการตรวจสอบซ้ำแล้ว</p></div>
                                    <div className="w-full flex-1 relative min-h-[320px] z-10 mt-4">
                                        {stats.pieData.length === 0 ? <div className="w-full h-full flex items-center justify-center text-slate-400">ไม่มีข้อมูล</div> : (
                                            <ResponsiveContainer width="100%" height="100%">
                                                <PieChart>
                                                    <Pie data={[...stats.pieData].sort((a,b)=>b.value-a.value)} innerRadius="65%" outerRadius="90%" paddingAngle={6} dataKey="value" stroke="none" cornerRadius={12}>{stats.pieData.map((e, i) => <Cell key={i} fill={stats.COLORS[i % stats.COLORS.length]} onClick={() => handleDrilldown(e.name, 'majors', e.name)} className="drop-shadow-sm hover:opacity-80 transition-opacity outline-none cursor-pointer"/>)}</Pie>
                                                    <Tooltip contentStyle={pieTooltipStyle} itemStyle={pieItemStyle} cursor={false} />
                                                    <text x="50%" y="50%" textAnchor="middle" dominantBaseline="middle"><tspan x="50%" dy="-8" fontSize="56" fill={isDarkMode ? "#fff" : "#0f172a"} fontWeight="900">{stats.total}</tspan><tspan x="50%" dy="32" fontSize="13" fill="#64748b" fontWeight="bold" className="uppercase tracking-widest">รวมทั้งหมด</tspan></text>
                                                </PieChart>
                                            </ResponsiveContainer>
                                        )}
                                    </div>
                                </div>
                                <div className="lg:col-span-3 glass-panel p-6 md:p-8 rounded-[2rem] border border-slate-200/50 dark:border-white/5 flex flex-col shadow-sm">
                                    <div className="flex flex-col gap-3.5 overflow-y-auto custom-scrollbar flex-1 pr-2 max-h-[450px]">
                                        {[...stats.pieData].sort((a,b) => b.value - a.value).map((entry, idx) => (
                                            <div key={idx} onClick={() => handleDrilldown(entry.name, 'majors', entry.name)} className="relative py-4 px-5 md:px-6 rounded-2xl bg-white dark:bg-zinc-800/80 border border-slate-200/60 dark:border-white/10 hover:border-brand/50 hover:shadow-md transition-all duration-300 cursor-pointer overflow-hidden group btn-interactive min-h-[72px] flex items-center">
                                                <div className="absolute inset-y-0 left-0 opacity-[0.06] dark:opacity-[0.12] transition-all duration-700 ease-out" style={{ width: `${stats.total ? (entry.value / stats.total) * 100 : 0}%`, backgroundColor: stats.COLORS[idx % stats.COLORS.length] }}></div>
                                                <div className="relative z-10 flex items-center justify-between gap-4 w-full">
                                                    <div className="flex items-center gap-4 overflow-hidden flex-1"><div className="w-4 h-4 rounded-full shrink-0 shadow-sm border-2 border-white dark:border-zinc-800 transition-transform group-hover:scale-125" style={{ backgroundColor: stats.COLORS[idx % stats.COLORS.length] }}></div><span className="text-sm md:text-base font-bold text-slate-700 dark:text-slate-200 truncate group-hover:text-brand transition-colors leading-normal" title={entry.name}>{entry.name}</span></div>
                                                    <div className="flex items-center gap-4 shrink-0"><span className="text-2xl font-black text-slate-800 dark:text-white leading-none">{entry.value}</span></div>
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            </div>
                        )}

                        {/* TAB 3: HEALTH & DIET */}
                        {activeTab === 'health_diet' && (
                            <div className="space-y-6 animate-fade-in">
                                <div className="grid grid-cols-2 lg:grid-cols-4 gap-4 md:gap-6">
                                    {[ 
                                        {l:'แพ้อาหาร', v:stats.foodAllergies.length, k:'', t:'food_allergy', cBg:'bg-orange-50 dark:bg-orange-500/10', cText:'text-orange-600 dark:text-orange-400', ic:'alert-triangle', hc:'hover:border-orange-400'},
                                        {l:'อาหารเฉพาะ', v:(stats.dietStats['ฮาลาล']+stats.dietStats['เจ']+stats.dietStats['มังสวิรัติ']), k:'', t:'food_alert', cBg:'bg-blue-50 dark:bg-blue-500/10', cText:'text-blue-600 dark:text-blue-400', ic:'utensils', hc:'hover:border-blue-400'},
                                        {l:'โรคประจำตัว', v:stats.diseases.length, k:'', t:'disease', cBg:'bg-pink-50 dark:bg-pink-500/10', cText:'text-pink-600 dark:text-pink-400', ic:'activity', hc:'hover:border-pink-400'},
                                        {l:'ประวัติแพ้ยา', v:stats.drugAllergies.length, k:'', t:'drug_allergy', cBg:'bg-purple-50 dark:bg-purple-500/10', cText:'text-purple-600 dark:text-purple-400', ic:'pill', hc:'hover:border-purple-400'}
                                    ].map((kpi, i) => (
                                        <div key={i} onClick={() => handleDrilldown(kpi.l, kpi.t, kpi.k)} className={`p-6 rounded-[2rem] border border-slate-200/50 dark:border-white/5 ${kpi.cBg} flex flex-col relative overflow-hidden shadow-sm cursor-pointer btn-interactive ${kpi.hc} group transition-all`}>
                                            <div className={`absolute right-4 top-4 opacity-10 group-hover:opacity-20 transition-opacity group-hover:scale-110 ${kpi.cText}`}><Icon name={kpi.ic} size={64}/></div>
                                            <span className={`text-xs md:text-sm font-bold mb-2 ${kpi.cText} z-10`}>{kpi.l}</span>
                                            <div className="flex items-end justify-between z-10"><span className={`text-4xl md:text-5xl font-black ${kpi.cText}`}>{kpi.v} <span className="text-base font-semibold opacity-70">คน</span></span></div>
                                        </div>
                                    ))}
                                </div>
                                <div className="grid lg:grid-cols-2 gap-6">
                                    <div className="glass-panel p-6 md:p-8 rounded-[2rem] border-t-[8px] border-t-orange-500 shadow-soft flex flex-col min-h-[380px]">
                                        <h3 className="text-xl font-black mb-6 text-slate-800 dark:text-white flex items-center gap-3"><div className="p-2.5 bg-orange-100 dark:bg-orange-500/20 text-orange-600 rounded-xl"><Icon name="pie-chart" size={20}/></div> กราฟรายงานด้านโภชนาการ</h3>
                                        <div className="flex-1 w-full relative">
                                            {stats.dietStats['ฮาลาล'] === 0 && stats.dietStats['มังสวิรัติ'] === 0 && stats.dietStats['เจ'] === 0 && stats.foodAllergies.length === 0 ? <div className="absolute inset-0 flex items-center justify-center text-slate-400">ไม่มีข้อมูล</div> : (
                                                <ResponsiveContainer width="100%" height="100%">
                                                    <BarChart data={[{ name: 'แพ้อาหาร', value: stats.foodAllergies.length, fill: '#ea580c' }, { name: 'ฮาลาล', value: stats.dietStats['ฮาลาล'], fill: '#3b82f6' }, { name: 'มังสวิรัติ', value: stats.dietStats['มังสวิรัติ'], fill: '#10b981' }, { name: 'เจ', value: stats.dietStats['เจ'], fill: '#eab308' }]} layout="vertical" margin={{ left: 0, right: 40, bottom: 0, top: 0 }}>
                                                        <XAxis type="number" hide /><YAxis dataKey="name" type="category" axisLine={false} tickLine={false} tick={{fill: isDarkMode ? '#cbd5e1' : '#475569', fontSize: 13, fontWeight: 700}} width={80} /><Tooltip cursor={{fill: isDarkMode ? 'rgba(255,255,255,0.05)' : 'rgba(0,0,0,0.03)'}} contentStyle={pieTooltipStyle} />
                                                        <Bar dataKey="value" radius={[0, 16, 16, 0]} barSize={32} label={{ position: 'right', fill: isDarkMode ? '#fff' : '#0f172a', fontSize: 16, fontWeight: '900' }}>{[{fill: '#ea580c'},{fill: '#3b82f6'}, {fill: '#10b981'}, {fill: '#eab308'}].map((e, i) => <Cell key={i} fill={e.fill} />)}</Bar>
                                                    </BarChart>
                                                </ResponsiveContainer>
                                            )}
                                        </div>
                                    </div>
                                    <div className="glass-panel p-6 md:p-8 rounded-[2rem] border-t-[8px] border-t-pink-500 shadow-soft flex flex-col min-h-[380px]">
                                        <h3 className="text-xl font-black mb-6 text-slate-800 dark:text-white flex items-center gap-3"><div className="p-2.5 bg-pink-100 dark:bg-pink-500/20 text-pink-600 rounded-xl"><Icon name="activity" size={20}/></div> กราฟรายงานด้านการแพทย์</h3>
                                        <div className="flex-1 w-full relative">
                                            {stats.diseases.length === 0 && stats.drugAllergies.length === 0 ? <div className="absolute inset-0 flex items-center justify-center text-slate-400">ไม่มีข้อมูลความเสี่ยงทางการแพทย์</div> : (
                                                <ResponsiveContainer width="100%" height="100%">
                                                    <BarChart data={[{ name: 'โรคประจำตัว', value: stats.diseases.length, fill: '#ec4899' }, { name: 'ประวัติแพ้ยา', value: stats.drugAllergies.length, fill: '#a855f7' }]} layout="vertical" margin={{ left: 0, right: 40, top: 0, bottom: 0 }}>
                                                        <XAxis type="number" hide /><YAxis dataKey="name" type="category" axisLine={false} tickLine={false} tick={{fill: isDarkMode ? '#cbd5e1' : '#475569', fontSize: 13, fontWeight: 700}} width={100} /><Tooltip cursor={{fill: isDarkMode ? 'rgba(255,255,255,0.05)' : 'rgba(0,0,0,0.03)'}} contentStyle={pieTooltipStyle} />
                                                        <Bar dataKey="value" radius={[0, 16, 16, 0]} barSize={32} label={{ position: 'right', fill: isDarkMode ? '#fff' : '#0f172a', fontSize: 16, fontWeight: '900' }}>{[{fill: '#ec4899'}, {fill: '#a855f7'}].map((e, i) => <Cell key={i} fill={e.fill} />)}</Bar>
                                                    </BarChart>
                                                </ResponsiveContainer>
                                            )}
                                        </div>
                                    </div>
                                </div>
                            </div>
                        )}

                                                            <div onClick={() => handleDrilldown(`${item.name} (เทียบโอน)`, 'major_breakdown', {major: item.name, type: 'transfer'})} className="bg-purple-50/50 dark:bg-purple-900/20 p-3.5 rounded-2xl border border-purple-100/50 dark:border-purple-800/30 cursor-pointer hover:border-purple-300 hover:bg-purple-50 transition-all flex flex-col sm:flex-row sm:items-center sm:justify-between gap-2 group/btn print:bg-white print:border-slate-200 btn-interactive relative overflow-hidden"><div className="flex items-center gap-2 z-10"><div className="w-2.5 h-2.5 rounded-full bg-purple-500 shadow-sm print:bg-purple-500 print:color-adjust-exact" style={{WebkitPrintColorAdjust: 'exact', printColorAdjust: 'exact'}}></div><span className="text-xs font-bold text-slate-500 dark:text-slate-400">เทียบโอน</span></div><div className="flex items-end gap-2 z-10"><span className="text-2xl font-black text-purple-700 dark:text-purple-400 leading-none group-hover/btn:scale-110 transition-transform origin-bottom-right print:text-purple-700">{item.transfer}</span><span className="text-[10px] font-bold text-purple-500 bg-purple-100/50 dark:bg-purple-900/40 px-1.5 py-0.5 rounded-md print:bg-transparent">{transferPercent.toFixed(0)}%</span></div></div>
                                                        </div>
                                                    </div>
                                                );
                                            })}
                                        </div>
                                    </div>
                                )}
                            </div>
                        )}

                        {/* TAB 6: CREATE ACTIVITY */}
                        {activeTab === 'create_activity' && (
                            <div className="space-y-6 animate-fade-in">
                                <div className="glass-panel p-6 md:p-8 rounded-[2.5rem] border-t-[8px] border-t-purple-500 shadow-soft flex flex-col relative overflow-hidden bg-gradient-to-b from-white to-purple-50/30 dark:from-zinc-900 dark:to-zinc-900/50">
                                    <div className="absolute top-0 right-0 p-8 opacity-5 text-purple-500 pointer-events-none transform translate-x-4 -translate-y-4"><Icon name="calendar-plus" size={120} /></div>
                                    <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 mb-8 relative z-10"><h3 className="text-xl md:text-2xl font-black text-slate-800 dark:text-white flex items-center gap-3"><div className="p-3 bg-purple-100 dark:bg-purple-500/20 text-purple-600 rounded-2xl shadow-inner"><Icon name="calendar-plus" size={24}/></div> สร้างกิจกรรม</h3></div>
                                    <form onSubmit={handleCreateActivity} className="relative z-10 space-y-6">
                                        <div className="grid grid-cols-1 gap-6">
                                            <InputField label="ชื่อกิจกรรม" value={activityForm.name} onChange={v => setActivityForm({...activityForm, name: v})} placeholder="เช่น ปฐมนิเทศนักศึกษาใหม่" required />
                                            <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                                                <InputField type="datetime-local" label="วันที่และเวลา" value={activityForm.date} onChange={v => setActivityForm({...activityForm, date: v})} required />
                                                <InputField label="สถานที่จัดกิจกรรม" value={activityForm.location} onChange={v => setActivityForm({...activityForm, location: v})} placeholder="เช่น หอประชุมใหญ่" required />
                                            </div>
                                        </div>
                                        <div className="pt-4 flex justify-end">
                                            <button type="submit" className="w-full md:w-auto px-8 py-3.5 bg-purple-600 hover:bg-purple-700 text-white rounded-xl font-black text-lg transition-colors btn-interactive flex items-center justify-center gap-2 shadow-sm"><Icon name="plus-circle" size={20} /> บันทึกกิจกรรม</button>
                                        </div>
                                    </form>
                                </div>

                                {activityDefs.length > 0 && (
                                    <div className="glass-panel rounded-[2rem] overflow-hidden border border-slate-200/50 dark:border-white/5 shadow-soft">
                                        <div className="p-6 md:px-8 border-b border-slate-100 dark:border-white/5 bg-slate-50/50 dark:bg-white/5 flex justify-between items-center"><h3 className="font-bold text-slate-800 dark:text-white flex items-center gap-3"><Icon name="list" className="text-slate-400" size={18}/> รายการกิจกรรมที่สร้างบนระบบ</h3></div>
                                        <div className="overflow-x-auto p-2 custom-scrollbar">
                                            <table className="w-full text-sm text-left min-w-[700px]">
                                                <thead className="text-[11px] text-slate-400 uppercase tracking-widest bg-transparent"><tr><th className="px-6 py-3">ชื่อกิจกรรม</th><th className="px-6 py-3">วันที่และเวลา</th><th className="px-6 py-3">สถานที่จัดกิจกรรม</th><th className="px-6 py-3 text-center">สถานะ (เปิด/ปิด)</th><th className="px-6 py-3 text-center">ผู้เข้าร่วม (คน)</th><th className="px-6 py-3"></th></tr></thead>
                                                <tbody className="divide-y divide-slate-100 dark:divide-white/5">
                                                    {activityDefs.map((act, idx) => {
                                                        const attendeesCount = activityLogs.filter(r => r.ActivityName === act.ActivityName).length;
                                                        return (
                                                            <tr key={idx} onClick={() => handleDrilldown(`รายชื่อผู้ลงทะเบียน: ${act.ActivityName}`, 'activity_regs', act.ActivityName)} className="hover:bg-purple-50/50 dark:hover:bg-purple-900/10 transition-colors group cursor-pointer">
                                                                <td className="px-6 py-4 font-bold text-slate-800 dark:text-slate-200 group-hover:text-purple-600 transition-colors">{act.ActivityName}</td>
                                                                <td className="px-6 py-4 text-slate-500 font-mono text-xs">{new Date(act.ActivityDate).toLocaleString('th-TH')}</td>
                                                                <td className="px-6 py-4 text-slate-600 dark:text-slate-400 flex items-center gap-2"><Icon name="map-pin" size={14} className="text-slate-400"/> {act.Location}</td>
                                                                <td className="px-6 py-4 text-center" onClick={(e) => e.stopPropagation()}><button onClick={() => handleToggleActivity(act.ActivityName, act.Status)} className={`relative inline-flex h-6 w-11 shrink-0 cursor-pointer rounded-full border-2 border-transparent transition-colors duration-200 ease-in-out focus:outline-none shadow-sm ${act.Status !== 'CLOSED' ? 'bg-emerald-500 hover:bg-emerald-400' : 'bg-slate-300 dark:bg-slate-600 hover:bg-slate-400'}`}><span className={`pointer-events-none inline-block h-5 w-5 transform rounded-full bg-white shadow ring-0 transition duration-200 ease-in-out ${act.Status !== 'CLOSED' ? 'translate-x-5' : 'translate-x-0'}`} /></button></td>
                                                                <td className="px-6 py-4 text-center"><span className="inline-flex items-center justify-center bg-purple-100 dark:bg-purple-500/20 text-purple-600 dark:text-purple-400 px-3 py-1 rounded-full text-xs font-black shadow-sm">{attendeesCount}</span></td>
                                                                <td className="px-6 py-4 text-right text-slate-300 group-hover:text-purple-500 transition-colors"><Icon name="chevron-right" size={20}/></td>
                                                            </tr>
                                                        );
                                                    })}
                                                </tbody>
                                            </table>
                                        </div>
                                    </div>
                                )}
                            </div>
                        )}

                        {/* TAB 7: ACTIVITY SUMMARY */}
                        {activeTab === 'activity_summary' && (
                            <div className="space-y-6 animate-fade-in print:space-y-4">
                                <div className="glass-panel p-6 md:p-8 rounded-[2.5rem] border-t-[8px] border-t-pink-500 shadow-soft relative overflow-hidden bg-gradient-to-b from-white to-pink-50/30 dark:from-zinc-900 dark:to-zinc-900/50 print:border-none print:shadow-none print:bg-white print:p-0">
                                    <div className="absolute top-0 right-0 p-8 opacity-5 text-pink-500 pointer-events-none transform translate-x-4 -translate-y-4 print:hidden"><Icon name="bar-chart-2" size={120} /></div>
                                    <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 relative z-10 print:mb-6"><h3 className="text-xl md:text-2xl font-black text-slate-800 dark:text-white flex items-center gap-3 print:text-black print:text-2xl"><div className="p-3 bg-pink-100 dark:bg-pink-500/20 text-pink-600 rounded-2xl shadow-inner print:hidden"><Icon name="bar-chart-2" size={24}/></div> สรุปผู้เข้าร่วมกิจกรรม</h3></div>
                                </div>

                                {activityDefs.length === 0 ? (
                                    <div className="glass-panel p-12 rounded-[2.5rem] flex flex-col items-center justify-center text-slate-400 shadow-soft border border-slate-200/50 dark:border-white/5"><Icon name="inbox" size={48} className="mb-4 opacity-30" /><p className="font-semibold text-lg">ยังไม่มีกิจกรรมที่ถูกสร้างในระบบ</p></div>
                                ) : (
                                    activityDefs.map((act, idx) => {
                                        const attendees = activityLogs.filter(log => log.ActivityName === act.ActivityName);
                                        const majorCounts = attendees.reduce((acc, curr) => { const m = curr.Major || 'ไม่ระบุ'; acc[m] = (acc[m] || 0) + 1; return acc; }, {});

                                        return (
                                            <div key={idx} className="glass-panel p-6 md:p-8 rounded-[2.5rem] border-l-[8px] border-l-pink-500 shadow-soft relative overflow-hidden mb-6 print:border-l-4 print:border-slate-300 print:shadow-none print:break-inside-avoid print:mb-4">
                                                <div className="flex flex-col md:flex-row md:items-center justify-between gap-4 mb-6 border-b border-slate-100 dark:border-white/5 pb-6 print:mb-4 print:pb-4">
                                                    <div>
                                                        <h3 className="text-xl md:text-2xl font-black text-slate-800 dark:text-white mb-2 print:text-black">{act.ActivityName}</h3>
                                                        <div className="flex flex-wrap items-center gap-4 text-sm text-slate-500 dark:text-slate-400 font-semibold print:text-slate-600">
                                                            <span className="flex items-center gap-1.5"><Icon name="calendar" size={14} className="text-pink-500 print:hidden"/> {new Date(act.ActivityDate).toLocaleString('th-TH')}</span>
                                                            <span className="flex items-center gap-1.5"><Icon name="map-pin" size={14} className="text-pink-500 print:hidden"/> {act.Location}</span>
                                                        </div>
                                                    </div>
                                                    <div className="bg-pink-50 dark:bg-pink-500/10 text-pink-600 px-6 py-4 rounded-2xl text-center border border-pink-100 dark:border-pink-500/20 shrink-0 print:border-slate-300 print:bg-transparent print:text-black">
                                                        <div className="text-xs font-bold uppercase tracking-widest mb-1 print:text-slate-500">ยอดผู้เข้าร่วมรวม</div>
                                                        <div className="text-4xl font-black print:text-3xl">{attendees.length}</div>
                                                    </div>
                                                </div>

                                                <h4 className="text-sm font-bold text-slate-700 dark:text-slate-300 mb-4 flex items-center gap-2 print:text-black"><Icon name="pie-chart" size={16} className="text-pink-500 print:hidden"/> แยกตามสาขาวิชา</h4>
                                                
                                                {Object.keys(majorCounts).length > 0 ? (
                                                    <div className="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4 print:grid-cols-3 print:gap-2">
                                                        {Object.entries(majorCounts).sort((a,b)=>b[1]-a[1]).map(([major, count], mIdx) => (
                                                            <div key={mIdx} onClick={() => handleDrilldown(`ผู้เข้าร่วม: ${act.ActivityName} (${major})`, 'activity_major', {activity: act.ActivityName, major})} className="p-4 rounded-2xl bg-slate-50/80 dark:bg-white/5 border border-slate-200/60 dark:border-white/10 hover:border-pink-400 hover:shadow-md transition-all cursor-pointer group btn-interactive relative overflow-hidden print:border-slate-300 print:bg-white print:p-3 print:shadow-none">
                                                                 <div className="absolute top-0 right-0 p-3 opacity-0 group-hover:opacity-10 text-pink-500 transition-opacity transform translate-x-2 -translate-y-2 print:hidden"><Icon name="search" size={32}/></div>
                                                                 <div className="text-xs font-bold text-slate-500 dark:text-slate-400 mb-2 truncate group-hover:text-pink-600 transition-colors print:text-slate-600" title={major}>{major}</div>
                                                                 <div className="text-2xl font-black text-slate-800 dark:text-white group-hover:text-pink-600 transition-colors origin-left print:text-black print:text-xl">{count} <span className="text-xs font-semibold text-slate-400 ml-1">คน</span></div>
                                                            </div>
                                                        ))}
                                                    </div>
                                                ) : (
                                                    <div className="text-center p-6 text-slate-400 font-semibold bg-slate-50 dark:bg-white/5 rounded-2xl border border-dashed border-slate-200 dark:border-white/10 print:border-slate-300 print:bg-white print:text-slate-500">ยังไม่มีผู้ลงทะเบียนเข้าร่วมกิจกรรมนี้</div>
                                                )}
                                            </div>
                                        )
                                    })
                                )}
                            </div>
                        )}
                    </div>

                    {/* MODALS: Drilldown */}
                    {drilldownData.list.length > 0 && (
                        <div className="fixed inset-0 z-[90] flex items-center justify-center p-4 sm:p-6 bg-slate-900/70 dark:bg-black/90 backdrop-blur-lg animate-fade-in print:hidden">
                            <div className="bg-white dark:bg-zinc-900 border border-slate-200 dark:border-white/10 p-6 md:p-8 rounded-[2.5rem] w-full max-w-5xl max-h-[90vh] flex flex-col shadow-[0_20px_60px_rgba(0,0,0,0.3)] dark:shadow-[0_20px_60px_rgba(0,0,0,0.8)] animate-slide-up text-left overflow-hidden">
                                <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 mb-6 shrink-0">
                                    <div>
                                        <h3 className="text-xl md:text-2xl font-black text-slate-800 dark:text-white flex items-center gap-3">
                                            <div className={`p-3 rounded-2xl text-white shadow-md ${drilldownHeaderColor}`}><Icon name={drilldownIcon} size={24}/></div>
                                            {drilldownData.title}
                                        </h3>
                                        <p className="text-sm font-semibold text-slate-500 mt-2">พบทั้งหมด <span className="text-brand font-black bg-brand/10 px-2 py-0.5 rounded-md">{drilldownData.list.length}</span> รายการ</p>
                                    </div>
                                    <button onClick={() => setDrilldownData({ title: '', list: [], type: '' })} className="p-2.5 bg-slate-100 dark:bg-white/10 rounded-xl hover:bg-slate-200 transition-colors"><Icon name="x" size={20}/></button>
                                </div>
                                <div className="overflow-y-auto flex-1 custom-scrollbar -mx-2 px-2">
                                    <table className="w-full text-sm text-left">
                                        <thead className="text-xs text-slate-500 uppercase tracking-widest bg-slate-100/80 dark:bg-zinc-800/80 sticky top-0 rounded-xl z-10 shadow-sm backdrop-blur-md">
                                            <tr>
                                                <th className="px-6 py-5 rounded-l-xl font-black">ชื่อ-นามสกุล</th>
                                                <th className="px-6 py-5 font-black">สาขาวิชา</th>
                                                {showConditions && <th className="px-6 py-5 font-black">เงื่อนไข/อาการ</th>}
                                                <th className="px-6 py-5 rounded-r-xl font-black">ข้อมูลติดต่อ</th>
                                            </tr>
                                        </thead>
                                        <tbody className="divide-y divide-slate-100 dark:divide-white/5">
                                            {drilldownData.list.map((row, idx) => (
                                                <tr key={idx} className="hover:bg-slate-50/80 dark:hover:bg-white/5 transition-colors">
                                                    <td className="px-6 py-5 font-bold text-slate-800 dark:text-white">{row.FullName}</td>
                                                    <td className="px-6 py-5 text-xs font-semibold text-slate-600 dark:text-slate-400">{row.Major}</td>
                                                    {showConditions && (
                                                        <td className="px-6 py-5">
                                                            <div className="flex flex-col gap-2">
                                                                {row.FoodAllergy && row.FoodAllergy !== 'ไม่แพ้' && <span className="text-orange-700 dark:text-orange-300 bg-orange-100 dark:bg-orange-900/40 px-3 py-1.5 rounded-lg text-xs font-bold w-max border border-orange-200 dark:border-orange-800/50">แพ้: {row.FoodAllergy}</span>}
                                                                {row.SpecificDiet && row.SpecificDiet !== 'ไม่มี' && <span className="text-blue-700 dark:text-blue-300 bg-blue-100 dark:bg-blue-900/40 px-3 py-1.5 rounded-lg text-xs font-bold w-max border border-blue-200 dark:border-blue-800/50">อาหาร: {row.SpecificDiet}</span>}
                                                                {row.Disease && row.Disease !== 'ไม่มี' && <span className="text-purple-700 dark:text-purple-300 bg-purple-100 dark:bg-purple-900/40 px-3 py-1.5 rounded-lg text-xs font-bold w-max border border-purple-200 dark:border-purple-800/50">โรค: {row.Disease}</span>}
                                                                {row.DrugAllergy && row.DrugAllergy !== 'ไม่แพ้' && <span className="text-pink-700 dark:text-pink-300 bg-pink-100 dark:bg-pink-900/40 px-3 py-1.5 rounded-lg text-xs font-bold w-max border border-pink-200 dark:border-pink-800/50">แพ้ยา: {row.DrugAllergy}</span>}
                                                            </div>
                                                        </td>
                                                    )}
                                                    <td className="px-6 py-5 text-xs">
                                                        <div className="font-semibold text-slate-600 dark:text-slate-400 mb-1.5 flex items-center gap-1.5"><Icon name="user" size={14}/> นศ: {row.StudentPhone}</div>
                                                        {(drilldownData.type !== 'activity_regs' && drilldownData.type !== 'activity_major' && row.ParentPhone && row.ParentPhone !== '-') && (
                                                            <div className="font-bold text-red-500 flex items-center gap-1.5"><Icon name="phone-call" size={14}/> ผปค: {row.ParentPhone}</div>
                                                        )}
                                                    </td>
                                                </tr>
                                            ))}
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* MODALS: Edit Modal */}
                    {editItem && (
                        <div className="fixed inset-0 z-[70] flex items-center justify-center p-4 sm:p-6 bg-slate-900/70 dark:bg-black/90 backdrop-blur-lg animate-fade-in print:hidden">
                            <div className="bg-white dark:bg-zinc-900 border border-slate-200 dark:border-white/10 p-6 md:p-8 rounded-[2.5rem] w-full max-w-lg max-h-[90vh] flex flex-col shadow-[0_20px_60px_rgba(0,0,0,0.3)] dark:shadow-[0_20px_60px_rgba(0,0,0,0.8)] animate-slide-up text-left overflow-hidden">
                                <div className="flex justify-between items-center mb-6 shrink-0">
                                    <h3 className="text-xl md:text-2xl font-black text-slate-800 dark:text-white flex items-center gap-3"><Icon name="edit" size={24}/> แก้ไขข้อมูล</h3>
                                    <button onClick={() => setEditItem(null)} className="p-2.5 bg-slate-100 dark:bg-white/10 rounded-xl hover:bg-slate-200 transition-colors"><Icon name="x" size={20}/></button>
                                </div>
                                <form onSubmit={handleSaveEdit} className="space-y-5 overflow-y-auto flex-1 custom-scrollbar pr-2 pb-4">
                                    <div className="p-5 md:p-6 bg-slate-50/80 dark:bg-black/20 rounded-3xl border border-slate-200/60 dark:border-white/5 space-y-4 shadow-inner">
                                        <InputField label="ชื่อ-นามสกุล (ระบุคำนำหน้า)" value={editItem.FullName} onChange={v => setEditItem({...editItem, FullName: v})} />
                                        <div className="grid grid-cols-2 gap-4">
                                            <InputField label="รหัสนักศึกษา" numeric maxLength="9" value={editItem.StudentID} onChange={v => setEditItem({...editItem, StudentID: v})} />
                                            <InputField label="รหัส ปชช. / Passport" maxLength="20" value={editItem.IDCard || ''} onChange={v => setEditItem({...editItem, IDCard: v})} />
                                        </div>
                                        <InputField label="สาขาวิชา" value={editItem.Major} onChange={v => setEditItem({...editItem, Major: v})} />
                                        <div className="grid grid-cols-2 gap-4">
                                            <InputField label="ศาสนา" value={editItem.Religion || ''} onChange={v => setEditItem({...editItem, Religion: v})} />
                                            <InputField label="กรุ๊ปเลือด" value={editItem.BloodGroup || ''} onChange={v => setEditItem({...editItem, BloodGroup: v})} />
                                        </div>
                                        <div className="grid grid-cols-2 gap-4">
                                            <InputField label="เบอร์ นศ." numeric maxLength="10" value={editItem.StudentPhone} onChange={v => setEditItem({...editItem, StudentPhone: v})} />
                                            <InputField label="เบอร์ ผปค." numeric maxLength="10" value={editItem.ParentPhone} onChange={v => setEditItem({...editItem, ParentPhone: v})} />
                                        </div>
                                    </div>
                                    <div className="p-5 md:p-6 bg-orange-50/80 dark:bg-orange-950/20 rounded-3xl border border-orange-200/60 dark:border-orange-500/20 space-y-4 shadow-sm">
                                        <InputField label="แพ้อาหาร" value={editItem.FoodAllergy} onChange={v => setEditItem({...editItem, FoodAllergy: v})} />
                                        <InputField label="อาหารเฉพาะทาง" value={editItem.SpecificDiet} onChange={v => setEditItem({...editItem, SpecificDiet: v})} />
                                    </div>
                                    <div className="p-5 md:p-6 bg-red-50/80 dark:bg-red-950/20 rounded-3xl border border-red-200/60 dark:border-red-500/20 space-y-4 shadow-sm">
                                        <InputField label="โรคประจำตัว" value={editItem.Disease} onChange={v => setEditItem({...editItem, Disease: v})} />
                                        <InputField label="แพ้ยา" value={editItem.DrugAllergy} onChange={v => setEditItem({...editItem, DrugAllergy: v})} />
                                    </div>
                                    <div className="flex gap-4 pt-6 sticky bottom-0 bg-white dark:bg-zinc-900 pb-2 z-10 border-t border-slate-100 dark:border-white/5 mt-6">
                                        <button type="button" onClick={() => setEditItem(null)} className="flex-1 py-4 bg-slate-100 dark:bg-white/5 text-sm rounded-xl font-bold btn-interactive hover:bg-slate-200 dark:hover:bg-white/10 transition-colors text-slate-600 dark:text-slate-300">ยกเลิก</button>
                                        <button type="submit" className="flex-1 py-4 brand-gradient text-white text-sm rounded-xl font-bold shadow-glow-brand btn-interactive transform hover:-translate-y-0.5 transition-all flex items-center justify-center gap-2"><Icon name="save" size={18}/> บันทึกข้อมูล</button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        function App() {
            const [isDarkMode, setIsDarkMode] = useState(false);
            const [currentView, setCurrentView] = useState('home'); 
            
            useEffect(() => {
                const isDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
                setIsDarkMode(isDark);
            }, []);

            useEffect(() => {
                if (isDarkMode) document.documentElement.classList.add('dark');
                else document.documentElement.classList.remove('dark');
            }, [isDarkMode]);

            return (
                <AppContext.Provider value={{ isDarkMode }}>
                    <div className="min-h-screen p-4 md:p-6 transition-colors duration-300 relative">
                        {currentView === 'home' && <HomeView onSelectNewStudent={() => setCurrentView('pdpa')} onSelectActivity={() => setCurrentView('activity_form')} onAdminClick={() => setCurrentView('admin')} />}
                        {currentView === 'pdpa' && <PdpaModal onAccept={() => setCurrentView('register')} onBack={() => setCurrentView('home')} />}
                        {currentView === 'register' && <RegistrationForm onBack={() => setCurrentView('home')} onSuccess={() => setCurrentView('success')} />}
                        {currentView === 'activity_form' && <ActivityForm onBack={() => setCurrentView('home')} onSuccess={() => setCurrentView('success')} />}
                        {currentView === 'success' && <SuccessView onHome={() => setCurrentView('home')} />}
                        {currentView === 'admin' && <AdminDashboard goBack={() => setCurrentView('home')} />}

                        <div className="fixed bottom-6 right-6 flex flex-col gap-3 z-50 print:hidden">
                            <button onClick={() => setIsDarkMode(!isDarkMode)} className="w-12 h-12 bg-white dark:bg-zinc-800 text-slate-800 dark:text-white rounded-full shadow-lg border border-slate-200 dark:border-zinc-700 hover:scale-110 transition-transform flex items-center justify-center" title="สลับโหมดกลางคืน">
                                <Icon name={isDarkMode ? "sun" : "moon"} size={20} />
                            </button>
                        </div>
                    </div>
                </AppContext.Provider>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
