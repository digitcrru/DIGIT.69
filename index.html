    <!-- Tailwind CSS with Dark Mode Support -->
    <script src="https://cdn.tailwindcss.com"></script>

        tailwind.config = {

                extend: {
                    colors: { 
                        brand: '#ff6600',
                        brandDark: '#cc5200',
                        brandLight: '#ff8533',
                        lightBg: '#f8fafc',

                        panelLight: '#ffffff',
                        panelDark: 'rgba(24, 24, 27, 0.85)'
                    },
                    boxShadow: {
                        'glow-brand': '0 0 25px rgba(255, 102, 0, 0.3)',
                        'glow-red': '0 0 25px rgba(239, 68, 68, 0.3)',

                        'soft': '0 10px 40px -10px rgba(0, 0, 0, 0.08)',

                    animation: { 
                        'fade-in': 'fadeIn 0.4s cubic-bezier(0.22, 1, 0.36, 1)',

                        fadeIn: { '0%': { opacity: '0', transform: 'scale(0.98)' }, '100%': { opacity: '1', transform: 'scale(1)' } },

    <!-- Fonts & Libraries -->
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- SweetAlert2 -->
    <link href="https://cdn.jsdelivr.net/npm/@sweetalert2/theme-dark@4/dark.css" rel="stylesheet" id="swal-theme">

    <style>
        body { 
            font-family: 'Prompt', sans-serif; 
            margin: 0; 
            padding: 0; 
            overflow-x: hidden; 
            -webkit-font-smoothing: antialiased; 
            background-color: #f8fafc;
            background-image: 
                radial-gradient(at 0% 0%, hsla(28, 100%, 74%, 0.15) 0px, transparent 50%),
                radial-gradient(at 100% 0%, hsla(250, 100%, 74%, 0.1) 0px, transparent 50%),
                radial-gradient(at 100% 100%, hsla(28, 100%, 74%, 0.15) 0px, transparent 50%);

        }
        .dark body {
            background-color: #09090b;

                radial-gradient(at 0% 0%, hsla(28, 100%, 50%, 0.08) 0px, transparent 50%),

                radial-gradient(at 100% 100%, hsla(28, 100%, 50%, 0.08) 0px, transparent 50%);
        }
        
        .glass-panel { 
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(20px); 
            -webkit-backdrop-filter: blur(20px);

            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);

            background: rgba(0, 0, 0, 0.3); 
            border: 1px solid rgba(255, 255, 255, 0.1);

        .brand-gradient { background: linear-gradient(135deg, #ff8533 0%, #ff6600 50%, #e65c00 100%); }
        .brand-text-gradient { background-clip: text; -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-image: linear-gradient(135deg, #ff8533, #ff6600); }
        
        ::-webkit-scrollbar { width: 6px; height: 6px; }

        .light-mode ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        .dark ::-webkit-scrollbar-thumb { background: #3f3f46; border-radius: 10px; }

        .btn-interactive { transition: transform 0.15s ease, box-shadow 0.3s ease, background 0.3s ease, border-color 0.3s ease, opacity 0.2s ease; }
        .btn-interactive:active:not(:disabled) { transform: scale(0.97); }
        .btn-interactive:disabled { opacity: 0.7; cursor: not-allowed; }

        @media print {
            body { background: white !important; color: black !important; }
            .no-print { display: none !important; }

            .glass-panel { border: none !important; box-shadow: none !important; background: white !important; }

</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo, useRef } = React;
        const Recharts = window.Recharts || {};
        const { BarChart, Bar, XAxis, YAxis, Tooltip, ResponsiveContainer, PieChart, Pie, Cell, Legend } = Recharts;

        // ==========================================
        // ⚙️ตั้งค่า API
        // ==========================================
        const API_URL = "https://script.google.com/macros/s/AKfycbwviBRd_BbtvGyEpZSq5ab5A0iEpXkG9iMwAUQyGyZb-nDI2R5-x8GE5ZEI3gpmzA3zug/exec";
        const SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/1MoZpnDniVF5pKr0tEgmYwlPO3wZdA7DaO_MvZjbC-ec/gviz/tq?tqx=out:csv&sheet=Registration";
        
        const MAJOR_LIST = [
            "เทคโนโลยีดิจิทัลเพื่อธุรกิจ", "เทคโนโลยีดิจิทัลเพื่อธุรกิจ (เทียบโอน)",
            "เทคโนโลยีปัญญาประดิษฐ์", "เทคโนโลยีสารสนเทศ", "เทคโนโลยีสารสนเทศ (เทียบโอน)",
            "วิทยาการคอมพิวเตอร์", "กราฟิกดีไซน์เทคโนโลยีสื่อดิจิทัล",
            "กราฟิกดีไซน์สื่อศิลปะและการออกแบบ", "กราฟิกดีไซน์สื่อศิลปะและการออกแบบ (เทียบโอน)",
            "วิศวกรรมคอมพิวเตอร์"
        ];

        const cleanMajor = (str) => str ? str.replace(/\s*\([a-zA-Z\s]+\)/g, '').trim() : '';

        const submitToAPI = async (action, payload) => {
            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify({ action, payload })
                });
                return await response.json();
            } catch (err) {
                throw new Error("การเชื่อมต่อระบบเซิร์ฟเวอร์ล้มเหลว กรุณาลองใหม่อีกครั้ง");
            }
        };

        // UI Components
        const Icon = ({ name, size = 20, className = '' }) => {
            const containerRef = useRef(null);
            useEffect(() => {
                if (containerRef.current) {
                    containerRef.current.innerHTML = `<i data-lucide="${name}" class="${className}" style="width:${size}px; height:${size}px;"></i>`;
                    if (window.lucide) {
                        lucide.createIcons({ root: containerRef.current });
                    }
                }
            }, [name, size, className]);
            return <span ref={containerRef} className="inline-flex items-center justify-center shrink-0" />;
        };

        const TogglePill = ({ options, value, onChange, isWarningType }) => {
            return (
                <div className="flex flex-wrap gap-3">
                    {options.map(opt => {
                        const isActive = value === opt.value;
                        const isAlert = isWarningType && opt.value !== 'ไม่มี' && opt.value !== 'ไม่แพ้';
                        return (
                            <button key={opt.value} type="button" onClick={() => onChange(opt.value)}
                                className={`flex-1 min-w-[100px] py-3.5 px-4 rounded-xl font-bold transition-all duration-300 border flex items-center justify-center gap-2 text-sm btn-interactive shadow-sm
                                    ${isActive 
                                        ? isAlert ? 'border-red-500 bg-red-500 text-white shadow-glow-red' : 'border-brand bg-brand text-white shadow-glow-brand'
                                        : 'border-slate-200 dark:border-white/10 bg-white/50 dark:bg-black/20 text-slate-500 hover:bg-white dark:hover:bg-white/10 hover:border-slate-300 dark:hover:border-white/20 hover:text-slate-700 dark:hover:text-slate-200'}`}
                            >
                                {isActive && <Icon name={isAlert ? "alert-triangle" : "check-circle"} size={16} />}
                                {opt.label}
                            </button>
                        )
                    })}
                </div>
            );
        };

        const SectionHeader = ({ icon, title, colorClass }) => {
            return (
                <div className="flex items-center gap-3 mb-6 pb-4 border-b border-slate-200/50 dark:border-white/5">
                    <div className={`p-3 rounded-2xl shadow-sm ${colorClass}`}><Icon name={icon} size={22}/></div>
                    <h3 className="text-xl md:text-2xl font-black text-slate-800 dark:text-white tracking-tight">{title}</h3>
                </div>
            );
        };

        // PDPA Modal Component
        const PdpaModal = ({ onAccept, isDarkMode }) => {
            const [isChecked, setIsChecked] = useState(false);

            const handleDecline = () => Swal.fire({ 
                icon: 'warning', 
                title: 'จำเป็นต้องให้ความยินยอม', 
                text: 'ระบบจำเป็นต้องเก็บข้อมูลเพื่อความปลอดภัยและสิทธิประโยชน์ของท่าน หากปฏิเสธจะไม่สามารถดำเนินการลงทะเบียนต่อได้', 
                confirmButtonText: 'รับทราบ', 
                confirmButtonColor: '#ff6600', 
                background: isDarkMode ? '#18181b' : '#fff', 
                color: isDarkMode ? '#f8fafc' : '#0f172a', 
                customClass: { popup: 'rounded-[2rem]' } 
            });

            return (
                <div className="fixed inset-0 z-[100] flex items-center justify-center p-4 sm:p-6 bg-slate-900/70 dark:bg-black/90 backdrop-blur-lg animate-fade-in">
                    <div className="bg-white dark:bg-zinc-900 rounded-[2.5rem] max-w-3xl w-full relative shadow-[0_20px_60px_rgba(0,0,0,0.3)] dark:shadow-[0_20px_60px_rgba(0,0,0,0.8)] border border-slate-200 dark:border-zinc-800 animate-slide-up overflow-hidden flex flex-col max-h-[95vh]">
                        
                        <div className="absolute top-0 left-0 right-0 h-2 brand-gradient z-20"></div>
                        
                        <div className="p-6 md:p-8 pb-5 bg-white dark:bg-zinc-900 border-b border-slate-100 dark:border-white/5 flex items-start gap-5 relative overflow-hidden shrink-0">
                            <div className="absolute -right-10 -top-10 opacity-5 text-brand transform rotate-12 pointer-events-none"><Icon name="shield-check" size={150}/></div>
                            <div className="p-4 bg-brand/10 dark:bg-brand/20 rounded-2xl shrink-0 shadow-inner relative z-10">
                                <Icon name="shield-check" size={36} className="text-brand" />
                            </div>
                            <div className="relative z-10">
                                <div className="inline-block px-3 py-1 bg-slate-100 dark:bg-white/10 text-slate-600 dark:text-slate-300 text-[10px] font-black tracking-widest uppercase rounded-lg mb-2 shadow-sm">Privacy Policy</div>
                                <h2 className="text-2xl md:text-3xl font-black text-slate-800 dark:text-white leading-tight">นโยบายความยินยอม (PDPA)</h2>
                                <p className="text-brand dark:text-brandLight text-sm mt-1 font-semibold">เพื่อสิทธิประโยชน์ ความปลอดภัย และการดูแลอย่างใกล้ชิด</p>
                            </div>
                        </div>
                        
                        <div className="p-6 md:p-8 overflow-y-auto custom-scrollbar flex-1 bg-slate-50 dark:bg-black/40">
                            <p className="text-slate-700 dark:text-slate-300 text-sm md:text-base mb-6 leading-relaxed">
                                คณะเทคโนโลยีดิจิทัล ให้ความสำคัญอย่างยิ่งกับการคุ้มครองข้อมูลส่วนบุคคลของท่าน 
                                ตามพระราชบัญญัติคุ้มครองข้อมูลส่วนบุคคล พ.ศ. 2562 เรามีความจำเป็นต้องจัดเก็บและประมวลผลข้อมูลของท่านเพื่อใช้ในกิจกรรม ดังรายละเอียดต่อไปนี้:
                            </p>
                            
                            <div className="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">
                                <div className="bg-white dark:bg-zinc-800/80 p-5 rounded-2xl border border-slate-200/60 dark:border-white/5 shadow-sm hover:shadow-md transition-all group">
                                    <div className="w-10 h-10 bg-blue-50 dark:bg-blue-500/10 text-blue-600 rounded-xl flex items-center justify-center mb-3 group-hover:scale-110 transition-transform"><Icon name="user" size={20}/></div>
                                    <h4 className="font-bold text-slate-800 dark:text-white text-sm mb-1">ข้อมูลส่วนตัวเบื้องต้น</h4>
                                    <p className="text-xs text-slate-500 dark:text-slate-400">ชื่อ, รหัส นศ., สาขา, เบอร์โทร เพื่อใช้ตรวจสอบสิทธิ์และประสานงานตลอดกิจกรรม</p>
                                </div>
                                
                                <div className="bg-white dark:bg-zinc-800/80 p-5 rounded-2xl border border-slate-200/60 dark:border-white/5 shadow-sm hover:shadow-md transition-all group">
                                    <div className="w-10 h-10 bg-orange-50 dark:bg-orange-500/10 text-orange-600 rounded-xl flex items-center justify-center mb-3 group-hover:scale-110 transition-transform"><Icon name="pizza" size={20}/></div>
                                    <h4 className="font-bold text-slate-800 dark:text-white text-sm mb-1">ข้อมูลด้านโภชนาการ</h4>
                                    <p className="text-xs text-slate-500 dark:text-slate-400">ประวัติแพ้อาหาร, อาหารเฉพาะทาง (ฮาลาล/เจ) เพื่อจัดเตรียมมื้ออาหารที่ปลอดภัย</p>
                                </div>

                                <div className="bg-white dark:bg-zinc-800/80 p-5 rounded-2xl border border-slate-200/60 dark:border-white/5 shadow-sm hover:shadow-md transition-all group">
                                    <div className="w-10 h-10 bg-red-50 dark:bg-red-500/10 text-red-600 rounded-xl flex items-center justify-center mb-3 group-hover:scale-110 transition-transform"><Icon name="heart-pulse" size={20}/></div>
                                    <h4 className="font-bold text-slate-800 dark:text-white text-sm mb-1">ข้อมูลสุขภาพและการแพทย์</h4>
                                    <p className="text-xs text-slate-500 dark:text-slate-400">โรคประจำตัว, ประวัติการแพ้ยา เพื่อวางแผนปฐมพยาบาลกรณีเกิดเหตุฉุกเฉิน</p>
                                </div>
                            </div>

                            <div className="bg-blue-50/80 dark:bg-blue-950/30 border border-blue-100 dark:border-blue-900/30 p-5 rounded-2xl flex items-start gap-3 shadow-sm">
                                <Icon name="shield-alert" className="text-blue-500 mt-0.5 shrink-0" size={20}/>
                                <div className="text-xs md:text-sm text-blue-800 dark:text-blue-300 leading-relaxed">
                                    <span className="font-bold text-blue-900 dark:text-blue-200">การรักษาความปลอดภัย:</span> ข้อมูลทั้งหมดจะถูกเก็บรักษาเป็นความลับอย่างสูงสุด เข้าถึงได้เฉพาะผู้บริหารและทีมแพทย์/พยาบาลที่เกี่ยวข้องเท่านั้น และจะถูกทำลายทิ้งเมื่อเสร็จสิ้นโครงการ
                                </div>
                            </div>
                        </div>
                        
                        <div className="p-6 md:p-8 border-t border-slate-100 dark:border-white/5 bg-white dark:bg-zinc-900 shrink-0">
                            <label className="flex items-center justify-center md:justify-start gap-3 cursor-pointer group mb-6 w-full mx-auto md:mx-0 bg-slate-50 dark:bg-white/5 p-4 rounded-xl border border-slate-200 dark:border-white/10 hover:border-brand/50 transition-colors shadow-sm">
                                <input type="checkbox" checked={isChecked} onChange={e => setIsChecked(e.target.checked)} className="hidden" />
                                <div className={`w-6 h-6 rounded-md border-2 flex items-center justify-center transition-all shrink-0 ${isChecked ? 'bg-brand border-brand shadow-sm' : 'border-slate-300 dark:border-slate-600 group-hover:border-brand'}`}>
                                    {isChecked && <Icon name="check" size={16} className="text-white"/>}
                                </div>
                                <span className="text-sm font-bold text-slate-700 dark:text-slate-300 select-none">ฉันได้อ่านและยินยอมให้ประมวลผลข้อมูลส่วนบุคคลดังกล่าว</span>
                            </label>

                            <div className="flex flex-col sm:flex-row justify-end gap-3">
                                <button onClick={handleDecline} className="w-full sm:w-auto px-6 py-3.5 rounded-xl bg-slate-100 dark:bg-white/5 text-slate-600 dark:text-slate-400 font-bold hover:bg-slate-200 dark:hover:bg-white/10 transition-colors btn-interactive">ไม่ยินยอม</button>
                                <button 
                                    onClick={() => isChecked ? onAccept() : null} 
                                    disabled={!isChecked}
                                    className={`w-full sm:w-auto px-8 py-3.5 rounded-xl font-bold flex items-center justify-center gap-2 transition-all duration-300 btn-interactive
                                        ${isChecked ? 'brand-gradient text-white shadow-glow-brand hover:shadow-lg transform hover:-translate-y-0.5' : 'bg-slate-200 dark:bg-white/5 text-slate-400 dark:text-slate-600 border border-slate-300 dark:border-white/10 cursor-not-allowed'}`}
                                >
                                    <Icon name="check-circle" size={18}/> ยินยอมและขึ้นทะเบียน
                                </button>
                            </div>
                        </div>

                    </div>
                </div>
            );
        };

        // Admin Dashboard Component
        const AdminDashboard = ({ goBack, isDarkMode }) => {
            const [data, setData] = useState([]);
            const [loading, setLoading] = useState(true);
            const [selectedMajor, setSelectedMajor] = useState(null);
            const [selectedSurveillanceStudent, setSelectedSurveillanceStudent] = useState(null);
            const [editItem, setEditItem] = useState(null);
            const [activeTab, setActiveTab] = useState('overview');
            const [drilldownData, setDrilldownData] = useState({ title: '', list: [], type: '' });
            const [currentPage, setCurrentPage] = useState(1);
            const [searchTerm, setSearchTerm] = useState('');
            const [executiveMajor, setExecutiveMajor] = useState('ทั้งหมด');

            const loadData = () => {
                setLoading(true);
                Papa.parse(`${SHEET_CSV_URL}&_cb=${new Date().getTime()}`, {
                    download: true, header: true,
                    complete: (res) => {
                        setData(res.data.filter(row => row.StudentID).map(r => ({ ...r, Major: cleanMajor(r.Major) })));
                        setLoading(false);
                    },
                    error: () => { Swal.fire('ข้อผิดพลาด', 'เชื่อมต่อฐานข้อมูลล้มเหลว', 'warning'); setLoading(false); }
                });
            };
            useEffect(() => { loadData(); }, []);

            const executiveBaseMajors = useMemo(() => {
                const mSet = new Set();
                data.forEach(r => {
                    if(r.Major) mSet.add(r.Major.replace(/\s*\(เทียบโอน\)/g, '').trim());
                });
                return Array.from(mSet).sort();
            }, [data]);

            const filteredData = useMemo(() => {
                let result = data;
                if (searchTerm) {
                    const s = searchTerm.toLowerCase();
                    result = result.filter(r => 
                        (r.FullName || '').toLowerCase().includes(s) ||
                        (r.StudentID || '').toLowerCase().includes(s) ||
                        (r.Major || '').toLowerCase().includes(s) ||
                        (r.StudentPhone || '').includes(s) ||
                        (r.ParentPhone || '').includes(s)
                    );
                }
                
                if (activeTab === 'executive' && executiveMajor !== 'ทั้งหมด') {
                    result = result.filter(r => {
                        const baseMajor = r.Major ? r.Major.replace(/\s*\(เทียบโอน\)/g, '').trim() : '';
                        return baseMajor === executiveMajor;
                    });
                }
                
                return result;
            }, [data, searchTerm, activeTab, executiveMajor]);

            const stats = useMemo(() => {
                let total = filteredData.length, normalCount = 0, transferCount = 0, foodAlert = 0, healthAlert = 0;
                let majorCount = {}, dietStats = { 'ฮาลาล': 0, 'มังสวิรัติ': 0, 'เจ': 0, 'อาหารปกติ': 0 }, foodAllergies = [], diseases = [], drugAllergies = [];
                const surveillanceList = [];

                filteredData.forEach(s => {
                    if(s.Major) {
                        majorCount[s.Major] = (majorCount[s.Major] || 0) + 1;
                        s.Major.includes("เทียบโอน") ? transferCount++ : normalCount++;
                    }
                    let hasF = s.FoodAllergy !== 'ไม่แพ้' || s.SpecificDiet !== 'ไม่มี';
                    let hasH = s.Disease !== 'ไม่มี' || s.DrugAllergy !== 'ไม่แพ้';
                    if (hasF) foodAlert++; if (hasH) healthAlert++;

                    if (s.FoodAllergy && s.FoodAllergy !== 'ไม่แพ้') foodAllergies.push(s);
                    if (s.SpecificDiet) {
                        if (s.SpecificDiet === 'ไม่มี') dietStats['อาหารปกติ']++;
                        else if (s.SpecificDiet.includes('ฮาลาล')) dietStats['ฮาลาล']++;
                        else if (s.SpecificDiet.includes('มังสวิรัติ')) dietStats['มังสวิรัติ']++;
                        else if (s.SpecificDiet.includes('เจ')) dietStats['เจ']++;
                    }
                    if (s.Disease && s.Disease !== 'ไม่มี') diseases.push(s);
                    if (s.DrugAllergy && s.DrugAllergy !== 'ไม่แพ้') drugAllergies.push(s);

                    if (hasF || hasH) {
                        let issues = [];
                        if (s.FoodAllergy !== 'ไม่แพ้') issues.push({ type: 'food', text: `แพ้อาหาร: ${s.FoodAllergy}` });
                        if (s.SpecificDiet !== 'ไม่มี') issues.push({ type: 'food', text: `อาหารเฉพาะ: ${s.SpecificDiet}` });
                        if (s.Disease !== 'ไม่มี') issues.push({ type: 'health', text: `โรคประจำตัว: ${s.Disease}` });
                        if (s.DrugAllergy !== 'ไม่แพ้') issues.push({ type: 'health', text: `แพ้ยา: ${s.DrugAllergy}` });
                        surveillanceList.push({ ...s, issues });
                    }
                });
                return { total, pieData: Object.keys(majorCount).map(k=>({name:k, value:majorCount[k]})), COLORS: ['#ff6600', '#3b82f6', '#10b981', '#8b5cf6', '#ec4899', '#facc15', '#06b6d4'], foodAlert, healthAlert, surveillanceList, normalCount, transferCount, dietStats, foodAllergies, diseases, drugAllergies };
            }, [filteredData]);

            const handleDrilldown = (title, type, key) => {
                let filtered = [];
                if (type === 'religion_diet') filtered = filteredData.filter(s => s.SpecificDiet && s.SpecificDiet.includes(key));
                else if (type === 'food_allergy') filtered = filteredData.filter(s => s.FoodAllergy && s.FoodAllergy !== 'ไม่แพ้');
                else if (type === 'food_alert') filtered = filteredData.filter(s => (s.FoodAllergy && s.FoodAllergy !== 'ไม่แพ้') || (s.SpecificDiet && s.SpecificDiet !== 'ไม่มี'));
                else if (type === 'health_alert') filtered = filteredData.filter(s => s.Disease && s.Disease !== 'ไม่มี' || s.DrugAllergy && s.DrugAllergy !== 'ไม่แพ้');
                else if (type === 'disease') filtered = filteredData.filter(s => s.Disease && s.Disease !== 'ไม่มี');
                else if (type === 'drug_allergy') filtered = filteredData.filter(s => s.DrugAllergy && s.DrugAllergy !== 'ไม่แพ้');
                else if (type === 'demographics') {
                    if (key === 'normal') filtered = filteredData.filter(s => s.Major && !s.Major.includes('เทียบโอน'));
                    else if (key === 'transfer') filtered = filteredData.filter(s => s.Major && s.Major.includes('เทียบโอน'));
                }
                setDrilldownData({ title, type, list: filtered });
            };

            const handleDelete = (id, name) => {
                Swal.fire({ title: 'ยืนยันลบข้อมูล?', text: `ลบข้อมูลของ ${name}`, icon: 'warning', showCancelButton: true, confirmButtonColor: '#ef4444', confirmButtonText: 'ลบ', cancelButtonText: 'ยกเลิก', background: isDarkMode?'#18181b':'#fff', color: isDarkMode?'#f8fafc':'#0f172a', customClass:{popup:'rounded-3xl'} }).then((res) => {
                    if (res.isConfirmed) {
                        Swal.fire({ title: 'กำลังลบ...', didOpen: () => Swal.showLoading(), background: isDarkMode?'#18181b':'#fff', color: isDarkMode?'#f8fafc':'#0f172a' });
                        submitToAPI('delete', { StudentID: id }).then(r => { if(r.success) { Swal.fire({ icon:'success', title:'สำเร็จ', timer:1500, showConfirmButton:false, background: isDarkMode?'#18181b':'#fff' }); loadData(); } }).catch(err => Swal.fire('Error', err.message, 'error'));
                    }
                });
            };

            const handleSaveEdit = (e) => {
                e.preventDefault();
                if (editItem.IDCard && editItem.IDCard.length !== 13) {
                    Swal.fire({ icon: 'warning', title: 'ข้อมูลไม่ถูกต้อง', text: 'กรุณาระบุ Thai ID ให้ครบ 13 หลัก', confirmButtonColor: '#ff6600', background: isDarkMode?'#18181b':'#fff', color: isDarkMode?'#f8fafc':'#0f172a' });
                    return;
                }
                if (editItem.StudentPhone.length !== 10 || editItem.ParentPhone.length !== 10) {
                    Swal.fire({ icon: 'warning', title: 'ข้อมูลไม่ถูกต้อง', text: 'กรุณาระบุเบอร์โทรศัพท์ให้ครบ 10 หลัก', confirmButtonColor: '#ff6600', background: isDarkMode?'#18181b':'#fff', color: isDarkMode?'#f8fafc':'#0f172a' });
                    return;
                }
                Swal.fire({ title: 'กำลังอัปเดต...', didOpen: () => Swal.showLoading(), background: isDarkMode?'#18181b':'#fff' });
                submitToAPI('update', { oldStudentID: editItem.oldStudentID, newData: editItem }).then(res => { if(res.success) { Swal.fire({ icon:'success', title:'บันทึกสำเร็จ', timer:1500, showConfirmButton:false, background: isDarkMode?'#18181b':'#fff' }); setEditItem(null); loadData(); } }).catch(err => Swal.fire('Error', err.message, 'error'));
            };

            const exportExcel = () => {
                if (filteredData.length === 0) return;
                const exportData = filteredData.map(r => ({ 'วันที่': r.Timestamp||'', 'รหัสนักศึกษา': r.StudentID||'', 'ชื่อ-นามสกุล': r.FullName||'', 'สาขาวิชา': r.Major||'', 'ศาสนา': r.Religion||'', 'กรุ๊ปเลือด': r.BloodGroup||'', 'เบอร์ นศ.': r.StudentPhone||'', 'เบอร์ ผปค.': r.ParentPhone||'', 'แพ้อาหาร': r.FoodAllergy||'', 'อาหารเฉพาะ': r.SpecificDiet||'', 'โรคประจำตัว': r.Disease||'', 'แพ้ยา': r.DrugAllergy||'' }));
                const ws = window.XLSX.utils.json_to_sheet(exportData);
                const wb = window.XLSX.utils.book_new(); window.XLSX.utils.book_append_sheet(wb, ws, "Students");
                window.XLSX.writeFile(wb, `DIGIT_Export_${new Date().toISOString().slice(0,10)}.xlsx`);
            };

            if (loading) return (
                <div className="flex flex-col justify-center items-center h-[70vh]">
                    <div className="p-4 bg-brand/10 rounded-2xl mb-4 animate-pulse-slow shadow-glow-brand"><Icon name="loader-2" size={40} className="text-brand animate-spin" /></div>
                    <p className="text-slate-500 font-bold tracking-widest uppercase text-sm">กำลังเชื่อมต่อฐานข้อมูล...</p>
                </div>
            );

            const TABS = [
                { id: 'overview', icon: 'layout-dashboard', label: 'ภาพรวม' },
                { id: 'majors', icon: 'pie-chart', label: 'สาขาวิชา' },
                { id: 'diet', icon: 'utensils', label: 'โภชนาการ' },
                { id: 'health', icon: 'heart-pulse', label: 'สุขภาพ' },
                { id: 'surveillance', icon: 'shield-alert', label: 'กลุ่มเฝ้าระวัง' },
                { id: 'executive', icon: 'file-bar-chart', label: 'รายงานผู้บริหาร' }
            ];

            return (
                <div className="flex flex-col md:flex-row gap-6 animate-fade-in pb-20 items-start w-full">
                    {/* Admin Sidebar */}
                    <div className="w-full md:w-64 glass-panel p-5 rounded-[2rem] flex flex-col md:sticky md:top-24 z-20 shrink-0 no-print">
                        <div className="flex items-center gap-4 mb-8 px-2 pt-2">
                            <div className="w-12 h-12 bg-slate-900 dark:bg-white rounded-[1rem] flex items-center justify-center text-white dark:text-black shadow-lg"><Icon name="command" size={24}/></div>
                            <div>
                                <p className="text-[10px] text-brand font-black tracking-widest uppercase">Management</p>
                                <h3 className="font-black text-slate-800 dark:text-white leading-none text-lg mt-0.5">Dashboard</h3>
                            </div>
                        </div>
                        <div className="flex flex-row md:flex-col overflow-x-auto hide-scrollbar gap-2 pb-2 md:pb-0">
                            {TABS.map(tab => (
                                <button key={tab.id} onClick={() => { setActiveTab(tab.id); setCurrentPage(1); }} 
                                    className={`flex items-center gap-3 px-4 py-3.5 rounded-xl transition-all font-bold whitespace-nowrap btn-interactive
                                    ${activeTab === tab.id ? 'bg-brand text-white shadow-glow-brand' : 'text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-white/10 hover:text-slate-900 dark:hover:text-white'}`}>
                                    <Icon name={tab.icon} size={18} className={activeTab === tab.id ? 'text-white' : 'text-slate-400'}/> {tab.label}
                                </button>
                            ))}
                        </div>
                    </div>

                    {/* Admin Main Content */}
                    <div className="flex-1 w-full space-y-6 print-area min-w-0">
                        {/* Header Action Bar */}
                        <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center glass-panel p-5 md:px-8 md:py-6 rounded-[2rem] gap-4 no-print shadow-sm">
                            <h2 className="text-xl md:text-2xl font-black text-slate-800 dark:text-white flex items-center gap-3 whitespace-nowrap">
                                {(TABS.find(t=>t.id===activeTab) || {}).label}

                            <div className="flex flex-col xl:flex-row flex-wrap w-full sm:w-auto gap-3 items-start xl:items-center">
                                {/* ช่องค้นหา */}
                                <div className="relative w-full sm:w-64">
                                    <div className="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
                                        <Icon name="search" size={16}/>
                                    </div>
                                    <input 
                                        type="text" 
                                        placeholder="ค้นหาชื่อ, รหัส, สาขา, เบอร์..." 
                                        value={searchTerm}
                                        onChange={(e) => {setSearchTerm(e.target.value); setCurrentPage(1);}}
                                        className="w-full pl-10 pr-8 py-2.5 rounded-xl input-modern text-sm font-semibold"
                                    />
                                    {searchTerm && (
                                        <button onClick={() => {setSearchTerm(''); setCurrentPage(1);}} className="absolute inset-y-0 right-0 pr-3 flex items-center text-slate-400 hover:text-red-500 transition-colors">
                                            <Icon name="x" size={14}/>
                                        </button>
                                    )}
                                </div>
                                <div className="flex flex-wrap w-full sm:w-auto gap-2 justify-start sm:justify-end">
                                    {activeTab === 'executive' && <button onClick={window.print} className="px-5 py-2.5 bg-slate-100 dark:bg-white/10 text-slate-700 dark:text-white rounded-xl font-bold text-sm flex items-center gap-2 btn-interactive hover:bg-slate-200"><Icon name="printer" size={16} /> พิมพ์</button>}
                                    <button onClick={exportExcel} className="px-5 py-2.5 bg-emerald-50 dark:bg-emerald-500/10 text-emerald-600 dark:text-emerald-400 hover:bg-emerald-500 hover:text-white rounded-xl font-bold text-sm flex items-center gap-2 transition-all btn-interactive shadow-sm"><Icon name="download" size={16} /> Excel</button>
                                    <button onClick={loadData} className="p-2.5 bg-slate-100 dark:bg-white/10 rounded-xl text-slate-500 hover:text-slate-800 dark:hover:text-white btn-interactive shadow-sm"><Icon name="refresh-cw" size={18}/></button>
                                    <button onClick={goBack} className="p-2.5 bg-red-50 dark:bg-red-500/10 text-red-500 rounded-xl hover:bg-red-500 hover:text-white btn-interactive shadow-sm"><Icon name="log-out" size={18}/></button>
                                </div>
                            </div>
                        </div>

                        {/* --- TAB: OVERVIEW --- */}
                        {activeTab === 'overview' && (
                            <div className="space-y-6 animate-fade-in">
                                <div className="grid grid-cols-2 lg:grid-cols-4 gap-4 md:gap-6">
                                    {[
                                        {l:'ยอดขึ้นทะเบียน', v:stats.total, i:'users', c:'brand', tab: 'overview'}, 
                                        {l:'สาขาวิชา', v:stats.pieData.length, i:'layers', c:'blue', tab: 'majors'}, 
                                        {l:'เฝ้าระวังสุขภาพ', v:stats.healthAlert, i:'activity', c:'red', tab: 'surveillance'}, 
                                        {l:'โภชนาการเฉพาะ', v:stats.foodAlert, i:'utensils', c:'orange', tab: 'diet'}
                                    ].map((card, i) => (
                                        <div key={i} onClick={() => { setActiveTab(card.tab); setCurrentPage(1); }} className={`glass-panel p-6 md:p-8 rounded-[2rem] border border-slate-200/50 dark:border-white/5 relative overflow-hidden group hover:-translate-y-1 transition-all cursor-pointer shadow-soft hover:shadow-lg ${card.tab !== 'overview' ? 'hover:border-' + card.c + '-300 dark:hover:border-' + card.c + '-500/50' : ''}`}>
                                            <div className={`absolute -right-4 -top-4 w-32 h-32 rounded-full blur-3xl opacity-10 bg-${card.c}-500 group-hover:opacity-20 transition-opacity`}></div>
                                            <div className="flex justify-between items-start mb-6 relative z-10">
                                                <div className={`p-4 rounded-[1.25rem] bg-${card.c === 'brand' ? 'brand' : card.c+'-500'}/10 text-${card.c === 'brand' ? 'brand' : card.c+'-500'} w-max shadow-sm group-hover:scale-110 transition-transform`}><Icon name={card.i} size={32} /></div>
                                                {card.tab !== 'overview' && <div className="opacity-0 group-hover:opacity-100 transition-opacity p-2 bg-slate-50 dark:bg-white/5 rounded-xl text-slate-400 border border-slate-200 dark:border-white/10"><Icon name="arrow-up-right" size={16}/></div>}
                                            </div>
                                            <p className="text-slate-500 text-sm font-bold uppercase tracking-wider mb-2 relative z-10">{card.l}</p>
                                            <h3 className="text-5xl md:text-6xl font-black text-slate-800 dark:text-white relative z-10">{card.v}</h3>
                                        </div>
                                    ))}
                                </div>
                                <div className="glass-panel rounded-[2rem] overflow-hidden border border-slate-200/50 dark:border-white/5 shadow-soft">
                                    <div className="p-6 md:px-8 border-b border-slate-100 dark:border-white/5 bg-slate-50/50 dark:bg-white/5 flex justify-between items-center">
                                        <h3 className="font-bold text-slate-800 dark:text-white flex items-center gap-3"><div className="p-2 bg-brand/10 text-brand rounded-lg shadow-sm"><Icon name="users" size={16}/></div> รายชื่อขึ้นทะเบียนนักศึกษาใหม่</h3>
                                    </div>
                                    <div className="overflow-x-auto p-2 custom-scrollbar">
                                        <table className="w-full text-sm text-left min-w-[700px]">
                                            <thead className="text-[11px] text-slate-400 uppercase tracking-widest bg-transparent">
                                                <tr><th className="px-6 py-3">ชื่อ-นามสกุล</th><th className="px-6 py-3">สาขาวิชา</th><th className="px-6 py-3 text-center">สถานะ</th><th className="px-6 py-3">ข้อมูลติดต่อ</th><th className="px-6 py-3"></th></tr>
                                            </thead>
                                            <tbody className="divide-y divide-slate-100 dark:divide-white/5">
                                                {(() => {
                                                    const reversedData = [...filteredData].reverse();
                                                    const itemsPerPage = 20;
                                                    const totalPages = Math.ceil(reversedData.length / itemsPerPage);
                                                    const indexOfLastItem = currentPage * itemsPerPage;
                                                    const indexOfFirstItem = indexOfLastItem - itemsPerPage;
                                                    const currentItems = reversedData.slice(indexOfFirstItem, indexOfLastItem);
                                                    
                                                    if (currentItems.length === 0) return <tr><td colSpan="5" className="text-center py-12 text-slate-400 font-medium">ไม่พบข้อมูลที่ค้นหา</td></tr>;
                                                    
                                                    return currentItems.map((row, i) => {
                                                        const issues = [];
                                                        if (row.FoodAllergy && row.FoodAllergy !== 'ไม่แพ้') issues.push({ type: 'food', text: `แพ้อาหาร: ${row.FoodAllergy}` });
                                                        if (row.SpecificDiet && row.SpecificDiet !== 'ไม่มี') issues.push({ type: 'food', text: `อาหารเฉพาะ: ${row.SpecificDiet}` });
                                                        if (row.Disease && row.Disease !== 'ไม่มี') issues.push({ type: 'health', text: `โรคประจำตัว: ${row.Disease}` });
                                                        if (row.DrugAllergy && row.DrugAllergy !== 'ไม่แพ้') issues.push({ type: 'health', text: `แพ้ยา: ${row.DrugAllergy}` });
                                                        const isRisk = issues.length > 0;
                                                        
                                                        return (
                                                            <tr key={i} className="hover:bg-slate-50/80 dark:hover:bg-white/5 transition-colors group">
                                                                <td className="px-6 py-4 font-bold text-slate-800 dark:text-slate-200">{row.FullName}</td>
                                                                <td className="px-6 py-4 text-xs font-medium text-slate-500">{row.Major}</td>
                                                                <td className="px-6 py-4 text-center">
                                                                    {isRisk ? <span onClick={() => setSelectedSurveillanceStudent({...row, issues})} className="cursor-pointer inline-flex items-center gap-1.5 px-3 py-1.5 rounded-lg bg-red-50 dark:bg-red-500/10 text-red-600 dark:text-red-400 text-[10px] font-bold border border-red-200 dark:border-red-500/20 hover:bg-red-100 dark:hover:bg-red-500/30 transition-all shadow-sm btn-interactive"><Icon name="shield-alert" size={12}/> เฝ้าระวัง</span> 
                                                                            : <span onClick={() => setSelectedSurveillanceStudent({...row, issues})} className="cursor-pointer inline-flex items-center gap-1.5 px-3 py-1.5 rounded-lg bg-emerald-50 dark:bg-emerald-500/10 text-emerald-600 dark:text-emerald-400 text-[10px] font-bold border border-emerald-200 dark:border-emerald-500/20 hover:bg-emerald-100 dark:hover:bg-emerald-500/30 transition-all shadow-sm btn-interactive"><Icon name="check-circle" size={12}/> ปกติ</span>}
                                                                </td>
                                                                <td className="px-6 py-4 text-xs">
                                                                    <div className="text-slate-500 dark:text-slate-400 font-semibold flex items-center gap-1.5"><Icon name="user" size={12}/> นศ: {row.StudentPhone || '-'}</div>
                                                                    <div className="text-red-500 font-bold flex items-center gap-1.5 mt-1"><Icon name="phone-call" size={12}/> ผปค: {row.ParentPhone || '-'}</div>
                                                                </td>
                                                                <td className="px-6 py-4 text-right">
                                                                    <div className="flex justify-end gap-2 opacity-100 md:opacity-0 md:group-hover:opacity-100 transition-opacity">
                                                                        <button onClick={() => setEditItem({...row, oldStudentID: row.StudentID})} className="p-2 bg-white dark:bg-zinc-800 border border-slate-200 dark:border-white/10 hover:text-blue-500 hover:border-blue-300 rounded-lg transition-all shadow-sm btn-interactive"><Icon name="edit" size={14}/></button>
                                                                        <button onClick={() => handleDelete(row.StudentID, row.FullName)} className="p-2 bg-red-50 dark:bg-red-900/30 text-red-500 border border-red-100 dark:border-red-500/20 hover:bg-red-500 hover:text-white rounded-lg transition-all shadow-sm btn-interactive"><Icon name="trash-2" size={14}/></button>
                                                                    </div>
                                                                </td>
                                                            </tr>
                                                        );
                                                    });
                                                })()}
                                            </tbody>
                                        </table>
                                    </div>
                                    {filteredData.length > 0 && (
                                        <div className="flex flex-col sm:flex-row justify-between items-center p-5 border-t border-slate-100 dark:border-white/5 gap-4 bg-slate-50/50 dark:bg-transparent">
                                            <span className="text-xs font-semibold text-slate-500">
                                                แสดง {((currentPage - 1) * 20) + 1} - {Math.min(currentPage * 20, filteredData.length)} จากทั้งหมด {filteredData.length} รายการ
                                            </span>
                                            <div className="flex gap-2">
                                                <button onClick={() => setCurrentPage(p => Math.max(1, p - 1))} disabled={currentPage === 1} className="p-2.5 rounded-lg bg-white dark:bg-white/5 border border-slate-200 dark:border-white/10 shadow-sm disabled:opacity-50 disabled:cursor-not-allowed hover:bg-slate-50 dark:hover:bg-white/10 transition-colors btn-interactive"><Icon name="chevron-left" size={16}/></button>
                                                <span className="px-4 py-2 rounded-lg font-bold text-sm bg-brand/10 text-brand">หน้า {currentPage} / {Math.ceil(filteredData.length / 20) || 1}</span>
                                                <button onClick={() => setCurrentPage(p => Math.min(Math.ceil(filteredData.length / 20), p + 1))} disabled={currentPage === Math.ceil(filteredData.length / 20) || Math.ceil(filteredData.length / 20) === 0} className="p-2.5 rounded-lg bg-white dark:bg-white/5 border border-slate-200 dark:border-white/10 shadow-sm disabled:opacity-50 disabled:cursor-not-allowed hover:bg-slate-50 dark:hover:bg-white/10 transition-colors btn-interactive"><Icon name="chevron-right" size={16}/></button>
                                            </div>
                                        </div>
                                    )}
                                </div>
                            </div>
                        )}

                        {/* --- TAB: MAJORS --- */}
                        {activeTab === 'majors' && (
                            <div className="grid lg:grid-cols-5 gap-6 animate-fade-in">
                                {/* Left Side: Chart */}
                                <div className="lg:col-span-2 glass-panel p-6 md:p-8 rounded-[2rem] border border-slate-200/50 dark:border-white/5 flex flex-col items-center justify-center min-h-[450px] shadow-sm relative overflow-hidden">
                                    <div className="absolute top-0 left-0 w-full h-full bg-gradient-to-b from-transparent to-slate-50/50 dark:to-white/5 pointer-events-none"></div>
                                    <div className="w-full mb-2 text-center relative z-10">
                                        <span className="text-[10px] font-black uppercase tracking-widest text-brand bg-brand/10 px-3 py-1.5 rounded-lg mb-3 inline-block shadow-sm">Demographics</span>
                                        <h3 className="text-2xl font-black text-slate-800 dark:text-white">สัดส่วนสาขาวิชา</h3>
                                    </div>
                                    <div className="w-full flex-1 relative min-h-[320px] z-10">
                                        <ResponsiveContainer width="100%" height="100%">
                                            <PieChart>
                                                <Pie 
                                                    data={stats.pieData} 
                                                    innerRadius="70%" 
                                                    outerRadius="90%" 
                                                    paddingAngle={6} 
                                                    dataKey="value" 
                                                    stroke="none"

        // Main App Component (หน้าฟอร์มลงทะเบียน)
        const App = () => {

            const handleAdminLogin = () => {
                if(isAdmin) { setIsAdmin(false); return; }
                Swal.fire({ title: 'เข้าสู่ระบบจัดการ', input: 'password', inputPlaceholder: 'รหัสผ่าน', showCancelButton: true, confirmButtonText: 'เข้าสู่ระบบ', confirmButtonColor: '#ff6600', background: isDarkMode?'#18181b':'#ffffff', color: isDarkMode?'#f8fafc':'#0f172a', customClass:{popup:'rounded-[2rem]', confirmButton:'rounded-xl font-bold px-6 py-3', cancelButton:'rounded-xl font-bold px-6 py-3 bg-slate-200 text-slate-700 hover:bg-slate-300'} }).then((r) => {

                });

            const resetForm = () => {
                setStudentId(''); setIdCard(''); setFullName(''); setMajor(''); setStudentPhone(''); setParentPhone('');
                setReligion(''); setBloodGroup(''); setBloodGroupOther(''); setFoodAllergy('ไม่แพ้'); setFoodDetail(''); 
                setSpecificDiet('ไม่มี'); setSpecificDietDetail(''); setDisease('ไม่มี'); setDiseaseDetail(''); setDrugAllergy('ไม่แพ้'); setDrugDetail('');
            };

            const loadPublicData = () => {
                setLoadingPublic(true);
                Papa.parse(`${SHEET_CSV_URL}&_cb=${new Date().getTime()}`, {
                    download: true, header: true,

                        const validData = res.data.filter(row => row.StudentID).map(r => ({
                            ...r, Major: cleanMajor(r.Major)
