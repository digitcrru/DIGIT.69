                                    <h2 className="text-2xl font-bold text-charcoal-900">{selectedItem.Name}</h2><p className="text-gray-500 mt-1 text-sm">แบบประเมินความพึงพอใจ</p>
                                </div>
                                <form onSubmit={async (e) => { e.preventDefault(); if(Object.keys(surveyAnswers).length < 13) return Swal.fire('แจ้งเตือน','กรุณาประเมินให้ครบทุกข้อ','warning'); Swal.fire({title:'กำลังบันทึก...', didOpen:()=>Swal.showLoading()}); try{ await runGAS('saveCheckInAndSurvey', {student, activity:selectedItem, answers:surveyAnswers, suggestion}); Swal.fire('สำเร็จ','ขอบคุณที่ร่วมกิจกรรม','success').then(goHome); }catch(err){Swal.fire('Error',err.message,'error');} }}>
                                    {surveyData.map((cat, ci) => (
                                        <div key={ci} className="mb-8">
                                            <h3 className="font-bold text-gray-800 mb-4 border-l-4 border-orange-500 pl-3">{cat.title}</h3>
                                            <div className="space-y-3">
                                                {cat.questions.map(q => (
                                                    <div key={q.id} className="p-4 border rounded-xl flex flex-col md:flex-row justify-between md:items-center gap-3 hover:bg-gray-50 transition-colors">
                                                        <span className="text-sm text-gray-700">{q.text}</span>
                                                        <div className="flex gap-2 w-full md:w-auto justify-between">
                                                            {[5,4,3,2,1].map(n => <label key={n} className={`w-10 h-10 flex items-center justify-center rounded-lg border cursor-pointer font-bold text-sm ${surveyAnswers[q.id]===n ? 'bg-orange-500 text-white border-orange-600' : 'bg-white text-gray-400 hover:border-orange-300'}`}><input type="radio" className="hidden" name={q.id} value={n} onChange={()=>setSurveyAnswers({...surveyAnswers, [q.id]:n})} required />{n}</label>)}
                                                        </div>
                                                    </div>
                                                ))}
                                            </div>
                                        </div>
                                    ))}
                                    <div className="mb-8"><h3 className="font-bold text-gray-800 mb-3">ข้อเสนอแนะเพิ่มเติม</h3><textarea className="luxury-input w-full resize-none text-sm" rows="3" value={suggestion} onChange={e=>setSuggestion(e.target.value)} placeholder="พิมพ์ข้อเสนอแนะ..."></textarea></div>
                                    <button type="submit" className="w-full btn-gradient py-4 rounded-xl font-bold tracking-widest text-sm shadow-md">ส่งแบบประเมิน</button>
                                </form>
                            </div>
                        </div>
                    )}

                    {view === 'select_recruit' && student && (
                        <div className="flex-grow p-6 max-w-3xl mx-auto w-full pt-10">
                            <div className="flex justify-between items-center mb-6">
                                <h2 className="text-xl font-bold flex items-center gap-3"><i className="fa-solid fa-bullhorn text-purple-500"></i> เลือกโครงการที่สมัคร</h2>
                                <button onClick={()=>setView('search')} className="text-xs px-3 py-1.5 bg-gray-100 rounded-md font-bold text-gray-600 hover:bg-gray-200">เปลี่ยนรหัส</button>
                            </div>
                            <div className="grid gap-4">
                                {db.recs.filter(r=>String(r.Status).toLowerCase()==='open').length === 0 ? <p className="text-center py-10 text-gray-400 bg-white rounded-2xl border">ไม่มีประกาศเปิดรับ</p> : 
                                db.recs.filter(r=>String(r.Status).toLowerCase()==='open').map(r => (
                                    <div key={r.RecruitID} className="luxury-card p-5 flex flex-col sm:flex-row justify-between sm:items-center gap-4 border border-transparent hover:border-purple-200">
                                        <div><h3 className="font-bold text-gray-800">{r.Name}</h3><p className="text-xs text-gray-500 mt-1"><i className="fa-regular fa-clock text-purple-400 mr-1"></i> {r.Date} <span className="mx-2">|</span> <i className="fa-solid fa-location-dot text-purple-400 mr-1"></i> {r.Location}</p></div>
                                        <div className="flex gap-2">
                                            {getVal(r,['attachment','แนบ']) && <button onClick={()=>window.open(getVal(r,['attachment','แนบ']),'_blank')} className="px-4 py-2 bg-purple-50 text-purple-600 font-bold text-xs rounded-xl border border-purple-200">ดูไฟล์</button>}
                                            <button onClick={()=> { Swal.fire({title:'ยืนยันสมัคร?', text:r.Name, icon:'question', showCancelButton:true, confirmButtonColor:'#a855f7'}).then(res=>{ if(res.isConfirmed) { Swal.fire({title:'บันทึก...', didOpen:()=>Swal.showLoading()}); runGAS('saveRegistration',{student, recruit:r}).then(()=>Swal.fire('สำเร็จ','','success').then(goHome)).catch(e=>Swal.fire('Error',e.message,'error')); } }) }} className="px-5 py-2 bg-gradient-to-r from-purple-500 to-purple-600 text-white font-bold text-xs rounded-xl shadow-md">สมัคร</button>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        </div>
                    )}

                    {view === 'history_search' && (
                        <div className="flex-grow flex items-center justify-center p-6">
                            <div className="luxury-card w-full max-w-md p-8 relative">
                                <button onClick={goHome} className="absolute top-4 left-4 text-xs text-gray-400 hover:text-gray-800"><i className="fa-solid fa-arrow-left"></i> กลับ</button>
                                <div className="text-center mt-6 mb-6">
                                    <i className="fa-solid fa-clock-rotate-left text-4xl text-blue-500 mb-3"></i>
                                    <h2 className="text-xl font-bold">ตรวจสอบประวัติ</h2><p className="text-xs text-gray-500 mt-1">กรอกรหัสนักศึกษา หรือ บัตรประชาชน</p>
                                </div>
                                <form onSubmit={(e) => { e.preventDefault(); setPurpose('history'); handleSearch(e); }}>
                                    <input type="text" name="studentId" required className="luxury-input text-center text-lg font-bold tracking-wider mb-4" defaultValue={localStorage.getItem('last_sid')||''} placeholder="กรอกรหัส..." />
                                    <button type="submit" className="w-full bg-gradient-to-r from-blue-500 to-blue-600 text-white py-3.5 rounded-xl font-bold tracking-widest uppercase text-sm shadow-md shadow-blue-500/20">ค้นหาประวัติ</button>
                                </form>
                            </div>
                        </div>
                    )}

                    {view === 'history_result' && (
                        <div className="flex-grow p-6 max-w-3xl mx-auto w-full pt-10 pb-20">
                            <div className="flex justify-between items-center mb-8">
                                <div><h2 className="text-xl font-bold"><i className="fa-solid fa-clock-rotate-left text-blue-500 mr-2"></i> ประวัติของคุณ</h2><p className="text-sm text-gray-500 mt-1">รหัส: {student?.StudentID}</p></div>
                                <button onClick={()=>setView('history_search')} className="text-xs px-4 py-2 bg-white border shadow-sm rounded-xl font-bold">ค้นหาใหม่</button>
                            </div>
                            
                            {histShirts.length > 0 && (
                                <div className="mb-8">
                                    <h3 className="text-sm font-bold text-rose-600 mb-4 pl-3 border-l-4 border-rose-500"><i className="fa-solid fa-shirt mr-2"></i>ประวัติจองเสื้อ</h3>
                                    {histShirts.map((s,i) => (
                                        <div key={i} className="bg-white p-5 rounded-xl shadow-sm border border-rose-100 mb-3 flex flex-col sm:flex-row justify-between gap-4 items-start sm:items-center">
                                            <div><StatusBadge status={String(getVal(s,['status','สถานะ'])).toLowerCase()==='received' ? 'closed' : 'open'} openLabel="ชำระแล้ว" closedLabel="รอตรวจสอบ/รอชำระ" /><p className="text-sm font-bold text-gray-800 mt-2">ยอดรวม ฿{Number(getVal(s,['totalprice','ยอด'])||0).toLocaleString()}</p><p className="text-xs text-gray-400 mt-0.5"><i className="fa-regular fa-clock mr-1"></i>{formatTHDate(getVal(s,['timestamp','เวลา'])).full}</p></div>
                                            <button onClick={()=>{ setReceiptData({ student, poloGender:getVal(s,['pologender']), poloSize:getVal(s,['polosize']), poloQty:getVal(s,['poloqty']), tshirtGender:getVal(s,['tshirtgender']), tshirtSize:getVal(s,['tshirtsize']), tshirtQty:getVal(s,['tshirtqty']), grandTotal:Number(getVal(s,['totalprice'])), paymentMethod:getVal(s,['paymentmethod']), orderId:'ORD-'+(new Date(getVal(s,['timestamp'])).getTime()||Date.now()).toString().slice(-6), date:formatTHDate(getVal(s,['timestamp'])).full, status:getVal(s,['status']) }); setView('receipt'); }} className="text-xs font-bold text-rose-600 px-4 py-2.5 bg-rose-50 rounded-xl w-full sm:w-auto text-center border border-rose-200">ดูใบเสร็จ</button>
                                        </div>
                                    ))}
                                </div>
                            )}

                            <div>
                                <h3 className="text-sm font-bold text-orange-600 mb-4 pl-3 border-l-4 border-orange-500"><i className="fa-solid fa-list-check mr-2"></i>ประวัติเช็คชื่อกิจกรรม ({histActs.length})</h3>
                                {histActs.length === 0 ? <p className="text-center text-sm text-gray-400 py-10 bg-white border border-dashed rounded-2xl">ไม่พบประวัติการเข้าร่วม</p> : 
                                    <div className="border-l-2 border-orange-200 ml-4 pl-6 space-y-5 py-2">
                                        {histActs.map((a,i) => (
                                            <div key={i} className="relative bg-white p-4 rounded-xl border border-gray-100 shadow-sm"><div className="absolute -left-[32px] top-4 w-3.5 h-3.5 bg-white border-2 border-orange-500 rounded-full"></div><p className="text-[10px] font-bold text-orange-400 uppercase tracking-widest mb-1">เข้าร่วมแล้ว</p><h4 className="font-bold text-sm text-charcoal-900">{getVal(a,['activityname','กิจกรรม'])}</h4><p className="text-xs text-gray-500 mt-1"><i className="fa-regular fa-clock"></i> {formatTHDate(getVal(a,['timestamp','เวลา'])).full}</p></div>
                                        ))}
                                    </div>
                                }
                            </div>
                        </div>
                    )}

                    {view === 'shirt_form' && student && (
                        <div className="flex-grow flex flex-col items-center pt-8 p-4 pb-20">
                            <div className="luxury-card w-full max-w-2xl p-6 sm:p-10 border-t-4 border-t-orange-500">
                                <div className="flex justify-between items-center mb-8 border-b pb-6"><h2 className="text-xl font-bold">ฟอร์มสั่งจองเสื้อ</h2><button onClick={()=>setView('search')} className="text-xs bg-gray-100 px-3 py-1.5 rounded-md font-bold text-gray-600">เปลี่ยนรหัส</button></div>
                                {(shirtConfig.popupText || shirtConfig.popupImg) && ( <div className="mb-6 bg-indigo-50 border border-indigo-100 p-4 rounded-xl flex justify-between items-center"><div className="flex items-center gap-3"><i className="fa-solid fa-circle-info text-indigo-500 text-xl"></i><div><h4 className="font-bold text-indigo-900 text-sm">ประกาศก่อนสั่งซื้อ</h4><p className="text-xs text-indigo-700/80">โปรดเช็คตารางไซส์และข้อความแจ้งเตือน</p></div></div><button type="button" onClick={()=>Swal.fire({title:'ประกาศ', text:shirtConfig.popupText, imageUrl:shirtConfig.popupImg, confirmButtonColor:'#ea580c'})} className="px-4 py-2 bg-indigo-600 text-white text-xs font-bold rounded-lg shadow-sm">ดูรายละเอียด</button></div> )}
                                
                                <form onSubmit={e => {
                                    e.preventDefault();
                                    const gTotal = ((['XL','2XL','3XL'].includes(poloSize)?shirtConfig.oversize:shirtConfig.normal)*poloQty) + ((['XL','2XL','3XL'].includes(tshirtSize)?shirtConfig.oversize:shirtConfig.normal)*tshirtQty);
                                    if(poloQty<1 || tshirtQty<1) return Swal.fire('Error','ระบุจำนวนอย่างน้อย 1 ตัว','warning');
                                    if(gTotal>0 && paymentMethod==='promptpay' && !slipImage) return Swal.fire('Error','แนบสลิปการโอนเงินด้วย','warning');
                                    
                                    Swal.fire({title:'กำลังบันทึก...', didOpen:()=>Swal.showLoading()});
                                    const pl = { student, poloGender, poloSize, poloQty, tshirtGender, tshirtSize, tshirtQty, grandTotal:gTotal, slipImage, paymentMethod };
                                    runGAS('saveShirtOrder', pl).then(()=>{ Swal.close(); setReceiptData({...pl, orderId:'ORD-'+Date.now().toString().slice(-6), date:new Date().toLocaleString('th-TH'), status:'received'}); setView('receipt'); }).catch(err=>Swal.fire('Error',err.message,'error'));
                                }}>
                                    <ShirtSection num="01" title="เสื้อคอปกโปโล" genderState={poloGender} setGenderState={setPoloGender} sizeState={poloSize} setSizeState={setPoloSize} qtyState={poloQty} setQtyState={setPoloQty} getPrice={s=>(['XL','2XL','3XL'].includes(s)?shirtConfig.oversize:shirtConfig.normal)} />
                                    <ShirtSection num="02" title="เสื้อยืดกิจกรรม" genderState={tshirtGender} setGenderState={setTshirtGender} sizeState={tshirtSize} setSizeState={setTshirtSize} qtyState={tshirtQty} setQtyState={setTshirtQty} getPrice={s=>(['XL','2XL','3XL'].includes(s)?shirtConfig.oversize:shirtConfig.normal)} />
                                    
                                    <div className="bg-orange-50 p-6 rounded-2xl mb-6 flex justify-between items-center border border-orange-200"><div><p className="text-xs font-bold text-orange-600/70 uppercase">ยอดชำระสุทธิ</p></div><div className="text-3xl font-black text-orange-600">฿{((['XL','2XL','3XL'].includes(poloSize)?shirtConfig.oversize:shirtConfig.normal)*poloQty + (['XL','2XL','3XL'].includes(tshirtSize)?shirtConfig.oversize:shirtConfig.normal)*tshirtQty).toLocaleString()}</div></div>

                                    {((['XL','2XL','3XL'].includes(poloSize)?shirtConfig.oversize:shirtConfig.normal)*poloQty + (['XL','2XL','3XL'].includes(tshirtSize)?shirtConfig.oversize:shirtConfig.normal)*tshirtQty) > 0 && (
                                        <div className="mb-8">
                                            <h3 className="font-bold text-charcoal-900 mb-4"><span className="text-orange-500 mr-2">03.</span> การชำระเงิน</h3>
                                            <div className="flex gap-4 mb-4">
                                                <label className={`flex-1 py-4 border rounded-xl text-center cursor-pointer font-bold text-sm ${paymentMethod==='promptpay'?'bg-orange-50 border-orange-500 text-orange-600':'bg-white text-gray-500 hover:border-orange-300'}`}><input type="radio" className="hidden" checked={paymentMethod==='promptpay'} onChange={()=>setPaymentMethod('promptpay')}/><i className="fa-solid fa-qrcode block text-xl mb-1"></i> โอนเงิน</label>
                                                <label className={`flex-1 py-4 border rounded-xl text-center cursor-pointer font-bold text-sm ${paymentMethod==='cash'?'bg-orange-50 border-orange-500 text-orange-600':'bg-white text-gray-500 hover:border-orange-300'}`}><input type="radio" className="hidden" checked={paymentMethod==='cash'} onChange={()=>setPaymentMethod('cash')}/><i className="fa-solid fa-coins block text-xl mb-1"></i> เงินสด</label>
                                            </div>
                                            {paymentMethod === 'promptpay' && (
                                                <div className="bg-blue-50/50 border border-blue-100 p-5 rounded-2xl">
                                                    <div className="flex items-center gap-4 mb-4"><img src={`https://promptpay.io/0812345678/${(['XL','2XL','3XL'].includes(poloSize)?shirtConfig.oversize:shirtConfig.normal)*poloQty + (['XL','2XL','3XL'].includes(tshirtSize)?shirtConfig.oversize:shirtConfig.normal)*tshirtQty}.png`} className="w-24 h-24 rounded-lg border bg-white p-1" /><div className="text-sm text-[#113566]"><b>PromptPay</b><br/>081-234-5678<br/><span className="text-xs text-gray-500">สโมสรนักศึกษาฯ</span></div></div>
                                                    <label className="flex flex-col items-center justify-center w-full h-32 border-2 border-orange-200 border-dashed rounded-xl cursor-pointer bg-white relative overflow-hidden group">
                                                        {slipImage ? <img src={slipImage} className="h-full object-contain p-1" /> : <div className="text-center"><i className="fa-solid fa-upload text-orange-400 text-xl mb-2"></i><p className="text-xs font-bold text-gray-600">แนบสลิปโอนเงิน (บังคับ)</p></div>}
                                                        <input type="file" className="hidden" accept="image/*" onChange={(e) => { const f = e.target.files[0]; if(f){ if(f.size>5*1024*1024) return Swal.fire('Error','รูปเกิน 5MB','warning'); const r = new FileReader(); r.onload=()=>setSlipImage(r.result); r.readAsDataURL(f); } }} />
                                                    </label>
                                                </div>
                                            )}
                                            {paymentMethod === 'cash' && <div className="bg-amber-50 p-5 rounded-2xl border border-amber-200 text-center"><i className="fa-solid fa-money-bill-wave text-amber-500 text-3xl mb-2"></i><p className="font-bold text-amber-700 text-sm">กรุณานำเงินสดมาชำระที่จุดรับเสื้อ</p></div>}
                                        </div>
                                    )}
                                    <div className="flex gap-4">
                                        {isEditingOrder && <button type="button" onClick={()=>setView('receipt')} className="w-1/3 border py-4 rounded-xl font-bold text-gray-600 text-sm">ยกเลิก</button>}
                                        <button type="submit" className="flex-1 btn-gradient py-4 rounded-xl font-bold tracking-widest text-sm shadow-md">ยืนยันการสั่งจอง</button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}

                    {view === 'admin_login' && (
                        <div className="flex-grow flex items-center justify-center p-6">
                            <div className="bg-white w-full max-w-md p-10 rounded-[2rem] shadow-xl border border-gray-100 text-center relative overflow-hidden">
                                <button onClick={goHome} className="absolute top-6 left-6 text-gray-400 hover:text-orange-500"><i className="fa-solid fa-arrow-left"></i></button>
                                <div className="w-20 h-20 bg-gradient-to-br from-charcoal-800 to-charcoal-900 rounded-2xl mx-auto flex items-center justify-center text-white text-3xl mb-6 shadow-lg rotate-3"><i className="fa-solid fa-fingerprint -rotate-3"></i></div>
                                <h2 className="text-2xl font-bold mb-8 text-charcoal-900">Admin Portal</h2>
                                <form onSubmit={(e)=>{ e.preventDefault(); if(e.target.u.value==='admin'&&e.target.p.value==='9999'){localStorage.setItem('admin_logged_in','true'); setView('admin_dashboard');}else{Swal.fire('Error','รหัสผิด','error');} }}>
                                    <input type="text" name="u" placeholder="Username" required className="w-full bg-gray-50 border p-3 rounded-xl mb-4 text-sm outline-none focus:border-charcoal-900" />
                                    <input type="password" name="p" placeholder="Password" required className="w-full bg-gray-50 border p-3 rounded-xl mb-8 text-sm outline-none focus:border-charcoal-900" />
                                    <button type="submit" className="w-full bg-charcoal-900 text-white font-bold py-3.5 rounded-xl uppercase tracking-widest text-sm shadow-md hover:bg-black">Sign In</button>
                                </form>
                            </div>
                        </div>
                    )}

                    {view !== 'admin_login' && view !== 'admin_dashboard' && <Footer />}
                    <MobileTabBar />
                </div>
            );
        }

        // ==========================================
        // 5. INITIALIZATION
        // ==========================================
        try {
            const root = ReactDOM.createRoot(document.getElementById('root'));
            root.render(<App />);
        } catch (err) {
            console.error("React Failed to Initialize:", err);
            document.body.innerHTML = '<div style="display:flex; height:100vh; align-items:center; justify-content:center; color:#ef4444; font-family:sans-serif;"><h1>ระบบขัดข้อง กรุณารีเฟรชหน้าเว็บ</h1></div>';
        }
    </script>
</body>
</html>
