<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DIGIT.69</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config={darkMode:'class',theme:{extend:{colors:{brand:'#ff6600',brandDark:'#cc5200',brandLight:'#ff8533'},boxShadow:{'glow-brand':'0 0 25px rgba(255,102,0,0.3)','glow-red':'0 0 25px rgba(239,68,68,0.3)','soft':'0 10px 40px -10px rgba(0,0,0,0.08)'},animation:{'fade-in':'fadeIn 0.4s ease-out','slide-up':'slideUp 0.5s ease-out'},keyframes:{fadeIn:{'0%':{opacity:'0',transform:'scale(0.98)'},'100%':{opacity:'1',transform:'scale(1)'}},slideUp:{'0%':{opacity:'0',transform:'translateY(20px)'},'100%':{opacity:'1',transform:'translateY(0)'}}}}}}
    </script>
    
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- แก้ไข Library ให้โหลดตามลำดับที่ถูกต้อง ป้องกัน Error Recharts -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-is@18/umd/react-is.production.min.js"></script>
    <script src="https://unpkg.com/prop-types@15.8.1/prop-types.min.js"></script>
    <script src="https://unpkg.com/recharts@2.1.12/umd/Recharts.js"></script>
    
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://cdn.jsdelivr.net/npm/@sweetalert2/theme-dark@4/dark.css" rel="stylesheet" id="swal-theme">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <style>
        body{font-family:'Prompt',sans-serif;background-color:#f8fafc;overflow-x:hidden;}
        .dark body{background-color:#09090b;}
        body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background-image:radial-gradient(at 0% 0%,hsla(28,100%,74%,0.15) 0px,transparent 50%),radial-gradient(at 100% 0%,hsla(250,100%,74%,0.1) 0px,transparent 50%),radial-gradient(at 100% 100%,hsla(28,100%,74%,0.15) 0px,transparent 50%);}
        .dark body::before{background-image:radial-gradient(at 0% 0%,hsla(28,100%,50%,0.08) 0px,transparent 50%),radial-gradient(at 100% 0%,hsla(250,100%,50%,0.05) 0px,transparent 50%),radial-gradient(at 100% 100%,hsla(28,100%,50%,0.08) 0px,transparent 50%);}
        .glass-panel{background:rgba(255,255,255,0.7);backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,0.6);box-shadow:0 4px 30px rgba(0,0,0,0.03);transition:all 0.3s ease;}
        .dark .glass-panel{background:rgba(24,24,27,0.65);border:1px solid rgba(255,255,255,0.08);box-shadow:0 4px 30px rgba(0,0,0,0.3);}
        .input-modern{outline:none;background:rgba(255,255,255,0.8);border:1px solid #e2e8f0;color:#0f172a;transition:all 0.3s ease;}
        .input-modern:focus{border-color:#ff6600;box-shadow:0 0 0 4px rgba(255,102,0,0.1);background:#ffffff;}
        .dark .input-modern{background:rgba(0,0,0,0.3);border:1px solid rgba(255,255,255,0.1);color:#f8fafc;}
        .dark .input-modern:focus{border-color:#ff6600;box-shadow:0 0 0 4px rgba(255,102,0,0.15);background:rgba(0,0,0,0.5);}
        .brand-gradient{background:linear-gradient(135deg,#ff8533 0%,#ff6600 50%,#e65c00 100%);}
        ::-webkit-scrollbar{width:6px;height:6px;}::-webkit-scrollbar-track{background:transparent;}.light-mode ::-webkit-scrollbar-thumb{background:#cbd5e1;border-radius:10px;}.dark ::-webkit-scrollbar-thumb{background:#3f3f46;border-radius:10px;}
        .btn-interactive{transition:transform 0.15s ease,box-shadow 0.3s ease;}.btn-interactive:active:not(:disabled){transform:scale(0.97);}
        .custom-scrollbar::-webkit-scrollbar{width:6px;height:6px;}.custom-scrollbar::-webkit-scrollbar-track{background:transparent;}.custom-scrollbar::-webkit-scrollbar-thumb{background:rgba(156,163,175,0.5);border-radius:10px;}
        @media print{body{background:white!important;color:black!important;}body::before{display:none;}.no-print{display:none!important;}.print-area{display:block!important;width:100%!important;margin:0!important;padding:0!important;}.glass-panel{border:none!important;box-shadow:none!important;background:white!important;}.avoid-break{break-inside:avoid;}}
    </style>
</head>
<body>
    <div id="root"></div>
    <script type="text/babel">
        const { useState, useEffect, useMemo, useRef, createContext, useContext } = React;
        const { BarChart, Bar, XAxis, YAxis, Tooltip, ResponsiveContainer, PieChart, Pie, Cell, Legend } = window.Recharts || {};

        const AppContext = createContext();
        const API_URL = "https://script.google.com/macros/s/AKfycbwviBRd_BbtvGyEpZSq5ab5A0iEpXkG9iMwAUQyGyZb-nDI2R5-x8GE5ZEI3gpmzA3zug/exec";
        const SHEET_ID = "1MoZpnDniVF5pKr0tEgmYwlPO3wZdA7DaO_MvZjbC-ec";
        
        const REG_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&sheet=Registration`;
        const REG69_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&sheet=Registration69`;
        const ACT_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&sheet=Activities`;
        const LOGS_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&sheet=Logs`;
        const SURVEY_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&sheet=Surveys`;
        
        const MAJORS = ["เทคโนโลยีดิจิทัลเพื่อธุรกิจ","เทคโนโลยีดิจิทัลเพื่อธุรกิจ(เทียบโอน)","เทคโนโลยีปัญญาประดิษฐ์","เทคโนโลยีสารสนเทศ","เทคโนโลยีสารสนเทศ(เทียบโอน)","วิทยาการคอมพิวเตอร์","กราฟิกดีไซน์เทคโนโลยีสื่อดิจิทัล","กราฟิกดีไซน์สื่อศิลปะและการออกแบบ","กราฟิกดีไซน์สื่อศิลปะและการออกแบบ(เทียบโอน)","วิศวกรรมคอมพิวเตอร์"];
        const cleanMajor = (s) => s ? s.replace(/\s*\([^)]*\)/g, '').trim() : '';

        const submitAPI = async (action, payload) => {
            try { const res = await fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ action, payload }) }); return await res.json(); } 
            catch (err) { throw new Error("การเชื่อมต่อระบบล้มเหลว"); }
        };

        function Icon({ name, size=20, className='' }) {
            const r = useRef(null);
            useEffect(() => { if (r.current) { r.current.innerHTML = `<i data-lucide="${name}" class="${className}" style="width:${size}px; height:${size}px;"></i>`; if (window.lucide) lucide.createIcons({ root: r.current }); } }, [name, size, className]);
            return <span ref={r} className={`inline-flex items-center justify-center shrink-0 ${className}`} />;
        }

        function StatCard({ label, value, icon, color, onClick, subtext }) {
            const c = {
                brand: { bg: 'bg-orange-50 dark:bg-orange-500/10', text: 'text-brand', hover: 'hover:border-brand/40 hover:shadow-glow-brand/20' },
                emerald: { bg: 'bg-emerald-50 dark:bg-emerald-500/10', text: 'text-emerald-600 dark:text-emerald-400', hover: 'hover:border-emerald-400/40 hover:shadow-lg' },
                red: { bg: 'bg-red-50 dark:bg-red-500/10', text: 'text-red-600 dark:text-red-400', hover: 'hover:border-red-400/40 hover:shadow-glow-red/20' }
            }[color] || { bg: 'bg-slate-50 dark:bg-white/5', text: 'text-slate-600 dark:text-slate-400', hover: 'hover:border-slate-400/40 hover:shadow-lg' };
            return (
                <div onClick={onClick} className={`p-6 rounded-[2rem] border border-slate-200/50 dark:border-white/5 ${c.bg} relative overflow-hidden shadow-soft ${onClick ? `cursor-pointer btn-interactive group ${c.hover}` : ''} transition-all duration-300 flex flex-col justify-between`}>
                    <div className={`absolute right-0 top-0 p-6 opacity-0 ${onClick?'group-hover:opacity-10 group-hover:scale-110':'opacity-5'} transition-all transform translate-x-2 -translate-y-2 ${c.text}`}><Icon name={icon} size={100} /></div>
                    <div className="flex justify-between items-start mb-4 relative z-10"><div className={`p-3 rounded-[1rem] bg-white/60 dark:bg-black/20 ${c.text} shadow-sm`}><Icon name={icon} size={28} /></div></div>
                    <div className="relative z-10"><p className="text-slate-500 dark:text-slate-400 text-xs font-bold uppercase tracking-wider mb-1">{label}</p><div className="flex items-end gap-3"><h3 className="text-4xl font-black text-slate-800 dark:text-white drop-shadow-sm leading-none">{value}</h3>{subtext && <span className="text-sm font-bold text-slate-500 mb-1">{subtext}</span>}</div></div>
                </div>
            );
        }

        function SecHeader({ icon, title, cClass }) {
            return <div className="flex items-center gap-3 mb-6 pb-4 border-b border-slate-200/50 dark:border-white/5"><div className={`p-3 rounded-2xl shadow-sm ${cClass}`}><Icon name={icon} size={22}/></div><h3 className="text-xl md:text-2xl font-black text-slate-800 dark:text-white tracking-tight">{title}</h3></div>;
        }

        function Input({ label, type="text", val, onChange, ph, max, req, num, rows, dis }) {
            return (
                <div className="flex flex-col gap-1.5 w-full">
                    <label className="text-xs font-bold text-slate-600 dark:text-slate-400 uppercase tracking-widest">{label} {req && <span className="text-red-500">*</span>}</label>
                    {rows ? <textarea disabled={dis} value={val} onChange={e=>onChange(e.target.value)} placeholder={ph} maxLength={max} required={req} rows={rows} className="w-full input-modern rounded-xl px-4 py-3 text-sm font-semibold shadow-sm resize-none disabled:opacity-60" /> : <input disabled={dis} type={type} value={val} onChange={e=>{let v=e.target.value;if(num)v=v.replace(/\D/g,'');onChange(v);}} placeholder={ph} maxLength={max} required={req} className={`w-full input-modern rounded-xl px-4 py-3 text-sm font-semibold shadow-sm ${num?'font-mono':''} disabled:opacity-60`} />}
                </div>
            );
        }

        // --- VIEWS ---
        function HomeView({ onNew, onAct, onChk, onAdmin, users, isRegOpen }) {
            const login = () => {
                Swal.fire({
                    title: '<h3 class="text-2xl font-black text-slate-800 dark:text-white mb-2">Admin Login</h3>',
                    html: `<div class="flex flex-col gap-4 text-left px-2"><div><label class="text-xs font-bold text-slate-500 uppercase tracking-widest mb-1.5 block">Username</label><input id="sw-user" class="w-full input-modern rounded-xl px-4 py-3 text-sm font-semibold shadow-sm" placeholder="กรอกชื่อผู้ใช้งาน" autocapitalize="off"></div><div><label class="text-xs font-bold text-slate-500 uppercase tracking-widest mb-1.5 block">Password</label><input id="sw-pass" type="password" class="w-full input-modern rounded-xl px-4 py-3 text-sm font-semibold shadow-sm font-mono" placeholder="••••••••"></div></div>`,
                    showCancelButton: true, confirmButtonText: 'เข้าสู่ระบบ', cancelButtonText: 'ยกเลิก', confirmButtonColor: '#ff6600',
                    customClass: { popup: 'rounded-[2rem] bg-white dark:bg-zinc-900 border border-slate-200/50 dark:border-white/5 shadow-2xl pb-6', confirmButton: 'rounded-xl font-bold px-8 py-3.5 shadow-md w-full sm:w-auto', cancelButton: 'rounded-xl font-bold px-8 py-3.5 w-full sm:w-auto', actions: 'flex gap-3 w-full justify-center px-6 mt-6' },
                    preConfirm: () => { const u=document.getElementById('sw-user').value.trim(); const p=document.getElementById('sw-pass').value.trim(); if(!u||!p)Swal.showValidationMessage('กรุณากรอกให้ครบ'); return {u,p}; }
                }).then((r) => {
                    if(r.isConfirmed) {
                        const fu = users.find(x => x.username===r.value.u && x.password===r.value.p && x.status==='Active');
                        if(fu) onAdmin(fu); else Swal.fire({icon:'error',title:'ล้มเหลว',text:'ชื่อผู้ใช้งาน หรือรหัสผ่านไม่ถูกต้อง',confirmButtonColor:'#ff6600',customClass:{popup:'rounded-[2rem] bg-white dark:bg-zinc-900 text-slate-800 dark:text-white'}});
                    }
                });
            };
            return (
                <div className="flex flex-col items-center justify-center min-h-[85vh] animate-fade-in relative">
                    <button onClick={login} className="absolute top-0 right-0 p-3 text-slate-400 hover:text-brand bg-white/50 dark:bg-black/20 hover:bg-white dark:hover:bg-white/10 backdrop-blur-md rounded-full shadow-sm border border-slate-200/50 dark:border-white/5 btn-interactive flex items-center gap-2"><span className="text-xs font-bold uppercase hidden sm:inline-block pl-2">Staff Login</span><Icon name="log-in" size={18} /></button>
                    <div className="text-center mb-10 mt-10"><div className="inline-flex items-center justify-center p-5 bg-brand/10 text-brand rounded-[2rem] shadow-glow-brand mb-6"><Icon name="box" size={56} /></div><h1 className="text-5xl md:text-6xl font-black text-slate-800 dark:text-white tracking-tight mb-4">DIGIT<span className="text-brand">.69</span></h1><p className="text-slate-500 font-bold text-sm md:text-base uppercase tracking-widest">Student Service Portal</p></div>
                    <div className="grid grid-cols-1 md:grid-cols-3 gap-6 w-full max-w-5xl px-2">
                        <div onClick={()=>{isRegOpen?onNew():Swal.fire({icon:'warning',title:'ปิดให้บริการ',text:'ขณะนี้ปิดรับขึ้นทะเบียนนักศึกษาใหม่ชั่วคราว',customClass:{popup:'rounded-[2rem] bg-white dark:bg-zinc-900 dark:text-white'}})}} className={`glass-panel p-8 rounded-[2.5rem] border-t-[8px] ${isRegOpen?'border-t-brand shadow-soft hover:-translate-y-2 cursor-pointer group':'border-t-slate-400 opacity-80 cursor-not-allowed'} transition-all flex flex-col items-center text-center relative overflow-hidden`}>
                            <div className={`w-20 h-20 ${isRegOpen?'bg-brand/10 text-brand group-hover:scale-110':'bg-slate-200 dark:bg-slate-800 text-slate-500'} rounded-[1.5rem] flex items-center justify-center mb-6 transition-transform shadow-inner relative z-10`}><Icon name={isRegOpen?"user-plus":"lock"} size={40} /></div>
                            <h3 className="text-xl font-black text-slate-800 dark:text-white mb-2 relative z-10">1. ขึ้นทะเบียน นศ.ใหม่ {!isRegOpen&&<span className="block text-sm text-red-500 mt-1">(ปิดระบบ)</span>}</h3>
                            <p className="text-slate-500 font-medium relative z-10 text-sm">บันทึกประวัติ ข้อมูลสุขภาพ และโภชนาการ</p>
                        </div>
                        <div onClick={onAct} className="glass-panel p-8 rounded-[2.5rem] border-t-[8px] border-t-purple-500 shadow-soft hover:-translate-y-2 transition-all cursor-pointer group flex flex-col items-center text-center relative overflow-hidden">
                            <div className="w-20 h-20 bg-purple-50 dark:bg-purple-500/10 text-purple-600 rounded-[1.5rem] flex items-center justify-center mb-6 group-hover:scale-110 shadow-inner relative z-10"><Icon name="calendar-check" size={40} /></div>
                            <h3 className="text-xl font-black text-slate-800 dark:text-white mb-2 relative z-10">2. ลงทะเบียนกิจกรรม</h3>
                            <p className="text-slate-500 font-medium relative z-10 text-sm">ระบบเช็คชื่อเข้าร่วมกิจกรรมต่างๆ ของคณะ</p>
                        </div>
                        <div onClick={onChk} className="glass-panel p-8 rounded-[2.5rem] border-t-[8px] border-t-blue-500 shadow-soft hover:-translate-y-2 transition-all cursor-pointer group flex flex-col items-center text-center relative overflow-hidden">
                            <div className="w-20 h-20 bg-blue-50 dark:bg-blue-500/10 text-blue-600 rounded-[1.5rem] flex items-center justify-center mb-6 group-hover:scale-110 shadow-inner relative z-10"><Icon name="history" size={40} /></div>
                            <h3 className="text-xl font-black text-slate-800 dark:text-white mb-2 relative z-10">3. ตรวจสอบประวัติ</h3>
                            <p className="text-slate-500 font-medium relative z-10 text-sm">ตรวจสอบประวัติการเข้าร่วมกิจกรรมของคุณ</p>
                        </div>
                    </div>
                </div>
            );
        }

        function CheckActivityView({ onBack }) {
            const [step, setStep] = useState(1); const [searchID, setSearchID] = useState(''); const [isSearching, setIsSearching] = useState(false); const [stdData, setStdData] = useState(null); const [acts, setActs] = useState([]);
            const handleSearch = (e) => {
                e.preventDefault(); if (!searchID.trim()) return Swal.fire({ icon: 'warning', title: 'แจ้งเตือน', text: 'กรุณากรอกรหัส' }); 
                setIsSearching(true);
                Papa.parse(`${REG69_URL}&_cb=${Date.now()}`, { download: true, header: true, complete: (res) => {
                        const f = res.data.find(r => r.IDCard?.trim()===searchID.trim() || r.StudentID?.trim()===searchID.trim());
                        if (!f) { Swal.fire({ icon:'error', title:'ไม่พบข้อมูล' }); setIsSearching(false); return; }
                        Papa.parse(`${LOGS_URL}&_cb=${Date.now()}`, { download: true, header: true, complete: (logRes) => {
                                setStdData({ FullName: f.FullName, StudentID: f.StudentID, Major: cleanMajor(f.Major), IDCard: f.IDCard });
                                setActs(logRes.data.filter(l => l.StudentID === f.StudentID)); setStep(2); setIsSearching(false);
                            }});
                    }
                });
            };
            return (
                <div className="max-w-3xl mx-auto animate-fade-in pb-10"><button onClick={step===1?onBack:()=>setStep(1)} className="flex items-center gap-2 text-slate-500 font-bold mb-6"><Icon name="arrow-left" size={16}/> {step===1?'ย้อนกลับ':'ค้นหาใหม่'}</button>
                    {step===1 && <form onSubmit={handleSearch} className="glass-panel p-10 rounded-[2.5rem] border-t-8 border-blue-500 text-center"><div className="w-20 h-20 bg-blue-100 text-blue-600 rounded-full flex justify-center items-center mx-auto mb-6"><Icon name="history" size={40}/></div><h2 className="text-2xl font-black dark:text-white mb-2">ตรวจสอบกิจกรรม</h2><div className="max-w-md mx-auto mt-8"><input type="text" value={searchID} onChange={e=>setSearchID(e.target.value)} placeholder="รหัสนักศึกษา / เลขบัตร ปชช." className="w-full input-modern rounded-xl px-4 py-4 text-center font-mono font-bold mb-6" required /><button type="submit" disabled={isSearching} className="w-full py-4 bg-blue-500 text-white rounded-xl font-black">{isSearching?'กำลังค้นหา...':'ค้นหาข้อมูล'}</button></div></form>}
                    {step===2 && stdData && <div className="glass-panel p-8 rounded-[2.5rem] border-t-8 border-blue-500"><div className="bg-slate-50 dark:bg-black/20 p-8 rounded-3xl flex items-center gap-6"><div className="w-20 h-20 bg-blue-100 text-blue-600 rounded-full flex justify-center items-center"><Icon name="user" size={40}/></div><div><h3 className="text-2xl font-black dark:text-white">{stdData.FullName}</h3><p className="font-mono text-blue-600 mt-1">{stdData.StudentID}</p></div></div><div className="mt-8"><h4 className="text-lg font-black dark:text-white mb-4">ประวัติเข้าร่วม ({acts.length} ครั้ง)</h4>{acts.length>0?<div className="space-y-3">{acts.slice().reverse().map((a,i)=><div key={i} className="bg-white dark:bg-zinc-800 p-4 rounded-2xl flex gap-3 items-center shadow-sm"><div className="w-8 h-8 rounded-full bg-emerald-100 text-emerald-500 flex items-center justify-center"><Icon name="check" size={16}/></div><div><h5 className="font-bold dark:text-white">{a.ActivityName}</h5><p className="text-xs text-slate-500">{new Date(a.Timestamp).toLocaleString('th-TH')}</p></div></div>)}</div>:<p className="text-center p-6 text-slate-500">ไม่เคยเข้าร่วมกิจกรรม</p>}</div></div>}
                </div>
            );
        }

        function PdpaModal({ onAccept, onBack }) {
            const [chk, setChk] = useState(false);
            return (

                let mc={}, ds={'ฮาลาล':0,'มังสวิรัติ':0,'เจ':0,'ไม่มี':0}, fa=[], md=[], ma=[]; const sl=[]; let sp={'ด้านการแพทย์':0,'ด้านโภชนาการ':0,'เสี่ยงซ้อน':0};
                us.forEach(s=>{ if(s.Major) mc[s.Major]=(mc[s.Major]||0)+1; let hF=s.FoodAllergy!=='ไม่แพ้'||s.SpecificDiet!=='ไม่มี'; let hH=s.Disease!=='ไม่มี'||s.DrugAllergy!=='ไม่แพ้'; if(s.FoodAllergy!=='ไม่แพ้')fa.push(s); if(s.SpecificDiet)ds[s.SpecificDiet]=(ds[s.SpecificDiet]||0)+1; if(s.Disease!=='ไม่มี')md.push(s); if(s.DrugAllergy!=='ไม่แพ้')ma.push(s); if(hF||hH){sl.push({...s,i:[]}); if(hF&&hH)sp['เสี่ยงซ้อน']++;else if(hF)sp['ด้านโภชนาการ']++;else sp['ด้านการแพทย์']++;} });
                return { t:us.length, pd:Object.keys(mc).map(k=>({name:k,value:mc[k]})), c:['#ff6600','#3b82f6','#10b981','#8b5cf6','#ec4899','#facc15','#06b6d4'], fA:fa.length, hA:md.length+ma.length, sl, sp:Object.keys(sp).map(k=>({name:k,value:sp[k]})).filter(d=>d.value>0), us, fa, md, ma, ds };
            },[fData]);

            const sStats = useMemo(()=>{
                const fs = selSurvey==='ทั้งหมด'?surveys:surveys.filter(s=>s.ActivityName===selSurvey); let t=fs.length; let cmts=[];
                const qm = {q1_1:'1.1 ประชาสัมพันธ์',q1_2:'1.2 สถานที่',q1_3:'1.3 ระยะเวลา',q1_4:'1.4 ขั้นตอน',q2_1:'2.1 เอกสาร',q2_2:'2.2 โสตทัศนูปกรณ์',q2_3:'2.3 เจ้าหน้าที่',q2_4:'2.4 อาหาร',q3_1:'3.1 ได้ความรู้',q3_2:'3.2 นำไปใช้ได้',q3_3:'3.3 ตรงคาดหวัง',q3_4:'3.4 เอื้อต่อเรียนรู้',q3_5:'3.5 ประโยชน์'};
                let cd=[], flat=[]; let oSum=0, aVals=[];
                Object.keys(qm).forEach(k=>{
                    let sum=0, vals=[], cnt={5:0,4:0,3:0,2:0,1:0};
                    fs.forEach(s=>{ let v=Number(s[k]||s[k.toUpperCase()]||0); if(v>0){sum+=v;vals.push(v);cnt[v]++;} if(k==='q1_1'&&s.Comment) cmts.push({text:s.Comment,date:s.Timestamp,std:s.StudentID}); });
                    const mean=vals.length?sum/vals.length:0; oSum+=sum; aVals.push(...vals);
                    cd.push({name:k.replace('_','.').replace('q',''), q:qm[k], 5:cnt[5], 4:cnt[4], 3:cnt[3], 2:cnt[2], 1:cnt[1]});
                    flat.push({id:k, q:qm[k], mean:mean.toFixed(2), interp:mean>=4.5?'มากที่สุด':mean>=3.5?'มาก':mean>=2.5?'ปานกลาง':mean>=1.5?'น้อย':mean>0?'น้อยที่สุด':'ไม่มีข้อมูล'});
                });
                return { t, oMean: aVals.length?(oSum/aVals.length).toFixed(2):0, cd, flat, cmts:cmts.filter((v,i,a)=>a.findIndex(t=>(t.text===v.text))===i) };
            }, [surveys, selSurvey]);

            const dl = (t, ty, k) => {
                let fl=[]; if(ty==='all')fl=stats.us; else if(ty==='hlth')fl=stats.us.filter(s=>s.Disease==='ไม่มี'&&s.DrugAllergy==='ไม่แพ้'); else if(ty==='fA')fl=stats.us.filter(s=>(s.FoodAllergy!=='ไม่แพ้'||s.SpecificDiet!=='ไม่มี')); else if(ty==='hA')fl=stats.us.filter(s=>(s.Disease!=='ไม่มี'||s.DrugAllergy!=='ไม่แพ้')); else if(ty==='sl')fl=stats.sl; else if(ty==='act')fl=actLogs.filter(r=>r.ActivityName===k); else if(ty==='mj')fl=stats.us.filter(s=>s.Major===k); else if(ty==='act_major')fl=actLogs.filter(r=>r.ActivityName===k.act&&r.Major===k.maj);
                setDd({t, l:fl, ty});
            };

            const toggleReg = () => { const nv = !isRegOpen; setRegOpen(nv); localStorage.setItem('digit69_isRegOpen', nv); Swal.fire({icon:'success',title:nv?'เปิดระบบ':'ปิดระบบ',timer:1000,showConfirmButton:false}); };
            const exXls = () => {
                let d=[]; let sn="Export";
                if(actTab==='overview'){ d=stats.us; sn="Students"; } else if(actTab==='act_sum'){ d=actLogs.map(l=>({'รหัสนักศึกษา':l.StudentID,'ชื่อ':l.FullName,'สาขา':l.Major,'รหัสประจำตัว ปชช.':l.IDCard||'-','กิจกรรม':l.ActivityName,'เวลา':new Date(l.Timestamp).toLocaleString('th-TH')})); sn="Activities"; }
                if(d.length){const ws=window.XLSX.utils.json_to_sheet(d);const wb=window.XLSX.utils.book_new();window.XLSX.utils.book_append_sheet(wb,ws,sn);window.XLSX.writeFile(wb,`Export_${actTab}.xlsx`);}else Swal.fire('ไม่มีข้อมูล','','info');
            };

            if(loading&&!stats.t)return <div className="text-center py-20 animate-pulse font-bold text-brand">กำลังโหลดข้อมูล...</div>;

            return (
                <div className="flex flex-col md:flex-row gap-6 items-start pb-10">

                        <div className="flex items-center gap-4 mb-6"><div className="w-12 h-12 bg-slate-900 text-white rounded-2xl flex justify-center items-center"><Icon name="command"/></div><div><p className="text-[10px] text-brand font-black">{curUser?.username}</p><h3 className="font-black dark:text-white leading-none">{curUser?.role}</h3></div></div>
                        <div className="flex flex-col gap-2">{TABS.map(t=><button key={t.id} onClick={()=>setActTab(t.id)} className={`flex items-center gap-3 px-4 py-3.5 rounded-xl font-bold transition-all text-sm ${actTab===t.id?'bg-brand text-white shadow-glow-brand':'text-slate-500 hover:bg-white/50 dark:hover:bg-white/10'}`}><Icon name={t.i} size={18}/> {t.l}</button>)}</div>

                            <div className="flex gap-2">{actTab!=='settings'&&actTab!=='users'&&<button onClick={exXls} className="px-5 py-2 bg-emerald-50 text-emerald-600 rounded-xl font-bold text-sm flex items-center gap-2"><Icon name="download" size={16}/> Export</button>}<button onClick={goBack} className="px-5 py-2 bg-red-50 text-red-500 rounded-xl font-bold text-sm flex items-center gap-2"><Icon name="log-out" size={16}/> ออกระบบ</button></div>
                        </div>

                        {actTab==='overview'&&<div className="space-y-6"><div className="grid grid-cols-2 lg:grid-cols-4 gap-4"><StatCard label="ขึ้นทะเบียนรวม" value={stats.t} icon="users" color="brand" onClick={()=>dl('ขึ้นทะเบียนรวม','all','')}/><StatCard label="สุขภาพแข็งแรง" value={stats.t-stats.hA} icon="check-circle" color="emerald" onClick={()=>dl('สุขภาพแข็งแรง','hlth','')}/><StatCard label="เฝ้าระวังแพทย์" value={stats.hA} icon="activity" color="red" onClick={()=>dl('เฝ้าระวังแพทย์','hA','')}/><StatCard label="อาหารพิเศษ" value={stats.fA} icon="pizza" color="brand" onClick={()=>dl('อาหารพิเศษ','fA','')}/></div><div className="glass-panel p-6 rounded-[2.5rem]"><h3 className="font-bold mb-4 dark:text-white">อัปเดตล่าสุด</h3><div className="overflow-x-auto"><table className="w-full text-sm text-left"><thead className="text-xs text-slate-400 uppercase bg-transparent"><tr><th className="py-2 px-4">ชื่อ-นามสกุล</th><th className="py-2 px-4">สาขาวิชา</th><th className="py-2 px-4">สถานะ</th></tr></thead><tbody className="divide-y divide-slate-100 dark:divide-white/5">{stats.us.slice().reverse().slice(0,10).map((r,i)=><tr key={i}><td className="py-3 px-4 font-bold dark:text-white">{r.FullName}</td><td className="py-3 px-4 text-xs text-slate-500">{r.Major}</td><td className="py-3 px-4">{r.Disease!=='ไม่มี'||r.FoodAllergy!=='ไม่แพ้'?<span className="text-red-500 text-xs font-bold bg-red-50 px-2 py-1 rounded-md">เฝ้าระวัง</span>:<span className="text-emerald-500 text-xs font-bold bg-emerald-50 px-2 py-1 rounded-md">ปกติ</span>}</td></tr>)}</tbody></table></div></div></div>}
                        
                        {actTab==='majors'&&<div className="glass-panel p-8 rounded-[2.5rem]"><h3 className="text-2xl font-black mb-6 dark:text-white">สัดส่วนสาขาวิชา</h3><div className="h-[400px] w-full"><ResponsiveContainer><PieChart><Pie data={stats.pd} innerRadius="50%" outerRadius="80%" dataKey="value">{stats.pd.map((e,i)=><Cell key={i} fill={stats.c[i%stats.c.length]} onClick={()=>dl(e.name,'mj',e.name)} className="cursor-pointer"/>)}</Pie><Tooltip contentStyle={{borderRadius:'16px',background:'rgba(255,255,255,0.9)'}}/><Legend /></PieChart></ResponsiveContainer></div></div>}

                        {actTab==='health'&&<div className="space-y-6"><div className="grid grid-cols-2 md:grid-cols-4 gap-4"><div className="glass-panel p-6 rounded-3xl border-t-4 border-orange-500 text-center"><p className="text-sm font-bold text-slate-500">แพ้อาหาร</p><h3 className="text-3xl font-black text-orange-600">{stats.fa.length}</h3></div><div className="glass-panel p-6 rounded-3xl border-t-4 border-blue-500 text-center"><p className="text-sm font-bold text-slate-500">ฮาลาล/เจ/มัง</p><h3 className="text-3xl font-black text-blue-600">{stats.t - stats.ds['ไม่มี']}</h3></div><div className="glass-panel p-6 rounded-3xl border-t-4 border-pink-500 text-center"><p className="text-sm font-bold text-slate-500">โรคประจำตัว</p><h3 className="text-3xl font-black text-pink-600">{stats.md.length}</h3></div><div className="glass-panel p-6 rounded-3xl border-t-4 border-purple-500 text-center"><p className="text-sm font-bold text-slate-500">ประวัติแพ้ยา</p><h3 className="text-3xl font-black text-purple-600">{stats.ma.length}</h3></div></div><div className="glass-panel p-6 rounded-[2.5rem]"><h3 className="font-bold mb-4 dark:text-white">รายชื่อผู้ต้องดูแลพิเศษด้านโภชนาการ</h3><div className="overflow-x-auto"><table className="w-full text-sm text-left"><thead className="text-xs text-slate-400 uppercase border-b border-slate-100"><tr><th className="py-2">ชื่อ</th><th className="py-2">อาหารเฉพาะ</th><th className="py-2">แพ้อาหาร</th></tr></thead><tbody className="divide-y divide-slate-100">{stats.us.filter(r=>r.SpecificDiet!=='ไม่มี'||r.FoodAllergy!=='ไม่แพ้').map((r,i)=><tr key={i}><td className="py-3 font-bold dark:text-white">{r.FullName}</td><td className="py-3 text-blue-600 text-xs font-bold">{r.SpecificDiet!=='ไม่มี'?r.SpecificDiet:'-'}</td><td className="py-3 text-orange-600 text-xs font-bold">{r.FoodAllergy!=='ไม่แพ้'?r.FoodAllergy:'-'}</td></tr>)}</tbody></table></div></div></div>}

                        {actTab==='surv'&&<div className="glass-panel p-8 rounded-[2.5rem] border-t-[8px] border-red-500"><div className="flex justify-between items-center mb-6"><h3 className="text-2xl font-black text-red-600">กลุ่มเฝ้าระวังความเสี่ยง (Surveillance)</h3><div className="text-4xl font-black text-red-500">{stats.sl.length} <span className="text-base text-slate-500">คน</span></div></div><div className="overflow-x-auto"><table className="w-full text-sm text-left"><thead className="text-xs text-slate-400 uppercase border-b border-slate-100"><tr><th className="py-3">ชื่อ-นามสกุล</th><th className="py-3">สาขาวิชา</th><th className="py-3 text-center">ประเด็นเสี่ยง (ข้อ)</th></tr></thead><tbody className="divide-y divide-slate-100">{stats.sl.map((r,i)=><tr key={i}><td className="py-4 font-bold text-red-600">{r.FullName}</td><td className="py-4 text-xs">{r.Major}</td><td className="py-4 text-center"><span className="bg-red-100 text-red-600 px-2 py-1 rounded-full font-bold">{r.i?.length||1}</span></td></tr>)}</tbody></table></div></div>}

                        {actTab==='create_act'&&<div className="space-y-6"><form onSubmit={async e=>{e.preventDefault(); if(!actForm.name)return; Swal.fire({title:'บันทึก...',didOpen:()=>Swal.showLoading()}); try{await submitAPI('create_activity',{ActivityName:actForm.name,ActivityDate:actForm.d,Location:actForm.l});Swal.fire('สำเร็จ','','success');setActForm({name:'',d:'',l:''});}catch(err){Swal.fire('Error',err.message,'error');}}} className="glass-panel p-8 rounded-[2.5rem] border-t-8 border-purple-500 space-y-4"><h3 className="text-xl font-black dark:text-white">สร้างกิจกรรมใหม่</h3><Input label="ชื่อกิจกรรม" val={actForm.name} onChange={v=>setActForm({...actForm,name:v})} req/><div className="grid grid-cols-2 gap-4"><Input type="datetime-local" label="เวลา" val={actForm.d} onChange={v=>setActForm({...actForm,d:v})} req/><Input label="สถานที่" val={actForm.l} onChange={v=>setActForm({...actForm,l:v})} req/></div><button type="submit" className="px-8 py-3 bg-purple-600 text-white rounded-xl font-bold">บันทึก</button></form><div className="glass-panel p-6 rounded-[2.5rem]"><table className="w-full text-sm text-left"><thead className="text-xs text-slate-400 border-b"><tr><th className="py-2">ชื่อกิจกรรม</th><th className="py-2 text-center">ผู้เข้าร่วม</th></tr></thead><tbody className="divide-y divide-slate-100">{actDefs.map((a,i)=><tr key={i}><td className="py-3 font-bold dark:text-white">{a.ActivityName}</td><td className="py-3 text-center text-purple-600 font-bold">{actLogs.filter(x=>x.ActivityName===a.ActivityName).length}</td></tr>)}</tbody></table></div></div>}

                        {actTab==='act_sum'&&<div className="space-y-6"><div className="glass-panel p-6 rounded-[2.5rem] bg-pink-50 dark:bg-pink-900/20"><h3 className="text-xl font-black text-pink-600 flex items-center gap-2"><span className="w-3 h-3 bg-red-500 rounded-full animate-ping"></span> Real-Time Recording</h3></div>{actDefs.map((a,i)=>{const lg=actLogs.filter(x=>x.ActivityName===a.ActivityName); const mc=lg.reduce((acc,c)=>{const m=c.Major||'อื่นๆ'; acc[m]=(acc[m]||0)+1; return acc;},{}); return <div key={i} className="glass-panel p-6 rounded-[2.5rem]"><div className="flex justify-between items-center mb-4"><h4 className="text-lg font-bold dark:text-white">{a.ActivityName}</h4><button onClick={()=>dl(`ลงทะเบียน: ${a.ActivityName}`,'act',a.ActivityName)} className="bg-pink-100 text-pink-600 px-6 py-2 rounded-xl font-black">{lg.length} คน</button></div><div className="grid grid-cols-2 md:grid-cols-4 gap-3">{Object.entries(mc).map(([m,c],j)=><div key={j} onClick={()=>dl(`สาขา: ${m}`,'act_major',{act:a.ActivityName, maj:m})} className="p-3 bg-slate-50 dark:bg-white/5 rounded-xl cursor-pointer hover:border-pink-300 border border-transparent"><p className="text-xs text-slate-500 truncate">{m}</p><p className="font-bold text-xl dark:text-white">{c}</p></div>)}</div></div>})}</div>}

                        {actTab==='survey'&&<div className="space-y-6"><div className="glass-panel p-8 rounded-[2.5rem] border-t-8 border-yellow-500"><div className="flex justify-between items-center mb-6"><h3 className="text-xl font-black dark:text-white">รายงาน SPSS</h3><select value={selSurvey} onChange={e=>setSelSurvey(e.target.value)} className="input-modern rounded-xl px-4 py-2"><option value="ทั้งหมด">รวมทุกกิจกรรม</option>{actDefs.map((a,i)=><option key={i} value={a.ActivityName}>{a.ActivityName}</option>)}</select></div><div className="grid grid-cols-2 gap-4 mb-6"><div className="p-6 bg-slate-50 dark:bg-white/5 rounded-2xl text-center"><p className="text-xs font-bold text-slate-500">จำนวนผู้ประเมิน (N)</p><h3 className="text-4xl font-black dark:text-white">{sStats.t}</h3></div><div className="p-6 bg-yellow-50 dark:bg-yellow-900/20 rounded-2xl text-center"><p className="text-xs font-bold text-yellow-600">ค่าเฉลี่ยรวม (x̄)</p><h3 className="text-4xl font-black text-yellow-600">{sStats.oMean}</h3></div></div><div className="overflow-x-auto"><table className="w-full text-sm text-left"><thead className="text-xs text-slate-400 border-b"><tr><th className="py-2">หัวข้อ</th><th className="py-2 text-center">Mean</th><th className="py-2 text-center">แปลผล</th></tr></thead><tbody className="divide-y divide-slate-100">{sStats.flat.map((f,i)=><tr key={i}><td className="py-3 font-semibold dark:text-white">{f.q}</td><td className="py-3 text-center font-bold text-brand">{f.mean}</td><td className="py-3 text-center text-xs">{f.interp}</td></tr>)}</tbody></table></div></div></div>}

                        {actTab==='users'&&<div className="glass-panel p-8 rounded-[2.5rem]"><div className="flex justify-between items-center mb-6"><h3 className="text-xl font-black dark:text-white">จัดการ Admin</h3><button onClick={()=>{setUForm({id:null,user:'',pass:'',role:'Manager',status:'Active'});setShowU(true);}} className="bg-slate-800 text-white px-4 py-2 rounded-xl text-sm font-bold">+ เพิ่มผู้ใช้</button></div><table className="w-full text-sm text-left"><thead className="text-xs text-slate-400 border-b"><tr><th className="py-2">Username</th><th className="py-2">Role</th><th className="py-2">จัดการ</th></tr></thead><tbody className="divide-y divide-slate-100">{adminList.map(u=><tr key={u.id}><td className="py-3 font-bold dark:text-white">{u.user}</td><td className="py-3"><span className="bg-blue-50 text-blue-600 px-2 py-1 rounded-md text-xs font-bold">{u.role}</span></td><td className="py-3"><button onClick={()=>{setUForm({...u,pass:''});setShowU(true);}} className="text-slate-400 hover:text-blue-500 mr-3"><Icon name="edit" size={16}/></button></td></tr>)}</tbody></table></div>}

                        {actTab==='settings'&&<div className="glass-panel p-8 rounded-[2.5rem] border-t-[8px] border-slate-500"><h3 className="text-xl font-black mb-6 dark:text-white">ตั้งค่าระบบ</h3><div className="flex items-center justify-between p-6 bg-slate-50 dark:bg-white/5 rounded-2xl border border-slate-200 dark:border-white/10"><div><h4 className="font-bold text-lg dark:text-white flex items-center gap-2"><Icon name={isRegOpen?"user-check":"user-minus"} className={isRegOpen?"text-emerald-500":"text-slate-400"}/> สถานะขึ้นทะเบียนนักศึกษาใหม่</h4><p className="text-sm text-slate-500 mt-1">เปิดหรือปิดระบบเพื่อไม่ให้นักศึกษาเข้ามาลงทะเบียนชั่วคราว</p></div><button onClick={toggleReg} className={`relative inline-flex h-8 w-14 shrink-0 rounded-full transition-colors ${isRegOpen?'bg-emerald-500':'bg-slate-300'}`}><span className={`inline-block h-7 w-7 transform rounded-full bg-white transition-transform mt-0.5 ml-0.5 ${isRegOpen?'translate-x-6':'translate-x-0'}`}/></button></div></div>}
                    </div>

                    {dd.l.length > 0 && <div className="fixed inset-0 z-[90] flex items-center justify-center p-6 bg-slate-900/80 backdrop-blur-sm print:hidden"><div className="bg-white dark:bg-zinc-900 border border-slate-200 dark:border-white/10 p-8 rounded-[2.5rem] w-full max-w-4xl max-h-[90vh] flex flex-col shadow-2xl"><div className="flex justify-between items-center mb-6"><h3 className="text-2xl font-black dark:text-white">{dd.t} <span className="text-brand text-sm bg-brand/10 px-2 py-1 rounded-md ml-2">{dd.l.length} รายการ</span></h3><button onClick={()=>setDd({t:'',l:[],ty:''})} className="p-2 bg-slate-100 rounded-xl"><Icon name="x"/></button></div><div className="overflow-y-auto flex-1 custom-scrollbar"><table className="w-full text-sm text-left"><thead className="text-xs text-slate-500 uppercase sticky top-0 bg-white dark:bg-zinc-900"><tr><th className="py-3 px-4 font-black">ชื่อ-นามสกุล</th><th className="py-3 px-4 font-black">รหัส/ปชช.</th><th className="py-3 px-4 font-black">สาขาวิชา</th><th className="py-3 px-4 font-black">ข้อมูลติดต่อ</th></tr></thead><tbody className="divide-y divide-slate-100">{dd.l.map((r,i)=><tr key={i}><td className="py-3 px-4 font-bold dark:text-white">{r.FullName}</td><td className="py-3 px-4 font-mono text-xs font-bold text-brand">{r.StudentID||r.IDCard}</td><td className="py-3 px-4 text-xs text-slate-500">{r.Major}</td><td className="py-3 px-4 text-xs"><div className="font-semibold text-slate-600 mb-1">นศ: {r.StudentPhone}</div>{r.ParentPhone && r.ParentPhone!=='-' && <div className="font-bold text-red-500">ผปค: {r.ParentPhone}</div>}</td></tr>)}</tbody></table></div></div></div>}
                    {showU && <div className="fixed inset-0 z-[90] flex items-center justify-center p-6 bg-slate-900/80 backdrop-blur-sm print:hidden"><div className="bg-white dark:bg-zinc-900 p-8 rounded-[2.5rem] w-full max-w-md shadow-2xl"><div className="flex justify-between items-center mb-6"><h3 className="text-xl font-black dark:text-white">{uForm.id?'แก้ไขแอดมิน':'เพิ่มแอดมิน'}</h3><button onClick={()=>setShowU(false)} className="p-2 bg-slate-100 rounded-xl"><Icon name="x"/></button></div><form onSubmit={e=>{e.preventDefault(); if(uForm.id) setAdminList(adminList.map(u=>u.id===uForm.id?uForm:u)); else setAdminList([...adminList, {...uForm, id:Date.now()}]); setShowU(false); Swal.fire('สำเร็จ','','success');}} className="space-y-4"><Input label="Username" val={uForm.user} onChange={v=>setUForm({...uForm,user:v})} req dis={uForm.user==='admin'}/><Input type="password" label={uForm.id?"รหัสผ่านใหม่":"รหัสผ่าน"} val={uForm.pass} onChange={v=>setUForm({...uForm,pass:v})} req={!uForm.id}/><div className="flex flex-col gap-1.5"><label className="text-xs font-bold uppercase">สิทธิ์</label><select value={uForm.role} onChange={e=>setUForm({...uForm,role:e.target.value})} className="input-modern rounded-xl px-4 py-3 text-sm font-semibold" disabled={uForm.user==='admin'}><option value="Manager">Manager</option><option value="Viewer">Viewer</option>{curUser?.role==='Super Admin'&&<option value="Super Admin">Super Admin</option>}</select></div><button type="submit" className="w-full py-3 bg-brand text-white rounded-xl font-bold mt-4">บันทึก</button></form></div></div>}
                </div>
            );
        }

        function App() {
            const [isDarkMode, setIsDarkMode] = useState(false); const [currentView, setCurrentView] = useState('home'); const [surveyData, setSurveyData] = useState({ act: '', sid: '' }); const [currentUser, setCurrentUser] = useState(null);
            const [isRegOpen, setRegOpen] = useState(()=>{ const s = localStorage.getItem('digit69_isRegOpen'); return s!==null?s==='true':true; });
            const [mockUsers] = useState([{ id: 1, username: 'admin', password: '0000', role: 'Super Admin', status: 'Active' }, { id: 2, username: 'staff', password: '0000', role: 'Manager', status: 'Active' }]);
            
            useEffect(() => { const isDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches; setIsDarkMode(isDark); }, []);
            useEffect(() => { if (isDarkMode) document.documentElement.classList.add('dark'); else document.documentElement.classList.remove('dark'); }, [isDarkMode]);

            return (
                <AppContext.Provider value={{ isDarkMode }}>
                    <div className="min-h-screen p-4 md:p-6 transition-colors duration-300 relative max-w-7xl mx-auto">
                        <div className="flex justify-between items-center mb-8 bg-white/50 dark:bg-black/20 p-4 rounded-[2rem] shadow-sm border border-slate-200/50 dark:border-white/5 backdrop-blur-md sticky top-4 z-50 print:hidden"><div className="flex items-center gap-3 cursor-pointer group" onClick={() => setCurrentView('home')}><div className="w-12 h-12 bg-brand text-white rounded-2xl flex items-center justify-center font-black text-xl shadow-glow-brand group-hover:scale-110 transition-transform">D</div><div><h2 className="font-black text-slate-800 dark:text-white leading-none text-xl group-hover:text-brand transition-colors">DIGIT.69</h2><p className="text-[10px] font-bold text-slate-500 uppercase tracking-widest">Service Portal</p></div></div>{currentUser && currentView !== 'home' && currentView !== 'admin' && <button onClick={() => setCurrentView('admin')} className="px-4 py-2 bg-slate-800 dark:bg-white text-white dark:text-black rounded-xl text-sm font-bold shadow-md btn-interactive flex items-center gap-2"><Icon name="layout-dashboard" size={16}/> หลังบ้าน</button>}</div>
                        {currentView === 'home' && <HomeView onNew={() => setCurrentView('pdpa')} onAct={() => setCurrentView('activity_form')} onChk={() => setCurrentView('check_activity')} onAdmin={(u) => { setCurrentUser(u); setCurrentView('admin'); }} users={mockUsers} isRegOpen={isRegOpen} />}
                        {currentView === 'pdpa' && <PdpaModal onAccept={() => setCurrentView('register')} onBack={() => setCurrentView('home')} />}
                        {currentView === 'register' && <RegistrationForm onBack={() => setCurrentView('home')} onSuccess={() => setCurrentView('success')} />}
                        {currentView === 'activity_form' && <ActivityForm onBack={() => setCurrentView('home')} onSuccess={(act, sid) => { setSurveyData({act, sid}); setCurrentView('survey_form'); }} />}
                        {currentView === 'check_activity' && <CheckActivityView onBack={() => setCurrentView('home')} />}
                        {currentView === 'survey_form' && <SurveyForm onBack={() => setCurrentView('home')} onSuccess={() => setCurrentView('success')} activityName={surveyData.act} studentID={surveyData.sid} />}
                        {currentView === 'success' && <SuccessView onHome={() => setCurrentView('home')} />}
                        {currentView === 'admin' && <AdminDashboard goBack={() => { setCurrentUser(null); setCurrentView('home'); }} curUser={currentUser} isRegOpen={isRegOpen} setRegOpen={setRegOpen} />}
                        <button onClick={() => setIsDarkMode(!isDarkMode)} className="fixed bottom-6 right-6 w-12 h-12 bg-white dark:bg-zinc-800 text-slate-800 dark:text-white rounded-full shadow-lg hover:scale-110 transition-transform flex items-center justify-center z-50 print:hidden"><Icon name={isDarkMode ? "sun" : "moon"} size={20} /></button>
                    </div>
                </AppContext.Provider>
            );
        }
        const root = ReactDOM.createRoot(document.getElementById('root')); root.render(<App />);
    </script>
</body>
</html>
