    <script>
        // ==========================================
        // 🚀 URL ใหม่ล่าสุดของคุณ (1sOKGMcaHGRKbeLgQ5g2CAGAGkHQyoBIas_fecarqZ-o)
        // ==========================================
        const GOOGLE_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxcQ2hIzEMVPnjAOADEKSQ0Evq7uMbt-YQ1MCww7gjlxPGUHygyOiNmGSXu2cBF5AG1Fw/exec';
        
        let currentRole = 'student'; 
        let currentView = 'events';
        let currentModalOrderId = null;
        let currentCheckoutOrder = null;
        
        // --- ตัวแปรสำหรับ Pagination ---
        let adminEventsPage = 1;
        let adminEventsSearch = '';
        const adminEventsPerPage = 5;
        
        let dashEventsPage = 1;
        const dashEventsPerPage = 5;

        const appCache = {
            activities: [], checkIns: [], orders: [], evaluations: [], students: {} 
        };
        
        let isShirtShopOpen = localStorage.getItem('CRRU_ShopOpen') === 'true'; 
        
        let popupSettings = JSON.parse(localStorage.getItem('CRRU_PopupSettings')) || {
            enabled: true, 
            title: 'แจ้งเตือนนักศึกษาใหม่\nรหัส 69 ทุกคน!', 
            description: 'ขอให้นักศึกษาชั้นปีที่ 1 (รหัส 69) ทุกคน เข้าไปทำการ "สั่งจองชุดเสื้อคณะ (แพ็คเกจคู่)" ให้เรียบร้อย ภายในวันที่กำหนด เพื่อใช้ในการทำกิจกรรมรับน้องและประดับรุ่นครับ', 
            imageUrl: 'https://images.unsplash.com/photo-1523580494112-071d16940a1c?auto=format&fit=crop&q=80&w=800'
        };

        let promptPaySettings = JSON.parse(localStorage.getItem('CRRU_PromptPaySettings')) || {
            accountName: 'ฝ่ายกิจการนักศึกษา', accountNumber: '012-3-45678-9', bankName: 'ธ.กรุงไทย (สาขามร.ชร.)'
        };

        // ==========================================
        // 🚀 ROBUST API CALL WRAPPER (รื้อระบบเดิมทิ้ง)
        // จัดการเรื่อง CORS อย่างเด็ดขาด และรองรับทั้ง GET/POST แบบไม่พึ่ง Firebase
        // ==========================================
        async function apiCall(method, payloadData = {}) {
            try {
                let url = GOOGLE_SCRIPT_URL;
                let options = { redirect: 'follow' };

                if (method.toUpperCase() === 'GET') {
                    // ส่งแบบ GET (ป้องกัน Cache ด้วย _nocache)
                    const params = new URLSearchParams(payloadData);
                    params.append('_nocache', new Date().getTime());
                    url += '?' + params.toString();
                } else {
                    // ส่งแบบ POST (ใช้ text/plain เลี่ยง CORS Preflight OPTIONS)
                    options.method = 'POST';
                    options.headers = { 'Content-Type': 'text/plain;charset=utf-8' };
                    options.body = JSON.stringify(payloadData);
                }

                const response = await fetch(url, options);
                if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
                return await response.json();
            } catch (error) {
                console.error('API Error:', error);
                throw error;
            }
        }

        // ==========================================
        // UI & HELPERS
        // ==========================================
        function getGokuLoader(title = 'กำลังโหลด...', subtitle = 'โปรดรอสักครู่') {
            return `
                <div class="fade-in py-20 flex flex-col items-center justify-center text-center w-full">
                    <div class="relative w-24 h-24 sm:w-28 sm:h-28 mb-8 flex items-center justify-center">
                        <div class="absolute inset-0 bg-primary/30 rounded-full blur-xl animate-pulse"></div>
                        <div class="absolute inset-2 border-[4px] border-slate-100 rounded-full shadow-inner"></div>
                        <div class="absolute inset-2 border-[4px] border-primary border-t-transparent rounded-full animate-spin" style="animation-duration: 1s;"></div>
                        <div class="relative flex items-center justify-center bg-white w-14 h-14 sm:w-16 sm:h-16 rounded-full shadow-md">
                            <i class="ph-fill ph-student text-2xl sm:text-3xl text-primary animate-pulse"></i>
                        </div>
                    </div>
                    <h3 class="text-lg sm:text-xl font-bold text-slate-800 tracking-wide mb-2">${title}</h3>
                    <span class="text-xs sm:text-sm text-slate-500 font-medium bg-slate-100/80 border border-slate-200 px-4 py-1.5 rounded-full shadow-sm">${subtitle}</span>
                </div>`;
        }

        function formatThaiDate(dateString, includeTime = false) {
            if (!dateString || String(dateString).trim() === '-' || String(dateString).trim() === '') return dateString;
            const date = new Date(dateString);
            if (isNaN(date.getTime())) return dateString; 
            const thaiMonths = ['ม.ค.', 'ก.พ.', 'มี.ค.', 'เม.ย.', 'พ.ค.', 'มิ.ย.', 'ก.ค.', 'ส.ค.', 'ก.ย.', 'ต.ค.', 'พ.ย.', 'ธ.ค.'];
            let formatted = `${date.getDate()} ${thaiMonths[date.getMonth()]} ${date.getFullYear() + 543}`;
            if (includeTime) formatted += ` ${String(date.getHours()).padStart(2, '0')}:${String(date.getMinutes()).padStart(2, '0')} น.`;
            return formatted;
        }

        const NAV_STUDENT = [
            { id: 'events', label: 'กิจกรรม', tabLabel: 'กิจกรรม', icon: 'ph-megaphone' },
            { id: 'history', label: 'ประวัติของฉัน', tabLabel: 'ประวัติ', icon: 'ph-clock-counter-clockwise' }
        ];

        const NAV_ADMIN = [
            { id: 'admin-dash', label: 'ภาพรวม', tabLabel: 'ภาพรวม', icon: 'ph-chart-pie-slice' },
            { id: 'admin-orders', label: 'จัดการจองเสื้อ', tabLabel: 'จองเสื้อ', icon: 'ph-t-shirt' },
            { id: 'admin-events', label: 'จัดการกิจกรรม', tabLabel: 'กิจกรรม', icon: 'ph-calendar-plus' },
            { id: 'admin-spss', label: 'รายงานผล (SPSS)', tabLabel: 'SPSS', icon: 'ph-chart-bar' },
            { id: 'admin-settings', label: 'ตั้งค่าระบบ', tabLabel: 'ตั้งค่า', icon: 'ph-gear' } 
        ];

        const STATUS_MAP = {
            1: { text: 'รอตรวจสอบ', color: 'bg-amber-100 text-amber-700 border-amber-200', icon: 'ph-hourglass-high' },
            2: { text: 'ชำระเงินแล้ว', color: 'bg-blue-100 text-blue-700 border-blue-200', icon: 'ph-check-circle' },
            3: { text: 'กำลังผลิต', color: 'bg-purple-100 text-purple-700 border-purple-200', icon: 'ph-scissors' },
            4: { text: 'พร้อมรับ', color: 'bg-green-100 text-green-700 border-green-200', icon: 'ph-package' }
        };

        document.addEventListener('DOMContentLoaded', () => {
            proceedSwitchRole('student');
            
            fetchSettingsData().then(() => {
                if (!sessionStorage.getItem('homePopupShown') && currentRole === 'student') {
                    openHomePopup();
                    sessionStorage.setItem('homePopupShown', 'true');
                }
            });

            fetchActivitiesData();
            fetchAllCheckInsData();
            fetchOrdersData();
            fetchEvaluationsData();
        });

        // ==========================================
        // DATA FETCHING VIA apiCall
        // ==========================================
        async function fetchSettingsData() {
            try {
                const result = await apiCall('GET', { action: 'getSettings' });
                if (result.success && result.data) {
                    isShirtShopOpen = (result.data.isShirtShopOpen === true || String(result.data.isShirtShopOpen).toLowerCase() === 'true');
                    if(result.data.popupSettings) popupSettings = result.data.popupSettings;
                    if(result.data.promptPaySettings) promptPaySettings = result.data.promptPaySettings;
                    
                    localStorage.setItem('CRRU_ShopOpen', isShirtShopOpen ? 'true' : 'false');
                    localStorage.setItem('CRRU_PopupSettings', JSON.stringify(popupSettings));
                    localStorage.setItem('CRRU_PromptPaySettings', JSON.stringify(promptPaySettings));
                    
                    if(isShirtShopOpen) {
                        if(!NAV_STUDENT.find(n => n.id === 'shirt')) {
                            NAV_STUDENT.push({ id: 'shirt', label: 'สั่งจองเสื้อ', tabLabel: 'สั่งจอง', icon: 'ph-t-shirt' });
                            NAV_STUDENT.push({ id: 'tracking', label: 'ติดตามสถานะ', tabLabel: 'ติดตาม', icon: 'ph-truck' });
                            if(currentRole === 'student') renderNav();
                        }
                    } else {
                        const sIdx = NAV_STUDENT.findIndex(n => n.id === 'shirt');
                        if(sIdx > -1) NAV_STUDENT.splice(sIdx, 2);
                        if(currentRole === 'student') renderNav();
                    }
                }
            } catch(e) {}
        }

        async function fetchActivitiesData(forceRefresh = false) {
            if (!forceRefresh && appCache.activities && appCache.activities.length > 0) {
                _backgroundFetchActivities();
                return appCache.activities;
            }
            return await _backgroundFetchActivities();
        }

        async function _backgroundFetchActivities() {
            try {
                const actResult = await apiCall('GET', { action: 'getActivities' });
                const chkResult = await apiCall('GET', { action: 'getAllCheckIns' });
                
                const checkInCounts = {};
                if (chkResult.success && chkResult.data) {
                    chkResult.data.forEach(row => {
                        if(row && row.length > 1) {
                            const eventName = String(row[1]).trim(); 
                            if (eventName) checkInCounts[eventName] = (checkInCounts[eventName] || 0) + 1;
                        }
                    });
                    appCache.checkIns = chkResult.data;
                }

                if (actResult.success && actResult.data) {
                    actResult.data.forEach(item => { 
                        item.date = formatThaiDate(item.date); 
                        item.timestamp = formatThaiDate(item.timestamp, true); 
                        item.joined = checkInCounts[item.title.trim()] || 0;
                    });
                    appCache.activities = actResult.data;
                }
                return appCache.activities;
            } catch (e) { return appCache.activities || []; }
        }

        async function fetchAllCheckInsData(forceRefresh = false) { 
            if (!forceRefresh && appCache.checkIns && appCache.checkIns.length > 0) {
                _backgroundFetchCheckIns();
                return appCache.checkIns;
            }
            return await _backgroundFetchCheckIns();
        }

        async function _backgroundFetchCheckIns() {
            try {
                const r = await apiCall('GET', { action: 'getAllCheckIns' });
                if(r.success) appCache.checkIns = r.data;
                return appCache.checkIns;
            } catch (e) { return appCache.checkIns || []; }
        }

            if (!forceRefresh && appCache.orders && appCache.orders.length > 0) {
                _backgroundFetchOrders();
                return appCache.orders;

        }

        async function _backgroundFetchOrders() {
            try {
                const r = await apiCall('GET', { action: 'getOrders' });

                appCache.orders.sort((a,b) => new Date(b.timestamp) - new Date(a.timestamp));

        async function fetchStudentData() {
            const searchId = document.getElementById('search-student-id').value.trim(); const feedback = document.getElementById('search-feedback');
            if(!searchId) { feedback.textContent = 'กรุณากรอกรหัสก่อนค้นหา'; feedback.classList.remove('hidden'); return; }
            if (appCache.students[searchId]) { fillStudentForm(appCache.students[searchId], searchId); return; }
            
            const btn = document.getElementById('btn-fetch-student'); const originalBtnHtml = btn.innerHTML; btn.innerHTML = '<i class="ph ph-spinner animate-spin"></i>...'; btn.disabled = true; feedback.classList.add('hidden');
            try {
                const result = await apiCall('GET', { action: 'search', id: encodeURIComponent(searchId) });
                if (result.success && result.data) { 
                    appCache.students[searchId] = result.data; 
                    fillStudentForm(result.data, searchId); 
                } else { 
                    feedback.textContent = 'ไม่พบข้อมูล กรุณาลองใหม่'; feedback.classList.remove('hidden');

                feedback.textContent = 'เชื่อมต่อล้มเหลว'; feedback.classList.remove('hidden'); showManualForm(searchId);

        async function handleRegistrationSubmit(e, eventId) {
            e.preventDefault();
            
            const finalSid = document.getElementById('reg-hidden-student-id').value.trim() || document.getElementById('reg-student-id').value.trim(); 
            const finalCid = document.getElementById('reg-hidden-citizen-id').value.trim() || document.getElementById('reg-citizen-id').value.trim();
            const finalName = document.getElementById('reg-name').value;
            const finalFaculty = document.getElementById('reg-faculty').value;
            
            const eventObj = appCache.activities.find(ev => String(ev.id) === String(eventId));
            const eventName = eventObj?.title || 'กิจกรรม';
            const errorMsgEl = document.getElementById('reg-error-message');
            
            if (errorMsgEl) errorMsgEl.classList.add('hidden');

            const isDuplicate = (checkInsData) => {
                if (!Array.isArray(checkInsData)) return false;
                const targetEvent = String(eventName).trim();
                const targetSid = String(finalSid).trim();
                const targetCid = String(finalCid).trim();

                return checkInsData.some(row => {
                    if (!row || row.length < 4) return false;
                    const rowEvent = String(row[1] || '').trim();
                    const rowSid = String(row[2] || '').trim();
                    const rowCid = String(row[3] || '').trim();
                    
                    if (rowEvent !== targetEvent) return false;
                    const isSidMatch = targetSid !== '' && targetSid !== '-' && rowSid === targetSid;
                    const isCidMatch = targetCid !== '' && targetCid !== '-' && rowCid === targetCid;
                    
                    return isSidMatch || isCidMatch;
                });
            };

            if (isDuplicate(appCache.checkIns)) {

        async function fetchHistoryData() {
            const searchId = document.getElementById('search-history-id').value.trim(); if(!searchId) { showToast('กรุณากรอกข้อมูล', 'error'); return; }
            const btn = document.getElementById('btn-fetch-history'); const txt = btn.innerHTML; btn.innerHTML = '<i class="ph ph-spinner animate-spin"></i>...'; btn.disabled = true;
            try {
                const r = await apiCall('GET', { action: 'getHistory', id: encodeURIComponent(searchId) });
                if (r.success && r.data && r.data.length > 0) {
                    r.data.forEach(item => item.date = formatThaiDate(item.date));
                    sessionStorage.setItem('historySearchTerm', searchId); sessionStorage.setItem('historyData', JSON.stringify({ history: r.data })); showToast('ค้นหาสำเร็จ', 'success');
                } else { 
                    sessionStorage.setItem('historySearchTerm', searchId); sessionStorage.setItem('historyData', JSON.stringify({ history: [] })); showToast('ไม่พบประวัติ', 'warning'); 
                }
            } catch (error) { sessionStorage.setItem('historySearchTerm', searchId); sessionStorage.setItem('historyData', JSON.stringify({ history: [] })); showToast('Offline Mode', 'warning'); } 
            finally { btn.innerHTML = txt; btn.disabled = false; renderHistory(document.getElementById('app-content')); }
        }

        let countdownInterval;
        function startCountdown() {

        function togglePayment(method) {

            if(method === 'qr') { bQr.className = actCls; bCash.className = inactCls; vQr.classList.remove('hidden'); vCash.classList.add('hidden'); } else { bCash.className = actCls; bQr.className = inactCls; vCash.classList.remove('hidden'); vQr.classList.add('hidden'); }

        async function submitPayment(e, method) {
            if(e) e.preventDefault(); clearInterval(countdownInterval); 
            
            if(!isShirtShopOpen) {
                showToast('ระบบปิดให้บริการแล้ว ไม่อนุญาตให้บันทึก', 'error');
                return navigate('shirt');
            }

            // ⚡ Optimistic Save
            currentCheckoutOrder.status = 1; 
            currentCheckoutOrder.paymentMethod = method;
            currentCheckoutOrder.date = formatThaiDate(new Date(), true);
            appCache.orders.unshift(currentCheckoutOrder);

            navigate('tracking');
            showToast('กำลังบันทึกข้อมูล...', 'success');

            const payload = { 
                action: 'createOrder',
                orderId: currentCheckoutOrder.id, 
                studentId: currentCheckoutOrder.studentId, 
                name: currentCheckoutOrder.name, 
                type: currentCheckoutOrder.type, 
                size: currentCheckoutOrder.size, 
                qty: currentCheckoutOrder.qty, 
                total: currentCheckoutOrder.total, 
                paymentMethod: method, 
                timestamp: new Date().toLocaleString('th-TH') 
            };
            
            apiCall('POST', payload)
            .then(() => showToast(method === 'qr' ? 'อัปโหลดสลิปเรียบร้อย!' : 'บันทึกแจ้งชำระเงินสดเรียบร้อย!', 'success'))

        async function submitEditOrder(e, orderId) {
            e.preventDefault(); 
            const order = appCache.orders.find(o => String(o.id) === String(orderId));
            if(order) {
                const pSz = document.getElementById('editPoloSize').value; const pQty = parseInt(document.getElementById('editPoloQty').value);
                const aSz = document.getElementById('editActSize').value; const aQty = parseInt(document.getElementById('editActQty').value);
                const pPr = (pSz === 'XL' || pSz === '2XL') ? 350 : 280; const aPr = (aSz === 'XL' || aSz === '2XL') ? 350 : 280;
                
                const newSize = `โปโล ${pSz}, กิจกรรม ${aSz}`; 
                const newQty = pQty + aQty; 
                const newTotal = (pPr * pQty) + (aPr * aQty);
                
                order.size = newSize; order.qty = newQty; order.total = newTotal; order.hasEdited = true;
                
                const payload = { action: 'updateOrderStatus', orderId: String(orderId), status: order.status }; 
                apiCall('POST', payload);

                showToast('อัปเดตข้อมูลสำเร็จ!', 'success');
                navigate('tracking');
            }
        }

        function updateAdminEventsTable() {

            let activities = appCache.activities || [];
            
            if (adminEventsSearch) {
                const s = adminEventsSearch.toLowerCase();

                    (e.title && e.title.toLowerCase().includes(s)) || 
                    (e.location && e.location.toLowerCase().includes(s)) ||
                    (e.date && e.date.toLowerCase().includes(s))
                );
            }

            const totalItems = activities.length;
            const totalPages = Math.ceil(totalItems / adminEventsPerPage) || 1;
            
            if (adminEventsPage > totalPages) adminEventsPage = totalPages;
            if (adminEventsPage < 1) adminEventsPage = 1;

            const startIndex = (adminEventsPage - 1) * adminEventsPerPage;

        window.exportToPDF = function() {
            const element = document.getElementById('spss-report-content');
            const eventName = document.getElementById('spss-event-selector').value || 'Report';
            
            if (!element || element.classList.contains('hidden') || element.innerHTML.trim() === '') {
                showToast('ไม่มีข้อมูลสำหรับดาวน์โหลด', 'warning');
                return;
            }

            const btn = document.getElementById('btn-export-pdf');
            const oldHtml = btn.innerHTML;
            btn.innerHTML = '<i class="ph ph-spinner animate-spin text-lg"></i> กำลังสร้าง...';
            btn.disabled = true;

            const opt = {
                margin:       [15, 10, 15, 10], 
                filename:     `รายงานประเมิน_${eventName}.pdf`,
                image:        { type: 'jpeg', quality: 1 },
                html2canvas:  { 
                    scale: 2, 
                    useCORS: true,
                    letterRendering: false, 
                    windowWidth: 1024 
                },
                jsPDF:        { unit: 'mm', format: 'a4', orientation: 'portrait' }
            };

            const originalWidth = element.style.width;
            element.style.width = '800px'; 
            element.style.margin = '0 auto';

            html2pdf().set(opt).from(element).save().then(() => {
                element.style.width = originalWidth;
                element.style.margin = '';
                btn.innerHTML = oldHtml;
                btn.disabled = false;
                showToast('ดาวน์โหลด PDF สำเร็จ!', 'success');
            }).catch(err => {
                console.error(err);
                element.style.width = originalWidth;
                btn.innerHTML = oldHtml;
                btn.disabled = false;
                showToast('เกิดข้อผิดพลาดในการสร้าง PDF', 'error');
            });
        };

        window.exportToWord = function() {
            const element = document.getElementById('spss-report-content');
            const eventName = document.getElementById('spss-event-selector').value || 'Report';

            if (!element || element.classList.contains('hidden') || element.innerHTML.trim() === '') {
                showToast('ไม่มีข้อมูลสำหรับดาวน์โหลด', 'warning');
                return;
            }

            const btn = document.getElementById('btn-export-word');
            const oldHtml = btn.innerHTML;
            btn.innerHTML = '<i class="ph ph-spinner animate-spin text-lg"></i> กำลังสร้าง...';
            btn.disabled = true;

            const header = "<html xmlns:o='urn:schemas-microsoft-com:office:office' xmlns:w='urn:schemas-microsoft-com:office:word' xmlns='http://www.w3.org/TR/REC-html40'><head><meta charset='utf-8'><title>Export HTML to Word</title></head><body>";
            const footer = "</body></html>";
            const htmlContent = header + element.innerHTML + footer;
            
            const blob = new Blob(['\ufeff', htmlContent], {
                type: 'application/msword'
            });
            const url = 'data:application/vnd.ms-word;charset=utf-8,' + encodeURIComponent(htmlContent);
            const downloadLink = document.createElement("a");
            
            document.body.appendChild(downloadLink);
            if (navigator.msSaveOrOpenBlob) {
                navigator.msSaveOrOpenBlob(blob, `รายงานประเมิน_${eventName}.doc`);
            } else {
                downloadLink.href = url;
                downloadLink.download = `รายงานประเมิน_${eventName}.doc`;
                downloadLink.click();
            }
            document.body.removeChild(downloadLink);
            
            btn.innerHTML = oldHtml;
            btn.disabled = false;
            showToast('ดาวน์โหลด Word สำเร็จ!', 'success');
        };

        window.generateSPSSReport = function(eventName) {

            if (!eventName) { 
                contentDiv.classList.add('hidden'); 
                if (pdfBtn) pdfBtn.classList.add('hidden');
                if (wordBtn) wordBtn.classList.add('hidden');
                return; 
            }

            const targetEvent = String(eventName).trim();
            const evals = appCache.evaluations.filter(e => String(e[3]).trim() === targetEvent);
            if (evals.length === 0) { 
                contentDiv.innerHTML = '<div class="text-center py-10 bg-white rounded-3xl border border-slate-100 text-slate-500"><i class="ph-fill ph-file-dashed text-5xl text-slate-300 mb-3"></i><p class="font-bold text-lg">ไม่มีข้อมูลแบบประเมินสำหรับกิจกรรมนี้</p></div>'; 
                contentDiv.classList.remove('hidden'); 
                if (pdfBtn) pdfBtn.classList.add('hidden');
                if (wordBtn) wordBtn.classList.add('hidden');
                return; 
            }

            let mCount = 0; let fCount = 0;
            evals.forEach(ev => {
                const sid = String(ev[1]).trim();
                const chk = appCache.checkIns.find(c => String(c[2]).trim() === sid);
                if (chk && chk[4]) {
                    const name = String(chk[4]).trim();

                    else if (name.startsWith('นาง') || name.startsWith('น.ส.') || name.startsWith('นางสาว')) fCount++;

            const totalGender = mCount + fCount || 1;

            };

            const qMeans = []; let totalScoreSum = 0; let validEvalCount = 0;
            let allValidScores = []; 
            
            const numQuestions = Object.keys(surveyMap).length;

        function updateDashboardEventsList() {

            const startIndex = (dashEventsPage - 1) * dashEventsPerPage;
            const paginatedActivities = activities.slice(startIndex, startIndex + dashEventsPerPage);

            let html = '<div class="space-y-4">';
            if (paginatedActivities.length === 0) {
                html += `<div class="bg-white p-8 rounded-3xl text-center text-slate-400 border border-slate-100 font-medium">ยังไม่มีกิจกรรม</div>`;

                                    </label>
                                </div>
                                <div><label class="block text-xs sm:text-sm font-bold text-slate-700 mb-1.5 sm:mb-2">หัวข้อประกาศ (เว้นบรรทัดได้)</label><textarea id="setting-popup-title" rows="2" class="w-full px-4 py-3 rounded-xl border border-slate-200 outline-none font-bold text-sm bg-slate-50">${popupSettings.title}</textarea></div>
                                <div><label class="block text-xs sm:text-sm font-bold text-slate-700 mb-1.5 sm:mb-2">รายละเอียดเนื้อหา (เว้นบรรทัดได้)</label><textarea id="setting-popup-desc" rows="4" class="w-full px-4 py-3 rounded-xl border border-slate-200 outline-none font-medium text-sm bg-slate-50">${popupSettings.description}</textarea></div>
                                <div>
                                    <label class="block text-xs sm:text-sm font-bold text-slate-700 mb-1.5 sm:mb-2">ลิงก์รูปภาพแบนเนอร์ (URL Image)</label>
                                    <input type="text" id="setting-popup-image" value="${popupSettings.imageUrl}" class="w-full px-4 py-3 rounded-xl border border-slate-200 outline-none font-medium text-sm bg-slate-50 mb-3" placeholder="เช่น https://..." oninput="document.getElementById('setting-popup-preview').src = this.value || 'https://placehold.co/800x400?text=No+Image';">
                                    <div class="w-full h-28 sm:h-40 rounded-xl bg-slate-100 border border-slate-200 overflow-hidden relative shadow-inner">
                                        <img id="setting-popup-preview" src="${popupSettings.imageUrl || 'https://placehold.co/800x400?text=No+Image'}" class="w-full h-full object-cover" onerror="this.src='https://placehold.co/800x400?text=Image+Not+Found'">
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div class="flex flex-col sm:flex-row justify-end gap-3 pt-2 sm:pt-4">
                            <button type="button" onclick="previewCurrentPopup()" class="w-full sm:w-auto px-6 py-3.5 sm:py-4 rounded-xl font-bold text-slate-700 bg-slate-100 hover:bg-slate-200 transition-colors text-sm sm:text-base flex items-center justify-center gap-2"><i class="ph ph-eye text-lg"></i> ดูตัวอย่าง</button>
                            <button type="submit" class="w-full sm:w-auto px-6 sm:px-10 py-3.5 sm:py-4 rounded-xl font-bold text-white bg-admin hover:bg-admin_hover transition-colors shadow-lg text-sm sm:text-base flex items-center justify-center gap-2"><i class="ph ph-floppy-disk text-lg sm:text-xl"></i> บันทึกการตั้งค่าทั้งหมด</button>
                        </div>
                    </form>
                </div>`;
        }

        function previewCurrentPopup() {
            document.getElementById('popup-banner-img').src = document.getElementById('setting-popup-image').value; 
            document.getElementById('popup-title').innerHTML = document.getElementById('setting-popup-title').value.replace(/\n/g, '<br>'); 
            document.getElementById('popup-desc').innerText = document.getElementById('setting-popup-desc').value;
            document.getElementById('homePopupModal').classList.remove('hidden'); 
        }

        function submitSettings(e) {
            e.preventDefault(); const btn = e.target.querySelector('button[type="submit"]'); const txt = btn.innerHTML; btn.innerHTML = '<i class="ph ph-spinner animate-spin"></i> บันทึก...'; btn.disabled = true;
            
            popupSettings.enabled = document.getElementById('setting-popup-toggle').checked; 
            popupSettings.title = document.getElementById('setting-popup-title').value; 
            popupSettings.description = document.getElementById('setting-popup-desc').value; 
            popupSettings.imageUrl = document.getElementById('setting-popup-image').value;

            promptPaySettings.accountName = document.getElementById('setting-pp-name').value;
            promptPaySettings.accountNumber = document.getElementById('setting-pp-number').value;
            promptPaySettings.bankName = document.getElementById('setting-pp-bank').value;

            localStorage.setItem('CRRU_PopupSettings', JSON.stringify(popupSettings));
            localStorage.setItem('CRRU_PromptPaySettings', JSON.stringify(promptPaySettings));
            sessionStorage.removeItem('homePopupShown');

            apiCall('POST', { 
                action: 'saveSettings', 
                isShirtShopOpen: isShirtShopOpen, 
                popupSettings: popupSettings,
                promptPaySettings: promptPaySettings
            }).then(() => {
                showToast('บันทึกการตั้งค่าเรียบร้อยแล้ว', 'success'); 
                btn.innerHTML = txt; btn.disabled = false; 
            }).catch(() => {
                showToast('บันทึกสำเร็จ (Offline Mode)', 'warning');
                btn.innerHTML = txt; btn.disabled = false; 
            });
        }

        function openHomePopup() { 
            if (!popupSettings.enabled) return;
            document.getElementById('popup-banner-img').src = popupSettings.imageUrl; 
            document.getElementById('popup-title').innerHTML = popupSettings.title.replace(/\n/g, '<br>'); 
            document.getElementById('popup-desc').innerText = popupSettings.description;
            document.getElementById('homePopupModal').classList.remove('hidden'); 
        }
        
        function closeHomePopup() { document.getElementById('homePopupModal').classList.add('hidden'); }

        function showToast(message, type = 'success') {
            const container = document.getElementById('toast-container'); const toast = document.createElement('div');
            const bgColor = type === 'success' ? 'bg-white border-l-4 border-green-500' : type === 'error' ? 'bg-white border-l-4 border-red-500' : 'bg-white border-l-4 border-amber-500';
            const icon = type === 'success' ? '<i class="ph-fill ph-check-circle text-green-500 text-xl sm:text-2xl"></i>' : type === 'error' ? '<i class="ph-fill ph-x-circle text-red-500 text-xl sm:text-2xl"></i>' : '<i class="ph-fill ph-warning-circle text-amber-500 text-xl sm:text-2xl"></i>';
            toast.className = `${bgColor} text-slate-700 p-3 sm:p-4 rounded-xl shadow-lg flex items-center gap-2 sm:gap-3 transform transition-all duration-300 translate-x-full border border-slate-100 pointer-events-auto`;
            toast.innerHTML = `${icon} <span class="font-bold text-xs sm:text-sm leading-tight">${message}</span>`;
            container.appendChild(toast); requestAnimationFrame(() => toast.classList.remove('translate-x-full'));
            setTimeout(() => { toast.classList.add('translate-x-full'); setTimeout(() => toast.remove(), 300); }, 3000);
        }

        // Expose functions to global scope for inline event handlers
        window.navigate = navigate;
        window.goToHome = goToHome;
        window.switchRole = switchRole;
        window.toggleMobileMenu = toggleMobileMenu;
        window.showAdminLoginModal = showAdminLoginModal;
        window.closeAdminLoginModal = closeAdminLoginModal;
        window.handleAdminLogin = handleAdminLogin;
        window.closeModal = closeModal;
        window.verifyOrderFromModal = verifyOrderFromModal;
        window.closeEditEventModal = closeEditEventModal;
        window.submitEditEvent = submitEditEvent;
        window.closeHomePopup = closeHomePopup;
        window.showManualForm = showManualForm;
        window.resetSearchForm = resetSearchForm;
        window.fetchStudentData = fetchStudentData;
        window.handleRegistrationSubmit = handleRegistrationSubmit;
        window.submitSurvey = submitSurvey;
        window.fetchHistoryData = fetchHistoryData;
        window.clearHistorySearch = clearHistorySearch;
        window.fetchStudentForOrder = fetchStudentForOrder;
        window.skipOrderSearch = skipOrderSearch;
        window.resetOrderSearch = resetOrderSearch;
        window.recalculatePrice = recalculatePrice;
        window.updateQty = updateQty;
        window.mockOrderSubmit = mockOrderSubmit;
        window.togglePayment = togglePayment;
        window.previewSlip = previewSlip;
        window.submitPayment = submitPayment;
        window.openSlipModal = openSlipModal;
        window.createNewEvent = createNewEvent;
        window.toggleEventStatus = toggleEventStatus;
        window.openEditEventModal = openEditEventModal;
        window.exportEventParticipants = exportEventParticipants;
        window.generateSPSSReport = generateSPSSReport;
        window.exportToPDF = exportToPDF;
        window.exportToWord = exportToWord;
        window.toggleMasterControl = toggleMasterControl;
        window.submitSettings = submitSettings;
        window.previewCurrentPopup = previewCurrentPopup;
        window.updateOrderStatus = updateOrderStatus;
        
        // Export Pagination & Search functions
        window.handleAdminEventSearch = handleAdminEventSearch;
        window.changeAdminEventPage = changeAdminEventPage;
        window.refreshAdminEvents = refreshAdminEvents;
        window.changeDashEventPage = changeDashEventPage;
    </script>
</body>
</html>
