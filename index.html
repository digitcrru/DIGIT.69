        <h2 style="font-family: 'Prompt', sans-serif; font-size: 20px; font-weight: 700; color: #f97316; letter-spacing: 1px;">DIGIT.CRRU</h2>
    </div>

    <script>
        setTimeout(() => {
            const loader = document.getElementById('app-loader');
            if (loader && loader.style.display !== 'none') {
                loader.style.opacity = '0';
                setTimeout(() => { loader.style.display = 'none'; }, 300);

    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        const API_CONFIG = {
            USE_FAST_CSV: true,
            SHEET_ID: "1KLJNWUUIj1r6eqCZnaF-F6nA2FQg7pvOHMk0PyDCyAc", 
            WEB_APP_URL: "https://script.google.com/macros/s/AKfycbz5D2FANCj69Hc6JZb_DdNl0iKvgiNTv18dswnlhgKc6eyM50MSt3S2TLOwDBmbrU1-PQ/exec", 
            getCSVUrl: function(sheetName) {
                return `https://docs.google.com/spreadsheets/d/${this.SHEET_ID}/gviz/tq?tqx=out:csv&sheet=${sheetName}&_=${new Date().getTime()}`;
            }
        };

        const isFastCSVReady = () => API_CONFIG.USE_FAST_CSV && API_CONFIG.SHEET_ID && !API_CONFIG.SHEET_ID.includes('ใส่_SHEET_ID');

        const fetchFastCSV = (sheetName) => {
            return new Promise((resolve, reject) => {
                if(!isFastCSVReady()) return reject(new Error("CSV Mode Disabled"));
                Papa.parse(API_CONFIG.getCSVUrl(sheetName), {
                    download: true, header: true, skipEmptyLines: true,
                    complete: (results) => {
                        if (results.data && results.data.length > 0) {
                            const firstKey = Object.keys(results.data[0])[0] || '';
                            if (firstKey.toLowerCase().includes('html') || firstKey.toLowerCase().includes('doctype')) {
                                return reject(new Error("Permission Denied: ไม่สามารถโหลดข้อมูลได้ กรุณาตั้งค่าแชร์ไฟล์ Google Sheets เป็น 'ทุกคนที่มีลิงก์ (Anyone with the link)'"));
                            }
                        }
                        resolve(results.data);
                    },
                    error: (error) => reject(error)
                });
            });
        };

        const runGAS = async (functionName, ...args) => {
            if (typeof google !== 'undefined' && google.script && google.script.run) {
                return new Promise((resolve, reject) => {
                    google.script.run.withSuccessHandler(resolve).withFailureHandler(reject)[functionName](...args);
                });
            } else if (API_CONFIG.WEB_APP_URL && API_CONFIG.WEB_APP_URL.startsWith("https://script.google.com")) {
                try {
                    const response = await fetch(API_CONFIG.WEB_APP_URL, {
                        method: 'POST', redirect: 'follow',
                        body: JSON.stringify({ action: functionName, params: args }),
                        headers: { 'Content-Type': 'text/plain' } 
                    });
                    const result = await response.json();
                    if (result.success === false && result.error) throw new Error(result.error);
                    return result.data !== undefined ? result.data : result;
                } catch (error) { 
                    console.warn(`runGAS Fetch Error (${functionName}):`, error);
                    if (error.name === 'TypeError' || error.message.includes('Failed to fetch')) {
                        throw new Error('ไม่สามารถเชื่อมต่อฐานข้อมูลได้ \nกรุณาตรวจสอบว่าสิทธิ์การแชร์ของ Web App เป็น "ทุกคน (Anyone)" และอัปเดตเป็น "เวอร์ชันใหม่ (New version)" แล้ว');
                    }
                    throw error; 
                }
            } else {
                Swal.fire({
                    title: 'ตั้งค่าระบบยังไม่สมบูรณ์', 
                    text: 'กรุณานำลิงก์ Web App และ Sheet ID ของคุณ มาวางในโค้ดให้ถูกต้องก่อนเริ่มใช้งานครับ', 
                    icon: 'warning',
                    confirmButtonColor: '#ea580c'
                });
                return new Promise((resolve) => setTimeout(() => resolve({ success: false, error: 'Missing WEB_APP_URL' }), 500));
            }
        };

        const surveyData = [
            {
                title: "1. กระบวนการ ขั้นตอนการให้บริการ",
                questions: [
                    { id: "q1", text: "1.1 การประชาสัมพันธ์โครงการ ฯ" }, { id: "q2", text: "1.2 ความเหมาะสมของสถานที่" },
                    { id: "q3", text: "1.3 ความเหมาะสมของระยะเวลา" }, { id: "q4", text: "1.4 การจัดลำดับขั้นตอนของกิจกรรม" }
                ]
            },
            {
                title: "2. การอำนวยความสะดวก",
                questions: [
                    { id: "q5", text: "2.1 เอกสาร" }, { id: "q6", text: "2.2 โสตทัศนูปกรณ์" },
                    { id: "q7", text: "2.3 เจ้าหน้าที่สนับสนุน" }, { id: "q8", text: "2.4 อาหาร,เครื่องดื่มและสถานที่" }
                ]
            },
            {
                title: "3. คุณภาพการให้บริการ",
                questions: [
                    { id: "q9", text: "3.1 ท่านได้รับความรู้ แนวคิด ทักษะและประสบการณ์ใหม่ ๆ จากโครงการ" },
                    { id: "q10", text: "3.2 ท่านสามารถนำสิ่งที่ได้รับจากโครงการ/กิจกรรมนี้ไปใช้ในการปฏิบัติงาน" },
                    { id: "q11", text: "3.3 สิ่งที่ท่านได้รับจากโครงการ/กิจกรรมครั้งนี้ตรงตามความคาดหวังของท่านหรือไม่" },
                    { id: "q12", text: "3.4 โครงการ/กิจกรรมนี้เอื้ออำนวยต่อการเรียนรู้และพัฒนาความสามารถของท่าน" },
                    { id: "q13", text: "3.5 ประโยชน์ที่ท่านได้รับจากโครงการ/กิจกรรม" }
                ]
            }
        ];

        const getGenderProps = (nameStr) => {
            if (!nameStr) return { icon: 'fa-user', bg: 'bg-orange-50', text: 'text-orange-600' };
            if (nameStr.startsWith('นาย')) return { icon: 'fa-person', bg: 'bg-slate-100', text: 'text-slate-600' };
            if (nameStr.startsWith('นาง') || nameStr.startsWith('น.ส.')) return { icon: 'fa-person-dress', bg: 'bg-rose-50', text: 'text-rose-600' };
            return { icon: 'fa-user', bg: 'bg-orange-50', text: 'text-orange-600' };
        };

        const findKey = (keys, kws) => keys.find(k => kws.some(kw => String(k).toLowerCase().replace(/\s+/g, '').includes(kw)));
        const getVal = (obj, keys, kws, fallback) => obj[findKey(keys, kws)] || obj[fallback] || '';

        const formatDisplayDate = (dateStr) => {
            if (!dateStr) return { month: '-', date: '-' };
            const d = new Date(dateStr);
            if (!isNaN(d.getTime())) return { month: d.toLocaleDateString('en-US',{month:'short'}).toUpperCase(), date: d.getDate() };
            const parts = String(dateStr).split(/[/-]/);
            if (parts.length >= 3) {
                const day = parts[0].length === 4 ? parseInt(parts[2], 10) : parseInt(parts[0], 10);
                const mNum = parts[0].length === 4 ? parseInt(parts[1], 10) : parseInt(parts[1], 10);
                const mNames = ['JAN', 'FEB', 'MAR', 'APR', 'MAY', 'JUN', 'JUL', 'AUG', 'SEP', 'OCT', 'NOV', 'DEC'];
                return { month: mNames[mNum-1] || '-', date: day || '-' };
            }
            return { month: '-', date: '-' };
        };

        function App() {
            const [view, setView] = useState(() => {
                const savedView = sessionStorage.getItem('app_view');
                if (savedView === 'admin_dashboard' && localStorage.getItem('admin_logged_in') === 'true') return 'admin_dashboard';
                if (['home', 'search', 'history_search', 'history_result', 'admin_login', 'select_recruit', 'select', 'survey', 'shirt_form', 'receipt'].includes(savedView)) return savedView;
                return 'home';
            }); 
            
            const [student, setStudent] = useState(null);
            const [activities, setActivities] = useState([]);
            const [recruitments, setRecruitments] = useState([]); 
            const [selectedActivity, setSelectedActivity] = useState(null);
            const [surveyAnswers, setSurveyAnswers] = useState({});
            const [suggestion, setSuggestion] = useState('');
            const [historyData, setHistoryData] = useState([]);

            const [systemOpen, setSystemOpen] = useState(true);
            const [recruitSystemOpen, setRecruitSystemOpen] = useState(true);
            const [adminData, setAdminData] = useState(null);

            const [searchPurpose, setSearchPurpose] = useState(() => sessionStorage.getItem('search_purpose') || 'activity');
            
            const [shirtSystemOpen, setShirtSystemOpen] = useState(true);
            const [shirtPrice, setShirtPrice] = useState({ normal: 250, oversize: 380, status: 'open', popupText: '', popupImage: '' });
            const [receiptSettings, setReceiptSettings] = useState({ header: 'สโมสรนักศึกษาคณะเทคโนโลยีดิจิทัล มหาวิทยาลัยราชภัฏเชียงราย\nที่อยู่: 80 ซอย 9 ตำบล บ้านดู่ อำเภอเมืองเชียงราย เชียงราย 57100', note: 'กรุณานำใบเสร็จนี้มาแสดงในวันรับเสื้อ' });
            
            const [isEditingOrder, setIsEditingOrder] = useState(false);
            const [poloGender, setPoloGender] = useState('ชาย');
            const [poloSize, setPoloSize] = useState('M');
            const [poloQty, setPoloQty] = useState(1);
            const [tshirtGender, setTshirtGender] = useState('ชาย');
            const [tshirtSize, setTshirtSize] = useState('M');
            const [tshirtQty, setTshirtQty] = useState(1);
            const [paymentMethod, setPaymentMethod] = useState('promptpay'); 
            const [slipImage, setSlipImage] = useState(null); 
            const [receiptData, setReceiptData] = useState(null);

            const [isDarkMode, setIsDarkMode] = useState(() => localStorage.getItem('theme') === 'dark');

            useEffect(() => {
                const loader = document.getElementById('app-loader');
                if (loader) {
                    loader.style.opacity = '0';
                    setTimeout(() => {
                        loader.style.visibility = 'hidden';
                        loader.style.display = 'none';
                    }, 300);
                }
            }, []);

            useEffect(() => { sessionStorage.setItem('app_view', view); }, [view]);
            useEffect(() => { sessionStorage.setItem('search_purpose', searchPurpose); }, [searchPurpose]);

            useEffect(() => {
                if (isDarkMode) { document.documentElement.classList.add('dark'); localStorage.setItem('theme', 'dark'); }
                else { document.documentElement.classList.remove('dark'); localStorage.setItem('theme', 'light'); }
            }, [isDarkMode]);

            const loadAdminData = () => {
                if (API_CONFIG.USE_FAST_CSV && !isFastCSVReady()) {
                    Swal.fire({ title: 'ตั้งค่าระบบดึงข้อมูลเร็วไม่สมบูรณ์', text: 'กรุณาใส่ SHEET_ID ของคุณในโค้ดให้ถูกต้องครับ', icon: 'warning', confirmButtonColor: '#ea580c' });
                    return;
                }

                Swal.fire({ title: 'โปรดรอสักครู่...', allowOutsideClick: false, didOpen: () => { Swal.showLoading() } });
                setTimeout(async () => {
                    try {
                        let data;
                        if (isFastCSVReady()) {
                            const [acts, chks, evals, shirts, settings, recs, regis] = await Promise.all([
                                fetchFastCSV('Activities').catch(() => []), 
                                fetchFastCSV('CheckIns').catch(() => []),
                                fetchFastCSV('Evaluations').catch(() => []), 
                                fetchFastCSV('ShirtOrders').catch(() => []),
                                fetchFastCSV('Settings').catch(() => []),
                                fetchFastCSV('Recruitments').catch(() => []),
                                fetchFastCSV('Registrations').catch(() => [])
                            ]);
                            
                            let priceInfo = { normal: 250, oversize: 380, status: 'open', receiptHeader: 'สโมสรนักศึกษาคณะเทคโนโลยีดิจิทัล', receiptNote: 'กรุณานำใบเสร็จนี้มาแสดงในวันรับเสื้อ', systemStatus: 'open', popupText: '', popupImage: '' };
                            let recruitInfo = { status: 'open' }; 

                            if (settings && settings.length > 0) {
                                const priceRow = settings.find(r => r.Key === 'ShirtPrice') || {Value1: 250, Value2: 380};
                                const statusRow = settings.find(r => r.Key === 'ShirtStatus') || {Value1: 'open', Value2: ''};
                                const receiptRow = settings.find(r => r.Key === 'ReceiptConfig') || {Value1: priceInfo.receiptHeader, Value2: priceInfo.receiptNote};
                                const systemRow = settings.find(r => r.Key === 'SystemStatus') || {Value1: 'open', Value2: ''};
                                const popupRow = settings.find(r => r.Key === 'ShirtPopup') || {Value1: '', Value2: ''};
                                const recruitStatusRow = settings.find(r => r.Key === 'RecruitStatus') || {Value1: 'open', Value2: ''};
                                
                                priceInfo = { 
                                    normal: Number(priceRow.Value1), oversize: Number(priceRow.Value2), 
                                    status: statusRow.Value1, receiptHeader: receiptRow.Value1, receiptNote: receiptRow.Value2,
                                    systemStatus: systemRow.Value1,
                                    popupText: popupRow.Value1, popupImage: popupRow.Value2
                                };
                                recruitInfo.status = recruitStatusRow.Value1;
                            } else {
                                try { priceInfo = await runGAS('getShirtPrice'); } catch(err) {}
                            }
                            
                            data = { activities: acts, checkins: chks, evaluations: evals, shirtOrders: shirts, recruitments: recs, registrations: regis, shirtPrice: priceInfo, recruitStatus: recruitInfo.status };
                        } else { 
                            data = await runGAS('getAdminDashboardData'); 
                        }
                        
                        setAdminData(data || { activities: [], checkins: [], evaluations: [], shirtOrders: [], recruitments: [], registrations: [], shirtPrice: {}, recruitStatus: 'open' }); 
                        if (data) { 
                            if(data.shirtPrice) {
                                setShirtPrice(data.shirtPrice); 
                                setShirtSystemOpen(data.shirtPrice.status === 'open'); 
                                setSystemOpen(data.shirtPrice.systemStatus === 'open');
                            }
                            if(data.recruitStatus) {
                                setRecruitSystemOpen(data.recruitStatus === 'open');
                            }
                        }
                        
                        setTimeout(() => { Swal.close(); setView('admin_dashboard'); }, 50);

                    } catch(e) { Swal.fire('ข้อผิดพลาดการเชื่อมต่อ', e.message, 'error'); }
                }, 100);
            };

            useEffect(() => {
                const loadInitialData = async () => {
                    try {
                        let acts = [], recs = [];
                        let priceInfo = null, recStatus = 'open', sysStatus = 'open';
                        
                        if (isFastCSVReady()) {
                            try {
                                const [allActs, allRecs, settings] = await Promise.all([
                                    fetchFastCSV('Activities').catch(() => []),
                                    fetchFastCSV('Recruitments').catch(() => []),
                                    fetchFastCSV('Settings').catch(() => [])
                                ]);
                                
                                acts = allActs.filter(a => a.Status === 'open');
                                recs = allRecs.filter(r => r.Status === 'open');
                                
                                if (settings.length > 0) {
                                    const getSet = (k, f1, f2) => { const row = settings.find(r => r.Key === k); return row ? { v1: row.Value1, v2: row.Value2 } : { v1: f1, v2: f2 }; };
                                    const pSet = getSet('ShirtPrice', 250, 380); priceInfo = { normal: Number(pSet.v1), oversize: Number(pSet.v2) };
                                    priceInfo.status = getSet('ShirtStatus', 'open').v1;
                                    sysStatus = getSet('SystemStatus', 'open').v1;
                                    const rSet = getSet('ReceiptConfig', '', ''); priceInfo.receiptHeader = rSet.v1; priceInfo.receiptNote = rSet.v2;
                                    const popSet = getSet('ShirtPopup', '', ''); priceInfo.popupText = popSet.v1; priceInfo.popupImage = popSet.v2;
                                    recStatus = getSet('RecruitStatus', 'open').v1;
                                }
                            } catch(e) { acts = await runGAS('getActiveActivities'); priceInfo = await runGAS('getShirtPrice'); }
                        } else { acts = await runGAS('getActiveActivities'); priceInfo = await runGAS('getShirtPrice'); }

                        setActivities(acts || []);
                        setRecruitments(recs || []);
                        setRecruitSystemOpen(recStatus === 'open');
                        setSystemOpen(sysStatus === 'open');

                            setShirtSystemOpen(priceInfo.status === 'open');

            }, []); 

            const goHome = () => {
                setStudent(null); setSearchPurpose('activity');
                setPoloGender('ชาย'); setPoloSize('M'); setPoloQty(1);
                setTshirtGender('ชาย'); setTshirtSize('M'); setTshirtQty(1);
                setPaymentMethod('promptpay'); 
                setReceiptData(null); setIsEditingOrder(false); setSlipImage(null); setView('home');
            };

            const handleSearchStudent = async (rawStudentId) => {
                const studentId = String(rawStudentId).trim();
                if(!studentId) return Swal.fire('แจ้งเตือน', 'กรุณากรอกรหัสนักศึกษา', 'warning');
                Swal.fire({ title: 'ตรวจสอบข้อมูล...', allowOutsideClick: false, didOpen: () => { Swal.showLoading() } });
                try {
                    let res = { success: false };
                    if (isFastCSVReady()) {
                        try {
                            const allStudents = await fetchFastCSV('Students');
                            const studentData = allStudents.find(s => {
                                const keys = Object.keys(s);
                                const idK = findKey(keys, ['studentid', 'รหัส']);
                                const icK = findKey(keys, ['idcard', 'บัตร']);
                                return (idK && String(s[idK]).replace(/\s+/g,'').toLowerCase() === studentId.replace(/\s+/g,'').toLowerCase()) || 
                                       (icK && String(s[icK]).replace(/\s+/g,'').toLowerCase() === studentId.replace(/\s+/g,'').toLowerCase());
                            });
                            if (studentData) res = { success: true, data: studentData };
                            else res = { success: false };
                        } catch(csvErr) { res = await runGAS('verifyStudent', studentId).catch(e => { throw e }); }
                    } else { res = await runGAS('verifyStudent', studentId); }

                    if(res.success && (res.data.Name || res.data[Object.keys(res.data).find(k=>k.toLowerCase().includes('name'))])) {
                        const keys = Object.keys(res.data);
                        const cleanStudent = {
                            StudentID: res.data[findKey(keys, ['studentid', 'รหัส'])] || studentId,
                            Name: res.data[findKey(keys, ['name', 'ชื่อ'])] || '',
                            Major: res.data[findKey(keys, ['major', 'สาขา'])] || '',
                            IDCard: res.data[findKey(keys, ['idcard', 'บัตร'])] || ''
                        };
                        setStudent(cleanStudent);
                        localStorage.setItem('last_student_id', studentId);

                        if (searchPurpose === 'shirt') {
                            let orderCheck = { hasOrdered: false };
                            if (isFastCSVReady()) {
                                try {
                                    const allOrders = await fetchFastCSV('ShirtOrders');
                                    for (let i = allOrders.length - 1; i >= 0; i--) {
                                        const oKeys = Object.keys(allOrders[i]);
                                        const stdK = findKey(oKeys, ['studentid', 'รหัส']);
                                        if (stdK && String(allOrders[i][stdK]).trim() === cleanStudent.StudentID) {
                                            orderCheck = { hasOrdered: true, data: allOrders[i] };
                                            break;
                                        }
                                    }
                                } catch(csvErr) { orderCheck = await runGAS('checkShirtOrder', cleanStudent.StudentID).catch(()=>({hasOrdered:false})); }
                            } else { orderCheck = await runGAS('checkShirtOrder', cleanStudent.StudentID).catch(()=>({hasOrdered:false})); }

                            Swal.close();
                            if (orderCheck.hasOrdered && orderCheck.data) {
                                const pastOrder = orderCheck.data;
                                const pKeys = Object.keys(pastOrder);
                                setReceiptData({
                                    student: cleanStudent,
                                    poloGender: pastOrder[findKey(pKeys, ['pologender', 'ทรงโปโล'])] || 'ชาย', 
                                    poloSize: pastOrder[findKey(pKeys, ['polosize', 'ไซส์โปโล'])], 
                                    poloQty: Number(pastOrder[findKey(pKeys, ['poloqty', 'จำนวนโปโล'])]||1),
                                    tshirtGender: pastOrder[findKey(pKeys, ['tshirtgender', 'ทรงเสื้อยืด'])] || 'ชาย', 
                                    tshirtSize: pastOrder[findKey(pKeys, ['tshirtsize', 'ไซส์เสื้อยืด'])], 
                                    tshirtQty: Number(pastOrder[findKey(pKeys, ['tshirtqty', 'จำนวนเสื้อยืด'])]||1),
                                    grandTotal: Number(pastOrder[findKey(pKeys, ['totalprice', 'ยอดรวม'])]||0),
                                    paymentMethod: pastOrder[findKey(pKeys, ['paymentmethod', 'วิธีชำระ'])] || (pastOrder[findKey(pKeys, ['slip', 'สลิป'])] ? 'promptpay' : 'cash'),
                                    orderId: 'ORD-' + new Date(pastOrder[findKey(pKeys, ['timestamp', 'เวลา'])] || Date.now()).getTime().toString().slice(-6),
                                    date: new Date(pastOrder[findKey(pKeys, ['timestamp', 'เวลา'])] || Date.now()).toLocaleString('th-TH')
                                });
                                setPoloGender(pastOrder.PoloGender || 'ชาย'); setPoloSize(pastOrder.PoloSize); setPoloQty(Number(pastOrder.PoloQty));
                                setTshirtGender(pastOrder.TshirtGender || 'ชาย'); setTshirtSize(pastOrder.TshirtSize); setTshirtQty(Number(pastOrder.TshirtQty));
                                setPaymentMethod(pastOrder.PaymentMethod || (pastOrder.SlipImage || pastOrder.SlipURL || pastOrder.Slip ? 'promptpay' : 'cash'));
                                setView('receipt');
                            } else { setView('shirt_form'); }
                        } else if (searchPurpose === 'recruit') {
                            Swal.close(); setView('select_recruit');
                        } else if (searchPurpose === 'history') {
                            Swal.close(); handleSearchHistory(cleanStudent.StudentID);
                        } else { 
                            Swal.close(); setView('select'); 
                        }
                    } else { 
                        Swal.close(); 
                        Swal.fire({ title:'ไม่พบข้อมูล', text:'ไม่พบข้อมูลของท่านในระบบ กรุณาตรวจสอบและลองใหม่อีกครั้ง', icon:'error', confirmButtonColor: '#1a1a1a' }); 
                    }
                } catch(e) { Swal.fire('ข้อผิดพลาด', e.message || 'เกิดข้อผิดพลาดในการตรวจสอบข้อมูล', 'error'); }
            };

            const handleSelectActivity = async (act) => {
                Swal.fire({ title: 'กำลังตรวจสอบสิทธิ์...', allowOutsideClick: false, didOpen: () => { Swal.showLoading() } });
                try {
                    let hasJoined = false;
                    if (isFastCSVReady()) {
                        const allChks = await fetchFastCSV('CheckIns').catch(() => []);
                        hasJoined = allChks.some(c => {
                            const keys = Object.keys(c);
                            const idK = findKey(keys, ['studentid', 'รหัส']);
                            const actK = findKey(keys, ['activityid', 'รหัสกิจกรรม']);
                            return idK && actK && String(c[idK]).trim() === String(student.StudentID).trim() && String(c[actK]).trim() === String(act.ActivityID).trim();
                        });
                    } else {
                        const history = await runGAS('getStudentHistory', student.StudentID).catch(()=>[]);
                        hasJoined = history.some(h => String(h.ActivityID).trim() === String(act.ActivityID).trim());
                    }

                    Swal.close();
                    if (hasJoined) {
                        Swal.fire({ title: 'ลงทะเบียนซ้ำ!', text: 'คุณได้ลงทะเบียนเข้าร่วมกิจกรรมนี้ไปแล้ว', icon: 'warning', confirmButtonColor: '#ea580c' });
                    } else {
                        setSelectedActivity(act); setView('survey');
                    }
                } catch(e) { Swal.close(); setSelectedActivity(act); setView('survey'); }
            };

            const handleRegisterRecruit = async (recruit) => {
                if (!recruitSystemOpen) return Swal.fire({ title: 'ปิดรับสมัคร', text: 'ขณะนี้ระบบปิดรับสมัครกิจกรรมชั่วคราว', icon: 'error', confirmButtonColor: '#a855f7' });
                Swal.fire({ title: 'กำลังตรวจสอบสิทธิ์...', allowOutsideClick: false, didOpen: () => { Swal.showLoading() } });
                try {
                    let hasJoined = false;
                    if (isFastCSVReady()) {
                        try {
                            const allRegis = await fetchFastCSV('Registrations');
                            const cleanSid = String(student.StudentID).replace(/\s+/g, '').toLowerCase();
                            const cleanRecId = String(recruit.RecruitID).replace(/\s+/g, '').toLowerCase();
                            if (allRegis.length > 0) {
                                const keys = Object.keys(allRegis[0]);
                                const idKey = findKey(keys, ['studentid', 'รหัสนักศึกษา', 'รหัส']);
                                const recKey = findKey(keys, ['recruitid', 'รหัสกิจกรรม']);
                                hasJoined = allRegis.some(r => {
                                    const matchStudent = idKey ? String(r[idKey]).replace(/\s+/g, '').toLowerCase() === cleanSid : false;
                                    const matchRec = recKey ? String(r[recKey]).replace(/\s+/g, '').toLowerCase() === cleanRecId : false;
                                    return matchStudent && matchRec;
                                });
                            }
                        } catch (csvErr) { console.warn("Registrations check failed locally"); }
                    }
                    Swal.close();
                    if (hasJoined) { 
                        return Swal.fire({ title: 'สมัครแล้ว', text: 'คุณได้ลงทะเบียนสมัครโครงการนี้ไปแล้ว', icon: 'info', confirmButtonColor: '#a855f7' }); 
                    }
                    
                    Swal.fire({
                        title: 'ยืนยันการสมัคร?', text: `คุณต้องการลงทะเบียนสมัครเข้าร่วม "${recruit.Name}" ใช่หรือไม่?`, icon: 'question',
                        showCancelButton: true, confirmButtonText: 'ยืนยัน', cancelButtonText: 'ยกเลิก', confirmButtonColor: '#a855f7'
                    }).then(async (result) => {
                        if (result.isConfirmed) {
                            Swal.fire({ title: 'กำลังสมัคร...', allowOutsideClick: false, didOpen: () => { Swal.showLoading() } });
                            try {
                                await runGAS('saveRegistration', { student, recruit });
                                Swal.close();
                                Swal.fire({ title: 'สมัครสำเร็จ!', text: 'บันทึกข้อมูลการรับสมัครเรียบร้อยแล้ว', icon: 'success', confirmButtonColor: '#a855f7' }).then(goHome);
                            } catch(e) { Swal.fire('ข้อผิดพลาด', e.message || 'ไม่สามารถสมัครได้', 'error'); }
                        }
                    });
                } catch(e) { Swal.close(); Swal.fire('ข้อผิดพลาด', e.message, 'error'); }
            };

            const handleSubmitShirtOrder = async (e) => {
                e.preventDefault();
                if (!shirtSystemOpen) return Swal.fire({ title: 'ปิดระบบ', text: 'ขณะนี้ระบบปิดรับการสั่งจองหรือแก้ไขข้อมูลเสื้อแล้ว', icon: 'error', confirmButtonColor: '#ea580c' });
                if (poloQty < 1 || tshirtQty < 1) return Swal.fire('แจ้งเตือน', 'ระบุจำนวนอย่างน้อย 1 ตัว', 'warning');
                
                const getPrice = (size) => ['XL', '2XL', '3XL'].includes(size) ? shirtPrice.oversize : shirtPrice.normal;
                const grandTotal = (getPrice(poloSize) * poloQty) + (getPrice(tshirtSize) * tshirtQty);
                
                if (grandTotal > 0 && paymentMethod === 'promptpay' && !slipImage) {
                    return Swal.fire('แจ้งเตือน', 'กรุณาแนบสลิปการโอนเงินเพื่อยืนยันการสั่งจอง', 'warning');
                }

                Swal.fire({ title: 'กำลังดำเนินการ...', text: 'อาจใช้เวลาสักครู่ในการประมวลผล', allowOutsideClick: false, didOpen: () => { Swal.showLoading() } });
                try {
                    const payload = { student, poloGender, poloSize, poloQty, tshirtGender, tshirtSize, tshirtQty, grandTotal, slipImage, paymentMethod };
                    await runGAS('saveShirtOrder', payload);
                    Swal.close();
                    setReceiptData({ ...payload, orderId: 'ORD-' + Date.now().toString().slice(-6), date: new Date().toLocaleString('th-TH') });
                    Swal.fire({ title: 'บันทึกสำเร็จ', icon: 'success', confirmButtonColor: '#d19d47' }).then(() => { setIsEditingOrder(false); setView('receipt'); });
                } catch(e) { Swal.fire('เกิดข้อผิดพลาด', e.message || 'ไม่สามารถบันทึกข้อมูลได้', 'error'); }
            };

            const handleSubmitSurvey = async (e) => {
                e.preventDefault();
                if(Object.keys(surveyAnswers).length < 13) return Swal.fire('แจ้งเตือน', 'กรุณาประเมินให้ครบทุกข้อ', 'warning');
                Swal.fire({ title: 'กำลังบันทึกข้อมูล...', allowOutsideClick: false, didOpen: () => { Swal.showLoading() } });
                try {
                    const payload = { student, activity: selectedActivity, answers: surveyAnswers, suggestion };
                    await runGAS('saveCheckInAndSurvey', payload);
                    Swal.close();
                    Swal.fire({title: 'เรียบร้อย', text: 'ขอบคุณที่เข้าร่วมกิจกรรมและให้การประเมิน', icon: 'success', confirmButtonColor: '#1a1a1a'}).then(goHome);
                } catch(e) { Swal.fire('ข้อผิดพลาด', e.message || 'ไม่สามารถส่งแบบประเมินได้', 'error'); }
            };

            const handleSearchHistory = async (rawStudentId) => {
                const studentId = String(rawStudentId).trim();
                if(!studentId) return Swal.fire('แจ้งเตือน', 'กรอกรหัสนักศึกษา', 'warning');
                Swal.fire({ title: 'ค้นหาประวัติ...', allowOutsideClick: false, didOpen: () => { Swal.showLoading() } });
                try {
                    let data = [];
                    if (isFastCSVReady()) {
                        const allChks = await fetchFastCSV('CheckIns').catch(() => []);
                        data = allChks.filter(c => {
                            const keys = Object.keys(c);
                            const val1 = String(c[findKey(keys, ['studentid', 'รหัส'])]).trim();
                            const val2 = String(c[findKey(keys, ['idcard', 'บัตร'])]).trim();
                            return val1 === studentId || val2 === studentId;
                        }).map(c => {
                            const keys = Object.keys(c);
                            return {
                                ActivityName: c[findKey(keys, ['activityname', 'ชื่อกิจกรรม'])] || 'กิจกรรม (ไม่ระบุชื่อ)',
                                Timestamp: c[findKey(keys, ['timestamp', 'เวลา'])] || '',
                                StudentID: c[findKey(keys, ['studentid', 'รหัส'])] || '',
                                Name: c[findKey(keys, ['name', 'ชื่อ'])] || ''
                            };
                        }).reverse();
                    } else { 
                        data = await runGAS('getStudentHistory', studentId); 
                    }
                    Swal.close(); setHistoryData(data || []); setView('history_result');
                } catch(e) { Swal.fire('ข้อผิดพลาด', e.message, 'error'); }
            };

            const Navbar = () => (
                <div className="w-full bg-transparent sticky top-0 z-50 transition-colors duration-300 pt-2">

                                <i className="fa-solid fa-gem text-white text-lg"></i>

                            ) : (

                            )}
                        </div>
                    </div>
                </div>
            );

            const MobileTabBar = () => {
                if(view.startsWith('admin')) return null;
                return (
                    <div className="md:hidden fixed bottom-0 left-0 w-full z-50 bg-white/90 backdrop-blur-md border-t border-orange-100 pb-safe shadow-[0_-10px_20px_rgba(249,115,22,0.05)] transition-colors">
                        <div className="flex justify-around items-center h-16 px-2">
                            <button onClick={goHome} className={`relative flex flex-col items-center justify-center w-full h-full space-y-1 transition-colors ${view === 'home' ? 'text-orange-600' : 'text-gray-400'}`}>
                                {view === 'home' && <div className="absolute top-0 w-8 h-1 bg-orange-500 rounded-b-full"></div>}
                                <i className={`fa-solid fa-house text-xl ${view === 'home' ? 'mb-0.5 scale-110' : ''}`}></i><span className="text-[10px] font-medium">หน้าแรก</span>
                            </button>

                                {(view === 'select_recruit' || (view === 'search' && searchPurpose === 'recruit')) && <div className="absolute top-0 w-8 h-1 bg-purple-500 rounded-b-full"></div>}
                                <i className={`fa-solid fa-bullhorn text-xl ${(view === 'select_recruit' || (view === 'search' && searchPurpose === 'recruit')) ? 'mb-0.5 scale-110' : ''}`}></i><span className="text-[10px] font-medium">รับสมัคร</span>
                            </button>
                            <button onClick={() => { if(!systemOpen) return Swal.fire({title:'ระบบปิด', icon:'info', confirmButtonColor: '#1a1a1a'}); setSearchPurpose('activity'); setView('search'); }} className={`relative flex flex-col items-center justify-center w-full h-full space-y-1 transition-colors ${(view === 'select' || view === 'survey' || (view === 'search' && searchPurpose === 'activity')) ? 'text-orange-600' : 'text-gray-400'}`}>
                                {(view === 'select' || view === 'survey' || (view === 'search' && searchPurpose === 'activity')) && <div className="absolute top-0 w-8 h-1 bg-orange-500 rounded-b-full"></div>}
                                <i className={`fa-solid fa-qrcode text-xl ${(view === 'select' || view === 'survey' || (view === 'search' && searchPurpose === 'activity')) ? 'mb-0.5 scale-110' : ''}`}></i><span className="text-[10px] font-medium">เช็คชื่อ</span>

                                    <i className={`fa-solid fa-shirt text-xl ${(view === 'shirt_form' || view === 'receipt' || (view === 'search' && searchPurpose === 'shirt')) ? 'mb-0.5 scale-110' : ''}`}></i><span className="text-[10px] font-medium">จองเสื้อ</span>

                            <button onClick={() => { setSearchPurpose('history'); setView('search'); }} className={`relative flex flex-col items-center justify-center w-full h-full space-y-1 transition-colors ${(view === 'history_search' || view === 'history_result' || (view === 'search' && searchPurpose === 'history')) ? 'text-orange-600' : 'text-gray-400'}`}>

                                <i className={`fa-solid fa-clock-rotate-left text-xl ${(view === 'history_search' || view === 'history_result' || (view === 'search' && searchPurpose === 'history')) ? 'mb-0.5 scale-110' : ''}`}></i><span className="text-[10px] font-medium">ประวัติ</span>
                            </button>

                return (

                                    </tr>

                        <div className="flex justify-between items-end border-t-2 border-gray-800 pt-4 mb-10 px-2">
                            <div>
                                <span className="text-sm font-bold text-charcoal-900">รวมเงินทั้งสิ้น</span><br/>
                                <span className="text-[10px] text-gray-500 font-medium uppercase tracking-widest">Grand Total</span>
                                
                                {data.grandTotal > 0 && (
                                    <div className="mt-3 flex flex-col gap-1.5">
                                        {data.paymentMethod === 'cash' ? (
                                            <>
                                                <span className="inline-flex items-center gap-1.5 bg-amber-50 text-amber-700 border border-amber-200 px-2.5 py-1 rounded-md text-[10px] font-bold tracking-wide w-fit">
                                                    <i className="fa-solid fa-money-bill-wave"></i> ชำระด้วยเงินสด
                                                </span>
                                                <span className="text-[9px] text-gray-500 font-medium ml-1">กรุณาชำระเงินที่จุดรับเสื้อ</span>
                                            </>
                                        ) : (
                                            <>
                                                <span className="inline-flex items-center gap-1.5 bg-emerald-50 text-emerald-700 border border-emerald-200 px-2.5 py-1 rounded-md text-[10px] font-bold tracking-wide w-fit">
                                                    <i className="fa-solid fa-money-bill-transfer"></i> ชำระผ่าน PromptPay
                                                </span>
                                                <span className="text-[9px] text-gray-500 font-medium ml-1">แนบสลิปเมื่อ: {data.date}</span>
                                            </>

                                    </div>
                                )}
                            </div>
                            <span className="text-2xl font-bold text-charcoal-900">฿ {data.grandTotal.toLocaleString()}</span>

                        <div className="mt-auto flex justify-between items-end gap-4">
                            <div className="text-[10px] text-gray-500 font-medium w-[60%] bg-gray-50 p-3 rounded border border-gray-200">
                                <span className="font-bold text-charcoal-900">หมายเหตุ (Note):</span><br/>
                                <span className="whitespace-pre-wrap leading-relaxed">{config.note}</span>
                            </div>
                            <div className="text-center w-[40%] pb-2">
                                <div className="border-b border-charcoal-900 mb-2 h-8"></div>
                                <p className="text-xs font-bold text-charcoal-900 mb-0.5">เจ้าหน้าที่ผู้รับเงิน</p>
                                <p className="text-[9px] text-gray-500 font-medium uppercase tracking-widest">Authorized Receiver</p>
                            </div>
                        </div>
                    </div>
                );

                return (
                    <div className="min-h-screen flex flex-col relative z-10">
                        <Navbar />
                        <div className="flex-grow flex flex-col items-center pt-8 p-4 pb-20">
                            <div className="w-full max-w-[1200px]">
                                <div className="flex justify-between items-end mb-6 px-2">
                                    <div><h2 className="text-2xl font-semibold text-charcoal-900">เอกสารยืนยันการจอง</h2><p className="text-gray-500 text-sm font-light mt-1">โปรดดาวน์โหลดใบเสร็จนี้เก็บไว้เป็นหลักฐาน</p></div>
                                    <p className="text-xs text-orange-500 font-medium xl:hidden"><i className="fa-solid fa-arrows-left-right"></i> เลื่อนซ้ายขวาเพื่อดูฉบับเต็ม</p>
                                </div>

                                <div className="w-full overflow-x-auto pb-6 custom-scrollbar">
                                    <div id="receipt-card" className="bg-white flex flex-row justify-between items-stretch shadow-sm border border-orange-100/50" style={{ width: '1123px', minHeight: '794px', margin: '0 auto' }}>
                                        <ReceiptSlip title="ORIGINAL" data={receiptData} config={receiptSettings} />
                                        <div className="flex flex-col items-center justify-center gap-4 text-gray-300 bg-orange-50/30 px-1 border-x border-dashed border-orange-200/50">
                                            <i className="fa-solid fa-scissors text-orange-300 text-xs transform -rotate-90"></i>
                                            <span className="text-[9px] font-medium uppercase tracking-[0.2em] whitespace-nowrap opacity-50 text-orange-400" style={{ writingMode: 'vertical-rl', transform: 'rotate(180deg)' }}>Cut Here</span>
                                            <i className="fa-solid fa-scissors text-orange-300 text-xs transform rotate-90"></i>
                                        </div>
                                        <ReceiptSlip title="COPY" data={receiptData} config={receiptSettings} />
                                    </div>
                                </div>
                                
                                <div className="flex flex-col sm:flex-row justify-center gap-4 mt-4 max-w-[800px] w-full mx-auto">
                                    <button onClick={goHome} className="w-full sm:w-1/4 bg-white text-charcoal-900 font-semibold py-4 rounded-xl border border-gray-200 hover:bg-orange-50 transition-colors text-sm tracking-wider">กลับหน้าแรก</button>
                                    {shirtSystemOpen && <button onClick={() => { setIsEditingOrder(true); setView('shirt_form'); }} className="w-full sm:w-1/4 btn-primary py-4 rounded-xl font-semibold text-sm tracking-wider hover:bg-gray-800">แก้ไขข้อมูล</button>}
                                    <button onClick={handleDownloadReceipt} className="w-full sm:w-2/4 btn-gradient py-4 rounded-xl font-semibold flex justify-center items-center gap-2 text-sm tracking-wider shadow-lg shadow-orange-500/20"><i className="fa-solid fa-download"></i> โหลดใบเสร็จ</button>
                                </div>
                            </div>
                        </div>
                        <Footer />
                        <MobileTabBar />
                    </div>
                );
            }

            if (view === 'admin_login') {
                const handleAdminLogin = (e) => {
                    e.preventDefault();
                    if(e.target.username.value === 'admin' && e.target.password.value === '9999') {
                        localStorage.setItem('admin_logged_in', 'true'); loadAdminData();
                    } else { 
                        Swal.fire({
                            title: 'ข้อมูลไม่ถูกต้อง', 
                            text: 'รหัสผ่านหรือชื่อผู้ใช้ผิด กรุณาลองใหม่', 
                            icon: 'error',
                            confirmButtonColor: '#ea580c'
                        }).then(() => {
                            goHome();
                        }); 
                    }
                };

                return (
                    <div className="min-h-screen flex flex-col bg-charcoal-900 relative">
