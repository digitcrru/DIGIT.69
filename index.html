<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DIGIT.69</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: { 
                        brand: '#ff6600', brandDark: '#cc5200', brandLight: '#ff8533',
                        lightBg: '#f8fafc', darkBg: '#09090b',
                        panelLight: '#ffffff', panelDark: 'rgba(24, 24, 27, 0.85)'
                    },
                    boxShadow: {
                        'glow-brand': '0 0 25px rgba(255, 102, 0, 0.3)',
                        'glow-red': '0 0 25px rgba(239, 68, 68, 0.3)',
                        'glass': '0 8px 32px 0 rgba(31, 38, 135, 0.07)',
                        'soft': '0 10px 40px -10px rgba(0, 0, 0, 0.08)',
                    },
                    animation: { 
                        'fade-in': 'fadeIn 0.4s cubic-bezier(0.22, 1, 0.36, 1)',
                        'slide-up': 'slideUp 0.5s cubic-bezier(0.22, 1, 0.36, 1)'
                    },
                    keyframes: { 
                        fadeIn: { '0%': { opacity: '0', transform: 'scale(0.98)' }, '100%': { opacity: '1', transform: 'scale(1)' } },
                        slideUp: { '0%': { opacity: '0', transform: 'translateY(20px)' }, '100%': { opacity: '1', transform: 'translateY(0)' } }
                    }
                }
            }
        }
    </script>
    
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-is@18/umd/react-is.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prop-types/15.8.1/prop-types.min.js"></script>
    <script src="https://unpkg.com/recharts@2.1.12/umd/Recharts.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://cdn.jsdelivr.net/npm/@sweetalert2/theme-dark@4/dark.css" rel="stylesheet" id="swal-theme">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <style>
        body { font-family: 'Prompt', sans-serif; margin: 0; padding: 0; overflow-x: hidden; -webkit-font-smoothing: antialiased; background-color: #f8fafc; }
        .dark body { background-color: #09090b; }
        body::before {
            content: ""; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: -1; pointer-events: none;
            background-image: radial-gradient(at 0% 0%, hsla(28, 100%, 74%, 0.15) 0px, transparent 50%), radial-gradient(at 100% 0%, hsla(250, 100%, 74%, 0.1) 0px, transparent 50%), radial-gradient(at 100% 100%, hsla(28, 100%, 74%, 0.15) 0px, transparent 50%);
        }
        .dark body::before {
            background-image: radial-gradient(at 0% 0%, hsla(28, 100%, 50%, 0.08) 0px, transparent 50%), radial-gradient(at 100% 0%, hsla(250, 100%, 50%, 0.05) 0px, transparent 50%), radial-gradient(at 100% 100%, hsla(28, 100%, 50%, 0.08) 0px, transparent 50%);
        }
        
        .glass-panel { background: rgba(255, 255, 255, 0.7); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.6); box-shadow: 0 4px 30px rgba(0, 0, 0, 0.03); transition: all 0.3s ease; }
        .dark .glass-panel { background: rgba(24, 24, 27, 0.65); border: 1px solid rgba(255, 255, 255, 0.08); box-shadow: 0 4px 30px rgba(0, 0, 0, 0.3); }

        .input-modern { outline: none; background: rgba(255, 255, 255, 0.8); border: 1px solid #e2e8f0; color: #0f172a; transition: all 0.3s ease; }
        .input-modern:focus { border-color: #ff6600; box-shadow: 0 0 0 4px rgba(255, 102, 0, 0.1); background: #ffffff; }
        .dark .input-modern { background: rgba(0, 0, 0, 0.3); border: 1px solid rgba(255, 255, 255, 0.1); color: #f8fafc; }
        .dark .input-modern:focus { border-color: #ff6600; box-shadow: 0 0 0 4px rgba(255, 102, 0, 0.15); background: rgba(0, 0, 0, 0.5); }

        .brand-gradient { background: linear-gradient(135deg, #ff8533 0%, #ff6600 50%, #e65c00 100%); }
        .brand-text-gradient { background-clip: text; -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-image: linear-gradient(135deg, #ff8533, #ff6600); }
        
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        .light-mode ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        .dark ::-webkit-scrollbar-thumb { background: #3f3f46; border-radius: 10px; }
        .btn-interactive { transition: transform 0.15s ease, box-shadow 0.3s ease, background 0.3s ease; }
        .btn-interactive:active:not(:disabled) { transform: scale(0.97); }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(156, 163, 175, 0.5); border-radius: 10px; }

        @media print {
            body { background: white !important; color: black !important; }
            body::before { display: none; }
            .no-print { display: none !important; }
            .print-area { display: block !important; width: 100% !important; margin: 0 !important; padding: 0 !important; }
            .glass-panel { border: none !important; box-shadow: none !important; background: white !important; }
            .avoid-break { break-inside: avoid; }
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo, useRef, createContext, useContext } = React;
        const { BarChart, Bar, LineChart, Line, XAxis, YAxis, Tooltip, ResponsiveContainer, PieChart, Pie, Cell, Legend } = window.Recharts || {};

        const AppContext = createContext();

        const API_URL = "https://script.google.com/macros/s/AKfycbwviBRd_BbtvGyEpZSq5ab5A0iEpXkG9iMwAUQyGyZb-nDI2R5-x8GE5ZEI3gpmzA3zug/exec";
        const SHEET_ID = "1MoZpnDniVF5pKr0tEgmYwlPO3wZdA7DaO_MvZjbC-ec";
        
        // แยก URL เป็นชีตตามการใช้งาน
        const REGISTRATION69_CSV_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&sheet=Registration69`;
        const REGISTRATION_CSV_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&sheet=Registration`;
        const ACTIVITY_SHEET_CSV_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&sheet=Activities`;
        const LOGS_SHEET_CSV_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&sheet=Logs`;
        const SURVEY_SHEET_CSV_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&sheet=Surveys`;
        
        const MAJOR_LIST = [
            "เทคโนโลยีดิจิทัลเพื่อธุรกิจ", "เทคโนโลยีดิจิทัลเพื่อธุรกิจ(เทียบโอน)",
            "เทคโนโลยีปัญญาประดิษฐ์", "เทคโนโลยีสารสนเทศ", "เทคโนโลยีสารสนเทศ(เทียบโอน)",
            "วิทยาการคอมพิวเตอร์", "กราฟิกดีไซน์เทคโนโลยีสื่อดิจิทัล",
            "กราฟิกดีไซน์สื่อศิลปะและการออกแบบ", "กราฟิกดีไซน์สื่อศิลปะและการออกแบบ(เทียบโอน)",
            "วิศวกรรมคอมพิวเตอร์"
        ];

        const cleanMajor = (str) => str ? str.replace(/\s*\([^)]*\)/g, '').trim() : '';

        const submitToAPI = async (action, payload) => {
            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify({ action, payload })
                });
                return await response.json();
            } catch (err) {
                throw new Error("การเชื่อมต่อระบบล้มเหลว กรุณาลองใหม่อีกครั้ง");
            }
        };

        function Icon({ name, size = 20, className = '' }) {
            const containerRef = useRef(null);
            useEffect(() => {
                if (containerRef.current) {
                    containerRef.current.innerHTML = `<i data-lucide="${name}" class="${className}" style="width:${size}px; height:${size}px;"></i>`;
                    if (window.lucide) lucide.createIcons({ root: containerRef.current });
                }
            }, [name, size, className]);
            return <span ref={containerRef} className={`inline-flex items-center justify-center shrink-0 ${className}`} />;
        }

        function StatCard({ label, value, icon, color, onClick, subtext }) {
            const colors = {
                brand: { bg: 'bg-orange-50 dark:bg-orange-500/10', text: 'text-brand', hover: 'hover:border-brand/40 hover:shadow-glow-brand/20' },
                emerald: { bg: 'bg-emerald-50 dark:bg-emerald-500/10', text: 'text-emerald-600 dark:text-emerald-400', hover: 'hover:border-emerald-400/40 hover:shadow-lg' },
                red: { bg: 'bg-red-50 dark:bg-red-500/10', text: 'text-red-600 dark:text-red-400', hover: 'hover:border-red-400/40 hover:shadow-glow-red/20' },
                purple: { bg: 'bg-purple-50 dark:bg-purple-500/10', text: 'text-purple-600 dark:text-purple-400', hover: 'hover:border-purple-400/40 hover:shadow-lg' },
                blue: { bg: 'bg-blue-50 dark:bg-blue-500/10', text: 'text-blue-600 dark:text-blue-400', hover: 'hover:border-blue-400/40 hover:shadow-lg' },
                pink: { bg: 'bg-pink-50 dark:bg-pink-500/10', text: 'text-pink-600 dark:text-pink-400', hover: 'hover:border-pink-400/40 hover:shadow-lg' },
            }[color] || { bg: 'bg-slate-50 dark:bg-white/5', text: 'text-slate-600 dark:text-slate-400', hover: 'hover:border-slate-400/40 hover:shadow-lg' };

            return (
                <div onClick={onClick} className={`p-6 md:p-8 rounded-[2rem] border border-slate-200/50 dark:border-white/5 ${colors.bg} relative overflow-hidden shadow-soft ${onClick ? `cursor-pointer btn-interactive group ${colors.hover}` : ''} transition-all duration-300 flex flex-col justify-between`}>
                    <div className={`absolute right-0 top-0 p-6 opacity-0 ${onClick ? 'group-hover:opacity-10 group-hover:scale-110' : 'opacity-5'} transition-all transform translate-x-2 -translate-y-2 ${colors.text}`}>
                        <Icon name={icon} size={100} />
                    </div>
                    <div className="flex justify-between items-start mb-4 relative z-10">
                        <div className={`p-3.5 rounded-[1rem] bg-white/60 dark:bg-black/20 ${colors.text} shadow-sm`}><Icon name={icon} size={28} /></div>
                        {onClick && <div className={`p-2 bg-white/80 dark:bg-white/10 rounded-xl opacity-0 group-hover:opacity-100 transition-opacity border border-slate-200 dark:border-white/10 ${colors.text}`}><Icon name="search" size={16} /></div>}
                    </div>
                    <div className="relative z-10">
                        <p className="text-slate-500 dark:text-slate-400 text-sm font-bold uppercase tracking-wider mb-1">{label}</p>
                        <div className="flex items-end gap-3">
                            <h3 className={`text-5xl md:text-6xl font-black text-slate-800 dark:text-white drop-shadow-sm leading-none`}>{value}</h3>
                            {subtext && <span className="text-base font-bold text-slate-500 mb-1">{subtext}</span>}
                        </div>
                    </div>
                </div>
            );
        }

        function SectionHeader({ icon, title, colorClass }) {
            return (
                <div className="flex items-center gap-3 mb-6 pb-4 border-b border-slate-200/50 dark:border-white/5">
                    <div className={`p-3 rounded-2xl shadow-sm ${colorClass}`}><Icon name={icon} size={22}/></div>
                    <h3 className="text-xl md:text-2xl font-black text-slate-800 dark:text-white tracking-tight">{title}</h3>
                </div>
            );
        }

        function InputField({ label, type="text", value, onChange, placeholder, maxLength, required, numeric, rows, disabled }) {
            return (
                <div className="flex flex-col gap-1.5 w-full">
                    <label className="text-xs font-bold text-slate-600 dark:text-slate-400 uppercase tracking-widest">{label} {required && <span className="text-red-500">*</span>}</label>
                    {rows ? (
                        <textarea disabled={disabled} value={value} onChange={e => onChange(e.target.value)} placeholder={placeholder} maxLength={maxLength} required={required} rows={rows} className="w-full input-modern rounded-xl px-4 py-3.5 text-sm font-semibold shadow-sm resize-none custom-scrollbar disabled:opacity-60" />
                    ) : (
                        <input disabled={disabled} type={type} value={value} onChange={e => { let val = e.target.value; if (numeric) val = val.replace(/\D/g, ''); onChange(val); }} placeholder={placeholder} maxLength={maxLength} required={required} className={`w-full input-modern rounded-xl px-4 py-3.5 text-sm font-semibold shadow-sm ${numeric ? 'font-mono' : ''} disabled:opacity-60 disabled:cursor-not-allowed`} />
                    )}
                </div>
            );
        }

        function TogglePill({ options, value, onChange, isWarningType }) {
            return (
                <div className="flex flex-wrap gap-3">
                    {options.map(opt => {
                        const isActive = value === opt.value;
                        const isAlert = isWarningType && opt.value !== 'ไม่มี' && opt.value !== 'ไม่แพ้';
                        return (
                            <button key={opt.value} type="button" onClick={() => onChange(opt.value)}
                                className={`flex-1 min-w-[100px] py-3.5 px-4 rounded-xl font-bold transition-all duration-300 border flex items-center justify-center gap-2 text-sm btn-interactive shadow-sm ${isActive ? (isAlert ? 'border-red-500 bg-red-500 text-white shadow-glow-red' : 'border-brand bg-brand text-white shadow-glow-brand') : 'border-slate-200 dark:border-white/10 bg-white/50 dark:bg-black/20 text-slate-500 hover:bg-white dark:hover:bg-white/10'}`}>
                                {isActive && <Icon name={isAlert ? "alert-triangle" : "check-circle"} size={16} />} {opt.label}
                            </button>
                        )
                    })}
                </div>
            );
        }

        // ==========================================
        // 🏠 Home View
        // ==========================================
        function HomeView({ onSelectNewStudent, onSelectActivity, onCheckActivity, onAdminClick, mockUsers, isRegistrationOpen }) {
            const promptAdmin = () => {
                Swal.fire({
                    title: '<h3 class="text-2xl font-black text-slate-800 dark:text-white mb-2">Admin Login</h3>',
                    html: `
                        <div class="flex flex-col gap-4 text-left px-2">
                            <div>
                                <label class="text-xs font-bold text-slate-500 uppercase tracking-widest mb-1.5 block">Username</label>
                                <input id="swal-user" class="w-full input-modern rounded-xl px-4 py-3.5 text-sm font-semibold shadow-sm" placeholder="กรอกชื่อผู้ใช้งาน" autocapitalize="off" autocorrect="off">
                            </div>
                            <div>
                                <label class="text-xs font-bold text-slate-500 uppercase tracking-widest mb-1.5 block">Password</label>
                                <input id="swal-pass" type="password" class="w-full input-modern rounded-xl px-4 py-3.5 text-sm font-semibold shadow-sm tracking-widest font-mono" placeholder="••••••••">
                            </div>
                        </div>
                    `,
                    showCancelButton: true, confirmButtonText: 'เข้าสู่ระบบ', cancelButtonText: 'ยกเลิก', confirmButtonColor: '#ff6600', cancelButtonColor: '#64748b',
                    focusConfirm: false,
                    customClass: {
                        popup: 'rounded-[2rem] bg-white dark:bg-zinc-900 border border-slate-200/50 dark:border-white/5 shadow-2xl pb-6',
                        confirmButton: 'rounded-xl font-bold px-8 py-3.5 shadow-md hover:shadow-lg transition-all w-full sm:w-auto',
                        cancelButton: 'rounded-xl font-bold px-8 py-3.5 transition-all w-full sm:w-auto',
                        actions: 'flex gap-3 w-full justify-center px-6 mt-6'
                    },
                    preConfirm: () => {
                        const user = document.getElementById('swal-user').value.trim();
                        const pass = document.getElementById('swal-pass').value.trim();
                        if (!user || !pass) {
                            Swal.showValidationMessage('กรุณากรอก Username และ Password ให้ครบถ้วน');
                        }
                        return { user, pass };
                    }
                }).then((result) => {
                    if (result.isConfirmed) {
                        const { user, pass } = result.value;
                        
                        const foundUser = mockUsers.find(u => u.username === user && u.password === pass && u.status === 'Active');

                        if (foundUser) {
                            onAdminClick(foundUser);
                        } else {
                            Swal.fire({ icon: 'error', title: 'เข้าสู่ระบบล้มเหลว', text: 'ชื่อผู้ใช้งาน หรือรหัสผ่านไม่ถูกต้อง (หรือถูกระงับสิทธิ์)', confirmButtonColor: '#ff6600', customClass: { popup: 'rounded-[2rem] bg-white dark:bg-zinc-900 text-slate-800 dark:text-white' }});
                        }
                    }
                });
            };

            return (
                <div className="flex flex-col items-center justify-center min-h-[85vh] animate-fade-in relative">
                    <button onClick={promptAdmin} className="absolute top-0 right-0 p-3.5 text-slate-400 hover:text-brand bg-white/50 dark:bg-black/20 hover:bg-white dark:hover:bg-white/10 backdrop-blur-md transition-all z-20 rounded-full shadow-sm border border-slate-200/50 dark:border-white/5 btn-interactive flex items-center gap-2" title="เข้าสู่ระบบผู้ดูแล">
                        <span className="text-xs font-bold uppercase tracking-widest hidden sm:inline-block pl-2">Staff Login</span>
                        <Icon name="log-in" size={18} />
                    </button>

                    <div className="text-center mb-10 md:mb-12 mt-10">
                        <div className="inline-flex items-center justify-center p-5 bg-brand/10 text-brand rounded-[2rem] shadow-glow-brand mb-6 transform hover:scale-110 transition-transform duration-500">
                            <Icon name="box" size={56} />
                        </div>
                        <h1 className="text-5xl md:text-6xl font-black text-slate-800 dark:text-white tracking-tight mb-4">DIGIT<span className="brand-text-gradient">.69</span></h1>
                        <p className="text-slate-500 dark:text-slate-400 font-bold text-sm md:text-base uppercase tracking-widest">Student Service Portal</p>
                    </div>

                    <div className="grid grid-cols-1 md:grid-cols-3 gap-6 w-full max-w-6xl px-2">
                        <div onClick={() => {
                            if (isRegistrationOpen) onSelectNewStudent();
                            else Swal.fire({ icon: 'warning', title: 'ระบบปิดให้บริการ', text: 'ขณะนี้ระบบปิดรับขึ้นทะเบียนนักศึกษาใหม่ชั่วคราว กรุณาติดต่อเจ้าหน้าที่', customClass: { popup: 'rounded-[2rem] bg-white dark:bg-zinc-900 text-slate-800 dark:text-white' }});
                        }} className={`glass-panel p-8 rounded-[2.5rem] border-t-[8px] ${isRegistrationOpen ? 'border-t-brand shadow-soft hover:shadow-[0_20px_40px_-10px_rgba(255,102,0,0.2)] hover:-translate-y-2 cursor-pointer group' : 'border-t-slate-400 opacity-80 cursor-not-allowed'} transition-all duration-300 flex flex-col items-center text-center relative overflow-hidden`}>
                            <div className={`absolute -right-10 -top-10 opacity-5 ${isRegistrationOpen ? 'text-brand group-hover:scale-125' : 'text-slate-500'} transition-transform duration-500 pointer-events-none`}><Icon name="user-plus" size={150}/></div>
                            <div className={`w-20 h-20 ${isRegistrationOpen ? 'bg-brand/10 text-brand group-hover:scale-110' : 'bg-slate-200 dark:bg-slate-800 text-slate-500'} rounded-[1.5rem] flex items-center justify-center mb-6 transition-transform shadow-inner relative z-10`}><Icon name={isRegistrationOpen ? "user-plus" : "lock"} size={40} /></div>
                            <h3 className="text-xl md:text-2xl font-black text-slate-800 dark:text-white mb-4 relative z-10">1. ขึ้นทะเบียน นศ.ใหม่ {!isRegistrationOpen && <span className="block text-sm text-red-500 mt-1">(ปิดระบบ)</span>}</h3>
                            <p className="text-slate-500 dark:text-slate-400 font-medium relative z-10 text-sm">บันทึกประวัติส่วนตัว ข้อมูลสุขภาพ และโภชนาการสำหรับนักศึกษา</p>
                            <div className={`mt-8 w-full py-3 ${isRegistrationOpen ? 'bg-slate-100 dark:bg-white/5 text-slate-600 dark:text-slate-300 group-hover:bg-brand group-hover:text-white' : 'bg-slate-200 dark:bg-slate-800 text-slate-500'} rounded-xl font-bold transition-colors flex items-center justify-center gap-2 relative z-10`}>
                                {isRegistrationOpen ? <>เริ่มต้น <Icon name="arrow-right" size={16}/></> : <>ปิดให้บริการ</>}
                            </div>
                        </div>

                        <div onClick={onSelectActivity} className="glass-panel p-8 rounded-[2.5rem] border-t-[8px] border-t-purple-500 shadow-soft hover:shadow-[0_20px_40px_-10px_rgba(168,85,247,0.2)] hover:-translate-y-2 transition-all duration-300 cursor-pointer group flex flex-col items-center text-center relative overflow-hidden">
                            <div className="absolute -right-10 -top-10 opacity-5 text-purple-500 group-hover:scale-125 transition-transform duration-500 pointer-events-none"><Icon name="calendar-check" size={150}/></div>
                            <div className="w-20 h-20 bg-purple-50 dark:bg-purple-500/10 text-purple-600 rounded-[1.5rem] flex items-center justify-center mb-6 group-hover:scale-110 transition-transform shadow-inner relative z-10"><Icon name="calendar-check" size={40} /></div>
                            <h3 className="text-xl md:text-2xl font-black text-slate-800 dark:text-white mb-4 relative z-10">2. ลงทะเบียนกิจกรรม</h3>
                            <p className="text-slate-500 dark:text-slate-400 font-medium relative z-10 text-sm">ระบบลงทะเบียนและเช็คชื่อเข้าร่วมกิจกรรมต่างๆ ของคณะ</p>
                            <div className="mt-8 w-full py-3 bg-slate-100 dark:bg-white/5 rounded-xl font-bold text-slate-600 dark:text-slate-300 group-hover:bg-purple-500 group-hover:text-white transition-colors flex items-center justify-center gap-2 relative z-10">เริ่มต้น <Icon name="arrow-right" size={16}/></div>
                        </div>

                        <div onClick={onCheckActivity} className="glass-panel p-8 rounded-[2.5rem] border-t-[8px] border-t-blue-500 shadow-soft hover:shadow-[0_20px_40px_-10px_rgba(59,130,246,0.2)] hover:-translate-y-2 transition-all duration-300 cursor-pointer group flex flex-col items-center text-center relative overflow-hidden">
                            <div className="absolute -right-10 -top-10 opacity-5 text-blue-500 group-hover:scale-125 transition-transform duration-500 pointer-events-none"><Icon name="history" size={150}/></div>
                            <div className="w-20 h-20 bg-blue-50 dark:bg-blue-500/10 text-blue-600 rounded-[1.5rem] flex items-center justify-center mb-6 group-hover:scale-110 transition-transform shadow-inner relative z-10"><Icon name="history" size={40} /></div>

                            <div className="mt-8 w-full py-3 bg-slate-100 dark:bg-white/5 rounded-xl font-bold text-slate-600 dark:text-slate-300 group-hover:bg-blue-500 group-hover:text-white transition-colors flex items-center justify-center gap-2 relative z-10">ตรวจสอบประวัติ <Icon name="arrow-right" size={16}/></div>

        // ==========================================
        // 🔍 Check Activity View
        // ==========================================
        function CheckActivityView({ onBack }) {
            const [step, setStep] = useState(1);
            const [searchID, setSearchID] = useState('');
            const [isSearching, setIsSearching] = useState(false);
            const [studentData, setStudentData] = useState(null);
            const [attendedActivities, setAttendedActivities] = useState([]);

            const handleSearch = (e) => {
                e.preventDefault();
                if (!searchID.trim()) { 
                    Swal.fire({ icon: 'warning', title: 'แจ้งเตือน', text: 'กรุณากรอกรหัสนักศึกษา หรือ รหัสประจำตัวประชาชน', customClass:{popup:'rounded-[2rem] bg-white dark:bg-zinc-900 text-slate-800 dark:text-white'} }); 
                    return; 
                }

                setIsSearching(true);
                
                // ฝั่งตรวจสอบประวัติดึงจาก Registration69
                Papa.parse(`${REGISTRATION69_CSV_URL}&_cb=${new Date().getTime()}`, {
                    download: true, header: true,
                    complete: (regRes) => {
                        const validStudents = regRes.data.filter(r => r.FullName !== 'SYSTEM_ACTIVITY_DEF' && r.BloodGroup !== 'Activity');
                        const searchTerm = searchID.trim().toLowerCase();
                        const foundStudent = validStudents.find(row => (row.IDCard && row.IDCard.toString().trim().toLowerCase() === searchTerm) || (row.StudentID && row.StudentID.toString().trim().toLowerCase() === searchTerm));
                        
                        if (!foundStudent) {
                            Swal.fire({ icon: 'error', title: 'ไม่พบข้อมูล', text: 'ไม่พบประวัตินักศึกษาในระบบ กรุณาตรวจสอบรหัสอีกครั้ง', customClass:{popup:'rounded-[2rem] bg-white dark:bg-zinc-900 text-slate-800 dark:text-white'} });
                            setIsSearching(false);
                            return;
                        }

                        Papa.parse(`${LOGS_SHEET_CSV_URL}&_cb=${new Date().getTime()}`, {
                            download: true, header: true,
                            complete: (logRes) => {
                                const logs = logRes.data.filter(l => l.StudentID === foundStudent.StudentID);
                                setStudentData({ FullName: foundStudent.FullName, StudentID: foundStudent.StudentID, Major: cleanMajor(foundStudent.Major), IDCard: foundStudent.IDCard });
                                setAttendedActivities(logs);
                                setStep(2);
                                setIsSearching(false);
                            },
                            error: () => { 
                                Swal.fire({ icon: 'error', title: 'Error', text: 'ไม่สามารถดึงข้อมูลประวัติกิจกรรมได้', customClass:{popup:'rounded-[2rem] bg-white dark:bg-zinc-900 text-slate-800 dark:text-white'} }); 
                                setIsSearching(false); 
                            }
                        });
                    },
                    error: () => { 
                        Swal.fire({ icon: 'error', title: 'Error', text: 'การเชื่อมต่อฐานข้อมูลล้มเหลว', customClass:{popup:'rounded-[2rem] bg-white dark:bg-zinc-900 text-slate-800 dark:text-white'} }); 
                        setIsSearching(false); 
                    }
                });
            };

            return (
                <div className="max-w-3xl mx-auto animate-fade-in pb-10">
                    <button onClick={step === 1 ? onBack : () => setStep(1)} className="flex items-center gap-2 text-slate-500 hover:text-blue-600 font-bold text-sm mb-6 transition-colors px-2 btn-interactive">
                        <Icon name="arrow-left" size={16} /> {step === 1 ? 'ย้อนกลับ' : 'ค้นหาใหม่'}

                    {step === 1 && (
                        <form onSubmit={handleSearch} className="space-y-6">
                            <div className="glass-panel p-6 md:p-10 rounded-[2.5rem] border-t-[8px] border-t-blue-500 border border-slate-200/50 dark:border-white/5 shadow-soft text-center">
                                <div className="w-20 h-20 bg-blue-100 dark:bg-blue-500/20 text-blue-600 rounded-full flex items-center justify-center mx-auto mb-6 shadow-inner"><Icon name="history" size={40} /></div>
                                <h2 className="text-2xl font-black text-slate-800 dark:text-white mb-2">ตรวจสอบการเข้าร่วมกิจกรรม</h2>
                                <p className="text-slate-500 dark:text-slate-400 mb-8 font-medium">กรุณากรอกรหัสนักศึกษา, บัตร ปชช.เพื่อดูประวัติ</p>

                                    <button type="submit" disabled={isSearching} className="w-full py-4 bg-gradient-to-r from-blue-500 to-cyan-500 text-white rounded-xl font-black text-lg shadow-[0_0_20px_rgba(59,130,246,0.3)] hover:shadow-[0_0_30px_rgba(59,130,246,0.5)] transform hover:-translate-y-1 transition-all btn-interactive flex items-center justify-center gap-2">
                                        {isSearching ? <Icon name="loader-2" className="animate-spin" /> : <Icon name="search" />} ค้นหาข้อมูล
                                    </button>
                                </div>
                            </div>
                        </form>
                    )}

                    {step === 2 && studentData && (
                        <div className="space-y-6 animate-fade-in">
                            <div className="glass-panel p-6 md:p-8 rounded-[2.5rem] border-t-[8px] border-t-blue-500 border border-slate-200/50 dark:border-white/5 shadow-soft">
                                <div className="bg-slate-50/80 dark:bg-black/20 p-6 md:p-8 rounded-3xl border border-slate-200/60 dark:border-white/10 flex flex-col sm:flex-row gap-6 md:gap-8 items-center sm:items-start shadow-inner relative overflow-hidden">
                                    <div className="absolute top-0 right-0 p-6 opacity-[0.03] text-blue-500 pointer-events-none transform translate-x-4 -translate-y-4"><Icon name="user" size={150} /></div>
                                    <div className="w-20 h-20 sm:w-24 sm:h-24 bg-gradient-to-br from-blue-100 to-cyan-100 dark:from-blue-900/40 dark:to-cyan-900/40 rounded-full flex items-center justify-center text-blue-600 dark:text-blue-400 shrink-0 border border-white dark:border-white/5 shadow-md relative z-10"><Icon name="user" size={48} /></div>
                                    <div className="flex-1 text-center sm:text-left relative z-10 w-full">
                                        <h3 className="text-2xl font-black text-slate-800 dark:text-white mb-2">{studentData.FullName}</h3>
                                        <div className="grid grid-cols-1 sm:grid-cols-2 gap-3 md:gap-4 mt-3">
                                            <div className="bg-white dark:bg-zinc-800/80 p-2.5 rounded-xl border border-slate-100 dark:border-white/5 shadow-sm text-left"><p className="text-[10px] font-bold uppercase tracking-widest text-slate-400 mb-0.5">รหัสนักศึกษา</p><p className="font-mono font-bold text-blue-600 dark:text-blue-400">{studentData.StudentID || '-'}</p></div>
                                            <div className="bg-white dark:bg-zinc-800/80 p-2.5 rounded-xl border border-slate-100 dark:border-white/5 shadow-sm text-left"><p className="text-[10px] font-bold uppercase tracking-widest text-slate-400 mb-0.5">รหัสประจำตัว ปชช.</p><p className="font-mono font-bold text-slate-700 dark:text-slate-300">{studentData.IDCard || '-'}</p></div>
                                        </div>
                                        <div className="flex flex-wrap gap-2 justify-center sm:justify-start mt-3">
                                            <span className="bg-slate-200/70 dark:bg-white/10 px-3 py-1.5 rounded-lg text-xs font-semibold text-slate-700 dark:text-slate-300 border border-slate-300 dark:border-white/5">{studentData.Major}</span>
                                        </div>
                                    </div>
                                </div>

                                <div className="mt-8">
                                    <div className="flex items-center justify-between mb-4">
                                        <h4 className="text-lg font-black text-slate-800 dark:text-white flex items-center gap-2"><Icon name="list-checks" className="text-blue-500" size={20}/> ประวัติการเข้าร่วมกิจกรรม</h4>
                                        <span className="px-3 py-1 bg-blue-100 dark:bg-blue-500/20 text-blue-700 dark:text-blue-300 rounded-lg text-xs font-bold shadow-sm">เข้าร่วมแล้ว {attendedActivities.length} ครั้ง</span>
                                    </div>

                                    {attendedActivities.length > 0 ? (
                                        <div className="space-y-3">
                                            {attendedActivities.slice().reverse().map((act, idx) => (
                                                <div key={idx} className="bg-white dark:bg-zinc-800/80 p-4 rounded-2xl border border-slate-200/60 dark:border-white/10 shadow-sm flex flex-col sm:flex-row sm:items-center justify-between gap-3 hover:border-blue-300 dark:hover:border-blue-500/50 transition-colors group">
                                                    <div className="flex items-start gap-3">
                                                        <div className="mt-0.5 w-8 h-8 rounded-full bg-emerald-100 dark:bg-emerald-500/20 text-emerald-500 flex items-center justify-center shrink-0 shadow-inner group-hover:scale-110 transition-transform"><Icon name="check" size={16} /></div>
                                                        <div>
                                                            <h5 className="font-bold text-slate-800 dark:text-white text-base group-hover:text-blue-600 dark:group-hover:text-blue-400 transition-colors">{act.ActivityName}</h5>
                                                            <div className="flex items-center gap-1.5 mt-1 text-xs font-semibold text-slate-500 dark:text-slate-400">
                                                                <Icon name="clock" size={12} /> {new Date(act.Timestamp).toLocaleString('th-TH')}
                                                            </div>
                                                        </div>
                                                    </div>
                                                </div>
                                            ))}
                                        </div>
                                    ) : (
                                        <div className="text-center p-8 bg-slate-50 dark:bg-white/5 rounded-3xl border border-dashed border-slate-200 dark:border-white/10 mt-4">
                                            <div className="w-16 h-16 bg-slate-200 dark:bg-white/5 text-slate-400 rounded-full flex items-center justify-center mx-auto mb-3"><Icon name="inbox" size={24} /></div>
                                            <p className="text-slate-500 dark:text-slate-400 font-semibold">คุณยังไม่เคยลงทะเบียนเข้าร่วมกิจกรรมใดๆ</p>
                                        </div>
                                    )}
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        // ==========================================
        // ⚖️ PDPA Modal
        // ==========================================
        function PdpaModal({ onAccept, onBack }) {
            const [isChecked, setIsChecked] = useState(false);
            const handleDecline = () => Swal.fire({ icon: 'warning', title: 'ไม่ยินยอม', text: 'คณะเทคโนโลยีดิจิทัล ให้ความสำคัญอย่างยิ่งกับการคุ้มครองข้อมูลส่วนบุคคลของท่าน', confirmButtonText: 'ตกลง', confirmButtonColor: '#ff6600', customClass: { popup: 'rounded-[2rem] bg-white dark:bg-zinc-900 text-slate-800 dark:text-white' } });

            return (
                <div className="fixed inset-0 z-[100] flex items-end sm:items-center justify-center sm:p-6 bg-slate-900/80 dark:bg-black/90 backdrop-blur-sm animate-fade-in">
                    <div className="bg-white dark:bg-zinc-900 w-full sm:max-w-3xl relative flex flex-col h-[92vh] sm:h-auto sm:max-h-[90vh] rounded-t-[2rem] sm:rounded-[2.5rem] shadow-[0_-10px_40px_rgba(0,0,0,0.2)] sm:shadow-[0_20px_60px_rgba(0,0,0,0.3)] animate-slide-up overflow-hidden">
                        <div className="absolute top-0 left-0 right-0 h-1.5 sm:h-2 brand-gradient z-20"></div>
                        <div className="absolute top-3 left-1/2 -translate-x-1/2 w-12 h-1.5 bg-slate-300 dark:bg-slate-600 rounded-full sm:hidden z-20"></div>
                        <button onClick={onBack} className="absolute top-4 sm:top-5 right-4 sm:right-5 p-2.5 sm:p-3 text-slate-400 hover:text-brand bg-slate-50/50 dark:bg-black/20 hover:bg-slate-100 dark:hover:bg-white/10 backdrop-blur-md transition-all z-20 rounded-full shadow-sm hover:shadow-md btn-interactive"><Icon name="x" size={16} /></button>
                        
                        <div className="p-5 sm:p-8 pt-8 sm:pt-8 pb-4 sm:pb-5 flex items-start gap-4 shrink-0">
                            <div className="p-3 bg-brand/10 dark:bg-brand/20 rounded-2xl shrink-0 shadow-inner hidden sm:block"><Icon name="shield-check" size={32} className="text-brand" /></div>
                            <div className="w-full pr-8 sm:pr-0">
                                <div className="inline-flex items-center gap-1.5 px-2.5 py-1 bg-slate-100 dark:bg-white/10 text-slate-600 dark:text-slate-300 text-[10px] font-black tracking-widest uppercase rounded-lg mb-1.5 shadow-sm">Privacy Policy</div>
                                <h2 className="text-xl sm:text-3xl font-black text-slate-800 dark:text-white leading-tight">นโยบายความยินยอม (PDPA)</h2>
                                <p className="text-brand dark:text-brandLight text-xs sm:text-sm mt-1 font-semibold">เพื่อสิทธิประโยชน์ ความปลอดภัย และการดูแลอย่างใกล้ชิด</p>
                            </div>
                        </div>
                        
                        <div className="p-5 sm:p-8 overflow-y-auto custom-scrollbar flex-1 bg-slate-50/50 dark:bg-black/20">
                            <p className="text-slate-600 dark:text-slate-300 text-sm mb-5 leading-relaxed">คณะเทคโนโลยีดิจิทัล ให้ความสำคัญอย่างยิ่งกับการคุ้มครองข้อมูลส่วนบุคคลของท่าน ตามพระราชบัญญัติคุ้มครองข้อมูลส่วนบุคคล พ.ศ. 2562 เรามีความจำเป็นต้องจัดเก็บและประมวลผลข้อมูลของท่านเพื่อใช้ในกิจกรรม ดังรายละเอียดต่อไปนี้:</p>
                            <div className="grid grid-cols-1 sm:grid-cols-3 gap-3 sm:gap-4 mb-5">
                                <div className="bg-white dark:bg-zinc-800/80 p-4 sm:p-5 rounded-2xl shadow-sm text-left">
                                    <div className="w-10 h-10 mb-3 bg-blue-50 dark:bg-blue-500/10 text-blue-600 rounded-xl flex items-center justify-center"><Icon name="user" size={18}/></div>
                                    <h4 className="font-bold text-slate-800 dark:text-white text-sm mb-1">ข้อมูลส่วนตัวเบื้องต้น</h4><p className="text-[11px] sm:text-xs text-slate-500 dark:text-slate-400">ชื่อ, รหัส นศ., สาขา, เบอร์โทร เพื่อใช้ตรวจสอบสิทธิ์และประสานงาน</p>
                                </div>
                                <div className="bg-white dark:bg-zinc-800/80 p-4 sm:p-5 rounded-2xl shadow-sm text-left">
                                    <div className="w-10 h-10 mb-3 bg-orange-50 dark:bg-orange-500/10 text-orange-600 rounded-xl flex items-center justify-center"><Icon name="pizza" size={18}/></div>
                                    <h4 className="font-bold text-slate-800 dark:text-white text-sm mb-1">ข้อมูลด้านโภชนาการ</h4><p className="text-[11px] sm:text-xs text-slate-500 dark:text-slate-400">ประวัติแพ้อาหาร, อาหารเฉพาะทาง เพื่อจัดเตรียมมื้ออาหารที่ปลอดภัย</p>
                                </div>
                                <div className="bg-white dark:bg-zinc-800/80 p-4 sm:p-5 rounded-2xl shadow-sm text-left">
                                    <div className="w-10 h-10 mb-3 bg-red-50 dark:bg-red-500/10 text-red-600 rounded-xl flex items-center justify-center"><Icon name="heart-pulse" size={18}/></div>
                                    <h4 className="font-bold text-slate-800 dark:text-white text-sm mb-1">ข้อมูลสุขภาพ/การแพทย์</h4><p className="text-[11px] sm:text-xs text-slate-500 dark:text-slate-400">โรคประจำตัว, ประวัติแพ้ยา เพื่อวางแผนปฐมพยาบาลในกรณีฉุกเฉิน</p>
                                </div>
                            </div>
                        </div>
                        <div className="p-5 sm:p-8 shrink-0 pb-6 sm:pb-8">
                            <label className="flex items-center gap-3 cursor-pointer group mb-5 w-full bg-slate-50 dark:bg-white/5 p-4 rounded-xl shadow-sm">
                                <input type="checkbox" checked={isChecked} onChange={e => setIsChecked(e.target.checked)} className="hidden" />
                                <div className={`w-6 h-6 rounded-md border-2 flex items-center justify-center shrink-0 ${isChecked ? 'bg-brand border-brand shadow-sm' : 'border-slate-300 dark:border-slate-600'}`}>{isChecked && <Icon name="check" size={14} className="text-white"/>}</div>
                                <span className="text-xs sm:text-sm font-bold text-slate-700 dark:text-slate-300">ฉันได้อ่านและยินยอมให้ประมวลผลข้อมูลส่วนบุคคลดังกล่าว</span>
                            </label>
                            <div className="flex justify-end gap-3">
                                <button onClick={handleDecline} className="w-full sm:w-auto px-6 py-3.5 rounded-xl bg-slate-100 dark:bg-white/5 text-slate-600 dark:text-slate-400 font-bold btn-interactive text-sm">ไม่ยินยอม</button>
                                <button onClick={() => isChecked ? onAccept() : null} disabled={!isChecked} className={`w-full sm:w-auto px-8 py-3.5 rounded-xl font-bold flex items-center justify-center gap-2 btn-interactive text-sm ${isChecked ? 'brand-gradient text-white shadow-glow-brand' : 'bg-slate-200 dark:bg-white/5 text-slate-400 dark:text-slate-600'}`}><Icon name="check-circle" size={16} /> ยินยอมและขึ้นทะเบียน</button>
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        // ==========================================
        // 📝 Registration Form
        // ==========================================
        function RegistrationForm({ onBack, onSuccess }) {
            const [formData, setFormData] = useState({ FullName: '', StudentID: '', IDCard: '', Major: '', Religion: '', BloodGroup: '', StudentPhone: '', ParentPhone: '', FoodAllergy: '', SpecificDiet: 'ไม่มี', Disease: '', DrugAllergy: '' });
            const [hasFoodAllergy, setHasFoodAllergy] = useState(false);
            const [hasDisease, setHasDisease] = useState(false);
            const [hasDrugAllergy, setHasDrugAllergy] = useState(false);
            const [isSubmitting, setIsSubmitting] = useState(false);

            const handleSubmit = async (e) => {
                e.preventDefault();
                if (!formData.FullName || !formData.StudentID || !formData.Major || !formData.Religion || !formData.BloodGroup || !formData.StudentPhone || !formData.ParentPhone) { Swal.fire({ icon: 'warning', title: 'แจ้งเตือน', text: 'กรุณากรอกข้อมูลที่จำเป็นให้ครบถ้วน', customClass:{popup:'rounded-[2rem] bg-white dark:bg-zinc-900 text-slate-800 dark:text-white'} }); return; }
                if (formData.StudentID.length !== 9) { Swal.fire({ icon: 'warning', title: 'แจ้งเตือน', text: 'รหัสนักศึกษาต้องมี 9 หลัก', customClass:{popup:'rounded-[2rem] bg-white dark:bg-zinc-900 text-slate-800 dark:text-white'} }); return; }
                if (formData.StudentPhone.length !== 10 || formData.ParentPhone.length !== 10) { Swal.fire({ icon: 'warning', title: 'แจ้งเตือน', text: 'เบอร์โทรศัพท์ต้องมี 10 หลัก', customClass:{popup:'rounded-[2rem] bg-white dark:bg-zinc-900 text-slate-800 dark:text-white'} }); return; }
                
                const finalData = { ...formData, FoodAllergy: hasFoodAllergy ? formData.FoodAllergy : 'ไม่แพ้', Disease: hasDisease ? formData.Disease : 'ไม่มี', DrugAllergy: hasDrugAllergy ? formData.DrugAllergy : 'ไม่แพ้' };
                setIsSubmitting(true);
                Swal.fire({ title: 'กรุณารอสักครู่', html: '<p class="text-sm text-slate-500 mt-2">กำลังซิงค์ข้อมูลเข้าสู่ระบบ...</p>', allowOutsideClick: false, didOpen: () => Swal.showLoading(), customClass:{popup:'rounded-[2rem] bg-white dark:bg-zinc-900 text-slate-800 dark:text-white'} });

                try {
                    const res = await submitToAPI('register', finalData);
                    if (res.success) { Swal.close(); onSuccess(); } else { throw new Error(res.message); }
                } catch (err) { Swal.fire({ icon: 'error', title: 'เกิดข้อผิดพลาด', text: err.message, customClass:{popup:'rounded-[2rem] bg-white dark:bg-zinc-900 text-slate-800 dark:text-white'} }); } 
                finally { setIsSubmitting(false); }
            };

            return (
                <div className="max-w-4xl mx-auto animate-fade-in pb-10">
                    <button onClick={onBack} className="flex items-center gap-2 text-slate-500 hover:text-brand font-bold text-sm mb-6 transition-colors px-2 btn-interactive"><Icon name="arrow-left" size={16} /> ย้อนกลับ</button>

                                <InputField label="รหัสประจำตัวประชาชน / Passport" value={formData.IDCard} onChange={v => setFormData({...formData, IDCard: v})} placeholder="13 หลัก" maxLength="20" />
                                <div className="flex flex-col gap-1.5"><label className="text-xs font-bold text-slate-600 dark:text-slate-400 uppercase tracking-widest">ศาสนา <span className="text-red-500">*</span></label><div className="relative"><select value={formData.Religion} onChange={e => setFormData({...formData, Religion: e.target.value})} required className="w-full appearance-none input-modern rounded-xl pl-4 pr-10 py-3.5 text-sm font-semibold shadow-sm cursor-pointer bg-white/80 dark:bg-black/40"><option value="">-- โปรดเลือก --</option>{['พุทธ', 'อิสลาม', 'คริสต์', 'อื่นๆ'].map(r => <option key={r} value={r}>{r}</option>)}</select><div className="absolute right-4 top-1/2 -translate-y-1/2 text-slate-400 pointer-events-none"><Icon name="chevron-down" size={16}/></div></div></div>
                                <div className="flex flex-col gap-1.5"><label className="text-xs font-bold text-slate-600 dark:text-slate-400 uppercase tracking-widest">กรุ๊ปเลือด <span className="text-red-500">*</span></label><div className="relative"><select value={formData.BloodGroup} onChange={e => setFormData({...formData, BloodGroup: e.target.value})} required className="w-full appearance-none input-modern rounded-xl pl-4 pr-10 py-3.5 text-sm font-semibold shadow-sm cursor-pointer bg-white/80 dark:bg-black/40"><option value="">-- โปรดเลือก --</option><option value="A">A</option><option value="B">B</option><option value="O">O</option><option value="AB">AB</option></select><div className="absolute right-4 top-1/2 -translate-y-1/2 text-slate-400 pointer-events-none"><Icon name="chevron-down" size={16}/></div></div></div>
                            </div>
                        </div>

                        <div className="glass-panel p-6 md:p-8 rounded-[2.5rem] border-t-[8px] border-t-emerald-500 border border-slate-200/50 dark:border-white/5 shadow-soft">
                            <SectionHeader icon="phone" title="ข้อมูลการติดต่อ" colorClass="bg-emerald-100 dark:bg-emerald-500/20 text-emerald-600" />
                            <div className="grid grid-cols-1 md:grid-cols-2 gap-5">
                                <InputField label="เบอร์โทรศัพท์นักศึกษา" value={formData.StudentPhone} onChange={v => setFormData({...formData, StudentPhone: v})} placeholder="08xxxxxxxx" numeric required maxLength="10" />
                                <InputField label="เบอร์โทรศัพท์ผู้ปกครอง (ฉุกเฉิน)" value={formData.ParentPhone} onChange={v => setFormData({...formData, ParentPhone: v})} placeholder="08xxxxxxxx" numeric required maxLength="10" />
                            </div>
                        </div>

                        <div className="glass-panel p-6 md:p-8 rounded-[2.5rem] border-t-[8px] border-t-orange-500 border border-slate-200/50 dark:border-white/5 shadow-soft">
                            <SectionHeader icon="pizza" title="ข้อมูลโภชนาการ" colorClass="bg-orange-100 dark:bg-orange-500/20 text-orange-600" />
                            <div className="space-y-6">
                                <div><label className="text-sm font-bold text-slate-700 dark:text-slate-300 mb-3 block">1. อาหารเฉพาะทาง (เลือก 1 ข้อ) <span className="text-red-500">*</span></label><TogglePill options={[{label: 'ไม่มี', value: 'ไม่มี'}, {label: 'ฮาลาล', value: 'ฮาลาล'}, {label: 'มังสวิรัติ', value: 'มังสวิรัติ'}, {label: 'เจ', value: 'เจ'}]} value={formData.SpecificDiet} onChange={v => setFormData({...formData, SpecificDiet: v})} isWarningType={true} /></div>
                                <div className="p-5 bg-orange-50 dark:bg-orange-950/20 border border-orange-100 dark:border-orange-900/30 rounded-2xl">
                                    <label className="text-sm font-bold text-slate-700 dark:text-slate-300 mb-3 block">2. ประวัติการแพ้อาหาร <span className="text-red-500">*</span></label>
                                    <div className="flex gap-4 mb-4">
                                        <label className="flex items-center gap-2 cursor-pointer text-sm font-semibold"><input type="radio" name="foodAllergy" checked={!hasFoodAllergy} onChange={() => setHasFoodAllergy(false)} className="w-4 h-4 text-brand accent-brand" /> ไม่แพ้</label>
                                        <label className="flex items-center gap-2 cursor-pointer text-sm font-semibold text-orange-600 dark:text-orange-400"><input type="radio" name="foodAllergy" checked={hasFoodAllergy} onChange={() => setHasFoodAllergy(true)} className="w-4 h-4 text-brand accent-brand" /> มีประวัติแพ้อาหาร</label>
                                    </div>
                                    {hasFoodAllergy && <InputField label="โปรดระบุอาหารที่แพ้ หรือ อาการ" value={formData.FoodAllergy} onChange={v => setFormData({...formData, FoodAllergy: v})} placeholder="เช่น อาหารทะเล, ถั่วลิสง" required={hasFoodAllergy} />}
                                </div>
                            </div>
                        </div>

                        <div className="glass-panel p-6 md:p-8 rounded-[2.5rem] border-t-[8px] border-t-red-500 border border-slate-200/50 dark:border-white/5 shadow-soft">
                            <SectionHeader icon="heart-pulse" title="ข้อมูลสุขภาพทางการแพทย์" colorClass="bg-red-100 dark:bg-red-500/20 text-red-600" />
                            <div className="space-y-6">
                                <div className="p-5 bg-red-50/50 dark:bg-red-950/20 border border-red-100 dark:border-red-900/30 rounded-2xl">
                                    <label className="text-sm font-bold text-slate-700 dark:text-slate-300 mb-3 block">1. โรคประจำตัว <span className="text-red-500">*</span></label>
                                    <div className="flex gap-4 mb-4">
                                        <label className="flex items-center gap-2 cursor-pointer text-sm font-semibold"><input type="radio" name="disease" checked={!hasDisease} onChange={() => setHasDisease(false)} className="w-4 h-4 accent-red-500" /> ไม่มี</label>
                                        <label className="flex items-center gap-2 cursor-pointer text-sm font-semibold text-red-600 dark:text-red-400"><input type="radio" name="disease" checked={hasDisease} onChange={() => setHasDisease(true)} className="w-4 h-4 accent-red-500" /> มีโรคประจำตัว</label>
                                    </div>
                                    {hasDisease && <InputField label="โปรดระบุโรคประจำตัว" value={formData.Disease} onChange={v => setFormData({...formData, Disease: v})} placeholder="เช่น หอบหืด, ภูมิแพ้" required={hasDisease} />}
                                </div>
                                <div className="p-5 bg-pink-50/50 dark:bg-pink-950/20 border border-pink-100 dark:border-pink-900/30 rounded-2xl">
                                    <label className="text-sm font-bold text-slate-700 dark:text-slate-300 mb-3 block">2. ประวัติการแพ้ยา <span className="text-red-500">*</span></label>
                                    <div className="flex gap-4 mb-4">
                                        <label className="flex items-center gap-2 cursor-pointer text-sm font-semibold"><input type="radio" name="drugAllergy" checked={!hasDrugAllergy} onChange={() => setHasDrugAllergy(false)} className="w-4 h-4 accent-pink-500" /> ไม่เคยแพ้ยา</label>
                                        <label className="flex items-center gap-2 cursor-pointer text-sm font-semibold text-pink-600 dark:text-pink-400"><input type="radio" name="drugAllergy" checked={hasDrugAllergy} onChange={() => setHasDrugAllergy(true)} className="w-4 h-4 accent-pink-500" /> มีประวัติแพ้ยา</label>
                                    </div>
                                    {hasDrugAllergy && <InputField label="โปรดระบุยาที่แพ้ หรือ อาการ" value={formData.DrugAllergy} onChange={v => setFormData({...formData, DrugAllergy: v})} placeholder="เช่น ยาเพนิซิลลิน" required={hasDrugAllergy} />}
                                </div>
                            </div>
                        </div>

                        <div className="pt-4 flex justify-center">
                            <button type="submit" disabled={isSubmitting} className="w-full md:w-auto min-w-[280px] py-4 px-8 brand-gradient text-white rounded-2xl font-black text-lg shadow-glow-brand hover:shadow-lg transform hover:-translate-y-1 transition-all btn-interactive flex items-center justify-center gap-2">
                                {isSubmitting ? <Icon name="loader-2" className="animate-spin" /> : <Icon name="save" />} บันทึกข้อมูล
                            </button>
                        </div>
                    </form>
                </div>
            );
        }

        // ==========================================
        // 🎫 Activity Form 
        // ==========================================
        function ActivityForm({ onBack, onSuccess }) {
            const [step, setStep] = useState(1);
            const [searchID, setSearchID] = useState('');
            const [formData, setFormData] = useState({ ActivityName: '', StudentID: '', FullName: '', Major: '', StudentPhone: '', IDCard: '' });
            const [isSearching, setIsSearching] = useState(false);
            const [isSubmitting, setIsSubmitting] = useState(false);
            const [availableActivities, setAvailableActivities] = useState([]);

            useEffect(() => {
                Papa.parse(`${ACTIVITY_SHEET_CSV_URL}&_cb=${new Date().getTime()}`, {
                    download: true, header: true,
                    complete: (res) => { setAvailableActivities(res.data.filter(r => r.ActivityName && r.Status !== 'CLOSED').map(r => r.ActivityName)); }
                });
            }, []);

            const handleSearch = (e) => {
                e.preventDefault();
                if (!searchID.trim()) { Swal.fire({ icon: 'warning', title: 'แจ้งเตือน', text: 'กรุณากรอกรหัสนักศึกษา หรือ รหัสประจำตัวประชาชน', customClass:{popup:'rounded-[2rem] bg-white dark:bg-zinc-900 text-slate-800 dark:text-white'} }); return; }

                setIsSearching(true);
                
                // ฝั่งลงทะเบียนกิจกรรมดึงจาก Registration69
                Papa.parse(`${REGISTRATION69_CSV_URL}&_cb=${new Date().getTime()}`, {
                    download: true, header: true,
                    complete: (res) => {
                        const validStudents = res.data.filter(r => r.FullName !== 'SYSTEM_ACTIVITY_DEF' && r.BloodGroup !== 'Activity');
                        const searchTerm = searchID.trim().toLowerCase();
                        const found = validStudents.find(row => (row.IDCard && row.IDCard.toString().trim().toLowerCase() === searchTerm) || (row.StudentID && row.StudentID.toString().trim().toLowerCase() === searchTerm));
                        
                        if (found) {
                            setFormData({ ActivityName: '', StudentID: found.StudentID || '', FullName: found.FullName || '', Major: cleanMajor(found.Major) || '', StudentPhone: found.StudentPhone || '', IDCard: found.IDCard || '' });
                            setStep(2); 
                        } else {
                            Swal.fire({ icon: 'error', title: 'ไม่พบข้อมูล', text: 'ไม่พบข้อมูลนักศึกษาที่ตรงกับรหัสที่คุณกรอก กรุณาตรวจสอบอีกครั้ง หรือไปที่เมนู "1. ขึ้นทะเบียนนักศึกษาใหม่" ก่อนครับ', customClass:{popup:'rounded-[2rem] bg-white dark:bg-zinc-900 text-slate-800 dark:text-white'} });
                        }
                        setIsSearching(false);
                    },
                    error: () => { Swal.fire({ icon: 'error', title: 'Error', text: 'การเชื่อมต่อฐานข้อมูลล้มเหลว', customClass:{popup:'rounded-[2rem] bg-white dark:bg-zinc-900 text-slate-800 dark:text-white'} }); setIsSearching(false); }
                });
            };

            const handleSubmit = async (e) => {
                e.preventDefault();
                if (!formData.ActivityName.trim()) { Swal.fire({ icon: 'warning', title: 'แจ้งเตือน', text: 'กรุณาระบุชื่อกิจกรรมที่เข้าร่วม', customClass:{popup:'rounded-[2rem] bg-white dark:bg-zinc-900 text-slate-800 dark:text-white'} }); return; }

                setIsSubmitting(true);
                Swal.fire({ title: 'กรุณารอสักครู่', html: '<p class="text-sm text-slate-500 mt-2">กำลังซิงค์ข้อมูลเข้าสู่ระบบ...</p>', allowOutsideClick: false, didOpen: () => Swal.showLoading(), customClass:{popup:'rounded-[2rem] bg-white dark:bg-zinc-900 text-slate-800 dark:text-white'} });

                try {
                    const payload = { StudentID: formData.StudentID, FullName: formData.FullName, Major: formData.Major, IDCard: formData.IDCard, StudentPhone: formData.StudentPhone, ActivityName: formData.ActivityName };
                    const res = await submitToAPI('log_activity', payload); 
                    if (res.success) { Swal.close(); onSuccess(formData.ActivityName, formData.StudentID); } 
                    else { throw new Error(res.message); }
                } catch (err) {
                    Swal.fire({ icon: 'error', title: 'ไม่สามารถลงทะเบียนได้', text: err.message, customClass:{popup:'rounded-[2rem] bg-white dark:bg-zinc-900 text-slate-800 dark:text-white'} });
                } finally { setIsSubmitting(false); }
            };

            return (
                <div className="max-w-3xl mx-auto animate-fade-in pb-10">
                    <button onClick={step === 1 ? onBack : () => setStep(1)} className="flex items-center gap-2 text-slate-500 hover:text-purple-600 font-bold text-sm mb-6 transition-colors px-2 btn-interactive">
                        <Icon name="arrow-left" size={16} /> {step === 1 ? 'ย้อนกลับ' : 'ค้นหาใหม่'}
                    </button>

                    {step === 1 && (
                        <form onSubmit={handleSearch} className="space-y-6">
                            <div className="glass-panel p-6 md:p-10 rounded-[2.5rem] border-t-[8px] border-t-purple-500 border border-slate-200/50 dark:border-white/5 shadow-soft text-center">
                                <div className="w-20 h-20 bg-purple-100 dark:bg-purple-500/20 text-purple-600 rounded-full flex items-center justify-center mx-auto mb-6 shadow-inner"><Icon name="search" size={40} /></div>
                                <h2 className="text-2xl font-black text-slate-800 dark:text-white mb-2">ค้นหาข้อมูลนักศึกษา</h2>
                                <p className="text-slate-500 dark:text-slate-400 mb-8 font-medium">กรุณากรอกรหัสนักศึกษา, บัตร ปชช.เพื่อดึงข้อมูล</p>
                                <div className="max-w-md mx-auto">
                                    <input type="text" value={searchID} onChange={e => setSearchID(e.target.value)} placeholder="รหัสนักศึกษา / เลขบัตร ปชช." className="w-full input-modern rounded-xl px-4 py-4 text-center font-mono text-lg font-bold shadow-sm mb-6 placeholder-slate-400" maxLength="20" required />
                                    <button type="submit" disabled={isSearching} className="w-full py-4 bg-gradient-to-r from-purple-500 to-indigo-600 text-white rounded-xl font-black text-lg shadow-[0_0_20px_rgba(168,85,247,0.3)] hover:shadow-[0_0_30px_rgba(168,85,247,0.5)] transform hover:-translate-y-1 transition-all btn-interactive flex items-center justify-center gap-2">
                                        {isSearching ? <Icon name="loader-2" className="animate-spin" /> : <Icon name="search" />} ค้นหาข้อมูล
                                    </button>
                                </div>
                            </div>
                        </form>
                    )}

                    {step === 2 && (
                        <form onSubmit={handleSubmit} className="space-y-6 animate-fade-in">
                            <div className="glass-panel p-6 md:p-8 rounded-[2.5rem] border-t-[8px] border-t-purple-500 border border-slate-200/50 dark:border-white/5 shadow-soft">
                                <SectionHeader icon="user-check" title="ยืนยันข้อมูลนักศึกษา" colorClass="bg-purple-100 dark:bg-purple-500/20 text-purple-600" />
                                <div className="bg-slate-50/80 dark:bg-black/20 p-6 md:p-8 rounded-3xl border border-slate-200/60 dark:border-white/10 mb-8 flex flex-col sm:flex-row gap-6 md:gap-8 items-center sm:items-start shadow-inner relative overflow-hidden">
                                    <div className="absolute top-0 right-0 p-6 opacity-[0.03] text-purple-500 pointer-events-none transform translate-x-4 -translate-y-4"><Icon name="user-check" size={150} /></div>
                                    <div className="w-24 h-24 bg-gradient-to-br from-purple-100 to-indigo-100 dark:from-purple-900/40 dark:to-indigo-900/40 rounded-full flex items-center justify-center text-purple-600 dark:text-purple-400 shrink-0 border border-white dark:border-white/5 shadow-md relative z-10"><Icon name="user" size={48} /></div>
                                    <div className="flex-1 text-center sm:text-left relative z-10 w-full">
                                        <h3 className="text-2xl font-black text-slate-800 dark:text-white mb-2">{formData.FullName}</h3>
                                        <div className="grid grid-cols-1 sm:grid-cols-2 gap-3 md:gap-4 mt-4">
                                            <div className="bg-white dark:bg-zinc-800/80 p-3 rounded-xl border border-slate-100 dark:border-white/5 shadow-sm text-left"><p className="text-[10px] font-bold uppercase tracking-widest text-slate-400 mb-1">รหัสนักศึกษา</p><p className="font-mono font-bold text-brand dark:text-brandLight">{formData.StudentID || '-'}</p></div>
                                            <div className="bg-white dark:bg-zinc-800/80 p-3 rounded-xl border border-slate-100 dark:border-white/5 shadow-sm text-left"><p className="text-[10px] font-bold uppercase tracking-widest text-slate-400 mb-1">รหัสประจำตัว ปชช. / Passport</p><p className="font-mono font-bold text-slate-700 dark:text-slate-300">{formData.IDCard || '-'}</p></div>
                                        </div>
                                        <div className="flex flex-wrap gap-2 justify-center sm:justify-start mt-4">
                                            <span className="bg-indigo-50 text-indigo-700 dark:bg-indigo-500/20 dark:text-indigo-300 px-3 py-1.5 rounded-lg text-xs font-bold border border-indigo-100 dark:border-indigo-500/30 flex items-center gap-1.5 shadow-sm"><Icon name="graduation-cap" size={12}/> {formData.Major}</span>
                                        </div>
                                    </div>
                                </div>

                                <div className="space-y-5 border-t border-slate-200 dark:border-white/10 pt-6">
                                    <div className="flex flex-col gap-1.5 w-full">
                                        <label className="text-xs font-bold text-slate-600 dark:text-slate-400 uppercase tracking-widest">ชื่อกิจกรรมที่เข้าร่วม <span className="text-red-500">*</span></label>
                                        {availableActivities.length > 0 ? (
                                            <div className="relative">
                                                <select value={formData.ActivityName} onChange={e => setFormData({...formData, ActivityName: e.target.value})} required className="w-full appearance-none input-modern rounded-xl pl-4 pr-10 py-3.5 text-sm font-semibold shadow-sm cursor-pointer bg-white/80 dark:bg-black/40">
                                                    <option value="">-- โปรดเลือก --</option>
                                                    {availableActivities.map((act, i) => <option key={i} value={act}>{act}</option>)}
                                                </select>
                                                <div className="absolute right-4 top-1/2 -translate-y-1/2 text-slate-400 pointer-events-none"><Icon name="chevron-down" size={16}/></div>
                                            </div>
                                        ) : (
                                            <div className="text-center p-4 bg-red-50 dark:bg-red-900/20 border border-red-200 dark:border-red-800/50 rounded-xl text-red-600 dark:text-red-400 font-bold text-sm">ไม่มีกิจกรรมที่เปิดให้ลงทะเบียนในขณะนี้</div>
                                        )}
                                    </div>
                                </div>
                            </div>
                            <div className="pt-4 flex justify-center">
                                <button type="submit" disabled={isSubmitting || availableActivities.length === 0} className={`w-full md:w-auto min-w-[280px] py-4 px-8 rounded-2xl font-black text-lg transition-all btn-interactive flex items-center justify-center gap-2 ${availableActivities.length === 0 ? 'bg-slate-300 dark:bg-slate-700 text-slate-500 cursor-not-allowed' : 'bg-gradient-to-r from-purple-500 to-indigo-600 text-white shadow-[0_0_25px_rgba(168,85,247,0.3)] hover:shadow-[0_0_35px_rgba(168,85,247,0.5)] transform hover:-translate-y-1'}`}>
                                    {isSubmitting ? <Icon name="loader-2" className="animate-spin" /> : <Icon name="check-circle" />} ยืนยันการลงทะเบียนกิจกรรม
                                </button>
                            </div>
                        </form>
                    )}
                </div>
            );
        }

        // ==========================================
        // 📊 แบบประเมิน SurveyForm (13 ข้อ)
        // ==========================================
        function SurveyForm({ onBack, onSuccess, activityName, studentID }) {
            const { isDarkMode } = useContext(AppContext);
            const [ratings, setRatings] = useState({ 
                q1_1: 0, q1_2: 0, q1_3: 0, q1_4: 0,
                q2_1: 0, q2_2: 0, q2_3: 0, q2_4: 0,
                q3_1: 0, q3_2: 0, q3_3: 0, q3_4: 0, q3_5: 0
            });
            const [comment, setComment] = useState('');
            const [isSubmitting, setIsSubmitting] = useState(false);

            const surveySections = [
                {
                    title: "ส่วนที่ 1: กระบวนการ ขั้นตอนการให้บริการ",

            const RatingStars = ({ qId }) => {
                return (

            const handleSubmit = async (e) => {
                e.preventDefault();
                const allAnswered = Object.values(ratings).every(val => val > 0);
                if (!allAnswered) {
                    Swal.fire({ icon: 'warning', title: 'กรุณาประเมินให้ครบ', text: 'โปรดให้คะแนนความพึงพอใจครบทั้ง 13 ข้อก่อนกดยืนยันครับ', customClass:{popup:'rounded-[2rem] bg-white dark:bg-zinc-900 text-slate-800 dark:text-white'} });
                    return;
                }

                setIsSubmitting(true);
                Swal.fire({ title: 'กรุณารอสักครู่', html: '<p class="text-sm text-slate-500 mt-2">กำลังซิงค์ข้อมูลประเมินผลเข้าสู่ระบบ...</p>', allowOutsideClick: false, didOpen: () => Swal.showLoading(), customClass:{popup:'rounded-[2rem] bg-white dark:bg-zinc-900 text-slate-800 dark:text-white'} });
                try {
                    const res = await submitToAPI('save_survey', { 
                        ActivityName: activityName,

                        ...ratings,

                    if (res.success) { Swal.close(); onSuccess(); }

                            <Icon name="clipboard-check" size={40} />
                            <div className="absolute -top-2 -right-2 flex h-6 w-6">
                                <span className="animate-ping absolute inline-flex h-full w-full rounded-full bg-purple-400 opacity-75"></span>

                        <div className="inline-flex items-center gap-2 px-4 py-2 bg-slate-100 dark:bg-white/5 rounded-xl border border-slate-200 dark:border-white/10 shadow-inner">
                            <Icon name="tag" size={16} className="text-purple-500" />

                                <div className="flex items-center gap-4 mb-8 relative z-10 border-b border-slate-200/50 dark:border-white/10 pb-5">
                                    <div className={`p-3.5 rounded-2xl shadow-inner ${section.headerBg} ${section.iconColor}`}><Icon name={section.icon} size={24}/></div>
                                    <h3 className="text-xl sm:text-2xl font-black text-slate-800 dark:text-white tracking-tight leading-none">{section.title}</h3>
                                </div>

                                <div className="space-y-5 relative z-10">
                                    {section.questions.map(q => (
                                        <div key={q.id} className={`${section.bg} p-6 sm:p-8 rounded-3xl border border-white/50 dark:border-white/5 transition-all shadow-[0_4px_20px_-5px_rgba(0,0,0,0.05)] hover:shadow-[0_8px_30px_-5px_rgba(0,0,0,0.08)]`}>
                                            <p className="text-base sm:text-lg font-bold text-slate-800 dark:text-slate-100 leading-relaxed mb-1">{q.text}</p>
                                            <RatingStars qId={q.id} />
                                        </div>

                        <div className="glass-panel p-6 md:p-8 rounded-[2.5rem] shadow-soft border border-slate-200/50 dark:border-white/5">

                                <div className="p-3.5 rounded-2xl shadow-inner bg-slate-100 dark:bg-white/10 text-slate-500 dark:text-slate-300"><Icon name="message-square" size={24}/></div>
                                <h3 className="text-xl sm:text-2xl font-black text-slate-800 dark:text-white tracking-tight leading-none">ส่วนที่ 4: ข้อเสนอแนะ (คำถามปลายเปิด)</h3>
                            </div>
                            <InputField label="ข้อเสนอแนะเพิ่มเติม (เช่น สิ่งที่ประทับใจ, สิ่งที่ควรปรับปรุงในครั้งต่อไป, หรือหัวข้อที่อยากให้จัดในอนาคต)" value={comment} onChange={v => setComment(v)} placeholder="พิมพ์ข้อเสนอแนะของท่านที่นี่..." rows={5} />
                        </div>

                        <div className="pt-8 flex justify-center sticky bottom-6 z-40">
                            <div className="bg-white/80 dark:bg-zinc-900/80 backdrop-blur-xl p-2 rounded-[2rem] shadow-[0_20px_40px_-10px_rgba(0,0,0,0.2)] border border-slate-200/50 dark:border-white/10 w-full md:w-auto">
                                <button type="submit" disabled={isSubmitting} className="w-full md:w-auto min-w-[320px] py-4 px-10 bg-gradient-to-r from-purple-500 to-indigo-600 text-white rounded-3xl font-black text-xl shadow-[0_0_25px_rgba(168,85,247,0.3)] hover:shadow-[0_0_35px_rgba(168,85,247,0.5)] transform hover:-translate-y-1 transition-all btn-interactive flex items-center justify-center gap-3">
                                    {isSubmitting ? <Icon name="loader-2" className="animate-spin" /> : <Icon name="send" size={24} />} 
                                    ส่งแบบประเมินผล
                                </button>
                            </div>
                        </div>
                    </form>
                </div>
            );
        }

        // ==========================================
        // ✅ Success View
        // ==========================================
        function SuccessView({ onHome }) {
            return (
                <div className="flex items-center justify-center min-h-[80vh] p-4 animate-fade-in">
                    <div className="glass-panel p-8 md:p-12 rounded-[3rem] text-center max-w-md w-full animate-slide-up shadow-2xl border-t-8 border-t-emerald-500">
                        <div className="w-24 h-24 bg-emerald-100 dark:bg-emerald-500/20 text-emerald-500 rounded-full flex items-center justify-center mx-auto mb-6 shadow-inner relative">
                            <Icon name="check-circle" size={48} className="relative z-10" />
                            <div className="absolute inset-0 bg-emerald-400 rounded-full blur-xl opacity-30 animate-pulse"></div>
                        </div>
                        <h2 className="text-3xl font-black text-slate-800 dark:text-white mb-3 tracking-tight">ทำรายการสำเร็จ!</h2>
